mi><\/mfrac><\/mrow>","定义式，任何运动都适用"],["用平均速度求位移","<mrow><mi>x<\/mi><mo>=<\/mo><mrow><mover accent=\"true\"><mi>v<\/mi><mo>¯<\/mo><\/mover>&#x22C5;<mi>t<\/mi><\/mrow><\/mrow>","任何运动都适用，等价于定义式的移项"]],[["x","位移（矢量，起点指向终点的有向线段）","m"],["s<sub>路<\/sub>","路程（标量，实际走过的轨迹长度）","m"],["t","所用时间","s"],["<span style=\"text-decoration:overline\">v<\/span>","平均速度（矢量）","m/s"],["v<sub>速率<\/sub>","平均速率（标量）","m/s"]],[["把平均速度写成「路程 ÷ 时间」","只有在单向直线运动中，路程和位移的大小才恰好相等，这时看不出问题。一旦运动折返，两者立刻分家：往返回到原点时位移为 0，平均速度应为 0，用路程算却会得到 10 m/s。"],["把平均速率写成「位移 ÷ 时间」","上一条的镜像错误。把位移代进速率的定义，往返回到原点时会算出平均速率为 0，等于说「他以 0 的速度跑完了一圈」。"]],"位移只关心「从哪到哪」，是矢量；路程关心「一共走了多远」，是标量。所以平均速度完全由起点和终点决定，与中间怎么走无关；平均速率则必须把走过的每一段都算上。日常口语里说的「速度」多半指的是平均速率，这正是最容易出错的地方——回到原点的运动最能说明问题：位移为 0，路程不为 0，于是平均速度为 0 而平均速率不为 0。",["平均速度是「等效」出来的：把整段运动换成一个匀速运动，要求它在相同时间内产生相同的位移，那个匀速运动的速度就是这整段的平均速度。","因此平均速度只由位移和时间决定 —— 中间加速、减速、折返，一概不影响。","平均速率的定义完全平行，只是把位移换成路程。","回到原点的运动最能说明差别：位移为 0，所以平均速度为 0；路程不为 0，所以平均速率不为 0。"],["某同学沿周长 400 m 的环形跑道跑完一整圈，用时 80 s。求这段时间内他的平均速度和平均速率。",["跑完整整一圈后回到出发点，所以位移 x = 0。","平均速度 v̄ = x / t = 0 / 80 = 0 m/s。","路程等于跑道周长，s = 400 m。","平均速率 = s / t = 400 / 80 = 5 m/s。"],"平均速度 0 m/s；平均速率 5 m/s。"],[],["kine-02","exp-07"],["概念","矢量与标量","位移","路程"],0,""],["kine-02","加速度","加速度是速度的变化量与发生这一变化所用时间的比值，a = Δv / t = (v − v₀) / t。",[["加速度的定义式","<mrow><mi>a<\/mi><mo>=<\/mo><mfrac><mrow><mi>v<\/mi><mo>−<\/mo><msub><mi>v<\/mi><mn>0<\/mn><\/msub><\/mrow><mi>t<\/mi><\/mfrac><\/mrow>","定义式，任何运动都适用"],["速度变化量","<mrow><mi>Δ<\/mi><mi>v<\/mi><mo>=<\/mo><mrow><mi>v<\/mi><mo>−<\/mo><msub><mi>v<\/mi><mn>0<\/mn><\/msub><\/mrow><\/mrow>","定义式"]],[["a","加速度（矢量）","m/s²"],["v<sub>0<\/sub>","初速度","m/s"],["v","末速度","m/s"],["t","速度由 v₀ 变为 v 所用的时间","s"],["Δv","速度的变化量，Δv = v − v₀（矢量）","m/s"]],[["把加速度定义式记成 a = v / t（漏掉初速度）","只有当初速度为零时，v / t 才恰好等于加速度。它和正确式子的量纲完全一样（都是 m/s²），所以量纲检查抓不到 —— 必须代入具体数字才暴露：匀加速情境中 14 ÷ 4 = 3.5 m/s²，而正确答案是 3 m/s²。"],["把定义式里的除法记成乘法，写成 a = Δv · t","加速度是「单位时间内的速度变化」，所以是除以时间。写成乘以时间后量纲立刻从 m/s² 变成 m/s，量纲检查当场报错。"],["以为加速度的方向就是物体运动的方向","这条属于概念性错误，它不体现为「哪个公式写错了」，所以任何公式类检查都碰不到它 —— 必须由人工审。典型反例：刹车时加速度与运动方向相反；竖直上抛运动在最高点速度为零、加速度却仍向下且等于 g。明确标出来，是为了不把「自动检查通过」误当成「内容一定没问题」。"]],"加速度是高中物理第一个「反直觉」的物理量。速度大不代表加速度大：高速匀速行驶的列车加速度为 0；速度小也不代表加速度小：刚起步的赛车速度只有几米每秒，加速度却极大。更要紧的是符号——加速度为负只说明它与规定的正方向相反，物体可能是在减速，也可能是在负方向加速，必须结合速度的方向一起判断。",["速度的变化有快有慢。为了让「快慢」可比，取比值：把速度变化量除以所用时间，得到单位时间内的速度变化。","Δv = v − v₀ 是矢量差，不是大小相减。直线运动中它自动退化成带正负号的代数差，负号表示方向与正方向相反。","把定义式移项，得到 v = v₀ + at —— 这就是下一节要用的速度公式。"],["一辆汽车以 20 m/s 的速度行驶，司机看到红灯后开始刹车，经过 3 s 速度降为 8 m/s。求这段时间内汽车的速度变化量和加速度。",["取初速度方向为正方向，则 v₀ = 20 m/s，v = 8 m/s，t = 3 s。","速度变化量 Δv = v − v₀ = 8 − 20 = −12 m/s，负号表示速度变化量方向与初速度相反。","加速度 a = Δv / t = −12 / 3 = −4 m/s²，负号表示加速度方向与初速度相反，即汽车在做减速运动。","加速度的大小为 4 m/s²。"],"Δv = −12 m/s；a = −4 m/s²（大小为 4 m/s²，方向与初速度相反）。"],["kine-01"],["kine-03","exp-02"],["概念","矢量","加速度"],0,""],["kine-03","匀变速直线运动的速度公式","v = v₀ + a t。",[["速度公式","<mrow><mi>v<\/mi><mo>=<\/mo><mrow><msub><mi>v<\/mi><mn>0<\/mn><\/msub><mo>+<\/mo><mrow><mi>a<\/mi>&#x22C5;<mi>t<\/mi><\/mrow><\/mrow><\/mrow>","匀变速直线运动（加速度恒定且不为零）"],["由末速度反推初速度","<mrow><msub><mi>v<\/mi><mn>0<\/mn><\/msub><mo>=<\/mo><mrow><mi>v<\/mi><mo>−<\/mo><mrow><mi>a<\/mi>&#x22C5;<mi>t<\/mi><\/mrow><\/mrow><\/mrow>","移项所得，用法同上"]],[["v","末速度（t 时刻的速度）","m/s"],["v<sub>0<\/sub>","初速度","m/s"],["a","加速度（恒定，减速时取负）","m/s²"],["t","运动时间","s"],["x","这段时间内的位移","m"]],[["把位移公式中的 ½ 误带到速度公式，写成 v = v₀ + ½at","速度变化量是 a·t，没有二分之一。错误式与正确式量纲完全相同，量纲检查无法发现；代入匀加速情境会得到 8 m/s，而正确末速度是 14 m/s。"],["把 a·t 记成 a / t，写成 v = v₀ + a/t","漏掉了定义式移项时的那次乘法。写成除法之后 a/t 的量纲变成 m/s³，与 v₀ 的 m/s 根本加不起来，量纲检查直接报错——这是被最早拦住的一类错误。"],["刹车时把 a 当成正的代进去","刹车过程中加速度与初速度反向，取正号会算出「越刹越快」。校验时把正确规律写进去（刹车时时间越长末速度越小），错写法立刻违背这条规律，于是被判为不通过。"],["刹车问题里直接把超过停车时刻的时间代进去算末速度","汽车在 v₀ / |a| = 20 / 4 = 5 s 时就已经停住，之后不再运动。把 8 s 代进去会得到 −12 m/s —— 一个不可能出现的负速度。校验时加一条「末速度不能小于零」的下界，这种超范围代值当场被拦住。"]],"这条式子是加速度定义的直接移项，但要真正用好它有一个前提：a 必须在整段时间内保持不变。现实中最常见的不满足情形就是刹车——汽车停住之后就不再运动，而公式不会自动停下来。所以刹车类问题一定要先算「车什么时候停」，再判断所给时间有没有超出这个范围。",["从加速度定义式出发：a = (v − v₀) / t。","两边同乘 t：a t = v − v₀。","把 v₀ 移到左边：v = v₀ + a t。","整个过程只用了一次移项，所以这条式子的适用范围和加速度定义式完全一样 —— 加速度恒定。"],["一辆汽车以 20 m/s 匀速行驶，司机发现前方有障碍物后以 4 m/s² 的加速度刹车。求刹车后 3 s 末和 8 s 末汽车的速度。",["取初速度方向为正方向，则 v₀ = 20 m/s，a = −4 m/s²。","先判断汽车何时停止：由 v = v₀ + a t 令 v = 0，得 t = v₀ / |a| = 20 / 4 = 5 s。","3 s 末：v = 20 + (−4)×3 = 8 m/s。","8 s 末：8 s 已经超过 5 s，汽车在 5 s 时就已停住，之后保持静止，所以 8 s 末的速度为 0。","如果不管这一层，直接代入会算出 20 + (−4)×8 = −12 m/s —— 这就是典型的刹车陷阱。"],"3 s 末为 8 m/s；8 s 末为 0（汽车在 5 s 时已经停止）。"],["kine-02"],["kine-04","exp-01"],["公式","匀变速","刹车问题"],0,""],["kine-04","匀变速直线运动的位移公式","x = v₀ t + ½ a t²。",[["位移公式","<mrow><mi>x<\/mi><mo>=<\/mo><mrow><mrow><msub><mi>v<\/mi><mn>0<\/mn><\/msub>&#x22C5;<mi>t<\/mi><\/mrow><mo>+<\/mo><mfrac><mrow><mi>a<\/mi>&#x22C5;<msup><mi>t<\/mi><mn>2<\/mn><\/msup><\/mrow><mn>2<\/mn><\/mfrac><\/mrow><\/mrow>","匀变速直线运动"]],[["x","位移","m"],["v<sub>0<\/sub>","初速度","m/s"],["v","末速度","m/s"],["a","加速度（恒定）","m/s²"],["t","运动时间","s"]],[["把第二项记成 a·t²，漏掉 ½","★ 这条错写法的量纲完全正确（m/s² · s² 就是 m），量纲检查抓不到它。必须靠数值代入：9.8 × 9 = 88.2，而正确答案是 44.1，整整差一倍。这个例子说明为什么校验不能只靠一种手段 —— 光量纲对，公式照样可以是错的。"],["把第二项记成 ½·a·t（t 漏了平方）","多写一个 ½、少写一个平方，是一对容易互相代替的错误。这一次漏掉的是平方，第二项的量纲变成 m/s，与第一项的 m 加不起来，量纲检查立刻拦住。"]],"这条式子是把速度—时间图象下方的面积算出来的结果。第一项 v₀t 是图象里那个矩形，第二项 ½at² 是上面那个三角形。理解了这一层，就能自己写出来，不需要死记——也能立刻看出为什么第二项里带一个 ½：三角形面积是底乘高除以二。",["画出速度—时间图象：初速度 v₀ 是纵轴截距，加速度 a 是斜率，图象是一条直线。","位移等于图象下方与横轴围成的面积。这块面积是一个梯形。","把梯形拆成下面一个矩形和上面一个三角形：矩形面积 = v₀ t。","三角形的高是速度增量 a t，底是 t，所以面积 = ½ · t · (a t) = ½ a t²。","两段相加：x = v₀ t + ½ a t²。"],["一辆汽车以 2 m/s 的初速度开始匀加速行驶，加速度为 3 m/s²。求它在 4 s 内的位移。",["已知 v₀ = 2 m/s，a = 3 m/s²，t = 4 s。","代入位移公式：x = v₀t + ½at²。","先算第一项：v₀t = 2 × 4 = 8 m。","再算第二项：½at² = 0.5 × 3 × 16 = 24 m。","相加得 x = 8 + 24 = 32 m。"],"位移为 32 m。"],["kine-03"],["kine-05","mdl-05"],["公式","匀变速","图象法"],0,""],["kine-05","速度与位移的关系","v² = v₀² + 2 a x。",[["速度与位移的关系","<mrow><msup><mi>v<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><mrow><msup><msub><mi>v<\/mi><mn>0<\/mn><\/msub><mn>2<\/mn><\/msup><mo>+<\/mo><mrow><mrow><mn>2<\/mn>&#x2062;<mi>a<\/mi><\/mrow>&#x22C5;<mi>x<\/mi><\/mrow><\/mrow><\/mrow>","匀变速直线运动，尤其适合「不给时间」的题目"]],[["v","末速度","m/s"],["v<sub>0<\/sub>","初速度","m/s"],["a","加速度（恒定）","m/s²"],["x","位移","m"],["t","运动时间","s"]],[["漏掉系数 2，写成 v² = v₀² + ax","★ 又是量纲拦不住的一类：两边都是 m²/s²，完全正确。数值代入才暴露：√(4 + 96) = 10 m/s，而正确答案是 14 m/s。到这一章为止，已经出现三次「量纲对但公式错」，这不是巧合，而是必须配多种校验手段的直接理由。"],["把 v² = v₀² + 2ax 记成 v = v₀ + 2ax（漏掉平方与开方）","右边 2ax 的量纲是 m²/s²，与 v₀ 的 m/s 不是同一类量，量纲检查当场拦住。"]],"它的价值在于「消去时间」。凡是题目既不给时间、也不问时间的匀变速问题，用这条式子通常一步到位，而不必绕道先算时间。它的推导方式是把速度公式和位移公式里的 t 消掉——这也是它和另外两条公式必然自洽的原因，校验器正好可以利用这一点做交叉验证。",["从速度公式出发：v = v₀ + a t，把 t 单独解出来：t = (v − v₀) / a。","代入位移公式 x = v₀ t + ½ a t²。","代入后展开并通分整理，v₀ 的一次项会互相抵消。","两边同乘 2a，得到 2 a x = v² − v₀²，即 v² = v₀² + 2 a x。","因为是用另外两条公式推出来的，所以凡是这三条公式同时适用的问题，它们给出的答案必然一致 —— 校验器就是拿这一点来互相验算的。"],["一架飞机在跑道上以 2 m/s 的初速度匀加速滑行，加速度为 3 m/s²。求它滑行 32 m 后的速度。",["已知 v₀ = 2 m/s，a = 3 m/s²，x = 32 m，题目不给时间也不问时间。","选用不含时间的速度位移关系：v² = v₀² + 2ax。","代入：v² = 2² + 2 × 3 × 32 = 4 + 192 = 196。","开平方得 v = 14 m/s（速度取正，方向与运动方向相同）。"],"滑行 32 m 后的速度为 14 m/s。"],["kine-04"],["kine-06","exp-03"],["公式","匀变速","消去时间"],0,""],["kine-06","匀变速运动的平均速度、中间时刻速度与中间位置速度","匀变速直线运动有三个相关的速度：全程平均速度 v̄ = (v₀ + v) / 2；中间时刻的瞬时速度 v(t/2) = (v₀ + v) / 2，与平均速度相等；中间位置的瞬时速度 v(x/2) = √[(v₀² + v²) / 2]，它总是不小于前两者。",[["匀变速运动的平均速度","<mrow><mover accent=\"true\"><mi>v<\/mi><mo>¯<\/mo><\/mover><mo>=<\/mo><mfrac><mrow><msub><mi>v<\/mi><mn>0<\/mn><\/msub><mo>+<\/mo><mi>v<\/mi><\/mrow><mn>2<\/mn><\/mfrac><\/mrow>","只适用于匀变速直线运动 —— 变加速运动不成立"],["用平均速度求位移","<mrow><mi>x<\/mi><mo>=<\/mo><mrow><mover accent=\"true\"><mi>v<\/mi><mo>¯<\/mo><\/mover>&#x22C5;<mi>t<\/mi><\/mrow><\/mrow>","匀变速直线运动，等价于把平均速度当成匀速来算"],["中间时刻的瞬时速度","<mrow><msub><mi>v<\/mi><mi mathvariant=\"normal\">t/2<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>v<\/mi><mn>0<\/mn><\/msub><mo>+<\/mo><mi>v<\/mi><\/mrow><mn>2<\/mn><\/mfrac><\/mrow>","匀变速直线运动"],["中间位置的瞬时速度","<mrow><msub><mi>v<\/mi><mi mathvariant=\"normal\">x/2<\/mi><\/msub><mo>=<\/mo><msqrt><mfrac><mrow><msup><msub><mi>v<\/mi><mn>0<\/mn><\/msub><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>v<\/mi><mn>2<\/mn><\/msup><\/mrow><mn>2<\/mn><\/mfrac><\/msqrt><\/mrow>","匀变速直线运动"]],[["<span style=\"text-decoration:overline\">v<\/span>","全程平均速度","m/s"],["v<sub>t/2<\/sub>","中间时刻的瞬时速度","m/s"],["v<sub>x/2<\/sub>","中间位置的瞬时速度","m/s"],["v<sub>0<\/sub>","初速度","m/s"],["v","末速度","m/s"],["a","加速度（恒定）","m/s²"],["t","全程时间","s"],["x","全程位移","m"]],[["把根号范围写错，记成 v(x/2) = √(v₀² + v²) / 2","正确式是先把 v₀² + v² 除以 2，再整体开方；把除以 2 放到根号外会少算一个 √2 倍。两式量纲完全相同，只能靠数值代入发现：错误式约为 7.071 m/s，正确答案是 10 m/s。"],["以为中间位置的瞬时速度等于全程平均速度","把「中间时刻」和「中间位置」混为一谈。只有中间时刻的速度才等于平均速度；中间位置速度由平方平均数决定，总是更大。校验器直接把这两个值放在一起比对，不相等就判不通过。"],["把 v̄ = (v₀ + v)/2 当成对任何运动都成立的公式","这条式子的成立依赖「速度随时间均匀变化」。变加速运动中它不成立，而「是不是匀变速」这一点无法从公式本身读出来，因此不在自动检查的射程内，标为人工审核。这也是本知识库中第二次明确承认自动化的边界。"]],"这是运动学里最漂亮的一组结论。中间时刻速度恰好等于全程平均速度，意味着求平均速度可以绕开位移和时间，直接用首末速度；而中间位置速度 ≥ 中间时刻速度，则说明「走完一半路程时的速度」总比「用掉一半时间时的速度」来得大——因为匀变速运动在后半程本来就走得更快。三者相等只在匀速运动中成立。",["先证中间时刻速度等于平均速度：把 t/2 代进速度公式，v(t/2) = v₀ + a·t/2。","把 v = v₀ + a t 代入 (v₀ + v)/2，得 (v₀ + v₀ + a t)/2 = v₀ + a t/2。两者完全相同。","再求中间位置速度：对前半段位移 x/2 用速度位移关系，v(x/2)² = v₀² + 2a·(x/2)。","把全程关系 2ax = v² − v₀² 即 a x = (v² − v₀²)/2 代入，整理得 v(x/2)² = (v₀² + v²)/2。","比较两个平方值：中间位置速度的平方减去中间时刻速度的平方，结果为 (v − v₀)² / 4 ≥ 0。","所以中间位置速度总是不小于中间时刻速度，等号仅在 v = v₀（即匀速）时成立。"],["一物体做匀加速直线运动，初速度 2 m/s，末速度 14 m/s，全程位移 32 m。求全程平均速度、中间时刻的瞬时速度和中间位置的瞬时速度。",["全程平均速度 v̄ = (v₀ + v)/2 = (2 + 14)/2 = 8 m/s。","中间时刻的瞬时速度与平均速度相等，也是 8 m/s。也可以验算：由 v² = v₀² + 2ax 得 a = (196 − 4)/(2×32) = 3 m/s²，全程时间 t = (v − v₀)/a = 4 s，代 t/2 = 2 s 得 v = 2 + 3×2 = 8 m/s。","中间位置的瞬时速度 v(x/2) = √[(v₀² + v²)/2] = √[(4 + 196)/2] = √100 = 10 m/s。","可见 10 m/s 大于 8 m/s，符合「中间位置速度不小于中间时刻速度」的结论。"],"平均速度 8 m/s；中间时刻速度 8 m/s；中间位置速度 10 m/s。"],["kine-05"],["kine-07","mdl-24","kine-08"],["推论","匀变速","中间时刻","中间位置"],0,""],["kine-07","自由落体运动","物体只在重力作用下从静止开始下落的运动叫自由落体运动。",[["自由落体的速度公式","<mrow><mi>v<\/mi><mo>=<\/mo><mrow><mi>g<\/mi>&#x22C5;<mi>t<\/mi><\/mrow><\/mrow>","初速度为零、忽略空气阻力"],["自由落体的高度公式","<mrow><mi>h<\/mi><mo>=<\/mo><mfrac><mrow><mi>g<\/mi>&#x22C5;<msup><mi>t<\/mi><mn>2<\/mn><\/msup><\/mrow><mn>2<\/mn><\/mfrac><\/mrow>","初速度为零、忽略空气阻力"],["自由落体的速度位移关系","<mrow><msup><mi>v<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><mrow><mrow><mn>2<\/mn>&#x2062;<mi>g<\/mi><\/mrow>&#x22C5;<mi>h<\/mi><\/mrow><\/mrow>","初速度为零、忽略空气阻力"]],[["h","下落高度","m"],["g","重力加速度","m/s²"],["t","下落时间","s"],["v","落地速度（时刻 t 的速度）","m/s"]],[["把高度公式记成 h = g·t²，漏掉 ½","★ 量纲依旧完全正确（m/s² · s² = m），量纲检查抓不到。数值代入立刻暴露：9.8 × 9 = 88.2 m，而正确答案是 44.1 m，差一倍。这和第四章位移公式的 ½ 是同一个错误，在自由落体里出现得更频繁。"],["以为物体越重下落越快、重的先落地","在没有空气阻力的条件下，所有物体的下落加速度都是同一个 g，与质量无关。日常经验里「羽毛比铁球落得慢」是空气阻力造成的。这条错误不体现为某个公式写错，公式类检查碰不到它，因此明确标为人工审核。"]],"自由落体是匀变速直线运动最具代表性的实例：只要把 v₀ = 0、a = g 代进前面三条公式，整套运动学结论立刻适用。它同时纠正了「重的物体下落得快」这一流传两千年的错误直觉——决定下落快慢的是 g 而不是质量，这个结论需要用「在没有空气阻力的条件下」来限定，而这个条件恰恰是物理学家伽利略当年最难说服别人的地方。",["自由落体的定义已经给出了两个条件：初速度 v₀ = 0，加速度 a = g。","把这两个条件代进速度公式 v = v₀ + a t，得 v = g t。","代进位移公式 x = v₀ t + ½ a t²，并把位移记作下落高度 h，得 h = ½ g t²。","代进速度位移关系 v² = v₀² + 2 a x，得 v² = 2 g h。","所以自由落体不需要另记公式 —— 它只是匀变速直线运动的一个特例。"],["一个物体从高处由静止自由落下，取 g = 9.8 m/s²。求它下落 3 s 末的速度和这 3 s 内下落的高度。",["由静止开始，所以初速度 v₀ = 0，加速度 a = g = 9.8 m/s²。","3 s 末的速度：v = g t = 9.8 × 3 = 29.4 m/s。","3 s 内下落的高度：h = ½ g t² = 0.5 × 9.8 × 9 = 44.1 m。","验算：用 v² = 2gh，√(2 × 9.8 × 44.1) = √864.36 = 29.4 m/s，与上面算出的速度一致。"],"3 s 末速度为 29.4 m/s；下落高度为 44.1 m。"],["kine-06"],["mdl-35"],["公式","自由落体","重力加速度"],0,""],["kine-08","运动的合成与分解：小船渡河","小船相对岸的速度是船相对水的速度与水流速度的矢量和。",[["最短渡河时间","<mrow><msub><mi>t<\/mi><mi mathvariant=\"normal\">min<\/mi><\/msub><mo>=<\/mo><mfrac><mi>d<\/mi><msub><mi>v<\/mi><mi>b<\/mi><\/msub><\/mfrac><\/mrow>","船头垂直河岸，不要求落点正对出发点"],["直达对岸的船头角","<mrow><mi>α<\/mi><mo>=<\/mo><mrow><mi mathvariant=\"normal\">asin<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mfrac><msub><mi>v<\/mi><mi>w<\/mi><\/msub><msub><mi>v<\/mi><mi>b<\/mi><\/msub><\/mfrac><mo>)<\/mo><\/mrow><\/mrow>","船速严格大于水速，船头朝上游"],["直达对岸的横向速度","<mrow><msub><mi>v<\/mi><mi>x<\/mi><\/msub><mo>=<\/mo><msqrt><mrow><msup><msub><mi>v<\/mi><mi>b<\/mi><\/msub><mn>2<\/mn><\/msup><mo>−<\/mo><msup><msub><mi>v<\/mi><mi>w<\/mi><\/msub><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow>","船速严格大于水速且沿岸速度被抵消"],["水流更快时的最小位移","<mrow><msub><mi>s<\/mi><mi mathvariant=\"normal\">min<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><mi>d<\/mi>&#x22C5;<msub><mi>v<\/mi><mi>w<\/mi><\/msub><\/mrow><msub><mi>v<\/mi><mi>b<\/mi><\/msub><\/mfrac><\/mrow>","船速小于水速，合速度沿矢量圆切线；船速等于水速时仅为下确界"]],[["d","河宽","m"],["v<sub>b<\/sub>","船相对水的速度大小","m/s"],["v<sub>w<\/sub>","水流速度大小","m/s"],["t<sub>min<\/sub>","最短渡河时间","s"],["α","船头偏离垂直河岸向上游的角","rad"],["v<sub>x<\/sub>","直达对岸时垂直河岸的速度","m/s"],["s<sub>min<\/sub>","最小位移大小","m"],["t","渡河时间","s"],["v<sub>y<\/sub>","相对岸的沿岸速度","m/s"]],[["把最短时间写成河宽除船速与水速之和","水流沿着河岸，不增加横跨河岸的速度；把互相垂直的分速度直接加成同方向速度，会得到不可能的更短渡河时间。"],["船速等于水速时也宣称可以有限时间正对渡河","完全抵消水流会把全部船速用于朝上游，横跨速度为零；只能无限逼近河宽这个位移下确界，不能真的在有限时间达到。"]],"假设河岸平行、水流均匀且船速大小不变。横跨河岸的分运动与沿岸漂移同时发生，不能把两个时间相加。船速大于水速时可完全抵消沿岸漂移；船速小于水速时不能直达对岸，应用速度矢量圆的切线求最小漂移角。相等的临界情形只有位移下确界为河宽，不能有限时间直达。",["沿岸与垂直河岸取两个坐标轴，先画船速和水速的首尾相接矢量。","要最短时间，令船速全部用于横跨河岸；沿岸仍有水流漂移。","能直达时令船速的上游分量等于水速，剩余横向分量由速度三角形求出。","水速更大时，从速度原点向矢量圆作切线，使相对岸速度与下游方向夹角最大，得到最小位移。"],["河宽120 m，船相对水速度5 m/s，水流3 m/s。分别求最短渡河时间，以及正对对岸渡河的时间。",["最短时间方案船头垂直岸，时间120/5=24 s，落点会顺流漂移。","正对渡河时上游分量为3 m/s，横向速度4 m/s，所以时间120/4=30 s。"],"最短时间24 s；最短位移120 m的方案需30 s。"],["kine-02","kine-06"],["mdl-37","mdl-38"],["小船渡河","合运动","最短时间","最短位移","切线法"],0,""],["kine-09","曲线运动的条件与合力方向","速度非零时，合加速度在垂直于瞬时速度的方向上具有非零分量，会使速度方向改变并使轨迹局部弯曲。",[["正交分速度的合速率","<mrow><mi>v<\/mi><mo>=<\/mo><msqrt><mrow><msup><mi mathvariant=\"normal\">vx<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi mathvariant=\"normal\">vy<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow>",""],["平抛法向加速度","<mrow><mi mathvariant=\"normal\">an<\/mi><mo>=<\/mo><mfrac><mrow><mi>g<\/mi>&#x22C5;<mi mathvariant=\"normal\">vx<\/mi><\/mrow><mi>v<\/mi><\/mfrac><\/mrow>","无空气阻力的平抛，水平速度正且瞬时速率非零。"]],[["v","瞬时速率","m/s"],["vx","水平分速度大小","m/s"],["vy","向下分速度大小","m/s"],["an","法向加速度大小","m/s²"],["g","重力加速度","m/s²"],["h","相对抛出点下降高度","m"]],[["把正交分速度大小直接相加为合速率。","水平4 m/s与向下3 m/s正交，合速率为5 m/s而非7 m/s；向量合成必须保留方向关系。"],["曲线运动的合力在所有时刻都必须垂直速度。","合力只需具有使方向改变的法向分量；同时具有切向分量时速率也会变化，平抛下降阶段即为例子。"]],"速度沿轨迹切线，法向加速度指向轨迹局部凹侧，切向分量改变速率。平抛过程中重力总向下，在最高点速度水平而重力垂直；下落后重力还具有沿速度的切向分量，故速度大小与方向可同时改变。合力仅与速度共线时该瞬间法向分量为零，不能据此断言整个轨迹都是直线；拐点和零速起点需要单独看邻域。下面比较同一平抛的分速度与能量途径。",["正交合成得速率√(16+9)=5 m/s。","重力的法向分量为10×4/5=8 m/s²，余下切向分量改变速率。","速度沿轨迹切线，法向加速度指向轨迹局部凹侧，切向分量改变速率。"],["平抛水平分速度4 m/s，某时向下分速度3 m/s，g取10，求速率与法向加速度。",["正交合成得速率√(16+9)=5 m/s。","重力的法向分量为10×4/5=8 m/s²，余下切向分量改变速率。"],"速率5 m/s，法向加速度8 m/s²。"],["kine-02","kine-08"],["cir-02"],["曲线运动的条件与合力方向","条件与边界","实验与证据"],0,"<section class=\"field learning\"><h4>曲线运动的条件与合力方向：方法与边界<\/h4><p>速度沿轨迹切线，法向加速度指向轨迹局部凹侧，切向分量改变速率。平抛过程中重力总向下，在最高点速度水平而重力垂直；下落后重力还具有沿速度的切向分量，故速度大小与方向可同时改变。合力仅与速度共线时该瞬间法向分量为零，不能据此断言整个轨迹都是直线；拐点和零速起点需要单独看邻域。下面比较同一平抛的分速度与能量途径。<\/p><\/section>"],["dyn-01","弹力与胡克定律","发生弹性形变的物体，会对使它形变的物体产生弹力。",[["胡克定律","<mrow><mi>F<\/mi><mo>=<\/mo><mrow><mi>k<\/mi>&#x22C5;<mi>x<\/mi><\/mrow><\/mrow>","在弹簧的弹性限度内，弹簧的弹力"],["由弹力求形变量","<mrow><mi>x<\/mi><mo>=<\/mo><mfrac><mi>F<\/mi><mi>k<\/mi><\/mfrac><\/mrow>","移项所得，弹性限度内"]],[["F","弹力的大小","N"],["k","劲度系数（弹簧的「软硬」程度）","N/m"],["x","形变量（拉伸或压缩的长度，不是弹簧总长）","m"],["L<sub>0<\/sub>","弹簧原长","m"],["L<sub>总<\/sub>","弹簧形变后的总长度","m"],["m","悬挂物体的质量","kg"],["g","重力加速度","m/s²"]],[["把弹簧形变后的总长度当成形变量，写成 F = kL","胡克定律中的 x 是总长度与原长之差，不是总长度。错误式与正确式量纲完全相同，量纲检查抓不到；本情境中误代 0.15 m 会得到 30 N，正确形变量 0.05 m 对应 10 N。"],["把胡克定律记成 F = k / x（乘法记成除法）","写成除法后 k/x 的量纲变成 N/m²，与力的单位 N 完全不同，量纲检查立刻拦住。"]],"胡克定律里最容易踩的坑是 x —— 它是「形变量」，即弹簧被拉伸或被压缩的长度，是变化量而不是弹簧的总长度。弹簧被拉长到什么程度，弹力就对应到那个程度，跟原长无关。另外要注意它的适用范围：形变必须在这个弹簧的弹性限度内，超过之后就拉不回来，也不再成正比。",["弹簧受拉力 F 时被拉长 x，实验测出两者成正比，比例系数记为 k。","写成等式就是 F = k x。k 越大表示把弹簧拉长同样的长度需要越大的力，即弹簧越硬。","检核量纲：k 的单位是 N/m，与 x 的单位 m 相乘后得到 N，正好是力的单位。"],["一根原长 10 cm 的弹簧，受到 10 N 的拉力时长度变为 15 cm。求这根弹簧的劲度系数。",["形变量是长度变化量，不是总长度：x = 15 cm − 10 cm = 5 cm = 0.05 m。","由胡克定律 F = k x 得 k = F / x。","代入：k = 10 / 0.05 = 200 N/m。"],"劲度系数为 200 N/m。"],[],["dyn-02","exp-08"],["相互作用","弹力","胡克定律"],1,""],["dyn-02","重力","由于地球的吸引而使物体受到的力叫重力，大小 G = m g，方向竖直向下，作用点叫重心。",[["重力的大小","<mrow><mi>G<\/mi><mo>=<\/mo><mrow><mi>m<\/mi>&#x22C5;<mi>g<\/mi><\/mrow><\/mrow>","任何物体，在地球表面附近"]],[["G","重力的大小","N"],["m","物体的质量","kg"],["g","重力加速度（也写作 N/kg）","m/s²"],["a","物体自由落体时的加速度","m/s²"]],[["已使用月球重力加速度后，又把结果额外除以 6","月球情境里的 g = 1.6 m/s² 已经体现了约为地球六分之一，再除以 6 属于重复折算。错误式与正确式量纲完全相同，只能靠数值代入发现：会算成约 0.533 N，而正确值是 3.2 N。"],["把重力写成 G = m / g","写成除法后量纲变成 kg·s²/m，与力的量纲完全不同，量纲检查直接拦住。同时它也会让「月球上重力变大」这种荒谬结论出现，方向检查也能抓到。"],["以为物体越重下落越快、或者说「重力大的物体先落地」","重力确实与质量成正比，但加速度 a = G / m = g 与质量无关，所有物体下落加速度相同。这是第一章自由落体已经纠正过的错误，在这里以「误把重力当加速度」的形式再次出现。属于概念性错误，标注人工审核。"]],"注意 g 的两张面孔：作为自由落体的加速度，它的单位写 m/s²；作为重力的比例系数，它的单位写 N/kg。两者数值相同、物理含义相通，但写成 N/kg 更能体现「每千克受到多少牛的力」。重力的大小只与质量和当地 g 有关，与物体的运动状态、是否被其他力支持都无关——一个在空中自由下落的物体和一个静止放在桌上的物体，受的重力一样大。",["实验证明，在地球表面同一地点，物体受到的重力与它的质量成正比。","把比例系数记为 g，写成等式就是 G = m g。","检核量纲：质量的量纲 M 乘上加速度的量纲 L/T²，得到 M·L/T²，正是力的量纲。","因此 g 既可以看作自由落体的加速度，也可以看作每千克物体受到的重力。"],["一个质量为 2 kg 的物体被带到月球表面，月球表面的重力加速度约为 1.6 N/kg。求它在地球表面和月球表面所受的重力。",["在地球表面：G = m g = 2 × 9.8 = 19.6 N。","在月球表面：G = m g = 2 × 1.6 = 3.2 N。","两处的质量都是 2 kg，没有变化；变化的是重力加速度，所以重力变成了原来的约六分之一。"],"地球表面 19.6 N；月球表面 3.2 N。"],["dyn-01"],["dyn-03","mdl-21"],["相互作用","重力","重力加速度"],1,""],["dyn-03","摩擦力","两个相互接触的物体之间有相对运动趋势或相对运动时，接触面上会产生阻碍相对运动的力。",[["滑动摩擦力","<mrow><mi>f<\/mi><mo>=<\/mo><mrow><mi>μ<\/mi>&#x22C5;<msub><mi>F<\/mi><mi mathvariant=\"normal\">N<\/mi><\/msub><\/mrow><\/mrow>","物体已经发生相对滑动时，才能用这条"],["静止物体的静摩擦力","<mrow><mi>f<\/mi><mo>=<\/mo><mi>F<\/mi><\/mrow>","物体静止时，静摩擦力由平衡条件决定，与正压力无关"]],[["f","摩擦力的大小","N"],["μ","动摩擦因数（无量纲）","—"],["F<sub>N<\/sub>","接触面间的正压力","N"],["F","水平推力（用于求静摩擦力）","N"],["m","水平面上物体的质量","kg"],["g","重力加速度","m/s²"]],[["用静摩擦力公式去算「没被推动」的情形，即认为静摩擦力等于 μF<sub>N<\/sub>","★ 这条错写法的量纲完全正确（两个力相乘再乘纯数，仍是 N），量纲检查抓不到。要抓住它必须靠数值代入：物体被 1 N 的水平力推着却没动，静摩擦力只有 1 N；按公式算却得到 5.88 N —— 那个数其实是最大静摩擦力的量级，不是实际受到的摩擦力。"],["认为摩擦力总是阻碍物体运动，因此摩擦力的方向一定与运动方向相反","滑动摩擦力的确与「相对运动」方向相反，但静摩擦力可以和运动方向相同 —— 例如随传送带一起加速的物体，正是静摩擦力在推它前进。说「阻碍运动方向」不准确，准确说法是「阻碍相对运动（或相对运动趋势）」。这类表述错误不体现为公式写错，标注人工审核。"]],"这里有一条极其重要的分界线：滑动摩擦力可以用公式 f = μ F<sub>N<\/sub> 直接算，而静摩擦力不能。静摩擦力的大小由平衡条件或牛顿第二定律决定——你用力推但没推动，静摩擦力就等于你的推力；推得越用力，它越大，直到超过最大静摩擦力才被推动。所以「静摩擦力等于 μF<sub>N<\/sub>」是一个用起来很顺、但完全错误的说法，本页专门为它设了一道检查。",["滑动摩擦力的方向沿接触面，与相对运动方向相反，大小由实验测定。","实验发现它与接触面间的正压力成正比，比例系数记为 μ，于是有 f = μ F<sub>N<\/sub>。","μ 是一个纯数（无量纲），只由两个接触面的材料与粗糙程度决定，与接触面积无关。","静摩擦力不走这条路径：物体没动，说明受力平衡，静摩擦力必须等于推它的那个力。","所以解静摩擦类问题时，先判断物体动不动，再选公式 —— 顺序错了就会得到荒谬答案。"],["质量为 2 kg 的物体放在水平桌面上，接触面间的动摩擦因数为 0.3，取 g = 9.8 N/kg。先用 1 N 的水平力推它，再用 10 N 的水平力推它（远大于最大静摩擦力）。分别求两种情况下物体受到的摩擦力。",["先算正压力：物体在水平桌面上，竖直方向平衡，所以 F<sub>N<\/sub> = G = m g = 2 × 9.8 = 19.6 N。","先判断物体是否会动。最大静摩擦力约等于滑动摩擦力量级 μF<sub>N<\/sub> = 0.3 × 19.6 = 5.88 N，1 N 远小于它，所以物体保持静止。","第一种情况：静止，用平衡条件，静摩擦力 f = F = 1 N。绝对不能用 μF<sub>N<\/sub> = 5.88 N —— 那只是「最大」静摩擦力。","第二种情况：10 N 大于 5.88 N，物体被推动，用滑动摩擦公式 f = μF<sub>N<\/sub> = 0.3 × 19.6 = 5.88 N。"],"1 N 推力时摩擦力的实际大小是 1 N（静摩擦，物体未动）；10 N 推力时摩擦力是 5.88 N（滑动摩擦）。"],["dyn-02"],["dyn-04","mdl-01","dyn-08"],["相互作用","摩擦力","静摩擦","滑动摩擦"],1,""],["dyn-04","力的合成与分解（正交分解）","求几个力的合力叫力的合成，把合力按某个方向拆成几个分力叫力的分解。",[["水平方向的分力","<mrow><msub><mi>F<\/mi><mi>x<\/mi><\/msub><mo>=<\/mo><mrow><mi>F<\/mi>&#x22C5;<mrow><mi mathvariant=\"normal\">cos<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>θ<\/mi><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","θ 是力与水平方向的夹角"],["竖直方向的分力","<mrow><msub><mi>F<\/mi><mi>y<\/mi><\/msub><mo>=<\/mo><mrow><mi>F<\/mi>&#x22C5;<mrow><mi mathvariant=\"normal\">sin<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>θ<\/mi><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","θ 是力与水平方向的夹角"],["由两个分力求合力","<mrow><mi>F<\/mi><mo>=<\/mo><msqrt><mrow><msup><msub><mi>F<\/mi><mi>x<\/mi><\/msub><mn>2<\/mn><\/msup><mo>+<\/mo><msup><msub><mi>F<\/mi><mi>y<\/mi><\/msub><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow>","两个分力互相垂直时"]],[["F","被分解的那个力（合力）的大小","N"],["F<sub>x<\/sub>","水平方向的分力","N"],["F<sub>y<\/sub>","竖直方向的分力","N"],["θ","力与水平方向的夹角（弧度）","rad"]],[["把 cos 和 sin 记反，写成 F<sub>x<\/sub> = F sin θ、F<sub>y<\/sub> = F cos θ","★ 这类错误量纲完全一致（都是「纯数乘一个力」，结果还是 N），量纲检查一点用都没有。数值代入才暴露：θ ≈ 36.87° 时算出 6 N，而水平分量应该是 8 N —— 两个分量正好互换了。"],["直接把两个分力相加求合力，写成 F = F<sub>x<\/sub> + F<sub>y<\/sub>","★ 又一个量纲拦不住的错误：力加力还是力，量纲永远正确。数值代入才暴露：8 + 6 = 14 N，而真正的合力是 10 N。差的那 4 N 就是矢量合成与代数相加的区别。"]],"正交分解是高中力学最重要的计算工具，几乎所有复杂受力问题都靠它降维打击——把一个斜着的力换成水平和竖直两个方向上的力，然后每个方向各写一次平衡或牛顿第二定律。两个最容易混淆的点：一是 cos 和 sin 谁配谁（取决于 θ 是从哪个轴量起的）；二是合力不等于两个分力直接相加，因为它们是矢量，要用勾股定理再开方。",["力是矢量，合成遵守平行四边形定则：以两个分力为邻边作平行四边形，对角线就是合力。","若两个分力互相垂直，平行四边形退化成矩形，对角线的长度由勾股定理给出：F = √(F<sub>x<\/sub>² + F<sub>y<\/sub>²)。","分解是合成的逆运算。把 F 沿互相垂直的两个方向拆分，由直角三角形可读出两直角边。","若 θ 从水平轴量起，则邻边（水平分量）是 F cos θ，对边（竖直分量）是 F sin θ。","检核恒等式：把两个分量平方相加，得 F²(cos²θ + sin²θ) = F²，正好回到 F —— 这说明分解没有丢东西，也没多出来。"],["一个 10 N 的力与水平方向成 36.87° 角斜向上拉物体。求这个力在水平方向和竖直方向的分力。（已知 cos 36.87° = 0.8，sin 36.87° = 0.6）",["把力沿水平方向和竖直方向正交分解。","水平分量：F<sub>x<\/sub> = F cos θ = 10 × 0.8 = 8 N。","竖直分量：F<sub>y<\/sub> = F sin θ = 10 × 0.6 = 6 N。","验算：√(8² + 6²) = √100 = 10 N，与原来的力相等，说明分解没有出错。"],"水平分力 8 N，竖直分力 6 N。"],["dyn-03"],["dyn-05","mdl-27"],["相互作用","正交分解","矢量合成"],1,""],["dyn-05","牛顿第二定律","物体加速度的大小与所受合外力成正比、与质量成反比，加速度的方向与合外力方向相同。",[["牛顿第二定律","<mrow><msub><mi>F<\/mi><mi mathvariant=\"normal\">合<\/mi><\/msub><mo>=<\/mo><mrow><mi>m<\/mi>&#x22C5;<mi>a<\/mi><\/mrow><\/mrow>","宏观低速物体的运动，F<sub>合<\/sub> 是所有外力的矢量和"],["水平方向的合力","<mrow><msub><mi>F<\/mi><mi mathvariant=\"normal\">合<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>F<\/mi><mi mathvariant=\"normal\">拉<\/mi><\/msub><mo>−<\/mo><mi>f<\/mi><\/mrow><\/mrow>","水平面上被拉动的物体，水平方向受两个力"]],[["F<sub>合<\/sub>","物体受到的合外力","N"],["m","物体的质量","kg"],["a","加速度","m/s²"],["F<sub>拉<\/sub>","水平方向施加的拉力","N"],["f","摩擦力","N"]],[["用牛顿第二定律时只用拉力当合力，忘掉摩擦力","★ 量纲完全正确（N/kg 正是 m/s²），量纲检查抓不到。数值代入才暴露：直接用 10 ÷ 2 得 5 m/s²，而真实加速度是 (10 − 4) ÷ 2 = 3 m/s²。这是牛顿第二定律在实际题目里最高频的错误 —— 公式背得滚瓜烂熟，但「合力」漏了一个力。"],["把牛顿第二定律记成 F = m / a","写成除法后量纲变成 kg²·m/s²，与力的量纲对不上，量纲检查当场拦住。"]],"这条式子是整个高中力学的枢纽。它有三个必须记牢的限定：第一，F 是合力而不是某一个力，漏掉任何一个力都会算错加速度——这是本知识点专门设了一道检查去抓的错误；第二，a 的方向永远和合力方向一致，与速度方向无关；第三，a 与 F 是瞬时对应的，力一变，加速度立刻跟着变。",["实验：保持质量不变，改变拉力，测出加速度 —— a 与 F 成正比。","保持拉力不变，改变质量，测出加速度 —— a 与 m 成反比。","两式合并：a ∝ F / m，引入比例系数并取国际单位制，系数为 1，于是 F = m a。","检核量纲：kg × m/s² = M·L/T²，正是力的量纲 N，与左边一致。","反过来 a = F / m：合力方向就是加速度方向，这一点在公式里体现为两者同号。"],["质量为 2 kg 的物体放在水平面上，用 10 N 的水平拉力拉动，同时受到 4 N 的摩擦力。求物体的加速度。",["先明确物体受到的水平方向的两个力：拉力 F<sub>拉<\/sub> = 10 N 向前，摩擦力 f = 4 N 向后。","求水平方向的合力：F<sub>合<\/sub> = F<sub>拉<\/sub> − f = 10 − 4 = 6 N。","由牛顿第二定律 a = F<sub>合<\/sub> / m = 6 / 2 = 3 m/s²。","方向与合力方向相同，即与拉力方向相同。","常见错误是不减摩擦力，直接用 10 ÷ 2 = 5 m/s² —— 那等于假设物体不受摩擦力。"],"加速度为 3 m/s²，方向与拉力方向相同。"],["dyn-04"],["dyn-06","mdl-03","met-01","dyn-07"],["牛顿运动定律","合力","核心公式"],1,""],["dyn-06","牛顿第三定律","两个物体之间的作用力与反作用力总是大小相等、方向相反、作用在同一条直线上。",[["作用力与反作用力","<mrow><msub><mi>F<\/mi><mi mathvariant=\"normal\">AB<\/mi><\/msub><mo>=<\/mo><mrow><mo>−<\/mo><msub><mi>F<\/mi><mi mathvariant=\"normal\">BA<\/mi><\/msub><\/mrow><\/mrow>","任何两个相互作用的物体之间，与运动状态无关"]],[["F<sub>AB<\/sub>","A 对 B 的作用力（取正方向为正）","N"],["F<sub>BA<\/sub>","B 对 A 的反作用力","N"],["m<sub>A<\/sub>","A 的质量","kg"],["m<sub>B<\/sub>","B 的质量","kg"],["a<sub>A<\/sub>","A 的加速度（沿 A 对 B 施力方向为正）","m/s²"],["a<sub>B<\/sub>","B 的加速度（沿 A 对 B 施力方向为正）","m/s²"]],[["把作用力与反作用力写成同方向，漏掉「方向相反」这一条（F<sub>AB<\/sub> = F<sub>BA<\/sub>）","量纲完全正确，量纲检查抓不到。这一条由校验器自动实测：把错误写法原样代进情境（F<sub>AB<\/sub> = 5 N、F<sub>BA<\/sub> = −5 N），算出等号左边是 5、右边是 −5，两边对不上，于是被判为不通过。整个过程不需要人提供参考值。"],["把作用力与反作用力当成一对平衡力，认为它们可以相互抵消","平衡力作用在<strong>同一个<\/strong>物体上，作用力与反作用力分别作用在两个物体上，永远不能抵消。这条错误不体现为公式写错，而是受力分析时把它们画到了同一个物体上，公式类检查无法覆盖，标注人工审核。"]],"第三定律说的两句话最容易记，也最容易用错。第一条：它和「平衡力」不是一回事——作用力与反作用力分别作用在两个不同的物体上，永远不能相互抵消，能抵消的只有作用在同一物体上的平衡力。第二条：大小相等与运动状态无关——马拉车车也拉马，两者大小永远相等，车能被拉动是因为马受到的来自地面的摩擦力大于车受到的阻力，而不是因为马「拉得比车拉它更用力」。",["由大量实验总结得出：物体之间的相互作用总是成对出现。","这一对力有四个特征：作用在两个不同物体上；大小相等；方向相反；沿同一条直线。","把两个力沿同一条直线取同向为正方向，则方向相反体现为符号相反，于是 F<sub>AB<\/sub> = −F<sub>BA<\/sub>。","与牛顿第二定律配合使用时的关键区别：作用力与反作用力分别作用在两个物体上，受力分析时不能把它们画在同一个物体上，也不能相互抵消。"],["甲、乙两人各站在一块滑板上，甲用力推了乙一下，两人都向后运动。已知甲的质量为 60 kg、乙为 40 kg，甲推乙的力为 120 N。求乙受到甲的推力和甲受到乙的推力，并比较两人的加速度大小。",["由牛顿第三定律，甲推乙的力与乙推甲的力大小相等、方向相反。","所以甲受到的推力也是 120 N，方向与甲推乙的方向相反。","由 a = F / m，甲的质量大，加速度小：a<sub>甲<\/sub> = 120 / 60 = 2 m/s²。","乙的质量小，加速度大：a<sub>乙<\/sub> = 120 / 40 = 3 m/s²。","两人的推力完全相同，加速度不同——差别来自质量，不是来自「谁的力更大」。"],"两者都是 120 N，方向相反；甲加速度 2 m/s²，乙加速度 3 m/s²。"],["dyn-05"],["mdl-28"],["牛顿运动定律","相互作用","平衡力辨析"],1,""],["dyn-07","超重与失重","超重与失重描述称重装置的示数相对重力的变化。",[["重力","<mrow><mi>G<\/mi><mo>=<\/mo><mrow><mi>m<\/mi>&#x22C5;<mi>g<\/mi><\/mrow><\/mrow>","质量与当地重力加速度固定"],["竖直运动的视重","<mrow><msub><mi>F<\/mi><mi mathvariant=\"normal\">N<\/mi><\/msub><mo>=<\/mo><mrow><mi>m<\/mi><mrow><mo>(<\/mo><mi>g<\/mi><mo>+<\/mo><mi>a<\/mi><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","竖直向上为正，人与秤保持接触，a不能使支持力为负"]],[["F<sub>N<\/sub>","台秤对人的支持力，即视重","N"],["G","物体所受重力","N"],["m","物体质量","kg"],["g","当地重力加速度，取10","m/s²"],["a","竖直加速度，向上为正","m/s²"]],[["向上加速时误用减号","减号适用于以向下加速度大小描述的失重情形；本卡已取向上为正，再减会使视重变化方向颠倒，量纲却仍正确。"],["只要正在下降就认为失重，或认为失重时没有重力","下降时若速度减小，加速度实际向上，台秤示数会增大；自由落体中重力仍作用，只是支持力消失，不能混淆视重和重力。"]],"重力由质量与当地重力加速度决定，并不因电梯上升或下降而自行改变。加速上升、减速下降时加速度向上，视重增大；加速下降、减速上升时加速度向下，视重减小。自由落体时支持力为零但重力仍在；无约束的台秤不能给出负的支持力读数。",["先画重力和支持力，不把运动方向当作加速度方向。","向上取正，列支持力减重力等于质量乘带符号的加速度。","将四类运动按速度变化判断加速度方向；向下减速也是向上加速度。","代入自由落体加速度为负的重力加速度，支持力恰好为零。"],["质量50 kg的人在电梯中，重力加速度取10 m/s²。先向上加速2 m/s²，再以相同大小向上减速，求两次示数。",["向上加速时支持力为50×(10+2)=600 N。","向上减速时加速度向下，带符号为−2 m/s²，支持力为50×(10−2)=400 N。"],"两次示数分别为600 N和400 N；重力均为500 N。"],["dyn-05","kine-07"],["mdl-09"],["超重","失重","视重","电梯"],1,""],["dyn-08","斜面自锁与摩擦角","摩擦角描述最大静摩擦下接触合力偏离法线的角，φ = atan(μ)。",[["摩擦角","<mrow><mi>φ<\/mi><mo>=<\/mo><mrow><mi mathvariant=\"normal\">atan<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>μ<\/mi><mo>)<\/mo><\/mrow><\/mrow>","静摩擦达到最大时，接触合力与法线夹角"],["静止所需摩擦力","<mrow><mi>f<\/mi><mo>=<\/mo><mrow><mrow><mi>m<\/mi>&#x22C5;<mi>g<\/mi><\/mrow>&#x22C5;<mrow><mi mathvariant=\"normal\">sin<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>θ<\/mi><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","仅受重力、支持力和静摩擦，斜面固定"],["斜面的支持力","<mrow><mi>N<\/mi><mo>=<\/mo><mrow><mrow><mi>m<\/mi>&#x22C5;<mi>g<\/mi><\/mrow>&#x22C5;<mrow><mi mathvariant=\"normal\">cos<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>θ<\/mi><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","无其他垂直斜面的力与加速度"],["静止所需最小系数","<mrow><msub><mi>μ<\/mi><mi>c<\/mi><\/msub><mo>=<\/mo><mrow><mi mathvariant=\"normal\">tan<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>θ<\/mi><mo>)<\/mo><\/mrow><\/mrow>","重力滑动模型；实际静摩擦系数不小于此值才可静止"]],[["φ","摩擦角","rad"],["μ","最大静摩擦系数","1"],["θ","斜面倾角","rad"],["m","物体质量","kg"],["g","重力加速度，取10","m/s²"],["N","斜面对物体的支持力","N"],["f","维持重力静止所需的静摩擦力大小","N"],["μ<sub>c<\/sub>","给定斜面角能静止所需的最小静摩擦系数","1"]],[["把摩擦角直接等于摩擦系数","摩擦系数是两力大小比，摩擦角是该比的反正切；只有非常小的角才可能近似相同，直接把0.75当弧度并不满足临界力三角形。"],["自锁就说明任意方向任意大的推力也无法运动","当前条件仅描述重力使物体沿斜面下滑时的静止边界，外力方向会改变支持力和所需摩擦；沿面足够大推拉力仍可破坏静止。"]],"重力沿斜面的分量决定维持静止所需摩擦力，垂直斜面的分量决定支持力；前者不超过最大静摩擦即能静止。这里的自锁条件针对无额外推拉力的重力滑动模型，不表示无论多大或何方向的外力都无法推动物体。施加倾斜外力会同时改变沿面分量和支持力，必须重新作受力分析。",["画重力、支持力及沿面向上的静摩擦，不把摩擦力自动设为最大值。","沿面静止时静摩擦等于重力沿面分量，支持力由垂直方向平衡给出。","将所需静摩擦不超过最大值的条件除以正支持力，得到斜面倾角不超过摩擦角。","若施加额外外力，重新分解其两个分量；只有新的力与约束关系满足条件，才能继续谈自锁。"],["质量2 kg物体静置在倾角约36.87°的斜面上，最大静摩擦系数0.75，取重力加速度10 m/s²，判断是否刚好自锁。",["重力沿面分量12 N，垂直面分量16 N，维持静止需要12 N静摩擦。","最大静摩擦0.75×16=12 N，恰好等于需要值；斜面角等于摩擦角。"],"恰好处于静止与下滑的临界；静摩擦12 N，支持力16 N。"],["dyn-02","dyn-03"],["mdl-27","mdl-32"],["自锁","摩擦角","静摩擦临界"],1,""],["dyn-09","牛顿第一定律与惯性","在惯性参考系中，物体不受力或所受合力为零时保持静止或匀速直线运动。",[["反向两力的合力","<mrow><mi>F<\/mi><mo>=<\/mo><mrow><msub><mi>F<\/mi><mn>1<\/mn><\/msub><mo>−<\/mo><msub><mi>F<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mrow>",""],["平衡例子的加速度核对","<mrow><mi>a<\/mi><mo>=<\/mo><mfrac><mi>F<\/mi><mi>m<\/mi><\/mfrac><\/mrow>",""]],[["F","同一直线上合力","N"],["F<sub>1<\/sub>","向右作用力大小","N"],["F<sub>2<\/sub>","向左作用力大小","N"],["a","该方向加速度","m/s²"],["m","物体质量","kg"],["v<sub>1<\/sub>","初速度","m/s"],["v<sub>2<\/sub>","独立测得末速度","m/s"],["t","观测间隔","s"]],[["把方向相反的两个力直接相加为合力。","规定右为正，向左的力取负；两个10 N合力为零，不是20 N。物体可能静止，也可能以原速度匀速运动。"],["运动越快惯性越大，或说惯性力把物体推向前。","经典力学的惯性由质量衡量，与速度大小无关；惯性是性质，不能在受力图中凭空添加惯性力。非惯性系的惯性力概念不属于本卡分析。"]],"伽利略通过减小阻力的实验与理想推理提出运动可以持续，笛卡尔强调直线运动，牛顿形成第一定律。力改变速度而非维持速度，合力零不等于每个力都为零。静止和匀速直线运动取决于初始状态，第一定律还给出惯性参考系概念，不能说它只是第二定律令合力为零的代数特例。以下平衡与速度读数用于量化例子，不宣称靠两次测量证明定律。",["合力20-20=0 N，加速度为零。","初速度并非零，因此保持向右3 m/s，不会自动停止。","伽利略通过减小阻力的实验与理想推理提出运动可以持续，笛卡尔强调直线运动，牛顿形成第一定律。"],["4 kg物体原来向右3 m/s，向右20 N与向左20 N平衡，在惯性系中2 s后速度如何？",["合力20-20=0 N，加速度为零。","初速度并非零，因此保持向右3 m/s，不会自动停止。"],"仍向右3 m/s；惯性由质量而非运动快慢决定。"],[],["dyn-05","dyn-10"],["牛顿第一定律与惯性","条件与边界","实验与证据"],1,"<section class=\"field learning\"><h4>牛顿第一定律与惯性：方法与边界<\/h4><p>伽利略通过减小阻力的实验与理想推理提出运动可以持续，笛卡尔强调直线运动，牛顿形成第一定律。力改变速度而非维持速度，合力零不等于每个力都为零。静止和匀速直线运动取决于初始状态，第一定律还给出惯性参考系概念，不能说它只是第二定律令合力为零的代数特例。以下平衡与速度读数用于量化例子，不宣称靠两次测量证明定律。<\/p><\/section>"],["dyn-10","理想实验与伽利略斜面思想","理想实验在可检验事实基础上，逐步排除次要因素并逻辑推演理想极限。",[["损失后的回升高度","<mrow><msub><mi>h<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><mrow><msub><mi>h<\/mi><mn>1<\/mn><\/msub><mo>−<\/mo><mfrac><msub><mi>W<\/mi><mi mathvariant=\"normal\">损<\/mi><\/msub><mrow><mi>m<\/mi>&#x22C5;<mi>g<\/mi><\/mrow><\/mfrac><\/mrow><\/mrow>",""],["回升势能","<mrow><mi>E<\/mi><mo>=<\/mo><mrow><mrow><mi>m<\/mi>&#x22C5;<mi>g<\/mi><\/mrow>&#x22C5;<msub><mi>h<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mrow>",""]],[["h<sub>2<\/sub>","回升高度","m"],["h<sub>1<\/sub>","初始高度","m"],["W<sub>损<\/sub>","耗散能量","J"],["m","小球质量","kg"],["g","重力加速度","m/s²"],["E","回升势能","J"]],[["有阻力损失时把损失能量加到回升高度上。","耗散减少可恢复的机械能，必须从初势能扣除；2 J损失使高度少0.1 m，不能回升到0.6 m。"],["理想实验就是不用事实依据的猜想，或认为实物能完全没有阻力。","推理必须基于事实和可说明的理想条件，逐步外推并说明极限；理想模型与真实装置之间仍有阻力和测量误差。"]],"小球沿一个斜面下滑后沿另一个斜面上升，实际阻力导致回升高度略低；减小阻力使回升高度接近原高度。理想无阻力模型中回到原高度，第二斜面倾角越小需走越长距离；推至水平时无法靠升高达到该高度，运动会持续。这不是实际造出完全无阻力装置，也不能把有限观测直接当作无限时间证据。下面以能量损失账目解释高度差，逻辑推理本身仍需审查前提。",["初势能10 J，有损失后剩8 J，对应0.4 m。","无损失时保留10 J，回到0.5 m；改变斜面角度不改变理想回升高度。","小球沿一个斜面下滑后沿另一个斜面上升，实际阻力导致回升高度略低；减小阻力使回升高度接近原高度。"],["2 kg球从0.5 m高度静止出发，回升前损失2 J，忽略转动，g取10；比较有损失和无损失高度。",["初势能10 J，有损失后剩8 J，对应0.4 m。","无损失时保留10 J，回到0.5 m；改变斜面角度不改变理想回升高度。"],"有损失0.4 m，理想无损失0.5 m。"],["dyn-09"],["ene-06"],["理想实验与伽利略斜面思想","条件与边界","实验与证据"],1,"<section class=\"field learning\"><h4>理想实验与伽利略斜面思想：方法与边界<\/h4><p>小球沿一个斜面下滑后沿另一个斜面上升，实际阻力导致回升高度略低；减小阻力使回升高度接近原高度。理想无阻力模型中回到原高度，第二斜面倾角越小需走越长距离；推至水平时无法靠升高达到该高度，运动会持续。这不是实际造出完全无阻力装置，也不能把有限观测直接当作无限时间证据。下面以能量损失账目解释高度差，逻辑推理本身仍需审查前提。<\/p><\/section>"],["ene-01","功：恒力做功、正功负功与总功","物体在力的作用下沿某方向发生位移，力对物体做功。",[["恒力做功","<mrow><mi>W<\/mi><mo>=<\/mo><mrow><mrow><mi>F<\/mi>&#x22C5;<mi>s<\/mi><\/mrow>&#x22C5;<mrow><mi mathvariant=\"normal\">cos<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>θ<\/mi><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","力的大小和方向不变，物体发生直线位移"],["总功的代数和","<mrow><msub><mi>W<\/mi><mi mathvariant=\"normal\">总<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>W<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>W<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mrow>","多个力分别对同一物体做功"]],[["W","恒力所做的功","J"],["F","恒力大小","N"],["s","位移大小","m"],["θ","力与位移的夹角","rad"],["W<sub>总<\/sub>","各力所做的总功","J"],["W<sub>1<\/sub>","第一个力做的功","J"],["W<sub>2<\/sub>","第二个力做的功","J"],["E<sub>k1<\/sub>","初状态动能","J"],["E<sub>k2<\/sub>","末状态动能","J"]],[["漏掉夹角因子，任何情况下都写成 W = Fs","只有力与位移同向时 cos(θ)=1 才能写成 Fs。斜向拉箱会误算成 50 J，正确值是 40 J；两式量纲相同，只能靠数值情境抓住。"],["把负功的大小直接相加，写成 W<sub>总<\/sub> = W<sub>1<\/sub> − W<sub>2<\/sub>","W<sub>2<\/sub> 已经带负号，再减一次会把阻力的负功变成正贡献。本情境会得到 70 J，而正确总功是 30 J。"]],"功的正负不表示功有方向，而表示这个力对动能变化的作用。正功倾向于增加动能，负功倾向于减少动能。多个力同时作用时，应先分别计算各力的功再代数相加；也可以先求恒定合力，再计算合力的功。",["先取力在位移方向上的分量 F cos(θ)，只有这一分量产生沿位移方向的能量转移。","用沿位移方向的分力乘位移，得到 W = F s cos(θ)。N·m 与 J 等价。","若有多个力，功是标量，各力的功按正负号作代数相加，得到总功。"],["用 10 N 的恒力斜向上拉箱子，力与水平位移的夹角满足 cos(θ)=0.8，箱子水平移动 5 m；同时阻力做功 −20 J。求拉力做功和总功。",["拉力做功 W<sub>1<\/sub> = F s cos(θ) = 10 × 5 × 0.8 = 40 J。","阻力的功已经是带符号的 −20 J。","总功 W<sub>总<\/sub> = 40 + (−20) = 20 J。"],"拉力做功 40 J，总功 20 J。"],["dyn-04"],["ene-02","ene-03","mdl-24"],["功","正功","负功","总功"],2,""],["ene-02","功率：平均功率与瞬时功率","功率描述做功的快慢。",[["平均功率","<mrow><mover accent=\"true\"><mi>P<\/mi><mo>¯<\/mo><\/mover><mo>=<\/mo><mfrac><mi>W<\/mi><mi>t<\/mi><\/mfrac><\/mrow>","研究一段时间内做功的平均快慢"],["恒力的瞬时功率","<mrow><mi>P<\/mi><mo>=<\/mo><mrow><mrow><mi>F<\/mi>&#x22C5;<mi>v<\/mi><\/mrow>&#x22C5;<mrow><mi mathvariant=\"normal\">cos<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>θ<\/mi><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","恒力作用于速度为 v 的物体，θ 是力与速度的夹角"]],[["<span style=\"text-decoration:overline\">P<\/span>","平均功率","W"],["P","瞬时功率","W"],["W","一段时间内所做的功","J"],["t","做功所用时间","s"],["F","恒力大小","N"],["v","瞬时速度大小","m/s"],["θ","力与速度的夹角","rad"]],[["瞬时功率只写 P = Fv，不考虑力与速度夹角","只有力与速度同向时才成立。斜向牵引情境中 cos(θ)=0.8，错误式得到 10000 W，正确值为 8000 W；两式量纲相同，必须靠数值核验。"],["把平均功率写成 <span style=\"text-decoration:overline\">P<\/span> = Wt","J·s 不是功率单位 J/s，量纲检查可以直接发现。数值上还会错误地认为用时越长功率越大。"]],"功相同不代表功率相同，完成得越快，平均功率越大。发动机的额定功率是正常工作时允许长期输出的功率，不等于任何时刻都必然达到的实际功率。由 P = Fv 可知，在功率受限时，牵引力和速度不能同时任意增大。",["平均功率由定义直接得到：用完成的功 W 除以所用时间 t。","很短时间内位移可写成 s = vt，代入 W = Fs cos(θ)。","再除以时间 t，得到瞬时关系 P = Fv cos(θ)。"],["起重机在 20 s 内做功 6000 J，求平均功率。若某时刻钢索拉力为 2000 N、重物速度为 0.5 m/s且同向，求该时刻功率。",["平均功率 <span style=\"text-decoration:overline\">P<\/span> = W/t = 6000/20 = 300 W。","钢索拉力与速度同向，cos(θ)=1。","瞬时功率 P = Fv = 2000 × 0.5 = 1000 W。"],"平均功率 300 W，所述时刻的瞬时功率 1000 W。"],["ene-01"],["ene-03","mdl-04"],["功率","平均功率","瞬时功率","额定功率"],2,""],["ene-03","动能与动能定理","质量为 m、速率为 v 的物体具有动能 E<sub>k<\/sub> = 1/2 m v²。",[["动能","<mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">k<\/mi><\/msub><mo>=<\/mo><mrow><mrow><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac>⁢<mi>m<\/mi><\/mrow>⋅<msup><mi>v<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mrow>","质量为 m、速率为 v 的质点或平动物体"],["动能定理","<mrow><msub><mi>W<\/mi><mi mathvariant=\"normal\">总<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">k2<\/mi><\/msub><mo>−<\/mo><msub><mi>E<\/mi><mi mathvariant=\"normal\">k1<\/mi><\/msub><\/mrow><\/mrow>","任意一段运动过程，总功取所有力做功的代数和"]],[["E<sub>k<\/sub>","物体的动能","J"],["E<sub>k1<\/sub>","初状态动能","J"],["E<sub>k2<\/sub>","末状态动能","J"],["m","物体质量","kg"],["v","物体速率","m/s"],["v<sub>1<\/sub>","初速率","m/s"],["v<sub>2<\/sub>","末速率","m/s"],["W<sub>总<\/sub>","合力所做的总功","J"],["g","重力加速度","m/s²"],["h","斜面竖直高度","m"],["a","沿斜面加速度","m/s²"],["L","斜面长度","m"]],[["漏掉二分之一，把动能写成 E<sub>k<\/sub> = mv²","错误式量纲仍是 J，量纲检查抓不到。小车情境会算成 18 J，正确值是 9 J。"],["把动能变化写反成 E<sub>k1<\/sub> − E<sub>k2<\/sub>","加速过程中会错误得到负功。本情境算出 −32 J，而正确总功为 +32 J。"]],"动能定理把复杂的受力过程压缩为初末两个状态，特别适合求变力作用或路径复杂但各力做功容易计算的问题。总功为正，动能增加；总功为负，动能减少。它不要求只有一个力做功，也不等于机械能守恒。",["恒力沿直线推动质量 m 的物体时，W<sub>总<\/sub> = F s = m a s。","由运动学关系 v<sub>2<\/sub>² − v<sub>1<\/sub>² = 2as，得到 W<sub>总<\/sub> = 1/2 m v<sub>2<\/sub>² − 1/2 m v<sub>1<\/sub>²。","把只与状态有关的 1/2 mv² 定义为动能，便得到 W<sub>总<\/sub> = E<sub>k2<\/sub> − E<sub>k1<\/sub>。","斜面互证中，能量路线直接用 mgh = 1/2 mv²；力学路线先用 F=ma 求 a，再用 v²=2aL，二者末速度必须相同。"],["质量 2 kg 的物体从静止沿高 1.8 m、长 5 m 的光滑斜面下滑，取 g=10 m/s²。分别用动能定理和牛顿第二定律加运动学求末速度。",["能量路线：mgh = 1/2 mv²，约去 m，得 v² = 2gh = 36，所以 v = 6 m/s。","力学路线：斜面正弦值 h/L = 1.8/5 = 0.36，沿斜面加速度 a = g sin(θ) = 3.6 m/s²。","由 v² = 2aL = 2×3.6×5 = 36，仍得 v = 6 m/s。","两条独立路径结果完全一致。"],"末速度为 6 m/s；两种方法一致。"],["ene-01","dyn-05","kine-05"],["ene-04","ene-06","mdl-32"],["动能","动能定理","跨公式互证","斜面"],2,""],["ene-04","重力做功与重力势能","重力做功只由初末高度决定，与路径无关：W<sub>G<\/sub> = mg(h<sub>1<\/sub>−h<sub>2<\/sub>)。",[["重力做功","<mrow><msub><mi>W<\/mi><mi>G<\/mi><\/msub><mo>=<\/mo><mrow><mrow><mi>m<\/mi>⋅<mi>g<\/mi><\/mrow><mrow><mo>(<\/mo><msub><mi>h<\/mi><mn>1<\/mn><\/msub><mo>−<\/mo><msub><mi>h<\/mi><mn>2<\/mn><\/msub><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","近地面重力可视为恒力，h<sub>1<\/sub>、h<sub>2<\/sub> 使用同一高度基准"],["重力势能","<mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">p<\/mi><\/msub><mo>=<\/mo><mrow><mrow><mi>m<\/mi>&#x22C5;<mi>g<\/mi><\/mrow>&#x22C5;<mi>h<\/mi><\/mrow><\/mrow>","选定零势能面后，近地面范围内"]],[["W<sub>G<\/sub>","重力所做的功","J"],["m","物体质量","kg"],["g","重力加速度","m/s²"],["h","相对零势能面的高度","m"],["h<sub>1<\/sub>","初位置高度","m"],["h<sub>2<\/sub>","末位置高度","m"],["E<sub>p<\/sub>","重力势能","J"],["E<sub>p1<\/sub>","初状态重力势能","J"],["E<sub>p2<\/sub>","末状态重力势能","J"]],[["下落时把重力功写成 mg(h<sub>2<\/sub>−h<sub>1<\/sub>)","下落时重力与位移同向，应做正功。错误写法在本情境得到 −60 J，符号与物理过程相反。"],["把重力势能写成 E<sub>p<\/sub> = mgh²","右边单位会变成 J·m，而不是能量单位 J；高度被多乘了一次，数值也会随高度平方增长，量纲检查可以直接拦住。"]],"重力势能属于物体与地球组成的系统，并且数值依赖零势能面的选择；但势能差和重力做功不依赖零面的选择。物体下落时重力做正功、势能减少；物体上升时重力做负功、势能增加。",["竖直方向取向上为正，重力方向向下；物体从 h<sub>1<\/sub> 到 h<sub>2<\/sub> 时，重力做功为 mg(h<sub>1<\/sub>−h<sub>2<\/sub>)。","因为这个结果只与初末高度有关，可定义状态量 E<sub>p<\/sub> = mgh。","于是 W<sub>G<\/sub> = mg h<sub>1<\/sub> − mg h<sub>2<\/sub> = E<sub>p1<\/sub> − E<sub>p2<\/sub> = −Δ E<sub>p<\/sub>。"],["质量 2 kg 的物体从离地 5 m 处落到离地 2 m 处，取地面为零势能面，g=10 m/s²。求重力做功及势能变化。",["重力做功 W<sub>G<\/sub> = mg(h<sub>1<\/sub>−h<sub>2<\/sub>) = 2×10×3 = 60 J。","初势能 E<sub>p1<\/sub> = 100 J，末势能 E<sub>p2<\/sub> = 40 J。","势能变化 Δ E<sub>p<\/sub> = E<sub>p2<\/sub>−E<sub>p1<\/sub> = −60 J，与重力功互为相反数。"],"重力做功 60 J，重力势能减少 60 J。"],["ene-01"],["ene-06","mdl-26"],["重力做功","重力势能","零势能面"],2,""],["ene-05","弹性势能","在弹性限度内，劲度系数为 k 的弹簧形变量为 x 时，弹簧的弹性势能 Ep<sub>s<\/sub> = 1/2 kx²。",[["弹性势能","<mrow><msub><mi mathvariant=\"normal\">Ep<\/mi><mi>s<\/mi><\/msub><mo>=<\/mo><mrow><mrow><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac>⁢<mi>k<\/mi><\/mrow>⋅<msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mrow>","理想弹簧处于弹性限度内，以原长状态为零势能状态"],["弹力做功","<mrow><msub><mi>W<\/mi><mi mathvariant=\"normal\">弹<\/mi><\/msub><mo>=<\/mo><mrow><mrow><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac>⁢<mi>k<\/mi><\/mrow><mrow><mo>(<\/mo><msup><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mn>2<\/mn><\/msup><mo>−<\/mo><msup><msub><mi>x<\/mi><mn>2<\/mn><\/msub><mn>2<\/mn><\/msup><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","理想弹簧从形变量 x<sub>1<\/sub> 变化到 x<sub>2<\/sub>"]],[["Ep<sub>s<\/sub>","弹簧的弹性势能","J"],["k","弹簧劲度系数","N/m"],["x","弹簧形变量","m"],["x<sub>1<\/sub>","初状态形变量","m"],["x<sub>2<\/sub>","末状态形变量","m"],["W<sub>弹<\/sub>","弹力所做的功","J"],["L<sub>总<\/sub>","弹簧当前总长","m"]],[["漏掉二分之一，把弹性势能写成 kx²","错误式量纲仍为 J，只有数值核验能发现。本情境会算成 2 J，正确值为 1 J。"],["把弹簧总长代入 x，写成 1/2 kL²","x 是相对原长的形变量，不是总长。错误式量纲完全正确，本情境会误算成 16 J，而正确值只有 1 J。"]],"弹簧弹力会随形变量变化，不能直接拿某一时刻的 kx 乘位移。弹性势能与形变量的平方有关，拉伸和压缩同样大小时势能相同。这里的 x 仍然是相对原长的形变量，而不是弹簧总长。",["弹簧弹力由 0 随形变量线性增加到 kx，平均弹力为 (0+kx)/2。","把平均弹力乘形变量 x，得到储存的能量 1/2 kx²。","弹簧回弹时弹性势能减少，弹力做正功，因此 W<sub>弹<\/sub> = Ep<sub>s1<\/sub>−Ep<sub>s2<\/sub>。"],["劲度系数 200 N/m 的弹簧被拉伸 0.10 m，随后回弹到形变量 0.04 m。求初始弹性势能和回弹过程中弹力做功。",["初始弹性势能 Ep<sub>s1<\/sub> = 1/2×200×0.10² = 1 J。","末态弹性势能 Ep<sub>s2<\/sub> = 1/2×200×0.04² = 0.16 J。","弹力做功等于势能减少量：1−0.16 = 0.84 J。"],"初始弹性势能 1 J，弹力做功 0.84 J。"],["dyn-01","ene-01"],["ene-06","mdl-15","met-04"],["弹性势能","弹力做功","胡克定律"],2,""],["ene-06","机械能与机械能守恒定律","物体的动能与势能之和叫机械能。",[["机械能定义","<mrow><mi>E<\/mi><mo>=<\/mo><mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">k<\/mi><\/msub><mo>+<\/mo><msub><mi>E<\/mi><mi mathvariant=\"normal\">p<\/mi><\/msub><\/mrow><\/mrow>","机械能由动能和所考虑的势能组成"],["机械能守恒","<mrow><msub><mi>E<\/mi><mn>1<\/mn><\/msub><mo>=<\/mo><msub><mi>E<\/mi><mn>2<\/mn><\/msub><\/mrow>","选定系统内只有重力或弹力做功"]],[["E","机械能","J"],["E<sub>k<\/sub>","动能","J"],["E<sub>p<\/sub>","势能","J"],["E<sub>1<\/sub>","初状态机械能","J"],["E<sub>2<\/sub>","末状态机械能","J"],["E<sub>k1<\/sub>","初状态动能","J"],["E<sub>k2<\/sub>","末状态动能","J"],["E<sub>p1<\/sub>","初状态势能","J"],["E<sub>p2<\/sub>","末状态势能","J"],["m","物体质量","kg"],["g","重力加速度","m/s²"],["h","初位置相对末位置的高度","m"],["v","末速率","m/s"]],[["把机械能写成动能减势能 E = E<sub>k<\/sub> − E<sub>p<\/sub>","机械能定义是动能与势能的代数和。错误式在本情境得到 −24 J，而正确机械能是 60 J。"],["只要研究能量问题就直接写机械能守恒，不检查是否有非保守力做功","有滑动摩擦、外力推动等过程时，机械能可以转化为内能或由外界输入，机械能一般不守恒；守恒的是包含相关形式在内的总能量。此错误属于适用条件判断，公式数值检查不能单独覆盖。"]],"机械能守恒不是能量守恒的同义词。能量守恒始终成立；机械能守恒需要条件。判断时应先选系统，再检查是否只有重力或系统内弹力做功，不能只看题目里是否出现摩擦力，也不能因为支持力存在就直接否定——关键是这些力是否对所选系统做功。",["动能定理给出总功等于动能变化。把重力或弹力做功改写为相应势能的减少量。","若只有这些保守力做功，就有 Δ E<sub>k<\/sub> = −Δ E<sub>p<\/sub>。","移项得到 E<sub>k1<\/sub>+E<sub>p1<\/sub> = E<sub>k2<\/sub>+E<sub>p2<\/sub>，即机械能在过程中保持不变。"],["质量 2 kg 的物体从高 1.8 m 处由静止自由下落，忽略空气阻力，g=10 m/s²。用机械能守恒求落地速度。",["忽略空气阻力，物体与地球系统只有重力做功，机械能守恒。","取地面为零势能面：mgh = 1/2 mv²。","约去质量，v² = 2gh = 36，所以 v = 6 m/s。","初末机械能均为 36 J。"],"落地速度为 6 m/s。"],["ene-03","ene-04","ene-05"],["ene-07","exp-11","mdl-39"],["机械能","机械能守恒","适用条件"],2,""],["ene-07","功与能的关系：摩擦生热与能量守恒","相对滑动过程中，滑动摩擦把机械能转化为内能。",[["摩擦生热","<mrow><mi>Q<\/mi><mo>=<\/mo><mrow><mi>f<\/mi>&#x22C5;<msub><mi>s<\/mi><mi mathvariant=\"normal\">相对<\/mi><\/msub><\/mrow><\/mrow>","大小为 f 的滑动摩擦力作用，接触面发生相对滑动"],["含内能的能量守恒","<mrow><mi>Q<\/mi><mo>=<\/mo><mrow><mrow><msub><mi>E<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>W<\/mi><mi>e<\/mi><\/msub><\/mrow><mo>−<\/mo><msub><mi>E<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mrow>","把摩擦产生的内能计入系统，W<sub>e<\/sub> 是系统外力输入的能量"]],[["Q","摩擦产生的内能","J"],["f","滑动摩擦力大小","N"],["s<sub>相对<\/sub>","两接触面间的相对路程","m"],["E<sub>1<\/sub>","系统初状态机械能","J"],["E<sub>2<\/sub>","系统末状态机械能","J"],["W<sub>e<\/sub>","系统外力所做的功","J"]],[["机械能减少后认为能量消失，写成 E<sub>1<\/sub> = E<sub>2<\/sub> 而漏掉 Q","粗糙面减速情境中初机械能 50 J、末机械能 26 J，二者不相等；少掉的 24 J 正好转化为内能。"],["把摩擦生热写成 Q = f/s<sub>相对<\/sub>","相除后的单位是 N/m，不是能量单位 J；而且它会错误地认为相对滑动路程越长，产生的内能反而越少，量纲检查可以直接发现。"]],"机械能减少并不表示能量消失，而是能量形式发生了转化。计算摩擦生热必须使用相对路程，不一定等于某一个物体对地位移。把系统边界选清楚，是判断外力做功、机械能变化和内能变化的第一步。",["滑动摩擦力在相对位移上持续作用，转化的能量等于摩擦力大小乘相对路程，即 Q = f s<sub>相对<\/sub>。","对选定系统列能量账：初机械能加外界输入的功，等于末机械能加转化出的内能。","没有外力做功时，E<sub>1<\/sub>−E<sub>2<\/sub> = Q；机械能减少量有明确去向，并未消失。"],["木块在粗糙水平面上滑行 4 m，受到 6 N 的滑动摩擦力。初机械能为 50 J，过程中无其他外力做功。求摩擦生热和末机械能。",["接触面相对路程为 4 m，摩擦生热 Q = f s<sub>相对<\/sub> = 6×4 = 24 J。","能量守恒：E<sub>1<\/sub> = E<sub>2<\/sub> + Q。","所以 E<sub>2<\/sub> = 50−24 = 26 J。"],"摩擦生热 24 J，末机械能 26 J。"],["ene-01","ene-06","dyn-03"],["mdl-08"],["摩擦生热","内能","能量守恒","系统边界"],2,""],["mom-01","冲量与动量","动量 p=mv；恒力冲量 I=Ft。",[["动量定义","<mrow><mi>p<\/mi><mo>=<\/mo><mrow><mi>m<\/mi>&#x22C5;<mi>v<\/mi><\/mrow><\/mrow>","质点模型"],["恒力的冲量","<mrow><mi>I<\/mi><mo>=<\/mo><mrow><mi>F<\/mi>&#x22C5;<mi>t<\/mi><\/mrow><\/mrow>","恒力"]],[["p","动量","kg·m/s"],["m","质量","kg"],["v","速度","m/s"],["I","冲量","N·s"],["F","力","N"],["t","时间","s"]],[["把动量多乘 2，写成 p=2mv","错误式量纲仍是动量，量纲检查抓不到；代入会得到 12，而正确动量是 6。"],["把恒力冲量写成 I = F/t","力除以时间的量纲不是冲量；同时也会错误地认为作用越久冲量越小。"]],"动量描述物体的运动状态，冲量描述力在一段时间内的累积效果。二者都是矢量，一维计算必须先规定正方向，反向量取负值，不能只比较大小。",["定义动量 p=mv。","恒力冲量 I=Ft。","二者量纲相同。"],["2 kg 小车以 3 m/s 运动，4 N 力作用 1.5 s。求动量和冲量。",["动量 p=2×3=6。","冲量 I=4×1.5=6。"],"动量 6 kg·m/s，冲量 6 N·s。"],[],["mom-02"],["动量"],3,""],["mom-02","动量定理","合外力的冲量等于动量变化量：I=p₂−p₁。",[["动量定理","<mrow><mi>I<\/mi><mo>=<\/mo><mrow><msub><mi>p<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>p<\/mi><mn>1<\/mn><\/msub><\/mrow><\/mrow>","任意冲量"],["平均合外力","<mrow><mover accent=\"true\"><mi>F<\/mi><mo>¯<\/mo><\/mover><mo>=<\/mo><mfrac><mrow><msub><mi>p<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>p<\/mi><mn>1<\/mn><\/msub><\/mrow><mi>Δ<\/mi><mi>t<\/mi><\/mfrac><\/mrow>","已知作用时间"]],[["I","冲量","N·s"],["p<sub>1<\/sub>","初动量","kg·m/s"],["p<sub>2<\/sub>","末动量","kg·m/s"],["<span style=\"text-decoration:overline\">F<\/span>","平均力","N"],["Δt","时间","s"]],[["把变化量写成 p₁−p₂","量纲仍正确但方向相反；本情境会算成 −6，正确结果应为正 6。"],["反弹时忽略末动量为负","正确变化量是 −2−3=−5，而非用大小相减得到 1；矢量方向不能丢。"]],"动量变化等于末动量减初动量，必须保留方向符号。同样的动量变化若延长作用时间，平均力会减小，这正是安全气囊、缓冲垫和屈膝落地的原理。",["由 F=ma 得 FΔt=mΔv。","mΔv=p₂−p₁。","故 I=Δp。"],["动量由 3 变为 −2 kg·m/s，历时 0.25 s，求冲量和力。",["冲量 I=−2−3=−5。","平均力 F=−5/0.25=−20。"],"−5 N·s；−20 N。"],["mom-01"],["mom-03"],["动量定理"],3,""],["mom-03","动量守恒定律","合外力冲量为零时，系统总动量不变：m₁v₁+m₂v₂=m₁v₁′+m₂v₂′。",[["系统初总动量","<mrow><msub><mi>p<\/mi><mi mathvariant=\"normal\">总<\/mi><\/msub><mo>=<\/mo><mrow><mrow><msub><mi>m<\/mi><mn>1<\/mn><\/msub>&#x22C5;<msub><mi>v<\/mi><mn>1<\/mn><\/msub><\/mrow><mo>+<\/mo><mrow><msub><mi>m<\/mi><mn>2<\/mn><\/msub>&#x22C5;<msub><mi>v<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mrow><\/mrow>","一维两物体"],["由动量守恒求末速度","<mrow><msubsup><mi>v<\/mi><mn>2<\/mn><mo>′<\/mo><\/msubsup><mo>=<\/mo><mfrac><mrow><mrow><mrow><msub><mi>m<\/mi><mn>1<\/mn><\/msub>&#x22C5;<msub><mi>v<\/mi><mn>1<\/mn><\/msub><\/mrow><mo>+<\/mo><mrow><msub><mi>m<\/mi><mn>2<\/mn><\/msub>&#x22C5;<msub><mi>v<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mrow><mo>−<\/mo><mrow><msub><mi>m<\/mi><mn>1<\/mn><\/msub>&#x22C5;<msubsup><mi>v<\/mi><mn>1<\/mn><mo>′<\/mo><\/msubsup><\/mrow><\/mrow><msub><mi>m<\/mi><mn>2<\/mn><\/msub><\/mfrac><\/mrow>","m₂不为零"]],[["p<sub>总<\/sub>","总动量","kg·m/s"],["m1","质量一","kg"],["m2","质量二","kg"],["v<sub>1<\/sub>","初速度一","m/s"],["v<sub>2<\/sub>","初速度二","m/s"],["v<sub>1<\/sub>′","碰后速度一","m/s"],["v<sub>2<\/sub>′","碰后速度二","m/s"]],[["把负的 v₂ 再减一次","v₂ 已是 −1，再写减号会重复处理方向，结果变为 7，正确总动量是 5。"],["认为存在内力就不守恒","内力只在系统内部转移动量；系统是否守恒应由合外力冲量是否为零判断。"]],"守恒的是选定系统的总动量，而不是每个物体各自的动量。内力只在系统内部转移动量；是否守恒取决于合外力冲量是否为零或在过程中可忽略。",["系统满足 Δp=I外。","I外=0 时 Δp=0。","反向速度取负。"],["两车初动量合计为 5，碰后一车动量为 2，求另一车速度（质量 1 kg）。",["另一车末动量为 5−2=3。","速度 v₂′=3/1=3 m/s。"],"3 m/s。"],["mom-02"],["mom-04","mdl-07"],["动量守恒"],3,""],["mom-04","碰撞","碰撞中系统动量守恒。",[["完全非弹性碰撞共同速度","<mrow><msub><mi>v<\/mi><mi mathvariant=\"normal\">共<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><mrow><msub><mi>m<\/mi><mn>1<\/mn><\/msub>&#x22C5;<msub><mi>v<\/mi><mn>1<\/mn><\/msub><\/mrow><mo>+<\/mo><mrow><msub><mi>m<\/mi><mn>2<\/mn><\/msub>&#x22C5;<msub><mi>v<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mrow><mrow><msub><mi>m<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>m<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mfrac><\/mrow>","碰后粘连"],["弹性碰撞中物体一末速度","<mrow><msubsup><mi>v<\/mi><mn>1<\/mn><mo>′<\/mo><\/msubsup><mo>=<\/mo><mfrac><mrow><mrow><mrow><mo>(<\/mo><msub><mi>m<\/mi><mn>1<\/mn><\/msub><mo>−<\/mo><msub><mi>m<\/mi><mn>2<\/mn><\/msub><mo>)<\/mo><\/mrow><msub><mi>v<\/mi><mn>1<\/mn><\/msub><\/mrow><mo>+<\/mo><mrow><mrow><mn>2<\/mn>⁢<msub><mi>m<\/mi><mn>2<\/mn><\/msub><\/mrow>⋅<msub><mi>v<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mrow><mrow><msub><mi>m<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>m<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mfrac><\/mrow>","一维弹性碰撞"]],[["m1","质量一","kg"],["m2","质量二","kg"],["v<sub>1<\/sub>","初速度一","m/s"],["v<sub>2<\/sub>","初速度二","m/s"],["v<sub>1<\/sub>′","碰后速度一","m/s"],["v<sub>2<\/sub>′","碰后速度二","m/s"],["v<sub>共<\/sub>","共同速度","m/s"]],[["认为所有碰撞都保持动能不变","完全非弹性碰撞中部分动能转化为内能；本情境碰前 16 J、碰后仅 8 J，等式明显不成立。"],["直接取初速度平均值","只有两物体质量相等时才碰巧成立；一般情形必须用质量加权平均。"]],"动量守恒不代表动能守恒。弹性碰撞还守恒总动能；非弹性碰撞的动能减少；完全非弹性碰撞后两物体粘连，动能损失达到最大。减少的动能转化为内能等其他形式。",["粘连后末速度相同。","弹性碰撞还守恒动能。","损失动能转化为内能。"],["两辆 2 kg 车以 4、0 m/s 粘连，求共同速度和动能损失。",["共同速度 v=8/4=2 m/s。","动能由 16 J 变为 8 J。"],"2 m/s；损失 8 J。"],["mom-03"],["mom-05","exp-04"],["碰撞"],3,""],["mom-05","反冲运动与火箭","初动量为零且外力冲量可忽略时，两部分向相反方向运动。",[["反冲速度","<mrow><mi>V<\/mi><mo>=<\/mo><mfrac><mrow><mrow><mo>(<\/mo><mo>−<\/mo><mi>m<\/mi><mo>)<\/mo><\/mrow><mi>v<\/mi><\/mrow><mi>M<\/mi><\/mfrac><\/mrow>","初动量为零"],["理想火箭推力","<mrow><mi>F<\/mi><mo>=<\/mo><mrow><mi>μ<\/mi>&#x22C5;<mi>u<\/mi><\/mrow><\/mrow>","稳定喷气"]],[["M","主体质量","kg"],["V","主体速度","m/s"],["m","喷出质量","kg"],["v","喷出速度","m/s"],["F","推力","N"],["μ","质量流率","kg/s"],["u","喷气速率","m/s"]],[["反冲速度漏掉负号，认为主体和喷出物同向","错误式量纲完全正确却把反冲方向算反，会得到 −1 m/s；正确结果应是相反方向的 +1 m/s。"],["把推力写成 F=u/μ","速度除以质量流率的量纲不是力，还会错误地认为喷出质量越多推力越小。"]],"反冲不需要空气作支点，火箭在真空中也能飞。火箭与喷出物组成系统，喷出物向后获得动量，火箭便获得大小相抵、方向向前的动量。",["初动量为零。","由 MV+mv=0 求反冲速度。","单位时间动量变化给出 F=μu。"],["60 kg 平台向左抛出 2 kg 物体，速度 30 m/s，求反冲速度。",["取向右为正，物体动量为 −60。","60V−60=0，得 V=1 m/s。"],"向右 1 m/s。"],["mom-03"],["mom-06"],["反冲"],3,""],["mom-06","动量与能量的综合","由 p=mv 和 Eₖ=mv²/2 得 Eₖ=p²/(2m)，反解得动量大小 p=√(2mEₖ)。",[["由动量求动能","<mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">k<\/mi><\/msub><mo>=<\/mo><mfrac><msup><mi>p<\/mi><mn>2<\/mn><\/msup><mrow><mn>2<\/mn>&#x2062;<mi>m<\/mi><\/mrow><\/mfrac><\/mrow>","质量不变"],["由动能求动量大小","<mrow><mi>p<\/mi><mo>=<\/mo><msqrt><mrow><mrow><mn>2<\/mn>&#x2062;<mi>m<\/mi><\/mrow>&#x22C5;<msub><mi>E<\/mi><mi mathvariant=\"normal\">k<\/mi><\/msub><\/mrow><\/msqrt><\/mrow>","只求大小"]],[["E<sub>k<\/sub>","动能","J"],["p","动量","kg·m/s"],["m","质量","kg"],["v","速率","m/s"]],[["由动能开方求动量时漏掉因子 2","量纲仍正确，只能靠数值发现：会得到 √18，而正确值为 6。"],["漏掉平方，写成 Eₖ=p/(2m)","动量除以质量得到的是速度量纲，再除以常数仍不是能量，因此量纲检查可以直接拦住。"]],"动量是矢量并与速度成正比，动能是标量并与速率平方成正比。碰撞题常先用动量守恒求速度，再比较碰撞前后动能来判断碰撞类型。两者不能因单位或数值相近而混用。",["由 p=mv 得 v=p/m。","代入动能式得 Eₖ=p²/(2m)。","反解得 p=√(2mEₖ)。"],["2 kg 物体动量为 6 kg·m/s，求动能并反算。",["动能 Eₖ=36/4=9 J。","反算 p=√36=6 kg·m/s。"],"9 J；6 kg·m/s。"],["mom-01"],["mdl-08"],["动量与动能"],3,""],["cir-01","线速度、角速度、周期与转速","做圆周运动的物体，线速度大小等于角速度与轨道半径的乘积：v = ωr。",[["线速度与角速度的关系","<mrow><mi>v<\/mi><mo>=<\/mo><mrow><mi>ω<\/mi>&#x22C5;<mi>r<\/mi><\/mrow><\/mrow>","物体绕固定圆心做圆周运动"],["角速度与周期的关系","<mrow><mi>ω<\/mi><mo>=<\/mo><mfrac><mrow><mn>2<\/mn>&#x2062;<mi>π<\/mi><\/mrow><mi>T<\/mi><\/mfrac><\/mrow>","匀速圆周运动转过一整周"]],[["v","线速度大小","m/s"],["ω","角速度","rad/s"],["r","圆周运动半径","m"],["T","运动周期","s"],["n","转速","Hz"]],[["漏掉一周的 2π，把角速度写成 ω = 1/T","量纲仍然正确，只有数值检验能发现少了 2π：本情境会得到约 0.6366 rad/s，而正确值是 4 rad/s。"],["把线速度关系写成 v = ω/r","除法使量纲变成 1/(m·s)，不再是速度；而且会错误地认为同一转盘上离轴越远线速度越小。"]],"同一刚体绕固定轴转动时，各点角速度相同，但离轴越远的点线速度越大。这里的“匀速”只表示速率不变，速度方向一直在变，所以匀速圆周运动仍然是变速运动。",["物体转过圆心角 θ 时，沿圆弧走过的路程 s = rθ。","两边同除以时间，得到 s/t = r(θ/t)，即 v = ωr。","转一周的角位移是 2π rad，用时为 T，所以 ω = 2π/T。","一秒转过的圈数是转速 n，因此 n = 1/T，并可得到 ω = 2πn。"],["转盘以 4 rad/s 的角速度匀速转动，距转轴 2 m 的一点线速度多大？转盘的周期是多少？",["线速度 v = ωr = 4×2 = 8 m/s。","周期 T = 2π/ω = 2π/4 = π/2 s，约为 1.57 s。","线速度方向沿圆周切线，虽然大小不变，但方向持续变化。"],"线速度为 8 m/s；周期为 π/2 s，约 1.57 s。"],["kine-01"],["cir-02","exp-13"],["圆周运动","线速度","角速度","周期"],4,""],["cir-02","向心加速度","做圆周运动的物体具有始终指向圆心的加速度，叫向心加速度。",[["由线速度求向心加速度","<mrow><msub><mi>a<\/mi><mi>c<\/mi><\/msub><mo>=<\/mo><mfrac><msup><mi>v<\/mi><mn>2<\/mn><\/msup><mi>r<\/mi><\/mfrac><\/mrow>","已知线速度与轨道半径"],["由角速度求向心加速度","<mrow><msub><mi>a<\/mi><mi>c<\/mi><\/msub><mo>=<\/mo><mrow><msup><mi>ω<\/mi><mn>2<\/mn><\/msup>&#x22C5;<mi>r<\/mi><\/mrow><\/mrow>","已知角速度与轨道半径"]],[["a<sub>c<\/sub>","向心加速度大小","m/s²"],["v","线速度大小","m/s"],["r","圆周运动半径","m"],["ω","角速度","rad/s"]],[["凭空多除以 2，写成 a<sub>c<\/sub> = v²/(2r)","错误式量纲仍是加速度，量纲检查抓不到。本情境会算成 24 m/s²，正确值是 48 m/s²。"],["漏掉速度的平方，写成 a<sub>c<\/sub> = v/r","v/r 的单位是 1/s，不是加速度单位 m/s²，量纲检查可直接发现。"]],"向心加速度描述速度方向改变的快慢。它不表示物体一定向圆心越跑越近；恰恰是因为它持续把速度方向掰向圆心，轨迹才保持为圆。半径变化时必须先说明保持哪个量不变：保持线速度时半径越大加速度越小，保持角速度时半径越大加速度反而越大。",["匀速圆周运动中，速度大小不变，但相隔很短时间的两个速度矢量方向不同。","由相似三角形可得速度变化量与转过的弧长成正比，取时间趋近于零，得到 a<sub>c<\/sub> = v²/r。","把上一知识点的 v = ωr 代入，得到 a<sub>c<\/sub> = (ωr)²/r = ω²r。","两式对半径给出相反趋势并不矛盾，因为一个保持 v 不变，另一个保持 ω 不变。"],["汽车以 12 m/s 的速率通过半径 3 m 的圆弧，求向心加速度。若速率变为原来的 2 倍而半径不变，加速度怎样变化？",["a<sub>c<\/sub> = v²/r = 12²/3 = 48 m/s²。","速度变为 2 倍，v²变为 4 倍，因此向心加速度变为 192 m/s²。","加速度方向在每一时刻都指向圆心。"],"原向心加速度为 48 m/s²；速度加倍后变为 192 m/s²。"],["cir-01"],["cir-03"],["圆周运动","向心加速度","速度方向"],4,""],["cir-03","向心力及其来源","使物体产生向心加速度、方向指向圆心的合力叫向心力。",[["线速度形式的向心力","<mrow><msub><mi>F<\/mi><mi>c<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><mi>m<\/mi>&#x22C5;<msup><mi>v<\/mi><mn>2<\/mn><\/msup><\/mrow><mi>r<\/mi><\/mfrac><\/mrow>","已知质量、线速度与半径，左边代表径向合力"],["角速度形式的向心力","<mrow><msub><mi>F<\/mi><mi>c<\/mi><\/msub><mo>=<\/mo><mrow><mrow><mi>m<\/mi>&#x22C5;<msup><mi>ω<\/mi><mn>2<\/mn><\/msup><\/mrow>&#x22C5;<mi>r<\/mi><\/mrow><\/mrow>","已知质量、角速度与半径，左边代表径向合力"]],[["F<sub>c<\/sub>","指向圆心的合力大小","N"],["m","物体质量","kg"],["v","线速度大小","m/s"],["r","圆周运动半径","m"],["ω","角速度","rad/s"]],[["把向心力错记成动能形式，写成 F<sub>c<\/sub> = mv²/(2r)","多出的 1/2 不改变量纲，量纲检查抓不到；本情境会得到 12 N，正确径向合力是 24 N。"],["在受力图中除真实的拉力、重力外，再额外画一个向心力","向心力只是径向合力的名称，不是新施力物。额外画它会重复计算，必须通过受力对象与施力物的人工判断纠正。"]],"分析圆周运动时应先画重力、支持力、拉力、摩擦力等真实的力，再沿指向圆心的方向列合力方程。不能在真实受力之外额外画一个“向心力”，否则等于把同一作用重复计算。",["牛顿第二定律给出合力 F<sub>合<\/sub> = ma。","圆周运动的径向加速度为 a<sub>c<\/sub> = v²/r，因此径向合力 F<sub>c<\/sub> = mv²/r。","再用 v = ωr 替换线速度，可得 F<sub>c<\/sub> = mω²r。","式中的 F<sub>c<\/sub> 是各真实力的径向合力，不是在受力图上额外增加的一种力。"],["质量 2 kg 的小球用细绳系着，在半径 3 m 的水平圆周上以 6 m/s 的速率运动。求所需的向心力。",["径向合力大小 F<sub>c<\/sub> = mv²/r。","代入 F<sub>c<\/sub> = 2×6²/3 = 24 N。","若由绳的拉力单独提供向心力，则绳的拉力为 24 N；若还有其他径向力，应把它们先求合力。"],"所需向心力为 24 N，方向指向圆心。"],["cir-02","dyn-05"],["cir-04","mdl-11"],["圆周运动","向心力","受力分析"],4,""],["cir-04","竖直平面内的圆周运动","物体在竖直平面内做圆周运动时，速度和受力通常随位置变化。",[["最高点临界速度","<mrow><msub><mi>v<\/mi><mi mathvariant=\"normal\">min<\/mi><\/msub><mo>=<\/mo><msqrt><mrow><mi>g<\/mi>&#x22C5;<mi>r<\/mi><\/mrow><\/msqrt><\/mrow>","细绳或光滑圆轨道内侧模型在最高点，拉力或支持力恰为零"],["最高点支持力","<mrow><msub><mi>N<\/mi><mi mathvariant=\"normal\">顶<\/mi><\/msub><mo>=<\/mo><mrow><mfrac><mrow><mi>m<\/mi>&#x22C5;<msup><mi>v<\/mi><mn>2<\/mn><\/msup><\/mrow><mi>r<\/mi><\/mfrac><mo>−<\/mo><mrow><mi>m<\/mi>&#x22C5;<mi>g<\/mi><\/mrow><\/mrow><\/mrow>","物体沿圆轨道内侧通过最高点，重力和支持力共同指向圆心"]],[["v<sub>min<\/sub>","最高点保持完整圆周运动的最小速度","m/s"],["v","最高点实际速度","m/s"],["g","重力加速度","m/s²"],["r","圆周半径","m"],["m","物体质量","kg"],["N<sub>顶<\/sub>","最高点轨道对物体的支持力大小","N"]],[["认为最高点临界状态的速度等于零","最高点仍需向心加速度；本情境临界速度约为 7.071 m/s，而不是 0。错误式量纲不暴露问题，需要数值检验。"],["最高点把重力从向心力需求中减掉，写成 N<sub>顶<\/sub> = mv²/r + mg","重力与支持力在最高点同向指向圆心，应相加后等于 mv²/r；移项后支持力应减去 mg。本情境错误式给出 60 N，正确为 20 N。"]],"最高点的“临界”不是速度为零，而是接触力或拉力刚好降到零；重力仍然提供向心力。不同约束模型不能混用：细杆能推也能拉，最高点条件与只能拉不能推的细绳不同。",["在最高点，圆心在物体下方，重力与轨道支持力都指向圆心。","沿指向圆心方向列牛顿第二定律：mg + N<sub>顶<\/sub> = mv²/r。","解得 N<sub>顶<\/sub> = mv²/r − mg。临界状态接触力刚好为零。","令 N<sub>顶<\/sub> = 0，约去质量 m，得到 v² = gr，即 v<sub>min<\/sub> = √(gr)。"],["质量 2 kg 的小球沿半径 5 m 的光滑圆轨道内侧运动，取 g = 10 m/s²。求最高点不脱轨的最小速度；若最高点速度为 10 m/s，轨道支持力多大？",["临界时支持力为零，mg = mv²/r，所以 v<sub>min<\/sub> = √(gr) = √50 ≈ 7.07 m/s。","速度为 10 m/s 时，mg + N<sub>顶<\/sub> = mv²/r。","N<sub>顶<\/sub> = 2×10²/5 − 2×10 = 20 N。"],"最小速度约 7.07 m/s；速度为 10 m/s 时支持力为 20 N。"],["cir-03","ene-06"],["cir-05","mdl-09","met-05"],["竖直圆周运动","最高点","临界条件"],4,""],["cir-05","万有引力定律","任何两个有质量的物体之间都存在相互吸引力。",[["万有引力定律","<mrow><msub><mi>F<\/mi><mi>g<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><mrow><mi>G<\/mi>&#x22C5;<msub><mi>m<\/mi><mn>1<\/mn><\/msub><\/mrow>&#x22C5;<msub><mi>m<\/mi><mn>2<\/mn><\/msub><\/mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mfrac><\/mrow>","两物体可视为质点，或为质量均匀的球体"],["天体表面的重力加速度","<mrow><mi>g<\/mi><mo>=<\/mo><mfrac><mrow><mi>G<\/mi>&#x22C5;<mi>M<\/mi><\/mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mfrac><\/mrow>","忽略天体自转，r 为物体到球形天体中心的距离"]],[["F<sub>g<\/sub>","两个物体间万有引力的大小","N"],["G","万有引力常量","N·m²/kg²"],["m1","物体一的质量","kg"],["m2","物体二的质量","kg"],["M","中心天体质量","kg"],["r","两质点距离或距天体中心的距离","m"],["g","距中心 r 处的重力加速度","m/s²"]],[["把两个物体都产生引力理解成要乘 2，写成 F<sub>g<\/sub> = 2Gm1m2/r²","作用力与反作用力是一对大小相等的力，求其中一个的大小不能相加。错误式量纲完全正确，但本情境会算成 2.668×10⁻⁶ N，是正确值的两倍。"],["计算地面上方物体的引力时，只把离地高度当作 r","公式中的 r 是到地心的距离，应等于地球半径与离地高度之和。这个错误取决于题目对位置的描述，需人工审核距离基准。"]],"距离 r 是两个质点之间的距离；对于质量均匀的球体，可取两球心之间的距离。万有引力遵守平方反比关系：距离变为 2 倍，引力变为原来的 1/4。地表附近的重力，是地球对物体万有引力的近似表现。",["实验与天文观测表明，引力分别与两个物体质量成正比，与距离平方成反比。","引入比例常量 G，得到 F<sub>g<\/sub> = Gm1m2/r²。","地表附近质量为 m 的物体满足 mg = GMm/r²。","约去物体质量 m，得到 g = GM/r²，说明自由落体加速度与下落物体自身质量无关。"],["两个质量分别为 1000 kg 和 2000 kg 的物体相距 10 m，取 G = 6.67×10⁻¹¹ N·m²/kg²，求它们之间的万有引力。",["两物体可视为质点，使用 F<sub>g<\/sub> = Gm1m2/r²。","代入 F<sub>g<\/sub> = 6.67×10⁻¹¹×1000×2000÷10²。","得到 F<sub>g<\/sub> = 1.334×10⁻⁶ N，方向沿两物体连线且相互吸引。"],"万有引力大小为 1.334×10⁻⁶ N。"],["dyn-02","cir-03"],["cir-06","mdl-12"],["万有引力","平方反比","重力加速度"],4,""],["cir-06","天体运动与人造卫星","质量为 m 的卫星绕质量为 M 的中心天体做半径 r 的圆周运动时，万有引力提供向心力，可得轨道速度 v<sub>轨<\/sub> = √(GM/r)，周期 T<sub>轨<\/sub> = 2π√(r³/GM)。",[["圆轨道速度","<mrow><msub><mi>v<\/mi><mi mathvariant=\"normal\">轨<\/mi><\/msub><mo>=<\/mo><msqrt><mfrac><mrow><mi>G<\/mi>&#x22C5;<mi>M<\/mi><\/mrow><mi>r<\/mi><\/mfrac><\/msqrt><\/mrow>","卫星绕球形中心天体做圆周运动，忽略其他天体影响"],["圆轨道周期","<mrow><msub><mi>T<\/mi><mi mathvariant=\"normal\">轨<\/mi><\/msub><mo>=<\/mo><mrow><mrow><mn>2<\/mn>&#x2062;<mi>π<\/mi><\/mrow>&#x22C5;<msqrt><mfrac><msup><mi>r<\/mi><mn>3<\/mn><\/msup><mrow><mi>G<\/mi>&#x22C5;<mi>M<\/mi><\/mrow><\/mfrac><\/msqrt><\/mrow><\/mrow>","卫星绕球形中心天体做圆周运动"]],[["v<sub>轨<\/sub>","圆轨道速度","m/s"],["T<sub>轨<\/sub>","圆轨道周期","s"],["G","万有引力常量","N·m²/kg²"],["M","中心天体质量","kg"],["r","卫星到中心天体中心的距离","m"]],[["把逃逸速度公式误当圆轨道速度，写成 v<sub>轨<\/sub> = √(2GM/r)","两式量纲完全相同，量纲检查抓不到；本近地情境会得到约 11183 m/s，比正确圆轨道速度 7908 m/s 大 √2 倍。"],["认为周期等于地球自转周期的卫星，无论轨道平面和方向如何都能静止在某地上空","地球静止卫星除周期相同外，还必须位于赤道平面、沿圆轨道且与地球自转同向。该条件组合需要人工审核。"]],"圆轨道越高，速度越小而周期越长。地球同步卫星的周期与地球自转周期相同；若还要相对地面某点静止，则必须沿赤道上空、与地球自转同向做圆周运动，这种卫星叫地球静止卫星。",["圆轨道中由万有引力提供向心力：GMm/r² = mv²/r。","约去卫星质量 m 并整理，得到 v<sub>轨<\/sub> = √(GM/r)，说明轨道速度与卫星自身质量无关。","再用圆周运动周期关系 v = 2πr/T，代入轨道速度。","整理得到 T<sub>轨<\/sub> = 2π√(r³/GM)，因此轨道半径越大，周期越长。"],["把地球质量近似取 6.0×10²⁴ kg、半径取 6.4×10⁶ m，求贴近地面的圆轨道速度。取 G = 6.67×10⁻¹¹ N·m²/kg²。",["万有引力提供向心力，轨道速度 v = √(GM/r)。","代入 v = √(6.67×10⁻¹¹×6.0×10²⁴÷6.4×10⁶)。","得到 v ≈ 7.91×10³ m/s = 7.91 km/s，这就是第一宇宙速度的近似值。"],"近地圆轨道速度约为 7.9 km/s。"],["cir-05","cir-03"],["cir-07","cir-08","mdl-13","cir-09","cir-10"],["人造卫星","第一宇宙速度","同步卫星","轨道周期"],4,""],["cir-07","开普勒三定律","开普勒第一定律：行星沿椭圆轨道运动，太阳位于一个焦点。",[["面积速度","<mrow><msub><mi>A<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><mrow><mrow><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac>⁢<mi>r<\/mi><\/mrow>⋅<msub><mi>v<\/mi><mi>t<\/mi><\/msub><\/mrow><\/mrow>","短时间内用半径与速度的切向分量计算扫过面积；开普勒第二定律说明该值不变"],["开普勒第三定律的引力形式","<mrow><mi>T<\/mi><mo>=<\/mo><mrow><mrow><mn>2<\/mn>&#x2062;<mi>π<\/mi><\/mrow>&#x22C5;<msqrt><mfrac><msup><mi>a<\/mi><mn>3<\/mn><\/msup><mrow><mi>G<\/mi>&#x22C5;<mi>M<\/mi><\/mrow><\/mfrac><\/msqrt><\/mrow><\/mrow>","质量远小于中心天体、绕同一中心天体运行；a 为轨道半长轴"]],[["A<sub>t<\/sub>","单位时间扫过的面积，即面积速度","m²/s"],["r","天体到中心天体的瞬时距离","m"],["v<sub>t<\/sub>","速度在垂直于径向方向的分量","m/s"],["T","轨道周期","s"],["a","椭圆轨道半长轴","m"],["G","万有引力常量","N·m²/kg²"],["M","中心天体质量","kg"]],[["把周期公式中的 2π漏成 π，写成 T = π√(a³/GM)","错误式量纲仍是时间，量纲检查抓不到；本情境会得到正确周期的一半，约 1.585×10⁷ s。"],["认为行星沿椭圆轨道做速率不变的运动","等面积定律要求近日点速度较大、远日点速度较小；只有面积速度保持不变。该概念需结合轨道位置人工审核。"]],"第二定律意味着行星近日点运动快、远日点运动慢，而不是沿椭圆匀速运动。第三定律比较不同轨道时必须保证中心天体相同；圆轨道只是椭圆轨道的特殊情况，此时半长轴就等于圆轨道半径。",["很短时间 Δt 内，行星与太阳连线扫过的面积近似为三角形面积 ΔA = rv<sub>t<\/sub>Δt/2。","同除以 Δt，得到面积速度 A<sub>t<\/sub> = rv<sub>t<\/sub>/2；开普勒第二定律说明它沿同一轨道保持不变。","对圆轨道，由万有引力提供向心力可推出 T² = 4π²r³/(GM)。","推广到椭圆轨道时，用半长轴 a 代替圆半径，得到 T = 2π√(a³/GM)，这就是第三定律的引力形式。"],["某行星绕恒星做椭圆运动。它在近日点和远日点的面积速度是否相同？速度大小如何比较？",["按开普勒第二定律，相等时间内扫过面积相等，所以近日点和远日点的面积速度相同。","在近日点，行星到恒星距离较小。为了在相同时间扫过同样面积，它必须运动得更快。","在远日点距离较大，速度较小。因此保持不变的是面积速度，不是线速度大小。"],"两处面积速度相同；近日点速度大于远日点速度。"],["cir-05","cir-06"],["mdl-14"],["开普勒定律","椭圆轨道","面积速度","周期定律"],4,""],["cir-08","三种宇宙速度","第一宇宙速度v<sub>1<\/sub>=√(GM地/R地)是近地圆轨道速度；第二宇宙速度v<sub>2<\/sub>=√(2GM地/R地)是忽略其他天体时逃离地球的速率。",[["第一宇宙速度","<mrow><msub><mi>v<\/mi><mn>1<\/mn><\/msub><mo>=<\/mo><msqrt><mfrac><mrow><mi>G<\/mi>&#x22C5;<mi>M<\/mi><\/mrow><mi>R<\/mi><\/mfrac><\/msqrt><\/mrow>","贴近地表的理想圆轨道，忽略地球自转"],["第二宇宙速度","<mrow><msub><mi>v<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><msqrt><mfrac><mrow><mrow><mn>2<\/mn>&#x2062;<mi>G<\/mi><\/mrow>&#x22C5;<mi>M<\/mi><\/mrow><mi>R<\/mi><\/mfrac><\/msqrt><\/mrow>","从地表到无穷远恰好速度为零，忽略其他天体"],["地表引力代换","<mrow><mi>g<\/mi><mo>=<\/mo><mfrac><mrow><mi>G<\/mi>&#x22C5;<mi>M<\/mi><\/mrow><msup><mi>R<\/mi><mn>2<\/mn><\/msup><\/mfrac><\/mrow>","同一天体表面，忽略自转修正"],["逃逸能量临界","<mrow><mi>E<\/mi><mo>=<\/mo><mrow><mrow><mrow><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac>⁢<mi>m<\/mi><\/mrow>⋅<msup><msub><mi>v<\/mi><mn>2<\/mn><\/msub><mn>2<\/mn><\/msup><\/mrow><mo>−<\/mo><mfrac><mrow><mrow><mi>G<\/mi>⋅<mi>M<\/mi><\/mrow>⋅<mi>m<\/mi><\/mrow><mi>R<\/mi><\/mfrac><\/mrow><\/mrow>","无穷远势能零，恰能逃逸时总机械能为零"],["地球公转速度","<mrow><msub><mi>v<\/mi><mi>E<\/mi><\/msub><mo>=<\/mo><msqrt><mfrac><mrow><mi>G<\/mi>&#x22C5;<msub><mi>M<\/mi><mi mathvariant=\"normal\">sun<\/mi><\/msub><\/mrow><msub><mi>r<\/mi><mi mathvariant=\"normal\">轨<\/mi><\/msub><\/mfrac><\/msqrt><\/mrow>","地球近似作太阳圆轨道运动，忽略其他天体影响"],["太阳逃逸所需地心余速","<mrow><msub><mi>v<\/mi><mi mathvariant=\"normal\">inf<\/mi><\/msub><mo>=<\/mo><mrow><msqrt><mfrac><mrow><mrow><mn>2<\/mn>&#x2062;<mi>G<\/mi><\/mrow>&#x22C5;<msub><mi>M<\/mi><mi mathvariant=\"normal\">sun<\/mi><\/msub><\/mrow><msub><mi>r<\/mi><mi mathvariant=\"normal\">轨<\/mi><\/msub><\/mfrac><\/msqrt><mo>−<\/mo><msub><mi>v<\/mi><mi>E<\/mi><\/msub><\/mrow><\/mrow>","发射方向与地球公转同向，目标是在日心系达到太阳逃逸临界"],["第三宇宙速度近似","<mrow><msub><mi>v<\/mi><mn>3<\/mn><\/msub><mo>=<\/mo><msqrt><mrow><msup><msub><mi>v<\/mi><mn>2<\/mn><\/msub><mn>2<\/mn><\/msup><mo>+<\/mo><msup><msub><mi>v<\/mi><mi mathvariant=\"normal\">inf<\/mi><\/msub><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow>","地表以有利方向发射，先克服地球引力，再获得所需日心超速；忽略空气、自转和行星助推"]],[["G","万有引力常量","N·m²/kg²"],["M","地球质量","kg"],["R","地球半径","m"],["g","地表重力加速度","m/s²"],["m","发射物质量","kg"],["v<sub>1<\/sub>","第一宇宙速度","m/s"],["v<sub>2<\/sub>","第二宇宙速度","m/s"],["E","取无穷远势能为零的机械能","J"],["M<sub>s<\/sub>un","太阳质量","kg"],["r<sub>轨<\/sub>","地球绕太阳近似圆轨道半径","m"],["v<sub>E<\/sub>","地球公转轨道速度","m/s"],["v<sub>入<\/sub>f","相对地球的太阳逃逸双曲余速","m/s"],["v<sub>3<\/sub>","第三宇宙速度理想近似值","m/s"]],[["第二宇宙速度直接取第一的两倍","第二速度的平方是第一速度平方的两倍，开平方后系数应为根号二；把能量倍数直接当速度倍数会把发射要求明显算大。"],["把地球公转速率直接当作太阳逃逸所需余速","逃逸所需是√2vE−vE的相对余速，不是整段地球公转速度；误用会把第三宇宙速度算高。"],["把第三宇宙速度写成只由地球参数决定的固定根号系数","第三宇宙速度取决于太阳引力、日地距离和发射方向；没有说明这些条件时，不能从第一、第二宇宙速度直接猜系数。"]],"前两种速度由地球引力和地表初始条件确定。第三种还需太阳质量、日地距离和发射方向：地球公转速率vE=√(GM日/r)，地球轨道处太阳逃逸所需速率为√2vE；沿地球公转方向发射时，相对地球的太阳逃逸余速v∞=(√2−1)vE。忽略行星助推、空气阻力、地球自转和摄动时，地表发射速度v<sub>3<\/sub>=√(v<sub>2<\/sub>²+v∞²)，约16.7 km/s。方向不利时所需发射速度更大。",["近地圆轨道令万有引力提供向心力，得到v<sub>1<\/sub>=√(GM地/R地)。","从地表到无穷远恰好速度趋零，机械能守恒得到v<sub>2<\/sub>=√(2GM地/R地)=√2v<sub>1<\/sub>。","地球绕太阳圆轨道速率为√(GM日/r)，太阳逃逸速率为其√2倍；沿地球公转方向发射，所需相对地球余速为两者之差。","地表还需提供逃离地球的双曲余速v∞，地球引力能量方程给v<sub>3<\/sub>²=v<sub>2<\/sub>²+v∞²；代入标准参数约16.7 km/s。"],["取地球质量6.0×10²⁴ kg、半径6.4×10⁶ m，太阳质量1.989×10³⁰ kg、日地距离1.496×10¹¹ m，估算三种宇宙速度。",["v<sub>1<\/sub>=√(GM地/R地)≈7.91 km/s，v<sub>2<\/sub>=√2v<sub>1<\/sub>≈11.18 km/s。","地球公转速率约29.8 km/s，太阳逃逸余速约(√2−1)×29.8≈12.3 km/s。","同向有利发射下v<sub>3<\/sub>≈√(11.18²+12.3²) km/s，约16.7 km/s。"],"第一约7.91 km/s，第二约11.18 km/s，第三约16.7 km/s。"],["cir-05","cir-06"],[],["三种宇宙速度","环绕速度","逃逸速度","脱离太阳系","黄金代换"],4,""],["cir-09","近地卫星、同步卫星与赤道上物体的比较","赤道地面物体受到的支持力不是纯万有引力，因为地球自转需要向心加速度。",[["赤道地面表观重力","<mrow><mi>g<\/mi><mo>=<\/mo><mrow><msub><mi>g<\/mi><mn>0<\/mn><\/msub><mo>−<\/mo><mrow><msup><mi>ω<\/mi><mn>2<\/mn><\/msup>&#x22C5;<mi>R<\/mi><\/mrow><\/mrow><\/mrow>","球形地球模型，忽略地形与扁率，地面物体随地球转动"],["近地理想圆轨道速度","<mrow><mi>v<\/mi><mo>=<\/mo><msqrt><mrow><msub><mi>g<\/mi><mn>0<\/mn><\/msub>&#x22C5;<mi>R<\/mi><\/mrow><\/msqrt><\/mrow>","半径近似地球半径，无空气、无支持力，使用纯引力而非表观重力"],["近地理想轨道周期","<mrow><mi>T<\/mi><mo>=<\/mo><mrow><mrow><mn>2<\/mn>&#x2062;<mi>π<\/mi><\/mrow>&#x22C5;<msqrt><mfrac><mi>R<\/mi><msub><mi>g<\/mi><mn>0<\/mn><\/msub><\/mfrac><\/msqrt><\/mrow><\/mrow>","近地圆轨道近似，不能推广到任意高度或椭圆轨道"],["同步卫星地心距离","<mrow><msup><msub><mi>r<\/mi><mi>s<\/mi><\/msub><mn>3<\/mn><\/msup><mo>=<\/mo><mfrac><mrow><mrow><mi>G<\/mi>&#x22C5;<mi>M<\/mi><\/mrow>&#x22C5;<msup><msub><mi>T<\/mi><mi>s<\/mi><\/msub><mn>2<\/mn><\/msup><\/mrow><mrow><mn>4<\/mn>&#x2062;<msup><mi>π<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mrow>","赤道平面、同向圆轨道、周期等于恒星日，模型不考虑摄动"]],[["g","赤道地面支持力每单位质量对应的表观重力加速度","m/s²"],["g<sub>0<\/sub>","半径R处纯引力加速度，理想近地模型取10","m/s²"],["ω","地球自转角速度","rad/s"],["R","理想模型的地球半径","m"],["v","近地理想圆轨道速度","m/s"],["T","近地理想圆轨道周期","s"],["r<sub>s<\/sub>","同步圆轨道的地心距离","m"],["T<sub>s<\/sub>","地球自转的恒星日周期","s"],["G","万有引力常量","N·m²/kg²"],["M","地球质量参数","kg"]],[["忽略自转时误把表观重力加速度写成相加","地面支持力只需要补足引力之外的径向受力差，自转占用了部分引力；加号会使赤道表观重力比纯引力还大，方向错误且量纲正确。"],["同步卫星可以停在任意纬度地点正上方","自由圆轨道的轨道面通过地心，要与地面保持同一方向就必须在赤道平面并同向同周期；非赤道地点不能由普通同步卫星直接定点悬在正上方。"]],"近地卫星、同步卫星和赤道地面物体都有角速度，但轨道半径、周期和所受支持力不同。同步卫星必须在赤道平面、与地球同向且周期等于恒星日，三条件共同固定其高度，不能任意停在城市正上方。近地卫星周期约84分钟仅为忽略大气、按地球参数估算的理想圆轨道结果，并非可贴地飞行。",["赤道地面物体画引力向心、支持力向外，二者之差提供自转所需向心力。","近地卫星没有地面支持力，全部万有引力用于轨道向心运动，不能直接套地面表观重力。","周期用轨道周长除轨道速度，近地地球参数给出约84分钟的估算。","同步条件取恒星日而非直接声称精确24小时，再用万有引力与圆周运动求唯一地心半径；高度还要减去地球半径。"],["用球形地球近似，半径6.4×10⁶ m，半径处纯引力加速度10 m/s²，估算近地圆轨道卫星速度和周期。",["万有引力提供向心加速度，轨道速度为平方根下10×6.4×10⁶，得到8000 m/s。","周期为2π×6.4×10⁶/8000=1600π s，约5026.55 s，再换成约83.78 min。"],"理想近地速度8.0 km/s，周期约83.78分钟；忽略大气且不能把它理解为贴地轨道。"],["cir-05","cir-06"],["cir-07","mdl-12"],["同步卫星","近地卫星","赤道","万有引力与重力"],4,""],["cir-10","三星系统：等质量正三角形模型","三个相等质量的质点天体位于正三角形顶点，以恰当相同角速度绕共同质心运动，可以保持三角形构型。",[["绕质心半径","<mrow><mi>r<\/mi><mo>=<\/mo><mfrac><mi>d<\/mi><msqrt><mn>3<\/mn><\/msqrt><\/mfrac><\/mrow>","三颗质量相等，几何为严格正三角形"],["每颗天体所受合力","<mrow><mi>F<\/mi><mo>=<\/mo><mfrac><mrow><mrow><msqrt><mn>3<\/mn><\/msqrt>&#x22C5;<mi>G<\/mi><\/mrow>&#x22C5;<msup><mi>m<\/mi><mn>2<\/mn><\/msup><\/mrow><msup><mi>d<\/mi><mn>2<\/mn><\/msup><\/mfrac><\/mrow>","两份引力夹角为60度，按矢量合成"],["对称构型角速度","<mrow><mi>ω<\/mi><mo>=<\/mo><msqrt><mfrac><mrow><mrow><mn>3<\/mn>&#x2062;<mi>G<\/mi><\/mrow>&#x22C5;<mi>m<\/mi><\/mrow><msup><mi>d<\/mi><mn>3<\/mn><\/msup><\/mfrac><\/msqrt><\/mrow>","每颗受合引力作圆周运动，初速度须满足此条件"],["对称构型周期","<mrow><mi>T<\/mi><mo>=<\/mo><mrow><mrow><mn>2<\/mn>&#x2062;<mi>π<\/mi><\/mrow>&#x22C5;<msqrt><mfrac><msup><mi>d<\/mi><mn>3<\/mn><\/msup><mrow><mrow><mn>3<\/mn>&#x2062;<mi>G<\/mi><\/mrow>&#x22C5;<mi>m<\/mi><\/mrow><\/mfrac><\/msqrt><\/mrow><\/mrow>","三颗质量相等的特殊正三角形圆周解"]],[["G","万有引力常量","N·m²/kg²"],["m","每颗天体相同的质量","kg"],["d","三角形边长，亦为两颗天体间距","m"],["r","各天体绕共同质心的圆周半径","m"],["F","另两颗天体产生的引力合力","N"],["ω","刚性旋转构型的共同角速度","rad/s"],["T","共同绕行周期","s"]],[["把两份引力直接标量相加","两份引力夹角为六十度，不能直接当作同向；正确合力为根号三倍单份引力，直接相加会高估但量纲正确。"],["把边长当成绕质心圆周半径","引力分母使用天体间距，向心加速度使用天体到共同质心的半径；两个距离相差根号三，不能在同一道式中互换。"]],"这是牛顿引力下严格对称的特殊圆周解，不代表任意三星系统都保持正三角形，更不能据此声称构型对扰动稳定。等质量时质心在三角形中心，圆周半径是边长除根号三；两引力夹角为六十度，合力系数为根号三。初速度、质量和几何不满足条件时需重新研究动力学，不能把另外两颗简单合成放在中心的总质量。",["利用等质量对称性找到共同质心，并区分边长与圆周半径。","每颗天体受另外两颗吸引，画出60度夹角并作矢量合成。","令合引力提供质心圆周运动的向心力，得到共同角速度和周期。","说明这是精确对称初始条件下的特殊解，扰动稳定性不由代入几条圆周公式判定。"],["三颗质量相等的天体形成边长d的正三角形，求其保持对称圆周构型的角速度与两引力的合力系数。",["每颗绕行半径为边长除根号三，两份引力夹角60度，合力为根号三倍单份引力。","用合力等于质量乘角速度平方再乘圆周半径，得到角速度平方为三倍引力常量乘单颗质量除边长立方。"],"角速度为根号下三倍引力常量乘单颗质量除边长立方；合力系数为根号三。"],["cir-05","cir-06","dyn-04"],["mdl-14"],["三星","正三角形","特殊圆周解"],4,""],["osc-01","简谐运动的描述","物体的位移随时间按正弦或余弦规律变化的运动叫简谐运动。",[["简谐运动位移","<mrow><mi>x<\/mi><mo>=<\/mo><mrow><mi>A<\/mi>&#x22C5;<mrow><mi mathvariant=\"normal\">cos<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mrow><mrow><mi>ω<\/mi>&#x22C5;<mi>t<\/mi><\/mrow><mo>+<\/mo><mi>φ<\/mi><\/mrow><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","以平衡位置为原点、给定初相位时"],["角频率与周期","<mrow><mi>ω<\/mi><mo>=<\/mo><mfrac><mrow><mn>2<\/mn>&#x2062;<mi>π<\/mi><\/mrow><mi>T<\/mi><\/mfrac><\/mrow>","周期运动中角频率与周期的换算"]],[["x","相对平衡位置的位移","m"],["A","振幅","m"],["ω","角频率","rad/s"],["t","时间","s"],["φ","初相位","rad"],["T","周期","s"]],[["把余弦型振动误写成 x=A sin(ω t+φ)，却仍沿用原初相位","正弦和余弦都能描述简谐运动，但互换函数时必须同步调整初相位。本情境 t=0、φ=0，错误式给出 0，正确初始位移是 0.2 m；两式量纲相同，只能靠数值代入识别。"],["把角频率写成 ω = T/(2π)","量纲由 1/s 错成 s；周期 0.5 s 时数值也不会是 4π rad/s。"]],"位移 x 总是相对平衡位置测量，可正可负；振幅 A 是最大位移的大小，恒为非负。相位决定物体处在一次振动的哪个阶段，不能只凭位置判断运动方向。",["一次全振动相位增加 2π，历时一个周期 T，因此 ω·T=2π。","把 ω=2π/T 代入位移式，时间增加 T 后相位恰好增加 2π，位移重复。","余弦函数的值介于 -1 与 1 之间，所以位移满足 -A &lt;= x &lt;= A。"],["振子按 x=0.2cos(2π t) m 振动，求振幅、周期和 t=0 时位移。",["A=0.2 m。","ω=2π rad/s，所以 T=2π/ω=1 s。","t=0 时 x=0.2 m。"],"振幅 0.2 m，周期 1 s，初始位移 0.2 m。"],["cir-01"],["osc-02"],["简谐运动","振幅","周期","相位"],5,""],["osc-02","简谐运动的回复力与能量","简谐运动的回复力总指向平衡位置，且大小与位移成正比：F<sub>回复<\/sub> = -k x。",[["简谐运动回复力","<mrow><msub><mi>F<\/mi><mi mathvariant=\"normal\">回复<\/mi><\/msub><mo>=<\/mo><mrow><mrow><mo>(<\/mo><mo>−<\/mo><mi>k<\/mi><mo>)<\/mo><\/mrow><mi>x<\/mi><\/mrow><\/mrow>","位移从平衡位置量起、回复力满足线性规律"],["弹簧振子总机械能","<mrow><mi>E<\/mi><mo>=<\/mo><mrow><mrow><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac>⁢<mi>k<\/mi><\/mrow>⋅<msup><mi>A<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mrow>","无阻力的理想弹簧振子"]],[["F<sub>回复<\/sub>","回复力的代数值","N"],["k","回复力系数或弹簧劲度系数","N/m"],["x","相对平衡位置的位移","m"],["A","振幅","m"],["E","振动总机械能","J"]],[["漏掉回复力的负号，写成 F<sub>回复<\/sub>=kx","这会让力指向远离平衡位置的方向；正向位移情境会算出 +10 N，而正确值是 -10 N。"],["把总能量写成 E=kA²，漏掉二分之一","量纲仍是焦耳，量纲检查抓不到；情境中会得到 2 J，而独立参考值为 1 J。"]],"负号表示回复力与位移方向相反，不表示力的大小为负。振子在端点势能最大、速度为零；在平衡位置动能最大、弹性势能最小。理想模型忽略阻力，所以总机械能不随时间变化。",["在线性回复力模型中，力的大小为 k|x|，方向总与位移相反，因此写成 F<sub>回复<\/sub>=-kx。","从平衡位置移动到端点时，回复力大小由 0 线性增到 kA，力—位移图像面积为 kA²/2。","端点速度为零，全部机械能为弹性势能 kA²/2；无阻力时这就是任意时刻的总能量。"],["劲度系数 200 N/m 的弹簧振子振幅为 0.10 m。位移为 +0.05 m 时求回复力和总机械能。",["回复力 F=-kx=-200×0.05=-10 N。","总能量 E=kA²/2=200×0.10²/2=1 J。"],"回复力 -10 N（指向平衡位置），总机械能 1 J。"],["osc-01","dyn-01","ene-05"],["osc-03","osc-08"],["回复力","弹簧振子","机械能"],5,""],["osc-03","单摆","细线长度远大于摆球尺寸、线的质量可忽略且不可伸长的摆叫单摆。",[["单摆周期","<mrow><mi>T<\/mi><mo>=<\/mo><mrow><mrow><mn>2<\/mn>&#x2062;<mi>π<\/mi><\/mrow>&#x22C5;<msqrt><mfrac><mi>L<\/mi><mi>g<\/mi><\/mfrac><\/msqrt><\/mrow><\/mrow>","小角度摆动、阻力可忽略的理想单摆"],["单摆频率","<mrow><mi>f<\/mi><mo>=<\/mo><mfrac><mn>1<\/mn><mi>T<\/mi><\/mfrac><\/mrow>","由周期换算每秒全振动次数"]],[["T","单摆周期","s"],["L","悬点到摆球重心的摆长","m"],["g","当地重力加速度","m/s²"],["f","振动频率","Hz"]],[["漏掉系数 2，把周期写成 T=π √(L/g)","量纲完全正确但数值少一半；一米单摆会算成约 1.00354 s，而正确值约 2.00709 s。"],["把细线长度直接当摆长，忽略摆球半径","摆长应从悬点量到摆球重心。若只取细线长度，会系统性低估 L 和周期；属于建模与测量错误。"]],"周期公式只适用于小角度近似，通常要求摆角不超过约 5° 到 10°。摆长是悬点到摆球重心的距离，不是细线裸长。周期与摆球质量无关，也不能据此断言大角度时仍完全不变。",["小角度时 sin(θ)≈θ，切向回复作用与弧长近似成正比，单摆近似简谐运动。","单摆的等效角频率为 √(g/L)，再用 T=2π/ω 得到周期公式。","公式中没有质量，所以在理想、小角度条件下，单摆周期与摆球质量无关。"],["一理想单摆摆长 1.00 m，取 g=9.8 m/s²，小角度摆动。求周期和频率。",["T=2π √(1/9.8)≈2.007 s。","f=1/T≈0.498 Hz。"],"周期约 2.01 s，频率约 0.498 Hz。"],["osc-01","osc-02"],["osc-04","exp-18"],["单摆","周期公式","小角度"],5,""],["osc-04","受迫振动与共振","系统在周期性驱动力作用下的振动叫受迫振动；稳定后振动频率等于驱动力频率。",[["固有频率与固有周期","<mrow><msub><mi>f<\/mi><mn>0<\/mn><\/msub><mo>=<\/mo><mfrac><mn>1<\/mn><msub><mi>T<\/mi><mn>0<\/mn><\/msub><\/mfrac><\/mrow>","系统自由振动特性的周期与频率换算"],["驱动力角频率","<mrow><msub><mi>ω<\/mi><mi mathvariant=\"normal\">驱<\/mi><\/msub><mo>=<\/mo><mrow><mrow><mn>2<\/mn>&#x2062;<mi>π<\/mi><\/mrow>&#x22C5;<msub><mi>f<\/mi><mi mathvariant=\"normal\">驱<\/mi><\/msub><\/mrow><\/mrow>","驱动力普通频率与角频率换算"]],[["f<sub>0<\/sub>","系统固有频率","Hz"],["T<sub>0<\/sub>","系统固有周期","s"],["f<sub>驱<\/sub>","驱动力频率","Hz"],["ω<sub>驱<\/sub>","驱动力角频率","rad/s"]],[["把驱动力角频率写成 ω<sub>驱<\/sub>=π·f<sub>驱<\/sub>，漏掉系数 2","错误式量纲仍然正确，量纲检查无法发现。未调谐情境中它只得到约 9.425 rad/s，正确的 2π f 应为约 18.850 rad/s。"],["认为受迫振动稳定后的频率始终等于固有频率","稳定受迫振动的频率由驱动力决定；固有频率决定在什么驱动频率附近响应最强。"]],"共振条件比较的是频率，而不是振幅。阻尼越小，共振峰通常越高、越尖；阻尼越大，峰值越低、范围越宽。工程上既可利用共振增强响应，也要通过改变固有频率、增大阻尼等方法避免破坏性共振。",["受迫振动稳定后由外界驱动力控制节奏，所以振动频率等于驱动力频率。","固有周期 T<sub>0<\/sub> 内完成一次自由振动，因此固有频率是其倒数 f<sub>0<\/sub>=1/T<sub>0<\/sub>。","当驱动节奏与固有频率相近时，连续输入的能量更有效地积累，振幅出现峰值。"],["某振动系统固有周期 0.50 s，外力以 2.0 Hz 周期性驱动。判断是否满足理想共振的频率条件。",["固有频率 f<sub>0<\/sub>=1/T<sub>0<\/sub>=2.0 Hz。","驱动力频率也为 2.0 Hz，两者相等。"],"满足理想共振的频率条件；实际峰值还受阻尼影响。"],["osc-01"],["osc-05"],["受迫振动","固有频率","共振","阻尼"],5,""],["osc-05","机械波的形成与传播","机械振动在介质中的传播形成机械波。",[["波的传播速度","<mrow><mi>v<\/mi><mo>=<\/mo><mfrac><mi>s<\/mi><mi>t<\/mi><\/mfrac><\/mrow>","均匀介质中波形在时间 t 内传播距离 s"],["一个周期传播的距离","<mrow><mi>λ<\/mi><mo>=<\/mo><mrow><mi>v<\/mi>&#x22C5;<mi>T<\/mi><\/mrow><\/mrow>","波在一个振动周期内向前传播一个波长"]],[["v","机械波传播速度","m/s"],["s","波形传播距离","m"],["t","传播时间","s"],["λ","波长","m"],["T","波源周期","s"]],[["误认为半个周期传播一个波长，写成 λ=2vT","错误式量纲仍是长度，量纲检查抓不到；绳波情境会算出 4 m，而一个完整周期内传播的正确距离是 2 m。"],["认为介质质点会随波从波源一直移动到远处","质点只在平衡位置附近振动；向外传播的是振动状态和能量。可用漂浮物随水波上下振动但不持续随波前进来辨别。"]],"波源先振动，邻近质点受相互作用带动，再依次带动更远质点，因此各质点重复波源的振动但相位依次滞后。波速由介质性质决定；改变波源频率通常不会直接改变同一均匀介质中的波速。",["介质中相邻质点依靠相互作用依次开始振动，使振动状态和能量向外传播。","波形在时间 t 内传播距离 s，平均传播速度为 s/t。","一个周期 T 后，波源回到原振动状态，波形向前推进的距离定义为一个波长，因此 λ=vT。"],["绳上波形 3.0 s 传播 24 m，波源周期 0.25 s。求波速和波长。",["v=s/t=24/3=8 m/s。","λ=vT=8×0.25=2 m。"],"波速 8 m/s，波长 2 m。"],["osc-01"],["osc-06"],["机械波","横波","纵波","介质"],5,""],["osc-06","波长、频率、波速与波的现象","波速、波长和频率满足 v = λ f。",[["波速关系","<mrow><mi>v<\/mi><mo>=<\/mo><mrow><mi>λ<\/mi>&#x22C5;<mi>f<\/mi><\/mrow><\/mrow>","周期性机械波在均匀介质中传播"],["同相波源加强点的路程差","<mrow><mi>Δ<\/mi><mi>r<\/mi><mo>=<\/mo><mrow><mi>n<\/mi>&#x22C5;<mi>λ<\/mi><\/mrow><\/mrow>","两个同频、同相相干波源产生干涉加强，n 为非负整数"]],[["v","波速","m/s"],["λ","波长","m"],["f","频率","Hz"],["Δr","两列波到达某点的路程差","m"],["n","非负整数级次","—"]],[["把波速关系多写一个系数 2，写成 v=2 λ f","错误式与正确式量纲完全相同，量纲检查抓不到；同相水波会算出 16 m/s，而由传播距离独立测得的正确波速是 8 m/s。"],["认为频率越高，波在同一介质中一定传播得越快","在高中常见的均匀、非色散介质模型中，波速主要由介质决定。波源频率升高时通常是波长缩短，使 λ f 仍等于原波速。"]],"波从一种介质进入另一种介质时，频率由波源决定并保持不变，介质改变波速，于是波长随之改变。干涉和衍射不是波速公式的附加条件，而是波的叠加与传播特征；稳定干涉还要求频率相同、相位差恒定。",["一个周期内波传播一个波长，所以 v=λ/T；又因为 f=1/T，代入得 v=λ·f。","波跨介质边界时振源频率不变，若波速改变，则波长按 λ=v/f 随之改变。","同相波源到某点的路程差为整波长时，相位差为 2π 的整数倍，两列波同相叠加而加强。"],["某均匀介质中机械波频率 4 Hz、波长 2 m；两个同相波源产生干涉。求波速及路程差为 6 m 的点对应的加强级次。",["v=λ f=2×4=8 m/s。","Δr=n λ，所以 n=6/2=3。"],"波速 8 m/s，该点对应第 3 级加强。"],["osc-05"],["mdl-30","osc-07"],["波速","波长","频率","干涉","衍射"],5,""],["osc-07","多普勒效应","声源与观察者相对介质运动，会改变观察者每秒接收到的波峰数。",[["沿线运动的接收频率","<mrow><msub><mi>f<\/mi><mi>p<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><mi>f<\/mi><mrow><mo>(<\/mo><mi>c<\/mi><mo>+<\/mo><msub><mi>v<\/mi><mi>o<\/mi><\/msub><mo>)<\/mo><\/mrow><\/mrow><mrow><mi>c<\/mi><mo>−<\/mo><msub><mi>v<\/mi><mi>s<\/mi><\/msub><\/mrow><\/mfrac><\/mrow>","使用本卡两种速度的正负约定，介质静止且双方亚声速"],["前方介质中的波长","<mrow><msub><mi>λ<\/mi><mn>0<\/mn><\/msub><mo>=<\/mo><mfrac><mrow><mi>c<\/mi><mo>−<\/mo><msub><mi>v<\/mi><mi>s<\/mi><\/msub><\/mrow><mi>f<\/mi><\/mfrac><\/mrow>","声源沿观察者方向运动，波长在介质参考系测量"]],[["f","声源发射频率","Hz"],["f<sub>p<\/sub>","观察者接收频率","Hz"],["c","介质参考系中的声速","m/s"],["v<sub>s<\/sub>","声源向观察者的速度分量，远离取负","m/s"],["v<sub>o<\/sub>","观察者向声源的速度分量，远离取负","m/s"],["λ<sub>0<\/sub>","声源前方介质中的相邻波峰间距","m"],["T<sub>p<\/sub>","观察者接收相邻波峰的时间间隔","s"]],[["接近的声源把分母写成声速加声源速度","声源接近压缩前方波峰间距，分母必须减去向前速度；加号会把接近误算为频率降低，量纲仍然正确。"],["认为声源移动使介质中的声速随之改变","声源改变发射位置和波峰间距，波峰离开声源后仍按介质条件决定的声速传播；应区分波速与观察者接收频率。"]],"声速由介质条件决定，不能把声源速度直接加给声速。声源运动改变相邻波峰在介质中的间距，观察者运动改变接收波峰的速率；两者作用位置不同。本卡规定声源速度向观察者为正、观察者速度向声源为正，使用介质参考系且速率低于声速，不能套到相对论光学或超声速情形。",["固定介质参考系并写清声源和观察者速度的方向约定。","相邻两次发射间隔不变，但第二次发射位置改变，先求介质中的波峰间距。","观察者接收波峰速率由相对波峰的运动决定，接收频率等于波峰接收速度除间距。"],["900 Hz声源沿直线以34 m/s接近静止观察者，介质声速340 m/s，求接收频率。",["前方相邻波峰间距为(340−34)/900=0.34 m。","观察者每秒接收340/0.34=1000个波峰。"],"接收频率1000 Hz，高于声源频率。"],["osc-05","osc-06"],["osc-08"],["多普勒","声源运动","接收频率"],5,""],["osc-08","阻尼振动","阻尼使振动机械能逐渐转化为内能，振幅随时间减小。",[["振幅衰减率","<mrow><mi>β<\/mi><mo>=<\/mo><mfrac><mi>b<\/mi><mrow><mn>2<\/mn>&#x2062;<mi>m<\/mi><\/mrow><\/mfrac><\/mrow>","线性黏性阻尼模型，质量严格为正"],["欠阻尼角频率","<mrow><mi>ω<\/mi><mo>=<\/mo><msqrt><mrow><mfrac><mi>k<\/mi><mi>m<\/mi><\/mfrac><mo>−<\/mo><msup><mi>β<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow>","弹性频率平方大于衰减率平方，临界以上不可套用"],["振幅指数包络","<mrow><mi>A<\/mi><mo>=<\/mo><mrow><msub><mi>A<\/mi><mn>0<\/mn><\/msub>⋅<mrow><mi>e<\/mi><mo>⁡<\/mo><mo>(<\/mo><mrow><mrow><mo>(<\/mo><mo>−<\/mo><mi>β<\/mi><mo>)<\/mo><\/mrow><mi>t<\/mi><\/mrow><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","只表示包络，不是含振动相位的瞬时位移"]],[["m","振子质量","kg"],["k","弹簧劲度系数","N/m"],["b","线性阻力系数，阻力与速度相反","kg/s"],["β","振幅包络衰减率","s⁻¹"],["ω","欠阻尼振动角频率","rad/s"],["A<sub>0<\/sub>","初始振幅包络","m"],["A","时刻t的振幅包络","m"],["t","经过时间","s"]],[["衰减率漏掉分母中的二","线性阻力项对应位移解的指数衰减率是阻力系数除两倍质量；漏掉二会把振幅减半时间缩短一半，量纲却仍一致。"],["认为只要有弹簧就必然来回振荡","回复力的存在不足以保证反复振荡；阻尼过大时系统可以不越过平衡位置，本卡角频率根式只适用于欠阻尼。"]],"阻尼振动不是振幅恒定的简谐运动。线性黏性阻尼模型中，频率和振幅包络分别由弹性、质量与阻力系数决定，只有欠阻尼才可使用本卡振动角频率；临界阻尼与过阻尼不再反复过平衡点。实际瞬时机械能并非严格等于一个无相位的简单指数，不能把振幅包络直接当作瞬时位移。",["建立回复力和反向线性阻力的模型，先确认阻力适用范围。","求得振幅衰减率并比较其平方与无阻尼角频率平方，判定欠阻尼。","把包络乘周期振动因子才能得到位移；实验可由相邻峰值的比值测衰减率。"],["1 kg弹簧振子弹性系数26 N/m、线性阻力系数2 kg/s，初振幅包络0.10 m，求欠阻尼角频率和经过ln2秒后的包络。",["衰减率为1 s⁻¹，角频率平方为26−1=25，角频率5 rad/s。","包络指数因子为1/2，因此包络0.05 m，不能把它直接称作该时刻位移。"],"角频率5 rad/s，振幅包络0.05 m。"],["osc-01","osc-02"],["osc-04"],["阻尼振动","欠阻尼","振幅包络"],5,""],["ele-01","电荷、电荷守恒与元电荷","自然界存在正、负两种电荷，同种电荷相斥、异种电荷相吸。",[["两物体系统的总电荷","<mrow><msub><mi>q<\/mi><mi mathvariant=\"normal\">总<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>q<\/mi><mi>A<\/mi><\/msub><mo>+<\/mo><msub><mi>q<\/mi><mi>B<\/mi><\/msub><\/mrow><\/mrow>","把孤立系统简化为两个带电物体并按正负号作代数相加"],["电荷量子化","<mrow><mi>q<\/mi><mo>=<\/mo><mrow><mi>N<\/mi>&#x22C5;<mi>e<\/mi><\/mrow><\/mrow>","求物体电荷量的大小，N 必须是非负整数"]],[["q<sub>总<\/sub>","孤立系统的总电荷量","C"],["q<sub>A<\/sub>","物体 A 的电荷量","C"],["q<sub>B<\/sub>","物体 B 的电荷量","C"],["q","物体所带电荷量的大小","C"],["N","元电荷的个数，为非负整数","—"],["e","元电荷","C"]],[["把异号电荷的绝对值相加，误认为系统总电荷是 |q<sub>A<\/sub>|+|q<sub>B<\/sub>|","电荷守恒比较代数和。接触前错误式得到 4.8 μC，正确总电荷只有 1.6 μC。"],["把量子化关系写成 q=N/e","N/e 的量纲是 1/C，不是电荷量 C，量纲检查可以直接发现。"]],"电荷守恒比较的是带正负号的代数和，不是各物体电荷量绝对值之和。摩擦起电和感应起电都没有创造电荷，只是电子发生转移或重新分布。元电荷 e=1.60×10⁻¹⁹ C 是电荷量的基本单位，电子带 -e，质子带 +e。",["选定一个与外界没有电荷交换的系统，把系统内各物体电荷量按正负号代数相加。","系统内部即使发生电子转移，一方失去多少负电荷，另一方就得到多少负电荷，因此代数和不变。","实验表明物体电荷量不是连续任取的，而是元电荷 e 的整数倍，所以电荷量大小可写成 q=Ne。"],["两个绝缘金属小球原来分别带 +3.2 μC 和 -1.6 μC，接触后分开。求系统总电荷，并判断这一过程是否创造了电荷。",["按代数和计算：q<sub>总<\/sub>=3.2-1.6=1.6 μC。","接触只使电子在两球之间转移，系统总电荷不变。","这些电荷量都对应整数个元电荷，符合电荷量子化。"],"系统总电荷为 +1.6 μC；没有创造电荷。"],[],["ele-02"],["电荷","电荷守恒","元电荷","量子化"],6,""],["ele-02","库仑定律","真空中两个静止点电荷之间静电力的大小，与两电荷量大小的乘积成正比，与它们距离的平方成反比，具体机器可读表达式见下方公式卡。",[["库仑力大小","<mrow><mi>F<\/mi><mo>=<\/mo><mfrac><mrow><msub><mi>k<\/mi><mi>e<\/mi><\/msub>&#x22C5;<mrow><mo>|<\/mo><mrow><msub><mi>q<\/mi><mn>1<\/mn><\/msub>&#x22C5;<msub><mi>q<\/mi><mn>2<\/mn><\/msub><\/mrow><mo>|<\/mo><\/mrow><\/mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mfrac><\/mrow>","真空中两个静止点电荷，r 为两者距离"],["由库仑力反求距离","<mrow><mi>r<\/mi><mo>=<\/mo><msqrt><mfrac><mrow><msub><mi>k<\/mi><mi>e<\/mi><\/msub>&#x22C5;<mrow><mo>|<\/mo><mrow><msub><mi>q<\/mi><mn>1<\/mn><\/msub>&#x22C5;<msub><mi>q<\/mi><mn>2<\/mn><\/msub><\/mrow><mo>|<\/mo><\/mrow><\/mrow><mi>F<\/mi><\/mfrac><\/msqrt><\/mrow>","已知两点电荷的电荷量和库仑力大小，反求正距离"]],[["F","两点电荷间静电力的大小","N"],["k<sub>e<\/sub>","静电力常量","N·m²/C²"],["q<sub>1<\/sub>","第一个点电荷的电荷量","C"],["q<sub>2<\/sub>","第二个点电荷的电荷量","C"],["r","两点电荷之间的距离","m"]],[["直接用 q<sub>1<\/sub>q<sub>2<\/sub> 的正负决定力的大小，得到负的力大小","公式中的 F 是大小，不能为负。异号情境错误式给出 -0.60 N；吸引或排斥应在方向判断中处理。"],["漏掉距离的平方，写成 F=k<sub>e<\/sub>|q<sub>1<\/sub>q<sub>2<\/sub>|/r","量纲变为 N·m，不是力；异号点电荷情境中还会算出 0.18，而正确值是 0.60 N。"]],"库仑定律和万有引力定律在数学结构上都是平方反比定律：距离变为原来的 2 倍，力变为原来的 1/4。不同之处是电荷有正负，静电力可以吸引也可以排斥；质量在经典高中模型中只有正值，万有引力只表现为吸引。库仑定律直接用于可视为点电荷的静止带电体。",["实验表明，在电荷量和介质不变时，静电力满足 F 与 1/r² 成正比。","固定距离时，力与两个电荷量大小的乘积成正比，引入静电力常量 k<sub>e<\/sub> 得到大小公式。","大小公式使用绝对值；方向必须另行根据同号相斥、异号相吸并沿连线判断。","量纲检核：N·m²/C² 乘 C² 再除以 m²，结果为 N。"],["真空中两个点电荷分别为 +2.0 μC 和 -3.0 μC，相距 0.30 m，取 k<sub>e<\/sub>=9.0×10⁹ N·m²/C²。求静电力大小和性质。",["先换单位：2.0 μC=2.0×10⁻⁶ C，3.0 μC=3.0×10⁻⁶ C。","把两个电荷量的大小和距离代入库仑定律：9.0×10⁹×6.0×10⁻¹²/0.09=0.60 N。","两电荷异号，因此相互吸引，力沿两电荷连线。"],"静电力大小 0.60 N，性质为吸引力。"],["ele-01","cir-05"],["ele-03"],["库仑定律","点电荷","平方反比","方向判断"],6,""],["ele-03","电场强度","电场强度描述电场的力的性质，定义为正试探电荷在某点受到的电场力 F 与其电荷量 q<sub>试探<\/sub> 的比值：E=F/q<sub>试探<\/sub>。",[["电场强度定义式","<mrow><mi>E<\/mi><mo>=<\/mo><mfrac><mi>F<\/mi><msub><mi>q<\/mi><mi mathvariant=\"normal\">试探<\/mi><\/msub><\/mfrac><\/mrow>","用足够小的正试探电荷测量某点场强大小"],["点电荷场强大小","<mrow><mi>E<\/mi><mo>=<\/mo><mfrac><mrow><msub><mi>k<\/mi><mi>e<\/mi><\/msub>&#x22C5;<mrow><mo>|<\/mo><mi>Q<\/mi><mo>|<\/mo><\/mrow><\/mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mfrac><\/mrow>","真空中点电荷 Q 在距离 r 处产生的电场"]],[["E","电场强度的大小","N/C"],["F","正试探电荷受到的电场力大小","N"],["q<sub>试探<\/sub>","正试探电荷的电荷量","C"],["k<sub>e<\/sub>","静电力常量","N·m²/C²"],["Q","场源点电荷的电荷量","C"],["r","场点到场源点电荷的距离","m"]],[["把负点电荷的场强大小算成负数，写成 E=k<sub>e<\/sub>Q/r²","式子量纲完全正确，量纲检查抓不到；负点电荷情境会算出 -4.0×10⁵ N/C，但场强大小应为正的 4.0×10⁵ N/C，方向另行判断。"],["把场强定义式写成 E=Fq<sub>试探<\/sub>","右边的单位变成 N·C，而电场强度的单位应为 N/C；两者基本量纲不同，量纲检查会直接拦住这一乘除颠倒。"]],"电场强度由场源电荷和空间位置决定，与拿来测量的试探电荷无关。定义中规定用正试探电荷确定方向：正电荷受力方向就是场强方向，负电荷受力方向与场强相反。试探电荷应足够小，以免显著改变原电场。",["在同一场点放入不同的足够小正试探电荷，所受电场力 F 与 q<sub>试探<\/sub> 成正比。","比值 F/q<sub>试探<\/sub> 与试探电荷本身无关，因此用它定义该点电场强度。","把库仑力 F=k<sub>e<\/sub>|Qq<sub>试探<\/sub>|/r² 除以正的 q<sub>试探<\/sub>，得到点电荷场强 E=k<sub>e<\/sub>|Q|/r²。"],["在某点放入 +2.0 μC 的试探电荷，它受到 0.040 N 的电场力。求该点场强大小；若改用更小的正试探电荷，该点场强是否改变？",["E=F/q<sub>试探<\/sub>=0.040/(2.0×10⁻⁶)=2.0×10⁴ N/C。","场强由原有场源和位置决定，不由试探电荷决定。","更换足够小的试探电荷会使所受力同比例改变，但 F/q<sub>试探<\/sub> 不变。"],"场强为 2.0×10⁴ N/C；更换试探电荷后该点场强不变。"],["ele-02"],["ele-04","ele-05"],["电场强度","试探电荷","点电荷场强"],6,""],["ele-04","电场线与场强叠加","电场线是为形象描述电场而画出的假想曲线，曲线上每点的切线方向表示该点场强方向，疏密定性表示场强强弱。",[["一维电场叠加","<mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">合<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>E<\/mi><mi>A<\/mi><\/msub><mo>+<\/mo><msub><mi>E<\/mi><mi>B<\/mi><\/msub><\/mrow><\/mrow>","各分场强共线，先规定正方向并用代数值表示方向"],["点电荷场强的一维方向式","<mrow><msub><mi>E<\/mi><mi>x<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><mrow><msub><mi>k<\/mi><mi>e<\/mi><\/msub>&#x22C5;<mi>Q<\/mi><\/mrow>&#x22C5;<mi>x<\/mi><\/mrow><msup><mrow><mo>|<\/mo><mi>x<\/mi><mo>|<\/mo><\/mrow><mn>3<\/mn><\/msup><\/mfrac><\/mrow>","点电荷位于坐标原点且场点在同一坐标轴上，x 不为零"]],[["E<sub>合<\/sub>","选定一维正方向后的合场强","N/C"],["E<sub>A<\/sub>","场源 A 在场点产生的场强分量","N/C"],["E<sub>B<\/sub>","场源 B 在场点产生的场强分量","N/C"],["E<sub>x<\/sub>","点电荷在一维坐标轴上产生的场强分量","N/C"],["k<sub>e<\/sub>","静电力常量","N·m²/C²"],["Q","场源点电荷的带符号电荷量","C"],["x","从场源指向场点的一维位移","m"]],[["叠加反向场强时把大小直接相加","场强是矢量。情境中错误式得 5.0×10⁵ N/C，带方向相加的正确结果为 3.0×10⁵ N/C。"],["认为负点电荷周围的场强也一律背离电荷","绝对值抹掉了场源电荷的符号。负电荷右侧错误式给出 +1.0×10⁵ N/C，而场强实际向左，为 -1.0×10⁵ N/C。"]],"电场线不是带电粒子的必然运动轨迹，也不是客观存在的细线。做叠加时必须先选正方向，再把各场强写成带正负号的分量；方向相反的场强应相减，不能一律把大小相加。正点电荷的场线向外，负点电荷的场线向内。",["电场对正试探电荷的作用具有方向，因此场强是矢量，多个场源共同存在时遵守矢量叠加。","在一维问题中选定正方向后，矢量叠加可化为带符号的代数相加。","点电荷场强大小为 k<sub>e<\/sub>|Q|/x²；式 k<sub>e<\/sub>Qx/|x|³ 同时编码了电荷正负和场点位于左右哪一侧。","电场线切线只表示场强方向；若两条电场线相交，同一点就会出现两个场强方向，因此电场线不能相交。"],["某点受到两个共线分场：A 产生向右 4.0×10⁵ N/C，B 产生向左 1.0×10⁵ N/C。求合场强。",["规定向右为正，则 E<sub>A<\/sub>=+4.0×10⁵ N/C，E<sub>B<\/sub>=-1.0×10⁵ N/C。","E<sub>合<\/sub>=E<sub>A<\/sub>+E<sub>B<\/sub>=3.0×10⁵ N/C。","结果为正，所以方向向右。"],"合场强大小为 3.0×10⁵ N/C，方向向右。"],["ele-03","dyn-04"],["ele-05"],["电场线","矢量叠加","点电荷场","方向"],6,""],["ele-05","匀强电场","各点电场强度大小相等、方向相同的电场叫匀强电场，可用等间距、互相平行且同向的电场线表示。",[["匀强电场中的电场力大小","<mrow><msub><mi>F<\/mi><mi>e<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>q<\/mi><mi>m<\/mi><\/msub>&#x22C5;<mi>E<\/mi><\/mrow><\/mrow>","已知带电体电荷量大小与所在处场强大小"],["仅受电场力时的加速度大小","<mrow><mi>a<\/mi><mo>=<\/mo><mfrac><mrow><msub><mi>q<\/mi><mi>m<\/mi><\/msub>&#x22C5;<mi>E<\/mi><\/mrow><mi>m<\/mi><\/mfrac><\/mrow>","带电体在匀强电场中仅受电场力，忽略重力及其他力"]],[["F<sub>e<\/sub>","电场力的大小","N"],["q<sub>m<\/sub>","带电体电荷量的大小","C"],["q","带正负号的电荷量","C"],["E","匀强电场的场强大小","N/C"],["a","只受电场力时的加速度大小","m/s²"],["m","带电体质量","kg"]],[["求电场力大小时直接代入负电荷的带符号电荷量，得到负的力大小","负号只能表示方向，力的大小不能为负。负带电小球错误式得 -0.006 N，正确大小为 0.006 N。"],["由电场力求加速度时把质量乘到分子，写成 a=q<sub>m<\/sub> E m","量纲变成 N·kg，不是 m/s²；也违背同样力下质量越大加速度越小。"]],"匀强电场强调的是空间不同位置的场强相同，不是所有带电体受力都相同。电场力还与电荷量成正比；正电荷受力沿场强方向，负电荷受力逆场强方向。若只受电场力，带电体在匀强电场中做匀变速运动，可与牛顿第二定律直接衔接。",["由场强定义式移项可知，电荷量大小为 q<sub>m<\/sub> 的带电体受力大小 F<
