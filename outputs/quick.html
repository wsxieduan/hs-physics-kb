3cmi>E\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>U\u003c/mi>\u003cmi>d\u003c/mi>\u003c/mfrac>\u003c/mrow>","匀强电场中 d 大于零，已知两点电势差大小和沿场方向有效距离"]],[["U","匀强电场中两点电势差的大小","V"],["E","匀强电场的场强大小","N/C"],["d","两点位移沿电场方向的投影大小","m"],["D\u003csub>路\u003c/sub>","电荷实际经过的路径长度，仅用于辨析，不能代替 d","m"]],[["把电荷实际走过的弯曲路径长度当成 d","d 是两点位移沿电场方向的投影，不是路程。情境中用 0.25 m 会算出 500 V，正确结果是 300 V。"],["把乘法写成除法，误记为 U=E/d","右边单位为 V/m²，不是电势差应有的 V；同时还会错误地预言距离越大电势差越小，量纲检查会直接拦住。"]],"式 U=Ed 只直接适用于匀强电场并使用沿场强方向的有效距离。它说明沿电场方向电势均匀降低，场强数值等于每米降低的电势，单位 V/m 与 N/C 等价。垂直电场方向移动时有效距离为零，两点位于同一等势面。",["匀强电场中，静电力大小为 F=|q|E；沿场方向移动有效距离 d 时，功的大小为 W=|q|Ed。","另一方面，静电力功大小等于 |q|U。两式相等并约去非零的 |q|，得到 U=Ed。","因此 E=U/d，单位 V/m 与 N/C 等价；若位移不沿电场方向，d 只能取沿场方向投影。"],["某匀强电场场强为 2.0×10³ N/C，A、B 两点沿场强方向的距离为 0.15 m。电荷从 A 到 B 实际沿一条 0.25 m 的弯曲路径移动。求两点电势差大小。",["U=Ed 中的 d 取两点位移沿场强方向的投影，不取实际路径长度。","代入 E=2.0×10³ N/C、d=0.15 m。","U=2.0×10³×0.15=300 V。","路径弯曲不影响两点电势差，也不影响静电力总功。"],"两点电势差大小为 300 V。"],["ele-05","pot-04","pot-05"],[],["匀强电场","电势差","场强","有效距离"],7],["cap-01","电容器与电容","电容器是由彼此绝缘又相互靠近的两个导体组成的储能元件。",[["电容的定义式","\u003cmrow>\u003cmsub>\u003cmi>C\u003c/mi>\u003cmi mathvariant=\"normal\">容\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>Q\u003c/mi>\u003cmi>U\u003c/mi>\u003c/mfrac>\u003c/mrow>","线性电容器，Q 取任一极板电荷量的绝对值，U 为两板电压"],["电荷量与电压的关系","\u003cmrow>\u003cmi>Q\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>C\u003c/mi>\u003cmi mathvariant=\"normal\">容\u003c/mi>\u003c/msub>&#x22C5;\u003cmi>U\u003c/mi>\u003c/mrow>\u003c/mrow>","电容器在线性工作范围内，电容 C\u003csub>容\u003c/sub> 已知"]],[["C\u003csub>容\u003c/sub>","电容器的电容","C/V"],["Q","任一极板所带电荷量的绝对值","C"],["U","两极板间的电势差","V"]],[["把两块极板的电荷量绝对值相加，误写成 C\u003csub>容\u003c/sub> = 2Q/U","错误式与正确式量纲完全相同，量纲检查抓不到。电容定义中的 Q 只取任一极板电荷量的绝对值；代入小型电容器情境会误得 4 μF，正确值是 2 μF。"],["把电容定义式倒写成 C\u003csub>容\u003c/sub> = U/Q","U/Q 的量纲是 V/C，与电容的 C/V 互为倒数，量纲检查可以直接发现。"]],"定义式 C\u003csub>容\u003c/sub> = Q/U 很像“比值决定量”，但不能据此说电容随 Q 增大而增大。对同一个线性电容器，Q 与 U 同比例变化，比值始终不变。这里的 Q 是任一极板所带电荷量的绝对值，两极板分别带 +Q 和 −Q，并不是把两块极板的电荷量相加。",["实验表明，对同一个线性电容器，多次充电得到的 Q 与 U 成正比。","把比例系数定义为电容 C\u003csub>容\u003c/sub>，就有 Q = C\u003csub>容\u003c/sub> U，移项得 C\u003csub>容\u003c/sub> = Q/U。","电容的单位 C/V 叫法拉，符号 F；1 μF = 10⁻⁶ F。","比值 Q/U 不随同一个电容器的充电状态改变，因此电容反映的是结构属性，而不是‘现有电荷多少’。"],["一个电容器两极板间电压为 12 V 时，一块极板带 +24 μC 电荷。求电容；若电压升至 20 V，求极板电荷量。",["取任一极板电荷量的绝对值 Q = 24 μC = 2.4×10⁻⁵ C。","由 C\u003csub>容\u003c/sub> = Q/U 得 C\u003csub>容\u003c/sub> = 2.4×10⁻⁵ ÷ 12 = 2×10⁻⁶ F，即 2 μF。","电容由结构决定，不因这次调压而改变。","由 Q = C\u003csub>容\u003c/sub> U 得新电荷量 Q = 2 μF × 20 V = 40 μC。"],"电容为 2 μF；电压升至 20 V 后，任一极板电荷量的绝对值为 40 μC。"],["pot-05"],["cap-02"],["电容器","电容","充电"],8],["cap-02","平行板电容器与动态分析","平行板电容器的电容 C\u003csub>容\u003c/sub> = ε\u003csub>r\u003c/sub> S/(4πk\u003csub>e\u003c/sub> d)。",[["平行板电容器电容","\u003cmrow>\u003cmsub>\u003cmi>C\u003c/mi>\u003cmi mathvariant=\"normal\">容\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>e\u003c/mi>\u003cmi>r\u003c/mi>\u003c/msub>&#x22C5;\u003cmi>S\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmrow>\u003cmrow>\u003cmn>4\u003c/mn>&#x2062;\u003cmi>π\u003c/mi>\u003c/mrow>&#x22C5;\u003cmsub>\u003cmi>k\u003c/mi>\u003cmi>e\u003c/mi>\u003c/msub>\u003c/mrow>&#x22C5;\u003cmi>d\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>","忽略边缘效应的平行板电容器"],["断开电源后的电压","\u003cmrow>\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmrow>\u003cmrow>\u003cmrow>\u003cmn>4\u003c/mn>&#x2062;\u003cmi>π\u003c/mi>\u003c/mrow>&#x22C5;\u003cmsub>\u003cmi>k\u003c/mi>\u003cmi>e\u003c/mi>\u003c/msub>\u003c/mrow>&#x22C5;\u003cmi>d\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>Q\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>e\u003c/mi>\u003cmi>r\u003c/mi>\u003c/msub>&#x22C5;\u003cmi>S\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>","电容器断开电源、极板电荷量 Q 不变，再改变结构"]],[["C\u003csub>容\u003c/sub>","平行板电容器的电容","C/V"],["e\u003csub>r\u003c/sub>","电介质的相对介电常数 ε\u003csub>r\u003c/sub>","—"],["S","两极板的正对面积","m²"],["k\u003csub>e\u003c/sub>","静电力常量","N·m²/C²"],["d","两极板间距离","m"],["Q","断开电源后保持不变的极板电荷量绝对值","C"],["U","两极板间电势差","V"]],[["漏掉球面几何带来的 4π 因子，误写成 C\u003csub>容\u003c/sub> = εS/(k\u003csub>e\u003c/sub> d)","错误式与正确式量纲完全相同，量纲检查抓不到。代入插入介质情境会得到约 2.222×10⁻⁶ F，是正确值 1.7684×10⁻⁷ F 的 4π 倍。"],["电容器断开电源后拉大板间距，仍认为电压 U 不变","断开电源后保持不变的是 Q，不是 U。结构式显示 d 增大使 C\u003csub>容\u003c/sub> 减小，由 U=Q/C\u003csub>容\u003c/sub> 可知 U 必须增大；这类边界条件判断需人工审核。"]],"动态分析必须先判断电容器是否与电源相连：接着电源时 U 保持不变，结构改变先改变 C\u003csub>容\u003c/sub>，再由 Q=C\u003csub>容\u003c/sub> U 判断 Q；断开电源后没有电荷进出，Q 保持不变，结构改变先改变 C\u003csub>容\u003c/sub>，再由 U=Q/C\u003csub>容\u003c/sub> 判断 U。把这两个边界条件混用，是本节最常见也最致命的错误。",["平行板间近似为匀强电场，板的正对面积越大，能够容纳的异号电荷越多，因此 C\u003csub>容\u003c/sub> 与 S 成正比。","板间距增大时，同样电荷造成的电压更高，因此 C\u003csub>容\u003c/sub> 与 d 成反比；插入介质会削弱同样电荷产生的场，使电容增大 ε\u003csub>r\u003c/sub> 倍。","综合比例关系并采用静电力常量 k\u003csub>e\u003c/sub> 的写法，得到 C\u003csub>容\u003c/sub> = ε\u003csub>r\u003c/sub> S/(4πk\u003csub>e\u003c/sub> d)。","断开电源后 Q 不变，把 C\u003csub>容\u003c/sub> 的结构式代入 U=Q/C\u003csub>容\u003c/sub>，得到 U=4πk\u003csub>e\u003c/sub> dQ/(ε\u003csub>r\u003c/sub> S)。"],["一个平行板电容器充电后与电源断开。保持正对面积和介质不变，把板间距增大为原来的 2 倍。判断电容、电荷量和电压怎样变化。",["先判断边界条件：已经断开电源，没有电荷进出，所以 Q 保持不变。","由 C\u003csub>容\u003c/sub> = ε\u003csub>r\u003c/sub> S/(4πk\u003csub>e\u003c/sub> d)，d 变为 2 倍，电容变为原来的 1/2。","由 U=Q/C\u003csub>容\u003c/sub>，Q 不变而 C\u003csub>容\u003c/sub> 变为 1/2，电压变为原来的 2 倍。","如果电容器仍接着恒压电源，才是 U 不变、Q 随 C\u003csub>容\u003c/sub> 减小；两种情形不可混用。"],"电容变为原来的 1/2，电荷量不变，电压变为原来的 2 倍。"],["cap-01","pot-06"],["cap-03"],["平行板电容器","动态分析","边界条件"],8],["cap-03","带电粒子在电场中的加速","带电粒子沿电场线进入加速电场时，静电力做功改变粒子的动能。",[["电场力做功与动能增量","\u003cmrow>\u003cmsub>\u003cmi>ΔE\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmi mathvariant=\"normal\">大小\u003c/mi>\u003c/msub>&#x22C5;\u003cmi>U\u003c/mi>\u003c/mrow>\u003c/mrow>","U 取粒子沿电场力方向通过的电势差大小，只讨论加速过程"],["加速后的速度","\u003cmrow>\u003cmi>v\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsqrt>\u003cmrow>\u003cmsup>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmrow>\u003cmn>2\u003c/mn>&#x2062;\u003cmsub>\u003cmi>q\u003c/mi>\u003cmi mathvariant=\"normal\">大小\u003c/mi>\u003c/msub>\u003c/mrow>&#x22C5;\u003cmi>U\u003c/mi>\u003c/mrow>\u003cmi>m\u003c/mi>\u003c/mfrac>\u003c/mrow>\u003c/msqrt>\u003c/mrow>","忽略重力等其他力，粒子沿电场力方向加速"]],[["ΔE\u003csub>k\u003c/sub>","粒子动能的增加量","J"],["E\u003csub>k\u003c/sub>","粒子的动能","J"],["q\u003csub>大小\u003c/sub>","粒子电荷量的绝对值","C"],["U","沿加速方向通过的电势差大小","V"],["m","粒子质量","kg"],["v\u003csub>0\u003c/sub>","粒子初速度大小","m/s"],["v","粒子末速度大小","m/s"]],[["有初速度时仍写 v = √(2q_abs U/m)，漏掉初动能","错误式量纲正确，量纲检查抓不到。代入情境得到 20 m/s，而包含 10 m/s 初速度后的正确结果是 √500≈22.36 m/s。"],["把电场力做功写成 W = q\u003csub>大小\u003c/sub>/U","C/V 不是能量单位 J，量纲检查会直接发现；正确关系是电荷量乘电压。"]],"电场加速题优先用动能定理，而不是先求加速度再套运动学公式，因为 q\u003csub>大小\u003c/sub> U 只与始末位置有关，不需要知道电场是否均匀、加速距离多长。方向判断仍必须单独做：正电荷受力沿电场方向，负电荷受力逆电场方向；这里使用绝对值公式只计算速率和动能的增加量。",["静电力做功的大小为 W=q\u003csub>大小\u003c/sub> U；加速过程中 W 为正。","由动能定理 W=ΔE\u003csub>k\u003c/sub>，得到 ΔE\u003csub>k\u003c/sub>=q\u003csub>大小\u003c/sub> U。","再写成 q\u003csub>大小\u003c/sub> U = 1/2 m v² − 1/2 m v\u003csub>0\u003c/sub>²。","移项并取速度大小，得到 v=√(v\u003csub>0\u003c/sub>²+2q_abs U/m)。这个结论不要求加速电场是匀强电场。"],["质量 3.0×10⁻³ kg、带电荷量绝对值 2.0×10⁻³ C 的小球，以 10 m/s 初速度沿电场力方向进入加速电场，通过 300 V 电势差。忽略其他力，求末速度。",["电场力做正功 W=q\u003csub>大小\u003c/sub> U=0.002×300=0.6 J。","由动能定理：q\u003csub>大小\u003c/sub> U=1/2 m v²−1/2 m v\u003csub>0\u003c/sub>²。","整理得 v²=v\u003csub>0\u003c/sub>²+2q_abs U/m=100+400=500。","所以 v=√500≈22.36 m/s。"],"末速度约为 22.36 m/s。"],["pot-05","ene-03"],["cap-04","cap-05"],["带电粒子","电场加速","动能定理"],8],["cap-04","带电粒子在匀强电场中的偏转","带电粒子以垂直于电场线的初速度进入匀强电场，若忽略重力，沿初速度方向做匀速直线运动，沿电场力方向做初速度为零的匀加速运动，合运动与平抛运动完全同构。",[["粒子在板间的运动时间","\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>L\u003c/mi>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mfrac>\u003c/mrow>","粒子初速度垂直于电场，水平方向不受力"],["粒子离开极板时的偏移量","\u003cmrow>\u003cmi>y\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmrow>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmi mathvariant=\"normal\">大小\u003c/mi>\u003c/msub>&#x22C5;\u003cmi>E\u003c/mi>\u003c/mrow>&#x22C5;\u003cmsup>\u003cmi>L\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003cmrow>\u003cmrow>\u003cmn>2\u003c/mn>&#x2062;\u003cmi>m\u003c/mi>\u003c/mrow>&#x22C5;\u003cmsup>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mfrac>\u003c/mrow>","匀强偏转电场，初速度垂直于电场，忽略重力"]],[["t","粒子在偏转电场中的运动时间","s"],["L","偏转极板沿初速度方向的长度","m"],["v\u003csub>0\u003c/sub>","粒子垂直于电场方向的初速度","m/s"],["y","粒子离开极板时沿电场力方向的偏移量大小","m"],["q\u003csub>大小\u003c/sub>","粒子电荷量绝对值","C"],["E","板间匀强电场的场强","N/C"],["m","粒子质量","kg"]],[["偏转位移漏掉 1/2，写成 y = q\u003csub>大小\u003c/sub> E L²/(m v\u003csub>0\u003c/sub>²)","错误式量纲仍是长度，量纲检查无能为力；代入情境得到 0.2 m，正确值是 0.1 m，数值检查能抓住系数错误。"],["把板间运动时间写成 t = v\u003csub>0\u003c/sub>/L","(m/s)/m 的量纲是 1/s，不是时间，量纲检查直接拦住。"]],"分解运动是偏转题的核心：水平方向用 L=v\u003csub>0\u003c/sub> t 决定粒子在板间停留多久，竖直方向用 a=q\u003csub>大小\u003c/sub> E/m 和 y=at²/2 求偏移量。负电荷的实际偏转方向与电场方向相反；本节公式用 q\u003csub>大小\u003c/sub> 计算偏移量大小，不能据此省略方向判断。",["沿初速度方向没有电场力，粒子以 v\u003csub>0\u003c/sub> 匀速通过长度 L，所以 t=L/v\u003csub>0\u003c/sub>。","沿电场力方向，电场力大小 F=q\u003csub>大小\u003c/sub> E，由牛顿第二定律得 a=q\u003csub>大小\u003c/sub> E/m。","该方向初速度为零，因此偏移量 y=at²/2。","把 a 和 t 代入，得到 y=q\u003csub>大小\u003c/sub> E L²/(2m v\u003csub>0\u003c/sub>²)。方向需根据电荷正负另行判断。"],["质量 1.0×10⁻⁶ kg、带电荷量绝对值 1.0×10⁻⁶ C 的微粒，以 20 m/s 的速度垂直电场线射入场强 2000 N/C、极板长 0.20 m 的匀强电场。忽略重力，求离开极板时的偏移量大小。",["水平方向匀速，运动时间 t=L/v\u003csub>0\u003c/sub>=0.20/20=0.010 s。","沿电场力方向的加速度 a=q\u003csub>大小\u003c/sub> E/m=(10⁻⁶×2000)/10⁻⁶=2000 m/s²。","竖直方向初速度为零，y=at²/2=2000×0.010²/2=0.10 m。","偏转方向还要根据电荷正负判断：正电荷沿电场方向，负电荷逆电场方向。"],"偏移量大小为 0.10 m；方向由粒子电性决定。"],["cap-03","kine-05","ele-05"],["cap-05"],["带电粒子","电场偏转","类平抛"],8],["cap-05","示波管的原理","示波管利用电子枪产生并加速电子束，再用两组相互垂直的偏转电极控制电子束落点，最后在荧光屏上显示光点或波形。",[["电子经加速电压后的速度","\u003cmrow>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsqrt>\u003cmfrac>\u003cmrow>\u003cmrow>\u003cmn>2\u003c/mn>&#x2062;\u003cmsub>\u003cmi>e\u003c/mi>\u003cmi mathvariant=\"normal\">荷\u003c/mi>\u003c/msub>\u003c/mrow>&#x22C5;\u003cmsub>\u003cmi>U\u003c/mi>\u003cmi>a\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi>e\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/msqrt>\u003c/mrow>","电子由静止出发，忽略相对论效应和其他能量损失"],["示波管荧光屏上的偏移量","\u003cmrow>\u003cmi>y\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmrow>\u003cmsub>\u003cmi>U\u003c/mi>\u003cmi>d\u003c/mi>\u003c/msub>&#x22C5;\u003cmi>L\u003c/mi>\u003c/mrow>&#x22C5;\u003cmrow>\u003cmi>l\u003c/mi>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmi>L\u003c/mi>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/mrow>\u003c/mrow>\u003cmrow>\u003cmrow>\u003cmn>2\u003c/mn>&#x2062;\u003cmi>d\u003c/mi>\u003c/mrow>&#x22C5;\u003cmsub>\u003cmi>U\u003c/mi>\u003cmi>a\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mrow>","电子由静止经 U\u003csub>a\u003c/sub> 加速，随后垂直进入匀强偏转电场，忽略边缘效应"]],[["v\u003csub>0\u003c/sub>","电子离开加速电场后的速度大小","m/s"],["e\u003csub>荷\u003c/sub>","元电荷的大小","C"],["U\u003csub>a\u003c/sub>","电子枪的加速电压","V"],["m\u003csub>e\u003c/sub>","电子质量","kg"],["y","电子束在荧光屏上的偏移量大小","m"],["U\u003csub>d\u003c/sub>","偏转极板间的偏转电压","V"],["L","偏转极板长度","m"],["l","偏转极板末端到荧光屏的距离","m"],["d","偏转极板间距","m"]],[["把极板中点到屏幕的有效距离 l+L/2 误写成 l+L","错误式与正确式量纲完全相同，量纲检查抓不到。代入示波管情境会算得 0.020 m，正确结果是 0.018 m；错误来自把板内偏转等效作用点错放在极板起点。"],["电子由静止加速后写成 v\u003csub>0\u003c/sub> = e\u003csub>荷\u003c/sub> U\u003csub>a\u003c/sub>/m\u003csub>e\u003c/sub>","eU/m 的量纲是 m²/s²，对应速度的平方而不是速度；必须乘 2 后开平方，量纲检查可直接发现。"]],"示波管把‘电压’变成屏上的‘位移’。在几何结构和加速电压固定时，屏上偏移量与偏转电压成正比，因此可用光点位置测量电信号。电子带负电，实际偏转方向与偏转电场方向相反；若只求偏移量大小，可使用本节的正值公式。",["电子从静止经 U\u003csub>a\u003c/sub> 加速，由 e\u003csub>荷\u003c/sub> U\u003csub>a\u003c/sub>=1/2 m\u003csub>e\u003c/sub> v\u003csub>0\u003c/sub>² 得 v\u003csub>0\u003c/sub>=√(2e_charge U\u003csub>a\u003c/sub>/m\u003csub>e\u003c/sub>)。","偏转板间场强 E=U\u003csub>d\u003c/sub>/d；电子在板间的竖直加速度大小为 a=e\u003csub>荷\u003c/sub> U\u003csub>d\u003c/sub>/(m\u003csub>e\u003c/sub> d)。","电子在板内运动时间为 L/v\u003csub>0\u003c/sub>，离开极板时已有竖直速度，并继续匀速飞向屏幕。","把板内偏移与离板后的偏移相加，再代入 v\u003csub>0\u003c/sub>²=2e_charge U\u003csub>a\u003c/sub>/m\u003csub>e\u003c/sub>，可得 y=U\u003csub>d\u003c/sub> L(l+L/2)/(2dU_a)。电子的电荷量和质量在最终式中消去。"],["某示波管的加速电压为 2000 V，偏转电压为 100 V，偏转极板长 4.0 cm、板间距 1.0 cm，极板末端到屏幕距离为 16 cm。求电子束在屏上的偏移量大小。",["统一换成国际单位：L=0.040 m，d=0.010 m，l=0.16 m。","使用示波管偏移公式 y=U\u003csub>d\u003c/sub> L(l+L/2)/(2dU_a)。","代入得 y=100×0.040×(0.16+0.020)/(2×0.010×2000)。","计算得 y=0.018 m=1.8 cm。电子带负电，实际偏转方向与偏转电场方向相反。"],"屏上偏移量大小为 1.8 cm。"],["cap-03","cap-04"],[],["示波管","电子枪","电偏转"],8],["dc-01","电流与微观表达式","电流表示电荷定向移动的快慢。",[["电流的定义式","\u003cmrow>\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>q\u003c/mi>\u003cmi mathvariant=\"normal\">荷\u003c/mi>\u003c/msub>\u003cmi>t\u003c/mi>\u003c/mfrac>\u003c/mrow>","用一段时间内通过横截面的电荷量求平均电流；恒定电流下也等于任意时刻的电流"],["电流的微观表达式","\u003cmrow>\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmrow>\u003cmi>n\u003c/mi>&#x22C5;\u003cmsub>\u003cmi>q\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mrow>&#x22C5;\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>d\u003c/mi>\u003c/msub>\u003c/mrow>&#x22C5;\u003cmi>S\u003c/mi>\u003c/mrow>\u003c/mrow>","均匀导体中载流子稳定定向移动，q\u003csub>0\u003c/sub> 取电荷量绝对值"]],[["I","电流","A"],["q\u003csub>荷\u003c/sub>","通过导体横截面的电荷量","C"],["t","电荷通过横截面所用时间","s"],["n","单位体积内的自由载流子数","m⁻³"],["q\u003csub>0\u003c/sub>","单个载流子电荷量的绝对值","C"],["v\u003csub>d\u003c/sub>","载流子的定向移动速率","m/s"],["S","导体的横截面积","m²"]],[["把正、负电荷的等效贡献重复计算，误写成 I=2nq_0v_dS","错误式与正确式量纲完全相同，量纲检查抓不到；金属导线情境会误得 3.2 A，而正确电流是 1.6 A。"],["把电流定义式倒写成 I=t/q\u003csub>荷\u003c/sub>","s/C 与电流单位 A 的量纲不同；定义式一旦把分子分母颠倒，量纲检查就能直接发现。"]],"电流方向规定为正电荷定向移动的方向，金属中自由电子的定向移动方向与电流方向相反。微观式说明，电流并不等于单个电子跑得很快；大量载流子即使漂移速度很小，也能形成可观电流。定义式中的 q\u003csub>荷\u003c/sub> 是在所考察时间内穿过截面的净电荷量。",["电流的宏观定义是单位时间通过横截面的电荷量，因此 I=q\u003csub>荷\u003c/sub>/t。","时间 t 内，载流子沿导线前进距离 v\u003csub>d\u003c/sub> t，扫过体积 S v\u003csub>d\u003c/sub> t。","该体积中的载流子数为 nS v\u003csub>d\u003c/sub> t，总电荷量为 q\u003csub>荷\u003c/sub>=nq\u003csub>0S\u003c/sub> v\u003csub>d\u003c/sub> t。","代入 I=q\u003csub>荷\u003c/sub>/t 并约去 t，得到 I=nq\u003csub>0v\u003c/sub>_dS。"],["某导线中 6 s 内有 12 C 电荷通过横截面，求电流。若通过相同电荷量改用 3 s，电流是多少？",["由定义式 I=q\u003csub>荷\u003c/sub>/t。","第一次 I=12/6=2 A。","第二次 I=12/3=4 A；相同电荷量用时减半，电流变为两倍。"],"第一次为 2 A，第二次为 4 A。"],["ele-01"],["dc-02"],["电流","电荷定向移动","微观表达式"],9],["dc-02","欧姆定律与伏安特性曲线","对金属导体，在温度等条件不变时，通过导体的电流 I 与两端电压 U 成正比、与电阻 R 成反比，即 I=U/R。",[["欧姆定律","\u003cmrow>\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>U\u003c/mi>\u003cmi>R\u003c/mi>\u003c/mfrac>\u003c/mrow>","金属导体温度和物理状态不变"],["由电流求电压","\u003cmrow>\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>I\u003c/mi>&#x22C5;\u003cmi>R\u003c/mi>\u003c/mrow>\u003c/mrow>","欧姆导体的电流和电阻已知"]],[["I","通过导体的电流","A"],["U","导体两端电压","V"],["R","导体的电阻","Ω"]],[["误把同一个电阻计算两次，写成 I=U/(2R)","错误式的量纲仍是 A，量纲检查抓不到；12 V 与 6 Ω 会误得 1 A，而正确电流为 2 A。"],["把欧姆定律写成 I=UR","V·Ω 与 A 的量纲不同；把本应相除的电阻改为相乘后，量纲检查会直接拦住。"],["认为导体的电阻由电压除以电流‘决定’，电压变大电阻就变大","R=U/I 是测量式；对温度不变的欧姆导体，U 和 I 同比例变化，R 由材料、长度、横截面积和温度等因素决定。这个概念需人工审核。"]],"欧姆定律有适用条件：导体的温度和物理状态不变。伏安特性曲线若以 U 为横轴、I 为纵轴，欧姆导体是一条过原点的直线，斜率为 1/R；小灯泡因温度升高导致电阻增大，曲线会弯曲，不能拿一条固定斜率的直线描述全过程。",["保持金属导体温度不变，实验测得 U-I 数据点落在过原点的直线上。","直线斜率 I/U 为常量，其倒数定义为电阻 R。","因此 I/U=1/R，整理得 I=U/R，也可写成 U=IR。"],["一个 6 Ω 的定值电阻接在 12 V 电源两端，求电流；若电压变为 18 V，电阻温度不变，电流多大？",["由 I=U/R。","第一次 I=12/6=2 A。","温度不变时 R 仍为 6 Ω，第二次 I=18/6=3 A。"],"电流分别为 2 A 和 3 A。"],["dc-01","pot-05"],["dc-03","dc-04"],["欧姆定律","电阻","伏安特性"],9],["dc-03","电阻定律与电阻率","均匀导体的电阻 R 与长度 L 成正比、与横截面积 S 成反比，比例系数是材料的电阻率 ρ，即 R=ρ L/S。",[["电阻定律","\u003cmrow>\u003cmi>R\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>ρ\u003c/mi>&#x22C5;\u003cmi>L\u003c/mi>\u003c/mrow>\u003cmi>S\u003c/mi>\u003c/mfrac>\u003c/mrow>","材料均匀、粗细均匀且温度确定的导体"],["由导体参数求电阻率","\u003cmrow>\u003cmi>ρ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>R\u003c/mi>&#x22C5;\u003cmi>S\u003c/mi>\u003c/mrow>\u003cmi>L\u003c/mi>\u003c/mfrac>\u003c/mrow>","由均匀导体的电阻、长度和横截面积测定材料电阻率"]],[["R","导体电阻","Ω"],["ρ","材料的电阻率","Ω·m"],["L","导体长度","m"],["S","导体横截面积","m²"]],[["把单程长度误当成来回总长，写成 R=2ρ L/S","多出的系数 2 不改变量纲，量纲检查抓不到；铜质导线会误得 0.034 Ω，正确值为 0.017 Ω。"],["把电阻定律中的横截面积写到分子，误写 R=ρ LS","错误式的量纲变成 Ω·m⁴，并不是电阻单位 Ω；面积放错位置会被量纲检查直接发现。"],["只要材料相同，就认为电阻一定相同","同种材料只保证同温度下电阻率相同；具体电阻还与长度和横截面积有关。此类条件辨析需人工审核。"]],"电阻是具体导体对电流的阻碍，电阻率是材料属性。相同材料、相同温度下，导线越长电阻越大，越粗电阻越小；把导线均匀拉长时，长度增加且横截面积减小，两种效应会同时使电阻增大。",["实验分别控制材料、温度和横截面积不变，得到 R 与 L 成正比。","控制材料、温度和长度不变，得到 R 与 S 成反比。","合并比例关系并把材料与温度的影响写入比例系数 ρ，得到 R=ρ L/S。","移项可得测量电阻率的关系 ρ=RS/L。"],["一根电阻率为 1.7×10⁻⁸ Ω·m、长 10 m、横截面积 1.0×10⁻⁵ m² 的均匀导线，求电阻。",["使用电阻定律 R=ρ L/S。","代入 R=1.7×10⁻⁸×10÷10⁻⁵。","计算得 R=0.017 Ω。"],"导线电阻为 0.017 Ω。"],["dc-02"],["dc-05"],["电阻定律","电阻率","导体几何参数"],9],["dc-04","电功、电功率与焦耳定律","电流通过用电器时，电场力做功使电能转化为其他形式的能。",[["电功","\u003cmrow>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>e\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmi>U\u003c/mi>&#x22C5;\u003cmi>I\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mrow>","恒定电流在时间 t 内通过电路元件"],["电功率","\u003cmrow>\u003cmi>P\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>U\u003c/mi>&#x22C5;\u003cmi>I\u003c/mi>\u003c/mrow>\u003c/mrow>","用电器两端电压和通过的电流已知"],["焦耳定律","\u003cmrow>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi mathvariant=\"normal\">热\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmsup>\u003cmi>I\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>&#x22C5;\u003cmi>R\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mrow>","电流通过电阻产生热量；对任意电阻发热均适用"]],[["W\u003csub>e\u003c/sub>","电流所做的功，即消耗的电能","J"],["P","用电器的电功率","W"],["Q\u003csub>热\u003c/sub>","电流产生的焦耳热","J"],["U","用电器两端电压","V"],["I","通过用电器的电流","A"],["R","电阻","Ω"],["t","通电时间","s"],["q\u003csub>荷\u003c/sub>","通电时间内通过元件的电荷量","C"]],[["误套动能公式的二分之一，写成 W\u003csub>e\u003c/sub>=UI t/2","系数 1/2 不改变量纲，量纲检查抓不到；电热器情境会误得 10800 J，正确电功为 21600 J。"],["把电功写成 W\u003csub>e\u003c/sub>=UI/t","U·I 已是功率，再除以时间不可能得到能量；右边量纲与 J 不同，量纲检查会直接发现。"]],"W\u003csub>e\u003c/sub>=UIt 和 P=UI 对各种电路元件都可使用；Q\u003csub>热\u003c/sub>=I²Rt 专门描述电热。对纯电阻元件，电能全部转化为内能，所以 W\u003csub>e\u003c/sub>=Q\u003csub>热\u003c/sub>，还可结合欧姆定律写出其他等价形式。对电动机等非纯电阻元件，电功大于焦耳热，不能把两者混为一谈。",["电荷量 q\u003csub>荷\u003c/sub> 通过电压 U 时电场力做功 W\u003csub>e\u003c/sub> = U·q\u003csub>荷\u003c/sub>。","恒定电流中 q\u003csub>荷\u003c/sub> = I·t，代入得到 W\u003csub>e\u003c/sub> = U·I·t。","功率是单位时间做功，P = W\u003csub>e\u003c/sub>/t = U·I。","对电阻，结合 U = I·R 与 Q\u003csub>热\u003c/sub> = W\u003csub>e\u003c/sub>，得到 Q\u003csub>热\u003c/sub> = I²·R·t。"],["一个 20 Ω 的电热器通过 6 A 电流，通电 30 s。求产生的热量和功率。",["由焦耳定律 Q\u003csub>热\u003c/sub>=I²Rt=6²×20×30=21600 J。","电热器电压 U=IR=120 V。","功率 P=UI=120×6=720 W，也可用 Q\u003csub>热\u003c/sub>/t 验算。"],"产生热量 21600 J，功率 720 W。"],["dc-02","ene-02"],["dc-05","dc-06"],["电功","电功率","焦耳定律"],9],["dc-05","串联电路与并联电路","串联电路中各处电流相等，总电压等于各部分电压之和，等效电阻 R\u003csub>s\u003c/sub> = R\u003csub>1\u003c/sub>+R\u003csub>2\u003c/sub>。",[["串联等效电阻","\u003cmrow>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi>s\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/mrow>","两个电阻首尾相接，流过相同电流"],["两电阻并联的等效电阻","\u003cmrow>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>&#x22C5;\u003cmsub>\u003cmi>R\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mrow>","两个正电阻并联在同一对节点间"]],[["R\u003csub>s\u003c/sub>","两个电阻串联后的等效电阻","Ω"],["R\u003csub>p\u003c/sub>","两个电阻并联后的等效电阻","Ω"],["R\u003csub>1\u003c/sub>","第一个电阻","Ω"],["R\u003csub>2\u003c/sub>","第二个电阻","Ω"],["I","干路或串联电路中的总电流","A"],["I\u003csub>1\u003c/sub>","并联电路第一支路的电流","A"],["I\u003csub>2\u003c/sub>","并联电路第二支路的电流","A"],["U","串联电路总电压或并联电路公共电压","V"],["U\u003csub>1\u003c/sub>","串联电路第一个电阻两端电压","V"],["U\u003csub>2\u003c/sub>","串联电路第二个电阻两端电压","V"]],[["并联时直接相加，写成 R\u003csub>p\u003c/sub>=R\u003csub>1\u003c/sub>+R\u003csub>2\u003c/sub>","量纲正确但数值错误：4 Ω 与 6 Ω 并联应为 2.4 Ω，而不是 10 Ω。"],["把串联等效电阻写成 R\u003csub>s\u003c/sub>=R\u003csub>1R\u003c/sub>_2","两个电阻相乘的单位是 Ω²，不是等效电阻应有的 Ω；量纲检查会直接发现这种公式结构错误。"]],"串联相当于让电流依次通过更多阻碍，总电阻比任一个分电阻都大；并联相当于增加通路，总电阻比任一个支路电阻都小。判断计算结果是否落在这个范围内，是比死记公式更可靠的快速自检。",["串联时电流相同且 U = U\u003csub>1\u003c/sub>+U\u003csub>2\u003c/sub>，由 U = I·R 得 I·R\u003csub>s\u003c/sub> = I·R\u003csub>1\u003c/sub>+I·R\u003csub>2\u003c/sub>，因此 R\u003csub>s\u003c/sub> = R\u003csub>1\u003c/sub>+R\u003csub>2\u003c/sub>。","并联时电压相同且 I = I\u003csub>1\u003c/sub>+I\u003csub>2\u003c/sub>，由 I = U/R 得 U/R\u003csub>p\u003c/sub> = U/R\u003csub>1\u003c/sub>+U/R\u003csub>2\u003c/sub>。","约去 U 并通分，得到 1/R\u003csub>p\u003c/sub> = 1/R\u003csub>1\u003c/sub>+1/R\u003csub>2\u003c/sub>。","两个电阻时整理为 R\u003csub>p\u003c/sub> = R\u003csub>1\u003c/sub>·R\u003csub>2\u003c/sub>/(R\u003csub>1\u003c/sub>+R\u003csub>2\u003c/sub>)。"],["4 Ω 和 6 Ω 两个电阻，分别求串联和并联时的等效电阻。",["串联：R\u003csub>s\u003c/sub>=R\u003csub>1\u003c/sub>+R\u003csub>2\u003c/sub>=4+6=10 Ω。","并联：R\u003csub>p\u003c/sub>=R\u003csub>1R\u003c/sub>_2/(R\u003csub>1\u003c/sub>+R\u003csub>2\u003c/sub>)=4×6/10=2.4 Ω。","范围检查：10 Ω 大于每个分电阻，2.4 Ω 小于每个分电阻，符合物理图像。"],"串联为 10 Ω，并联为 2.4 Ω。"],["dc-02"],["dc-06","dc-07"],["串联","并联","等效电阻"],9],["dc-06","闭合电路欧姆定律","电源既有电动势 E，也有内阻 r。",[["闭合电路欧姆定律","\u003cmrow>\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>E\u003c/mi>\u003cmrow>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi mathvariant=\"normal\">外\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>","电源与外电路构成闭合回路，内外电阻均按欧姆元件处理"],["电源端电压","\u003cmrow>\u003cmsub>\u003cmi>U\u003c/mi>\u003cmi mathvariant=\"normal\">端\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>E\u003c/mi>\u003cmo>−\u003c/mo>\u003cmrow>\u003cmi>I\u003c/mi>&#x22C5;\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/mrow>","电源向外电路供电，I 按流出电源正极方向取正"]],[["I","闭合电路中的电流","A"],["E","电源电动势","V"],["R\u003csub>外\u003c/sub>","外电路等效电阻","Ω"],["r","电源内阻","Ω"],["U\u003csub>端\u003c/sub>","电源供电时的端电压","V"]],[["忽略电源内阻，写成 I=E/R\u003csub>外\u003c/sub>","错误式量纲完全正确，量纲检查抓不到；代入实际电源会得 2.4 A，而把内阻计入后的正确值为 2 A。"],["供电时把端电压写成 U\u003csub>端\u003c/sub>=E+Ir","量纲正确但符号错误，会算得 14 V；电源供电时内电压是损失，正确端电压为 10 V。"]],"电动势描述电源把其他形式能转化为电能的本领，不是电源两端始终不变的电压。电源供电时，电流通过内阻会产生内电压 Ir，所以端电压小于电动势；外电阻越小，电流越大，端电压反而越低。外电路断开时 I=0，端电压才等于电动势。",["电源每搬运单位电荷提供能量 E，电荷通过内、外电路时分别产生电压降 Ir 与 IR\u003csub>外\u003c/sub>。","沿完整回路有 E=I(R\u003csub>外\u003c/sub>+r)。","移项得到 I=E/(R\u003csub>外\u003c/sub>+r)。","外电路端电压 U\u003csub>端\u003c/sub>=IR\u003csub>外\u003c/sub>，也等于 E-Ir。"],["电动势 12 V、内阻 1 Ω 的电源接 5 Ω 外电阻。求电流和电源端电压。",["总电阻为 R\u003csub>外\u003c/sub>+r=5+1=6 Ω。","由闭合电路欧姆定律 I=12/6=2 A。","端电压 U\u003csub>端\u003c/sub>=E-Ir=12-2×1=10 V。","用外电路验算：IR\u003csub>外\u003c/sub>=2×5=10 V。"],"电流为 2 A，端电压为 10 V。"],["dc-02","dc-05"],["dc-07"],["闭合电路","电动势","内阻","端电压"],9],["dc-07","电表改装","灵敏电流计的满偏电流为 I\u003csub>g\u003c/sub>、内阻为 R\u003csub>g\u003c/sub>。",[["电流表的分流电阻","\u003cmrow>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi mathvariant=\"normal\">并\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi>g\u003c/mi>\u003c/msub>&#x22C5;\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi>g\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi>A\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi>g\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mrow>","I\u003csub>A\u003c/sub> 大于 I\u003csub>g\u003c/sub>，分流电阻与表头并联"],["电压表的分压电阻","\u003cmrow>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi mathvariant=\"normal\">串\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmfrac>\u003cmsub>\u003cmi>U\u003c/mi>\u003cmi>V\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi>g\u003c/mi>\u003c/msub>\u003c/mfrac>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi>g\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","U\u003csub>V\u003c/sub> 大于表头满偏电压 I\u003csub>gR\u003c/sub>_g，分压电阻与表头串联"]],[["I\u003csub>g\u003c/sub>","电流计的满偏电流","A"],["R\u003csub>g\u003c/sub>","电流计内阻","Ω"],["I\u003csub>A\u003c/sub>","改装后电流表的量程","A"],["R\u003csub>并\u003c/sub>","改装电流表所并联的分流电阻","Ω"],["U\u003csub>V\u003c/sub>","改装后电压表的量程","V"],["R\u003csub>串\u003c/sub>","改装电压表所串联的分压电阻","Ω"],["U\u003csub>g\u003c/sub>","电流计满偏时表头两端的电压","V"]],[["改装电压表时忘记减去表头内阻，写成 R\u003csub>串\u003c/sub>=U\u003csub>V\u003c/sub>/I\u003csub>g\u003c/sub>","量纲正确但会算成 10000 Ω；这其实是改装后所需总电阻，串联电阻应扣除原有 100 Ω，正确值为 9900 Ω。"],["改装电流表时把分流电阻串联在表头上","串联电阻不会分走电流，反而增大总电阻；正确做法是让小电阻与表头并联。连接方式需要人工审核。"]],"改装的核心不是背公式，而是保护表头：无论改成哪种表，表头满偏时通过它的电流仍只能是 I\u003csub>g\u003c/sub>。电流表用并联电阻分走多余电流，等效电阻应很小；电压表用串联电阻承担多余电压，等效电阻应很大。连接方式一旦弄反，可能直接烧坏表头。",["表头满偏时两端电压为 U\u003csub>g\u003c/sub> = I\u003csub>g\u003c/sub>·R\u003csub>g\u003c/sub>。","改装电流表时，分流支路电流为 I\u003csub>A\u003c/sub>-I\u003csub>g\u003c/sub>，两支路电压相同，所以 (I\u003csub>A\u003c/sub>-I\u003csub>g\u003c/sub>)·R\u003csub>并\u003c/sub> = I\u003csub>g\u003c/sub>·R\u003csub>g\u003c/sub>。","整理得 R\u003csub>并\u003c/sub> = I\u003csub>g\u003c/sub>·R\u003csub>g\u003c/sub>/(I\u003csub>A\u003c/sub>-I\u003csub>g\u003c/sub>)。","改装电压表时，总电阻应为 U\u003csub>V\u003c/sub>/I\u003csub>g\u003c/sub>，减去表头内阻，得到 R\u003csub>串\u003c/sub> = U\u003csub>V\u003c/sub>/I\u003csub>g\u003c/sub>-R\u003csub>g\u003c/sub>。"],["满偏电流 1 mA、内阻 100 Ω 的电流计，分别改装成量程 101 mA 的电流表和量程 10 V 的电压表。求所需电阻。",["改装电流表，并联分流电阻：R\u003csub>并\u003c/sub>=I\u003csub>gR\u003c/sub>_g/(I\u003csub>A\u003c/sub>-I\u003csub>g\u003c/sub>)=0.001×100/(0.101-0.001)=1 Ω。","改装电压表，串联分压电阻：R\u003csub>串\u003c/sub>=U\u003csub>V\u003c/sub>/I\u003csub>g\u003c/sub>-R\u003csub>g\u003c/sub>=10/0.001-100=9900 Ω。","检查数量级：电流表并小电阻，电压表串大电阻，符合使用要求。"],"并联 1 Ω 分流电阻；串联 9900 Ω 分压电阻。"],["dc-02","dc-05"],[],["电流表","电压表","分流","分压"],9],["mag-01","磁场与磁感应强度","磁场是磁体、电流和运动电荷周围存在的一种特殊物质。",[["磁感应强度的定义式","\u003cmrow>\u003cmi>B\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>F\u003c/mi>\u003cmrow>\u003cmi>I\u003c/mi>&#x22C5;\u003cmi>L\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>","直导线与匀强磁场垂直，且取导线在磁场中的有效长度"],["垂直导线受到的安培力","\u003cmrow>\u003cmi>F\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmi>B\u003c/mi>&#x22C5;\u003cmi>I\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>L\u003c/mi>\u003c/mrow>\u003c/mrow>","直导线与匀强磁场垂直"]],[["B","磁感应强度","T"],["F","通电直导线受到的安培力","N"],["I","导线中的电流","A"],["L","处在磁场中的有效导线长度","m"]],[["把单根直导线误当成线圈两条边同时受力，写成 F=2BIL","系数 2 不改变量纲，因此量纲检查抓不到；垂直检验导线情境会误得 4 N，而单根有效导线受到的正确安培力是 2 N。"],["把定义式倒写成 B=IL/F","右边量纲不是磁感应强度应有的特斯拉；把力放到分母后，所得单位与 T 完全不符，因此量纲检查可以直接发现。"]],"磁感应强度描述磁场的强弱和方向，是磁场本身的性质，不由检验导线的电流或长度决定。定义式必须满足导线与磁场垂直；若不垂直，安培力还要乘以夹角的正弦。磁场方向规定为小磁针静止时 N 极所指的方向。",["保持导线与磁场垂直，实验发现安培力 F 与电流 I、有效长度 L 均成正比。","比值 F/(IL) 与检验导线无关，只由磁场所在位置决定，因此用它定义磁感应强度 B。","移项得到垂直条件下 F=BIL；T 也可写成 N/(A·m)。"],["一根有效长度 1 m 的直导线垂直放在匀强磁场中，通入 4 A 电流时受到 2 N 安培力，求磁感应强度。",["导线与磁场垂直，可用 B=F/(IL)。","代入 B=2÷(4×1)=0.5 T。","用 F=BIL 回代得到 2 N，与已知力一致。"],"磁感应强度为 0.5 T。"],["dc-01"],["mag-02","mag-04"],["磁场","磁感应强度","特斯拉"],10],["mag-02","磁感线与磁场叠加","磁感线是在磁场中画出的有方向曲线，曲线上每一点的切线方向表示该点磁场方向，疏密表示磁场强弱。",[["共线同向磁场叠加","\u003cmrow>\u003cmsub>\u003cmi>B\u003c/mi>\u003cmi mathvariant=\"normal\">合\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>B\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>B\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/mrow>","两个磁场在所考察点方向相同"],["共线反向磁场叠加","\u003cmrow>\u003cmsub>\u003cmi>B\u003c/mi>\u003cmi mathvariant=\"normal\">合\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmo>|\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>B\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>B\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003cmo>|\u003c/mo>\u003c/mrow>\u003c/mrow>","两个磁场方向相反；式中给出合磁场大小"]],[["B\u003csub>合\u003c/sub>","两个共线磁场叠加后的磁感应强度大小","T"],["B\u003csub>1\u003c/sub>","第一个磁场的磁感应强度大小","T"],["B\u003csub>2\u003c/sub>","第二个磁场的磁感应强度大小","T"]],[["反向磁场仍直接相加，写成 B\u003csub>合\u003c/sub>=B\u003csub>1\u003c/sub>+B\u003csub>2\u003c/sub>","量纲正确但方向关系错；反向叠加情境会误得 0.005 T，正确大小是 0.001 T。"],["同向叠加时把两个磁感应强度相乘，写成 B\u003csub>合\u003c/sub>=B\u003csub>1B\u003c/sub>_2","右边单位变成 T²，不再是磁感应强度应有的单位 T；这种把矢量叠加误写成乘法的错误可由量纲检查直接发现。"]],"磁感线是描述磁场的模型，不是空间中真实存在的线，也不会相交。直线电流周围的磁感线是以导线为圆心的同心圆，方向用右手螺旋定则判断；通电螺线管外部的磁场分布类似条形磁体。共线磁场同向时大小相加，反向时大小相减并由较强者决定方向。",["磁感应强度是矢量，多个磁场在同一点的作用应按矢量法则合成。","两个磁场共线同向时，代数值同号，合磁场大小为 B\u003csub>1\u003c/sub>+B\u003csub>2\u003c/sub>。","共线反向时，代数值异号，合磁场大小为 |B\u003csub>1\u003c/sub>-B\u003csub>2\u003c/sub>|，方向与较强的分磁场相同。"],["某点有两个共线磁场，大小分别为 3.0×10⁻³ T 和 2.0×10⁻³ T。分别求它们同向和反向时的合磁场。",["同向时大小相加：B\u003csub>合\u003c/sub>=0.003+0.002=0.005 T。","反向时大小相减：B\u003csub>合\u003c/sub>=|0.003−0.002|=0.001 T。","反向时合磁场方向与 3.0×10⁻³ T 的较强磁场相同。"],"同向时为 5.0×10⁻³ T；反向时为 1.0×10⁻³ T。"],["mag-01"],["mag-03"],["磁感线","右手螺旋定则","磁场叠加"],10],["mag-03","磁通量","磁通量表示穿过某一面积的磁场多少。",[["匀强磁场中的磁通量","\u003cmrow>\u003cmi>Φ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmi>B\u003c/mi>&#x22C5;\u003cmi>S\u003c/mi>\u003c/mrow>&#x22C5;\u003cmrow>\u003cmi mathvariant=\"normal\">cos\u003c/mi>\u003cmo>&#x2061;\u003c/mo>\u003cmo>(\u003c/mo>\u003cmi>θ\u003c/mi>\u003cmo>)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/mrow>","B、S 均匀，θ 为磁场与平面法线的夹角，计算磁通量大小时取 0 至 90°"],["最大磁通量","\u003cmrow>\u003cmi>Φ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>B\u003c/mi>&#x22C5;\u003cmi>S\u003c/mi>\u003c/mrow>\u003c/mrow>","磁场方向垂直平面，即与平面法线平行"]],[["Phi","穿过平面的磁通量","Wb"],["B","匀强磁场的磁感应强度","T"],["S","平面的面积","m²"],["θ","磁场方向与平面法线的夹角","rad"],["S\u003csub>有效\u003c/sub>","平面在垂直磁场方向上的有效投影面积","m²"]],[["不论平面怎样倾斜都写成 Phi=BS","量纲正确但漏掉投影；倾斜线圈会误得 0.4 Wb，正确值为 0.24 Wb。"],["把磁场与法线的夹角误配正弦，写成 Phi=BS sin θ","量纲检查抓不到三角函数选错；垂直穿过时 θ=0，错误式给出 0，正确值为 0.4 Wb。"]],"夹角必须看磁场与面积法线，而不是磁场与平面本身。垂直穿过平面时 θ=0，磁通量最大；磁场沿平面方向时 θ=90°，磁通量为零。磁通量是标量但有正负约定，本章主要计算其大小。",["先取与磁场垂直的有效投影面积 S\u003csub>有效\u003c/sub>=S cos θ。","穿过该投影面积的磁通量等于 B 与 S\u003csub>有效\u003c/sub> 的乘积，因此 Phi=BS cos θ。","当 θ=0 时投影面积就是原面积，得到最大磁通量 Phi=BS。"],["面积 0.5 m² 的线圈放在 0.8 T 匀强磁场中，磁场与线圈法线夹角的余弦为 0.6，求磁通量。",["使用 Phi=BS cos θ，注意角度是磁场与法线的夹角。","代入 Phi=0.8×0.5×0.6=0.24 Wb。","最大可能值 BS=0.4 Wb，计算结果小于最大值，范围合理。"],"磁通量为 0.24 Wb。"],["mag-01","mag-02"],["mag-04"],["磁通量","有效面积","韦伯"],10],["mag-04","安培力","长为 L 的直导线通有电流 I，处在磁感应强度为 B 的匀强磁场中，若电流方向与磁场方向夹角为 θ，则安培力大小 F=B·I·L·sin(θ)。",[["安培力大小","\u003cmrow>\u003cmi>F\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmrow>\u003cmi>B\u003c/mi>&#x22C5;\u003cmi>I\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>L\u003c/mi>\u003c/mrow>&#x22C5;\u003cmrow>\u003cmi mathvariant=\"normal\">sin\u003c/mi>\u003cmo>&#x2061;\u003c/mo>\u003cmo>(\u003c/mo>\u003cmi>θ\u003c/mi>\u003cmo>)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/mrow>","直导线处在匀强磁场中，θ 为电流与磁场的夹角"],["最大安培力","\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi mathvariant=\"normal\">max\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmi>B\u003c/mi>&#x22C5;\u003cmi>I\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>L\u003c/mi>\u003c/mrow>\u003c/mrow>","电流方向与磁场方向垂直"]],[["F","通电导线受到的安培力","N"],["F\u003csub>max\u003c/sub>","给定 B、I、L 时的最大安培力","N"],["B","匀强磁场的磁感应强度","T"],["I","导线中的电流","A"],["L","导线在磁场中的有效长度","m"],["θ","电流方向与磁场方向的夹角","rad"]],[["任何夹角都直接用 F=BIL，漏掉 sin θ","量纲完全正确；斜放导线会误得 4 N，正确值为 2.4 N。"],["把正弦误写成余弦，写成 F=BIL cos θ","量纲检查无法区分正弦和余弦；本情境会误得 3.2 N，正确值为 2.4 N。"]],"安培力大小只取决于电流与磁场的相对夹角：垂直时最大，平行或反平行时为零。公式中的 L 是磁场内的有效直线长度。左手定则只判断方向，不能替代大小计算；改变电流方向或磁场方向中的任意一个，安培力方向都会反向。",["导线与磁场垂直时，实验得 F=BIL。","一般角度下，只有垂直于电流方向的磁场分量 B sin θ 产生安培力。","用 B sin θ 替换垂直公式中的 B，得到 F=BIL sin θ；θ=90°时达到最大值 BIL。"],["长 2 m 的直导线通有 4 A 电流，放在 0.5 T 匀强磁场中，电流与磁场夹角满足 sin θ=0.6。求安培力及其最大可能值。",["一般夹角下 F=BIL sin θ。","F=0.5×4×2×0.6=2.4 N。","导线与磁场垂直时最大，F\u003csub>max\u003c/sub>=BIL=4 N。","力的具体空间方向需结合图示用左手定则判断。"],"安培力为 2.4 N，最大可能值为 4 N。"],["mag-01"],["mag-05","mag-06"],["安培力","左手定则","有效长度"],10],["mag-05","磁电式电表与电动机原理","矩形线圈在磁场中通电后，两条有效边受到方向相反的安培力，形成力矩使线圈转动。",[["通电线圈的磁力矩","\u003cmrow>\u003cmi>τ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmrow>\u003cmrow>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmi mathvariant=\"normal\">匝\u003c/mi>\u003c/msub>&#x22C5;\u003cmi>B\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>I\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>S\u003c/mi>\u003c/mrow>&#x22C5;\u003cmrow>\u003cmi mathvariant=\"normal\">sin\u003c/mi>\u003cmo>&#x2061;\u003c/mo>\u003cmo>(\u003c/mo>\u003cmi>α\u003c/mi>\u003cmo>)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/mrow>","N 匝平面线圈处在匀强磁场中，α 为磁场与线圈法线夹角"],["磁电式电表的电流与偏角","\u003cmrow>\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>&#x22C5;\u003cmi>β\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmrow>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmi mathvariant=\"normal\">匝\u003c/mi>\u003c/msub>&#x22C5;\u003cmi>B\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>S\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>","辐向磁场中 sin α=1，指针稳定时磁力矩与游丝回复力矩平衡"]],[["τ","通电线圈受到的磁力矩","N·m"],["N\u003csub>匝\u003c/sub>","线圈匝数","1"],["B","磁感应强度","T"],["I","线圈中的电流","A"],["S","每匝线圈面积","m²"],["α","磁场与线圈法线的夹角","rad"],["k\u003csub>t\u003c/sub>","游丝的角回复系数","N·m/rad"],["β","电表指针的偏转角","rad"]],[["计算多匝线圈力矩时漏掉匝数 N，写成 τ=BIS sin α","量纲正确但少算各匝的共同贡献；表头情境会误得 0.00001 N·m，正确值是 0.001 N·m。"],["认为电动机线圈转过半周后无需换向也能持续同向转动","若电流方向不变，线圈越过平衡位置后磁力矩会促使它反向；直流电动机依靠换向器适时改变电流方向。此过程判断需人工审核。"]],"电动机把电能转化为机械能，换向器在适当位置改变线圈电流方向，使驱动力矩持续推动转子同向转动。磁电式电表则不追求连续转动，而利用回复力矩与磁力矩平衡；在辐向磁场中 sin α 保持为 1，偏角与电流成正比，因此刻度均匀。",["线圈两条相对边所受安培力构成力偶；单匝线圈的力矩为 BIS sin α。","N 匝线圈的力矩相加，得到 τ=NBIS sin α。","磁电式表头采用辐向磁场，使 sin α=1；稳定时 NBIS=k\u003csub>t\u003c/sub> β。","移项得 I=k\u003csub>t\u003c/sub> β/(NBS)，所以偏角 β 与电流 I 成正比。"],["某磁电式表头线圈 100 匝，每匝面积 0.005 m²，处在 0.2 T 辐向磁场中。通入 0.01 A 电流，游丝角回复系数为 0.02 N·m/rad。求磁力矩和稳定偏角。",["辐向磁场中磁力矩 τ=NBIS。","τ=100×0.2×0.01×0.005=0.001 N·m。","平衡时 k\u003csub>t\u003c/sub> β=τ，所以 β=0.001÷0.02=0.05 rad。"],"磁力矩为 0.001 N·m，稳定偏角为 0.05 rad。"],["mag-04","dc-07"],["mag-06"],["磁电式电表","电动机","磁力矩"],10],["mag-06","安培力作用下的平衡与加速","通电导体在磁场中的平衡问题仍服从普通的受力平衡条件。",[["安培力平衡所需电流","\u003cmrow>\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>m\u003c/mi>&#x22C5;\u003cmi>g\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>B\u003c/mi>&#x22C5;\u003cmi>L\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>","导线垂直磁场，安培力竖直向上且仅与重力平衡"],["竖直方向的加速度","\u003cmrow>\u003cmi>a\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmrow>\u003cmrow>\u003cmi>B\u003c/mi>&#x22C5;\u003cmi>I\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>L\u003c/mi>\u003c/mrow>\u003cmo>−\u003c/mo>\u003cmrow>\u003cmi>m\u003c/mi>&#x22C5;\u003cmi>g\u003c/mi>\u003c/mrow>\u003c/mrow>\u003cmi>m\u003c/mi>\u003c/mfrac>\u003c/mrow>","安培力竖直向上、重力向下，取向上为正且忽略其他竖直力"]],[["I","导线中的电流","A"],["m","导线或导体棒质量","kg"],["g","重力加速度","m/s²"],["B","磁感应强度","T"],["L","垂直磁场的有效导线长度","m"],["F","导线受到的安培力","N"],["a","取安培力方向为正时导线的加速度","m/s²"]],[["把方向相反的安培力与重力相加，写成 a=(BIL+mg)/m","量纲正确但受力方向错误；向上加速情境会误得 25 m/s²，正确值为 5 m/s²。"],["求平衡电流时漏掉重力加速度，写成 I=m/(BL)","右边量纲不是电流；质量必须先乘 g 才是与安培力平衡的重力，量纲检查可直接发现。"]],"解题顺序是先用左手定则判断安培力方向，再画受力图，最后列平衡式或牛顿第二定律。安培力不是额外的一套力学规则；它与重力、支持力、拉力一样参加矢量合成。若题目改变电流或磁场方向，平衡可能立刻被破坏。",["导线垂直磁场时，安培力大小为 BIL。","悬浮平衡要求竖直方向合力为零，因此 BIL-mg=0，整理得 I=mg/(BL)。","若不平衡，取安培力方向为正，由牛顿第二定律 BIL-mg=ma。","两边除以 m，得到 a=(BIL-mg)/m；当 I 恰好等于平衡电流时 a=0。"],["质量 0.2 kg、有效长度 1 m 的水平导线垂直放在 0.5 T 匀强磁场中，安培力方向竖直向上，取 g=10 m/s²。求悬浮所需电流；若电流增至 6 A，求加速度。",["悬浮时 BIL=mg，I=0.2×10÷(0.5×1)=4 A。","电流 6 A 时安培力 F=BIL=0.5×6×1=3 N。","重力为 2 N，向上合力为 1 N。","由牛顿第二定律 a=1÷0.2=5 m/s²，方向向上。"],"悬浮电流为 4 A；电流为 6 A 时加速度为 5 m/s²，方向向上。"],["mag-04","dyn-05"],[],["安培力平衡","受力分析","牛顿第二定律"],10],["lor-01","洛伦兹力","电荷量为 q 的粒子以速度 v 在磁感应强度为 B 的匀强磁场中运动，速度与磁场夹角为 θ 时，所受洛伦兹力大小 F=|q|vB sin(θ)。",[["洛伦兹力大小","\u003cmrow>\u003cmi>F\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmrow>\u003cmrow>\u003cmo>|\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo>|\u003c/mo>\u003c/mrow>&#x22C5;\u003cmi>v\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>B\u003c/mi>\u003c/mrow>&#x22C5;\u003cmrow>\u003cmi mathvariant=\"normal\">sin\u003c/mi>\u003cmo>&#x2061;\u003c/mo>\u003cmo>(\u003c/mo>\u003cmi>θ\u003c/mi>\u003cmo>)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/mrow>","带电粒子以任意非相对论速度进入匀强磁场，θ 为速度与磁场夹角"],["垂直入射时的最大洛伦兹力","\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi mathvariant=\"normal\">max\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmrow>\u003cmo>|\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo>|\u003c/mo>\u003c/mrow>&#x22C5;\u003cmi>v\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>B\u003c/mi>\u003c/mrow>\u003c/mrow>","速度方向与磁场方向垂直"]],[["F","洛伦兹力大小","N"],["F\u003csub>max\u003c/sub>","给定 q、v、B 时的最大洛伦兹力","N"],["q","粒子的带符号电荷量；大小计算取绝对值","C"],["v","粒子速度大小","m/s"],["B","磁感应强度","T"],["θ","速度方向与磁场方向的夹角","rad"]],[["任意夹角都直接写 F=|q|vB，漏掉 sin θ","量纲正确但漏掉垂直分量；斜入情境会误得 0.003 N，正确值为 0.0018 N。"],["负电荷受力方向也直接照搬正电荷的左手定则结果","左手定则先给出正电荷的受力方向，负电荷必须反向。空间方向依赖图示，标量公式无法覆盖，需人工审核。"]],"洛伦兹力同时垂直于速度和磁场。当粒子沿磁场方向运动时力为零，垂直磁场运动时力最大。由于力始终与瞬时速度垂直，洛伦兹力不做功，粒子的速率和动能不变，只改变运动方向。公式中的 |q| 只负责大小，电荷正负只影响方向。",["垂直入射时，实验给出洛伦兹力大小与 |q|、v、B 均成正比，即 F=|q|vB。","一般角度下，只有垂直于速度的磁场分量 B sin θ 产生力，因此 F=|q|vB sin θ。","洛伦兹力与速度垂直，所以瞬时功率 Fv cos90°=0，磁场不能改变粒子的动能。"],["一个带电荷量 −2.0×10⁻⁶ C 的粒子以 3000 m/s 进入 0.5 T 匀强磁场，速度与磁场夹角满足 sin θ=0.6。求洛伦兹力大小。",["大小计算使用电荷量绝对值。","F=|q|vB sin θ。","代入得 F=2.0×10⁻⁶×3000×0.5×0.6=1.8×10⁻³ N。","具体方向先按正电荷使用左手定则，再因粒子带负电而反向。"],"洛伦兹力大小为 1.8×10⁻³ N；方向需结合图示判断。"],["mag-01"],["lor-02"],["洛伦兹力","左手定则","磁场不做功"],11],["lor-02","带电粒子在匀强磁场中的圆周运动","粒子垂直进入匀强磁场时，洛伦兹力始终与速度垂直并充当向心力，粒子做匀速圆周运动。",[["匀强磁场中的轨道半径","\u003cmrow>\u003cmi>r\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>m\u003c/mi>&#x22C5;\u003cmi>v\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmrow>\u003cmo>|\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo>|\u003c/mo>\u003c/mrow>&#x22C5;\u003cmi>B\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>","粒子速度垂直磁场且只受洛伦兹力"],["匀强磁场中的运动周期","\u003cmrow>\u003cmi>T\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmrow>\u003cmn>2\u003c/mn>&#x2062;\u003cmi>π\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>m\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmrow>\u003cmo>|\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo>|\u003c/mo>\u003c/mrow>&#x22C5;\u003cmi>B\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>","粒子速度垂直磁场且只受洛伦兹力"]],[["r","圆周轨道半径","m"],["T","圆周运动周期","s"],["m","粒子质量","kg"],["v","粒子速率","m/s"],["q","带符号电荷量；大小计算取绝对值","C"],["B","磁感应强度","T"]],[["求轨道半径时直接代入带符号电荷量，写成 r=mv/(qB)","量纲完全正确，但负电荷会算出负半径；垂直入射情境会误得 −0.4 m，而几何半径应为正的 0.4 m，电荷符号只决定偏转方向。"],["认为粒子速率越大，圆周运动周期越长","经典范围内 T=2π m/(|q|B)，速率增大时半径同比增大，周长与速率的比值不变。这是概念判断，需人工审核。"]],"半径随质量和速率增大，随电荷量绝对值和磁场增强而减小；周期却与速率和轨道半径无关。磁场只改变方向，因此速率不变。正负电荷在同一磁场中的偏转方向相反，但若 m、|q|、v 相同，半径和周期相同。",["垂直入射时洛伦兹力充当向心力：|q|vB=mv²/r。","约去一个 v 并移项，得到 r=mv/(|q|B)。","周期等于周长除以速率：T=2π·r/v；代入半径式后 v 约去，得到 T=2π·m/(|q|B)。"],["质量 2.0×10⁻⁶ kg、电荷量 −1.0×10⁻³ C 的粒子以 100 m/s 垂直进入 0.5 T 匀强磁场，求轨道半径和周期。",["大小计算取 |q|=1.0×10⁻³ C。","r=mv/(|q|B)=0.4 m。","T=2π m/(|q|B)=0.008π s≈0.0251 s。","负号只改变绕行方向，不改变半径与周期。"],"半径为 0.40 m，周期约为 2.51×10⁻² s。"],["lor-01","cir-02"],["lor-03","lor-05","lor-06"],["圆周运动","轨道半径","回旋周期"],11],["lor-03","带电粒子在磁场中的临界与极值","磁场有边界时，临界问题的核心是先画出与入射速度相切的圆轨道，再用边界条件确定允许的最大半径。",[["圆轨道直径","\u003cmrow>\u003cmi>d\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>2\u003c/mn>&#x2062;\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/mrow>","粒子轨迹为完整圆或几何边界涉及轨道直径"],["受半径限制的最大速率","\u003cmrow>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi mathvariant=\"normal\">max\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmrow>\u003cmrow>\u003cmo>|\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo>|\u003c/mo>\u003c/mrow>&#x22C5;\u003cmi>B\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>R\u003c/mi>\u003c/mrow>\u003cmi>m\u003c/mi>\u003c/mfrac>\u003c/mrow>","装置要求粒子圆轨道半径 r 不超过给定上限 R"]],[["r","粒子圆轨道半径","m"],["d","圆轨道直径","m"],["R","装置允许的最大轨道半径","m"],["v","粒子速率","m/s"],["v\u003csub>max\u003c/sub>","满足 r≤R 的最大速率","m/s"],["m","粒子质量","kg"],["q","粒子电荷量","C"],["B","磁感应强度","T"]],[["把轨道直径直接当成半径，写成 d=r","量纲正确但漏掉系数 2；本情境会误得 0.3 m，正确直径为 0.6 m。"],["遇到任何有界磁场都直接套 v\u003csub>max\u003c/sub>=|q|BR/m","该式只对应题设明确 r≤R 的几何约束；半圆边界、矩形边界和指定出射点会给出不同临界几何关系，必须先画轨迹，需人工审核。"]],"临界状态通常表现为轨迹恰好与边界相切、恰好通过某点或圆心落在某条边界线上。先定圆心和几何关系，再代动力学半径公式，不能只凭偏转方向猜答案。这里给出的 v\u003csub>max\u003c/sub> 只适用于题设已明确 r≤R 的装置。",["圆的直径恒为半径的两倍，所以 d=2r。","装置要求 r≤R，而 r=mv/(|q|B)。","令临界状态 r=R，解出 v\u003csub>max\u003c/sub>=|q|BR/m；低于该速率时半径更小。"],["质量 2.0×10⁻³ kg、电荷量 1.0×10⁻¹ C 的粒子垂直进入 2 T 匀强磁场。装置要求轨道半径不超过 0.5 m，求允许的最大速率。若粒子速率为 30 m/s，求轨道直径。",["临界时 r=R，由 r=mv/(|q|B) 解得 v\u003csub>max\u003c/sub>=|q|BR/m。","v\u003csub>max\u003c/sub>=0.1×2×0.5÷0.002=50 m/s。","速率 30 m/s 时 r=0.002×30÷(0.1×2)=0.3 m。","直径 d=2r=0.6 m。"],"最大速率为 50 m/s；速率 30 m/s 时轨道直径为 0.60 m。"],["lor-02"],["lor-05"],["临界问题","有界磁场","几何约束"],11],["lor-04","速度选择器","在互相垂直的匀强电场和匀强磁场中，让粒子速度同时垂直两场，并使电场力与洛伦兹力方向相反。",[["速度选择条件","\u003cmrow>\u003cmi>v\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>E\u003c/mi>\u003cmi>B\u003c/mi>\u003c/mfrac>\u003c/mrow>","速度、电场、磁场两两垂直，且电场力与洛伦兹力反向平衡"],["直线通过时两力平衡","\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi>e\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmo>|\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo>|\u003c/mo>\u003c/mrow>&#x22C5;\u003cmi>E\u003c/mi>\u003c/mrow>\u003c/mrow>","粒子以选择速率通过，电场力大小等于洛伦兹力大小"]],[["v","不偏转通过的粒子速率","m/s"],["E","匀强电场强度","V/m"],["B","匀强磁场的磁感应强度","T"],["q","粒子电荷量","C"],["F\u003csub>e\u003c/sub>","电场力大小","N"],["F\u003csub>m\u003c/sub>","洛伦兹力大小","N"]],[["误把两种力各算两次，写成选择速率 v=2E/B","系数 2 不改变量纲，所以量纲检查抓不到；正交选择场会误得 6000 m/s，而两力平衡给出的正确速率是 3000 m/s。"],["认为速度选择器只能让正电荷通过，负电荷一定偏转","电荷变号时电场力和磁场力同时反向，二者仍可互相平衡；只要入射方向和速率满足条件，正负电荷都能直线通过。这是方向概念，需人工审核。"]],"速度选择器选择的是速率而不是电荷量：电荷量在平衡式两边约去，所以同向进入的正、负粒子只要速率相同，都可不偏转通过。若速率偏离 E/B，两力不再平衡；偏转方向还取决于电荷正负和场的具体方向。",["不偏转通过要求合力为零，且两种力方向相反、大小相等。","写出大小关系 |q|E=|q|vB。","约去非零的 |q|，得到 v=E/B，所以选择速率与粒子质量和电荷量大小无关。"],["速度选择器的电场强度为 600 V/m，磁感应强度为 0.20 T。求不偏转通过的粒子速率。若 |q|=2.0×10⁻⁶ C，验证两力大小。",["不偏转条件为 |q|E=|q|vB。","v=E/B=600÷0.20=3000 m/s。","电场力 |q|E=1.2×10⁻³ N。","磁场力 |q|vB=1.2×10⁻³ N，两力大小相等、方向相反。"],"选择速率为 3000 m/s；两力大小均为 1.2×10⁻³ N。"],["lor-01","ele-03"],["lor-05"],["速度选择器","复合场","力的平衡"],11],["lor-05","质谱仪","质谱仪先用电势差 U 加速带电粒子，使 |q|U=mv²/2，再让粒子垂直进入匀强磁场，按不同的荷质比分开。",[["电压加速后的速率","\u003cmrow>\u003cmi>v\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsqrt>\u003cmfrac>\u003cmrow>\u003cmrow>\u003cmn>2\u003c/mn>&#x2062;\u003cmrow>\u003cmo>|\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo>|\u003c/mo>\u003c/mrow>\u003c/mrow>&#x22C5;\u003cmi>U\u003c/mi>\u003c/mrow>\u003cmi>m\u003c/mi>\u003c/mfrac>\u003c/msqrt>\u003c/mrow>","粒子由静止或可忽略的初速度经电势差 U 加速"],["质谱仪测得的荷质比","\u003cmrow>\u003cmi mathvariant=\"normal\">qm\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>2\u003c/mn>&#x2062;\u003cmi>U\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmsup>\u003cmi>B\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>&#x22C5;\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mfrac>\u003c/mrow>","初速度可忽略，经 U 加速后垂直进入 B，测得圆轨道半径 r"]],[["v","粒子经电压加速后的速率","m/s"],["U","加速电势差大小","V"],["m","粒子质量","kg"],["q","粒子电荷量","C"],["B","分析磁场的磁感应强度","T"],["r","粒子在分析磁场中的轨道半径","m"],["qm","荷质比的绝对值","C/kg"]],[["电压加速公式漏掉系数 2，写成 v=√(|q|U/m)","量纲正确但忽略动能中的 1/2；本情境会误得约 70710.7 m/s，正确值为 100000 m/s。"],["用带符号的 q 直接开方，认为负离子不能被电压加速","加速电势差的方向需配合电荷正负选择；计算获得的动能和速率使用做功的正值 |q|U。方向问题需结合电极图示人工审核。"]],"经过同一加速电压后，粒子的速度一般并不相同；进入磁场后，轨道半径由质量和电荷量共同决定。实验测得 U、B、r 就能求荷质比，若电荷量已知还可求质量。公式默认初速度可忽略且粒子非相对论。",["电场加速满足 |q|U=mv²/2，因此 v=√(2|q|U/m)。","磁场偏转半径满足 r=mv/(|q|B)。","把加速关系与半径关系联立并消去 v，得到 |q|/m=2U/(B²r²)。"],["某离子由静止经 1000 V 电压加速，再垂直进入 0.5 T 匀强磁场，测得轨道半径 0.040 m。求荷质比绝对值。若离子电荷量为 2.0×10⁻¹⁹ C，再求质量。",["联立电场加速和磁场偏转，得 |q|/m=2U/(B²r²)。","代入得 2×1000÷(0.5²×0.040²)=5.0×10⁶ C/kg。","m=|q|/(|q|/m)=2.0×10⁻¹⁹÷(5.0×10⁶)=4.0×10⁻²⁶ kg。"],"荷质比绝对值为 5.0×10⁶ C/kg，质量为 4.0×10⁻²⁶ kg。"],["cap-03","lor-02","lor-04"],["lor-06"],["质谱仪","荷质比","电场加速"],11],["lor-06","回旋加速器","回旋加速器用匀强磁场使带电粒子在 D 形盒内做半圆运动，用盒缝间的交变电场反复加速。",[["回旋频率","\u003cmrow>\u003cmi>f\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmrow>\u003cmo>|\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo>|\u003c/mo>\u003c/mrow>&#x22C5;\u003cmi>B\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmrow>\u003cmn>2\u003c/mn>&#x2062;\u003cmi>π\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>m\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>","非相对论粒子在匀强磁场中回旋，交变电场频率与之同步"],["最大轨道处的动能","\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmrow>\u003cmsup>\u003cmi>q\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>&#x22C5;\u003cmsup>\u003cmi>B\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>&#x22C5;\u003cmsup>\u003cmi>R\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003cmrow>\u003cmn>2\u003c/mn>&#x2062;\u003cmi>m\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>","非相对论条件下，最大轨道半径受 D 形盒半径 R 限制"]],[["f","交变电场应匹配的回旋频率","Hz"],["E\u003csub>k\u003c/sub>","粒子在最大半径处的动能","J"],["q","粒子电荷量","C"],["B","D 形盒区域的磁感应强度","T"],["m","粒子质量","kg"],["R","加速器允许的最大轨道半径","m"],["v\u003csub>max\u003c/sub>","粒子在最大半径处的速率","m/s"]],[["回旋频率漏掉 2π，写成 f=|q|B/m","量纲正确但数值大 2π 倍；本情境会误得 4.0×10⁷ Hz，正确约为 6.366×10⁶ Hz。"],["认为磁场在 D 形盒内持续给粒子做功、直接增加动能","洛伦兹力始终垂直速度，只负责弯转；真正增加动能的是粒子穿越盒缝时的电场。这是能量来源判断，需人工审核。"]],"粒子每次穿过盒缝被电场加速，速率和轨道半径逐步增大；D 形盒内部的磁场只负责转弯，不增加动能。因为回旋周期与速率无关，交变电压可用固定频率同步换向。速率接近光速后相对论质量效应使同步条件失效，经典公式不再适用。",["回旋周期 T=2π m/(|q|B)，所以同步交变电场频率 f=1/T=|q|B/(2π m)。","最大半径处由 R=mv\u003csub>max\u003c/sub>/(|q|B) 得 v\u003csub>max\u003c/sub>=|q|BR/m。","代入动能 mv\u003csub>max\u003c/sub>²/2，得到 E\u003csub>k\u003c/sub>=|q|²B²R²/(2m)；写成 q²可自动消去电荷符号。"],["回旋加速器用 0.8 T 磁场加速质量 3.2×10⁻²⁷ kg、电荷量 1.6×10⁻¹⁹ C 的粒子，D 形盒最大半径 0.50 m。求回旋频率和最大动能。",["f=|q|B/(2π m)≈6.37×10⁶ Hz。","最大速率 v\u003csub>max\u003c/sub>=|q|BR/m=2.0×10⁷ m/s。","E\u003csub>k\u003c/sub>=mv\u003csub>max\u003c/sub>²/2=6.4×10⁻¹³ J。","也可直接用 E\u003csub>k\u003c/sub>=q²B²R²/(2m)复核。"],"回旋频率约为 6.37 MHz，最大动能为 6.4×10⁻¹³ J。"],["lor-02","lor-05"],[],["回旋加速器","回旋频率","最大动能"],11],["ind-01","电磁感应现象与产生条件","闭合电路的一部分导体切割磁感线，或穿过闭合回路的磁通量发生变化时，回路中会产生感应电流；若回路不闭合，只产生感应电动势而没有持续电流。",[["磁通量变化量","\u003cmrow>\u003cmsub>\u003cmi>Δ\u003c/mi>\u003cmi>Φ\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>Φ\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>Φ\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/mrow>","以末态减初态定义有符号的磁通量变化量"],["磁通量变化率的大小","\u003cmrow>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmi>Φ\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmo>|\u003c/mo>\u003cmsub>\u003cmi>Δ\u003c/mi>\u003cmi>Φ\u003c/mi>\u003c/msub>\u003cmo>|\u003c/mo>\u003c/mrow>\u003cmsub>\u003cmi>Δ\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/mrow>","Δ\u003csub>t\u003c/sub> 大于零，考察一段时间内磁通量变化的快慢"]],[["Phi","任一时刻穿过回路的磁通量","Wb"],["Phi\u003csub>1\u003c/sub>","初态磁通量","Wb"],["Phi\u003csub>2\u003c/sub>","末态磁通量","Wb"],["Δ\u003csub>Phi\u003c/sub>","末态减初态的磁通量变化量","Wb"],["Δ\u003csub>t\u003c/sub>","磁通量变化经历的时间","s"],["r\u003csub>Phi\u003c/sub>","磁通量变化率的大小","V"]],[["只要闭合线圈处在磁场中，就一定有感应电流","感应取决于磁通量的变化而非磁通量本身。磁通量不变情境中 Phi\u003csub>2\u003c/sub>=0.30 Wb，但正确变化量是 0。"],["把磁通量变化量写成初态减末态 Δ\u003csub>Phi\u003c/sub>=Phi\u003csub>1\u003c/sub>−Phi\u003csub>2\u003c/sub>","量纲完全正确但符号相反；在约定末态减初态后，0.12−0.36=−0.24 Wb，而正确值为 +0.24 Wb。"]],"磁通量可以通过磁感应强度 B、有效面积 S 或线圈取向改变。线圈静止在恒定磁场里，即使 Phi 很大，只要 Δ\u003csub>Phi\u003c/sub>=0 就没有感应电动势。先判断磁通量有没有变化，再判断电路是否闭合，是处理感应问题最稳妥的顺序。",["先选定回路的正法线方向，据此给磁通量规定正负。","用末态减初态得到 Δ\u003csub>Phi\u003c/sub>=Phi\u003csub>2\u003c/sub>−Phi\u003csub>1\u003c/sub>；它既可能为正，也可能为负。","若只关心变化快慢，则取 abs(Δ\u003csub>Phi\u003c/sub>) 并除以正的时间间隔 Δ\u003csub>t\u003c/sub>。","当 Phi\u003csub>2\u003c/sub>=Phi\u003csub>1\u003c/sub> 时，变化量与变化率均为零，即使回路中一直有磁场穿过，也不会因此产生感应电动势。"],["闭合线圈中的磁通量在 0.08 s 内由 0.12 Wb 均匀增加到 0.36 Wb。求磁通量变化量和平均变化率。",["按末态减初态计算：Δ\u003csub>Phi\u003c/sub>=0.36−0.12=0.24 Wb。","平均变化率 r\u003csub>Phi\u003c/sub>=0.24/0.08=3.0 Wb/s。","线圈闭合且磁通量发生变化，所以会产生感应电流；其方向还需用楞次定律判断。"],"磁通量变化量为 0.24 Wb，平均变化率为 3.0 Wb/s。"],["mag-03"],["ind-02","ind-03"],["电磁感应","产生条件","磁通量变化"],12],["ind-02","楞次定律与右手定则","楞次定律指出：感应电流产生的磁场总要阻碍引起感应电流的磁通量变化。",[["单匝线圈的楞次负号","\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">代\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>Δ\u003c/mi>\u003cmi>Φ\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmsub>\u003cmi>Δ\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/mrow>","单匝线圈，正法线和回路正方向按右手关系约定，Δ\u003csub>t\u003c/sub> 大于零"],["有符号感应电流","\u003cmrow>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi mathvariant=\"normal\">代\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">代\u003c/mi>\u003c/msub>\u003cmi>R\u003c/mi>\u003c/mfrac>\u003c/mrow>","回路闭合且总电阻 R 大于零，电流正方向与电动势正方向一致"]],[["Phi","按选定正法线计的磁通量","Wb"],["E\u003csub>代\u003c/sub>","按回路正方向计的感应电动势","V"],["Δ\u003csub>Phi\u003c/sub>","按选定正法线计的磁通量变化量","Wb"],["Δ\u003csub>t\u003c/sub>","磁通量变化时间","s"],["I\u003csub>代\u003c/sub>","按回路正方向计的感应电流","A"],["R","闭合回路总电阻","Ω"]],[["漏掉楞次定律的负号，写成 E\u003csub>代\u003c/sub>=Δ\u003csub>Phi\u003c/sub>/Δ\u003csub>t\u003c/sub>","量纲和大小都正确但方向相反；正向磁通量增加情境中错误式给 +2.0 V，正确代数值为 −2.0 V。"],["认为感应磁场方向永远与原磁场方向相反","原磁通量减少时，感应磁场应与原磁场同向以阻碍减少。这是方向判断，公式校验无法完整表示空间方向，需人工审核。"]],"“阻碍变化”不等于“阻止变化”，更不等于感应磁场永远与原磁场相反。原磁通量增加时两者反向，原磁通量减少时两者同向。公式中的负号是这一方向规律的代数表达；选择相反的正法线只会同时改变磁通量和电动势的符号，不改变真实电流方向。",["先选定线圈正法线；磁通量沿正法线为正，反向为负。","判断 Δ\u003csub>Phi\u003c/sub> 的符号：正值表示正向磁通量增加，负值表示正向磁通量减少。","楞次定律要求感应磁场反抗这一变化，因此感应电动势的代数方向与 Δ\u003csub>Phi\u003c/sub> 相反，写成 E\u003csub>代\u003c/sub>=−Δ\u003csub>Phi\u003c/sub>/Δ\u003csub>t\u003c/sub>。","得到感应磁场方向后，用安培定则把它换成线圈电流方向；直导体切割磁感线时可用右手定则快速判断。"],["单匝闭合线圈的正法线垂直纸面向外，规定从纸面外看逆时针为回路正方向。向外的磁通量在 0.05 s 内增加 0.10 Wb，回路电阻为 4.0 Ω。求感应电动势和电流的代数值，并判断方向。",["向外为正且磁通量增加，所以 Δ\u003csub>Phi\u003c/sub>=+0.10 Wb。","E\u003csub>代\u003c/sub>=−Δ\u003csub>Phi\u003c/sub>/Δ\u003csub>t\u003c/sub>=−0.10/0.05=−2.0 V。","I\u003csub>代\u003c/sub>=E\u003csub>代\u003c/sub>/R=−2.0/4.0=−0.5 A。","负号表示实际电流沿所定正方向的反向，即从纸面外看为顺时针；它产生向里的磁场来阻碍向外磁通量增加。"],"感应电动势为 −2.0 V，感应电流为 −0.5 A；实际方向从纸面外看为顺时针。"],["ind-01","mag-02"],["ind-03","ind-04"],["楞次定律","右手定则","感应电流方向"],12],["ind-03","法拉第电磁感应定律","n 匝线圈中感应电动势的平均大小等于磁通量变化率的 n 倍：\u003cspan style=\"text-decoration:overline\">E\u003c/span>=n·abs(Δ\u003csub>Phi\u003c/sub>)/Δ\u003csub>t\u003c/sub>。",[["法拉第定律的平均值","\u003cmrow>\u003cmover accent=\"true\">\u003cmi>E\u003c/mi>\u003cmo>¯\u003c/mo>\u003c/mover>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>n\u003c/mi>&#x22C5;\u003cmrow>\u003cmo>|\u003c/mo>\u003cmsub>\u003cmi>Δ\u003c/mi>\u003cmi>Φ\u003c/mi>\u003c/msub>\u003cmo>|\u003c/mo>\u003c/mrow>\u003c/mrow>\u003cmsub>\u003cmi>Δ\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/mrow>","n 匝串联线圈的每一匝经历相同磁通量变化，Δ\u003csub>t\u003c/sub> 大于零"],["匀强磁场垂直线圈时的感应电动势","\u003cmrow>\u003cmover accent=\"true\">\u003cmi>E\u003c/mi>\u003cmo>¯\u003c/mo>\u003c/mover>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmrow>\u003cmi>n\u003c/mi>&#x22C5;\u003cmi>S\u003c/mi>\u003c/mrow>&#x22C5;\u003cmrow>\u003cmo>|\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>B\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>B\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mrow>\u003cmo>|\u003c/mo>\u003c/mrow>\u003c/mrow>\u003cmsub>\u003cmi>Δ\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/mrow>","线圈面积和方向不变，匀强磁场始终垂直线圈平面"]],[["Phi","穿过单匝线圈的磁通量","Wb"],["\u003cspan style=\"text-decoration:overline\">E\u003c/span>","线圈感应电动势的平均大小","V"],["n","串联线圈匝数","1"],["Δ\u003csub>Phi\u003c/sub>","穿过单匝线圈的磁通量变化量","Wb"],["Δ\u003csub>t\u003c/sub>","磁通量变化时间","s"],["S","每匝线圈面积","m²"],["B\u003csub>1\u003c/sub>","初态垂直线圈平面的磁感应强度","T"],["B\u003csub>2\u003c/sub>","末态垂直线圈平面的磁感应强度","T"]],[["多匝线圈仍按单匝计算，漏乘匝数 n","量纲正确但数值少了 200 倍；多匝线圈情境中错误式只得 0.06 V，正确值为 12 V。"],["把感应电动势写成与变化时间成正比 \u003cspan style=\"text-decoration:overline\">E\u003c/span>=n·abs(Δ\u003csub>Phi\u003c/sub>)·Δ\u003csub>t\u003c/sub>","右侧量纲为 Wb·s，不是 V，且错误地认为变化越慢电动势越大。"]],"感应电动势由磁通量变化得有多快决定。变化量相同而用时更短，电动势更大；每匝经历相同变化时，匝数越多，总电动势越大。定律给出的是一段时间内的平均值，只有变化率恒定时它也等于这段时间内各时刻的电动势大小。",["单匝回路中，平均感应电动势大小等于单匝磁通量变化率 abs(Δ\u003csub>Phi\u003c/sub>)/Δ\u003csub>t\u003c/sub>。","n 匝线圈串联且每匝磁通量变化相同，各匝电动势相加，得到 \u003cspan style=\"text-decoration:overline\">E\u003c/span>=n·abs(Δ\u003csub>Phi\u003c/sub>)/Δ\u003csub>t\u003c/sub>。","磁场垂直面积且面积不变时，Phi=B·S，所以 Δ\u003csub>Phi\u003c/sub>=S·(B\u003csub>2\u003c/sub>−B\u003csub>1\u003c/sub>)。","代入通式得到 \u003cspan style=\"text-decoration:overline\">E\u003c/span>=n·S·abs(B\u003csub>2\u003c/sub>−B\u003csub>1\u003c/sub>)/Δ\u003csub>t\u003c/sub>。"],["100 匝线圈每匝面积为 0.020 m²，线圈平面与磁场垂直。磁感应强度在 0.10 s 内由 0.10 T 均匀增加到 0.30 T，求平均感应电动势。",["每匝磁通量变化量 Δ\u003csub>Phi\u003c/sub>=S·(B\u003csub>2\u003c/sub>−B\u003csub>1\u003c/sub>)=0.020×0.20=0.004 Wb。","由法拉第定律 \u003cspan style=\"text-decoration:overline\">E\u003c/span>=n·abs(Δ\u003csub>Phi\u003c/sub>)/Δ\u003csub>t\u003c/sub>。","代入得 \u003cspan style=\"text-decoration:overline\">E\u003c/span>=100×0.004/0.10=4.0 V。","磁场均匀变化，所以这 0.10 s 内电动势大小保持 4.0 V；方向另由楞次定律判断。"],"平均感应电动势为 4.0 V。"],["ind-01","ind-02","mag-03"],["ind-04","ind-05","ind-06"],["法拉第定律","磁通量变化率","线圈匝数"],12],["ind-04","导体切割磁感线","长度为 L 的直导体以速度 v 在匀强磁场 B 中运动，当 B、L、v 两两垂直且导体有效切割磁感线时，两端动生电动势大小为 E\u003csub>移\u003c/sub>=B·L·v。",[["垂直切割的动生电动势","\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">移\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmi>B\u003c/mi>&#x22C5;\u003cmi>L\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>v\u003c/mi>\u003c/mrow>\u003c/mrow>","直导体、速度和匀强磁场两两垂直，L 为有效长度"],["斜向切割的动生电动势","\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">移\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmrow>\u003cmi>B\u003c/mi>&#x22C5;\u003cmi>L\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>v\u003c/mi>\u003c/mrow>&#x22C5;\u003cmrow>\u003cmi mathvariant=\"normal\">sin\u003c/mi>\u003cmo>&#x2061;\u003c/mo>\u003cmo>(\u003c/mo>\u003cmi>θ\u003c/mi>\u003cmo>)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/mrow>","导体棒垂直于 B 与 v 构成的平面，θ 为 v 与 B 的夹角，取 0 至 90°"]],[["E\u003csub>移\u003c/sub>","导体棒两端的动生电动势","V"],["E\u003csub>场\u003c/sub>","导体内部由电荷分离形成的电场强度","V/m"],["B","匀强磁场的磁感应强度","T"],["L","导体棒切割磁感线的有效长度","m"],["v","导体棒相对磁场的运动速度","m/s"],["θ","速度方向与磁场方向的夹角","rad"]],[["无论运动方向怎样都直接使用 E\u003csub>移\u003c/sub>=B·L·v","斜向切割时只有垂直磁场的速度分量有效；错误式给 2.4 V，30° 情境正确值为 1.2 V。"],["把角度因子写成 cos(θ)，其中 θ 明明是速度与磁场夹角","量纲正确但角度定义用错；30° 情境错误式约得 2.078 V，正确值为 1.2 V。"]],"这类电动势来自自由电荷随导体运动时受到洛伦兹力。右手定则可判定正电荷被推向哪一端，从而判断高低电势。导体平行磁场运动时 θ=0，不切割磁感线，电动势为零；垂直运动时 θ=90°，电动势最大。",["导体中的电荷随导体以速度 v 运动，在磁场中受到洛伦兹力 q·v·B·sin(θ)。","正负电荷分离后建立电场，稳定时电场力 q·E\u003csub>场\u003c/sub> 与洛伦兹力平衡，因此 E\u003csub>场\u003c/sub>=v·B·sin(θ)。","导体两端电势差等于匀强电场与长度的乘积，得到 E\u003csub>移\u003c/sub>=B·L·v·sin(θ)。","垂直切割时 θ=90°，sin(θ)=1，化为 E\u003csub>移\u003c/sub>=B·L·v。"],["长 0.50 m 的导体棒在 0.80 T 匀强磁场中以 6.0 m/s 运动，棒垂直于磁场与速度构成的平面，速度与磁场夹角为 30°。求动生电动势。",["速度与磁场不垂直，使用 E\u003csub>移\u003c/sub>=B·L·v·sin(θ)。","代入 B=0.80 T、L=0.50 m、v=6.0 m/s、sin 30°=0.5。","E\u003csub>移\u003c/sub>=0.80×0.50×6.0×0.5=1.2 V。","该值小于垂直切割时的最大值 2.4 V，范围合理。"],"动生电动势为 1.2 V。"],["ind-02","lor-01"],["ind-05","ind-06"],["切割磁感线","动生电动势","右手定则"],12],["ind-05","感生电动势与动生电动势","磁场随时间变化、回路本身不动时产生感生电动势；导体在磁场中运动、自由电荷受洛伦兹力分离时产生动生电动势。",[["感生与动生电动势的代数叠加","\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">总\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">感\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">移\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","两部分电动势均已按同一个回路正方向确定正负号"],["电动势与非静电力做功","\u003cmrow>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi mathvariant=\"normal\">源\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">总\u003c/mi>\u003c/msub>&#x22C5;\u003cmi>q\u003c/mi>\u003c/mrow>\u003c/mrow>","电动势在搬运电荷 q 的过程中可视为恒定，q 取正的电荷量大小"]],[["E\u003csub>总\u003c/sub>","按同一回路正方向计的总感应电动势","V"],["E\u003csub>感\u003c/sub>","按回路正方向计的感生电动势","V"],["E\u003csub>移\u003c/sub>","按回路正方向计的动生电动势","V"],["W\u003csub>源\u003c/sub>","非静电力搬运电荷所做的功","J"],["q","被搬运的电荷量","C"]],[["只要同时有感生和动生电动势，就把两者大小直接相加","反向情境中错误式得 3+2=5 V，实际应按统一方向代数相加为 3+(−2)=1 V。"],["把电动势当成力，写成 W\u003csub>源\u003c/sub>=E\u003csub>总\u003c/sub>/q","电动势是单位电荷获得的能量，做功应随电荷量增大；错误式量纲也不是 J。"]],"电动势不是一种力，而是非静电力把单位正电荷从低电势端移到高电势端所做的功。感生情形由变化磁场激发的电场推动电荷，动生情形由洛伦兹力推动电荷；若两种效应同时出现，必须先统一回路正方向再判断同向相加还是反向相减。",["先给回路选定正方向，把感生电动势与动生电动势分别写成带正负号的 E\u003csub>感\u003c/sub> 和 E\u003csub>移\u003c/sub>。","沿同一闭合回路，各段非静电力对单位正电荷所做的功可以代数相加，所以 E\u003csub>总\u003c/sub>=E\u003csub>感\u003c/sub>+E\u003csub>移\u003c/sub>。","电动势的定义是非静电力做功与电荷量之比 E\u003csub>总\u003c/sub>=W\u003csub>源\u003c/sub>/q。","移项得到 W\u003csub>源\u003c/sub>=E\u003csub>总\u003c/sub>·q，说明电动势的单位 V 等价于 J/C。"],["某回路按选定正方向计有 3.0 V 感生电动势和 −2.0 V 动生电动势。求总电动势；若非静电力沿总电动势方向搬运 0.020 C 电荷，做功多少？",["两种电动势已经按同一方向给出符号，直接作代数和。","E\u003csub>总\u003c/sub>=3.0+(−2.0)=1.0 V。","W\u003csub>源\u003c/sub>=E\u003csub>总\u003c/sub>·q=1.0×0.020=0.020 J。","不能把 3.0 V 与 2.0 V 的大小直接相加，因为两种效应方向相反。"],"总电动势为 1.0 V，非静电力做功为 0.020 J。"],["ind-03","ind-04"],["ind-06"],["感生电动势","动生电动势","电动势叠加"],12],["ind-06","感应电流的电路分析","把发生电磁感应的部分看成电源：先由法拉第定律求电动势 E，再由闭合电路欧姆定律 I\u003csub>感\u003c/sub>=E/R\u003csub>总\u003c/sub> 求电流。",[["感应电流的欧姆定律","\u003cmrow>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi mathvariant=\"normal\">感\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>E\u003c/mi>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi mathvariant=\"normal\">总\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/mrow>","感应回路闭合，总电阻 R\u003csub>总\u003c/sub> 大于零且可按欧姆电路处理"],["一次磁通量变化通过的电荷量","\u003cmrow>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi mathvariant=\"normal\">感\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>n\u003c/mi>&#x22C5;\u003cmrow>\u003cmo>|\u003c/mo>\u003cmsub>\u003cmi>Δ\u003c/mi>\u003cmi>Φ\u003c/mi>\u003c/msub>\u003cmo>|\u003c/mo>\u003c/mrow>\u003c/mrow>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi mathvariant=\"normal\">总\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/mrow>","回路总电阻保持不变，磁通量从初态单调变化到末态"]],[["Phi","穿过单匝线圈的磁通量","Wb"],["I\u003csub>感\u003c/sub>","闭合回路中的平均感应电流大小","A"],["E","感应电动势大小","V"],["R\u003csub>总\u003c/sub>","线圈、电阻和导轨等组成的回路总电阻","Ω"],["Q\u003csub>感\u003c/sub>","磁通量变化期间通过回路截面的电荷量","C"],["n","串联线圈匝数","1"],["Δ\u003csub>Phi\u003c/sub>","穿过单匝线圈的磁通量变化量","Wb"],["Δ\u003csub>t\u003c/sub>","磁通量变化持续时间","s"]],[["计算多匝线圈通过的电荷量时漏乘匝数 n，写成 Q\u003csub>感\u003c/sub>=abs(Δ\u003csub>Phi\u003c/sub>)/R\u003csub>总\u003c/sub>","错误式量纲仍是 C，量纲检查抓不到；闭合感应回路情境中错误式只得 0.008 C，正确值为 0.16 C。"],["断路时因为电流为零，就认为感应电动势也为零","感应电动势由磁通量变化率决定，是否形成电流还取决于回路是否闭合。断路可有非零电动势而无持续电流，需结合电路状态人工审核。"]],"断路时 R\u003csub>总\u003c/sub> 可视为趋于无穷，电流为零，但电源两端仍可测到感应电动势。闭合后，电流大小同时受磁通量变化率和总电阻控制。电荷量公式中的时间被约去，所以相同磁通量变化无论快慢，通过的总电荷量相同；快变只是电流更大、持续时间更短。",["由法拉第定律，平均感应电动势 E=n·abs(Δ\u003csub>Phi\u003c/sub>)/Δ\u003csub>t\u003c/sub>。","闭合回路中由欧姆定律 I\u003csub>感\u003c/sub>=E/R\u003csub>总\u003c/sub>。","磁通量变化期间通过的电荷量 Q\u003csub>感\u003c/sub>=I\u003csub>感\u003c/sub>·Δ\u003csub>t\u003c/sub>。","把前两式代入，Δ\u003csub>t\u003c/sub> 被约去，得到 Q\u003csub>感\u003c/sub>=n·abs(Δ\u003csub>Phi\u003c/sub>)/R\u003csub>总\u003c/sub>。","因此相同的磁通量变化若用时变为四倍，平均电流降为四分之一，但电流与时间的乘积不变。"],["20 匝闭合线圈总电阻为 5.0 Ω，每匝磁通量在 0.20 s 内单调变化 0.040 Wb。求平均感应电动势、平均感应电流和通过截面的电荷量。",["E=n·abs(Δ\u003csub>Phi\u003c/sub>)/Δ\u003csub>t\u003c/sub>=20×0.040/0.20=4.0 V。","I\u003csub>感\u003c/sub>=E/R\u003csub>总\u003c/sub>=4.0/5.0=0.80 A。","Q\u003csub>感\u003c/sub>=I\u003csub>感\u003c/sub>·Δ\u003csub>t\u003c/sub>=0.80×0.20=0.16 C。","再用 Q\u003csub>感\u003c/sub>=n·abs(Δ\u003csub>Phi\u003c/sub>)/R\u003csub>总\u003c/sub>=20×0.040/5.0=0.16 C 互证。"],"平均感应电动势 4.0 V，平均感应电流 0.80 A，通过的电荷量 0.16 C。"],["ind-03","dc-02","dc-05"],[],["感应电流","闭合电路","感应电荷量"],12],["iad-01","自感现象与自感系数","通过线圈自身的电流发生变化时，线圈中会产生阻碍原电流变化的自感电动势。",[["自感电动势的大小","\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi>L\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi mathvariant=\"normal\">感\u003c/mi>\u003c/msub>&#x22C5;\u003cmrow>\u003cmo>|\u003c/mo>\u003cmsub>\u003cmi>Δ\u003c/mi>\u003cmi>I\u003c/mi>\u003c/msub>\u003cmo>|\u003c/mo>\u003c/mrow>\u003c/mrow>\u003cmsub>\u003cmi>Δ\u003c/mi>\u003cmi>t\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/mrow>","线圈自感系数不变，Δ\u003csub>t\u003c/sub> 大于零，只计算电动势大小"],["电阻—电感电路的时间常量","\u003cmrow>\u003cmi>τ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi mathvariant=\"normal\">感\u003c/mi>\u003c/msub>\u003cmi>R\u003c/mi>\u003c/mfrac>\u003c/mrow>","理想电感 L\u003csub>感\u003c/sub> 与电阻 R 构成一阶串联暂态电路，R 大于零"]],[["E\u003csub>L\u003c/sub>","自感电动势的大小","V"],["L\u003csub>感\u003c/sub>","线圈的自感系数","H"],["Δ\u003csub>I\u003c/sub>","线圈电流的变化量大小","A"],["Δ\u003csub>t\u003c/sub>","电流变化经历的时间","s"],["τ","电阻—电感串联电路的时间常量","s"],["R","电路中的总电阻","Ω"]],[["计算自感电动势大小时不取电流变化量的绝对值，写成 E\u003csub>L\u003c/sub>=L\u003csub>感\u003c/sub>·Δ\u003csub>I\u003c/sub>/Δ\u003csub>t\u003c/sub>","该式量纲完全正确，但在电流减小的情境中会给出 −6.0 V；这里求的是大小，应为 6.0 V，方向另由楞次定律判断。"],["认为自感电动势总与原电流方向相反","自感电动势反抗的是电流变化：通电时反抗增大，断电时反而尽力维持原电流方向。空间方向需结合绕向判断，标注人工审核。"]],"自感的关键词是“阻碍变化”而不是“阻碍电流”：通电瞬间它阻碍电流增大，断电瞬间它阻碍电流减小，因此线圈电流不能突变。L 越大或电流变化越快，自感作用越明显。含理想电感和电阻的串联电路中，时间常量 τ=L/R 刻画电流变化的快慢，τ 越大，暂态过程越慢。",["线圈电流改变会使线圈自身产生的磁通量改变，由法拉第定律在线圈中产生感应电动势。","对结构固定、磁性材料未饱和的线圈，磁通匝数与电流近似成正比，比例系数定义为自感系数 L\u003csub>感\u003c/sub>。","将这一关系代入法拉第定律，得到自感电动势大小 E\u003csub>L\u003c/sub>=L\u003csub>感\u003c/sub>·abs(Δ\u003csub>I\u003c/sub>)/Δ\u003csub>t\u003c/sub>；方向由楞次定律判断，永远反抗电流的变化。","在一阶电阻—电感串联电路中，L\u003csub>感\u003c/sub>/R 具有时间量纲，并决定暂态变化的快慢。"],["自感系数为 0.40 H 的线圈中，电流在 0.20 s 内均匀增加 3.0 A。求自感电动势大小；若电路总电阻为 2.0 Ω，求时间常量。",["自感电动势大小 E\u003csub>L\u003c/sub>=L\u003csub>感\u003c/sub>·abs(Δ\u003csub>I\u003c/sub>)/Δ\u003csub>t\u003c/sub>。","代入得 E\u003csub>L\u003c/sub>=0.40×3.0÷0.20=6.0 V。","时间常量 τ=L\u003csub>感\u003c/sub>/R=0.40÷2.0=0.20 s。","电流正在增大时，自感电动势的方向与电源推动电流增大的方向相反。"],"自感电动势大小为 6.0 V，时间常量为 0.20 s。"],["ind-02","ind-03"],["iad-03"],["自感","自感系数","时间常量"],13],["iad-02","涡流及其应用","整块导体中的磁通量发生变化时，导体内部会形成闭合的感应电流，这种电流叫涡流。",[["涡流的焦耳热功率","\u003cmrow>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmi mathvariant=\"normal\">涡\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsup>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi mathvariant=\"normal\">涡\u003c/mi>\u003c/msub>\u003cmn>2\u003c/mn>\u003c/msup>&#x22C5;\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi mathvariant=\"normal\">涡\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","用等效电流和等效电阻描述导体内的涡流发热"],["涡流产生的热量","\u003cmrow>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi mathvariant=\"normal\">涡\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmi mathvariant=\"normal\">涡\u003c/mi>\u003c/msub>&#x22C5;\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mrow>","平均发热功率 P\u003csub>涡\u003c/sub> 在时间 t 内保持不变"]],[["I\u003csub>涡\u003c/sub>","涡流等效电流的有效值","A"],["R\u003csub>涡\u003c/sub>","涡流通路的等效电阻","Ω"],["P\u003csub>涡\u003c/sub>","涡流产生焦耳热的平均功率","W"],["Q\u003csub>涡\u003c/sub>","一段时间内涡流产生的热量","J"],["t","涡流持续的时间","s"]],[["已经使用涡流有效值，却又多乘二分之一，写成 P\u003csub>涡\u003c/sub>=0.5·I\u003csub>涡\u003c/sub>²·R\u003csub>涡\u003c/sub>","有效值已把周期内变化折算进去，不能再乘二分之一。错误式量纲完全正确，却只算得 3.6 W，正确值是 7.2 W。"],["认为涡流只有危害，应在所有装置中完全消除","电磁炉和感应炉正是利用涡流发热；磁阻尼也可用于仪表稳定。是否利用或抑制取决于装置目标，属于应用判断，需人工审核。"]],"涡流不是凭空消耗能量：加热时外部电源提供的电能转化为内能；磁阻尼时物体的机械能转化为内能。若把某段涡流通路近似为电阻 R、有效电流为 I\u003csub>涡\u003c/sub>，则热功率 P\u003csub>涡\u003c/sub>=I\u003csub>涡\u003c/sub>²·R，一段时间产生的热量 Q\u003csub>涡\u003c/sub>=P\u003csub>涡\u003c/sub>·t。真实导体中的电流分布很复杂，这两个式子是等效电路模型。",["变化的磁通量在大块导体内部产生感应电动势，导体内部存在闭合路径，因而形成环状电流。","把复杂的环状电流等效为电流 I\u003csub>涡\u003c/sub> 通过电阻 R\u003csub>涡\u003c/sub>，由焦耳定律得 P\u003csub>涡\u003c/sub>=I\u003csub>涡\u003c/sub>²·R\u003csub>涡\u003c/sub>。","功率恒定时，时间 t 内转化的内能为 Q\u003csub>涡\u003c/sub>=P\u003csub>涡\u003c/sub>·t。","铁芯分层并在薄片间绝缘，会切断大的环流路径、减小涡流，从而减少无用发热。"],["把某金属块中的涡流等效为 3.0 A 电流通过 0.80 Ω 电阻，持续 5.0 s。求平均发热功率和产生的热量。",["由焦耳定律 P\u003csub>涡\u003c/sub>=I\u003csub>涡\u003c/sub>²·R\u003csub>涡\u003c/sub>。","P\u003csub>涡\u003c/sub>=3.0²×0.80=7.2 W。","Q\u003csub>涡\u003c/sub>=P\u003csub>涡\u003c/sub>·t=7.2×5.0=36 J。","这 36 J 来自维持变化磁场的外部能量，并非无来源地产生。"],"平均发热功率为 7.2 W，产生的热量为 36 J。"],["ind-01","ind-02","dc-04"],["iad-03"],["涡流","感应加热","磁阻尼"],13],["iad-03","电磁感应中的能量转化","电流通过电感线圈时，能量储存在与电流相联系的磁场中。",[["电感储存的磁场能","\u003cmrow>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmn>0.5\u003c/mn>&#x2062;\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi mathvariant=\"normal\">感\u003c/mi>\u003c/msub>\u003c/mrow>&#x22C5;\u003cmsup>\u003cmi>I\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mrow>","自感系数 L\u003csub>感\u003c/sub> 不随电流改变的线性电感"],["电感充能过程的能量守恒","\u003cmrow>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi mathvariant=\"normal\">源\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi mathvariant=\"normal\">热\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","系统初始无磁场能，末态无其他能量变化，忽略辐射等损耗"]],[["W\u003csub>m\u003c/sub>","电感线圈储存的磁场能","J"],["L\u003csub>感\u003c/sub>","线圈的自感系数","H"],["I","线圈中的电流","A"],["W\u003csub>源\u003c/sub>","电源或外力输入系统的能量","J"],["Q\u003csub>热\u003c/sub>","电阻产生并散出的热量","J"]],[["漏掉二分之一，写成 W\u003csub>m\u003c/sub>=L\u003csub>感\u003c/sub>·I²","量纲完全正确，必须靠数值检验；线圈储能情境中错误式得到 8.0 J，正确值为 4.0 J。"],["把磁场能写成与电流一次方成正比 W\u003csub>m\u003c/sub>=0.5·L\u003csub>感\u003c/sub>·I","右侧量纲不是能量，因此会被量纲检查拦住；并且电流增大一倍时，正确磁场能应增为原来的四倍，而不是两倍。"]],"楞次定律的能量本质是防止“无代价”地产生电能：要让导体切割磁感线并维持感应电流，外力通常必须克服安培力做功。理想情况下输入能量满足 W\u003csub>源\u003c/sub>=W\u003csub>m\u003c/sub>+Q\u003csub>热\u003c/sub>；若还有机械能变化，则应把动能、重力势能等一并列入总能量账本。",["建立电流时，自感电动势反抗电流增大，电源必须持续做功。","电流由 0 增至 I 的过程中，对线性电感积分可得储能 W\u003csub>m\u003c/sub>=0.5·L\u003csub>感\u003c/sub>·I²；系数 0.5 与匀加速动能公式中的系数来源相似。","若电路有电阻，一部分输入能量按焦耳定律转化为热量。","在没有其他能量变化和损耗时，能量守恒给出 W\u003csub>源\u003c/sub>=W\u003csub>m\u003c/sub>+Q\u003csub>热\u003c/sub>。"],["自感系数为 0.50 H 的线圈中建立 4.0 A 电流。若电源在建立电流过程中共输入 10 J，求线圈储存的磁场能和电阻产生的热量。",["W\u003csub>m\u003c/sub>=0.5·L\u003csub>感\u003c/sub>·I²=0.5×0.50×4.0²=4.0 J。","由能量守恒 W\u003csub>源\u003c/sub>=W\u003csub>m\u003c/sub>+Q\u003csub>热\u003c/sub>。","Q\u003csub>热\u003c/sub>=10−4.0=6.0 J。","输入能量没有消失，而是分别储存在磁场中和转化为内能。"],"磁场能为 4.0 J，产生的热量为 6.0 J。"],["iad-01","ene-07"],["iad-04"],["磁场能","能量守恒","自感储能"],13],["iad-04","电磁感应中的力学综合：导轨与导体棒","导体棒在平行导轨上垂直切割匀强磁场时，动生电动势 E=B·L·v；闭合回路中电流 I\u003csub>感\u003c/sub>=B·L·v/R\u003csub>总\u003c/sub>，导体棒受到与运动相反的安培力 F\u003csub>安\u003c/sub>=B·I\u003csub>感\u003c/sub>·L。",[["导体棒切割产生的感应电流","\u003cmrow>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi mathvariant=\"normal\">感\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmrow>\u003cmi>B\u003c/mi>&#x22C5;\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi mathvariant=\"normal\">棒\u003c/mi>\u003c/msub>\u003c/mrow>&#x22C5;\u003cmi>v\u003c/mi>\u003c/mrow>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi mathvariant=\"normal\">总\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/mrow>","B、L\u003csub>棒\u003c/sub>、v 两两垂直，闭合回路总电阻恒定且大于零"],["导体棒受到的安培阻力","\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi mathvariant=\"normal\">安\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmrow>\u003cmsup>\u003cmi>B\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>&#x22C5;\u003cmsup>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi mathvariant=\"normal\">棒\u003c/mi>\u003c/msub>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>&#x22C5;\u003cmi>v\u003c/mi>\u003c/mrow>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi mathvariant=\"normal\">总\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/mrow>","由 F\u003csub>安\u003c/sub>=B·I\u003csub>感\u003c/sub>·L\u003csub>棒\u003c/sub> 与感应电流公式合并，方向与运动相反"],["恒定驱动力下的终端速度","\u003cmrow>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi mathvariant=\"normal\">端\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi mathvariant=\"normal\">驱\u003c/mi>\u003c/msub>&#x22C5;\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi mathvariant=\"normal\">总\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmsup>\u003cmi>B\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>&#x22C5;\u003cmsup>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi mathvariant=\"normal\">棒\u003c/mi>\u003c/msub>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mfrac>\u003c/mrow>","导体棒达到稳定匀速，驱动力与安培阻力大小相等"]],[["I\u003csub>感\u003c/sub>","闭合回路中的感应电流","A"],["B","垂直导轨平面的匀强磁场磁感应强度","T"],["L\u003csub>棒\u003c/sub>","导体棒接入回路的有效长度","m"],["v","导体棒切割磁感线的速度","m/s"],["R\u003csub>总\u003c/sub>","导体棒与导轨构成回路的总电阻","Ω"],["F\u003csub>安\u003c/sub>","导体棒受到的安培阻力大小","N"],["F\u003csub>驱\u003c/sub>","沿运动方向的恒定驱动力","N"],["v\u003csub>端\u003c/sub>","安培阻力与驱动力平衡时的终端速度","m/s"]],[["不论导体棒速度多大，都直接令安培阻力等于恒定驱动力","两者只在终端匀速状态相等。速度减半情境中实际安培阻力为 0.40 N，驱动力仍为 0.80 N，导体棒仍会加速。"],["认为导体棒速度越大，安培阻力越小","错误式不仅量纲不对，也颠倒了反馈关系；正确关系中安培阻力与速度成正比。"]],"处理导轨—导体棒题应按“运动生电—电流生力—力又改变运动”的闭环分析。安培力方向由楞次定律保证其阻碍磁通量变化。在恒定驱动力 F\u003csub>驱\u003c/sub> 下，终端状态满足 F\u003csub>安\u003c/sub>=F\u003csub>驱\u003c/sub>，因此 v\u003csub>端\u003c/sub>=F\u003csub>驱\u003c/sub>·R\u003csub>总\u003c/sub>/(B²·L²)。此时外力功率全部转化为焦耳热功率。",["导体棒垂直切割磁感线，产生动生电动势 E=B·L\u003csub>棒\u003c/sub>·v。","闭合回路由欧姆定律得 I\u003csub>感\u003c/sub>=E/R\u003csub>总\u003c/sub>=B·L\u003csub>棒\u003c/sub>·v/R\u003csub>总\u003c/sub>。","载流导体棒受到安培力 F\u003csub>安\u003c/sub>=B·I\u003csub>感\u003c/sub>·L\u003csub>棒\u003c/sub>，代入电流式得到 F\u003csub>安\u003c/sub>=B²·L\u003csub>棒\u003c/sub>²·v/R\u003csub>总\u003c/sub>。","安培力阻碍运动；恒定驱动力作用下达到终端速度时 F\u003csub>驱\u003c/sub>=F\u003csub>安\u003c/sub>，移项得到 v\u003csub>端\u003c/sub>=F\u003csub>驱\u003c/sub>·R\u003csub>总\u003c/sub>/(B²·L\u003csub>棒\u003c/sub>²)。"],["长 0.40 m 的导体棒在 0.50 T 匀强磁场中沿导轨运动，回路总电阻为 0.30 Ω。恒定驱动力 0.80 N 使导体棒最终匀速。求终端速度、感应电流和安培阻力。",["终端状态满足 F\u003csub>驱\u003c/sub>=F\u003csub>安\u003c/sub>，使用 v\u003csub>端\u003c/sub>=F\u003csub>驱\u003c/sub>·R\u003csub>总\u003c/sub>/(B²·L\u003csub>棒\u003c/sub>²)。","v\u003csub>端\u003c/sub>=0.80×0.30÷(0.50²×0.40²)=6.0 m/s。","I\u003csub>感\u003c/sub>=B·L\u003csub>棒\u003c/sub>·v/R\u003csub>总\u003c/sub>=0.50×0.40×6.0÷0.30=4.0 A。","F\u003csub>安\u003c/sub>=B·I\u003csub>感\u003c/sub>·L\u003csub>棒\u003c/sub>=0.50×4.0×0.40=0.80 N，与驱动力相等，完成互证。"],"终端速度 6.0 m/s，感应电流 4.0 A，安培阻力 0.80 N。"],["ind-04","ind-06","mag-04","dyn-05"],["iad-05"],["导轨导体棒","安培阻力","终端速度"],13],["iad-05","电磁感应中的图像问题","图像题既要读纵坐标，也要读斜率和面积。",[["由电动势—时间图像面积求磁通量变化","\u003cmrow>\u003cmsub>\u003cmi>Δ\u003c/mi>\u003cmi>Φ\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmi>E\u003c/mi>\u003c/msub>\u003cmi>n\u003c/mi>\u003c/mfrac>\u003c/mrow>","A\u003csub>E\u003c/sub> 为某时间段 E-t 图像代数面积的绝对值，n 为串联匝数"],["由电流—时间图像面积求电荷量","\u003cmrow>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi mathvariant=\"normal\">感\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmi>I\u003c/mi>\u003c/msub>\u003c/mrow>","A\u003csub>I\u003c/sub> 为 I-t 图像按电流方向取正负后的代数面积"]],[["A\u003csub>E\u003c/sub>","感应电动势—时间图像面积的绝对值","Wb"],["Phi","穿过单匝线圈的磁通量","Wb"],["\u003cspan style=\"text-decoration:overline\">E\u003c/span>","该时间段内感应电动势的平均大小","V"],["Δ\u003csub>t\u003c/sub>","所考察的时间间隔","s"],["n","串联线圈匝数","1"],["Δ\u003csub>Phi\u003c/sub>","单匝线圈磁通量变化大小","Wb"],["A\u003csub>I\u003c/sub>","电流—时间图像的代数面积","C"],["\u003cspan style=\"text-decoration:overline\">I\u003c/span>","该时间段内的平均电流","A"],["Q\u003csub>感\u003c/sub>","该时间段通过回路截面的电荷量","C"],["Δ\u003csub>Q\u003c/sub>","短时间内通过回路截面的电荷量变化","C"]],[["读 E-t 图像面积后直接当作单匝磁通量变化，漏除匝数 n","E-t 面积对应的是磁通匝数变化。40 匝情境中面积为 0.80 Wb，而单匝磁通量只变化 0.020 Wb。"],["把 I-t 图像某时刻的纵坐标直接当作通过的电荷量","电流单位是 A，电荷量单位是 C，必须乘时间或求图像面积；0.60 A 持续 0.20 s 只通过 0.12 C。"]],"Phi-t 图像的斜率对应感应电动势，E-t 图像的面积对应磁通匝数变化，I-t 图像的面积对应电荷量。面积必须按横纵坐标单位计算，位于时间轴上下的部分要先按正负作代数求和；本知识点的公式取绝对值，只用于磁通量变化大小或单向电流通过的电荷量。",["法拉第定律写成大小关系 \u003cspan style=\"text-decoration:overline\">E\u003c/span>=n·Δ\u003csub>Phi\u003c/sub>/Δ\u003csub>t\u003c/sub>。","两边乘 Δ\u003csub>t\u003c/sub>，得到 \u003cspan style=\"text-decoration:overline\">E\u003c/span>·Δ\u003csub>t\u003c/sub>=n·Δ\u003csub>Phi\u003c/sub>；左侧正是恒定电动势对应的矩形面积，一般曲线则由各小时间段面积相加。","因此 E-t 图像面积绝对值 A\u003csub>E\u003c/sub>=n·Δ\u003csub>Phi\u003c/sub>，移项得 Δ\u003csub>Phi\u003c/sub>=A\u003csub>E\u003c/sub>/n。","由电流定义 I=Δ\u003csub>Q\u003c/sub>/Δ\u003csub>t\u003c/sub>，可得 Δ\u003csub>Q\u003c/sub>=I·Δ\u003csub>t\u003c/sub>，所以 I-t 图像的代数面积就是通过截面的电荷量。"],["40 匝线圈的 E-t 图像在 0.20 s 内为高度 4.0 V 的矩形；同一时段 I-t 图像为高度 1.2 A 的矩形。求每匝磁通量变化大小和通过截面的电荷量。",["E-t 图像面积 A\u003csub>E\u003c/sub>=4.0×0.20=0.80 V·s。","每匝磁通量变化 Δ\u003csub>Phi\u003c/sub>=A\u003csub>E\u003c/sub>/n=0.80÷40=0.020 Wb。","I-t 图像面积 A\u003csub>I\u003c/sub>=1.2×0.20=0.24 A·s。","因为 1 A·s=1 C，所以通过截面的电荷量 Q\u003csub>感\u003c/sub>=0.24 C。"],"每匝磁通量变化大小为 0.020 Wb，通过的电荷量为 0.24 C。"],["ind-03","ind-06"],[],["图像","面积","磁通量变化","电荷量"],13],["ac-01","交变电流的产生","矩形线圈在匀强磁场中绕垂直于磁场的轴匀速转动时，穿过线圈的磁通量周期性变化，产生正弦式交变电动势。",[["旋转线圈电动势峰值","\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmrow>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmi mathvariant=\"normal\">匝\u003c/mi>\u003c/msub>&#x22C5;\u003cmi>B\u003c/mi>\u003c/mrow>&#x22C5;\u003cmsub>\u003cmi>S\u003c/mi>\u003cmi mathvariant=\"normal\">线圈\u003c/mi>\u003c/msub>\u003c/mrow>&#x22C5;\u003cmi>ω\u003c/mi>\u003c/mrow>\u003c/mrow>","N\u003csub>匝\u003c/sub> 匝线圈在匀强磁场中绕垂直于磁场的轴匀速转动，线圈面积和磁场均匀"],["角速度与频率的关系","\u003cmrow>\u003cmi>f\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>ω\u003c/mi>\u003cmrow>\u003cmn>2\u003c/mn>&#x2062;\u003cmi>π\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>","线圈做匀速圆周转动，ω 用 rad/s 表示"]],[["E\u003csub>m\u003c/sub>","正弦式交变电动势的峰值","V"],["N\u003csub>匝\u003c/sub>","串联线圈匝数","1"],["B","匀强磁场的磁感应强度","T"],["S\u003csub>线圈\u003c/sub>","每匝线圈的有效面积","m²"],["ω","线圈转动的角速度","rad/s"],["f","交变电流的频率","Hz"],["Phi","穿过单匝线圈的磁通量","Wb"]],[["计算多匝线圈的峰值时漏乘匝数，写成 E\u003csub>m\u003c/sub>=B·S\u003csub>线圈\u003c/sub>·ω","匝数是无量纲量，漏掉它后量纲仍然完全正确，量纲检查抓不到。此情境错误式只得到 1 V，100 匝串联线圈的正确峰值是 100 V。"],["认为磁通量最大时，感应电动势也最大","感应电动势取决于磁通量的变化率，不取决于磁通量本身。磁通量处在最大值时瞬时变化率为零，电动势也为零。这个相位判断需要结合图像人工审核。"]],"产生交变电流的本质仍是电磁感应。线圈平面与磁场垂直时磁通量最大，但磁通量变化率为零，感应电动势反而为零；线圈平面与磁场平行时磁通量为零，但变化率最大，电动势达到峰值。峰值随匝数、磁场强度、线圈面积和转速增大而增大。",["线圈转动时，磁通量可写成 Phi=B·S\u003csub>线圈\u003c/sub>·cos(ω·t)。","由法拉第电磁感应定律，感应电动势与磁通量对时间的变化率有关；对余弦函数求变化率得到正弦变化。","N\u003csub>匝\u003c/sub> 匝串联线圈的电动势相加，峰值为 E\u003csub>m\u003c/sub>=N\u003csub>匝\u003c/sub>·B·S\u003csub>线圈\u003c/sub>·ω。","转动一周相位增加 2·π，因此 ω=2·π·f，移项得 f=ω/(2·π)。"],["100 匝线圈在 0.50 T 匀强磁场中匀速转动，每匝面积为 0.020 m²，角速度为 100 rad/s。求电动势峰值和频率。",["由 E\u003csub>m\u003c/sub>=N\u003csub>匝\u003c/sub>·B·S\u003csub>线圈\u003c/sub>·ω。","E\u003csub>m\u003c/sub>=100×0.50×0.020×100=100 V。","f=ω/(2·π)=100/(2·π)≈15.9 Hz。"],"电动势峰值为 100 V，频率约为 15.9 Hz。"],["ind-03"],["ac-02","ac-03"],["交变电流","旋转线圈","峰值","频率"],14],["ac-02","交变电流的峰值、有效值、周期与频率","交变电流在一个周期内方向和大小都可能改变。",[["正弦交变电压的有效值","\u003cmrow>\u003cmsub>\u003cmi>U\u003c/mi>\u003cmi mathvariant=\"normal\">有效\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>U\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cmsqrt>\u003cmn>2\u003c/mn>\u003c/msqrt>\u003c/mfrac>\u003c/mrow>","电压随时间按正弦规律变化"],["正弦交变电流的有效值","\u003cmrow>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi mathvariant=\"normal\">有效\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cmsqrt>\u003cmn>2\u003c/mn>\u003c/msqrt>\u003c/mfrac>\u003c/mrow>","电流随时间按正弦规律变化"]],[["U\u003csub>有效\u003c/sub>","正弦交变电压的有效值","V"],["U\u003csub>m\u003c/sub>","正弦交变电压的峰值","V"],["I\u003csub>有效\u003c/sub>","正弦交变电流的有效值","A"],["I\u003csub>m\u003c/sub>","正弦交变电流的峰值","A"]],[["把正弦交变电压的有效值当成峰值的一半，写成 U\u003csub>有效\u003c/sub>=U\u003csub>m\u003c/sub>/2","错误式量纲正确，只能靠数值实测抓住：峰值 141.421 V 时会算出 70.711 V，正确有效值是 100 V。"],["认为任何周期交变电流都满足有效值等于峰值除以 √(2)","√(2) 关系只适用于正弦式交变电流；其他波形必须由相同发热效果定义有效值。这是适用条件判断，标注人工审核。"]],"有效值不是一段时间内瞬时值的算术平均；正弦交变电流一周期的代数平均值为零，却仍能持续发热。只有正弦式交变电流的峰值与有效值之间才是 √(2) 倍关系，方波等其他波形必须依据发热效果另算。电器铭牌、电压表和电流表的交流示数通常采用有效值。",["让正弦交变电流与某一直流分别通过同一电阻，在相同时间内产生相同热量，这一直流数值定义为交变电流的有效值。","正弦电流平方在一个周期内的平均值是峰值平方的一半，因此 I\u003csub>有效\u003c/sub>²=I\u003csub>m\u003c/sub>²/2。","取非负平方根得到 I\u003csub>有效\u003c/sub>=I\u003csub>m\u003c/sub>/√(2)，电压同理得到 U\u003csub>有效\u003c/sub>=U\u003csub>m\u003c/sub>/√(2)。","这一结论依赖正弦波形，不能不加判断地用于任意周期电流。"],["某正弦式交变电压峰值为 141.4 V，电流峰值为 2.83 A。求电压和电流的有效值。",["正弦电压有效值 U\u003csub>有效\u003c/sub>=U\u003csub>m\u003c/sub>/√(2)。","U\u003csub>有效\u003c/sub>≈141.4÷1.414≈100 V。","正弦电流有效值 I\u003csub>有效\u003c/sub>=I\u003csub>m\u003c/sub>/√(2)≈2.83÷1.414≈2.00 A。"],"电压有效值约为 100 V，电流有效值约为 2.00 A。"],["ac-01","dc-04"],["ac-03","ac-04"],["有效值","峰值","正弦交流"],14],["ac-03","正弦式交变电流的表达式与图像","若从电压由零沿正方向增大的时刻开始计时，正弦式交变电压可写成 u=U\u003csub>m\u003c/sub>·sin(ω·t)。",[["正弦交变电压的瞬时值","\u003cmrow>\u003cmi>u\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>U\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>&#x22C5;\u003cmrow>\u003cmi mathvariant=\"normal\">sin\u003c/mi>\u003cmo>&#x2061;\u003c/mo>\u003cmo>(\u003c/mo>\u003cmrow>\u003cmi>ω\u003c/mi>&#x22C5;\u003cmi>t\u003c/mi>\u003c/mrow>\u003cmo>)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/mrow>","从电压过零且沿正方向增大的时刻开始计时，初相位为零"],["相位随时间的变化","\u003cmrow>\u003cmi>φ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>ω\u003c/mi>&#x22C5;\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mrow>","角频率保持不变且初相位取零"]],[["u","t 时刻交变电压的瞬时值","V"],["U\u003csub>m\u003c/sub>","交变电压峰值","V"],["ω","角频率","rad/s"],["t","从规定零相位时刻开始的时间","s"],["φ","相位","rad"]],[["把零相位的正弦表达式误写成余弦式 u=U\u003csub>m\u003c/sub>·cos(ω·t)","正弦与余弦的量纲完全相同，量纲检查无法发现相位错位。四分之一周期时错误式给出 0 V，而正确瞬时值为 100 V。"],["把任意计时起点都写成 u=U\u003csub>m\u003c/sub>·sin(ω·t)，忽略初相位","只有从电压过零且沿正方向增大的时刻开始计时，初相位才为零。换起点后应写入相应初相位，这需要结合题图人工判断。"]],"表达式、图像和线圈位置描述的是同一个周期过程。读图时要区分瞬时值与峰值：纵坐标 u 是某一时刻的电压，U\u003csub>m\u003c/sub> 是整条曲线能达到的最大绝对值。若计时起点改变，表达式还需加入初相位；本知识点选择初相位为零的标准情形。",["线圈匀速转动时，相位随时间均匀增加，初相位为零时 φ=ω·t。","旋转线圈产生的感应电动势按相位的正弦变化，因此 u=U\u003csub>m\u003c/sub>·sin(φ)。","代入 φ=ω·t 得 u=U\u003csub>m\u003c/sub>·sin(ω·t)。","当相位依次为 0、π/2、π、3·π/2、2·π 时，瞬时值依次为 0、U\u003csub>m\u003c/sub>、0、-U\u003csub>m\u003c/sub>、0。"],["某正弦交变电压 u=100·sin(100·π·t) V。从计时开始经过 0.005 s，求相位和瞬时电压。",["角频率 ω=100·π rad/s。","相位 φ=ω·t=100·π×0.005=π/2。","u=100·sin(π/2)=100 V。"],"相位为 π/2 rad，瞬时电压为 100 V。"],["ac-01","ac-02"],["ac-04"],["瞬时值","正弦图像","相位"],14],["ac-04","理想变压器","理想变压器忽略漏磁、线圈电阻和铁芯能量损耗。",[["理想变压器的电压关系","\u003cmrow>\u003cmsub>\u003cmi>U\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>U\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>&#x22C5;\u003cmsub>\u003cmi>N\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mfrac>\u003c/mrow>","理想变压器正常接入交变电流，原副线圈磁通量变化相同"],["理想变压器的电流关系","\u003cmrow>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>&#x22C5;\u003cmsub>\u003cmi>N\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mrow>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mfrac>\u003c/mrow>","理想变压器带有负载，输入功率等于输出功率"]],[["U\u003csub>1\u003c/sub>","原线圈两端交变电压的有效值","V"],["U\u003csub>2\u003c/sub>","副线圈两端交变电压的有效值","V"],["N\u003csub>1\u003c/sub>","原线圈匝数","1"],["N\u003csub>2\u003c/sub>","副线圈匝数","1"],["I\u003csub>1\u003c/sub>","原线圈电流的有效值","A"],["I\u003csub>2\u003c/sub>","副线圈电流的有效值","A"]],[["认为理想变压器的电流也与匝数成正比，写成 I\u003csub>2\u003c/sub>=I\u003csub>1\u003c/sub>·N\u003csub>2\u003c/sub>/N\u003csub>1\u003c/sub>","量纲正确但数值错误：该降压情境会算出 0.2 A，正确值是 5.0 A；正确关系由功率守恒决定，电流与匝数成反比。"],["把稳定直流接入普通变压器，认为仍能持续得到按匝数比变化的电压","稳定直流建立后磁通量不再变化，副线圈没有持续感应电动势；原线圈还可能因电流过大而发热损坏。这是适用条件判断，需人工审核。"]],"变压器改变交变电压和电流，却不凭空创造能量。副线圈匝数少于原线圈时降压但增流；副线圈匝数多时升压但减流。电压比只由匝数比决定，而原线圈电流还会随副线圈负载改变。稳定直流不能产生持续变化的磁通量，因此普通变压器不能用稳定直流正常变压。",["理想铁芯使原、副线圈每匝经历相同的磁通量变化率。","由法拉第定律，线圈电压与匝数成正比，因此 U\u003csub>1\u003c/sub>/U\u003csub>2\u003c/sub>=N\u003csub>1\u003c/sub>/N\u003csub>2\u003c/sub>。","理想变压器无能量损耗，输入功率等于输出功率：U\u003csub>1\u003c/sub>·I\u003csub>1\u003c/sub>=U\u003csub>2\u003c/sub>·I\u003csub>2\u003c/sub>。","把电压比代入功率关系，得到 I\u003csub>1\u003c/sub>/I\u003csub>2\u003c/sub>=N\u003csub>2\u003c/sub>/N\u003csub>1\u003c/sub>，即电流与匝数成反比。"],["理想变压器原线圈 1000 匝，接 220 V 交变电压；副线圈 200 匝，负载电流为 5.0 A。求副线圈电压和原线圈电流。",["U\u003csub>2\u003c/sub>=U\u003csub>1\u003c/sub>·N\u003csub>2\u003c/sub>/N\u003csub>1\u003c/sub>=220×200÷1000=44 V。","理想变压器功率守恒，或直接用 I\u003csub>2\u003c/sub>=I\u003csub>1\u003c/sub>·N\u003csub>1\u003c/sub>/N\u003csub>2\u003c/sub>。","I\u003csub>1\u003c/sub>=I\u003csub>2\u003c/sub>·N\u003csub>2\u003c/sub>/N\u003csub>1\u003c/sub>=5.0×200÷1000=1.0 A。","验算：220×1.0=44×5.0=220 W。"],"副线圈电压为 44 V，原线圈电流为 1.0 A。"],["ind-03","ac-02"],["ac-05"],["变压器","匝数比","功率守恒"],14],["ac-05","远距离输电","输送功率 P\u003csub>送\u003c/sub> 和输电电压 U\u003csub>送\u003c/sub> 确定时，线路电流 I\u003csub>线\u003c/sub>=P\u003csub>送\u003c/sub>/U\u003csub>送\u003c/sub>。",[["输电线电流","\u003cmrow>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi mathvariant=\"normal\">线\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmi mathvariant=\"normal\">送\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>U\u003c/mi>\u003cmi mathvariant=\"normal\">送\u003c/mi>\u003c/msub>\u003c/mfrac
