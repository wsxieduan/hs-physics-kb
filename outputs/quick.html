><\/msup><\/mrow>&#x22C5;<msup><mi>v<\/mi><mn>2<\/mn><\/msup><\/mrow><mi>R<\/mi><\/mfrac><\/mrow>","无电源、自感与其他能量储存，机械能损失率等于焦耳热率"],["无源速度指数衰减","<mrow><msup><mi>v<\/mi><mo>′<\/mo><\/msup><mo>=<\/mo><mrow><mi>v<\/mi>⋅<mrow><mi>e<\/mi><mo>⁡<\/mo><mo>(<\/mo><mfrac><mrow><mrow><mrow><mo>(<\/mo><mo>−<\/mo><msup><mi>B<\/mi><mn>2<\/mn><\/msup><mo>)<\/mo><\/mrow><msup><mi>L<\/mi><mn>2<\/mn><\/msup><\/mrow>⋅<mi>t<\/mi><\/mrow><mrow><mi>m<\/mi>⋅<mi>R<\/mi><\/mrow><\/mfrac><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","初始速度为v，随后只受电磁制动且模型参数恒定"],["带恒定负载的驱动稳态","<mrow><msub><mi>v<\/mi><mi>s<\/mi><\/msub><mo>=<\/mo><mrow><mfrac><mi>U<\/mi><mrow><mi>B<\/mi>&#x22C5;<mi>L<\/mi><\/mrow><\/mfrac><mo>−<\/mo><mfrac><mrow><msub><mi>F<\/mi><mi>e<\/mi><\/msub>&#x22C5;<mi>R<\/mi><\/mrow><mrow><msup><mi>B<\/mi><mn>2<\/mn><\/msup>&#x22C5;<msup><mi>L<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mrow><\/mrow>","恒电压驱动、磁场非零；正向运行需驱动力可克服负载"]],[["B","垂直回路的磁感应强度大小","T"],["L","杆的有效切割长度","m"],["R","回路总电阻","Ω"],["v","杆的当前速度大小","m/s"],["v′","无源制动经过时间t后的速度","m/s"],["v<sub>s<\/sub>","有源驱动的稳定速度","m/s"],["m","杆质量","kg"],["F","无源制动力大小","N"],["I","当前回路电流大小","A"],["P","无源制动功率","W"],["U","恒定电源电压","V"],["F<sub>e<\/sub>","驱动情形中恒定反向负载","N"],["t","无源制动经过时间","s"]],[["误把电磁制动力多除以二","电磁制动力由瞬时电流与安培力共同给出，不含累积功中的二分之一；额外除以二会使本例制动力变为1.5 N，量纲完全相同。"],["把电磁驱动中的反电动势当成额外助推电压","运动电动势反映机械能与电能转化，正常电动运行时降低驱动电流；把它加到电源电压会错误预测越快电流越大。"]],"本卡分别限定无源制动和直流电源驱动的光滑导轨模型：磁场、有效切割长度及总电阻恒定，忽略自感。制动力随速度变化，所以不是恒力减速；无源杆指数趋于静止。电源驱动时必须计入反电动势，恒定反向负载下存在稳定速度，断路时没有持续电流制动力，零电阻情形不能使用本模型。",["先确认回路是否外接电源，选定速度、电流和磁力的方向。","无源时动生电动势建立电流，磁力阻碍运动，机械功率等于电热功率。","制动力正比速度，运动方程给指数衰减，不可直接用恒加速度公式。","有源时用电源电压减反电动势求电流，稳定条件是磁力平衡反向负载。"],["无源闭合回路中，2 kg杆长1 m，磁场2 T，总电阻4 Ω，初速3 m/s。求初始制动力、热功率和2ln2秒后的速度。",["初电动势6 V、电流1.5 A，制动力3 N，焦耳热功率9 W。","速度衰减率为0.5 s⁻¹，经过2ln2秒，初速乘1/2得到1.5 m/s。"],"初制动力3 N、初热功率9 W，随后速度1.5 m/s。"],["iad-03","iad-04"],["iad-06","mdl-19"],["电磁阻尼","反电动势","电磁驱动"],13,""],["ac-01","交变电流的产生","矩形线圈在匀强磁场中绕垂直于磁场的轴匀速转动时，穿过线圈的磁通量周期性变化，产生正弦式交变电动势。",[["旋转线圈电动势峰值","<mrow><msub><mi>E<\/mi><mi>m<\/mi><\/msub><mo>=<\/mo><mrow><mrow><mrow><msub><mi>N<\/mi><mi mathvariant=\"normal\">匝<\/mi><\/msub>&#x22C5;<mi>B<\/mi><\/mrow>&#x22C5;<msub><mi>S<\/mi><mi mathvariant=\"normal\">线圈<\/mi><\/msub><\/mrow>&#x22C5;<mi>ω<\/mi><\/mrow><\/mrow>","N<sub>匝<\/sub> 匝线圈在匀强磁场中绕垂直于磁场的轴匀速转动，线圈面积和磁场均匀"],["角速度与频率的关系","<mrow><mi>f<\/mi><mo>=<\/mo><mfrac><mi>ω<\/mi><mrow><mn>2<\/mn>&#x2062;<mi>π<\/mi><\/mrow><\/mfrac><\/mrow>","线圈做匀速圆周转动，ω 用 rad/s 表示"]],[["E<sub>m<\/sub>","正弦式交变电动势的峰值","V"],["N<sub>匝<\/sub>","串联线圈匝数","1"],["B","匀强磁场的磁感应强度","T"],["S<sub>线圈<\/sub>","每匝线圈的有效面积","m²"],["ω","线圈转动的角速度","rad/s"],["f","交变电流的频率","Hz"],["Φ","穿过单匝线圈的磁通量","Wb"]],[["计算多匝线圈的峰值时漏乘匝数，写成 E<sub>m<\/sub>=B·S<sub>线圈<\/sub>·ω","匝数是无量纲量，漏掉它后量纲仍然完全正确，量纲检查抓不到。此情境错误式只得到 1 V，100 匝串联线圈的正确峰值是 100 V。"],["认为磁通量最大时，感应电动势也最大","感应电动势取决于磁通量的变化率，不取决于磁通量本身。磁通量处在最大值时瞬时变化率为零，电动势也为零。这个相位判断需要结合图像人工审核。"]],"产生交变电流的本质仍是电磁感应。线圈平面与磁场垂直时磁通量最大，但磁通量变化率为零，感应电动势反而为零；线圈平面与磁场平行时磁通量为零，但变化率最大，电动势达到峰值。峰值随匝数、磁场强度、线圈面积和转速增大而增大。",["线圈转动时，磁通量可写成 Φ=B·S<sub>线圈<\/sub>·cos(ω·t)。","由法拉第电磁感应定律，感应电动势与磁通量对时间的变化率有关；对余弦函数求变化率得到正弦变化。","N<sub>匝<\/sub> 匝串联线圈的电动势相加，峰值为 E<sub>m<\/sub>=N<sub>匝<\/sub>·B·S<sub>线圈<\/sub>·ω。","转动一周相位增加 2·π，因此 ω=2·π·f，移项得 f=ω/(2·π)。"],["100 匝线圈在 0.50 T 匀强磁场中匀速转动，每匝面积为 0.020 m²，角速度为 100 rad/s。求电动势峰值和频率。",["由 E<sub>m<\/sub>=N<sub>匝<\/sub>·B·S<sub>线圈<\/sub>·ω。","E<sub>m<\/sub>=100×0.50×0.020×100=100 V。","f=ω/(2·π)=100/(2·π)≈15.9 Hz。"],"电动势峰值为 100 V，频率约为 15.9 Hz。"],["ind-03"],["ac-02","ac-03"],["交变电流","旋转线圈","峰值","频率"],14,""],["ac-02","交变电流的峰值、有效值、周期与频率","交变电流在一个周期内方向和大小都可能改变。",[["正弦交变电压的有效值","<mrow><msub><mi>U<\/mi><mi mathvariant=\"normal\">有效<\/mi><\/msub><mo>=<\/mo><mfrac><msub><mi>U<\/mi><mi>m<\/mi><\/msub><msqrt><mn>2<\/mn><\/msqrt><\/mfrac><\/mrow>","电压随时间按正弦规律变化"],["正弦交变电流的有效值","<mrow><msub><mi>I<\/mi><mi mathvariant=\"normal\">有效<\/mi><\/msub><mo>=<\/mo><mfrac><msub><mi>I<\/mi><mi>m<\/mi><\/msub><msqrt><mn>2<\/mn><\/msqrt><\/mfrac><\/mrow>","电流随时间按正弦规律变化"]],[["U<sub>有效<\/sub>","正弦交变电压的有效值","V"],["U<sub>m<\/sub>","正弦交变电压的峰值","V"],["I<sub>有效<\/sub>","正弦交变电流的有效值","A"],["I<sub>m<\/sub>","正弦交变电流的峰值","A"]],[["把正弦交变电压的有效值当成峰值的一半，写成 U<sub>有效<\/sub>=U<sub>m<\/sub>/2","错误式量纲正确，只能靠数值实测抓住：峰值 141.421 V 时会算出 70.711 V，正确有效值是 100 V。"],["认为任何周期交变电流都满足有效值等于峰值除以 √(2)","√(2) 关系只适用于正弦式交变电流；其他波形必须由相同发热效果定义有效值。这是适用条件判断，标注人工审核。"]],"有效值不是一段时间内瞬时值的算术平均；正弦交变电流一周期的代数平均值为零，却仍能持续发热。只有正弦式交变电流的峰值与有效值之间才是 √(2) 倍关系，方波等其他波形必须依据发热效果另算。电器铭牌、电压表和电流表的交流示数通常采用有效值。",["让正弦交变电流与某一直流分别通过同一电阻，在相同时间内产生相同热量，这一直流数值定义为交变电流的有效值。","正弦电流平方在一个周期内的平均值是峰值平方的一半，因此 I<sub>有效<\/sub>²=I<sub>m<\/sub>²/2。","取非负平方根得到 I<sub>有效<\/sub>=I<sub>m<\/sub>/√(2)，电压同理得到 U<sub>有效<\/sub>=U<sub>m<\/sub>/√(2)。","这一结论依赖正弦波形，不能不加判断地用于任意周期电流。"],["某正弦式交变电压峰值为 141.4 V，电流峰值为 2.83 A。求电压和电流的有效值。",["正弦电压有效值 U<sub>有效<\/sub>=U<sub>m<\/sub>/√(2)。","U<sub>有效<\/sub>≈141.4÷1.414≈100 V。","正弦电流有效值 I<sub>有效<\/sub>=I<sub>m<\/sub>/√(2)≈2.83÷1.414≈2.00 A。"],"电压有效值约为 100 V，电流有效值约为 2.00 A。"],["ac-01","dc-04"],["ac-03","ac-04"],["有效值","峰值","正弦交流"],14,""],["ac-03","正弦式交变电流的表达式与图像","若从电压由零沿正方向增大的时刻开始计时，正弦式交变电压可写成 u=U<sub>m<\/sub>·sin(ω·t)。",[["正弦交变电压的瞬时值","<mrow><mi>u<\/mi><mo>=<\/mo><mrow><msub><mi>U<\/mi><mi>m<\/mi><\/msub>&#x22C5;<mrow><mi mathvariant=\"normal\">sin<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mrow><mi>ω<\/mi>&#x22C5;<mi>t<\/mi><\/mrow><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","从电压过零且沿正方向增大的时刻开始计时，初相位为零"],["相位随时间的变化","<mrow><mi>φ<\/mi><mo>=<\/mo><mrow><mi>ω<\/mi>&#x22C5;<mi>t<\/mi><\/mrow><\/mrow>","角频率保持不变且初相位取零"]],[["u","t 时刻交变电压的瞬时值","V"],["U<sub>m<\/sub>","交变电压峰值","V"],["ω","角频率","rad/s"],["t","从规定零相位时刻开始的时间","s"],["φ","相位","rad"]],[["把零相位的正弦表达式误写成余弦式 u=U<sub>m<\/sub>·cos(ω·t)","正弦与余弦的量纲完全相同，量纲检查无法发现相位错位。四分之一周期时错误式给出 0 V，而正确瞬时值为 100 V。"],["把任意计时起点都写成 u=U<sub>m<\/sub>·sin(ω·t)，忽略初相位","只有从电压过零且沿正方向增大的时刻开始计时，初相位才为零。换起点后应写入相应初相位，这需要结合题图人工判断。"]],"表达式、图像和线圈位置描述的是同一个周期过程。读图时要区分瞬时值与峰值：纵坐标 u 是某一时刻的电压，U<sub>m<\/sub> 是整条曲线能达到的最大绝对值。若计时起点改变，表达式还需加入初相位；本知识点选择初相位为零的标准情形。",["线圈匀速转动时，相位随时间均匀增加，初相位为零时 φ=ω·t。","旋转线圈产生的感应电动势按相位的正弦变化，因此 u=U<sub>m<\/sub>·sin(φ)。","代入 φ=ω·t 得 u=U<sub>m<\/sub>·sin(ω·t)。","当相位依次为 0、π/2、π、3·π/2、2·π 时，瞬时值依次为 0、U<sub>m<\/sub>、0、-U<sub>m<\/sub>、0。"],["某正弦交变电压 u=100·sin(100·π·t) V。从计时开始经过 0.005 s，求相位和瞬时电压。",["角频率 ω=100·π rad/s。","相位 φ=ω·t=100·π×0.005=π/2。","u=100·sin(π/2)=100 V。"],"相位为 π/2 rad，瞬时电压为 100 V。"],["ac-01","ac-02"],["ac-04"],["瞬时值","正弦图像","相位"],14,""],["ac-04","理想变压器","理想变压器忽略漏磁、线圈电阻和铁芯能量损耗。",[["理想变压器的电压关系","<mrow><msub><mi>U<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>U<\/mi><mn>1<\/mn><\/msub>&#x22C5;<msub><mi>N<\/mi><mn>2<\/mn><\/msub><\/mrow><msub><mi>N<\/mi><mn>1<\/mn><\/msub><\/mfrac><\/mrow>","理想变压器正常接入交变电流，原副线圈磁通量变化相同"],["理想变压器的电流关系","<mrow><msub><mi>I<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>I<\/mi><mn>1<\/mn><\/msub>&#x22C5;<msub><mi>N<\/mi><mn>1<\/mn><\/msub><\/mrow><msub><mi>N<\/mi><mn>2<\/mn><\/msub><\/mfrac><\/mrow>","理想变压器带有负载，输入功率等于输出功率"]],[["U<sub>1<\/sub>","原线圈两端交变电压的有效值","V"],["U<sub>2<\/sub>","副线圈两端交变电压的有效值","V"],["N1","原线圈匝数","1"],["N2","副线圈匝数","1"],["I<sub>1<\/sub>","原线圈电流的有效值","A"],["I<sub>2<\/sub>","副线圈电流的有效值","A"]],[["认为理想变压器的电流也与匝数成正比，写成 I<sub>2<\/sub>=I<sub>1<\/sub>·N2/N1","量纲正确但数值错误：该降压情境会算出 0.2 A，正确值是 5.0 A；正确关系由功率守恒决定，电流与匝数成反比。"],["把稳定直流接入普通变压器，认为仍能持续得到按匝数比变化的电压","稳定直流建立后磁通量不再变化，副线圈没有持续感应电动势；原线圈还可能因电流过大而发热损坏。这是适用条件判断，需人工审核。"]],"变压器改变交变电压和电流，却不凭空创造能量。副线圈匝数少于原线圈时降压但增流；副线圈匝数多时升压但减流。电压比只由匝数比决定，而原线圈电流还会随副线圈负载改变。稳定直流不能产生持续变化的磁通量，因此普通变压器不能用稳定直流正常变压。",["理想铁芯使原、副线圈每匝经历相同的磁通量变化率。","由法拉第定律，线圈电压与匝数成正比，因此 U<sub>1<\/sub>/U<sub>2<\/sub>=N1/N2。","理想变压器无能量损耗，输入功率等于输出功率：U<sub>1<\/sub>·I<sub>1<\/sub>=U<sub>2<\/sub>·I<sub>2<\/sub>。","把电压比代入功率关系，得到 I<sub>1<\/sub>/I<sub>2<\/sub>=N2/N1，即电流与匝数成反比。"],["理想变压器原线圈 1000 匝，接 220 V 交变电压；副线圈 200 匝，负载电流为 5.0 A。求副线圈电压和原线圈电流。",["U<sub>2<\/sub>=U<sub>1<\/sub>·N2/N1=220×200÷1000=44 V。","理想变压器功率守恒，或直接用 I<sub>2<\/sub>=I<sub>1<\/sub>·N1/N2。","I<sub>1<\/sub>=I<sub>2<\/sub>·N2/N1=5.0×200÷1000=1.0 A。","验算：220×1.0=44×5.0=220 W。"],"副线圈电压为 44 V，原线圈电流为 1.0 A。"],["ind-03","ac-02"],["ac-05","exp-22"],["变压器","匝数比","功率守恒"],14,""],["ac-05","远距离输电","输送功率 P<sub>送<\/sub> 和输电电压 U<sub>送<\/sub> 确定时，线路电流 I=P<sub>送<\/sub>/U<sub>送<\/sub>。",[["输电线电流","<mrow><mi>I<\/mi><mo>=<\/mo><mfrac><msub><mi>P<\/mi><mi mathvariant=\"normal\">送<\/mi><\/msub><msub><mi>U<\/mi><mi mathvariant=\"normal\">送<\/mi><\/msub><\/mfrac><\/mrow>","用有效值描述且功率因数按高中理想模型取 1，U<sub>送<\/sub> 大于零"],["输电线热损耗功率","<mrow><mi>Δ<\/mi><mi>P<\/mi><mo>=<\/mo><mrow><msup><mi>I<\/mi><mn>2<\/mn><\/msup>&#x22C5;<mi>R<\/mi><\/mrow><\/mrow>","以输电电流有效值计算两根输电线总电阻上的焦耳热功率"]],[["P<sub>送<\/sub>","输电系统要输送的有功功率","W"],["U<sub>送<\/sub>","输电电压的有效值","V"],["I","输电线中的电流有效值","A"],["R","两根输电线的总电阻","Ω"],["ΔP","输电线因发热损失的功率","W"]],[["用输送电压直接除以线路电阻来求输电线电流，写成 I=U<sub>送<\/sub>/R","输电电压主要加在用户负载和输电系统上，不是全部加在输电线电阻上。高压输电情境中错误式得 5000 A，而由输送功率确定的正确电流仅 10 A。"],["认为输电电压提高两倍，线路损耗只减为一半","功率一定时电流与电压成反比，而损耗又与电流平方成正比，所以电压加倍时损耗应降为四分之一。错误式还存在量纲不一致。"]],"高压输电降低的是线路损耗，不是把电能“放大”。当输送功率一定时，电压提高到原来的 k 倍，电流降为 1/k，线路损耗降为 1/k²。减小线路电阻也能降损耗，但增加导线截面积会大量耗费金属，所以用变压器升高交流电压更经济。",["在高中理想模型中，输送功率写成 P<sub>送<\/sub>=U<sub>送<\/sub>·I，移项得 I=P<sub>送<\/sub>/U<sub>送<\/sub>。","输电线可看作电阻，焦耳热功率为 ΔP=I²·R。","代入电流关系得 ΔP=P<sub>送<\/sub>²·R/U<sub>送<\/sub>²。","因此输送功率和线路电阻不变时，损耗与输电电压的平方成反比，这就是高压输电的定量依据。"],["某线路输送功率 1.0 MW，输电电压 100 kV，两根输电线总电阻为 20 Ω。求线路电流与损耗功率；若电压降为 50 kV，损耗变为多少？",["100 kV 时 I=P<sub>送<\/sub>/U<sub>送<\/sub>=1,000,000÷100,000=10 A。","ΔP=I²·R=10²×20=2000 W。","电压降为 50 kV 时，电流加倍为 20 A。","新损耗为 20²×20=8000 W，是原来的四倍。"],"100 kV 时电流为 10 A、损耗 2000 W；50 kV 时损耗增至 8000 W。"],["dc-04","ac-04"],["mdl-22"],["远距离输电","高压输电","线路损耗"],14,""],["ac-06","电感与电容对交变电流的影响","电感和电容都会影响交变电流。",[["理想电感的感抗","<mrow><msub><mi>X<\/mi><mi>L<\/mi><\/msub><mo>=<\/mo><mrow><mi>ω<\/mi>&#x22C5;<mi>L<\/mi><\/mrow><\/mrow>","理想电感接入角频率为 ω 的正弦式交变电流"],["理想电容的容抗","<mrow><msub><mi>X<\/mi><mi>C<\/mi><\/msub><mo>=<\/mo><mfrac><mn>1<\/mn><mrow><mi>ω<\/mi>&#x22C5;<msub><mi>C<\/mi><mi mathvariant=\"normal\">容<\/mi><\/msub><\/mrow><\/mfrac><\/mrow>","理想电容接入角频率为 ω 的正弦式交变电流，ω 和 C<sub>容<\/sub> 均大于零"]],[["X<sub>L<\/sub>","理想电感对正弦交流的感抗","Ω"],["X<sub>C<\/sub>","理想电容对正弦交流的容抗","Ω"],["ω","交变电流的角频率","rad/s"],["L","电感器的自感系数","H"],["C<sub>容<\/sub>","电容器的电容","F"]],[["把感抗公式多乘一个系数 2，写成 X<sub>L<\/sub>=2·ω·L","多出的 2 没有量纲，所以错误式量纲完全正确。工频情境中它会算出约 125.66 Ω，正确感抗约为 62.83 Ω，只能靠数值代入抓住。"],["认为电容像普通电阻一样，频率越高阻碍越强，写成 X<sub>C<\/sub>=ω·C<sub>容<\/sub>","正确容抗与角频率成反比；频率加倍时容抗应从约 31.83 Ω 减至约 15.92 Ω。错误式量纲也不是欧姆。"]],"电感具有“通直流、阻交流，通低频、阻高频”的趋势；电容在稳定直流电路中充电后相当于断路，却能让变化电流通过，表现为“隔直流、通交流，通高频、阻低频”。这里的“通”和“阻”都是相对说法，实际电流还取决于电路连接、电阻以及电源电压。",["电感中的电流变化会产生自感电动势，变化越快，自感作用越强，因此感抗随角频率增大。","对正弦交流定量分析得到 X<sub>L<\/sub>=ω·L。","电容两端电压变化时持续充放电；频率越高，单位时间内充放电越频繁，交流越容易通过。","对正弦交流定量分析得到 X<sub>C<\/sub>=1/(ω·C<sub>容<\/sub>)，它与角频率和电容均成反比。"],["角频率为 100·π rad/s 的正弦交流分别接入 0.20 H 理想电感和 100 μF 理想电容。求感抗和容抗，并说明频率加倍后的变化。",["X<sub>L<\/sub>=ω·L=100·π×0.20=20·π≈62.83 Ω。","100 μF=1.0×10⁻⁴ F，X<sub>C<\/sub>=1/(ω·C<sub>容<\/sub>)。","X<sub>C<\/sub>=1/(100·π×1.0×10⁻⁴)≈31.83 Ω。","频率加倍时，感抗加倍为约 125.66 Ω，容抗减半为约 15.92 Ω。"],"感抗约 62.83 Ω，容抗约 31.83 Ω；频率加倍后感抗加倍、容抗减半。"],["iad-01","cap-01","ac-03"],[],["感抗","容抗","频率响应"],14,""],["ac-07","LC振荡电路：周期、相位与能量","理想电感与电容组成的闭合回路可在电场能和磁场能之间周期交换。",[["理想LC周期","<mrow><mi>T<\/mi><mo>=<\/mo><mrow><mrow><mn>2<\/mn>&#x2062;<mi>π<\/mi><\/mrow>&#x22C5;<msqrt><mrow><mi>L<\/mi>&#x22C5;<mi>C<\/mi><\/mrow><\/msqrt><\/mrow><\/mrow>",""],["LC角频率","<mrow><mi>ω<\/mi><mo>=<\/mo><mfrac><mn>1<\/mn><msqrt><mrow><mi>L<\/mi>&#x22C5;<mi>C<\/mi><\/mrow><\/msqrt><\/mfrac><\/mrow>",""],["最大电场能","<mrow><mi mathvariant=\"normal\">Ee<\/mi><mo>=<\/mo><mfrac><msup><msub><mi>q<\/mi><mn>0<\/mn><\/msub><mn>2<\/mn><\/msup><mrow><mn>2<\/mn>&#x2062;<mi>C<\/mi><\/mrow><\/mfrac><\/mrow>",""],["最大磁场能","<mrow><mi mathvariant=\"normal\">Em<\/mi><mo>=<\/mo><mfrac><mrow><mi>L<\/mi>&#x22C5;<msup><msub><mi>I<\/mi><mn>0<\/mn><\/msub><mn>2<\/mn><\/msup><\/mrow><mn>2<\/mn><\/mfrac><\/mrow>",""]],[["T","理想振荡周期","s"],["ω","角频率","rad/s"],["L","电感","H"],["C","电容","F"],["q<sub>0<\/sub>","极板最大电荷量","C"],["I<sub>0<\/sub>","最大电流大小","A"],["Ee","最大电场能","J"],["Em","最大磁场能","J"]],[["LC周期遗漏二倍圆周率中的二，周期算成一半。","角频率的倒数还须乘完整2π，不能写π√(LC)；该参数周期约6.283 ms，错式约3.142 ms。"],["电容电荷最大时电流也最大，或实际有电阻仍永远等幅。","电荷极值处时间导数零，电流此时零；真实电阻产生热损失而衰减。相位符号还取决于选定电荷极板及电流方向。"]],"电容充电最大时电流为零，电容电场能最大；电容电荷为零时电流大小最大，磁场能最大。以电流流入选定正极板为正，电流为该板电荷的时间导数；取起始电荷最大，则电荷按余弦、电流按负正弦变化，两者相差四分之一周期。放电方向定义为正时电流符号相反，应说明约定。理想总能量守恒；实际电阻使能量耗散并形成阻尼，不能用无损模型断言真实振幅不变。",["周期为2π×0.001 s≈6.283 ms，初始电流零、电场能0.5 mJ。","四分之一周期后电荷零、电流大小0.1 A，磁场能0.5 mJ。","电容充电最大时电流为零，电容电场能最大；电容电荷为零时电流大小最大，磁场能最大。"],["理想LC电路L=0.1 H、C=10 μF，初始电荷100 μC，比较初始与四分之一周期状态。",["周期为2π×0.001 s≈6.283 ms，初始电流零、电场能0.5 mJ。","四分之一周期后电荷零、电流大小0.1 A，磁场能0.5 mJ。"],"周期约6.283 ms，能量由电场转入磁场而总量保持0.5 mJ。"],["cap-01","iad-01"],["ac-06"],["LC振荡电路：周期、相位与能量","条件与边界","实验与证据"],14,"<section class=\"field learning\"><h4>LC振荡电路：周期、相位与能量：方法与边界<\/h4><p>电容充电最大时电流为零，电容电场能最大；电容电荷为零时电流大小最大，磁场能最大。以电流流入选定正极板为正，电流为该板电荷的时间导数；取起始电荷最大，则电荷按余弦、电流按负正弦变化，两者相差四分之一周期。放电方向定义为正时电流符号相反，应说明约定。理想总能量守恒；实际电阻使能量耗散并形成阻尼，不能用无损模型断言真实振幅不变。<\/p><\/section>"],["opt-01","光的反射定律","光射到两种介质的分界面后返回原介质，叫光的反射。",[["反射角等于入射角","<mrow><msub><mi>θ<\/mi><mi>r<\/mi><\/msub><mo>=<\/mo><msub><mi>θ<\/mi><mi>i<\/mi><\/msub><\/mrow>","镜面反射和漫反射中的每一条光线，角度均相对法线测量"],["平面镜物距与像距","<mrow><msub><mi>d<\/mi><mi>i<\/mi><\/msub><mo>=<\/mo><msub><mi>d<\/mi><mi>o<\/mi><\/msub><\/mrow>","平面镜成像，物距和像距均取到镜面的垂直距离大小"],["平面镜物像间距","<mrow><msub><mi>D<\/mi><mi mathvariant=\"normal\">物像<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>d<\/mi><mi>o<\/mi><\/msub><mo>+<\/mo><msub><mi>d<\/mi><mi>i<\/mi><\/msub><\/mrow><\/mrow>","物体与虚像分居平面镜两侧，距离均取正值"]],[["θ<sub>i<\/sub>","入射角，相对法线测量","rad"],["θ<sub>r<\/sub>","反射角，相对法线测量","rad"],["d<sub>o<\/sub>","物体到平面镜的垂直距离","m"],["d<sub>i<\/sub>","虚像到平面镜的垂直距离","m"],["D<sub>物像<\/sub>","物体与虚像之间的距离","m"]],[["把反射角写成入射角的两倍：θ<sub>r<\/sub> = 2 θ<sub>i<\/sub>","反射角本身等于入射角；某些转镜问题中出现的两倍关系，指的是反射光线转过的角度。30° 入射时错误式给出 60°。"],["认为平面镜像距是物距的两倍：d<sub>i<\/sub> = 2 d<sub>o<\/sub>","物与像之间的距离才是 2 d<sub>o<\/sub>；像到镜面的距离仍等于物到镜面的距离。物距 2 m 时错误式给出 4 m。"]],"入射角和反射角都从法线量起，不是从镜面量起。反射定律与光的可逆性相容：把反射光线反向作为入射光线，光会沿原路返回。平面镜成像的物距和像距相等，像是光线反向延长线相交形成的虚像。",["实验改变入射光线方向并测角，发现反射光线始终与入射光线分居法线两侧，且 θ<sub>r<\/sub> = θ<sub>i<\/sub>。","平面镜后并没有真实光线会聚；把进入眼睛的反射光线反向延长，延长线在镜后相交，形成虚像。","由反射定律作两条特殊光线，可证明像点与物点关于镜面对称，所以 d<sub>i<\/sub> = d<sub>o<\/sub>。"],["一束光以 30° 的入射角射到平面镜上；一个物体同时放在镜前 2.0 m 处。求反射角和像距。",["入射角相对法线测量，已知 θ<sub>i<\/sub> = 30°。","由反射定律 θ<sub>r<\/sub> = θ<sub>i<\/sub>，反射角为 30°。","平面镜成像时像与物关于镜面对称，因此 d<sub>i<\/sub> = d<sub>o<\/sub> = 2.0 m。"],"反射角为 30°；像在镜后 2.0 m 处。"],[],["opt-02"],["几何光学","反射定律","平面镜成像"],15,""],["opt-02","光的折射与折射定律","光从一种介质斜射入另一种介质时，传播方向通常发生改变，这叫折射。",[["由折射角求第二介质折射率","<mrow><msub><mi>n<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>n<\/mi><mn>1<\/mn><\/msub>&#x22C5;<msub><mi>s<\/mi><mi>i<\/mi><\/msub><\/mrow><msub><mi>s<\/mi><mi>r<\/mi><\/msub><\/mfrac><\/mrow>","光由折射率 n1 的均匀介质射向折射率 n2 的均匀介质"],["由入射条件求折射角正弦","<mrow><msub><mi>s<\/mi><mi>r<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>n<\/mi><mn>1<\/mn><\/msub>&#x22C5;<msub><mi>s<\/mi><mi>i<\/mi><\/msub><\/mrow><msub><mi>n<\/mi><mn>2<\/mn><\/msub><\/mfrac><\/mrow>","已知两侧折射率和入射角，且确有折射光线"]],[["n1","入射介质的折射率","1"],["n2","折射介质的折射率","1"],["s<sub>i<\/sub>","入射角 i 的正弦值","1"],["s<sub>r<\/sub>","折射角 r 的正弦值","1"]],[["把折射率比例颠倒，写成 s<sub>r<\/sub> = n2 s<sub>i<\/sub> / n1","错误式在空气射入玻璃时给出 0.9，而正确值是 0.4；它还错误预言进入高折射率介质会偏离法线。"],["认为折射角总等于入射角，写成 s<sub>r<\/sub> = s<sub>i<\/sub>","只有两侧折射率相同或正入射等特殊情形才不改变方向。本情境错误式给出 0.6，正确值为 0.4。"]],"判断偏向法线还是偏离法线，要比较两种介质的折射率：进入折射率更大的介质时，折射角更小，光线偏向法线；进入折射率更小的介质时则偏离法线。正入射时角度为零，方向不偏折，但传播速度仍会改变。",["实验表明，对给定的两种介质，入射角正弦与折射角正弦的比值保持不变。","把介质性质用折射率表示，可写成 n1 sin i = n2 sin r。","用 s<sub>i<\/sub> 和 s<sub>r<\/sub> 记录两个正弦值，移项得到 s<sub>r<\/sub> = n1 s<sub>i<\/sub> / n2；当 n2 &gt; n1 时，s<sub>r<\/sub> &lt; s<sub>i<\/sub>，因此折射光偏向法线。"],["光从空气射入折射率为 1.5 的玻璃，入射角的正弦值为 0.6。求折射角的正弦值，并判断光线向哪边偏折。",["空气折射率近似取 n1 = 1.0，玻璃折射率 n2 = 1.5。","由折射定律 s<sub>r<\/sub> = n1 s<sub>i<\/sub> / n2。","代入得 s<sub>r<\/sub> = 1.0 × 0.6 / 1.5 = 0.4。","0.4 &lt; 0.6，折射角小于入射角，光线偏向法线。"],"折射角的正弦值为 0.4，光线偏向法线。"],["opt-01"],["opt-03","exp-19"],["几何光学","折射定律","斯涅尔定律"],15,""],["opt-03","折射率与光速的关系","介质的绝对折射率 n 等于真空光速 c 与光在该介质中速度 v 的比值，即 n = c/v。",[["绝对折射率","<mrow><mi>n<\/mi><mo>=<\/mo><mfrac><mi>c<\/mi><mi>v<\/mi><\/mfrac><\/mrow>","比较真空光速与光在均匀介质中的速度"],["介质中的波长","<mrow><msub><mi>L<\/mi><mi>m<\/mi><\/msub><mo>=<\/mo><mfrac><msub><mi>L<\/mi><mn>0<\/mn><\/msub><mi>n<\/mi><\/mfrac><\/mrow>","光从真空进入介质，频率保持不变"]],[["n","介质的绝对折射率","1"],["c","真空中的光速","m/s"],["v","光在介质中的传播速度","m/s"],["L<sub>0<\/sub>","真空中的波长","m"],["L<sub>m<\/sub>","介质中的波长","m"]],[["把折射率写反为 n = v/c","玻璃中光速小于真空光速，写反会得到 2/3，小于 1；正确折射率是 1.5。两式量纲都正确，只能靠数值和物理范围抓住。"],["认为进入介质后波长增大，写成 L<sub>m<\/sub> = n L<sub>0<\/sub>","频率不变而速度降低，波长应缩短。错误式给出 900 nm，正确值为 400 nm。"]],"折射率没有单位，表示介质使光速降低的程度。真空中 n = 1，普通透明介质的 n 通常大于 1。跨越分界面时由光源决定的频率连续不变，所以 v = f λ 中速度的变化必须由波长变化来配合。",["绝对折射率按定义为 n = c/v，两种速度单位相同，因此 n 是无量纲量。","光跨过静止分界面时频率 f 不变；分别写出真空中 c = f L<sub>0<\/sub> 和介质中 v = f L<sub>m<\/sub>。","两式相除得 c/v = L<sub>0<\/sub>/L<sub>m<\/sub> = n，因此 L<sub>m<\/sub> = L<sub>0<\/sub>/n。"],["某玻璃的折射率为 1.5，一束真空波长为 600 nm 的单色光进入玻璃。取 c = 3.0×10⁸ m/s，求光在玻璃中的速度和波长。",["由 n = c/v 得 v = c/n = 3.0×10⁸ / 1.5 = 2.0×10⁸ m/s。","光进入玻璃时频率不变，所以 L<sub>m<\/sub> = L<sub>0<\/sub>/n。","L<sub>m<\/sub> = 600 nm / 1.5 = 400 nm。"],"光速为 2.0×10⁸ m/s，玻璃中波长为 400 nm。"],["opt-02"],["opt-04"],["几何光学","折射率","光速","波长"],15,""],["opt-04","全反射与临界角","光从折射率较大的介质射向折射率较小的介质，并且入射角大于临界角时，折射光完全消失，只剩反射光，这叫全反射。",[["临界角的正弦","<mrow><msub><mi>s<\/mi><mi>C<\/mi><\/msub><mo>=<\/mo><mfrac><msub><mi>n<\/mi><mn>2<\/mn><\/msub><msub><mi>n<\/mi><mn>1<\/mn><\/msub><\/mfrac><\/mrow>","光由 n1 较大的介质射向 n2 较小的介质，且 n1 &gt; n2"],["光纤数值孔径","<mrow><mi mathvariant=\"normal\">NA<\/mi><mo>=<\/mo><msqrt><mrow><msup><msub><mi>n<\/mi><mn>1<\/mn><\/msub><mn>2<\/mn><\/msup><mo>−<\/mo><msup><msub><mi>n<\/mi><mn>2<\/mn><\/msub><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow>","光从空气耦合进入阶跃型光纤，纤芯折射率 n1 大于包层折射率 n2"]],[["n1","入射侧或光纤纤芯的折射率","1"],["n2","折射侧或光纤包层的折射率","1"],["s<sub>C<\/sub>","临界角 C 的正弦值","1"],["NA","光纤的数值孔径","1"]],[["把临界角关系写反为 s<sub>C<\/sub> = n1/n2","因为 n1 &gt; n2，写反后得到 1.0714，大于正弦值上限 1，物理上不可能；正确值为 14/15。"],["数值孔径漏掉平方根，写成 NA = n1² − n2²","错误式给出 0.29，正确值应为 √(0.29) 约 0.538516。量纲都是无量纲，必须数值检验。"]],"全反射有两个缺一不可的条件：必须从光密介质射向光疏介质，即 n1 &gt; n2；入射角还必须大于临界角 C。等于 C 时折射光沿界面传播，尚未完全消失。光纤利用纤芯折射率高于包层，使光在界面多次全反射。",["临界状态下折射光沿界面传播，折射角为 90°，所以折射定律给出 n1 s<sub>C<\/sub> = n2。","移项得到 s<sub>C<\/sub> = n2/n1。只有 n1 &gt; n2 时右边小于 1，临界角才存在。","阶跃型光纤在空气中的数值孔径可由入射端折射和纤芯—包层界面的全反射条件联立得到 NA = √(n1²−n2²)。"],["某阶跃型光纤的纤芯折射率为 1.5，包层折射率为 1.4。求纤芯射向包层时临界角正弦值和光纤数值孔径。",["纤芯折射率较大，满足形成全反射的介质方向条件。","s<sub>C<\/sub> = n2/n1 = 1.4/1.5 = 14/15，约为 0.9333。","NA = √(n1²−n2²) = √(2.25−1.96) = √(0.29)，约为 0.5385。"],"临界角正弦值约为 0.9333；数值孔径约为 0.5385。"],["opt-02","opt-03"],["opt-05","opt-06"],["几何光学","全反射","临界角","光纤"],15,""],["opt-05","光的色散","复色光通过棱镜等介质后分解成不同颜色的光，叫光的色散。",[["薄棱镜对蓝光的偏向角","<mrow><mi>Δ<\/mi><mi>b<\/mi><mo>=<\/mo><mrow><mrow><mo>(<\/mo><msub><mi>n<\/mi><mi>b<\/mi><\/msub><mo>−<\/mo><mn>1<\/mn><mo>)<\/mo><\/mrow><mi>A<\/mi><\/mrow><\/mrow>","棱镜顶角和入射、折射角均较小，可采用小角近似"],["薄棱镜的色散角","<mrow><msub><mi>Δ<\/mi><mi mathvariant=\"normal\">分离<\/mi><\/msub><mo>=<\/mo><mrow><mrow><mo>(<\/mo><msub><mi>n<\/mi><mi>b<\/mi><\/msub><mo>−<\/mo><msub><mi>n<\/mi><mi>r<\/mi><\/msub><mo>)<\/mo><\/mrow><mi>A<\/mi><\/mrow><\/mrow>","同一薄棱镜分开蓝光和红光，采用小角近似且 n<sub>b<\/sub> &gt; n<sub>r<\/sub>"]],[["n<sub>b<\/sub>","棱镜对蓝光的折射率","1"],["n<sub>r<\/sub>","棱镜对红光的折射率","1"],["A","薄棱镜的顶角","rad"],["Δb","蓝光通过薄棱镜后的偏向角","rad"],["Δr","红光通过薄棱镜后的偏向角","rad"],["Δ<sub>分离<\/sub>","蓝光与红光出射方向的角分离","rad"]],[["薄棱镜偏向角漏掉减 1，写成 Δb = n<sub>b<\/sub> A","错误式给出 1.53×0.1 = 0.153 rad，正确小角近似值为 0.053 rad。两式量纲相同，数值检验才能发现。"],["把折射率差顺序写反，认为红光比蓝光偏折更大","错误式得到 −0.002 rad，不但符号相反，也违背普通玻璃中蓝光折射率更大、偏折更强的事实。"]],"色散来自折射率随光的频率或真空波长而变化，不是不同颜色在真空中的光速不同。薄棱镜近似下，折射率差会直接转化为角分离：蓝光折射率更大，所以蓝光偏向角更大，蓝红两光的夹角与 n<sub>b<\/sub>−n<sub>r<\/sub> 成正比。",["对顶角很小的棱镜，把折射定律作小角近似，可得单色光偏向角等于 (n−1)A。","蓝光偏向角为 Δb = (n<sub>b<\/sub>−1)A，红光偏向角为 Δr = (n<sub>r<\/sub>−1)A。","两式相减，得到色散角 Δ<sub>分离<\/sub> = Δb−Δr = (n<sub>b<\/sub>−n<sub>r<\/sub>)A。普通玻璃中 n<sub>b<\/sub> &gt; n<sub>r<\/sub>，所以蓝光偏折更大。"],["一薄棱镜顶角 A = 0.1 rad，对蓝光和红光的折射率分别为 1.53 和 1.51。用薄棱镜近似求两色光各自的偏向角及角分离。",["蓝光偏向角 Δb = (1.53−1)×0.1 = 0.053 rad。","红光偏向角 Δr = (1.51−1)×0.1 = 0.051 rad。","角分离 Δ<sub>分离<\/sub> = Δb−Δr = 0.002 rad，也可由 (1.53−1.51)×0.1 直接得到。"],"蓝光偏向 0.053 rad，红光偏向 0.051 rad，角分离为 0.002 rad。"],["opt-02","opt-03"],[],["几何光学","色散","薄棱镜","折射率"],15,""],["opt-06","光导纤维与全反射的应用","阶跃型光纤的纤芯折射率高于包层，适当入射的光可在芯层边界全反射并沿纤维传播。",[["芯层边界临界角","<mrow><msub><mi>θ<\/mi><mi>c<\/mi><\/msub><mo>=<\/mo><mrow><mi mathvariant=\"normal\">asin<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mfrac><msub><mi>n<\/mi><mn>2<\/mn><\/msub><msub><mi>n<\/mi><mn>1<\/mn><\/msub><\/mfrac><mo>)<\/mo><\/mrow><\/mrow>","纤芯折射率大于包层，角度相对界面法线"],["光纤数值孔径","<mrow><mi>A<\/mi><mo>=<\/mo><msqrt><mrow><msup><msub><mi>n<\/mi><mn>1<\/mn><\/msub><mn>2<\/mn><\/msup><mo>−<\/mo><msup><msub><mi>n<\/mi><mn>2<\/mn><\/msub><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow>","直阶跃光纤的子午光线模型"],["入口最大接受角","<mrow><msub><mi>α<\/mi><mi mathvariant=\"normal\">max<\/mi><\/msub><mo>=<\/mo><mrow><mi mathvariant=\"normal\">asin<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mfrac><msqrt><mrow><msup><msub><mi>n<\/mi><mn>1<\/mn><\/msub><mn>2<\/mn><\/msup><mo>−<\/mo><msup><msub><mi>n<\/mi><mn>2<\/mn><\/msub><mn>2<\/mn><\/msup><\/mrow><\/msqrt><msub><mi>n<\/mi><mn>0<\/mn><\/msub><\/mfrac><mo>)<\/mo><\/mrow><\/mrow>","孔径不大于入口介质折射率，忽略波导模式与弯曲"]],[["n1","纤芯折射率","1"],["n2","包层折射率","1"],["n<sub>0<\/sub>","入口介质折射率","1"],["θ<sub>c<\/sub>","纤芯到包层的临界入射角，相对法线","rad"],["α<sub>max<\/sub>","入口相对纤维轴线的最大接受角","rad"],["A","光纤数值孔径","1"]],[["把芯层和包层折射率平方相加求数值孔径","光纤入口接受条件来自全反射和入口折射的联合限制，应该取平方差；相加虽量纲一致却会得到过大的孔径和非法接受角。"],["认为光纤任何入射角都能全反射传播","入口必须满足接受角限制，芯层边界必须满足全反射角度条件；折射率结构本身不能保证所有光线被导引。"]],"全反射要求从高折射率介质射向低折射率介质且入射角超过临界角。纤芯内相对界面法线的角和入口相对轴线的角不是同一个角，本卡只分析直纤维中的子午光线；数值孔径的角度公式还要求入口介质折射率给定。弯曲、吸收和波导模式会带来实际损耗，不能声称真实光纤传输零损失。",["先比较芯层和包层折射率，确认具备全反射的介质方向。","由芯层边界求临界角，把侧面法线角换算为纤维轴线角。","再用入口折射定律连接轴线角与外部入射角，得到接受角；实际光纤不能只依赖光线几何估算损耗。"],["直阶跃光纤芯层折射率1.5、包层1.2，入口介质为空气，求数值孔径及最大接受角。",["芯层与包层折射率平方差0.81，数值孔径0.9。","空气入口折射率取1，最大接受角为反正弦0.9，约64.158度。"],"数值孔径0.9，最大接受角约64.16度；限于理想子午光线模型。"],["opt-02","opt-04"],["exp-19"],["光导纤维","全反射","数值孔径"],15,""],["wop-01","光的干涉与双缝条纹","频率相同、相位差恒定的两列光波叠加，会形成稳定的明暗相间条纹。",[["双缝干涉条纹间距","<mrow><mi>Δ<\/mi><mi>x<\/mi><mo>=<\/mo><mfrac><mrow><mi>L<\/mi>&#x22C5;<mi>λ<\/mi><\/mrow><mi>d<\/mi><\/mfrac><\/mrow>","双缝间距远小于屏距、使用单色相干光且观察近轴条纹"],["第 m<sub>级<\/sub> 级亮纹位置","<mrow><msub><mi>x<\/mi><mi>m<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>m<\/mi><mi mathvariant=\"normal\">级<\/mi><\/msub>&#x22C5;<mi>Δ<\/mi><mi>x<\/mi><\/mrow><\/mrow>","从中央亮纹向一侧计数，m<sub>级<\/sub> 为非负整数"]],[["L","双缝到观察屏的距离","m"],["λ","单色光的波长","m"],["d","两条狭缝中心之间的距离","m"],["Δx","相邻同类条纹的间距","m"],["m<sub>级<\/sub>","亮条纹级次，中央亮纹取零级","1"],["x<sub>m<\/sub>","第 m<sub>级<\/sub> 级亮纹到中央亮纹的距离","m"]],[["把双缝条纹间距写成 Δx = d λ / L","错误式把 L 与 d 颠倒后量纲仍是长度，所以量纲检查抓不到。本情境算出 1.2×10⁻¹⁰ m，而正确值是 0.003 m。"],["认为双缝间距越大，干涉条纹越疏","正确关系中 d 在分母，双缝间距增大应使条纹变密。错误式在本情境给出 4.8×10⁻¹⁰ m，也与实测 0.003 m 不符。"]],"干涉条纹不是两束光各自留下的痕迹，而是电场周期性叠加后的强弱分布。条纹间距与波长、屏距成正比，与双缝间距成反比；因此红光比蓝光的条纹更疏，屏移远后条纹更疏，双缝分得更开后条纹反而更密。这里的 m<sub>级<\/sub> 是从中央亮纹起计的级次，中央亮纹为零级。",["屏上某点到两缝的路程差等于波长的整数倍时，两列光同相叠加形成亮纹。","在 L 远大于 d 的近轴条件下，相邻亮纹对应的路程差增加一个波长，由相似三角形得到 Δx = L λ / d。","中央亮纹取 m<sub>级<\/sub> = 0；向一侧每跨过一个间距，级次增加 1，所以 x<sub>m<\/sub> = m<sub>级<\/sub> Δx。"],["用波长 600 nm 的单色光做双缝干涉实验，双缝间距 0.40 mm，屏到双缝的距离 2.0 m。求条纹间距和第三级亮纹到中央亮纹的距离。",["统一单位：λ = 6.0×10⁻⁷ m，d = 4.0×10⁻⁴ m。","Δx = L λ / d = 2.0×6.0×10⁻⁷÷4.0×10⁻⁴ = 3.0×10⁻³ m。","x<sub>m<\/sub> = 3 Δx = 9.0×10⁻³ m。"],"条纹间距为 3.0 mm；第三级亮纹距中央亮纹 9.0 mm。"],["osc-06"],["wop-02","exp-20"],["波动光学","光的干涉","双缝实验","条纹间距"],16,""],["wop-02","光的衍射","光绕过障碍物边缘或通过狭缝后偏离直线传播并进入几何阴影区的现象叫衍射。",[["单缝第一暗纹条件","<mrow><msub><mi>s<\/mi><mi>θ<\/mi><\/msub><mo>=<\/mo><mfrac><mi>λ<\/mi><mi>a<\/mi><\/mfrac><\/mrow>","夫琅禾费单缝衍射，求第一暗纹方向且 λ 不大于 a"],["单缝中央亮纹宽度","<mrow><mi>w<\/mi><mo>=<\/mo><mfrac><mrow><mrow><mn>2<\/mn>&#x2062;<mi>L<\/mi><\/mrow>&#x22C5;<mi>λ<\/mi><\/mrow><mi>a<\/mi><\/mfrac><\/mrow>","第一暗纹角度较小，屏距远大于缝宽，可用小角近似"]],[["λ","单色光的波长","m"],["a","单缝宽度","m"],["θ","第一暗纹对应的衍射角","rad"],["s<sub>θ<\/sub>","第一暗纹衍射角 θ 的正弦值","1"],["L","单缝到观察屏的距离","m"],["w","中央亮纹的近似宽度","m"]],[["把第一暗纹条件写反为 s<sub>θ<\/sub> = a/λ","本情境会得到 20，大于正弦值上限 1，物理上不可能；正确值为 0.05。"],["计算中央亮纹宽度时漏掉两侧，写成 w = L λ/a","L λ/a 只是中央点到一侧第一暗纹的距离。错误式得到 0.06 m，完整中央亮纹宽度应为 0.12 m。"]],"任何波都能衍射，只是当孔或障碍物尺度与波长相近时现象更显著。单缝越窄，光扩展得越开，中央亮纹越宽；这不是缝在屏上的几何像。中央亮纹宽度约为其他亮纹的两倍，是单缝衍射图样最醒目的结构特征。",["把单缝内各处看成次波源；在第一暗纹方向上，可以把缝分成两半，使两半中成对次波的程差为半个波长并相互抵消。","第一暗纹条件为 a sin(θ) = λ，因此 s<sub>θ<\/sub> = λ/a。","第一暗纹在中央两侧各出现一次；小角近似下单侧距离约为 L λ/a，所以中央亮纹总宽度 w = 2L λ/a。"],["波长 500 nm 的单色光照射宽 10 micrometre 的单缝，屏距 1.2 m。求第一暗纹衍射角的正弦值和中央亮纹的近似宽度。",["统一单位：λ = 5.0×10⁻⁷ m，a = 1.0×10⁻⁵ m。","s<sub>θ<\/sub> = λ/a = 0.05。此时衍射角约为 2.9°，符合小角近似条件。","w = 2L λ/a = 2×1.2×0.05 = 0.12 m。"],"第一暗纹衍射角的正弦值为 0.05；中央亮纹宽度约为 0.12 m。"],["osc-06"],["wop-03","wop-05"],["波动光学","光的衍射","单缝衍射","中央亮纹"],16,""],["wop-03","光的偏振","偏振片只允许沿透振方向的电场分量通过。",[["自然光通过理想偏振片","<mrow><msub><mi>I<\/mi><mi>p<\/mi><\/msub><mo>=<\/mo><mfrac><msub><mi>I<\/mi><mi mathvariant=\"normal\">入<\/mi><\/msub><mn>2<\/mn><\/mfrac><\/mrow>","自然光垂直入射理想偏振片，不计吸收和反射损失"],["马吕斯定律","<mrow><mi>I<\/mi><mo>=<\/mo><mrow><msub><mi>I<\/mi><mi>p<\/mi><\/msub>&#x22C5;<msup><msub><mi>c<\/mi><mi>θ<\/mi><\/msub><mn>2<\/mn><\/msup><\/mrow><\/mrow>","线偏振光垂直入射理想检偏器，c<sub>θ<\/sub> 为两偏振方向夹角的余弦"]],[["I<sub>入<\/sub>","入射自然光的相对光强","1"],["I<sub>p<\/sub>","自然光通过第一片理想偏振片后的相对光强","1"],["θ","检偏器透振方向与入射线偏振方向的夹角","rad"],["c<sub>θ<\/sub>","夹角 θ 的余弦值","1"],["I","线偏振光通过检偏器后的相对光强","1"]],[["认为自然光通过第一片理想偏振片后光强不变","第一片偏振片只保留一个方向的电场投影，理想情况下平均光强减半。本情境错误式给出 1.0，正确值为 0.5。"],["马吕斯定律漏掉平方，写成 I = I<sub>p<\/sub> c<sub>θ<\/sub>","余弦作用在电场振幅上，光强还要再平方。本情境错误式给出 0.30，正确值为 0.18。"]],"自然光的电场振动方向在垂直传播方向的平面内随机分布，第一片理想偏振片平均保留一半光强。第二片偏振片是否透光取决于两片透振方向夹角：平行时最亮，垂直时理想情况下完全消光。光强不是按余弦一次方变化，而是电场分量先乘余弦、光强再与振幅平方成正比。",["自然光在垂直传播方向的各个振动方向上均匀分布；通过理想偏振片后，电场平方投影的平均值为原来的一半，因此 I<sub>p<\/sub> = I<sub>入<\/sub>/2。","线偏振光通过检偏器时，透射电场振幅是原振幅在透振方向的投影，即乘以 c<sub>θ<\/sub>。","光强与电场振幅的平方成正比，所以透射光强乘以 c<sub>θ<\/sub>²，得到 I = I<sub>p<\/sub> c<sub>θ<\/sub>²。"],["相对光强为 1.0 的自然光依次垂直通过两片理想偏振片，两片透振方向夹角的余弦为 0.6。求通过第一片和第二片后的相对光强。",["自然光通过第一片理想偏振片后 I<sub>p<\/sub> = I<sub>入<\/sub>/2 = 0.5。","由马吕斯定律 I = I<sub>p<\/sub> c<sub>θ<\/sub>²。","I = 0.5×0.6² = 0.5×0.36 = 0.18。"],"通过第一片后相对光强为 0.5；通过第二片后为 0.18。"],[],["wop-04"],["波动光学","偏振","横波","马吕斯定律"],16,""],["wop-04","光的电磁本性","光是电磁波，真空中的传播速度 c、真空波长 λ 和频率 f 满足 c = λ f。",[["真空中光速关系","<mrow><mi>c<\/mi><mo>=<\/mo><mrow><mi>λ<\/mi>&#x22C5;<mi>f<\/mi><\/mrow><\/mrow>","光在真空中传播，λ 取真空波长"],["频率与周期","<mrow><mi>T<\/mi><mo>=<\/mo><mfrac><mn>1<\/mn><mi>f<\/mi><\/mfrac><\/mrow>","任何周期性电磁振动，f 大于零"]],[["c","真空中的光速","m/s"],["λ","光在真空中的波长","m"],["f","光的频率","Hz"],["T","电磁振动的周期","s"]],[["把一个周期传播一个波长误记成传播两个波长，写成 c = 2 λ f","错误式与正确式量纲完全相同，量纲检查抓不到；本情境会算出 6.0×10⁸ m/s，而真空光速应为 3.0×10⁸ m/s。"],["把周期写成 T = f，混淆互为倒数的两个物理量","周期单位是 s，频率单位是 Hz，即 1/s，量纲不同；绿光周期约为 1.67×10⁻¹⁵ s，不是 6.0×10¹⁴ s。"]],"麦克斯韦理论预言电磁扰动的传播速度等于当时测得的光速，赫兹实验随后证实了电磁波的存在。光跨越介质分界面时频率由光源决定而保持不变，介质中的速度和波长会改变；本知识点的 c = λ f 专指真空量。波长越短，频率越高，但不能据此认为不同颜色的光在真空中速度不同。",["周期波在一个周期 T 内向前传播一个波长 λ，因此传播速度 c = λ/T。","频率与周期互为倒数：f = 1/T。代入速度式得到 c = λ f。","电磁波在真空中的传播速度由真空电磁性质决定；不同频率的电磁波都服从同一速度关系。"],["某绿光在真空中的波长为 500 nm，取真空光速 c = 3.0×10⁸ m/s。求它的频率和周期。",["把波长换成国际单位：λ = 5.0×10⁻⁷ m。","由 c = λ f 得 f = c/λ = 3.0×10⁸÷5.0×10⁻⁷ = 6.0×10¹⁴ Hz。","T = 1/f = 1÷6.0×10¹⁴，约为 1.67×10⁻¹⁵ s。"],"频率为 6.0×10¹⁴ Hz；周期约为 1.67×10⁻¹⁵ s。"],["osc-06","opt-03"],[],["波动光学","电磁波","光速","频率","波长"],16,""],["wop-05","光栅衍射","光栅由大量等间距狭缝构成，正入射单色光的主极大方向满足相邻狭缝光程差等于整数倍波长。",[["主极大方向","<mrow><mi>θ<\/mi><mo>=<\/mo><mrow><mi mathvariant=\"normal\">asin<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mfrac><mrow><mi>k<\/mi>&#x22C5;<mi>λ<\/mi><\/mrow><mi>d<\/mi><\/mfrac><mo>)<\/mo><\/mrow><\/mrow>","正入射远场，级次为整数且正弦绝对值不大于一"],["屏上主极大位置","<mrow><mi>s<\/mi><mo>=<\/mo><mrow><mi>L<\/mi>&#x22C5;<mrow><mi mathvariant=\"normal\">tan<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>θ<\/mi><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","平面屏幕垂直光栅轴线，角度小于直角"],["相邻缝光程差","<mrow><mi>Δ<\/mi><mo>=<\/mo><mrow><mi>d<\/mi>&#x22C5;<mrow><mi mathvariant=\"normal\">sin<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>θ<\/mi><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","光程差取本卡同一方向符号"]],[["d","相邻缝间距，即光栅常量","m"],["λ","单色光波长","m"],["k","主极大级次，必须取整数","1"],["θ","主极大方向与正前方夹角","rad"],["L","光栅至平面屏幕的轴向距离","m"],["s","屏上条纹到中央的有符号距离","m"],["Δ","相邻缝对应的光程差","m"]],[["较大衍射角仍用正弦近似正切求屏位置","屏幕横坐标由轴向距离乘角度正切给出；本例30度已不适合小角近似，近似式给0.866 m而正确为1 m。"],["把缝宽当成光栅常量来求主极大","相邻缝间距控制多缝相位差，单缝宽度控制衍射包络；两者是不同几何参数，即使单位相同也不能互换。"]],"光栅主极大来自多缝干涉，还受单缝衍射包络调制，并非每个允许级次都有相同强度。光栅常量是相邻缝间距，不能和每条缝的宽度混淆；本卡只用正入射、远场和平面屏幕几何。衍射角较大时，屏上位置应使用正切，不能套小角近似；光栅刻线越密，常量越小。",["确定入射方向、光栅常量和波长，不把刻线密度直接当成间距。","相邻缝的光程差等于整数倍波长时形成主极大，先检查该级次是否存在。","需要屏上坐标时再作几何投影，大角度用正切，并说明强度还受到单缝包络影响。"],["正入射光栅常量1微米，波长500 nm，屏距根号三米。求一级主极大角度与屏上偏移。",["一级的角度正弦为0.5，得到角度30度。","屏上偏移为根号三乘30度的正切，正好1 m。"],"一级角度30度，两侧主极大分别偏移正负1 m。"],["wop-01","wop-02"],["exp-20"],["光栅","主极大","衍射级次"],16,""],["mgas-01","分子动理论的基本内容与微观量估算","物质由大量分子组成，分子永不停息地做无规则运动，分子之间存在相互作用。",[["由总体积估算分子数","<mrow><mi>N<\/mi><mo>=<\/mo><mfrac><msub><mi>V<\/mi><mi mathvariant=\"normal\">总<\/mi><\/msub><msub><mi>V<\/mi><mi mathvariant=\"normal\">分子<\/mi><\/msub><\/mfrac><\/mrow>","总体积可视为 N 个分子平均占据体积之和"],["分子体积的立方体近似","<mrow><msub><mi>V<\/mi><mi mathvariant=\"normal\">分子<\/mi><\/msub><mo>=<\/mo><msup><mi>d<\/mi><mn>3<\/mn><\/msup><\/mrow>","只做数量级估算，把每个分子平均占据的空间近似为边长 d 的小立方体"]],[["V<sub>总<\/sub>","所有分子占据的总体积","m³"],["V<sub>分子<\/sub>","单个分子平均占据的体积","m³"],["N","分子数目","1"],["d","分子线度的估计值","m"]],[["把分子数写成 N = V<sub>分子<\/sub>/V<sub>总<\/sub>","分子数应是总体积除以单分子体积。错误式在本情境得到 10⁻²²，而不是 10²²，量纲虽同为无量纲但数量级完全相反。"],["由分子线度估体积时写成 V<sub>分子<\/sub> = d²","面积不是体积，d² 的量纲是 L²，而单分子体积的量纲是 L³。"]],"微观粒子不能逐个直接计数，但可以用宏观总体积除以单个分子体积来估算数目。这里的立方体模型只是数量级估算，不表示真实分子一定是立方体；所得线度通常在 10⁻¹⁰ m 的数量级。布朗运动是悬浮微粒的无规则运动，它间接反映液体分子的热运动，不是液体分子本身的运动轨迹。",["把宏观样品近似看成 N 个相同微观单元组成，总体积约为 N V<sub>分子<\/sub>。","将总体积关系变形，得到 N = V<sub>总<\/sub> / V<sub>分子<\/sub>。","若每个分子平均占据边长为 d 的小立方体，则 V<sub>分子<\/sub> = d³；该模型只用于数量级估算。"],["某油滴形成单分子油膜，油的总体积为 1.0×10⁻⁸ m³。若估计一个分子平均占据 1.0×10⁻³⁰ m³，求分子数，并估算分子线度。",["分子数 N = V<sub>总<\/sub>/V<sub>分子<\/sub> = 10⁻⁸/10⁻³⁰ = 10²²。","把单分子占据空间近似为小立方体，V<sub>分子<\/sub> = d³。","因为 (10⁻¹⁰)³ = 10⁻³⁰，所以 d = 1.0×10⁻¹⁰ m。"],"约有 1.0×10²² 个分子，分子线度约为 1.0×10⁻¹⁰ m。"],[],["mgas-02","exp-24"],["分子动理论","油膜法","数量级估算","布朗运动"],17,""],["mgas-02","分子间作用力与分子势能","分子间同时存在吸引作用和排斥作用，两者都随距离减小而增强，但排斥作用在很近时增长得更快。",[["分子间合力的一维表示","<mrow><msub><mi>F<\/mi><mi mathvariant=\"normal\">合<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>F<\/mi><mi mathvariant=\"normal\">斥<\/mi><\/msub><mo>−<\/mo><msub><mi>F<\/mi><mi mathvariant=\"normal\">引<\/mi><\/msub><\/mrow><\/mrow>","只比较同一直线上的排斥与吸引作用，并把间距增大方向取正"],["分子力做功与势能变化","<mrow><msub><mi>ΔE<\/mi><mi>p<\/mi><\/msub><mo>=<\/mo><mrow><mo>−<\/mo><msub><mi>W<\/mi><mi mathvariant=\"normal\">分子<\/mi><\/msub><\/mrow><\/mrow>","只考察分子力这一保守力做功所引起的分子势能变化"]],[["F<sub>合<\/sub>","沿分子间距增大方向的合力","N"],["F<sub>斥<\/sub>","排斥作用的大小","N"],["F<sub>引<\/sub>","吸引作用的大小","N"],["ΔE<sub>p<\/sub>","分子势能的变化量","J"],["W<sub>分子<\/sub>","分子力所做的功","J"]],[["求分子间合力时把吸引与排斥的大小直接相加","吸引与排斥方向相反，应作差而不是相加。两种写法量纲完全相同；把错误结果与正确合力作无量纲比值，本情境得到 2.2 而不是 1，可由数值代入抓住。"],["把势能变化写成 ΔE<sub>p<\/sub> = W<sub>分子<\/sub>","保守力做正功时势能应减少。本情境错误式给出正的 2.5×10⁻²⁰ J，与正确的负值符号相反；该微观能量远小于陷阱测试的固定绝对容差，不能诚实声称会被自动抓住。"]],"在平衡距离附近，吸引与排斥大小相等，合力为零，分子势能最低。距离小于平衡距离时排斥占优，分子趋向分开；距离略大于平衡距离时吸引占优，分子趋向靠近。合力为零不等于分子间没有作用，而是两种作用恰好抵消。",["分子间的合作用可视为排斥与吸引两种作用竞争的结果。","选定正方向后，同向量取正、反向量取负，所以 F<sub>合<\/sub> = F<sub>斥<\/sub> - F<sub>引<\/sub>。","分子力是保守力，保守力做正功时势能减少，做负功时势能增加，因此 ΔE<sub>p<\/sub> = -W<sub>分子<\/sub>。"],["两分子距离小于平衡距离，排斥作用大小为 8.0×10⁻⁹ N，吸引作用大小为 3.0×10⁻⁹ N。若随后分子力做正功 2.5×10⁻²⁰ J，求初始合力及分子势能变化。",["取分子间距增大方向为正，F<sub>合<\/sub> = F<sub>斥<\/sub>-F<sub>引<\/sub>。","F<sub>合<\/sub> = 8.0×10⁻⁹-3.0×10⁻⁹ = 5.0×10⁻⁹ N，方向使分子分开。","ΔE<sub>p<\/sub> = -W<sub>分子<\/sub> = -2.5×10⁻²⁰ J。"],"合力为 5.0×10⁻⁹ N，指向间距增大方向；分子势能减少 2.5×10⁻²⁰ J。"],["mgas-01"],["mgas-03"],["分子力","平衡距离","分子势能","保守力"],17,""],["mgas-03","温度与温标","热力学温度 T 与摄氏温度的数值 t<sub>C<\/sub> 相差一个固定零点：T = t<sub>C<\/sub> + T<sub>0<\/sub>，其中 T<sub>0<\/sub> 近似取 273.15 K。",[["摄氏温度换算为热力学温度","<mrow><mi>T<\/mi><mo>=<\/mo><mrow><msub><mi>t<\/mi><mi>C<\/mi><\/msub><mo>+<\/mo><msub><mi>T<\/mi><mn>0<\/mn><\/msub><\/mrow><\/mrow>","把摄氏温度数值换算为开尔文温度，T<sub>0<\/sub> 取 273.15 K"],["热力学温度变化量","<mrow><mi>Δ<\/mi><mi>T<\/mi><mo>=<\/mo><mrow><msub><mi>T<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>T<\/mi><mn>1<\/mn><\/msub><\/mrow><\/mrow>","比较同一物体初、末状态的热力学温度"]],[["T","热力学温度","K"],["t<sub>C<\/sub>","摄氏温度的数值；换算时按与 K 等大的温度间隔处理","K"],["T<sub>0<\/sub>","摄氏零度对应的热力学温度","K"],["T<sub>1<\/sub>","初态热力学温度","K"],["T<sub>2<\/sub>","末态热力学温度","K"],["ΔT","温度变化量","K"]],[["把 26.85 ℃直接当成 26.85 K 代入气体定律","两种温标零点不同。本情境正确温度是 300 K，直接使用摄氏数值会把绝对温度低估十倍以上。"],["换算时写成 T = t<sub>C<\/sub>-273.15","应当加上零点偏移。本情境错误式得到 -246.3 K，不但数值错误，还违反热力学温度不得为负的物理限制。"]],"温度是大量分子热运动剧烈程度的宏观标志。0 ℃不是热运动停止，绝对零度才是热力学温标的理论下限。摄氏温度可以为负，热力学温度不能低于 0 K；温度变为原来的两倍，必须针对开尔文数值而言，不能直接把摄氏温度数值乘二。",["热力学温标与摄氏温标每一度的大小相同，只是零点不同。","摄氏零度对应 273.15 K，因此换算式为 T = t<sub>C<\/sub> + 273.15 K。","求温差时固定零点相减抵消，所以两种温标的温差数值相同。"],["实验室温度为 26.85 ℃，将气体从 280 K 加热到 350 K。求室温对应的热力学温度和加热过程的温差。",["T = t<sub>C<\/sub>+273.15 = 26.85+273.15 = 300.00 K。","ΔT = T<sub>2<\/sub>-T<sub>1<\/sub> = 350-280 = 70 K。","温差也可说是 70 ℃，但代入气体状态关系的绝对温度必须写 280 K 和 350 K。"],"室温为 300 K，加热过程的温差为 70 K。"],["mgas-02"],["mgas-04"],["热力学温度","摄氏温度","开尔文","温标换算"],17,""],["mgas-04","物体的内能与理想气体内能","物体中所有分子热运动动能与分子势能的总和叫作物体的内能。",[["单原子理想气体的内能","<mrow><mi>U<\/mi><mo>=<\/mo><mrow><mrow><mrow><mn>1.5<\/mn>&#x2062;<mi>N<\/mi><\/mrow>&#x22C5;<msub><mi>k<\/mi><mi>B<\/mi><\/msub><\/mrow>&#x22C5;<mi>T<\/mi><\/mrow><\/mrow>","一定数量的单原子理想气体，分子平动自由度为三个"],["单原子理想气体的内能变化","<mrow><mi>Δ<\/mi><mi>U<\/mi><mo>=<\/mo><mrow><mrow><mrow><mn>1.5<\/mn>⁢<mi>N<\/mi><\/mrow>⋅<msub><mi>k<\/mi><mi>B<\/mi><\/msub><\/mrow><mrow><mo>(<\/mo><msub><mi>T<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>T<\/mi><mn>1<\/mn><\/msub><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","同一份单原子理想气体从温度 T<sub>1<\/sub> 变化到 T<sub>2<\/sub>"]],[["U","单原子理想气体的内能","J"],["ΔU","内能变化量","J"],["N","气体分子数","1"],["k<sub>B<\/sub>","玻尔兹曼常量","J/K"],["T","热力学温度","K"],["T<sub>1<\/sub>","初态热力学温度","K"],["T<sub>2<\/sub>","末态热力学温度","K"],["ΔT","升温过程的热力学温度变化量","K"]],[["漏掉系数 3/2，写成 U = Nk<sub>B<\/sub> T","错误式量纲仍为能量，量纲检查抓不到。本情境只算得 828 J，而正确内能是 1242 J。"],["认为温度相同的所有物体内能必定相同","内能还与分子数、物态和分子间势能等因素有关；温度只反映热运动的平均剧烈程度。这是适用条件判断，需人工审核。"]],"温度反映分子平均动能，但内能还取决于物质的量和分子间势能，因此两个温度相同的物体内能未必相同。单原子理想气体的内能只由温度和分子数决定，与体积、压强分别取何值无关；这个结论不能直接套给液体、固体或有转动振动自由度的实际气体。",["单原子理想气体每个分子的平均平动动能为 3k<sub>B<\/sub> T/2。","理想气体忽略分子间势能，N 个分子的总内能为 N 倍平均动能。","同一份气体的末态内能减初态内能，提取公因子后得到 ΔU = 3Nk<sub>B<\/sub>(T<sub>2<\/sub>-T<sub>1<\/sub>)/2。"],["一份单原子理想气体含 2.0×10²³ 个分子，取 k<sub>B<\/sub>=1.38×10⁻²³ J/K。求 300 K 时的内能，以及升温到 400 K 时内能的增加量。",["U = 1.5Nk<sub>B<\/sub> T = 1.5×2.0×10²³×1.38×10⁻²³×300 = 1242 J。","温差为 400-300 = 100 K。","ΔU = 1.5Nk<sub>B<\/sub> ΔT = 1.5×2.76×100 = 414 J。"],"300 K 时内能为 1242 J；升温后内能增加 414 J。"],["mgas-03"],["mgas-05"],["内能","理想气体","分子平均动能","玻尔兹曼常量"],17,""],["mgas-05","气体实验定律","一定质量的理想气体，在温度不变时满足玻意耳定律 p<sub>1<\/sub>V<sub>1<\/sub>=p<sub>2<\/sub>V<sub>2<\/sub>；在压强不变时满足查理定律 V<sub>1<\/sub>/T<sub>1<\/sub>=V<sub>2<\/sub>/T<sub>2<\/sub>；在体积不变时满足盖-吕萨克定律 p<sub>1<\/sub>/T<sub>1<\/sub>=p<sub>2<\/sub>/T<sub>2<\/sub>。",[["玻意耳定律","<mrow><msub><mi>p<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>p<\/mi><mn>1<\/mn><\/msub>&#x22C5;<msub><mi>V<\/mi><mn>1<\/mn><\/msub><\/mrow><msub><mi>V<\/mi><mn>2<\/mn><\/msub><\/mfrac><\/mrow>","一定质量的理想气体发生等温变化，且初末态均为平衡态"],["查理定律","<mrow><msub><mi>V<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>V<\/mi><mn>1<\/mn><\/msub>&#x22C5;<msub><mi>T<\/mi><mn>2<\/mn><\/msub><\/mrow><msub><mi>T<\/mi><mn>1<\/mn><\/msub><\/mfrac><\/mrow>","一定质量的理想气体发生等压变化，温度使用开尔文"],["盖-吕萨克定律","<mrow><msub><mi>p<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>p<\/mi><mn>1<\/mn><\/msub>&#x22C5;<msub><mi>T<\/mi><mn>2<\/mn><\/msub><\/mrow><msub><mi>T<\/mi><mn>1<\/mn><\/msub><\/mfrac><\/mrow>","一定质量的理想气体发生等容变化，温度使用开尔文"]],[["p<sub>1<\/sub>","初态压强","Pa"],["p<sub>2<\/sub>","末态压强","Pa"],["V<sub>1<\/sub>","初态体积","m³"],["V<sub>2<\/sub>","末态体积","m³"],["T<sub>1<\/sub>","初态热力学温度","K"],["T<sub>2<\/sub>","末态热力学温度","K"]],[["等温压缩时认为体积减半、压强也减半","等温时 p 与 V 成反比。本情境错误式得到 5.0×10⁴ Pa，正确值应为 2.0×10⁵ Pa。"],["等压变化时把温度比写反，使用 V<sub>2<\/sub> = V<sub>1<\/sub>·T<sub>1<\/sub>/T<sub>2<\/sub>","升温时体积应增大。错误式算得 0.0032 m³，与正确的 0.005 m³ 相反。"]],"三条实验定律各固定一个状态量：等温看 p 与 V，等压看 V 与 T，等容看 p 与 T。温度必须使用开尔文。压强与体积的反比不是说压强随体积均匀减少；例如体积减半，压强变为两倍。若漏气、发生液化或状态变化过快而未达到平衡，简单定律可能不再适用。",["保持气体质量和温度不变，实验发现 pV 为常量，故 p<sub>1<\/sub>V<sub>1<\/sub>=p<sub>2<\/sub>V<sub>2<\/sub>。","保持气体质量和压强不变，实验发现 V/T 为常量，故 V<sub>1<\/sub>/T<sub>1<\/sub>=V<sub>2<\/sub>/T<sub>2<\/sub>。","保持气体质量和体积不变，实验发现 p/T 为常量，故 p<sub>1<\/sub>/T<sub>1<\/sub>=p<sub>2<\/sub>/T<sub>2<\/sub>。","三条关系中的 T 都是从绝对零度起算的热力学温度。"],["一定质量理想气体初态压强 1.0×10⁵ Pa、体积 6.0 L、温度 300 K。先等温压缩到 3.0 L，再保持体积不变升温到 450 K。求两步后的压强。",["等温压缩：p<sub>2<\/sub> = p<sub>1<\/sub>V<sub>1<\/sub>/V<sub>2<\/sub> = 1.0×10⁵×6.0/3.0 = 2.0×10⁵ Pa。","第二步等容，初温 300 K、末温 450 K。","p<sub>3<\/sub> = p<sub>2<\/sub>T<sub>3<\/sub>/T<sub>2<\/sub> = 2.0×10⁵×450/300 = 3.0×10⁵ Pa。"],"等温压缩后压强为 2.0×10⁵ Pa；等容升温后为 3.0×10⁵ Pa。"],["mgas-03"],["mgas-06","exp-25"],["玻意耳定律","查理定律","盖-吕萨克定律","气体实验定律"],17,""],["mgas-06","理想气体状态方程","一定质量的理想气体在任意两个平衡态之间满足 p<sub>1<\/sub>V<sub>1<\/sub>/T<sub>1<\/sub> = p<sub>2<\/sub>V<sub>2<\/sub>/T<sub>2<\/sub>。",[["理想气体状态方程的微观形式","<mrow><mi>p<\/mi><mo>=<\/mo><mfrac><mrow><mrow><mi>N<\/mi>&#x22C5;<msub><mi>k<\/mi><mi>B<\/mi><\/msub><\/mrow>&#x22C5;<mi>T<\/mi><\/mrow><mi>V<\/mi><\/mfrac><\/mrow>","气体可视为理想气体，N 为容器内分子总数"],["一定质量气体的两状态方程","<mrow><msub><mi>p<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><mfrac><mrow><mrow><msub><mi>p<\/mi><mn>1<\/mn><\/msub>&#x22C5;<msub><mi>V<\/mi><mn>1<\/mn><\/msub><\/mrow>&#x22C5;<msub><mi>T<\/mi><mn>2<\/mn><\/msub><\/mrow><mrow><msub><mi>T<\/mi><mn>1<\/mn><\/msub>&#x22C5;<msub><mi>V<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mfrac><\/mrow>","同一份理想气体从一个平衡态变化到另一个平衡态"]],[["p","气体压强","Pa"],["V","气体体积","m³"],["N","气体分子数","1"],["k<sub>B<\/sub>","玻尔兹曼常量","J/K"],["T","热力学温度","K"],["p<sub>1<\/sub>","初态压强","Pa"],["p<sub>2<\/sub>","末态压强","Pa"],["V<sub>1<\/sub>","初态体积","m³"],["V<sub>2<\/sub>","末态体积","m³"],["T<sub>1<\/sub>","初态热力学温度","K"],["T<sub>2<\/sub>","末态热力学温度","K"]],[["把分子平动对压强的贡献重复计算，写成 p = 2N·k<sub>B<\/sub>·T/V","错误式与正确式量纲完全相同，量纲检查无法发现；在微观状态方程情境中会算出 2.0×10⁵ Pa，而独立参考值是 1.0×10⁵ Pa。"],["把微观状态方程写成 p = N·k<sub>B<\/sub>·T·V","乘以体积后量纲变成能量乘体积，已经不是压强；而且错误式会预言容器越大压强越大，方向也相反。"]],"状态方程只连接平衡态，不要求过程一定等温、等压或等容。给定气体质量不变时，三个状态量中知道两个的变化就能求第三个。微观式说明气体压强来源于大量分子对器壁的持续碰撞：分子数密度越大或温度越高，压强越大。实际气体在低密度、高温条件下更接近理想气体。",["把玻意耳、查理和盖-吕萨克三条实验定律统一，可得一定质量气体的 pV/T 为常量。","比较初末两个平衡态，即得 p<sub>1<\/sub>V<sub>1<\/sub>/T<sub>1<\/sub> = p<sub>2<\/sub>V<sub>2<\/sub>/T<sub>2<\/sub>。","从分子碰撞的统计结果可写成 pV = Nk<sub>B<\/sub> T；固定 N 后，同样说明 pV/T 不变。"],["含 2.0×10²³ 个分子的理想气体，温度 300 K，体积 8.28×10⁻³ m³，取 k<sub>B<\/sub>=1.38×10⁻²³ J/K。求气体压强。若保持温度不变把体积压缩为原来的三分之二，求新压强。",["由 p = N·k<sub>B<\/sub>·T/V，先算 N·k<sub>B<\/sub>·T = 828 J。","p = 828/0.00828 = 1.0×10⁵ Pa。","等温且分子数不变，体积变为原来的 2/3，压强变为原来的 3/2。","新压强为 1.5×10⁵ Pa。"],"初态压强为 1.0×10⁵ Pa，压缩后为 1.5×10⁵ Pa。"],["mgas-05"],[],["理想气体","状态方程","气体压强","微观解释"],17,""],["mol-05","液晶：取向有序、流动性与显示","液晶是具有一定分子取向有序而仍能流动的物质状态，性质常有方向差异。",[["光功率透射比例","<mrow><mi>τ<\/mi><mo>=<\/mo><mfrac><msub><mi>P<\/mi><mi mathvariant=\"normal\">出<\/mi><\/msub><msub><mi>P<\/mi><mi mathvariant=\"normal\">入<\/mi><\/msub><\/mfrac><\/mrow>",""],["各光通道能量账目","<mrow><msub><mi>P<\/mi><mi mathvariant=\"normal\">入<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>P<\/mi><mi mathvariant=\"normal\">出<\/mi><\/msub><mo>+<\/mo><msub><mi>P<\/mi><mi mathvariant=\"normal\">损<\/mi><\/msub><\/mrow><\/mrow>","稳态无额外光源的被动装置，非透射量包含全部其他通道。"]],[["τ","该装置透射光功率比例","1"],["P<sub>入<\/sub>","入射光功率","W"],["P<sub>出<\/sub>","透射光功率","W"],["P<sub>损<\/sub>","非透射各通道合计光功率","W"]],[["透射比例把入射光功率除以透射功率。","比例是输出透射量占输入的份额，4/10为0.4，颠倒会变成2.5，不能当作无额外光源装置的透射比例。"],["液晶屏幕发亮就说明液晶分子自己发光，或加电总会更亮。","光源通常是背光或环境光，液晶与偏振元件调制透光；明暗变化取决于结构、取向和驱动，不能从一种结构推广所有液晶。"]],"液晶并非液态晶体碎屑，也不是所有方向均相同的普通液体。不同液晶相的有序形式不同，常见向列相分子长轴具有优先方向而位置不必形成固体晶格。显示装置改变分子取向和偏振光的传播，通常由背光或环境光提供光源，液晶层本身不因此成为发光源。温度和外场响应依材料及结构而定，不能说任何液晶加电都更亮。以下透射比例只是独立光功率读数的处理，不是液晶微观性质的数值证明。",["比例分别为4/10=0.4和1/10=0.1。","两读数只比较该装置透射情况，光来自照明而非液晶自行发光。","液晶并非液态晶体碎屑，也不是所有方向均相同的普通液体。"],["设计显示光路入射10 mW，两个取向状态透射4 mW和1 mW，计算透射比例并说明亮度来源。",["比例分别为4/10=0.4和1/10=0.1。","两读数只比较该装置透射情况，光来自照明而非液晶自行发光。"],"透射比例40%与10%；液晶用于调制光。"],["mgas-01","thermo-04"],["wop-03"],["液晶：取向有序、流动性与显示","条件与边界","实验与证据"],17,"<section class=\"field learning\"><h4>液晶：取向有序、流动性与显示：方法与边界<\/h4><p>液晶并非液态晶体碎屑，也不是所有方向均相同的普通液体。不同液晶相的有序形式不同，常见向列相分子长轴具有优先方向而位置不必形成固体晶格。显示装置改变分子取向和偏振光的传播，通常由背光或环境光提供光源，液晶层本身不因此成为发光源。温度和外场响应依材料及结构而定，不能说任何液晶加电都更亮。以下透射比例只是独立光功率读数的处理，不是液晶微观性质的数值证明。<\/p><\/section>"],["mol-06","毛细现象与浸润条件","细管中的液面相对外部液面上升或下降称毛细现象，方向取决于液体对管壁的浸润性。",[["圆管静态毛细高度","<mrow><mi>h<\/mi><mo>=<\/mo><mfrac><mrow><mrow><mn>2<\/mn>&#x2062;<mi>σ<\/mi><\/mrow>&#x22C5;<mrow><mi mathvariant=\"normal\">cos<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>θ<\/mi><mo>)<\/mo><\/mrow><\/mrow><mrow><mrow><mi>ρ<\/mi>&#x22C5;<mi>g<\/mi><\/mrow>&#x22C5;<mi>r<\/mi><\/mrow><\/mfrac><\/mrow>",""],["接触线竖直张力","<mrow><mi>F<\/mi><mo>=<\/mo><mrow><mrow><mrow><mrow><mn>2<\/mn>&#x2062;<mi>π<\/mi><\/mrow>&#x22C5;<mi>r<\/mi><\/mrow>&#x22C5;<mi>σ<\/mi><\/mrow>&#x22C5;<mrow><mi mathvariant=\"normal\">cos<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>θ<\/mi><mo>)<\/mo><\/mrow><\/mrow><\/mrow>",""]],[["h","相对外液面有符号高度","m"],["σ","表面张力系数","N/m"],["θ","液体侧接触角","rad"],["ρ","液体密度","kg/m³"],["g","重力加速度","m/s²"],["r","细圆管内半径","m"],["d","细圆管内直径","m"],["F","表面张力有符号竖直合力","N"]],[["把给出的管内直径直接当公式中的半径。","公式分母为内半径，直径是它的两倍；错用1 mm而不是0.5 mm会把高度算成一半，即0.72 cm。"],["所有液体在任何细管中都会上升，或毛细高度大就说明流量更大。","上升下降取决于浸润及接触角；静态高度与动态流量不同，流量还受黏性和阻力限制，不能从静态公式直接推出。"]],"表面张力在管口接触线处的竖直分量与液柱重量差平衡。圆管半径越小，理想静态毛细高度绝对值越大；半径不是直径。接触角从液体一侧测量，浸润角余弦为正使液面上升，不浸润为负使液面下降。模型忽略弯月面体积修正、动态流动和蒸发，要求细圆管、足够液体及稳定接触角。它不能说明细管越细流量一定越大，渗流阻力是另一问题。下面负高度表示相对外液面降低，不是负的实际管长。",["半径为0.5 mm，接触角余弦为0.5。","2×0.072×0.5除(1000×10×0.0005)=0.0144 m。","表面张力在管口接触线处的竖直分量与液柱重量差平衡。"],["设计细圆管内径1 mm，表面张力0.072 N/m、接触角60°，密度1000 kg/m³、g取10，求理想上升高度。",["半径为0.5 mm，接触角余弦为0.5。","2×0.072×0.5除(1000×10×0.0005)=0.0144 m。"],"理想上升1.44 cm；其他材料接触角可能导致下降。"],["thermo-04"],["mgas-02"],["毛细现象与浸润条件","条件与边界","实验与证据"],17,"<section class=\"field learning\"><h4>毛细现象与浸润条件：方法与边界<\/h4><p>表面张力在管口接触线处的竖直分量与液柱重量差平衡。圆管半径越小，理想静态毛细高度绝对值越大；半径不是直径。接触角从液体一侧测量，浸润角余弦为正使液面上升，不浸润为负使液面下降。模型忽略弯月面体积修正、动态流动和蒸发，要求细圆管、足够液体及稳定接触角。它不能说明细管越细流量一定越大，渗流阻力是另一问题。下面负高度表示相对外液面降低，不是负的实际管长。<\/p><\/section>"],["thermo-01","热力学第一定律","热力学第一定律是能量守恒在热现象中的具体表达。",[["热力学第一定律","<mrow><mi>Δ<\/mi><mi>U<\/mi><mo>=<\/mo><mrow><mi>Q<\/mi><mo>+<\/mo><mi>W<\/mi><\/mrow><\/mrow>","采用外界对系统做功为正、传入系统的热量为正的约定"],["由内能变化反求外界做功","<mrow><mi>W<\/mi><mo>=<\/mo><mrow><mi>Δ<\/mi><mi>U<\/mi><mo>−<\/mo><mi>Q<\/mi><\/mrow><\/mrow>","已知内能变化与传热，反求外界对系统做的功"]],[["ΔU","系统内能的变化量，末态内能减初态内能","J"],["Q","传入系统的热量，吸热为正、放热为负","J"],["W","外界对系统做的功，外界做正功时为正","J"]],[["在本章的符号约定下仍机械地写 ΔU = Q - W","本章的 W 指外界对系统做功。吸热膨胀情境中 W=-200 J，错误式得到 700 J，而能量收支应为 300 J。减号版本只适用于把 W 定义为系统对外做功的另一套约定。"],["绝热过程一定不做功，所以内能不变","绝热只表示 Q=0，不表示 W=0。绝热压缩中外界做功 150 J，内能增加 150 J；错误式却给出 0。"]],"公式最难的不是加法，而是符号。先判断能量沿哪条路径进出系统，再代入正负号：吸热使能量进入系统，取正；外界压缩气体也把能量送入系统，做功取正。相反，气体膨胀推动活塞时能量离开系统，W 取负。内能是状态量，而热量和功是过程量，不能说某个物体“含有多少热量”。",["把研究对象选作热力学系统。系统与外界交换能量只有传热和做功两条常见路径。","按能量流入系统为正的统一思想：传入的热量记为 Q，外界对系统做功记为 W。","由能量守恒，系统内能的增量等于两条路径流入能量的代数和，因此 ΔU = Q + W。","若采用“系统对外界做功为正”的另一套约定，第一定律中的做功项要改用减号；两种符号约定不能混用。"],["某气体吸收 500 J 热量，同时膨胀并对外界做功 200 J。按外界对系统做功为正的约定，求气体内能的变化。",["吸热，所以 Q=+500 J。","气体对外界做功，因此外界对气体做功 W=-200 J。","由 ΔU=Q+W，得 ΔU=500+(-200)=300 J。"],"气体内能增加 300 J。"],["mgas-04"],["thermo-02"],["热力学第一定律","内能","热量","做功","符号约定"],18,""],["thermo-02","能量守恒定律","能量既不会凭空产生，也不会凭空消失，只会从一种形式转化为另一种形式，或从一个物体转移到另一个物体。",[["封闭系统总能量变化","<mrow><msub><mi>ΔE<\/mi><mi mathvariant=\"normal\">总<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">后<\/mi><\/msub><mo>−<\/mo><msub><mi>E<\/mi><mi mathvariant=\"normal\">前<\/mi><\/msub><\/mrow><\/mrow>","先确定系统边界，再比较系统末态与初态的总能量"],["绝热热交换的热量平衡","<mrow><msub><mi>Q<\/mi><mi mathvariant=\"normal\">吸<\/mi><\/msub><mo>=<\/mo><msub><mi>Q<\/mi><mi mathvariant=\"normal\">放<\/mi><\/msub><\/mrow>","系统只含相互传热的物体，并且与环境绝热、不发生其他能量交换"]],[["E<sub>前<\/sub>","封闭系统初态的总能量","J"],["E<sub>后<\/sub>","封闭系统末态的总能量","J"],["ΔE<sub>总<\/sub>","封闭系统总能量的变化量","J"],["Q<sub>放<\/sub>","高温物体放出的热量大小","J"],["Q<sub>吸<\/sub>","低温物体吸收的热量大小","J"]],[["认为能量转化过程中会有一部分能量消失","“损耗”通常是机械能转化成内能并扩散到环境，不是能量消失。封闭系统情境中错误式只得 1000 J，而总能量仍应为 1250 J。"],["热水和冷水绝热混合时，把吸热量与放热量相加作为低温物体所得热量","同一份转移的能量被重复记了两次。情境中右边变成 16800 J，而低温物体只吸收 8400 J。"]],"能量守恒是所有能量计算的总账本。第一步不是套公式，而是划定系统边界：若把热水和冷水一起看作系统且容器绝热，二者交换的热量一正一负，总和为零；若系统还向空气散热，就必须把这部分能量也记入账本。永动机不可能制成，根本原因之一就是它声称无能量输入却能持续输出功，违反能量守恒。",["选定封闭系统后，把系统内机械能、内能等各种形式的能量全部计入总能量。","能量只能在系统内部转化，不能穿过边界流失，因此 E<sub>后<\/sub>=E<sub>前<\/sub>，等价于总能量变化量 ΔE<sub>总<\/sub>=0。","对绝热混合系统，高温物体减少的内能转移给低温物体，按热量大小记账便得到 Q<sub>吸<\/sub>=Q<sub>放<\/sub>。"],["在绝热容器中混合两部分水。达到热平衡时，高温水内能减少 8400 J，忽略容器吸热，低温水内能增加多少？",["把两部分水一起选作封闭系统，容器绝热，因此没有能量流出系统。","高温水放出的能量全部转移给低温水。","由 Q<sub>吸<\/sub>=Q<sub>放<\/sub>，低温水吸收 8400 J。"],"低温水内能增加 8400 J。"],["thermo-01"],["thermo-03"],["能量守恒","系统边界","热平衡","永动机"],18,""],["thermo-03","热力学第二定律与热机效率","热力学第二定律揭示宏观热过程的方向性。",[["热机效率","<mrow><mi>η<\/mi><mo>=<\/mo><mfrac><msub><mi>W<\/mi><mi mathvariant=\"normal\">出<\/mi><\/msub><msub><mi>Q<\/mi><mi>h<\/mi><\/msub><\/mfrac><\/mrow>","热机循环工作，效率等于有用功与从高温热库吸热量之比"],["卡诺效率上限","<mrow><msub><mi>η<\/mi><mi mathvariant=\"normal\">max<\/mi><\/msub><mo>=<\/mo><mrow><mn>1<\/mn><mo>−<\/mo><mfrac><msub><mi>T<\/mi><mi>c<\/mi><\/msub><msub><mi>T<\/mi><mi>h<\/mi><\/msub><\/mfrac><\/mrow><\/mrow>","理想可逆热机在温度为 T<sub>h<\/sub> 与 T<sub>c<\/sub> 的两个热库之间工作，且 T<sub>h<\/sub>&gt;T<sub>c<\/sub>&gt;0"]],[["η","热机效率","1"],["W<sub>出<\/sub>","热机一个循环对外输出的有用功","J"],["Q<sub>h<\/sub>","热机一个循环从高温热库吸收的热量","J"],["η<sub>max<\/sub>","给定高低温热库之间的卡诺效率上限","1"],["T<sub>h<\/sub>","高温热库的热力学温度","K"],["T<sub>c<\/sub>","低温热库的热力学温度","K"]],[["把热机效率的分子分母颠倒，写成 η=Q<sub>h<\/sub>/W<sub>出<\/sub>","效率应是有用输出除以能量输入。错误式得到 1000/350≈2.86，大于 1，既与定义不符也违反第二定律。"],["卡诺效率写成 η<sub>max<\/sub>=1-T<sub>h<\/sub>/T<sub>c<\/sub>","高低温温度比写反会得到 1-600/300=-1，不可能成为效率。正确结果是 0.5。"]],"第二定律不否定能量守恒，而是在守恒之外增加“方向限制”。冰箱能把热量从低温处搬到高温处，是因为压缩机消耗了电功；热机能连续对外做功，也必须把一部分热量排给低温热库。因此真实热机效率小于 1，并且不会超过相同高、低温热库之间可逆热机的卡诺效率。温度必须使用开尔文温标。",["热机每循环从高温热库吸收 Q<sub>h<\/sub>，对外做有用功 W<sub>出<\/sub>，其余能量必须排向低温热库。","效率定义为收益与投入之比，因此 η=W<sub>出<\/sub>/Q<sub>h<\/sub>；第二定律要求连续工作的热机 η&lt;1。","对理想可逆热机，效率只由两个热库的热力学温度决定，η<sub>max<\/sub>=1-T<sub>c<\/sub>/T<sub>h<\/sub>。","实际过程存在摩擦、有限温差传热等不可逆因素，所以实际效率严格低于卡诺上限。"],["某热机每循环从 600 K 的高温热库吸收 1000 J 热量，对外做功 350 J，低温热库温度为 300 K。求实际效率和卡诺效率上限。",["实际效率 η=W<sub>出<\/sub>/Q<sub>h<\/sub>=350/1000=0.35。","卡诺上限 η<sub>max<\/sub>=1-T<sub>c<\/sub>/T<sub>h<\/sub>=1-300/600=0.50。","0.35&lt;0.50，实际热机没有超过理论上限。"],"实际效率为 35%，卡诺效率上限为 50%。"],["thermo-02","mgas-03"],["thermo-04"],["热力学第二定律","熵","热机","卡诺效率","过程方向"],18,""],["thermo-04","固体、液体与物态变化","晶体有确定的熔点，非晶体没有确定的熔点；液体具有表面张力，浸润与不浸润取决于液体和固体之间的相互作用。",[["相变潜热","<mrow><msub><mi>Q<\/mi><mi mathvariant=\"normal\">潜<\/mi><\/msub><mo>=<\/mo><mrow><mi>m<\/mi>&#x22C5;<mi>L<\/mi><\/mrow><\/mrow>","物质在相变温度发生熔化、凝固、汽化或液化，L 取对应相变的潜热"],["无相变时的吸放热","<mrow><msub><mi>Q<\/mi><mi mathvariant=\"normal\">显热<\/mi><\/msub><mo>=<\/mo><mrow><mrow><mi>m<\/mi>&#x22C5;<mi>c<\/mi><\/mrow>&#x22C5;<mi>Δ<\/mi><mi>T<\/mi><\/mrow><\/mrow>","物质不发生物态变化，且所考察温区内比热容可近似为常量"]],[["Q<sub>潜<\/sub>","物态变化过程中吸收或放出的潜热大小","J"],["m","发生相变或温度变化的物质质量","kg"],["L","单位质量物质发生某种相变的潜热","J/kg"],["Q<sub>显热<\/sub>","未发生相变时因温度变化吸收或放出的热量大小","J"],["c","物质的比热容","J/kg/K"],["ΔT","温度变化量","K"]],[["误把相变潜热写成 Q<sub>潜<\/sub>=½m·L，多乘了二分之一","错误式量纲仍然是能量，量纲检查抓不到；代入 2 kg 和 334000 J/kg 只得到 334000 J，正确值应为 668000 J。"],["晶体熔化过程中仍用 Q=mc ΔT，并因温度不变算出吸热为零","熔化平台上 ΔT=0，但物质持续吸收潜热来改变微观结构。2 kg 冰完全熔化需要 668000 J，并非 0。"]],"必须先判断加热过程是否处于相变平台，再选择公式。相变时用 Q=mL，L 取决于物质和相变种类；单纯升温时用 Q=mc ΔT。晶体熔化时持续吸热但温度保持在熔点，吸收的能量用于改变分子排列和分子势能，而不是提高温度。两段过程同时出现时，应分段计算再相加。",["相变潜热 L 定义为单位质量物质完成指定相变所需的热量，因此质量为 m 时 Q<sub>潜<\/sub>=mL。","比热容 c 定义为单位质量物质温度改变 1 K 所需的热量，因此无相变时 Q<sub>显热<\/sub>=mc ΔT。","相变平台上 ΔT=0 但 Q<sub>潜<\/sub> 可以不为零，说明潜热公式不能被温升公式替代。"],["质量 2.0 kg、处在熔点的冰完全熔化，冰的熔化潜热为 3.34×10⁵ J/kg。求需要吸收的热量。",["冰已经处在熔点，过程只发生物态变化，不需要先升温。","用相变潜热公式 Q<sub>潜<\/sub>=mL。","Q<sub>潜<\/sub>=2.0×3.34×10⁵=6.68×10⁵ J。"],"需要吸收 6.68×10⁵ J 热量。"],["thermo-01"],["thermo-05"],["晶体","非晶体","表面张力","物态变化","潜热","比热容"],18,""],["thermo-05","饱和汽与空气湿度","在密闭容器中，液体蒸发与蒸气液化达到动态平衡时，蒸气叫饱和汽，其压强叫饱和汽压。",[["相对湿度","<mrow><mi>φ<\/mi><mo>=<\/mo><mfrac><msub><mi>p<\/mi><mi>v<\/mi><\/msub><msub><mi>p<\/mi><mi mathvariant=\"normal\">饱和<\/mi><\/msub><\/mfrac><\/mrow>","实际水汽压与饱和汽压取同一温度、同一压强单位"],["绝对湿度","<mrow><msub><mi>ρ<\/mi><mi>v<\/mi><\/msub><mo>=<\/mo><mfrac><msub><mi>m<\/mi><mi>v<\/mi><\/msub><mi>V<\/mi><\/mfrac><\/mrow>","用单位体积空气中水蒸气的质量描述湿度"]],[["φ","相对湿度，用小数表示","1"],["p<sub>v<\/sub>","空气中水蒸气的实际分压","Pa"],["p<sub>饱和<\/sub>","同温度下水的饱和汽压","Pa"],["ρ<sub>v<\/sub>","绝对湿度，即水蒸气质量密度","kg/m³"],["m<sub>v<\/sub>","空气中所含水蒸气的质量","kg"],["V","所考察空气的体积","m³"]],[["把相对湿度的分子分母颠倒，写成 φ=p<sub>饱和<\/sub>/p<sub>v<\/sub>","未饱和空气中 p<sub>v<\/sub>&lt;p<sub>饱和<\/sub>，颠倒后会算出 2000/1400≈1.43，即 143%，而正确值为 70%。"],["把相对湿度 70% 直接当成数值 70 代入后续公式","百分数必须化为小数 0.70。把 70 当作相对湿度会大 100 倍，而且相对湿度的常规范围应在 0 到 1 之间。"]],"相对湿度描述空气距离饱和还有多远，不等于空气中水蒸气的质量。实际水汽压不变而温度降低时，饱和汽压会下降，相对湿度上升；达到 100% 后继续降温，就会出现凝露。绝对湿度用单位体积空气所含水蒸气质量表示，与相对湿度是不同口径。天气预报常把相对湿度写成百分数，计算时应先化成小数。",["同温度下，以实际水汽压占饱和汽压的比例衡量接近饱和的程度，得到 φ=p<sub>v<\/sub>/p<sub>饱和<\/sub>。","当 φ=1 时空气恰好饱和；通常未饱和空气有 0&lt;φ&lt;1，乘 100% 后得到百分数表示。","按质量密度的定义，单位体积所含水蒸气质量为 ρ<sub>v<\/sub>=m<sub>v<\/sub>/V，这就是绝对湿度的一种常用表示。"],["某室内空气中水蒸气实际分压为 1.40×10³ Pa，同温度下饱和汽压为 2.00×10³ Pa。另测得 15 m³ 空气中含水蒸气 0.018 kg。求相对湿度和绝对湿度。",["相对湿度 φ=p<sub>v<\/sub>/p<sub>饱和<\/sub>=1400/2000=0.70，即 70%。","绝对湿度 ρ<sub>v<\/sub>=m<sub>v<\/sub>/V=0.018/15=0.0012 kg/m³。","换算为常用单位是 1.2 g/m³；两个湿度数值描述的是不同口径。"],"相对湿度为 70%，绝对湿度为 0.0012 kg/m³（1.2 g/m³）。"],["mgas-03","mgas-06"],[],["饱和汽","饱和汽压","相对湿度","绝对湿度","露点"],18,""],["qz-01","黑体辐射与能量量子化","普朗克提出：物体吸收或发射能量时不是连续进行的，而是一份一份的，每一份能量子的大小与频率成正比，写作 ε=hν，其中 h 叫普朗克常量。",[["光子能量与频率的关系","<mrow><mi>E<\/mi><mo>=<\/mo><mrow><mi>h<\/mi>&#x22C5;<mi>ν<\/mi><\/mrow><\/mrow>","任何单色光都成立；E 是单个光子的能量"],["n 个光子的总能量","<mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">总<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>n<\/mi><mi mathvariant=\"normal\">光子<\/mi><\/msub>&#x22C5;<mi>E<\/mi><\/mrow><\/mrow>","单色光，且每个光子的能量相同"]],[["h","普朗克常量","eV·s"],["ν","光的频率","Hz"],["E","一个光子的能量","eV"],["n<sub>光子<\/sub>","光子个数","1"],["E<sub>总<\/sub>","n 个光子的总能量","eV"]],[["把光子能量写成与频率成反比","频率越高光子能量越大，是正比。按错误式红光只得到 8.28×10⁻³⁰ eV，而正确值是 2.07 eV——差了 30 个数量级。"],["认为光释放或吸收的能量可以连续变化","这正是被黑体辐射实验否掉的经典图像。能量是一份一份的，「一份」就是 hν。这一条是观念性错误，无法用公式检查，只能靠人判。"]],"「能量不连续」是整章的地基。经典理论算出的黑体辐射曲线在短波处会趋向无穷大，与实验完全不符——这个矛盾叫「紫外灾难」。普朗克引入能量量子化后，理论曲线才与实验吻合。随后在光子模型中，hν 表示<strong>一个光子<\/strong>的能量，n 个同频光子的总能量就是 n·hν。这样既保留了量子化的核心，也区分了普朗克的能量子假设与爱因斯坦的光子解释。",["实验测出的黑体辐射曲线在短波处会掉下来，而经典理论预言它会趋于无穷——这个矛盾必须先解决。","普朗克假设：吸收和发射的能量只能是一份一份的，每一份的大小与频率成正比，记作 hν。","于是 n 个光子的总能量就是 n·hν，能量只能在「份」的基础上累加，不能连续变化。"],["某红光的频率为 5.0×10¹⁴ Hz。取 h=4.14×10⁻¹⁵ eV·s，求一个光子的能量；再求 3 个这样的光子总共有多少能量。",["E = hν = 4.14×10⁻¹⁵ × 5.0×10¹⁴ = 2.07 eV","三个光子：E<sub>总<\/sub> = 3 × 2.07 = 6.21 eV"],"单光子能量 2.07 eV，三个光子共 6.21 eV。"],[],[],["量子化","普朗克常量"],19,""],["qz-02","光电效应与爱因斯坦光电方程","光照射到金属表面时电子被击出，叫光电效应。",[["爱因斯坦光电方程","<mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">k<\/mi><\/msub><mo>=<\/mo><mrow><mrow><mi>h<\/mi>&#x22C5;<mi>ν<\/mi><\/mrow><mo>−<\/mo><mi>W<\/mi><\/mrow><\/mrow>","入射光频率大于截止频率时才有光电子；E<sub>k<\/sub> 取最大值"],["截止频率","<mrow><msub><mi>ν<\/mi><mn>0<\/mn><\/msub><mo>=<\/mo><mfrac><mi>W<\/mi><mi>h<\/mi><\/mfrac><\/mrow>","令 E<sub>k<\/sub>=0 解出，即恰好能发生光电效应的最低频率"]],[["h","普朗克常量","eV·s"],["ν","入射光的频率","Hz"],["W","金属的逸出功","eV"],["E<sub>k<\/sub>","光电子的最大初动能","eV"],["ν<sub>0<\/sub>","截止频率（恰好能打出电子的最低频率）","Hz"]],[["把光电方程写成 E<sub>k<\/sub> = W - h·ν（减反了）","hν 是吸收到的能量，W 是必须付出的，剩下才是动能，所以是「收入减支出」。按错误式会得到 −0.815 eV，动能不可能为负。"],["认为只要光足够强，低于截止频率的光也能打出光电子","能否打出电子只取决于单个光子的能量 hν 是否超过 W。光强变大只是光子数变多，每个光子的能量并没有变大。这是光电效应最核心的概念性结论，公式抓不到。"]],"这条式子一次解释了光电效应全部「反常」现象。其一，能否打出电子只取决于<strong>单个光子<\/strong>的能量是否够大（hν&gt;W），与光强无关；增大光强只是让光子<strong>变多<\/strong>，所以光电流变大但截止频率不变。其二，出现光电子几乎不需要时间，因为能量是整份被一个电子一次性吸收的，不存在「慢慢攒」的过程。其三，E<sub>k<\/sub> 与 ν 是<strong>线性关系<\/strong>，图线斜率就是 h。",["一个电子要离开金属，至少得付出逸出功 W。","电子一次性吸收一个光子的能量 hν，付掉逸出功后剩下的全部变成初动能，所以 E<sub>k<\/sub>=hν−W。","令 E<sub>k<\/sub>=0 解出恰好能发生光电效应的频率，即截止频率 ν₀=W/h；频率低于它，无论光多强都打不出电子。"],["用频率 7.5×10¹⁴ Hz 的紫光照射钠，钠的逸出功为 2.29 eV。取 h=4.14×10⁻¹⁵ eV·s，求光电子的最大初动能；并求钠的截止频率。",["先算单光子能量：hν = 4.14×10⁻¹⁵ × 7.5×10¹⁴ = 3.105 eV","E<sub>k<\/sub> = hν − W = 3.105 − 2.29 = 0.815 eV","截止频率：ν₀ = W/h = 2.29 ÷ 4.14×10⁻¹⁵ = 5.53×10¹⁴ Hz"],"最大初动能 0.815 eV；截止频率约 5.53×10¹⁴ Hz。"],[],["qz-07"],["光电效应","逸出功"],19,""],["qz-03","光的波粒二象性","光既有波动性（能发生干涉、衍射）又有粒子性（能发生光电效应），二者不是互相否定，而是光在不同情境下表现出的不同侧面，这叫波粒二象性。",[["波长与频率的关系","<mrow><mi>ν<\/mi><mo>=<\/mo><mfrac><mi>c<\/mi><mi>λ<\/mi><\/mfrac><\/mrow>","光在真空中传播；波长越短频率越高"],["光子的能量","<mrow><mi>E<\/mi><mo>=<\/mo><mrow><mi>h<\/mi>&#x22C5;<mi>ν<\/mi><\/mrow><\/mrow>","与上一条联立，就把「波」的波长换算成了「粒子」的能量"]],[["c","真空中的光速","m/s"],["λ","光的波长","m"],["ν","光的频率","Hz"],["h","普朗克常量","eV·s"],["E","单个光子的能量","eV"]],[["把波长与频率记成正比，写成 ν = c·λ","两者是反比。按错误式，5.0×10⁻⁷ m 的绿光会算出 150 Hz，而正确值是 6.0×10¹⁴ Hz。"],["认为「干涉说明光是波、光电效应说明光是粒子」，两者互相矛盾","两者描述的是同一束光的不同侧面，通过 E=hν 与 ν=c/λ 可以互相换算，并不矛盾。这是观念性理解，公式检查不了。"]],"「二象性」不是「有时是波有时是粒子」这么含糊。准确的说是：光在传播、干涉、衍射时用波动规律描述最方便，在与物质交换能量时用光子模型最方便，两套描述通过 E=hν 与 ν=c/λ 联立起来。判断该用哪一套的粗略标准是：看你在追问「往哪儿走」还是「交出多少能量」。",["波动描述给出波长与频率的关系：一个周期内波前进一个波长，所以 ν=c/λ。","粒子描述给出能量与频率的关系：E=hν。","把两式联立消去 ν，就得到 E=hc/λ —— 波长越短，单个光子的能量越高，这也是紫外光比红光更「厉害」的原因。"],["某绿光在真空中的波长为 5.0×10⁻⁷ m。取 c=3.0×10⁸ m/s、h=4.14×10⁻¹⁵ eV·s，求它的频率与单个光子的能量。",["ν = c/λ = 3.0×10⁸ ÷ 5.0×10⁻⁷ = 6.0×10¹⁴ Hz","E = hν = 4.14×10⁻¹⁵ × 6.0×10¹⁴ = 2.484 ≈ 2.48 eV"],"频率 6.0×10¹⁴ Hz，单光子能量约 2.48 eV。"],[],["qz-08"],["波粒二象性","光子"],19,""],["qz-04","物质波（德布罗意波长）","德布罗意提出：不仅光有波粒二象性，实物粒子也有。",[["动量","<mrow><mi>p<\/mi><mo>=<\/mo><mrow><mi>m<\/mi>&#x22C5;<mi>v<\/mi><\/mrow><\/mrow>","速度远小于光速的非相对论情形"],["德布罗意波长","<mrow><mi>λ<\/mi><mo>=<\/mo><mfrac><mi>h<\/mi><mi>p<\/mi><\/mfrac><\/mrow>","任何实物粒子都成立；p 越大波长越短"]],[["h","普朗克常量","J·s"],["p","粒子的动量","kg·m/s"],["λ","德布罗意波长","m"],["m","粒子质量","kg"],["v","粒子速度","m/s"]],[["把动量写成 m·v²（与动能记混）","动量是 mv，动能才是 ½mv²。按错误式小球会得到 0.18 kg·m/s，而正确值是 0.06 kg·m/s。"],["认为宏观物体没有波动性，所以德布罗意假设是错的","宏观物体<strong>有<\/strong>波动性，只是波长小到无法观测（0.02 kg 小球约 10⁻³² m）。「测不到」不等于「不存在」——这条要靠人判。"]],"这条式子把「粒子」和「波」的关系推广到了实物。要看清它为什么在宏观世界完全看不出来：h 只有 6.63×10⁻³⁴ 量级，一个 0.02 kg 的小球即使以 3 m/s 运动，波长也只有 10⁻³² m —— 比原子核还小 17 个数量级，任何实验都测不到。而电子的质量小到 10⁻³¹ kg，波长就落到了 10⁻¹⁰ m 量级，恰好与原子的尺度相当，于是能被晶体衍射实验证实。",["先把粒子的动量写出来：p=mv。","德布罗意假设实物粒子也满足 h 与 p 的对应关系，即 λ=h/p。","代入数值估算量级：宏观物体的波长在 10⁻³² m 附近，远小于任何可测尺度，所以日常生活中完全观察不到波动性。"],["一个质量 0.02 kg 的小球以 3.0 m/s 运动。取 h=6.63×10⁻³⁴ J·s，求它的动量与德布罗意波长，并说明为什么日常看不到它的波动性。",["p = mv = 0.02 × 3.0 = 0.06 kg·m/s","λ = h/p = 6.63×10⁻³⁴ ÷ 0.06 ≈ 1.1×10⁻³² m","这个波长比原子核还小十几个数量级，没有任何实验能测到，所以宏观物体的波动性表现不出来"],"动量 0.06 kg·m/s，德布罗意波长约 1.1×10⁻³² m，远小于可测尺度。"],[],[],["德布罗意波","物质波"],19,""],["qz-05","原子的核式结构模型","卢瑟福根据 α 粒子散射实验提出：原子的正电荷和几乎全部质量集中在一个极小的核里，电子在核外空间运动。",[["库仑力与距离的关系","<mrow><mi>F<\/mi><mo>=<\/mo><mfrac><mrow><mrow><msub><mi>k<\/mi><mi>e<\/mi><\/msub>&#x22C5;<msub><mi>q<\/mi><mn>1<\/mn><\/msub><\/mrow>&#x22C5;<msub><mi>q<\/mi><mn>2<\/mn><\/msub><\/mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mfrac><\/mrow>","α 粒子仍在原子核外时，可把它与金核近似看作点电荷；进入核内后不能沿用本式"],["距离减半时库仑力的变化","<mrow><msub><mi>F<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><mrow><msub><mi>F<\/mi><mn>1<\/mn><\/msub>&#x22C5;<msup><mfrac><msub><mi>r<\/mi><mn>1<\/mn><\/msub><msub><mi>r<\/mi><mn>2<\/mn><\/msub><\/mfrac><mn>2<\/mn><\/msup><\/mrow><\/mrow>","电荷量不变，只改变距离时的比例关系"]],[["k<sub>e<\/sub>","静电力常量","N·m²/C²"],["q<sub>1<\/sub>","α 粒子的电荷量","C"],["q<sub>2<\/sub>","金核的电荷量","C"],["r","α 粒子与核中心的距离","m"],["F","α 粒子受到的库仑斥力","N"],["r1","初始距离","m"],["r2","靠近后的距离","m"],["F<sub>1<\/sub>","初始距离下的库仑力","N"],["F<sub>2<\/sub>","靠近后的库仑力","N"]],[["把库仑力写成与距离成反比（漏掉平方）","是平方反比。漏掉平方后同一个情境只得到约 7.28×10⁻¹³ N，而正确值约为 14.6 N，量级完全错误。"],["认为 α 粒子大角度偏转是因为撞上了核外电子","电子质量只有 α 粒子的约 1/7300，撞上电子不可能让 α 粒子大幅偏转。能被弹回的只能是质量大、电荷集中的核。这是概念性判断，公式检查不到。"]],"这个模型的证据全在「绝大多数穿过去、极少数被弹回来」这句现象描述里。大多数 α 粒子几乎不偏转，说明原子内部绝大部分是空的；极少数被大角度甚至原路弹回，说明存在一个质量大、电荷集中、体积极小的核。核半径约 10⁻¹⁵ m，而原子半径约 10⁻¹⁰ m，相差五个数量级。本例取几十飞米的核外距离，既能展示迅速增强的斥力，也不把金核错误地当成在核内仍适用的点电荷。",["α 粒子带正电，金核也带正电，两者之间的作用是库仑斥力。","把电荷量与距离代入库仑定律 F=kq1q<sub>2<\/sub>/r²，算出在核尺度上的斥力量级。","由于力与距离平方成反比，α 粒子越靠近核，受到的斥力增长越快，因此在极近距离上会被大幅度甚至原路弹回——这正是散射实验中那些大角度偏转的来源。"],["α 粒子（电荷量 3.2×10⁻¹⁹ C）在金核外抵近到 5.0×10⁻¹⁴ m，金核电荷量为 1.264×10⁻¹⁷ C。取 k<sub>e<\/sub>=9.0×10⁹ N·m²/C²，求它受到的库仑斥力。",["F = k<sub>e<\/sub>·q<sub>1<\/sub>·q<sub>2<\/sub>/r²","F = 9.0×10⁹ × 3.2×10⁻¹⁹ × 1.264×10⁻¹⁷ ÷ (5.0×10⁻¹⁴)²","F = 3.6403×10⁻²⁶ ÷ 2.5×10⁻²⁷ ≈ 14.6 N"],"库仑斥力约 14.6 N。对单个微观 α 粒子而言，这已经是足以造成显著偏转的强作用。"],[],[],["核式结构","库仑力"],19,""],["qz-06","玻尔模型与氢原子能级","玻尔提出：氢原子的能量只能取一系列特定的值，叫能级，第 n 个能级写作 E<sub>n<\/sub>=E<sub>1<\/sub>/n²，其中 E<sub>1<\/sub> 是基态能量。",[["氢原子能级公式","<mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">n<\/mi><\/msub><mo>=<\/mo><mfrac><msub><mi>E<\/mi><mn>1<\/mn><\/msub><msup><mi>n<\/mi><mn>2<\/mn><\/msup><\/mfrac><\/mrow>","氢原子（单电子体系）；n 取正整数 1、2、3…"],["能级跃迁放出的光子能量","<mrow><mi>Δ<\/mi><mi>E<\/mi><mo>=<\/mo><mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">高<\/mi><\/msub><mo>−<\/mo><msub><mi>E<\/mi><mi mathvariant=\"normal\">低<\/mi><\/msub><\/mrow><\/mrow>","从高能级向低能级跃迁时放出光子；反向则吸收"]],[["E<sub>1<\/sub>","基态能量（n=1），氢原子约为 −13.6 eV","eV"],["n","量子数（能级序号）","1"],["E<sub>n<\/sub>","第 n 个能级的能量","eV"],["E<sub>高<\/sub>","较高能级的能量（跃迁前）","eV"],["E<sub>低<\/sub>","较低能级的能量（跃迁后）","eV"],["ΔE","跃迁放出的光子能量","eV"]],[["把能级公式写成 E<sub>n<\/sub> = E<sub>1<\/sub>/n（漏掉平方）","是 n² 而不是 n。按错误式第二能级会得到 −6.8 eV，而正确值是 −3.4 eV——两条式子给出的谱线位置完全不同。"],["认为原子可以处于任意能量的状态","能级是分立的，原子只能待在这几条固定的「台阶」上，这也是原子光谱是一条条分离谱线而不是连续光谱的根本原因。属观念性错误，公式检查不了。"]],"「能级」是能量量子化在原子上的具体表现：原子不能停在任意能量上，只能待在几条固定的「台阶」上。这解释了两件事：一是原子发光不是连续光谱，而是一条条分离的谱线；二是每条谱线对应一次确定的跃迁，所以谱线位置可以用来反推能级结构。要注意 E<sub>1<\/sub> 是<strong>负值<\/strong>，能级越高（n 越大）越接近零，这说明原子被「束缚」着——要把电子完全拉出来，需要给它 13.6 eV。",["玻尔假设原子的能量只能取分立值，对氢原子可以归纳为 E<sub>n<\/sub>=E<sub>1<\/sub>/n²。","把 n=1 代入得基态 −13.6 eV，n=2 得 −3.4 eV，可见能级越高、能量越接近零。","跃迁时能量守恒：两个能级之差要么变成一个光子的能量放出去（往下跳），要么由吸收的光子补上（往上跳），这就是谱线位置能反推能级的原因。"],["氢原子的基态能量为 −13.6 eV。求第二能级的能量；并求电子从第二能级跃迁到基态时放出光子的能量。",["n=2 时，E<sub>n<\/sub> = E<sub>1<\/sub>/2² = −13.6 ÷ 4 = −3.4 eV","ΔE = E<sub>高<\/sub> − E<sub>低<\/sub> = −3.4 − (−13.6) = 10.2 eV","这个能量对应一条紫外谱线，谱线位置由 ΔE 唯一确定"],"第二能级 −3.4 eV；跃迁放出光子能量 10.2 eV。"],[],[],["能级","玻尔模型","跃迁"],19,""],["qz-07","遏止电压与光电效应图像","遏止电压的大小用于测量光电子最大初动能，满足 e·U<sub>c<\/sub> = h·ν-W。",[["遏止电压大小","<mrow><msub><mi>U<\/mi><mi>c<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><mrow><mi>h<\/mi>&#x22C5;<mi>ν<\/mi><\/mrow><mo>−<\/mo><mi>W<\/mi><\/mrow><mi>e<\/mi><\/mfrac><\/mrow>","频率不低于截止频率，U<sub>c<\/sub>取反向遏止电压大小"],["光电图像斜率","<mrow><mi>k<\/mi><mo>=<\/mo><mfrac><mi>h<\/mi><mi>e<\/mi><\/mfrac><\/mrow>","以频率为横轴、遏止电压大小为纵轴，光电发射区的直线斜率"],["截止频率","<mrow><msub><mi>ν<\/mi><mn>0<\/mn><\/msub><mo>=<\/mo><mfrac><mi>W<\/mi><mi>h<\/mi><\/mfrac><\/mrow>","单光子光电效应，金属逸出功固定"],["图像外推纵截距","<mrow><mi>b<\/mi><mo>=<\/mo><mfrac><mrow><mo>−<\/mo><mi>W<\/mi><\/mrow><mi>e<\/mi><\/mfrac><\/mrow>","仅为直线的数学外推截距，不代表零频率可以发生光电效应"]],[["e","元电荷大小","C"],["h","普朗克常量","J·s"],["ν","入射光频率","Hz"],["W","金属逸出功","J"],["U<sub>c<\/sub>","遏止电压的非负大小","V"],["ν<sub>0<\/sub>","金属截止频率","Hz"],["k","遏止电压对频率的图像斜率","V·s"],["b","直线外推到零频率的纵截距","V"]],[["把全部光子能量都当成最大电子动能","电子必须先克服逸出功离开金属，全部光子能量并不都转化为初动能；漏减逸出功会把本例遏止电压加倍，量纲无法发现。"],["光强翻倍就认为遏止电压也翻倍","在单光子线性光电响应且频率固定时，每个光子能量不变，最大初动能不变；增加的是到达的光子数及可收集电子数，不是遏止电压。"]],"光电效应图像要先看横纵轴和电压符号约定。以遏止电压大小为纵轴时斜率为正，纵截距的外推值为负，但实际低于截止频率时没有光电子，不能赋予负的遏止电压。固定频率和金属、收集条件不变且在线性响应范围内，光强主要改变饱和电流，不改变最大初动能和遏止电压。",["用光子能量减逸出功求最大初动能，不把金属逸出功忽略。","遏止时反向电场做功大小等于最大初动能，除元电荷得到遏止电压大小。","把遏止电压整理成频率的一次函数，读出斜率、横截距和外推纵截距。","改变光强与改变频率分开讨论；只有频率决定单个光子能量，饱和电流还取决于收集与响应条件。"],["普朗克常量取6.63×10⁻³⁴ J·s、元电荷1.6×10⁻¹⁹ C，金属逸出功3.315×10⁻¹⁹ J，入射频率10¹⁵ Hz，求遏止电压和截止频率。",["光子能量6.63×10⁻¹⁹ J，最大电子动能为3.315×10⁻¹⁹ J，遏止电压2.071875 V。","逸出功除普朗克常量得截止频率5×10¹⁴ Hz；更强同频光不会改变该截止频率或遏止电压。"],"遏止电压约2.072 V，截止频率5×10¹⁴ Hz。"],["qz-02","pot-02"],["qz-03","qz-06"],["遏止电压","光电效应图像","截止频率"],19,""],["qz-08","康普顿效应","光子与初始静止的自由电子散射时，光子向电子传递能量与动量，散射后波长增加。",[["电子康普顿波长","<mrow><msub><mi>l<\/mi><mi>c<\/mi><\/msub><mo>=<\/mo><mfrac><mi>h<\/mi><mrow><mi>m<\/mi>&#x22C5;<mi>c<\/mi><\/mrow><\/mfrac><\/mrow>","电子质量为静质量，所用常量来自SI数值"],["归一化波长增量","<mrow><mi>z<\/mi><mo>=<\/mo><mrow><mn>1<\/mn><mo>−<\/mo><mrow><mi mathvariant=\"normal\">cos<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>θ<\/mi><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","初始静止自由电子散射，角度在零至π之间"],["散射光子波长","<mrow><msub><mi>l<\/mi><mi>p<\/mi><\/msub><mo>=<\/mo><mrow><mi>λ<\/mi><mo>+<\/mo><mrow><msub><mi>l<\/mi><mi>c<\/mi><\/msub><mrow><mo>(<\/mo><mn>1<\/mn><mo>−<\/mo><mrow><mi mathvariant=\"normal\">cos<\/mi><mo>⁡<\/mo><mo>(<\/mo><mi>θ<\/mi><mo>)<\/mo><\/mrow><mo>)<\/mo><\/mrow><\/mrow><\/mrow><\/mrow>","同一自由电子散射条件"],["反冲电子动能","<mrow><mi>K<\/mi><mo>=<\/mo><mrow><mrow><mi>h<\/mi>⋅<mi>c<\/mi><\/mrow><mrow><mo>(<\/mo><mfrac><mn>1<\/mn><mi>λ<\/mi><\/mfrac><mo>−<\/mo><mfrac><mn>1<\/mn><msub><mi>l<\/mi><mi>p<\/mi><\/msub><\/mfrac><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","能量守恒，电子初始静止且忽略束缚"]],[["h","普朗克常量","J·s"],["m","电子静质量","kg"],["c","真空光速","m/s"],["l<sub>c<\/sub>","电子康普顿波长","m"],["λ","入射光子波长","m"],["l<sub>p<\/sub>","散射光子波长","m"],["θ","光子散射角","rad"],["z","波长增量除康普顿波长","1"],["K","电子反冲动能","J"]],[["反向散射把归一化波长变化误当成一","反向散射的余弦为负一，正确增量是两倍康普顿波长；归一化后可以让数值防线真实识别系数错误，而非把皮米变化当零。"],["把电子反冲当成任意低速经典碰撞","高能光子的散射可使电子反冲达到相对论范围；低速动能近似不能无条件用于康普顿效应的完整推导，应检查能量尺度。"]],"本卡使用初始静止的自由电子或束缚可忽略的近似，不是任意物质中任意光的通用波长变化公式。散射角是入射光子与出射光子方向的夹角；正向散射不发生波长变化，反向变化最大。电子反冲必须用相对论能量与动量关系处理，不能仅凭普通低速动能公式推导全部结果。",["先限定初始静止自由电子，并明确定义光子散射角。","联立总能量守恒、两方向动量守恒及电子相对论能量关系，消去反冲电子量得到波长位移。","用零角和反向散射检查边界，再用光子能量差求反冲动能；微观长度和能量采用专用严格容差。"],["入射光子波长等于电子康普顿波长，与初始静止自由电子发生反向散射，求出射波长倍数和反冲动能占电子静能的比例。",["反向角为π，归一化波长增加二，出射波长为入射的三倍。","光子能量与波长成反比，出射能量剩初能量三分之一，电子得到静能的三分之二。"],"出射波长为三倍电子康普顿波长，电子反冲动能为静能的三分之二。"],["qz-03","qz-04"],["qz-06"],["康普顿","光子动量","散射"],19,""],["nuc-01","原子核的组成与同位素","原子核由质子和中子组成，二者统称核子。",[["质量数与核电荷数的关系","<mrow><mi>A<\/mi><mo>=<\/mo><mrow><mi>Z<\/mi><mo>+<\/mo><mi>N<\/mi><\/mrow><\/mrow>","对任何原子核都成立，与核是否稳定无关"],["核半径的立方根规律","<mrow><mi>R<\/mi><mo>=<\/mo><mrow><msub><mi>r<\/mi><mn>0<\/mn><\/msub>&#x22C5;<msup><mi>A<\/mi><mfrac><mn>1<\/mn><mn>3<\/mn><\/mfrac><\/msup><\/mrow><\/mrow>","把核近似看成实心球；r<sub>0<\/sub> 取 1.2×10⁻¹⁵ m 量级"]],[["Z","质子数（也叫核电荷数）","1"],["N","中子数","1"],["A","质量数，即核内核子总数","1"],["R","原子核半径","m"],["r<sub>0<\/sub>","核半径常量，约 1.2×10⁻¹⁵ m","m"]],[["把质量数当成质子数，写成 A=Z","质量数是质子数与中子数之和，不是质子数。碳12 按这个写法会得到 6，而正确值是 12。"],["认为质量数总等于质子数的两倍，写成 A=2Z","只有质子数恰好等于中子数时才碰巧成立（如碳12）。铀238 就不成立：2×92=184，而 A=238——多出来的 54 个全是中子。"],["把核半径写成与质量数成正比（R=r<sub>0<\/sub>·A）","量纲虽然对得上（都是长度），但函数关系错了：核半径只按质量数的<strong>立方根<\/strong>增长。碳12 会算出 1.44×10⁻¹⁴ m，而正确值约 2.75×10⁻¹⁵ m，差了五倍多。此条依赖极小量级（10⁻¹⁵）的比较，机器实测抓不稳，故列人工审核。"],["把同位素说成「质子数不同的原子」","同位素是质子数相同、中子数不同；质子数不同就是不同的元素了。这条只能靠人判。"]],"Z 相当于元素的「身份证」：Z 相同就是同一种元素，化学性质几乎只由 Z 与核外电子决定。N 不同则核的稳定性、放射性可能差别很大，这就是同位素。要注意 A 只表示核子个数，不是原子质量，也不是质子数。",["质量数的定义：A 等于核内质子数与中子数之和。","由 A=Z+N 移项得 N=A−Z，所以只要知道质量数和质子数，就能求出中子数。","实验测得核半径与质量数的立方根成正比（原子核近似实心球），故写成 R=r<sub>0<\/sub>·A<sup>1/3<\/sup>。"],["碳12 的原子核含 6 个质子。求它的质量数与中子数；若取 r<sub>0<\/sub>=1.2×10⁻¹⁵ m，估算它的核半径。",["A = Z + N = 6 + 6 = 12","N = A − Z = 12 − 6 = 6","R = r<sub>0<\/sub>·A<sup>1/3<\/sup> = 1.2×10⁻¹⁵ × 12<sup>1/3<\/sup> ≈ 2.75×10⁻¹⁵ m"],"质量数 12，中子数 6，核半径约 2.75×10⁻¹⁵ m。"],[],[],["原子核","同位素"],20,""],["nuc-02","放射性衰变（α、β、γ）","α 衰变放出 α 粒子（即氦核，含 2 个质子和 2 个中子），故质量数减 4、质子数减 2；β 衰变是核内一个中子变成质子并放出一个电子，故质量数不变、质子数加 1；γ 衰变只放出光子，质量数与质子数都不变。",[["n 次 α 衰变后的质量数","<mrow><msub><mi>A<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><mrow><msub><mi>A<\/mi><mn>1<\/mn><\/msub><mo>−<\/mo><mrow><mn>4<\/mn>&#x2062;<msub><mi>n<\/mi><mi>α<\/mi><\/msub><\/mrow><\/mrow><\/mrow>","只发生 α 衰变；每放出一个 α 粒子带走 4 个核子"],["n 次 α 衰变后的中子数","<mrow><msub><mi>N<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><mrow><msub><mi>N<\/mi><mn>1<\/mn><\/msub><mo>−<\/mo><mrow><mn>2<\/mn>&#x2062;<msub><mi>n<\/mi><mi>α<\/mi><\/msub><\/mrow><\/mrow><\/mrow>","只发生 α 衰变；α 粒子含 2 个中子"]],[["A1","衰变前的质量数","1"],["Z1","衰变前的质子数","1"],["N1","衰变前的中子数","1"],["n<sub>α<\/sub>","发生的 α 衰变次数","1"],["A2","衰变后的质量数","1"],["Z2","衰变后的质子数","1"],["N2","衰变后的中子数","1"]],[["一次 α 衰变只让质量数减 2","α 粒子含 2 个质子和 2 个中子，共 4 个核子，质量数应减 4。铀238 会算成 236，而正确是 234。"],["认为 γ 衰变会改变质量数与质子数","γ 射线是光子，没有质量数也没有电荷；放出 γ 只是把核从激发态降到低能态，质量数与质子数都不变。"]],"三种衰变要连在一起记：α 是「掉一个氦核」，β 是「中子换质子」，γ 是「把多余的能量以光子形式吐出来」。判断衰变次数一律用两条守恒：质量数守恒、电荷数守恒。α 衰变 n 次就减 4n 和 2n；β 衰变 n 次质量数不变、质子数加 n。",["α 粒子就是氦核，质量数 4、电荷数 2；放出一个就带走 4 个核子和 2 个单位的正电荷。","所以质量数每次减 4，质子数每次减 2，两者都是线性变化：减 4n 与减 2n。","检验守恒：衰变前后「质子数 + 中子数」应当都等于质量数，两个结果对上才说明次数没算错。"],["铀238 经过 3 次 α 衰变后，质量数、质子数与中子数各是多少？",["每次 α 衰变质量数减 4：A = 238 − 4×3 = 226","每次 α 衰变质子数减 2：Z = 92 − 2×3 = 86","每次 α 衰变中子数减 2：N = 146 − 2×3 = 140，验算 86+140=226 ✓"],"质量数 226，质子数 86，中子数 140。"],[],[],["放射性","衰变"],20,""],["nuc-03","半衰期","半衰期 T 是放射性元素有一半原子核发生衰变所需的时间。",[["半衰期个数与时间的关系","<mrow><msub><mi>n<\/mi><mi mathvariant=\"normal\">1/2<\/mi><\/msub><mo>=<\/mo><mfrac><mi>t<\/mi><msub><mi>T<\/mi><mi mathvariant=\"normal\">1/2<\/mi><\/msub><\/mfrac><\/mrow>","把实际时间换算成「过了几个半衰期」，便于按整数倍心算"],["剩余核数与时间的关系","<mrow><mi>N<\/mi><mo>=<\/mo><mrow><msub><mi>N<\/mi><mn>0<\/mn><\/msub>⋅<mrow><mi>e<\/mi><mo>⁡<\/mo><mo>(<\/mo><mrow><mrow><mo>(<\/mo><mo>−<\/mo><msub><mi>k<\/mi><mi mathvariant=\"normal\">衰变<\/mi><\/msub><mo>)<\/mo><\/mrow><mi>t<\/mi><\/mrow><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","写成指数衰减形式，便于用衰变常量做连续计算"]],[["N<sub>0<\/sub>","初始时刻未衰变的核数","1"],["N","经过 t 时间后未衰变的核数","1"],["T<sub>1/2<\/sub>","半衰期","s"],["t","经历的时间","s"],["n<sub>1/2<\/sub>","经历的半衰期个数","1"],["k<sub>衰变<\/sub>","衰变常量，表示单位时间内衰变的概率","s⁻¹"]],[["以为每过一个半衰期就少一半（线性递减），写成 N=N<sub>0<\/sub>·(1−n/2)","半衰期是「剩一半」而不是「减一半」。N<sub>0<\/sub>=800、n=3 时错误式给出 −400，明显荒谬；正确值是 100。"],["把衰变常量 k 与半衰期 T 当成正比关系（k∝T）","k=ln2/T，二者是<strong>反比<\/strong>：半衰期越长，单位时间内衰变的概率越小。本情境 k≈0.1386 s⁻¹，而 T=5 s，相差悬殊。"],["认为半衰期可以描述某一个原子核何时衰变","半衰期是大量核的统计规律；对单个核只能给出衰变概率，不能预言它具体何时衰变。"]],"半衰期是<strong>大量原子核<\/strong>的统计规律，不是单个核的「倒计时」。它只由核本身决定，和温度、压强、化学状态都无关——因为核外条件根本影响不到核内部。经过 n 个半衰期剩 (1/2)ⁿ，永远不为零，所以「衰变完」只是近似说法。",["按定义，每过一个半衰期剩余核数乘 1/2，所以经过 n 个半衰期剩 N<sub>0<\/sub>·(1/2)ⁿ。","把「过了多久」换算成「过了几个半衰期」用 n=t/T，于是 N=N<sub>0<\/sub>·(1/2)<sup>t/T<\/sup>。","把 (1/2)<sup>t/T<\/sup> 写成指数形式 exp(−k·t)，其中 k=ln2/T 叫衰变常量；两种写法完全等价，指数形式更方便做连续计算。"],["某放射性样品原有 800 个未衰变的核，半衰期为 5 s。经过 15 s 后还剩多少个？",["先换算半衰期个数：n = t/T = 15/5 = 3","再代入衰减式：N = N<sub>0<\/sub>×(1/2)ⁿ = 800×(1/2)³ = 100"],"还剩 100 个未衰变的核。"],[],[],["半衰期","统计规律"],20,""],["nuc-04","核反应方程与质能方程","核反应前后质量数守恒、电荷数守恒。",[["质量亏损","<mrow><mi>Δ<\/mi><mi>m<\/mi><mo>=<\/mo><mrow><msub><mi>m<\/mi><mi mathvariant=\"normal\">前<\/mi><\/msub><mo>−<\/mo><msub><mi>m<\/mi><mi mathvariant=\"normal\">后<\/mi><\/msub><\/mrow><\/mrow>","反应前总静质量减反应后总静质量，差值为正表示放能"],["质能方程","<mrow><mi>E<\/mi><mo>=<\/mo><mrow><mi>Δ<\/mi><mi>m<\/mi>&#x22C5;<msup><mi>c<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mrow>","Δm 取质量亏损（正数），算出来的是释放的能量"]],[["m<sub>前<\/sub>","反应前所有粒子静质量之和","kg"],["m<sub>后<\/sub>","反应后所有粒子静质量之和","kg"],["Δm","质量亏损","kg"],["c","真空中的光速，约 3.0×10⁸ m/s","m/s"],["E","反应释放的能量","J"]],[["质能方程里代反应前的总质量，写成 E=m<sub>前<\/sub>·c²","要代的是<strong>亏损的那部分质量<\/strong>，不是总质量。按错误式会得到 0.14207×(3.0×10⁸)²≈1.28×10¹⁶ J，而正确值是 1.62×10¹³ J——放大了近三个数量级。"],["认为核反应中静质量守恒，把质量亏损当成测量误差","核反应中守恒的是质量数与电荷数；静质量会按 E=Δm·c² 转化为能量放出去，质量亏损是真实的物理效应。"]],"这里最容易搞混的是「哪个质量守恒」：守恒的是质量数与电荷数，静质量本身并不守恒。用 E=Δm·c² 时必须代<strong>亏损的那部分质量<\/strong>，不能代反应前的总质量——后者会算出大好几个数量级的结果。正因为 c² 是 9×10¹⁶ 这样的大数，极小的质量亏损对应极大的能量，这是核能远超化学能的根本原因。",["先写核反应方程，用「质量数守恒、电荷数守恒」把两边的核配平。","把反应前后所有粒子的静质量分别求和，两者之差就是质量亏损 Δm。","由质能方程 E=Δm·c² 把亏损的质量换算成释放的能量；因为 c²≈9×10¹⁶，微小亏损对应巨大能量。"],["1 mol 铀核裂变时，反应前后粒子总静质量分别为 0.14207 kg 与 0.14189 kg。取 c=3.0×10⁸ m/s，求质量亏损与释放的总能量。",["Δm = m前 − m后 = 0.14207 − 0.14189 = 1.8×10⁻⁴ kg","E = Δm·c² = 1.8×10⁻⁴ × (3.0×10⁸)² = 1.8×10⁻⁴ × 9.0×10¹⁶ = 1.62×10¹³ J"],"质量亏损 1.8×10⁻⁴ kg，1 mol 铀核裂变释放能量约 1.62×10¹³ J。"],[],[],["质能方程","核反应"],20,""],["nuc-05","核裂变与核聚变（含结合能）","把核子结合成原子核时放出的能量叫结合能 E<sub>b<\/sub>；它除以质量数得到每个核子平均分摊的结合能，叫比结合能 e<sub>b<\/sub>=E<sub>b<\/sub>/A。",[["结合能","<mrow><msub><mi>E<\/mi><mi>b<\/mi><\/msub><mo>=<\/mo><mrow><mi>Δ<\/mi><mi>m<\/mi>&#x22C5;<msup><mi>c<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mrow>","Δm 取「单独核子总质量 − 原子核质量」，算出的就是结合能"],["比结合能","<mrow><msub><mi>e<\/mi><mi>b<\/mi><\/msub><mo>=<\/mo><mfrac><msub><mi>E<\/mi><mi>b<\/mi><\/msub><mi>A<\/mi><\/mfrac><\/mrow>","比较不同核的稳定性时必须用它，不能直接比结合能总量"]],[["A","质量数","1"],["Δm","质量亏损","kg"],["c","真空中的光速","m/s"],["E<sub>b<\/sub>","原子核的结合能","J"],["e<sub>b<\/sub>","按 1 mol 原子核折算后，每个核子平均分摊的结合能","J"]],[["把比结合能写成结合能乘以质量数","比结合能是「每个核子平均分摊到的结合能」，应当除以质量数而不是乘。按错误式会得到 2.709×10¹²×4≈1.08×10¹³ J，而正确是 6.7725×10¹¹ J。"],["认为质量数越大的核一定越稳定","稳定性要看比结合能，不是质量数。比结合能在铁附近最大，比铁更重或更轻的核都更不稳定——这正是重核裂变、轻核聚变都能放能的原因。"]],"判断一个核稳定不稳定，看的是<strong>比结合能<\/strong>而不是结合能总量。比结合能在铁附近最大（约 8.8 MeV 每核子），两端都更小；所以特别重的核（如铀）裂开、特别轻的核（如氘氚）合起来，产物都更靠近铁，比结合能升高，差额就以能量形式放出来。这就是「裂变与聚变都能发电」的同一句解释。",["核子单独存在时的总质量，比它们结合成原子核之后的质量大，差值就是质量亏损。","按质能方程，这份亏损对应的能量就是结合能 E<sub>b<\/sub>=Δm·c²。","把结合能除以质量数，得到每个核子平均分摊的能量，即比结合能 e<sub>b<\/sub>=E<sub>b<\/sub>/A；它是比较核稳定性的正确标准。"],["1 mol 氦4 核的结合能为 2.709×10¹² J，质量数为 4。求它的比结合能，并与铁56（约 8.514×10¹¹ J 每核子，按 1 mol 计）比较谁更稳定。",["比结合能 = 结合能 ÷ 质量数","e<sub>b<\/sub> = 2.709×10¹² ÷ 4 = 6.7725×10¹¹ J","铁56 的比结合能 8.514×10¹¹ J 更大，所以铁56 比氦4 更稳定"],"氦4 的比结合能约 6.7725×10¹¹ J（按 1 mol 计）；铁56 更大，因而更稳定。"],[],[],["结合能","裂变","聚变"],20,""],["exp-01","打点计时器、纸带与计数点","打点计时器在纸带上按近似相等时间间隔留下点迹。",[["相邻打点周期","<mrow><msub><mi>T<\/mi><mn>0<\/mn><\/msub><mo>=<\/mo><mfrac><mn>1<\/mn><mi>f<\/mi><\/mfrac><\/mrow>","打点计时器实际打点频率为 f；不是隔若干点的计数周期"],["计数周期","<mrow><msub><mi>T<\/mi><mi>c<\/mi><\/msub><mo>=<\/mo><mrow><mi>n<\/mi>&#x22C5;<msub><mi>T<\/mi><mn>0<\/mn><\/msub><\/mrow><\/mrow>","相邻计数点之间有 n 个打点时间间隔"]],[["T<sub>0<\/sub>","相邻原始点的时间间隔","s"],["f","实际打点频率","Hz"],["T<sub>c<\/sub>","计数点的时间间隔","s"],["n","两个计数点之间的原始时间间隔个数","1"]],[["把五个间隔误认为六个间隔","数到两端六个点不等于经历六个时间间隔；该错误量纲正确，却使本例计数周期从0.10 s错成0.12 s。"],["未核对型号便把所有计时器接到同一种电源","供电要求随型号变化，必须核对铭牌与接线说明；计时公式无法识别接线是否安全、纸带是否卡住。"]],"电磁打点计时器和电火花计时器的供电方式不同，应按仪器铭牌接线；常见电磁型使用低压交流，常见电火花型使用交流市电，不能混接。交流频率为50 Hz且每周期打一点时，原始点间隔为0.02 s；数点时必须数间隔，六个点只含五个间隔。",["按仪器说明确认型号、供电和打点频率，先通电使打点稳定，再释放或拉动纸带。","选清晰且运动状态合适的一段，标记计数点并写明每组包含几个原始时间间隔。","由每秒打点次数求相邻点间隔，再乘计数间隔个数；测位移时从点中心读数。"],["50 Hz计时器每隔五个原始时间间隔取一个计数点，求原始点周期和计数周期。",["每秒50个时间间隔，所以原始点周期为0.020 s。","两个计数点相隔五个原始时间间隔，周期为0.100 s。"],"原始点周期0.020 s；计数周期0.100 s。"],["kine-03","kine-04"],["exp-02"],["打点计时器","纸带","计数点","时间间隔"],21,""],["exp-02","纸带瞬时速度、逐差法与运动检验","在匀变速直线运动中，一段时间的平均速度等于中间时刻的瞬时速度。",[["中间计数点速度","<mrow><msub><mi>v<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>x<\/mi><mn>2<\/mn><\/msub><mo>+<\/mo><msub><mi>x<\/mi><mn>3<\/mn><\/msub><\/mrow><mrow><mn>2<\/mn>&#x2062;<msub><mi>T<\/mi><mi>c<\/mi><\/msub><\/mrow><\/mfrac><\/mrow>","匀变速直线运动或时间足够短，用该点前后两段位移的平均速度"],["四段逐差加速度","<mrow><mi>a<\/mi><mo>=<\/mo><mfrac><mrow><mrow><msub><mi>x<\/mi><mn>3<\/mn><\/msub><mo>+<\/mo><msub><mi>x<\/mi><mn>4<\/mn><\/msub><\/mrow><mo>−<\/mo><mrow><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>x<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mrow><mrow><mn>4<\/mn>&#x2062;<msup><msub><mi>T<\/mi><mi>c<\/mi><\/msub><mn>2<\/mn><\/msup><\/mrow><\/mfrac><\/mrow>","四个连续等时位移；运动应近似匀变速"],["相邻位移差","<mrow><mi mathvariant=\"normal\">dx<\/mi><mo>=<\/mo><mrow><mi>a<\/mi>&#x22C5;<msup><msub><mi>T<\/mi><mi>c<\/mi><\/msub><mn>2<\/mn><\/msup><\/mrow><\/mrow>","相邻等时段内的位移差，带符号"]],[["v<sub>2<\/sub>","第二计数点的瞬时速度","m/s"],["x<sub>1<\/sub>","第一等时段位移","m"],["x<sub>2<\/sub>","第二等时段位移","m"],["x<sub>3<\/sub>","第三等时段位移","m"],["x<sub>4<\/sub>","第四等时段位移","m"],["T<sub>c<\/sub>","计数周期","s"],["a","加速度","m/s²"],["dx","相邻等时位移差","m"]],[["逐差时把分母写成两倍周期平方","两组平均速度的时间中心相隔两个计数周期；漏掉这个间隔因子会使加速度加倍，量纲检查无法发现。"],["不检验运动性质就把所有纸带都按匀变速处理","有阻力变化、拉动不均匀或点迹模糊时，位移差未必恒定，应先检查数据而不是用公式强行拟合。"]],"先检查相邻位移之差是否在测量误差范围内近似相等，再使用匀变速公式。逐差法利用较长位移减小相对读数误差，但它不会自动消除计时频率错误或纸带阻力。计数周期必须采用计数点间隔，不能一律填原始打点周期；非匀变速时中心平均速度只能作为近似。",["依次测四段连续等时位移，保留原始记录和长度单位。","第二计数点前后两段总位移除以两个计数周期，得到该点速度。","将后两段之和减前两段之和；两组段中心时刻相差两个周期，因此分母是四倍周期平方。","再比较相邻位移差和速度随时间的直线趋势，检查模型是否合理。"],["纸带四段位移依次为3、5、7、9 cm，计数周期0.10 s，求第二点速度和加速度。",["长度换成米；第二点速度为(0.05+0.07)/0.20=0.60 m/s。","逐差分子为0.07+0.09-0.03-0.05=0.08 m，除以0.04 s²得2.0 m/s²。"],"第二点速度0.60 m/s，加速度2.0 m/s²。"],["exp-01","kine-02"],["exp-10"],["逐差法","纸带速度","匀变速实验"],21,""],["exp-03","光电门、遮光条与速度测量","光电门记录遮光条经过光束的持续时间。",[["遮光平均速度","<mrow><msub><mi>v<\/mi><mn>1<\/mn><\/msub><mo>=<\/mo><mfrac><mi>d<\/mi><msub><mi>t<\/mi><mn>1<\/mn><\/msub><\/mfrac><\/mrow>","遮光条有效宽度沿运动方向；遮光期间平均速度"],["第二门平均速度","<mrow><msub><mi>v<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><mfrac><mi>d<\/mi><msub><mi>t<\/mi><mn>2<\/mn><\/msub><\/mfrac><\/mrow>","同一遮光条通过第二门"],["两门加速度估计","<mrow><mi>a<\/mi><mo>=<\/mo><mfrac><mrow><msup><msub><mi>v<\/mi><mn>2<\/mn><\/msub><mn>2<\/mn><\/msup><mo>−<\/mo><msup><msub><mi>v<\/mi><mn>1<\/mn><\/msub><mn>2<\/mn><\/msup><\/mrow><mrow><mn>2<\/mn>&#x2062;<mi>x<\/mi><\/mrow><\/mfrac><\/mrow>","两门速度可近似瞬时速度，门距为 x，运动匀变速"]],[["d","遮光条有效宽度","m"],["t<sub>1<\/sub>","第一门遮光时间","s"],["t<sub>2<\/sub>","第二门遮光时间","s"],["v<sub>1<\/sub>","第一门近似瞬时速度","m/s"],["v<sub>2<\/sub>","第二门近似瞬时速度","m/s"],["x","门间距离","m"],["dt","两门速度对应时刻之差","s"],["a","两门间加速度","m/s²"]],[["把条宽误乘二再计算速度","一次遮光对应条宽而非两倍条宽；错误式仍有速度量纲，本例错误值为2.0 m/s而正确值为1.0 m/s。"],["把两个遮光持续时间之差当作两门运动时间","两次遮光持续时间不是物体从第一门到第二门的通行时间，使用速度变化率时需记录正确的时刻差。"]],"测量前应检查条宽、条面与运动方向、门的计时模式和两门间距。条宽越小，瞬时近似通常越好，但计时相对误差可能变大。一个光电门的一次遮光只能给出局部平均速度，不能据此恢复任意完整轨迹；两门求加速度还需匀变速和门处速度近似成立。",["用合适仪器测条宽，调节光束，使遮光边缘与运动方向一致。","逐次记录遮光时间并计算局部平均速度；必要时重复测量。","匀变速情况下用两门速度平方差与门距求加速度，也可用两个速度对应时刻之差独立核对。"],["条宽1.0 cm，两门遮光时间10 ms和5 ms；门距0.50 m，估计两门速度及加速度。",["两个局部速度为0.01/0.010=1.0 m/s和0.01/0.005=2.0 m/s。","匀变速近似下，加速度为(4-1)/(2×0.50)=3.0 m/s²；独立通行时间1/3 s也给出同值。"],"两门速度1.0、2.0 m/s；加速度约3.0 m/s²。"],["exp-02","kine-01","kine-05"],["exp-04"],["光电门","遮光条","瞬时速度测量"],21,""],["exp-04","气垫导轨、碰撞与动量验证","气垫导轨通过气膜减小滑块与导轨的接触摩擦。",[["碰前总动量","<mrow><msub><mi>p<\/mi><mi>i<\/mi><\/msub><mo>=<\/mo><mrow><mrow><msub><mi>m<\/mi><mn>1<\/mn><\/msub>&#x22C5;<msub><mi>v<\/mi><mn>1<\/mn><\/msub><\/mrow><mo>+<\/mo><mrow><msub><mi>m<\/mi><mn>2<\/mn><\/msub>&#x22C5;<msub><mi>v<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mrow><\/mrow>","选定正方向；速度使用带符号数值"],["碰后总动量","<mrow><msub><mi>p<\/mi><mi>p<\/mi><\/msub><mo>=<\/mo><mrow><mrow><msub><mi>m<\/mi><mn>1<\/mn><\/msub>&#x22C5;<msubsup><mi>v<\/mi><mn>1<\/mn><mo>′<\/mo><\/msubsup><\/mrow><mo>+<\/mo><mrow><msub><mi>m<\/mi><mn>2<\/mn><\/msub>&#x22C5;<msubsup><mi>v<\/mi><mn>2<\/mn><mo>′<\/mo><\/msubsup><\/mrow><\/mrow><\/mrow>","与碰前采用同一正方向和相同系统"]],[["m1","第一滑块质量","kg"],["m2","第二滑块质量","kg"],["v<sub>1<\/sub>","第一滑块碰前有向速度","m/s"],["v<sub>2<\/sub>","第二滑块碰前有向速度","m/s"],["v<sub>1<\/sub>′","第一滑块碰后有向速度","m/s"],["v<sub>2<\/sub>′","第二滑块碰后有向速度","m/s"],["p<sub>i<\/sub>","碰前总动量","kg·m/s"],["p<sub>p<\/sub>","碰后总动量","kg·m/s"]],[["把反弹速度按正值相加","动量是矢量，反弹方向与所选正方向相反；把负速度改成其大小会算出0.28而不是0.20 kg·m/s。"],["认为气垫导轨上任何过程都绝对没有外力","导轨倾斜、气流、碰撞器固定部件和残余摩擦都可能造成外冲量，必须通过调平和数据差值检验。"]],"先通气并调平，检查单滑块运动是否近似匀速，再用光电门测碰前后速度，选同一个水平正方向。磁性或弹性碰撞器影响动能是否守恒，粘连碰撞仍可守恒动量；气垫不等于没有外力。质量乘位移的比例只能用于初始总动量为零且比较同一时间内的位移等特殊情形，不能替代一般碰撞公式。",["调平、通气、核对质量和遮光条宽度；用空载滑行排查明显外力。","记录碰前后各滑块速度，反向运动的速度填写负值。","分别求总动量，比较差值与测量不确定度；必要时做粘连和非粘连碰撞。","斜槽平抛验证法还必须保证相同离桌高度、入射球质量条件和碰撞位置，射程才可替代水平速度。"],["0.20 kg滑块以1.0 m/s碰0.30 kg静止滑块，碰后速度为−0.20和0.80 m/s，验证总动量。",["碰前总动量为0.20 kg·m/s。","碰后总动量为−0.04+0.24=0.20 kg·m/s，与碰前相同。"],"此组数据碰前后总动量均为0.20 kg·m/s。"],["mom-03","mom-04"],["mom-06"],["气垫导轨","动量守恒实验","碰撞","有向速度"],21,""],["exp-05","游标卡尺的读数与零误差","游标卡尺利用主尺与游标尺每格长度的微小差异读出长度，可测外径、内径与深度。",[["游标分度值","<mrow><mi>Δ<\/mi><mo>=<\/mo><mfrac><mi>b<\/mi><mi>N<\/mi><\/mfrac><\/mrow>","游标 N 格总长等于主尺 N−1 格；主尺分度 b"],["游标读数与零点修正","<mrow><mi>L<\/mi><mo>=<\/mo><mrow><mrow><msub><mi>L<\/mi><mi mathvariant=\"normal\">主尺<\/mi><\/msub><mo>+<\/mo><mrow><mi>n<\/mi>&#x22C5;<mi>Δ<\/mi><\/mrow><\/mrow><mo>−<\/mo><mi>z<\/mi><\/mrow><\/mrow>","主尺读数、对齐游标序号和有符号零点示数"]],[["δ","游标分度值","m"],["b","主尺最小分度","m"],["N","游标分格数","1"],["L<sub>主尺<\/sub>","游标零线左侧的主尺整格读数","m"],["n","对齐游标刻线序号","1"],["z","有符号零点示数","m"],["L","零点修正后的长度","m"]],[["把对齐序号多读一格","序号从游标零线开始计算；错读一格会偏移一个分度值，本例从12.32 mm变成12.34 mm。"],["给游标读数任意追加一个估读数字","标准游标读数按对齐格和分度值形成，不能把刻度尺的估读规则直接套到游标；报告位数需与仪器规格一致。"]],"常见10、20、50分游标的分度值分别为0.1、0.05、0.02 mm，读到仪器规定的分度，不再随意估出一位。主尺读数取游标零刻线左侧已越过的刻度；游标读数取对齐刻线序号乘分度值。闭合时示数为正，测量值应减去它；负零误差则减去负数。测不同位置可发现物体形状和夹持影响。",["清洁测量面，轻合量爪检查零点，确认游标分格数。","用正确量爪或深度杆测量，避免倾斜和过大夹紧力。","先读主尺，再读游标对齐格，最后减有符号零点示数。"],["50分游标主尺分度1 mm，主尺读数12 mm，第16格对齐，零误差为零，求长度。",["分度值为1/50=0.02 mm。","长度为12+16×0.02=12.32 mm。"],"长度为12.32 mm。"],["exp-07"],["exp-06","exp-15"],["游标卡尺","长度测量","零误差"],21,""],["exp-06","螺旋测微器、半毫米线与估读","螺旋测微器把旋转角度转化为测杆沿轴线的微小位移。",[["测微器分度值","<mrow><mi>Δ<\/mi><mo>=<\/mo><mfrac><mi>h<\/mi><mi>N<\/mi><\/mfrac><\/mrow>","螺距为 h，每周有 N 个旋转刻度"],["螺旋测微器读数","<mrow><mi>L<\/mi><mo>=<\/mo><mrow><mrow><msub><mi>L<\/mi><mi>s<\/mi><\/msub><mo>+<\/mo><mrow><mi>n<\/mi>&#x22C5;<mi>Δ<\/mi><\/mrow><\/mrow><mo>−<\/mo><mi>z<\/mi><\/mrow><\/mrow>","固定套筒包含已露出的半毫米刻度；n 可含估读位"]],[["h","螺距","m"],["N","一周旋转刻度格数","1"],["δ","分度值","m"],["L<sub>s<\/su
