,"相对滑程","m"]],[["把相对滑程当成相对初速乘全部时间","相对速度从3 m/s匀减到零，应使用平均值1.5 m/s；错误式漏掉二分之一，使所需板长加倍。"],["有地面摩擦仍使用系统动量守恒","地面摩擦对块板系统有外冲量，必须用总动量变化等于外冲量或分别用牛顿定律。"]],"块板摩擦等大反向，但作用于不同物体，机械能损失按相对滑程计算。地面摩擦是系统外力，方向反于板对地运动。共速后检查静摩擦能否维持共同减速；板停下或相对运动反转时重新分段。",["分别画受力图，地面对板摩擦为外力，块板摩擦为内部相互作用。","物块减速、木板按合力变化，求相对加速度和相对速度为零时刻。","积分相对速度或用其平均值求相对滑程，与板上可用长度比较。","共速后系统加速度为负地面阻力除以总质量，检验所需静摩擦是否超过上限。"],["1 kg滑块初速4 m/s，3 kg木板初速1 m/s；块板摩擦2 N，地面阻力1 N，求共速前相对滑程。",["滑块加速度−2 m/s²，板加速度1/3 m/s²，9/7 s后共速。","相对速度平均值为1.5 m/s，相对滑程27/14≈1.93 m；共同速度10/7 m/s。"],"共速前相对滑程约1.93 m，板上可用长度至少达到该值。"],["dyn-05","dyn-06"],["mdl-36"],["滑块木板","地面摩擦","相对位移"],22,""],["mdl-04","机车启动：匀加速、恒功率与速度上限","机车启动模型由牵引方式分段：恒加速度阶段牵引力由牛顿定律确定，所需功率随速度上升；达到功率上限后转为恒功率，牵引力随速度增大而减小。",[["恒功率牵引加速度","<mrow><mi>a<\/mi><mo>=<\/mo><mfrac><mrow><mfrac><mi>P<\/mi><mi>v<\/mi><\/mfrac><mo>−<\/mo><msub><mi>f<\/mi><mi>r<\/mi><\/msub><\/mrow><mi>m<\/mi><\/mfrac><\/mrow>","速度为正，牵引功率恒定，阻力近似恒定"],["最大稳定速度","<mrow><msub><mi>v<\/mi><mi mathvariant=\"normal\">max<\/mi><\/msub><mo>=<\/mo><mfrac><mi>P<\/mi><msub><mi>f<\/mi><mi>r<\/mi><\/msub><\/mfrac><\/mrow>","正恒定阻力，无限长路段，功率恒定"],["匀加速阶段转折速度","<mrow><msub><mi>v<\/mi><mi>c<\/mi><\/msub><mo>=<\/mo><mfrac><mi>P<\/mi><mrow><mrow><mi>m<\/mi>&#x22C5;<msub><mi>a<\/mi><mi>c<\/mi><\/msub><\/mrow><mo>+<\/mo><msub><mi>f<\/mi><mi>r<\/mi><\/msub><\/mrow><\/mfrac><\/mrow>","先按恒加速度启动，达到额定功率后改恒功率"]],[["P","牵引机械功率上限","W"],["v","恒功率阶段瞬时速度","m/s"],["f<sub>r<\/sub>","恒定阻力","N"],["m","机车质量","kg"],["a","恒功率瞬时加速度","m/s²"],["v<sub>max<\/sub>","稳定速度","m/s"],["a<sub>c<\/sub>","匀加速阶段加速度","m/s²"],["v<sub>c<\/sub>","额定功率转折速度","m/s"]],[["把稳定速度的阻力因子多乘二","稳定时牵引力恰好平衡阻力，功率全部用于克服该阻力；多乘二使本例稳定速度从30错成15 m/s。"],["从零速直接使用牵引力等于功率除速度","零速表达无定义，实际牵引力有限；需要给出启动限制或先处理恒牵引力、恒加速度阶段。"]],"恒功率阶段牵引力随速度增大而减小，接近阻力时加速度趋零。零速处恒功率式发散，应先按牵引力限制启动，再接入恒功率阶段。输入功率须计效率后才能作为牵引机械功率。",["明确给的是机械输出功率还是输入功率，必要时先计效率。","恒加速度阶段牵引力为质量乘加速度加阻力，据此求所需功率。","额定功率处速度达到转折值，此后牵引力为功率除速度，使用变化加速度。","令合力趋于零，得到稳定速度；不能用匀变速公式计算整个恒功率阶段。"],["4000 kg机车阻力2000 N，牵引功率60 kW，先以1 m/s²启动，求转折速度及最大速度。",["恒加速度阶段牵引力6000 N，到10 m/s时功率达到60 kW。","改恒功率后加速度减小；稳定速度60000/2000=30 m/s。"],"转折速度10 m/s，稳定速度30 m/s。"],["ene-02","dyn-05"],["ene-03"],["恒功率","机车启动","功率上限"],22,""],["mdl-05","追及与相遇：最近距离和安全临界","追及问题通过两物体位置相等判断相遇，通过相对速度为零判断间距极值。",[["相对速度为零时刻","<mrow><msub><mi>t<\/mi><mi>c<\/mi><\/msub><mo>=<\/mo><mfrac><msub><mi>v<\/mi><mi mathvariant=\"normal\">相对<\/mi><\/msub><msub><mi>a<\/mi><mi>r<\/mi><\/msub><\/mfrac><\/mrow>","后车比前车快，后车相对减速度为正，前车匀速"],["最大追近距离","<mrow><msub><mi>d<\/mi><mi>c<\/mi><\/msub><mo>=<\/mo><mfrac><msup><msub><mi>v<\/mi><mi mathvariant=\"normal\">相对<\/mi><\/msub><mn>2<\/mn><\/msup><mrow><mn>2<\/mn>&#x2062;<msub><mi>a<\/mi><mi>r<\/mi><\/msub><\/mrow><\/mfrac><\/mrow>","相对速度由正值减至零；超过此时刻距离重新增大"]],[["v<sub>相对<\/sub>","后车相对前车初速度","m/s"],["a<sub>r<\/sub>","相对减速度大小","m/s²"],["t<sub>c<\/sub>","间距达到最小时刻","s"],["d<sub>c<\/sub>","最大追近距离","m"]],[["漏掉二分之一使追近距离加倍","相对速度匀减至零，平均相对速度是初值的一半；本例临界距离4 m，漏系数后变成8 m。"],["把两车速度相等误判为已经相遇","速度相等只说明间距变化率为零，位置是否相同必须另比较；最近时刻可以仍有明显间距。"]],"后车初速较快且持续减速时，先追近后远离。初始间距与最大追近距离相比，大于则不接触、等于则共速时恰好接触、小于则提前碰撞。真实安全距离还须计反应时间、车长与制动条件，不能直接套质点临界。",["统一位置原点与时间起点，写两车位置差。","由相对速度为零求最接近时刻，并检查该时刻仍在给定运动阶段。","求这一阶段追近距离，与初始间距比较；若更早接触，后续原运动模型停止适用。"],["后车比前车快4 m/s，相对减速度2 m/s²，初始间距6 m，求最小间距。",["2 s后相对速度减至零，最大追近距离4 m。","初始间距6 m减4 m，最小间距为2 m，理想模型下不接触。"],"2 s后最接近，最小间距2 m。"],["kine-03","kine-04"],["kine-06"],["追及","相遇","最近距离","相对运动"],22,""],["mdl-06","绳杆关联：速度投影、几何约束与能量","绳或杆连接的物体，其速度满足连接长度保持不变的几何条件。",[["不可伸长绳速度约束","<mrow><msub><mi>v<\/mi><mi>A<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>v<\/mi><mi>B<\/mi><\/msub>&#x22C5;<mrow><mi mathvariant=\"normal\">cos<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>β<\/mi><mo>)<\/mo><\/mrow><\/mrow><mrow><mi mathvariant=\"normal\">cos<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>α<\/mi><mo>)<\/mo><\/mrow><\/mfrac><\/mrow>","同一条绳两端，速度取使一端绳段变长另一端变短的方向；角与相应绳段一致"],["水平绳段受力加速度","<mrow><msub><mi>a<\/mi><mi>A<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>T<\/mi><mi>r<\/mi><\/msub><mo>−<\/mo><msub><mi>f<\/mi><mi>r<\/mi><\/msub><\/mrow><mi>m<\/mi><\/mfrac><\/mrow>","只用于本端水平受力，张力沿水平，速度约束本身不提供动力学"]],[["v<sub>A<\/sub>","绳端甲沿给定运动方向的速度","m/s"],["v<sub>B<\/sub>","绳端乙沿给定运动方向的速度","m/s"],["α","甲速度与甲绳段夹角","rad"],["β","乙速度与乙绳段夹角","rad"],["T<sub>r<\/sub>","甲端水平绳张力","N"],["f<sub>r<\/sub>","甲端阻力","N"],["m","甲端质量","kg"],["a<sub>A<\/sub>","甲端加速度","m/s²"],["W<sub>合<\/sub>","另一个恒力短段的总功","J"],["v<sub>初<\/sub>","恒力短段初速","m/s"],["v′","恒力短段末速","m/s"],["dt","恒力短段时间","s"]],[["忘记乙端速度投影","乙端速度与绳方向不平行时，全部速度不等于绳长变化率；本例会由1.6错为2.0 m/s。"],["把所有关联运动的速度式直接改写成同形式加速度式","连接方向改变会产生额外几何项，必须从长度条件重新处理；不能忽略角度变化。"]],"本例是过固定小滑轮的两端绳段，一端伸长量与另一端缩短量相等。直杆则要求两端相对速度沿杆分量为零，杆可以同时平动和转动。角度随时间变化时，加速度约束必须包含角度变化项，不能把速度式直接去掉速度换成加速度。能量法仍要检查重力、外力、摩擦和运动支点是否做功。",["标出连接长度及各端位移方向，用绳长不变或杆长不变写几何关系。","把位移约束在短时间内除以时间，得到速度的连接方向投影关系。","分别列各物体受力；加速度约束由变化几何重新求出，能量守恒另验做功条件。"],["绳端甲水平且与绳同向，乙端速度2 m/s且与绳方向余弦为0.8，求甲端速度。",["绳长不变要求两端绳段的伸缩速率相等。","甲端投影等于自身速度，乙端投影2×0.8=1.6 m/s。"],"甲端速度为1.6 m/s。"],["dyn-05","ene-06"],["mdl-28"],["绳杆关联","速度分解","约束"],22,""],["mdl-07","人船模型：质心与对岸、相对位移","人船模型在水平方向忽略外力、人船初始静止的条件下，系统总动量为零且质心水平位置不变。",[["船的反向位移大小","<mrow><msub><mi>x<\/mi><mi>b<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><mi>m<\/mi>&#x22C5;<mi>L<\/mi><\/mrow><mrow><mi>m<\/mi><mo>+<\/mo><mi>M<\/mi><\/mrow><\/mfrac><\/mrow>","人船初始静止，无水平外力；L 是人相对船走过的距离"],["人的对岸位移大小","<mrow><msub><mi>x<\/mi><mi>p<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><mi>M<\/mi>&#x22C5;<mi>L<\/mi><\/mrow><mrow><mi>m<\/mi><mo>+<\/mo><mi>M<\/mi><\/mrow><\/mfrac><\/mrow>","与船反向位移方向相反"]],[["m","人的质量","kg"],["M","船的质量","kg"],["L","人相对船的位移大小","m"],["x<sub>b<\/sub>","船相对岸反向位移大小","m"],["x<sub>p<\/sub>","人相对岸位移大小","m"]],[["把相对行走距离直接当成人的对岸位移","相对位移包含船的反向移动；本例错误船位移1.25 m，正确1 m，因此不能只除以船质量。"],["有岸边拉绳仍认为系统质心不动","固定在岸的绳会提供水平外力，质心位置不变的前提被破坏，需要把该外力纳入分析。"]],"质量乘位移关系使用同一时段的对岸有向位移；人相对船的位移不是对岸位移。人船反向，船越轻后退越远。存在水阻、固定绳或非零初始总动量时，应计外力或质心运动，不能再令质心位置不变。",["取岸为参考系，以人前进方向为正，写总动量为零。","同一时间段累积位移，得到人的质量乘位移与船的反向质量位移相抵。","再用人船相对位移等于两者对岸位移大小之和，联立求出各自位移。"],["20 kg的人在80 kg静止船上相对船走5 m，忽略水阻，求人船对岸位移。",["设船反向1 m、人向前4 m，两者相对位移为5 m。","质量位移相抵：20×4=80×1=80 kg·m，满足质心不动。"],"船反向1 m，人向前4 m。"],["mom-03"],["mdl-08"],["人船","质心","相对位移","动量"],22,""],["mdl-08","子弹—木块：动量、相对穿入与能量损失","子弹射入可自由运动的木块并留在其中时，碰撞阶段可用水平动量守恒求共同速度，但过程不是弹性碰撞，初末动能差转化为内能等其他能量。",[["穿入并留在木块中的共同速度","<mrow><mi>v<\/mi><mo>=<\/mo><mfrac><mrow><mi>m<\/mi>&#x22C5;<msub><mi>v<\/mi><mn>0<\/mn><\/msub><\/mrow><mrow><mi>m<\/mi><mo>+<\/mo><mi>M<\/mi><\/mrow><\/mfrac><\/mrow>","子弹最终留在自由木块内；碰撞期间水平外冲量忽略"],["机械能转为内能","<mrow><mi>Q<\/mi><mo>=<\/mo><mrow><mrow><mrow><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac>⁢<mi>m<\/mi><\/mrow>⋅<msup><msub><mi>v<\/mi><mn>0<\/mn><\/msub><mn>2<\/mn><\/msup><\/mrow><mo>−<\/mo><mrow><mrow><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac>⁢<mrow><mo>(<\/mo><mi>m<\/mi><mo>+<\/mo><mi>M<\/mi><mo>)<\/mo><\/mrow><\/mrow><msup><mi>v<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mrow><\/mrow>","无其他能量输入，忽略声音等单独输出或计入损耗"],["恒阻力近似穿入深度","<mrow><mi>d<\/mi><mo>=<\/mo><mfrac><mi>Q<\/mi><msub><mi>f<\/mi><mi>r<\/mi><\/msub><\/mfrac><\/mrow>","子弹与块间阻力近似恒定；d 是相对位移"]],[["m","子弹质量","kg"],["M","木块质量","kg"],["v<sub>0<\/sub>","子弹入射速度","m/s"],["v","最终共同速度","m/s"],["Q","机械能损失","J"],["f<sub>r<\/sub>","近似恒定穿入阻力","N"],["d","子弹相对木块穿入深度","m"]],[["把碰撞损失机械能算成初末动能之和","损失是初动能减末动能，末动能仍保存在整体平动中；加号会得到50.5 J而不是49.5 J。"],["用子弹对地位移代替穿入深度","木块在碰撞过程中移动，摩擦损耗取两者相对位移；固定木块是另一种边界条件。"]],"木块也会运动，子弹对地位移不等于穿入深度。恒阻力下，机械能损失等于阻力乘相对穿入深度。木块固定、子弹穿出或外冲量明显时须重选系统与末态，不能套自由木块留弹的共速公式。",["选子弹和木块为系统，确认木块自由运动并忽略碰撞期间外冲量。","用动量守恒求最终共同速度，动能不能同时守恒。","计算初末动能差，再由恒阻力乘相对深度求穿入距离。"],["10 g子弹以100 m/s射入0.99 kg自由木块并留下，恒阻力500 N，求共同速度和穿入深度。",["动量1 kg·m/s除总质量1 kg，得共同速度1 m/s。","初动能50 J、末动能0.5 J，损失49.5 J，穿入深度49.5/500=0.099 m。"],"共同速度1 m/s；相对穿入深度9.9 cm。"],["mom-03","ene-07"],["mom-06"],["子弹木块","完全非弹性碰撞","穿入深度"],22,""],["mdl-09","竖直圆周运动：轻绳顶部与临界条件","物体在竖直圆轨道运动时，重力和约束力共同提供径向向心力。",[["竖直圆周最高点绳张力","<mrow><msub><mi>T<\/mi><mi mathvariant=\"normal\">顶<\/mi><\/msub><mo>=<\/mo><mrow><mi>m<\/mi><mrow><mo>(<\/mo><mfrac><msup><msub><mi>v<\/mi><mi mathvariant=\"normal\">顶<\/mi><\/msub><mn>2<\/mn><\/msup><mi>r<\/mi><\/mfrac><mo>−<\/mo><mi>g<\/mi><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","绳只能拉；要维持整圈绳绷紧，顶部张力不得小于零"],["最低点绳张力","<mrow><msub><mi>T<\/mi><mi mathvariant=\"normal\">底<\/mi><\/msub><mo>=<\/mo><mrow><mi>m<\/mi><mrow><mo>(<\/mo><mfrac><msup><msub><mi>v<\/mi><mi mathvariant=\"normal\">底<\/mi><\/msub><mn>2<\/mn><\/msup><mi>r<\/mi><\/mfrac><mo>+<\/mo><mi>g<\/mi><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","最低点速度为水平切向；向心方向竖直向上"],["顶部临界速度","<mrow><msub><mi>v<\/mi><mi mathvariant=\"normal\">min<\/mi><\/msub><mo>=<\/mo><msqrt><mrow><mi>g<\/mi>&#x22C5;<mi>r<\/mi><\/mrow><\/msqrt><\/mrow>","轻绳临界顶部张力取零；初速按能量满足到达顶部"]],[["T<sub>顶<\/sub>","最高点绳张力","N"],["T<sub>底<\/sub>","最低点绳张力","N"],["m","物体质量","kg"],["v<sub>顶<\/sub>","最高点速度","m/s"],["v<sub>底<\/sub>","最低点速度","m/s"],["r","圆周半径","m"],["g","重力加速度","m/s²"],["v<sub>min<\/sub>","保持轻绳绷紧的顶部临界速度","m/s"]],[["顶部临界速度漏掉根号","速度平方才等于gr，速度应为其平方根；该错式量纲已不符，但还应通过临界受力复核。"],["把负张力当成绳能推物体","绳松弛后物体不再沿原圆轨道运动，应切换到抛体阶段或按杆模型重算。"]],"顶部算得负张力表示绳松弛、圆轨道失效。从底部出发时，须用底顶高度差（直径）及机械能关系换算顶部速度，不能直接把顶部临界速度当底部速度。刚性杆可拉可推，临界条件须另判。",["画最高点和最低点的径向受力图，分别取指向圆心为正。","由径向第二定律得到绳力，并将负值解释为轻绳约束失效。","若由底部出发，另用机械能联系两点速度，再比较临界条件。"],["1 kg小球在半径1 m的轻绳圆周上最高点速率为√10 m/s，重力加速度10 m/s²，求最高点和最低点绳力。",["最高点绳力为1×(10−10)=0 N，恰好为绷紧临界。","最低点速率平方增加4gr=40，得50；张力为1×(50+10)=60 N。"],"最高点绳力0 N；最低点绳力60 N。"],["cir-04","ene-06"],["mdl-10"],["竖直圆周","轻绳","临界速度","张力"],22,""],["mdl-10","细杆、轻绳与单侧轨道的约束区别","圆周运动的动力学等式取决于约束能够施加的力。",[["杆对顶部物体的有向约束力","<mrow><msub><mi>F<\/mi><mi mathvariant=\"normal\">顶<\/mi><\/msub><mo>=<\/mo><mrow><mi>m<\/mi><mrow><mo>(<\/mo><mfrac><msup><msub><mi>v<\/mi><mi mathvariant=\"normal\">顶<\/mi><\/msub><mn>2<\/mn><\/msup><mi>r<\/mi><\/mfrac><mo>−<\/mo><mi>g<\/mi><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","约定指向圆心为正；负号代表杆沿反向推，杆允许双向受力"],["顶部最低点速度关系","<mrow><msup><msub><mi>v<\/mi><mi mathvariant=\"normal\">底<\/mi><\/msub><mn>2<\/mn><\/msup><mo>=<\/mo><mrow><msup><msub><mi>v<\/mi><mi mathvariant=\"normal\">顶<\/mi><\/msub><mn>2<\/mn><\/msup><mo>+<\/mo><mrow><mrow><mn>4<\/mn>&#x2062;<mi>g<\/mi><\/mrow>&#x22C5;<mi>r<\/mi><\/mrow><\/mrow><\/mrow>","同一高度差2r，只有重力和不做功约束力做功为零"],["轻绳顶部可行条件","<mrow><msub><mi>v<\/mi><mi mathvariant=\"normal\">min<\/mi><\/msub><mo>=<\/mo><msqrt><mrow><mi>g<\/mi>&#x22C5;<mi>r<\/mi><\/mrow><\/msqrt><\/mrow>","仅用于只拉不推的轻绳，等号是刚好绷紧"]],[["F<sub>顶<\/sub>","顶部沿指向圆心方向为正的杆约束力","N"],["m","物体质量","kg"],["v<sub>顶<\/sub>","顶部速度","m/s"],["v<sub>底<\/sub>","底部速度","m/s"],["r","圆弧半径","m"],["g","重力加速度","m/s²"],["v<sub>min<\/sub>","轻绳顶部张力为零时的临界速度","m/s"]],[["把杆当成只拉不推的轻绳","绝对值掩盖约束方向；本例杆需要反向推力6 N，单侧轻绳不能提供这个力，结果应是绳松而非张力6 N。"],["对任意单侧轨道都照抄同一接触力不等式","接触法线方向取决于物体位于轨道哪一侧，需先从几何和受力图确定允许符号。"]],"顶部取指向圆心为正时，所需约束力等于mv²/r减mg。轻绳要求该量非负；带铰接杆可承受负值并反向推；单侧轨道若计算出接触力指向轨道无法提供的一侧，物体就脱离轨道。判断必须先画清轨道在物体哪一侧，不能脱离几何套用统一不等式。约束力不做功时仍可用机械能联系顶部和底部。",["先画出轨道、杆或绳位于物体的哪一侧，规定径向正方向。","按圆心方向列牛顿第二定律，计算约束力的正负。","将符号与具体约束能力比较，判断绷紧、受压或脱离。","只有约束力不做功时才使用顶部到底部的机械能关系。"],["1 kg物体在半径1 m圆弧顶部速率2 m/s，重力加速度10 m/s²，求杆力并判断轻绳是否可实现。",["指向圆心的合力需求为4 N向下，重力为10 N向下，杆须向上推6 N。","因此刚性杆可约束；只拉轻绳无法提供向上推力，不能保持该圆周状态。"],"杆力为−6 N（负号表示反向推）；轻绳条件不满足。"],["cir-03","dyn-01"],["cir-04"],["刚性杆","轻绳","单侧轨道","约束力"],22,""],["mdl-11","圆锥摆：绳长、张力与转速","圆锥摆的轻绳与竖直方向夹固定角，物体在水平圆周上匀速运动。",[["圆锥摆半径","<mrow><mi>r<\/mi><mo>=<\/mo><mrow><mi>L<\/mi>&#x22C5;<mrow><mi mathvariant=\"normal\">sin<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>θ<\/mi><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","θ为摆线与竖直方向夹角"],["圆锥摆绳张力","<mrow><msub><mi>T<\/mi><mi>s<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><mi>m<\/mi>&#x22C5;<mi>g<\/mi><\/mrow><mrow><mi mathvariant=\"normal\">cos<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>θ<\/mi><mo>)<\/mo><\/mrow><\/mfrac><\/mrow>","竖直方向加速度为零"],["圆锥摆角速度平方","<mrow><msup><mi>ω<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><mfrac><mi>g<\/mi><mrow><mi>L<\/mi>&#x22C5;<mrow><mi mathvariant=\"normal\">cos<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>θ<\/mi><mo>)<\/mo><\/mrow><\/mrow><\/mfrac><\/mrow>","摆线长度固定；绳张紧并作水平匀速圆周运动"]],[["r","水平圆周半径","m"],["L","摆线长度","m"],["θ","绳线与竖直夹角","rad"],["T<sub>s<\/sub>","绳张力","N"],["m","物体质量","kg"],["g","重力加速度","m/s²"],["ω","角速度（公式中的二次方表示角速度平方）","s⁻¹"]],[["将竖直方向的余弦写成正弦","角度从竖直量起，竖直分量是T cosθ；本例错误张力为16.67 N而正确为12.5 N。"],["把圆周半径误写为绳长","摆绳斜置，水平半径是L sinθ；直接以L作为半径会高估向心尺度。"]],"夹角定义至关重要：此处θ从竖直方向量起，圆周半径为绳长的正弦分量。夹角变大时，张力和角速度提高；但接近水平时所需张力很大，实际装置会受绳强度、摆角控制和空气阻力限制。公式不适用于绳松弛或角度随时间剧烈变化的摆动。",["将绳张力分解成竖直和水平分量。","竖直方向平衡求张力，水平向心力方程求圆周半径和角速度。","用所得张力回代径向方程，检查两个方向的受力一致。"],["1 kg小球以1 m长绳、与竖直夹角余弦0.8作圆锥摆，重力加速度10 m/s²，求半径和角速度平方。",["正弦为0.6，所以圆周半径0.60 m。","张力12.5 N，水平向心方程给角速度平方12.5 s⁻²。"],"半径0.60 m；张力12.5 N；角速度约3.54 rad/s。"],["cir-03","dyn-04"],["osc-03"],["圆锥摆","向心力","张力"],22,""],["mdl-12","黄金代换：地表重力、轨道速度与天体密度","近地表处忽略自转修正时，地表重力加速度满足g=GM/R²。",[["地表第一宇宙速度","<mrow><msub><mi>v<\/mi><mn>1<\/mn><\/msub><mo>=<\/mo><msqrt><mrow><mi>g<\/mi>&#x22C5;<mi>R<\/mi><\/mrow><\/msqrt><\/mrow>","用同一天体表面重力加速度，忽略自转和大气"],["第二宇宙速度","<mrow><msub><mi>v<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><mrow><msqrt><mn>2<\/mn><\/msqrt>&#x22C5;<msub><mi>v<\/mi><mn>1<\/mn><\/msub><\/mrow><\/mrow>","从表面逃逸至无穷远且最终速度趋零，忽略其他天体"],["球体平均密度","<mrow><mi>ρ<\/mi><mo>=<\/mo><mfrac><mrow><mn>3<\/mn>&#x2062;<mi>g<\/mi><\/mrow><mrow><mrow><mrow><mn>4<\/mn>&#x2062;<mi>π<\/mi><\/mrow>&#x22C5;<mi>G<\/mi><\/mrow>&#x22C5;<mi>R<\/mi><\/mrow><\/mfrac><\/mrow>","天体近似均匀球形；表面重力满足牛顿引力关系"]],[["v<sub>1<\/sub>","近地表圆轨道速度","m/s"],["v<sub>2<\/sub>","理想逃逸速度","m/s"],["g","天体表面重力加速度","m/s²"],["R","天体半径","m"],["G","万有引力常量","N·m²/kg²"],["M","天体质量","kg"],["ρ","球体平均密度","kg/m³"]],[["漏掉密度公式中的3","球体体积为4πR³/3，系数3必须保留；该式量纲仍为密度但数值小三倍。"],["把地球的g与另一星球的质量半径混用","g=GM/R²只对相同天体成立；混合参数会使代换失去物理依据。"]],"代换两边必须是同一个中心天体、同一参考半径和同一种表面重力定义。球体密度关系还假设质量可由球体体积描述；非球形、密度不均匀时只能理解为由总质量定义的平均密度。宇宙速度的第二速度仍需逃逸能量条件，不可把速度系数当成质量倍数。",["从万有引力定律和球体质量关系得到表面g=GM/R²。","在圆轨道条件中代入GM=gR²，化简得到第一宇宙速度。","用质量除球体体积求平均密度，再代入表面重力关系。","若代入数据，保留g与M、R相一致，避免混用取整参数造成小差异。"],["取地球R=6.4×10⁶ m、g=9.7705 m/s²、G=6.67×10⁻¹¹，估算平均密度与第一速度。",["由地表引力条件，第一速度平方为gR，故速度约7.91 km/s。","密度为3g/(4πGR)，约5.59×10³ kg/m³。"],"平均密度约5.59×10³ kg/m³，第一速度约7.91 km/s。"],["cir-05","cir-06"],["cir-08"],["黄金代换","宇宙速度","天体密度"],22,""],["mdl-13","圆轨道变轨：转移椭圆、速度增量与能量","理想共面霍曼转移用两次切向瞬时速度改变量，在两个同心圆轨道之间建立椭圆转移轨道。",[["圆轨道速度","<mrow><msub><mi>v<\/mi><mi>c<\/mi><\/msub><mo>=<\/mo><msqrt><mfrac><mrow><mi>G<\/mi>&#x22C5;<mi>M<\/mi><\/mrow><msub><mi>r<\/mi><mn>1<\/mn><\/msub><\/mfrac><\/msqrt><\/mrow>","中心天体质量远大于飞行器质量"],["椭圆转移近地点速度","<mrow><msup><mi>v<\/mi><mo>′<\/mo><\/msup><mo>=<\/mo><msqrt><mrow><mrow><mi>G<\/mi>⋅<mi>M<\/mi><\/mrow><mrow><mo>(<\/mo><mfrac><mn>2<\/mn><msub><mi>r<\/mi><mn>1<\/mn><\/msub><\/mfrac><mo>−<\/mo><mfrac><mn>1<\/mn><msub><mi>a<\/mi><mi>t<\/mi><\/msub><\/mfrac><mo>)<\/mo><\/mrow><\/mrow><\/msqrt><\/mrow>","两次瞬时切向脉冲的理想霍曼转移；a<sub>t<\/sub>为转移椭圆半长轴"],["椭圆轨道总机械能","<mrow><mi>E<\/mi><mo>=<\/mo><mfrac><mrow><mrow><mrow><mo>(<\/mo><mo>−<\/mo><mi>G<\/mi><mo>)<\/mo><\/mrow><mi>M<\/mi><\/mrow>⋅<mi>m<\/mi><\/mrow><mrow><mn>2<\/mn>⁢<msub><mi>a<\/mi><mi>t<\/mi><\/msub><\/mrow><\/mfrac><\/mrow>","封闭开普勒椭圆轨道；a<sub>t<\/sub>为半长轴，不是任意瞬时半径"]],[["v<sub>c<\/sub>","内圆轨道速度","m/s"],["G","万有引力常量","N·m²/kg²"],["M","中心天体质量","kg"],["r1","内圆轨道半径","m"],["v′","转移轨道近地点速度","m/s"],["a<sub>t<\/sub>","转移椭圆半长轴","m"],["m","飞行器质量","kg"],["E","椭圆轨道总机械能","J"]],[["把椭圆机械能的半长轴换成瞬时半径","椭圆总能量由半长轴决定，瞬时半径用于势能但不能取代能量式中的a；错误给−2.50125×10⁷ J而正确为−1.6675×10⁷ J。"],["认为进入更高稳定轨道后速率必然更大","圆轨道速度随半径增大而降低；转移过程中近地点速度会先提高，远地点再调节。"]],"椭圆轨道速度随位置变化，需使用半长轴和当前位置共同计算。低圆轨道加速进入转移椭圆，远地点再加速到高圆轨道；高圆轨道稳定速度反而较小，不代表第一次加速后马上就能直接稳定在高轨道。推力做功、燃料质量变化、有限持续时间、轨道平面变化和大气阻力会使实际变轨偏离理想两脉冲模型。",["由内外圆轨道半径求转移椭圆半长轴。","圆轨道速度由向心条件求，转移椭圆近地点速度用能量和角动量关系求。","两者之差是第一次速度增量；高轨道还需要第二次脉冲。","用近地点动能与引力势能相加，核对椭圆轨道总能量。"],["中心天体GM=4.002×10¹⁴ m³/s²，内圆半径8.0×10⁶ m，转移椭圆半长轴1.2×10⁷ m，求近地点速度及轨道能量。",["内圆速度约7072.8 m/s；转移近地点速度约8167.5 m/s。","每千克椭圆轨道总机械能为−GM/(2a)，约−1.6675×10⁷ J。"],"转移近地点速率约8.17 km/s；1 kg飞行器总机械能−1.6675×10⁷ J。"],["cir-06","cir-07"],["cir-08"],["轨道变换","霍曼转移","开普勒轨道","变轨能量"],22,""],["mdl-14","双星系统：质心、轨道半径与周期","两颗恒星在万有引力作用下绕共同质心作圆周运动。",[["双星轨道角速度周期","<mrow><msub><mi>T<\/mi><mi>b<\/mi><\/msub><mo>=<\/mo><mrow><mrow><mn>2<\/mn>⁢<mi>π<\/mi><\/mrow>⋅<msqrt><mfrac><msup><mi>L<\/mi><mn>3<\/mn><\/msup><mrow><mi>G<\/mi><mrow><mo>(<\/mo><msub><mi>m<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>m<\/mi><mn>2<\/mn><\/msub><mo>)<\/mo><\/mrow><\/mrow><\/mfrac><\/msqrt><\/mrow><\/mrow>","两星质量相近或任意；互绕圆轨道，相对轨道半径为星间距L"],["第一颗星绕质心半径","<mrow><m /mfrac><\/mrow>","电场力和磁场力相反且垂直；忽略重力和边缘效应"],["电场与重力平衡场强","<mrow><msub><mi>E<\/mi><mi>g<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><mi>m<\/mi>&#x22C5;<mi>g<\/mi><\/mrow><mi>q<\/mi><\/mfrac><\/mrow>","电场方向按带电粒子正负选择，使电力抵消重力"],["复合横向加速度","<mrow><msub><mi>a<\/mi><mi>y<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><mi>q<\/mi><mrow><mo>(<\/mo><mi>E<\/mi><mo>−<\/mo><mrow><mi>v<\/mi>⋅<mi>B<\/mi><\/mrow><mo>)<\/mo><\/mrow><\/mrow><mi>m<\/mi><\/mfrac><\/mrow>","E与磁力在同一横向轴，正方向沿电场力对正电荷方向"]],[["v<sub>0<\/sub>","速度选择器通过且不偏转的速率","m/s"],["E","速度选择电场强度","V/m"],["B","磁感应强度","T"],["E<sub>g<\/sub>","抵消重力所需场强大小","N/C"],["m","粒子质量","kg"],["g","重力加速度","m/s²"],["q","电荷量大小","C"],["a<sub>y<\/sub>","指定横向的有向加速度","m/s²"],["v","粒子沿速度选择方向的速率","m/s"]],[["把速度选择速度写成B/E","平衡关系为qE=qvB，因此v=E/B；错式不仅量纲不符，数值也不对应平衡速度。"],["忽略电荷正负而直接断言偏转方向","正负电荷的电力和洛伦兹力方向相反，须结合实际方向逐项判断。 先确定速度与磁场夹角，再结合电荷正负逐项判断电力和洛伦兹力方向。"]],"速度选择器在电力和磁力反向且大小相等时无横向偏转，选出的速度大小为E/B。若同时有重力或电场不水平，应把所有力按坐标轴分量相加；一般不存在“只看E/B”的平衡。复合场中若电场做功，动能通常不守恒；磁场不做功这一事实不能推出总能量不变。",["画出速度、电场、磁场和重力方向，先用电荷符号判电力与磁力方向。","分坐标轴写出牛顿第二定律，横向力为零才能保持直线运动。","确认电场、磁场是只抵消偏转还是还承担重力；不得重复计力。"],["速度选择器中E=6 V/m、B=2 T，另有重力由独立电场平衡，求无偏转速度。",["令横向电力和磁力大小相等，qE=qvB。","速度为E/B=3 m/s；附加重力需单独由电场分量平衡。"],"速度选择值3 m/s；重力平衡场强依质量和电荷量另算。"],["lor-01","ele-05","dyn-02"],["lor-04"],["速度选择器","复合场","洛伦兹力","重力平衡"],22,""],["mdl-22","变压器与远距离输电：变比、降压和线路损失","理想变压器利用交变磁通把初级电压按线圈匝数比变换；远距离输电可提高电压以降低相同功率下的电流，减少输电线焦耳损失。",[["理想变压器电压关系","<mrow><msub><mi>U<\/mi><mi>s<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>U<\/mi><mi>p<\/mi><\/msub>&#x22C5;<msub><mi>N<\/mi><mi>s<\/mi><\/msub><\/mrow><msub><mi>N<\/mi><mi>p<\/mi><\/msub><\/mfrac><\/mrow>","理想耦合且输入输出为同频交流有效值"],["输电线损失","<mrow><mi>Δ<\/mi><mi>P<\/mi><mo>=<\/mo><mfrac><mrow><msup><mi>P<\/mi><mn>2<\/mn><\/msup>&#x22C5;<mi>R<\/mi><\/mrow><msup><msub><mi>U<\/mi><mi>s<\/mi><\/msub><mn>2<\/mn><\/msup><\/mfrac><\/mrow>","用送端电压近似确定线路电流，负载输送功率给定，功率因数按1"],["线路电压降","<mrow><mi>Δ<\/mi><mi>U<\/mi><mo>=<\/mo><mfrac><mrow><mi>P<\/mi>&#x22C5;<mi>R<\/mi><\/mrow><msub><mi>U<\/mi><mi>s<\/mi><\/msub><\/mfrac><\/mrow>","同一近似条件，线路电流按P/U估算"]],[["U<sub>s<\/sub>","变压器次级电压或输电送端电压","V"],["U<sub>p<\/sub>","初级电压","V"],["N<sub>s<\/sub>","次级匝数","1"],["N<sub>p<\/sub>","初级匝数","1"],["P","输送的有功功率近似","W"],["R","线路总电阻","Ω"],["ΔP","线路焦耳损失","W"],["ΔU","线路电压降","V"]],[["把线路损失写成输送功率乘线路电阻","功率损失应为I²R，且需先以U估计电流；本例数值结果需经单位和线路电流复核。"],["认为理想变压器能提高电压同时保持次级电流不变","理想功率守恒要求电压比与电流比反向变化；升压需降低电流。 理想功率守恒要求电压比与电流比反向变化；升压且负载不变时次级电流会减小。"]],"理想变压器本身不创造功率，电压升高时电流按相反比例下降。线路电阻会造成送端和受端电压差；P/U近似只有在功率因数约为1且电压取值定义清楚时才可直接使用。实际交流网络还需考虑负载功率因数、变压器损耗、线路电抗与调压，不能把理想模型当作电网完整计算。",["用变压器匝数比确定交流有效值变换，确认没有把匝数方向倒置。","由输送功率和送端电压估计线路电流。","用电流平方乘线路电阻求损失，并用电流乘电阻核对电压降。","比较升压前后电流和损失，同时检查受端电压是否仍满足负载要求。"],["100 kW负载用10 kV送电，线路总电阻10 Ω，功率因数按1，估算线路损失和压降。",["线路电流约100000/10000=10 A。","线路损失为10²×10=1000 W，压降为10×10=100 V。"],"线路损失约1000 W（输送功率的1%）；压降约100 V。"],["ac-04","ac-05"],["thermo-02"],["理想变压器","远距离输电","线路损失","焦耳热"],22,""],["mdl-23","电容器并联：电荷再分配与能量损失","已充电电容器与未充电电容器并联后，在外界绝缘条件下总电荷守恒，最终两端电压相同。",[["孤立电容器组末电压","<mrow><msub><mi>U<\/mi><mi>p<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>C<\/mi><mn>1<\/mn><\/msub>&#x22C5;<msub><mi>U<\/mi><mn>1<\/mn><\/msub><\/mrow><mrow><msub><mi>C<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mfrac><\/mrow>","初始仅C1带电，C2不带电；并联后对外绝缘"],["连接前后焦耳等效损失","<mrow><mi>Q<\/mi><mo>=<\/mo><mfrac><mrow><mrow><mrow><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac>⁢<msub><mi>C<\/mi><mn>1<\/mn><\/msub><\/mrow>⋅<msub><mi>C<\/mi><mn>2<\/mn><\/msub><\/mrow>⋅<msup><msub><mi>U<\/mi><mn>1<\/mn><\/msub><mn>2<\/mn><\/msup><\/mrow><mrow><msub><mi>C<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>C<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mfrac><\/mrow>","无电源且忽略辐射，损失耗散在连接电阻和寄生过程"],["总电荷守恒","<mrow><msub><mi>q<\/mi><mi mathvariant=\"normal\">总<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>C<\/mi><mn>1<\/mn><\/msub>&#x22C5;<msub><mi>U<\/mi><mn>1<\/mn><\/msub><\/mrow><\/mrow>","孤立导体总电荷不变，连接后两电容电压相同"]],[["U<sub>p<\/sub>","并联后共同电压","V"],["C1","原带电电容","F"],["C2","初始未带电电容","F"],["U<sub>1<\/sub>","第一电容初始电压","V"],["Q","电场储能减少量","J"],["q<sub>总<\/sub>","连接前总电荷","C"]],[["把电容值直接相加后仍取原电压","电荷固定而总电容变大，电压必下降；本例共同电压4 V，不能仍为10 V。"],["认为电容并联瞬间没有电流也没有能量转换","电荷重新分配需经历暂态；理想化瞬时连接省略的过程仍要由非理想电路解释。"]],"计算末电压前要确认电容器极性、初始电荷和连接后的拓扑。理想零电阻导线的瞬间模型会产生不现实的无限大峰值电流；实际由电阻、电感、开关和电磁辐射决定暂态。能量不守恒的表面差额不是“消失”，而是离开静电场储能形式。",["根据绝缘连接范围确定总电荷是否守恒，先计算初始电荷。","并联后电压相同，写末态总电荷方程求共同电压。","分别计算连接前后静电场能量，差值作为转换到其他形式的能量。","说明实际瞬间电流由非理想电路决定。"],["2 μF电容初始10 V，与3 μF未充电电容并联且对外绝缘，求末电压与电场能量减少。",["初始电荷20 μC，总电容5 μF，因此共同电压4 V。","初能100 μJ，末能40 μJ，差60 μJ转为其他形式。"],"末电压4 V；电场能量减少60 μJ。"],["cap-01","cap-02"],["dc-05"],["电容并联","电荷守恒","能量损失","电路暂态"],22,""],["mdl-24","物理图像：斜率、面积与分段读数","物理图像中的斜率和面积代表不同物理量。",[["位置时间图斜率","<mrow><mover accent=\"true\"><mi>v<\/mi><mo>¯<\/mo><\/mover><mo>=<\/mo><mfrac><mrow><msub><mi>x<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>x<\/mi><mn>1<\/mn><\/msub><\/mrow><mrow><msub><mi>t<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>t<\/mi><mn>1<\/mn><\/msub><\/mrow><\/mfrac><\/mrow>","两点间直线割线斜率为区间平均速度；切线斜率为瞬时速度"],["速度时间图面积","<mrow><mi mathvariant=\"normal\">dx<\/mi><mo>=<\/mo><mrow><mover accent=\"true\"><mi>v<\/mi><mo>¯<\/mo><\/mover>&#x22C5;<mi mathvariant=\"normal\">dt<\/mi><\/mrow><\/mrow>","一个匀速小区间；一般情形是有符号面积积分"],["力位移图面积","<mrow><msub><mi>W<\/mi><mi mathvariant=\"normal\">合<\/mi><\/msub><mo>=<\/mo><mrow><mover accent=\"true\"><mi>F<\/mi><mo>¯<\/mo><\/mover>&#x22C5;<mi mathvariant=\"normal\">dx<\/mi><\/mrow><\/mrow>","力沿位移方向，矩形恒力段；一般用有符号面积积分"],["功率时间图面积","<mrow><msub><mi>W<\/mi><mi>P<\/mi><\/msub><mo>=<\/mo><mrow><mover accent=\"true\"><mi>P<\/mi><mo>¯<\/mo><\/mover>&#x22C5;<mi mathvariant=\"normal\">dt<\/mi><\/mrow><\/mrow>","矩形恒功率段；一般为有符号功率积分"]],[["x<sub>1<\/sub>","位置图起点位置","m"],["x<sub>2<\/sub>","位置图终点位置","m"],["t<sub>1<\/sub>","起始时刻","s"],["t<sub>2<\/sub>","终止时刻","s"],["<span style=\"text-decoration:overline\">v<\/span>","区间平均速度","m/s"],["dt","时间区间","s"],["dx","有向位移","m"],["<span style=\"text-decoration:overline\">F<\/span>","恒力或区间平均力","N"],["W<sub>合<\/sub>","力沿位移做功","J"],["W<sub>P<\/sub>","功率图面积对应能量","J"],["<span style=\"text-decoration:overline\">P<\/span>","功率时间图区间平均功率","W"]],[["把速度时间图的纵坐标直接当成位移","速度时间图面积才是位移；还缺一个时间因子，本例2 s内3 m/s对应6 m位移。"],["位置时间曲线斜率直接称为加速度","其斜率是速度；加速度对应速度时间图斜率，需先辨认图轴。 还应结合纵、横轴所代表的物理量与单位核实斜率含义，不能只看曲线外形。"]],"读图先看纵横轴量、单位、坐标方向和分段边界。折线段的斜率可用端点差商；曲线某点瞬时量需切线或函数导数。速度过零时位移面积正负抵消，路程要把各段面积取绝对值后相加。面积只有在图轴和单位正确时才有物理意义，非线性曲线不能随意用端点平均代替积分。",["逐图标清横纵轴物理量、单位和正方向。","位置时间图用纵坐标改变量除时间改变量；切线斜率才代表某时刻瞬时速度。","速度时间图按正负面积计算位移，路程则累计面积大小。","力位移和功率时间图按带符号面积分别读功与能量。"],["物体位置从2 m变到8 m经历2 s，速度时间段恒为3 m/s；求平均速度和位移。",["位置变化6 m除2 s得平均速度3 m/s。","速度图有向面积3×2=6 m，与端点位移一致。"],"平均速度3 m/s，位移6 m。"],["kine-01","ene-01"],["iad-05"],["图像法","斜率","面积","物理量读图"],22,""],["mdl-25","细绳、弹簧与轻杆：切断瞬间的受力","轻绳只能沿绳方向拉，理想弹簧的力由形变量确定，刚性轻杆的作用还取决于连接和受力结构。",[["断绳前弹簧力","<mrow><msub><mi>F<\/mi><mi>s<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><mi>m<\/mi>&#x22C5;<mi>g<\/mi><\/mrow><mrow><mi mathvariant=\"normal\">cos<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>θ<\/mi><mo>)<\/mo><\/mrow><\/mfrac><\/mrow>","球静止，弹簧与竖直夹角θ，水平细绳承担另一个分量"],["断绳后水平加速度","<mrow><msub><mi>a<\/mi><mi>x<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>F<\/mi><mi>s<\/mi><\/msub>&#x22C5;<mrow><mi mathvariant=\"normal\">sin<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>θ<\/mi><mo>)<\/mo><\/mrow><\/mrow><mi>m<\/mi><\/mfrac><\/mrow>","切断水平绳瞬间，弹簧形变量连续且竖直分量仍平衡重力"],["断绳后竖直加速度","<mrow><msub><mi>a<\/mi><mi>y<\/mi><\/msub><mo>=<\/mo><mrow><mfrac><mrow><msub><mi>F<\/mi><mi>s<\/mi><\/msub>&#x22C5;<mrow><mi mathvariant=\"normal\">cos<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>θ<\/mi><mo>)<\/mo><\/mrow><\/mrow><mi>m<\/mi><\/mfrac><mo>−<\/mo><mi>g<\/mi><\/mrow><\/mrow>","理想弹簧未剪断，切绳瞬间其长度和力方向未突变"],["剪斜绳后合加速度","<mrow><mi>a<\/mi><mo>=<\/mo><msqrt><mrow><msup><mfrac><msub><mi>F<\/mi><mi>s<\/mi><\/msub><mi>m<\/mi><\/mfrac><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>g<\/mi><mn>2<\/mn><\/msup><\/mrow><\/msqrt><\/mrow>","另一情境：原平衡由水平弹簧和向上斜绳维持，仅剪斜绳，弹簧仍完整"]],[["F<sub>s<\/sub>","斜弹簧弹力","N"],["m","小球质量","kg"],["g","重力加速度","m/s²"],["θ","弹簧与竖直夹角","rad"],["a<sub>x<\/sub>","切绳后水平方向加速度","m/s²"],["a<sub>y<\/sub>","切绳后竖直方向加速度","m/s²"],["a","剪斜绳后合加速度大小","m/s²"]],[["把水平绳力在切断后仍保留","切绳后水平绳张力立即消失；本例不能继续把7.5 N绳力算进水平合力。"],["声称“任何弹簧力在任何切断操作中都不能突变”","完整理想弹簧的形变量连续时弹力连续；切断弹簧本身、冲击、质量不可忽略或刚性连接瞬变时需按具体模型判断。"]],"算例为静止小球受斜弹簧和水平细绳作用，弹簧与竖直夹角满足cosθ=0.8、sinθ=0.6，且mg=10 N。切断水平绳后，弹簧长度和方向瞬间不变，竖直分力仍平衡重力，水平加速度为7.5 m/s²。绳张力可立即变为零；若直接剪断弹簧，其连接力可因约束消失而改变，不能说任何弹簧力都不能突变。杆只有在理想两力杆且两端无其他作用时才保证杆力沿杆轴；受弯杆可有横向反力。",["切断前画平衡受力图，分解斜弹簧和水平绳的作用力。","判断切断对象：剪绳不会瞬间改变未剪弹簧的形变量，剪弹簧则是另一边界条件。","切断后按瞬间不变的弹簧力、重力及消失的绳力重列牛顿第二定律。","杆须辨认是否两力杆；结构有其他约束时不可擅自把杆力限制为轴向。","剪斜绳且剩水平弹簧时，剪后水平弹力与竖直重力共同产生加速度。另设1 kg小球、弹簧力7.5 N，两分量为7.5和向下10 m/s²，合加速度12.5 m/s²。"],["1 kg小球静止，受弹簧和水平绳拉住，弹簧与竖直夹角余弦0.8、正弦0.6，重力加速度10 m/s²。切断水平绳后求瞬时加速度。",["切绳前竖直平衡给弹簧力10/0.8=12.5 N。","切绳后水平合力7.5 N，竖直分力仍抵消重力，所以加速度为(7.5,0) m/s²。"],"水平加速度7.5 m/s²，竖直加速度0。"],["dyn-01","dyn-05"],["mdl-15"],["细绳","弹簧","轻杆","切断瞬间","约束变化"],22,""],["mdl-26","等时圆（弦轨道下滑时间相同）","在竖直圆周上从最高点连接到圆周不同端点形成光滑弦轨道，小球从静止释放。",[["弦长沿弦加速度","<mrow><msub><mi>a<\/mi><mi>c<\/mi><\/msub><mo>=<\/mo><mrow><mi>g<\/mi>&#x22C5;<mrow><mi mathvariant=\"normal\">cos<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>θ<\/mi><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","物体从圆周最高点静止，沿光滑弦下滑；θ为弦与向下竖直的夹角"],["最高点至端点弦长","<mrow><msub><mi>s<\/mi><mi>c<\/mi><\/msub><mo>=<\/mo><mrow><mrow><mn>2<\/mn>&#x2062;<mi>R<\/mi><\/mrow>&#x22C5;<mrow><mi mathvariant=\"normal\">cos<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>θ<\/mi><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","端点在同一竖直圆周上，θ限定0≤θ&lt;π/2"],["下滑时间","<mrow><msub><mi>t<\/mi><mi>c<\/mi><\/msub><mo>=<\/mo><mrow><mn>2<\/mn>&#x2062;<msqrt><mfrac><mi>R<\/mi><mi>g<\/mi><\/mfrac><\/msqrt><\/mrow><\/mrow>","光滑斜弦、从静止、终点在圆周；排除零长度退化弦"]],[["a<sub>c<\/sub>","沿弦加速度","m/s²"],["g","重力加速度","m/s²"],["θ","弦与向下竖直的夹角","rad"],["s<sub>c<\/sub>","最高点至圆周端点弦长","m"],["R","竖直圆半径","m"],["t<sub>c<\/sub>","从静止下滑所需时间","s"]],[["只考虑加速度变化而忘记弦长也同时改变","下滑时间同时取决于路径长度和加速度；本例θ=60°时该错式为0.632? 本卡正确式为0.632 s，需改用模型区分错误。"],["把摩擦滚动小球也当成质点滑动","转动动能会改变平动加速度；有滚动或摩擦需重新列平动与转动方程。"]],"令θ为弦与向下竖直的夹角，弦长s=2Rcosθ，沿弦加速度gcosθ。由直线匀加速时间式可得t=2√(R/g)，不依赖终点角度。该结论假定从同一最高点静止、无摩擦、圆轨道严格竖直且各弦长度非零；弦端点退化到起点时“时间相同”不再表示 。本例错误写法给出约83.3 kPa，正确值为120 kPa。"],["把表压直接代入玻意耳定律","气体定律使用绝对压强，表压需加当地大气压。 应将表压加上当地大气压换成绝对压强，并保持气体质量和温度不变。"],["把摄氏温度直接代入气体比例式","气体状态变化中的温度比例使用开尔文；摄氏温标的零点不对应热力学绝对零度。"]],"等温实验中缓慢改变体积、等待热平衡，作p-V曲线或p-1/V图；等压实验保持压强不变，比较V/T；等容实验固定体积，比较p/T。温度比例一律使用开尔文，压力传感器读表压时须加大气压转为绝对压强。密闭防漏、缓慢改变状态并保留原始读数。",["密闭防漏，缓慢改变状态并等候温度稳定。","等温比较压强与体积倒数；等压比较体积与温度。","等容比较压强与温度；统一用开尔文和绝对压强。"],["密闭一定质量气体分别进行等温、等压和等容测量：等温时由100 kPa、60 mL缓慢压至50 mL；等压时5.0×10⁻⁵ m³、300 K升至360 K；等容时100 kPa、300 K升至360 K。",["检查密闭并缓慢压缩，等温后读数。","p<sub>2<\/sub>=100×60/50=120 kPa。","等压过程V随热力学温度成正比，末体积为6.0×10⁻⁵ m³。","等容过程p随热力学温度成正比，末绝对压强为120 kPa。"],"等温末压强120 kPa；等压末体积6.0×10⁻⁵ m³；等容末压强120 kPa。"],["mgas-05","mgas-03"],["mdl-29"],["探究一定质量气体的等温变化"],23,""],["met-01","整体法与隔离法（连接体）","整体法把多个物体作为研究系统以消去内部作用，隔离法再研究其中一个物体求内力。",[["共有加速度","<mrow><mi>a<\/mi><mo>=<\/mo><mfrac><mi>F<\/mi><mrow><msub><mi>m<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>m<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mfrac><\/mrow>","理想轻绳绷紧，两个物体沿同一直线具有相同加速度"],["隔离后的绳拉力","<mrow><mi>T<\/mi><mo>=<\/mo><mrow><msub><mi>m<\/mi><mn>2<\/mn><\/msub>&#x22C5;<mi>a<\/mi><\/mrow><\/mrow>","第二物体沿所选方向仅受绳拉力"],["不同加速度的系统外力","<mrow><mi>F<\/mi><mo>=<\/mo><mrow><mrow><msub><mi>m<\/mi><mn>1<\/mn><\/msub>&#x22C5;<msub><mi>a<\/mi><mn>1<\/mn><\/msub><\/mrow><mo>+<\/mo><mrow><msub><mi>m<\/mi><mn>2<\/mn><\/msub>&#x22C5;<msub><mi>a<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mrow><\/mrow>","同一惯性系、质量不变；所有量均为同方向分量"]],[["m1","被外力直接拉动的物体质量","kg"],["m2","另一个物体质量","kg"],["F","沿所选方向的系统外合力","N"],["a","两个物体共有的加速度","m/s²"],["a1","第一个物体的加速度分量","m/s²"],["a2","第二个物体的加速度分量","m/s²"],["T","轻绳拉力","N"],["W","外合力做功","J"],["s","共有位移","m"]],[["把轻绳拉力当成系统的另一份外力","拉力对两个物体的作用方向相反，是系统内力；整体列式再加一次拉力就重复计入作用，导致加速度偏大但量纲无误。"],["任何连接体都把两个物体的加速度设成相等","绳可能松弛、弹性连接可以伸长、接触面也可能滑动；共有加速度来自具体约束而不是来自同时画在一张示意图上。"]],"研究对象决定哪些力属于内力，但不会把不同物体的加速度自动变成相同。理想轻绳绷紧、刚性连接或无相对滑动等约束才可能给出共有加速度；遇到滑块、可伸长绳或分离阶段，要用同一惯性系中的系统牛顿第二定律，不能直接把总质量乘某个物体的加速度。",["先列出系统边界，把物体间成对作用力从系统外力表中消去。","检查绳长、接触和滑动条件，只有确证共有加速度才能提出总质量乘该加速度。","整体算共有加速度，再隔离一个物体求绳拉力或接触力。","若约束失效或物体加速度不同，分别写质量乘各自加速度，再求和，而不 弹力为10 N、30 N，线性变化时关于位移的平均力为20 N。","位移增加0.20 m，梯形面积为20×0.20=4 J；末力乘位移给6 J，不正确。"],"外力做功4 J；不能把末弹力30 N当成全过程平均力。"],["ene-05","ind-06"],["mdl-19","iad-06"],["微元法","累积量","变力做功","积分思想"],24,""],["met-05","临界条件分析法","临界分析把即将发生的状态改变翻译为边界方程。",[["最高点约束力","<mrow><mi>N<\/mi><mo>=<\/mo><mrow><mfrac><mrow><mi>m<\/mi>&#x22C5;<msup><mi>v<\/mi><mn>2<\/mn><\/msup><\/mrow><mi>r<\/mi><\/mfrac><mo>−<\/mo><mrow><mi>m<\/mi>&#x22C5;<mi>g<\/mi><\/mrow><\/mrow><\/mrow>","细绳或内轨，最高点重力与约束力均指向圆心，负值说明此模型无法维持"],["最大静摩擦力","<mrow><mi>f<\/mi><mo>=<\/mo><mrow><mi>μ<\/mi>&#x22C5;<mi>N<\/mi><\/mrow><\/mrow>","仅用于即将滑动的最大静摩擦边界，通常静摩擦可以更小"],["最小间距","<mrow><msub><mi>d<\/mi><mi mathvariant=\"normal\">min<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>d<\/mi><mn>0<\/mn><\/msub><mo>−<\/mo><mfrac><msup><mi>u<\/mi><mn>2<\/mn><\/msup><mrow><mn>2<\/mn>&#x2062;<mi>a<\/mi><\/mrow><\/mfrac><\/mrow><\/mrow>","a为正，初速度使间距缩小，顶点时刻位于光滑研究区间内"],["内部最小间距时刻","<mrow><msub><mi>t<\/mi><mi>c<\/mi><\/msub><mo>=<\/mo><mfrac><mi>u<\/mi><mi>a<\/mi><\/mfrac><\/mrow>","相对速度从负值变到零，阶段内的光滑极小值"]],[["N","最高点绳拉力或内轨支持力","N"],["m","圆周物体质量","kg"],["v","最高点速度","m/s"],["r","圆周半径","m"],["g","重力加速度，取10","m/s²"],["μ","最大静摩擦系数","1"],["f","最大静摩擦力大小","N"],["d<sub>0<\/sub>","两物体初始间距","m"],["u","初始使间距缩小的相对速度大小","m/s"],["a","使间距增大的相对加速度","m/s²"],["d<sub>min<\/sub>","研究阶段内的最小间距","m"],["t<sub>c<\/sub>","光滑区间内达到最小间距的时刻","s"]],[["最高点求拉力漏掉重力项","向心力是所有径向力的合力，不是额外一项独立力；重力已经贡献所需20 N，忽略它会把临界零拉力误算成20 N。"],["恰好不相撞一律要求相对速度和相对加速度同时为零","二次间距可以在相对加速度为正的时刻达到零的最小值，本卡明确给出反例；相对速度为零也是光滑内点极值的条件而非所有端点边界条件。"]],"临界不是一条统一的万能等式。支持力或绳拉力的零值对应约束失效，最大静摩擦对应将要相对滑动，光滑时间区间内的最小间距对应相对速度为零。恰好接触时最小间距为零，但相对加速度可以非零；若最小值在阶段端点，还不能盲目要求相对速度为零。",["先判断变化的是接触、绳松紧、滑动还是两物体相遇，再选择对应边界量。","圆周最高点列向心方向的合力，约束力到零是细绳保持绷紧的临界。","静摩擦临界用最大静摩擦，未到边界时应由平衡或动力学求实际摩擦力。","相撞问题写间距随时间的函数，在允许时间区间比较内点极小值与端点；不要额外强加相对加速度为零。"],["两物体的间距可写成初始4 m减去4 m/s乘时间再加时间平方项，相对加速度为2 m/s²。求最小间距并判断是否必须相对加速度为零。",["间距函数为4−4t+t²=(t−2)²，在2 s达到最小值0 m。","该时刻相对速度为零，但相对加速度仍为2 m/s²；质点恰好接触的边界不要求加速度为零。"],"最小间距0 m，发生在2 s；相对加速度不必为零。"],["cir-04","dyn-03","mdl-05"],["mdl-09","met-06"],["临界条件","最大静摩擦","恰好不脱离","恰好不相撞"],24,""],["met-06","极限检验与特殊值检验","极限和特殊值检验把一般公式放回易判断的简单场景。",[["连接体一般加速度","<mrow><mi>a<\/mi><mo>=<\/mo><mfrac><mi>F<\/mi><mrow><msub><mi>m<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>m<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mfrac><\/mrow>","共加速、光滑，第一物体质量严格为正"],["光滑斜面加速度","<mrow><msub><mi>a<\/mi><mi>x<\/mi><\/msub><mo>=<\/mo><mrow><mi>g<\/mi>&#x22C5;<mrow><mi mathvariant=\"normal\">sin<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>θ<\/mi><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","只受重力与支持力，斜面倾角从水平起算"],["有限内阻电路电流","<mrow><mi>I<\/mi><mo>=<\/mo><mfrac><mi>E<\/mi><mrow><mi>R<\/mi><mo>+<\/mo><mi>r<\/mi><\/mrow><\/mfrac><\/mrow>","纯电阻外电路，内阻为正；开路通过外电阻增大的极限理解"]],[["F","连接体沿运动方向的外合力","N"],["m1","第一个物体质量","kg"],["m2","第二个物体质量，可取零的理想极限","kg"],["a","光滑连接体共有加速度","m/s²"],["g","重力加速度，取10","m/s²"],["θ","无摩擦斜面倾角","rad"],["a<sub>x<\/sub>","斜面向下的加速度","m/s²"],["E","电源电动势","V"],["R","外电阻","Ω"],["r","电源固定内阻","Ω"],["I","闭合电路电流","A"],["s","位移","m"],["W","外力做功","J"]],[["连接体质量误写成相减","两个物体共同加速时惯性质量应相加；相减不仅可能产生不合理负加速度，还会在两质量相等时造成无物理依据的除零。"],["几个特殊值通过就认定整个公式被证明","不同函数可以在零值或某个角度上恰好相同；极限检验是反证和排错工具，仍须配合量纲、普通数值情形与物理推导进行确认。"]],"这种方法能发现符号、系数和函数方向错误，但不能替代推导，因为错误公式也可能在少数特殊值碰巧正确。必须保持模型的其余条件一致，避免质量为零造成除零、短路时忽略内阻、斜面接触消失等越界；无穷只能检查趋近趋势，不能把无穷当作普通有限数输入计算器。",["选一组能凭物理直觉独立判断的极限或特殊值，先预测结论再代公式。","连接体让第二质量归零时保留第一质量，检验是否还原单物体加速度。","斜面倾角为零时检验沿面加速度是否归零；只在原接触约束允许时讨论直角端点。","外电阻逐渐增大，检查电流是否趋零，同时保持电动势和内阻不变；通过一般情形数值再防止特殊值碰巧掩盖错误。"],["10 N水平外力拉动光滑连接体，第一物体2 kg，第二物体3 kg。比较第二质量为3 kg和趋近零时的加速度。",["一般情形总质量5 kg，加速度为10/5=2 m/s²。","第二质量趋零时总质量趋2 kg，加速度趋5 m/s²，与单物体牛顿第二定律一致。"],"一般加速度2 m/s²；轻物体极限趋近5 m/s²。"],["dyn-05","dc-06"],["mdl-32","mdl-17"],["极限检验","特殊值检验","模型边界"],24,""],["met-07","质点模型与参考系","当研究问题中物体的形状和大小影响可以忽略时，可把物体作为有质量的点。",[["同向坐标轴下的相对位置","<mrow><mi>x<\/mi><mo>=<\/mo><mrow><mi mathvariant=\"normal\">xo<\/mi><mo>−<\/mo><mi mathvariant=\"normal\">xr<\/mi><\/mrow><\/mrow>",""],["相对平动速度","<mrow><mi>v<\/mi><mo>=<\/mo><mrow><mi mathvariant=\"normal\">vo<\/mi><mo>−<\/mo><mi mathvariant=\"normal\">vr<\/mi><\/mrow><\/mrow>","经典低速、同向坐标轴的平动参考系。"]],[["x","相对参考系原点坐标","m"],["xo","地面系物体坐标","m"],["xr","地面系参考原点坐标","m"],["v","相对参考系速度","m/s"],["vo","地面系物体速度","m/s"],["vr","地面系参考原点速度","m/s"],["d","独立测量物体与参考原点有向间距","m"]],[["换参考系时仍使用地面坐标，忘记减参考原点坐标。","地面坐标10 m而参考原点在3 m，相对坐标是7 m；位置变化须同时明确原点，不能把坐标当成绝对属性。"],["地球很大所以任何问题都不能作质点，或者小物体永远可以。","大小是否影响所研究问题才是标准，轨道位置与转动姿态要求不同；模型必须保留质量并说明忽略的几何信息。"]],"能否视为质点取决于研究问题：研究地球绕太阳的位置运动可作质点近似，研究地球自转或物体转动姿态不能这样处理。质点并非质量为零，也不是所有小物体都能忽略大小。参考系可以选地面、车厢或其他对象，但要说明；在经典低速且坐标轴同向的平动参考系中，位置和速度分别作差。加速参考系的动力学分析不能直接沿用惯性系受力规则。",["位置10-3=7 m。","速度5-2=3 m/s；两者都相对于车厢原点。","能否视为质点取决于研究问题：研究地球绕太阳的位置运动可作质点近似，研究地球自转或物体转动姿态不能这样处理。"],["地面系物体位置10 m、速度5 m/s，车厢原点位置3 m、速度2 m/s，轴同向且低速，求车厢系位置和速度。",["位置10-3=7 m。","速度5-2=3 m/s；两者都相对于车厢原点。"],"位置7 m，相对速度3 m/s。"],[],["kine-01","dyn-09"],["质点模型与参考系","条件与边界","实验与证据"],24,"<section class=\"field learning\"><h4>质点模型与参考系：方法与边界<\/h4><p>能否视为质点取决于研究问题：研究地球绕太阳的位置运动可作质点近似，研究地球自转或物体转动姿态不能这样处理。质点并非质量为零，也不是所有小物体都能忽略大小。参考系可以选地面、车厢或其他对象，但要说明；在经典低速且坐标轴同向的平动参考系中，位置和速度分别作差。加速参考系的动力学分析不能直接沿用惯性系受力规则。<\/p><\/section>"]]}</script><script>
(()=>{'use strict';
const data=JSON.parse(document.getElementById('kb-data').textContent),groups=data.g,points=data.p;
const SEGMENT_ROOT='高中物理',QUIZ_HREF='quiz-hs.html',RETURN_PAGE='quick.html';
const viewBox=document.getElementById('content'),search=document.getElementById('search'),chapter=document.getElementById('chapter'),counter=document.getElementById('count');
const strip=s=>{const e=document.createElement('div');e.innerHTML=s||'';return(e.textContent||'').toLowerCase()};
const clean=s=>(s||'').toLowerCase().replace(/\s+/g,' ').trim();
const text=s=>{const e=document.createElement('span');e.textContent=s||'';return e.innerHTML};
const groupName=i=>groups[i][0].split('·').slice(1).join('·').trim()||groups[i][0];
let view=['points','formulas','symbols','map'].includes(location.hash.slice(1))?location.hash.slice(1):'points';
let domain='全部',chapterName='全部',query='';
const pointIndex=new Map(points.map((p,i)=>[p[0],i]));

// 搜索只从给人看的字段建立索引，不把公式解析器的内部名称重新写进页面。
const pointSearch=points.map(p=>clean([p[1],p[2],p[6],p[13],p[11].join(' '),groups[p[12]][0],groups[p[12]][1],...p[3].flat(),...p[4].flat(),...p[5].flat()].map(strip).join(' ')));
const formulas=[];points.forEach((p,i)=>p[3].forEach((f,k)=>formulas.push([i,k,clean([strip(p[1]),strip(f[0]),strip(f[2]),...p[4].map(s=>strip(s[0])+' '+strip(s[1])),groups[p[12]][0]].join(' '))])));
const symbols=[],symbolMap=new Map();points.forEach((p,i)=>p[4].forEach(s=>{const key=s.join('|');if(!symbolMap.has(key)){symbolMap.set(key,symbols.length);symbols.push([s,[i]])}else symbols[symbolMap.get(key)][1].push(i)}));

function matchPoint(i){const p=points[i],g=groups[p[12]];return(domain==='全部'||g[1]===domain)&&(chapterName==='全部'||g[0]===chapterName)&&(!query||pointSearch[i].includes(query))}
function formulaHTML(f){return '<div class="formula"><div class="formula-name">'+f[0]+'</div><div class="math"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block">'+f[1]+'</math></div>'+(f[2]?'<div class="when">适用：'+f[2]+'</div>':'')+'</div>'}
function symbolHTML(s){return '<div class="sym-row"><div class="sym-name">'+s[0]+'</div><div>'+s[1]+'</div><div class="sym-unit">'+s[2]+'</div></div>'}
function errorHTML(e){return '<div class="error"><b>'+e[0]+'</b><p>'+e[1]+'</p></div>'}
function relationHTML(p,i){const before=p[9].map(id=>pointIndex.get(id)).filter(x=>x!==undefined),after=p[10].map(id=>pointIndex.get(id)).filter(x=>x!==undefined);const row=(label,list)=>list.length?'<div class="relation-line"><span>'+label+'</span>'+list.map(j=>'<button data-go="'+j+'">'+points[j][1]+'</button>').join('')+'</div>':'';return before.length||after.length?'<section class="relations"><h3>知识关系</h3>'+row('先理解',before)+row('接着看',after)+'</section>':''}
function pointHTML(i){const p=points[i],g=groups[p[12]],more=p[5].length>2?'<details class="more-errors"><summary>查看其余 '+(p[5].length-2)+' 条常见错误</summary>'+p[5].slice(2).map(errorHTML).join('')+'</details>':'';return '<article class="card" id="'+p[0]+'"><div class="path">'+g[1]+' · '+text(groupName(p[12]))+'</div><h2>'+p[1]+'</h2><p class="definition">'+p[2]+'</p>'+p[13]+'<section class="block"><h3>公式与适用范围</h3><div class="formulas">'+p[3].map(formulaHTML).join('')+'</div></section><section class="block"><h3>容易出错</h3>'+p[5].slice(0,2).map(errorHTML).join('')+more+'</section><section class="block"><h3>符号与单位</h3><div class="symbols"><div class="sym-row head"><div>符号</div><div>含义</div><div>单位</div></div>'+p[4].map(symbolHTML).join('')+'</div></section>'+relationHTML(p,i)+'<details class="deep" data-deep="'+i+'"><summary>深入理解：物理意义、推导和例题</summary><div class="deep-content"></div></details><div class="card-practice"><a href="'+QUIZ_HREF+'#mode=example&amp;point='+encodeURIComponent(p[0])+'&amp;source='+encodeURIComponent(SEGMENT_ROOT+'速查版')+'&amp;return='+encodeURIComponent(RETURN_PAGE+'#'+p[0])+'">练这道题 ↗</a></div></article>'}
function deepHTML(p){const ex=p[8];return '<h3>物理意义</h3><p>'+p[6]+'</p>'+(p[7].length?'<h3>推导要点</h3><ol>'+p[7].map(x=>'<li>'+x+'</li>').join('')+'</ol>':'')+(ex[0]?'<h3>典型例题</h3><p>'+ex[0]+'</p><ol>'+ex[1].map(x=>'<li>'+x+'</li>').join('')+'</ol><p class="answer">答案：'+ex[2]+'</p>':'')}
function renderPoints(){const ids=points.map((_,i)=>i).filter(matchPoint);viewBox.className='list';viewBox.innerHTML=ids.map(pointHTML).join('');return ids.length}
function renderFormulas(){const rows=formulas.filter(row=>matchPoint(row[0])&&(!query||row[2].includes(query)));viewBox.className='index-grid';viewBox.innerHTML=rows.map(([i,k])=>'<article class="index-card"><button class="source" data-go="'+i+'">'+points[i][1]+'</button><h2>'+points[i][3][k][0]+'</h2>'+formulaHTML(points[i][3][k])+'</article>').join('');return rows.length}
function renderSymbols(){const rows=symbols.filter(([s,ids])=>ids.some(matchPoint)&&(!query||clean([strip(s[0]),strip(s[1]),strip(s[2]),...ids.map(i=>strip(points[i][1]))].join(' ')).includes(query)));viewBox.className='symbol-grid';viewBox.innerHTML=rows.map(([s,ids])=>{const target=ids.find(matchPoint);return '<article class="symbol-card"><div class="sym-name">'+s[0]+'</div><p>'+s[1]+'</p><div class="sym-unit">'+s[2]+'</div><button class="source" data-go="'+target+'">'+points[target][1]+(ids.length>1?' 等'+ids.length+'处':'')+'</button></article>'}).join('');return rows.length}
function renderMap(){const gs=groups.map((g,i)=>[g,i]).filter(([g])=>(domain==='全部'||g[1]===domain)&&(chapterName==='全部'||g[0]===chapterName));const domains=[...new Set(gs.map(([g])=>g[1]))];viewBox.className='';viewBox.innerHTML='<div class="map-title"><h2>知识脉络</h2><p>按领域与章节串联知识点；章节顺序是学习建议，点击可打开速查卡。</p></div><div class="map-root">'+SEGMENT_ROOT+'</div>'+domains.map(d=>'<section class="map-domain"><h2>'+d+'<small>'+gs.filter(([g])=>g[1]===d).length+'章</small></h2><div class="map-chapters">'+gs.filter(([g])=>g[1]===d).map(([g,gi])=>'<div class="map-chapter"><button data-chapter-go="'+gi+'">'+text(groupName(gi))+' →</button><div class="map-points">'+g[3].map(i=>'<button class="map-point" data-go="'+i+'">'+points[i][1]+'</button>').join('')+'</div></div>').join('')+'</div></section>').join('');return gs.length}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));let count=view==='points'?renderPoints():view==='formulas'?renderFormulas():view==='symbols'?renderSymbols():renderMap();counter.textContent=view==='map'?'知识脉络':'显示 '+count+' 项';document.getElementById('empty').hidden=count>0}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;history.replaceState(null,'','#'+view);render();window.scrollTo(0,0)}));
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{domain=b.dataset.domain;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()}));
chapter.addEventListener('change',()=>{chapterName=chapter.value;render()});search.addEventListener('input',()=>{query=clean(search.value);if(query&&view==='map'){view='points';history.replaceState(null,'','#points')}render()});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==search){e.preventDefault();search.focus()}});
document.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details[data-deep]')&&d.open){const slot=d.querySelector('.deep-content');if(!slot.dataset.loaded){slot.innerHTML=deepHTML(points[Number(d.dataset.deep)]);slot.dataset.loaded='1'}}},true);
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){const i=Number(go.dataset.go);view='points';domain='全部';chapterName='全部';query='';search.value='';chapter.value='全部';document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.domain==='全部'));render();document.getElementById(points[i][0]).scrollIntoView({behavior:'smooth',block:'start'});return}const ch=e.target.closest('[data-chapter-go]');if(ch){view='points';chapterName=groups[Number(ch.dataset.chapterGo)][0];chapter.value=chapterName;render();window.scrollTo(0,0)}});
render();
// 从练习页回看时，知识点编号是阅读定位，不是视图名称。
function restorePoint(){
  let id;try{id=decodeURIComponent(location.hash.slice(1))}catch(e){return}
  if(pointIndex.has(id)){
    view='points';domain='全部';chapterName='全部';query='';search.value='';chapter.value='全部';
    document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.domain==='全部'));
    render();requestAnimationFrame(()=>{const card=document.getElementById(id);if(card)card.scrollIntoView({behavior:'instant',block:'start'})});
  }else if(['points','formulas','symbols','map'].includes(id)){view=id;render()}
}
// 首次渲染及浏览器恢复页面完成后定位；返回阅读位置无需长距离平滑动画。
restorePoint();window.addEventListener('load',restorePoint);window.addEventListener('hashchange',restorePoint);
})();
</script></body></html>
