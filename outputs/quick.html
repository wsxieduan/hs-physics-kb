>\u003c/mrow>","用有效值描述且功率因数按高中理想模型取 1，U\u003csub>送\u003c/sub> 大于零"],["输电线热损耗功率","\u003cmrow>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmi mathvariant=\"normal\">损\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsup>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi mathvariant=\"normal\">线\u003c/mi>\u003c/msub>\u003cmn>2\u003c/mn>\u003c/msup>&#x22C5;\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi mathvariant=\"normal\">线\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","以输电电流有效值计算两根输电线总电阻上的焦耳热功率"]],[["P\u003csub>送\u003c/sub>","输电系统要输送的有功功率","W"],["U\u003csub>送\u003c/sub>","输电电压的有效值","V"],["I\u003csub>线\u003c/sub>","输电线中的电流有效值","A"],["R\u003csub>线\u003c/sub>","两根输电线的总电阻","Ω"],["P\u003csub>损\u003c/sub>","输电线因发热损失的功率","W"]],[["用输送电压直接除以线路电阻来求输电线电流，写成 I\u003csub>线\u003c/sub>=U\u003csub>送\u003c/sub>/R\u003csub>线\u003c/sub>","输电电压主要加在用户负载和输电系统上，不是全部加在输电线电阻上。高压输电情境中错误式得 5000 A，而由输送功率确定的正确电流仅 10 A。"],["认为输电电压提高两倍，线路损耗只减为一半","功率一定时电流与电压成反比，而损耗又与电流平方成正比，所以电压加倍时损耗应降为四分之一。错误式还存在量纲不一致。"]],"高压输电降低的是线路损耗，不是把电能“放大”。当输送功率一定时，电压提高到原来的 k 倍，电流降为 1/k，线路损耗降为 1/k²。减小线路电阻也能降损耗，但增加导线截面积会大量耗费金属，所以用变压器升高交流电压更经济。",["在高中理想模型中，输送功率写成 P\u003csub>送\u003c/sub>=U\u003csub>送\u003c/sub>·I\u003csub>线\u003c/sub>，移项得 I\u003csub>线\u003c/sub>=P\u003csub>送\u003c/sub>/U\u003csub>送\u003c/sub>。","输电线可看作电阻，焦耳热功率为 P\u003csub>损\u003c/sub>=I\u003csub>线\u003c/sub>²·R\u003csub>线\u003c/sub>。","代入电流关系得 P\u003csub>损\u003c/sub>=P\u003csub>送\u003c/sub>²·R\u003csub>线\u003c/sub>/U\u003csub>送\u003c/sub>²。","因此输送功率和线路电阻不变时，损耗与输电电压的平方成反比，这就是高压输电的定量依据。"],["某线路输送功率 1.0 MW，输电电压 100 kV，两根输电线总电阻为 20 Ω。求线路电流与损耗功率；若电压降为 50 kV，损耗变为多少？",["100 kV 时 I\u003csub>线\u003c/sub>=P\u003csub>送\u003c/sub>/U\u003csub>送\u003c/sub>=1,000,000÷100,000=10 A。","P\u003csub>损\u003c/sub>=I\u003csub>线\u003c/sub>²·R\u003csub>线\u003c/sub>=10²×20=2000 W。","电压降为 50 kV 时，电流加倍为 20 A。","新损耗为 20²×20=8000 W，是原来的四倍。"],"100 kV 时电流为 10 A、损耗 2000 W；50 kV 时损耗增至 8000 W。"],["dc-04","ac-04"],[],["远距离输电","高压输电","线路损耗"],14],["ac-06","电感与电容对交变电流的影响","电感和电容都会影响交变电流。",[["理想电感的感抗","\u003cmrow>\u003cmsub>\u003cmi>X\u003c/mi>\u003cmi>L\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>ω\u003c/mi>&#x22C5;\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi mathvariant=\"normal\">感\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","理想电感接入角频率为 ω 的正弦式交变电流"],["理想电容的容抗","\u003cmrow>\u003cmsub>\u003cmi>X\u003c/mi>\u003cmi>C\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmrow>\u003cmi>ω\u003c/mi>&#x22C5;\u003cmsub>\u003cmi>C\u003c/mi>\u003cmi mathvariant=\"normal\">容\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mrow>","理想电容接入角频率为 ω 的正弦式交变电流，ω 和 C\u003csub>容\u003c/sub> 均大于零"]],[["X\u003csub>L\u003c/sub>","理想电感对正弦交流的感抗","Ω"],["X\u003csub>C\u003c/sub>","理想电容对正弦交流的容抗","Ω"],["ω","交变电流的角频率","rad/s"],["L\u003csub>感\u003c/sub>","电感器的自感系数","H"],["C\u003csub>容\u003c/sub>","电容器的电容","F"]],[["把感抗公式多乘一个系数 2，写成 X\u003csub>L\u003c/sub>=2·ω·L\u003csub>感\u003c/sub>","多出的 2 没有量纲，所以错误式量纲完全正确。工频情境中它会算出约 125.66 Ω，正确感抗约为 62.83 Ω，只能靠数值代入抓住。"],["认为电容像普通电阻一样，频率越高阻碍越强，写成 X\u003csub>C\u003c/sub>=ω·C\u003csub>容\u003c/sub>","正确容抗与角频率成反比；频率加倍时容抗应从约 31.83 Ω 减至约 15.92 Ω。错误式量纲也不是欧姆。"]],"电感具有“通直流、阻交流，通低频、阻高频”的趋势；电容在稳定直流电路中充电后相当于断路，却能让变化电流通过，表现为“隔直流、通交流，通高频、阻低频”。这里的“通”和“阻”都是相对说法，实际电流还取决于电路连接、电阻以及电源电压。",["电感中的电流变化会产生自感电动势，变化越快，自感作用越强，因此感抗随角频率增大。","对正弦交流定量分析得到 X\u003csub>L\u003c/sub>=ω·L\u003csub>感\u003c/sub>。","电容两端电压变化时持续充放电；频率越高，单位时间内充放电越频繁，交流越容易通过。","对正弦交流定量分析得到 X\u003csub>C\u003c/sub>=1/(ω·C\u003csub>容\u003c/sub>)，它与角频率和电容均成反比。"],["角频率为 100·π rad/s 的正弦交流分别接入 0.20 H 理想电感和 100 μF 理想电容。求感抗和容抗，并说明频率加倍后的变化。",["X\u003csub>L\u003c/sub>=ω·L\u003csub>感\u003c/sub>=100·π×0.20=20·π≈62.83 Ω。","100 μF=1.0×10⁻⁴ F，X\u003csub>C\u003c/sub>=1/(ω·C\u003csub>容\u003c/sub>)。","X\u003csub>C\u003c/sub>=1/(100·π×1.0×10⁻⁴)≈31.83 Ω。","频率加倍时，感抗加倍为约 125.66 Ω，容抗减半为约 15.92 Ω。"],"感抗约 62.83 Ω，容抗约 31.83 Ω；频率加倍后感抗加倍、容抗减半。"],["iad-01","cap-01","ac-03"],[],["感抗","容抗","频率响应"],14],["opt-01","光的反射定律","光射到两种介质的分界面后返回原介质，叫光的反射。",[["反射角等于入射角","\u003cmrow>\u003cmsub>\u003cmi>θ\u003c/mi>\u003cmi>r\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>θ\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>","镜面反射和漫反射中的每一条光线，角度均相对法线测量"],["平面镜物距与像距","\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>o\u003c/mi>\u003c/msub>\u003c/mrow>","平面镜成像，物距和像距均取到镜面的垂直距离大小"],["平面镜物像间距","\u003cmrow>\u003cmsub>\u003cmi>D\u003c/mi>\u003cmi mathvariant=\"normal\">物像\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>o\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","物体与虚像分居平面镜两侧，距离均取正值"]],[["θ\u003csub>i\u003c/sub>","入射角，相对法线测量","rad"],["θ\u003csub>r\u003c/sub>","反射角，相对法线测量","rad"],["d\u003csub>o\u003c/sub>","物体到平面镜的垂直距离","m"],["d\u003csub>i\u003c/sub>","虚像到平面镜的垂直距离","m"],["D\u003csub>物像\u003c/sub>","物体与虚像之间的距离","m"]],[["把反射角写成入射角的两倍：θ\u003csub>r\u003c/sub> = 2 θ\u003csub>i\u003c/sub>","反射角本身等于入射角；某些转镜问题中出现的两倍关系，指的是反射光线转过的角度。30° 入射时错误式给出 60°。"],["认为平面镜像距是物距的两倍：d\u003csub>i\u003c/sub> = 2 d\u003csub>o\u003c/sub>","物与像之间的距离才是 2 d\u003csub>o\u003c/sub>；像到镜面的距离仍等于物到镜面的距离。物距 2 m 时错误式给出 4 m。"]],"入射角和反射角都从法线量起，不是从镜面量起。反射定律与光的可逆性相容：把反射光线反向作为入射光线，光会沿原路返回。平面镜成像的物距和像距相等，像是光线反向延长线相交形成的虚像。",["实验改变入射光线方向并测角，发现反射光线始终与入射光线分居法线两侧，且 θ\u003csub>r\u003c/sub> = θ\u003csub>i\u003c/sub>。","平面镜后并没有真实光线会聚；把进入眼睛的反射光线反向延长，延长线在镜后相交，形成虚像。","由反射定律作两条特殊光线，可证明像点与物点关于镜面对称，所以 d\u003csub>i\u003c/sub> = d\u003csub>o\u003c/sub>。"],["一束光以 30° 的入射角射到平面镜上；一个物体同时放在镜前 2.0 m 处。求反射角和像距。",["入射角相对法线测量，已知 θ\u003csub>i\u003c/sub> = 30°。","由反射定律 θ\u003csub>r\u003c/sub> = θ\u003csub>i\u003c/sub>，反射角为 30°。","平面镜成像时像与物关于镜面对称，因此 d\u003csub>i\u003c/sub> = d\u003csub>o\u003c/sub> = 2.0 m。"],"反射角为 30°；像在镜后 2.0 m 处。"],[],["opt-02"],["几何光学","反射定律","平面镜成像"],15],["opt-02","光的折射与折射定律","光从一种介质斜射入另一种介质时，传播方向通常发生改变，这叫折射。",[["由折射角求第二介质折射率","\u003cmrow>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>&#x22C5;\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>r\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/mrow>","光由折射率 n\u003csub>1\u003c/sub> 的均匀介质射向折射率 n\u003csub>2\u003c/sub> 的均匀介质"],["由入射条件求折射角正弦","\u003cmrow>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>r\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>&#x22C5;\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mfrac>\u003c/mrow>","已知两侧折射率和入射角，且确有折射光线"]],[["n\u003csub>1\u003c/sub>","入射介质的折射率","1"],["n\u003csub>2\u003c/sub>","折射介质的折射率","1"],["s\u003csub>i\u003c/sub>","入射角 i 的正弦值","1"],["s\u003csub>r\u003c/sub>","折射角 r 的正弦值","1"]],[["把折射率比例颠倒，写成 s\u003csub>r\u003c/sub> = n\u003csub>2\u003c/sub> s\u003csub>i\u003c/sub> / n\u003csub>1\u003c/sub>","错误式在空气射入玻璃时给出 0.9，而正确值是 0.4；它还错误预言进入高折射率介质会偏离法线。"],["认为折射角总等于入射角，写成 s\u003csub>r\u003c/sub> = s\u003csub>i\u003c/sub>","只有两侧折射率相同或正入射等特殊情形才不改变方向。本情境错误式给出 0.6，正确值为 0.4。"]],"判断偏向法线还是偏离法线，要比较两种介质的折射率：进入折射率更大的介质时，折射角更小，光线偏向法线；进入折射率更小的介质时则偏离法线。正入射时角度为零，方向不偏折，但传播速度仍会改变。",["实验表明，对给定的两种介质，入射角正弦与折射角正弦的比值保持不变。","把介质性质用折射率表示，可写成 n\u003csub>1\u003c/sub> sin i = n\u003csub>2\u003c/sub> sin r。","用 s\u003csub>i\u003c/sub> 和 s\u003csub>r\u003c/sub> 记录两个正弦值，移项得到 s\u003csub>r\u003c/sub> = n\u003csub>1\u003c/sub> s\u003csub>i\u003c/sub> / n\u003csub>2\u003c/sub>；当 n\u003csub>2\u003c/sub> &gt; n\u003csub>1\u003c/sub> 时，s\u003csub>r\u003c/sub> &lt; s\u003csub>i\u003c/sub>，因此折射光偏向法线。"],["光从空气射入折射率为 1.5 的玻璃，入射角的正弦值为 0.6。求折射角的正弦值，并判断光线向哪边偏折。",["空气折射率近似取 n\u003csub>1\u003c/sub> = 1.0，玻璃折射率 n\u003csub>2\u003c/sub> = 1.5。","由折射定律 s\u003csub>r\u003c/sub> = n\u003csub>1\u003c/sub> s\u003csub>i\u003c/sub> / n\u003csub>2\u003c/sub>。","代入得 s\u003csub>r\u003c/sub> = 1.0 × 0.6 / 1.5 = 0.4。","0.4 &lt; 0.6，折射角小于入射角，光线偏向法线。"],"折射角的正弦值为 0.4，光线偏向法线。"],["opt-01"],["opt-03"],["几何光学","折射定律","斯涅尔定律"],15],["opt-03","折射率与光速的关系","介质的绝对折射率 n 等于真空光速 c 与光在该介质中速度 v 的比值，即 n = c/v。",[["绝对折射率","\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>c\u003c/mi>\u003cmi>v\u003c/mi>\u003c/mfrac>\u003c/mrow>","比较真空光速与光在均匀介质中的速度"],["介质中的波长","\u003cmrow>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmi>n\u003c/mi>\u003c/mfrac>\u003c/mrow>","光从真空进入介质，频率保持不变"]],[["n","介质的绝对折射率","1"],["c","真空中的光速","m/s"],["v","光在介质中的传播速度","m/s"],["L\u003csub>0\u003c/sub>","真空中的波长","m"],["L\u003csub>m\u003c/sub>","介质中的波长","m"]],[["把折射率写反为 n = v/c","玻璃中光速小于真空光速，写反会得到 2/3，小于 1；正确折射率是 1.5。两式量纲都正确，只能靠数值和物理范围抓住。"],["认为进入介质后波长增大，写成 L\u003csub>m\u003c/sub> = n L\u003csub>0\u003c/sub>","频率不变而速度降低，波长应缩短。错误式给出 900 nm，正确值为 400 nm。"]],"折射率没有单位，表示介质使光速降低的程度。真空中 n = 1，普通透明介质的 n 通常大于 1。跨越分界面时由光源决定的频率连续不变，所以 v = f λ 中速度的变化必须由波长变化来配合。",["绝对折射率按定义为 n = c/v，两种速度单位相同，因此 n 是无量纲量。","光跨过静止分界面时频率 f 不变；分别写出真空中 c = f L\u003csub>0\u003c/sub> 和介质中 v = f L\u003csub>m\u003c/sub>。","两式相除得 c/v = L\u003csub>0\u003c/sub>/L\u003csub>m\u003c/sub> = n，因此 L\u003csub>m\u003c/sub> = L\u003csub>0\u003c/sub>/n。"],["某玻璃的折射率为 1.5，一束真空波长为 600 nm 的单色光进入玻璃。取 c = 3.0×10⁸ m/s，求光在玻璃中的速度和波长。",["由 n = c/v 得 v = c/n = 3.0×10⁸ / 1.5 = 2.0×10⁸ m/s。","光进入玻璃时频率不变，所以 L\u003csub>m\u003c/sub> = L\u003csub>0\u003c/sub>/n。","L\u003csub>m\u003c/sub> = 600 nm / 1.5 = 400 nm。"],"光速为 2.0×10⁸ m/s，玻璃中波长为 400 nm。"],["opt-02"],["opt-04"],["几何光学","折射率","光速","波长"],15],["opt-04","全反射与临界角","光从折射率较大的介质射向折射率较小的介质，并且入射角大于临界角时，折射光完全消失，只剩反射光，这叫全反射。",[["临界角的正弦","\u003cmrow>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>C\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mfrac>\u003c/mrow>","光由 n\u003csub>1\u003c/sub> 较大的介质射向 n\u003csub>2\u003c/sub> 较小的介质，且 n\u003csub>1\u003c/sub> &gt; n\u003csub>2\u003c/sub>"],["光纤数值孔径","\u003cmrow>\u003cmi mathvariant=\"normal\">NA\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsqrt>\u003cmrow>\u003cmsup>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>−\u003c/mo>\u003cmsup>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/msqrt>\u003c/mrow>","光从空气耦合进入阶跃型光纤，纤芯折射率 n\u003csub>1\u003c/sub> 大于包层折射率 n\u003csub>2\u003c/sub>"]],[["n\u003csub>1\u003c/sub>","入射侧或光纤纤芯的折射率","1"],["n\u003csub>2\u003c/sub>","折射侧或光纤包层的折射率","1"],["s\u003csub>C\u003c/sub>","临界角 C 的正弦值","1"],["NA","光纤的数值孔径","1"]],[["把临界角关系写反为 s\u003csub>C\u003c/sub> = n\u003csub>1\u003c/sub>/n\u003csub>2\u003c/sub>","因为 n\u003csub>1\u003c/sub> &gt; n\u003csub>2\u003c/sub>，写反后得到 1.0714，大于正弦值上限 1，物理上不可能；正确值为 14/15。"],["数值孔径漏掉平方根，写成 NA = n\u003csub>1\u003c/sub>² − n\u003csub>2\u003c/sub>²","错误式给出 0.29，正确值应为 √(0.29) 约 0.538516。量纲都是无量纲，必须数值检验。"]],"全反射有两个缺一不可的条件：必须从光密介质射向光疏介质，即 n\u003csub>1\u003c/sub> &gt; n\u003csub>2\u003c/sub>；入射角还必须大于临界角 C。等于 C 时折射光沿界面传播，尚未完全消失。光纤利用纤芯折射率高于包层，使光在界面多次全反射。",["临界状态下折射光沿界面传播，折射角为 90°，所以折射定律给出 n\u003csub>1\u003c/sub> s\u003csub>C\u003c/sub> = n\u003csub>2\u003c/sub>。","移项得到 s\u003csub>C\u003c/sub> = n\u003csub>2\u003c/sub>/n\u003csub>1\u003c/sub>。只有 n\u003csub>1\u003c/sub> &gt; n\u003csub>2\u003c/sub> 时右边小于 1，临界角才存在。","阶跃型光纤在空气中的数值孔径可由入射端折射和纤芯—包层界面的全反射条件联立得到 NA = √(n\u003csub>1\u003c/sub>²−n\u003csub>2\u003c/sub>²)。"],["某阶跃型光纤的纤芯折射率为 1.5，包层折射率为 1.4。求纤芯射向包层时临界角正弦值和光纤数值孔径。",["纤芯折射率较大，满足形成全反射的介质方向条件。","s\u003csub>C\u003c/sub> = n\u003csub>2\u003c/sub>/n\u003csub>1\u003c/sub> = 1.4/1.5 = 14/15，约为 0.9333。","NA = √(n\u003csub>1\u003c/sub>²−n\u003csub>2\u003c/sub>²) = √(2.25−1.96) = √(0.29)，约为 0.5385。"],"临界角正弦值约为 0.9333；数值孔径约为 0.5385。"],["opt-02","opt-03"],["opt-05"],["几何光学","全反射","临界角","光纤"],15],["opt-05","光的色散","复色光通过棱镜等介质后分解成不同颜色的光，叫光的色散。",[["薄棱镜对蓝光的偏向角","\u003cmrow>\u003cmsub>\u003cmi>Δ\u003c/mi>\u003cmi>b\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmi>b\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>&#x22C5;\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/mrow>","棱镜顶角和入射、折射角均较小，可采用小角近似"],["薄棱镜的色散角","\u003cmrow>\u003cmsub>\u003cmi>Δ\u003c/mi>\u003cmi mathvariant=\"normal\">分离\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmi>b\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmi>r\u003c/mi>\u003c/msub>\u003c/mrow>&#x22C5;\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/mrow>","同一薄棱镜分开蓝光和红光，采用小角近似且 n\u003csub>b\u003c/sub> &gt; n\u003csub>r\u003c/sub>"]],[["n\u003csub>b\u003c/sub>","棱镜对蓝光的折射率","1"],["n\u003csub>r\u003c/sub>","棱镜对红光的折射率","1"],["A","薄棱镜的顶角","rad"],["Δ\u003csub>b\u003c/sub>","蓝光通过薄棱镜后的偏向角","rad"],["Δ\u003csub>r\u003c/sub>","红光通过薄棱镜后的偏向角","rad"],["Δ\u003csub>分离\u003c/sub>","蓝光与红光出射方向的角分离","rad"]],[["薄棱镜偏向角漏掉减 1，写成 Δ\u003csub>b\u003c/sub> = n\u003csub>b\u003c/sub> A","错误式给出 1.53×0.1 = 0.153 rad，正确小角近似值为 0.053 rad。两式量纲相同，数值检验才能发现。"],["把折射率差顺序写反，认为红光比蓝光偏折更大","错误式得到 −0.002 rad，不但符号相反，也违背普通玻璃中蓝光折射率更大、偏折更强的事实。"]],"色散来自折射率随光的频率或真空波长而变化，不是不同颜色在真空中的光速不同。薄棱镜近似下，折射率差会直接转化为角分离：蓝光折射率更大，所以蓝光偏向角更大，蓝红两光的夹角与 n\u003csub>b\u003c/sub>−n\u003csub>r\u003c/sub> 成正比。",["对顶角很小的棱镜，把折射定律作小角近似，可得单色光偏向角等于 (n−1)A。","蓝光偏向角为 Δ\u003csub>b\u003c/sub> = (n\u003csub>b\u003c/sub>−1)A，红光偏向角为 Δ\u003csub>r\u003c/sub> = (n\u003csub>r\u003c/sub>−1)A。","两式相减，得到色散角 Δ\u003csub>分离\u003c/sub> = Δ\u003csub>b\u003c/sub>−Δ\u003csub>r\u003c/sub> = (n\u003csub>b\u003c/sub>−n\u003csub>r\u003c/sub>)A。普通玻璃中 n\u003csub>b\u003c/sub> &gt; n\u003csub>r\u003c/sub>，所以蓝光偏折更大。"],["一薄棱镜顶角 A = 0.1 rad，对蓝光和红光的折射率分别为 1.53 和 1.51。用薄棱镜近似求两色光各自的偏向角及角分离。",["蓝光偏向角 Δ\u003csub>b\u003c/sub> = (1.53−1)×0.1 = 0.053 rad。","红光偏向角 Δ\u003csub>r\u003c/sub> = (1.51−1)×0.1 = 0.051 rad。","角分离 Δ\u003csub>分离\u003c/sub> = Δ\u003csub>b\u003c/sub>−Δ\u003csub>r\u003c/sub> = 0.002 rad，也可由 (1.53−1.51)×0.1 直接得到。"],"蓝光偏向 0.053 rad，红光偏向 0.051 rad，角分离为 0.002 rad。"],["opt-02","opt-03"],[],["几何光学","色散","薄棱镜","折射率"],15],["wop-01","光的干涉与双缝条纹","频率相同、相位差恒定的两列光波叠加，会形成稳定的明暗相间条纹。",[["双缝干涉条纹间距","\u003cmrow>\u003cmsub>\u003cmi>Δ\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>L\u003c/mi>&#x22C5;\u003cmi>λ\u003c/mi>\u003c/mrow>\u003cmi>d\u003c/mi>\u003c/mfrac>\u003c/mrow>","双缝间距远小于屏距、使用单色相干光且观察近轴条纹"],["第 m\u003csub>级\u003c/sub> 级亮纹位置","\u003cmrow>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi mathvariant=\"normal\">级\u003c/mi>\u003c/msub>&#x22C5;\u003cmsub>\u003cmi>Δ\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","从中央亮纹向一侧计数，m\u003csub>级\u003c/sub> 为非负整数"]],[["L","双缝到观察屏的距离","m"],["λ","单色光的波长","m"],["d","两条狭缝中心之间的距离","m"],["Δ\u003csub>x\u003c/sub>","相邻同类条纹的间距","m"],["m\u003csub>级\u003c/sub>","亮条纹级次，中央亮纹取零级","1"],["x\u003csub>m\u003c/sub>","第 m\u003csub>级\u003c/sub> 级亮纹到中央亮纹的距离","m"]],[["把双缝条纹间距写成 Δ\u003csub>x\u003c/sub> = d λ / L","错误式把 L 与 d 颠倒后量纲仍是长度，所以量纲检查抓不到。本情境算出 1.2×10⁻¹⁰ m，而正确值是 0.003 m。"],["认为双缝间距越大，干涉条纹越疏","正确关系中 d 在分母，双缝间距增大应使条纹变密。错误式在本情境给出 4.8×10⁻¹⁰ m，也与实测 0.003 m 不符。"]],"干涉条纹不是两束光各自留下的痕迹，而是电场周期性叠加后的强弱分布。条纹间距与波长、屏距成正比，与双缝间距成反比；因此红光比蓝光的条纹更疏，屏移远后条纹更疏，双缝分得更开后条纹反而更密。这里的 m\u003csub>级\u003c/sub> 是从中央亮纹起计的级次，中央亮纹为零级。",["屏上某点到两缝的路程差等于波长的整数倍时，两列光同相叠加形成亮纹。","在 L 远大于 d 的近轴条件下，相邻亮纹对应的路程差增加一个波长，由相似三角形得到 Δ\u003csub>x\u003c/sub> = L λ / d。","中央亮纹取 m\u003csub>级\u003c/sub> = 0；向一侧每跨过一个间距，级次增加 1，所以 x\u003csub>m\u003c/sub> = m\u003csub>级\u003c/sub> Δ\u003csub>x\u003c/sub>。"],["用波长 600 nm 的单色光做双缝干涉实验，双缝间距 0.40 mm，屏到双缝的距离 2.0 m。求条纹间距和第三级亮纹到中央亮纹的距离。",["统一单位：λ = 6.0×10⁻⁷ m，d = 4.0×10⁻⁴ m。","Δ\u003csub>x\u003c/sub> = L λ / d = 2.0×6.0×10⁻⁷÷4.0×10⁻⁴ = 3.0×10⁻³ m。","x\u003csub>m\u003c/sub> = 3 Δ\u003csub>x\u003c/sub> = 9.0×10⁻³ m。"],"条纹间距为 3.0 mm；第三级亮纹距中央亮纹 9.0 mm。"],["osc-06"],["wop-02"],["波动光学","光的干涉","双缝实验","条纹间距"],16],["wop-02","光的衍射","光绕过障碍物边缘或通过狭缝后偏离直线传播并进入几何阴影区的现象叫衍射。",[["单缝第一暗纹条件","\u003cmrow>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi>θ\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>λ\u003c/mi>\u003cmi>a\u003c/mi>\u003c/mfrac>\u003c/mrow>","夫琅禾费单缝衍射，求第一暗纹方向且 λ 不大于 a"],["单缝中央亮纹宽度","\u003cmrow>\u003cmi>w\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmrow>\u003cmn>2\u003c/mn>&#x2062;\u003cmi>L\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>λ\u003c/mi>\u003c/mrow>\u003cmi>a\u003c/mi>\u003c/mfrac>\u003c/mrow>","第一暗纹角度较小，屏距远大于缝宽，可用小角近似"]],[["λ","单色光的波长","m"],["a","单缝宽度","m"],["θ","第一暗纹对应的衍射角","rad"],["s\u003csub>θ\u003c/sub>","第一暗纹衍射角 θ 的正弦值","1"],["L","单缝到观察屏的距离","m"],["w","中央亮纹的近似宽度","m"]],[["把第一暗纹条件写反为 s\u003csub>θ\u003c/sub> = a/λ","本情境会得到 20，大于正弦值上限 1，物理上不可能；正确值为 0.05。"],["计算中央亮纹宽度时漏掉两侧，写成 w = L λ/a","L λ/a 只是中央点到一侧第一暗纹的距离。错误式得到 0.06 m，完整中央亮纹宽度应为 0.12 m。"]],"任何波都能衍射，只是当孔或障碍物尺度与波长相近时现象更显著。单缝越窄，光扩展得越开，中央亮纹越宽；这不是缝在屏上的几何像。中央亮纹宽度约为其他亮纹的两倍，是单缝衍射图样最醒目的结构特征。",["把单缝内各处看成次波源；在第一暗纹方向上，可以把缝分成两半，使两半中成对次波的程差为半个波长并相互抵消。","第一暗纹条件为 a sin(θ) = λ，因此 s\u003csub>θ\u003c/sub> = λ/a。","第一暗纹在中央两侧各出现一次；小角近似下单侧距离约为 L λ/a，所以中央亮纹总宽度 w = 2L λ/a。"],["波长 500 nm 的单色光照射宽 10 micrometre 的单缝，屏距 1.2 m。求第一暗纹衍射角的正弦值和中央亮纹的近似宽度。",["统一单位：λ = 5.0×10⁻⁷ m，a = 1.0×10⁻⁵ m。","s\u003csub>θ\u003c/sub> = λ/a = 0.05。此时衍射角约为 2.9°，符合小角近似条件。","w = 2L λ/a = 2×1.2×0.05 = 0.12 m。"],"第一暗纹衍射角的正弦值为 0.05；中央亮纹宽度约为 0.12 m。"],["osc-06"],["wop-03"],["波动光学","光的衍射","单缝衍射","中央亮纹"],16],["wop-03","光的偏振","偏振片只允许沿透振方向的电场分量通过。",[["自然光通过理想偏振片","\u003cmrow>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi mathvariant=\"normal\">入\u003c/mi>\u003c/msub>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/mrow>","自然光垂直入射理想偏振片，不计吸收和反射损失"],["马吕斯定律","\u003cmrow>\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msub>&#x22C5;\u003cmsup>\u003cmsub>\u003cmi>c\u003c/mi>\u003cmi>θ\u003c/mi>\u003c/msub>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mrow>","线偏振光垂直入射理想检偏器，c\u003csub>θ\u003c/sub> 为两偏振方向夹角的余弦"]],[["I\u003csub>入\u003c/sub>","入射自然光的相对光强","1"],["I\u003csub>p\u003c/sub>","自然光通过第一片理想偏振片后的相对光强","1"],["θ","检偏器透振方向与入射线偏振方向的夹角","rad"],["c\u003csub>θ\u003c/sub>","夹角 θ 的余弦值","1"],["I","线偏振光通过检偏器后的相对光强","1"]],[["认为自然光通过第一片理想偏振片后光强不变","第一片偏振片只保留一个方向的电场投影，理想情况下平均光强减半。本情境错误式给出 1.0，正确值为 0.5。"],["马吕斯定律漏掉平方，写成 I = I\u003csub>p\u003c/sub> c\u003csub>θ\u003c/sub>","余弦作用在电场振幅上，光强还要再平方。本情境错误式给出 0.30，正确值为 0.18。"]],"自然光的电场振动方向在垂直传播方向的平面内随机分布，第一片理想偏振片平均保留一半光强。第二片偏振片是否透光取决于两片透振方向夹角：平行时最亮，垂直时理想情况下完全消光。光强不是按余弦一次方变化，而是电场分量先乘余弦、光强再与振幅平方成正比。",["自然光在垂直传播方向的各个振动方向上均匀分布；通过理想偏振片后，电场平方投影的平均值为原来的一半，因此 I\u003csub>p\u003c/sub> = I\u003csub>入\u003c/sub>/2。","线偏振光通过检偏器时，透射电场振幅是原振幅在透振方向的投影，即乘以 c\u003csub>θ\u003c/sub>。","光强与电场振幅的平方成正比，所以透射光强乘以 c\u003csub>θ\u003c/sub>²，得到 I = I\u003csub>p\u003c/sub> c\u003csub>θ\u003c/sub>²。"],["相对光强为 1.0 的自然光依次垂直通过两片理想偏振片，两片透振方向夹角的余弦为 0.6。求通过第一片和第二片后的相对光强。",["自然光通过第一片理想偏振片后 I\u003csub>p\u003c/sub> = I\u003csub>入\u003c/sub>/2 = 0.5。","由马吕斯定律 I = I\u003csub>p\u003c/sub> c\u003csub>θ\u003c/sub>²。","I = 0.5×0.6² = 0.5×0.36 = 0.18。"],"通过第一片后相对光强为 0.5；通过第二片后为 0.18。"],[],["wop-04"],["波动光学","偏振","横波","马吕斯定律"],16],["wop-04","光的电磁本性","光是电磁波，真空中的传播速度 c、真空波长 λ 和频率 f 满足 c = λ f。",[["真空中光速关系","\u003cmrow>\u003cmi>c\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>λ\u003c/mi>&#x22C5;\u003cmi>f\u003c/mi>\u003c/mrow>\u003c/mrow>","光在真空中传播，λ 取真空波长"],["频率与周期","\u003cmrow>\u003cmi>T\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmi>f\u003c/mi>\u003c/mfrac>\u003c/mrow>","任何周期性电磁振动，f 大于零"]],[["c","真空中的光速","m/s"],["λ","光在真空中的波长","m"],["f","光的频率","Hz"],["T","电磁振动的周期","s"]],[["把一个周期传播一个波长误记成传播两个波长，写成 c = 2 λ f","错误式与正确式量纲完全相同，量纲检查抓不到；本情境会算出 6.0×10⁸ m/s，而真空光速应为 3.0×10⁸ m/s。"],["把周期写成 T = f，混淆互为倒数的两个物理量","周期单位是 s，频率单位是 Hz，即 1/s，量纲不同；绿光周期约为 1.67×10⁻¹⁵ s，不是 6.0×10¹⁴ s。"]],"麦克斯韦理论预言电磁扰动的传播速度等于当时测得的光速，赫兹实验随后证实了电磁波的存在。光跨越介质分界面时频率由光源决定而保持不变，介质中的速度和波长会改变；本知识点的 c = λ f 专指真空量。波长越短，频率越高，但不能据此认为不同颜色的光在真空中速度不同。",["周期波在一个周期 T 内向前传播一个波长 λ，因此传播速度 c = λ/T。","频率与周期互为倒数：f = 1/T。代入速度式得到 c = λ f。","电磁波在真空中的传播速度由真空电磁性质决定；不同频率的电磁波都服从同一速度关系。"],["某绿光在真空中的波长为 500 nm，取真空光速 c = 3.0×10⁸ m/s。求它的频率和周期。",["把波长换成国际单位：λ = 5.0×10⁻⁷ m。","由 c = λ f 得 f = c/λ = 3.0×10⁸÷5.0×10⁻⁷ = 6.0×10¹⁴ Hz。","T = 1/f = 1÷6.0×10¹⁴，约为 1.67×10⁻¹⁵ s。"],"频率为 6.0×10¹⁴ Hz；周期约为 1.67×10⁻¹⁵ s。"],["osc-06","opt-03"],[],["波动光学","电磁波","光速","频率","波长"],16],["mgas-01","分子动理论的基本内容与微观量估算","物质由大量分子组成，分子永不停息地做无规则运动，分子之间存在相互作用。",[["由总体积估算分子数","\u003cmrow>\u003cmi>N\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmi mathvariant=\"normal\">总\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmi mathvariant=\"normal\">分子\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/mrow>","总体积可视为 N 个分子平均占据体积之和"],["分子体积的立方体近似","\u003cmrow>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmi mathvariant=\"normal\">分子\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>d\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msup>\u003c/mrow>","只做数量级估算，把每个分子平均占据的空间近似为边长 d 的小立方体"]],[["V\u003csub>总\u003c/sub>","所有分子占据的总体积","m³"],["V\u003csub>分子\u003c/sub>","单个分子平均占据的体积","m³"],["N","分子数目","1"],["d","分子线度的估计值","m"]],[["把分子数写成 N = V\u003csub>分子\u003c/sub>/V\u003csub>总\u003c/sub>","分子数应是总体积除以单分子体积。错误式在本情境得到 10⁻²²，而不是 10²²，量纲虽同为无量纲但数量级完全相反。"],["由分子线度估体积时写成 V\u003csub>分子\u003c/sub> = d²","面积不是体积，d² 的量纲是 L²，而单分子体积的量纲是 L³。"]],"微观粒子不能逐个直接计数，但可以用宏观总体积除以单个分子体积来估算数目。这里的立方体模型只是数量级估算，不表示真实分子一定是立方体；所得线度通常在 10⁻¹⁰ m 的数量级。布朗运动是悬浮微粒的无规则运动，它间接反映液体分子的热运动，不是液体分子本身的运动轨迹。",["把宏观样品近似看成 N 个相同微观单元组成，总体积约为 N V\u003csub>分子\u003c/sub>。","将总体积关系变形，得到 N = V\u003csub>总\u003c/sub> / V\u003csub>分子\u003c/sub>。","若每个分子平均占据边长为 d 的小立方体，则 V\u003csub>分子\u003c/sub> = d³；该模型只用于数量级估算。"],["某油滴形成单分子油膜，油的总体积为 1.0×10⁻⁸ m³。若估计一个分子平均占据 1.0×10⁻³⁰ m³，求分子数，并估算分子线度。",["分子数 N = V\u003csub>总\u003c/sub>/V\u003csub>分子\u003c/sub> = 10⁻⁸/10⁻³⁰ = 10²²。","把单分子占据空间近似为小立方体，V\u003csub>分子\u003c/sub> = d³。","因为 (10⁻¹⁰)³ = 10⁻³⁰，所以 d = 1.0×10⁻¹⁰ m。"],"约有 1.0×10²² 个分子，分子线度约为 1.0×10⁻¹⁰ m。"],[],["mgas-02"],["分子动理论","油膜法","数量级估算","布朗运动"],17],["mgas-02","分子间作用力与分子势能","分子间同时存在吸引作用和排斥作用，两者都随距离减小而增强，但排斥作用在很近时增长得更快。",[["分子间合力的一维表示","\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi mathvariant=\"normal\">合\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi mathvariant=\"normal\">斥\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi mathvariant=\"normal\">引\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","只比较同一直线上的排斥与吸引作用，并把间距增大方向取正"],["分子力做功与势能变化","\u003cmrow>\u003cmsub>\u003cmi>ΔE\u003c/mi>\u003cmi>p\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi mathvariant=\"normal\">分子\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","只考察分子力这一保守力做功所引起的分子势能变化"]],[["F\u003csub>合\u003c/sub>","沿分子间距增大方向的合力","N"],["F\u003csub>斥\u003c/sub>","排斥作用的大小","N"],["F\u003csub>引\u003c/sub>","吸引作用的大小","N"],["ΔE\u003csub>p\u003c/sub>","分子势能的变化量","J"],["W\u003csub>分子\u003c/sub>","分子力所做的功","J"]],[["求分子间合力时把吸引与排斥的大小直接相加","吸引与排斥方向相反，应作差而不是相加。两种写法量纲完全相同；把错误结果与正确合力作无量纲比值，本情境得到 2.2 而不是 1，可由数值代入抓住。"],["把势能变化写成 ΔE\u003csub>p\u003c/sub> = W\u003csub>分子\u003c/sub>","保守力做正功时势能应减少。本情境错误式给出正的 2.5×10⁻²⁰ J，与正确的负值符号相反；该微观能量远小于陷阱测试的固定绝对容差，不能诚实声称会被自动抓住。"]],"在平衡距离附近，吸引与排斥大小相等，合力为零，分子势能最低。距离小于平衡距离时排斥占优，分子趋向分开；距离略大于平衡距离时吸引占优，分子趋向靠近。合力为零不等于分子间没有作用，而是两种作用恰好抵消。",["分子间的合作用可视为排斥与吸引两种作用竞争的结果。","选定正方向后，同向量取正、反向量取负，所以 F\u003csub>合\u003c/sub> = F\u003csub>斥\u003c/sub> - F\u003csub>引\u003c/sub>。","分子力是保守力，保守力做正功时势能减少，做负功时势能增加，因此 ΔE\u003csub>p\u003c/sub> = -W\u003csub>分子\u003c/sub>。"],["两分子距离小于平衡距离，排斥作用大小为 8.0×10⁻⁹ N，吸引作用大小为 3.0×10⁻⁹ N。若随后分子力做正功 2.5×10⁻²⁰ J，求初始合力及分子势能变化。",["取分子间距增大方向为正，F\u003csub>合\u003c/sub> = F\u003csub>斥\u003c/sub>-F\u003csub>引\u003c/sub>。","F\u003csub>合\u003c/sub> = 8.0×10⁻⁹-3.0×10⁻⁹ = 5.0×10⁻⁹ N，方向使分子分开。","ΔE\u003csub>p\u003c/sub> = -W\u003csub>分子\u003c/sub> = -2.5×10⁻²⁰ J。"],"合力为 5.0×10⁻⁹ N，指向间距增大方向；分子势能减少 2.5×10⁻²⁰ J。"],["mgas-01"],["mgas-03"],["分子力","平衡距离","分子势能","保守力"],17],["mgas-03","温度与温标","热力学温度 T 与摄氏温度的数值 t\u003csub>C\u003c/sub> 相差一个固定零点：T = t\u003csub>C\u003c/sub> + T0，其中 T0 近似取 273.15 K。",[["摄氏温度换算为热力学温度","\u003cmrow>\u003cmi>T\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmi>C\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmi mathvariant=\"normal\">T0\u003c/mi>\u003c/mrow>\u003c/mrow>","把摄氏温度数值换算为开尔文温度，T0 取 273.15 K"],["热力学温度变化量","\u003cmrow>\u003cmsub>\u003cmi>Δ\u003c/mi>\u003cmi>T\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">T2\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi mathvariant=\"normal\">T1\u003c/mi>\u003c/mrow>\u003c/mrow>","比较同一物体初、末状态的热力学温度"]],[["T","热力学温度","K"],["t\u003csub>C\u003c/sub>","摄氏温度的数值；换算时按与 K 等大的温度间隔处理","K"],["T0","摄氏零度对应的热力学温度","K"],["T1","初态热力学温度","K"],["T2","末态热力学温度","K"],["Δ\u003csub>T\u003c/sub>","温度变化量","K"]],[["把 26.85 ℃直接当成 26.85 K 代入气体定律","两种温标零点不同。本情境正确温度是 300 K，直接使用摄氏数值会把绝对温度低估十倍以上。"],["换算时写成 T = t\u003csub>C\u003c/sub>-273.15","应当加上零点偏移。本情境错误式得到 -246.3 K，不但数值错误，还违反热力学温度不得为负的物理限制。"]],"温度是大量分子热运动剧烈程度的宏观标志。0 ℃不是热运动停止，绝对零度才是热力学温标的理论下限。摄氏温度可以为负，热力学温度不能低于 0 K；温度变为原来的两倍，必须针对开尔文数值而言，不能直接把摄氏温度数值乘二。",["热力学温标与摄氏温标每一度的大小相同，只是零点不同。","摄氏零度对应 273.15 K，因此换算式为 T = t\u003csub>C\u003c/sub> + 273.15 K。","求温差时固定零点相减抵消，所以两种温标的温差数值相同。"],["实验室温度为 26.85 ℃，将气体从 280 K 加热到 350 K。求室温对应的热力学温度和加热过程的温差。",["T = t\u003csub>C\u003c/sub>+273.15 = 26.85+273.15 = 300.00 K。","Δ\u003csub>T\u003c/sub> = T2-T1 = 350-280 = 70 K。","温差也可说是 70 ℃，但代入气体状态关系的绝对温度必须写 280 K 和 350 K。"],"室温为 300 K，加热过程的温差为 70 K。"],["mgas-02"],["mgas-04"],["热力学温度","摄氏温度","开尔文","温标换算"],17],["mgas-04","物体的内能与理想气体内能","物体中所有分子热运动动能与分子势能的总和叫作物体的内能。",[["单原子理想气体的内能","\u003cmrow>\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmrow>\u003cmn>1.5\u003c/mn>&#x2062;\u003cmi>N\u003c/mi>\u003c/mrow>&#x22C5;\u003cmsub>\u003cmi>k\u003c/mi>\u003cmi>B\u003c/mi>\u003c/msub>\u003c/mrow>&#x22C5;\u003cmi>T\u003c/mi>\u003c/mrow>\u003c/mrow>","一定数量的单原子理想气体，分子平动自由度为三个"],["单原子理想气体的内能变化","\u003cmrow>\u003cmsub>\u003cmi>Δ\u003c/mi>\u003cmi>U\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmrow>\u003cmn>1.5\u003c/mn>&#x2062;\u003cmi>N\u003c/mi>\u003c/mrow>&#x22C5;\u003cmsub>\u003cmi>k\u003c/mi>\u003cmi>B\u003c/mi>\u003c/msub>\u003c/mrow>&#x22C5;\u003cmrow>\u003cmi mathvariant=\"normal\">T2\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi mathvariant=\"normal\">T1\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/mrow>","同一份单原子理想气体从温度 T1 变化到 T2"]],[["U","单原子理想气体的内能","J"],["Δ\u003csub>U\u003c/sub>","内能变化量","J"],["N","气体分子数","1"],["k\u003csub>B\u003c/sub>","玻尔兹曼常量","J/K"],["T","热力学温度","K"],["T1","初态热力学温度","K"],["T2","末态热力学温度","K"],["Δ\u003csub>T\u003c/sub>","升温过程的热力学温度变化量","K"]],[["漏掉系数 3/2，写成 U = Nk\u003csub>B\u003c/sub> T","错误式量纲仍为能量，量纲检查抓不到。本情境只算得 828 J，而正确内能是 1242 J。"],["认为温度相同的所有物体内能必定相同","内能还与分子数、物态和分子间势能等因素有关；温度只反映热运动的平均剧烈程度。这是适用条件判断，需人工审核。"]],"温度反映分子平均动能，但内能还取决于物质的量和分子间势能，因此两个温度相同的物体内能未必相同。单原子理想气体的内能只由温度和分子数决定，与体积、压强分别取何值无关；这个结论不能直接套给液体、固体或有转动振动自由度的实际气体。",["单原子理想气体每个分子的平均平动动能为 3k_B T/2。","理想气体忽略分子间势能，N 个分子的总内能为 N 倍平均动能。","同一份气体的末态内能减初态内能，提取公因子后得到 Δ\u003csub>U\u003c/sub> = 3Nk_B(T2-T1)/2。"],["一份单原子理想气体含 2.0×10²³ 个分子，取 k\u003csub>B\u003c/sub>=1.38×10⁻²³ J/K。求 300 K 时的内能，以及升温到 400 K 时内能的增加量。",["U = 1.5Nk_B T = 1.5×2.0×10²³×1.38×10⁻²³×300 = 1242 J。","温差为 400-300 = 100 K。","Δ\u003csub>U\u003c/sub> = 1.5Nk_B Δ\u003csub>T\u003c/sub> = 1.5×2.76×100 = 414 J。"],"300 K 时内能为 1242 J；升温后内能增加 414 J。"],["mgas-03"],["mgas-05"],["内能","理想气体","分子平均动能","玻尔兹曼常量"],17],["mgas-05","气体实验定律","一定质量的理想气体，在温度不变时满足玻意耳定律 p1V1=p2V2；在压强不变时满足查理定律 V1/T1=V2/T2；在体积不变时满足盖-吕萨克定律 p1/T1=p2/T2。",[["玻意耳定律","\u003cmrow>\u003cmi mathvariant=\"normal\">p2\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">p1\u003c/mi>&#x22C5;\u003cmi mathvariant=\"normal\">V1\u003c/mi>\u003c/mrow>\u003cmi mathvariant=\"normal\">V2\u003c/mi>\u003c/mfrac>\u003c/mrow>","一定质量的理想气体发生等温变化，且初末态均为平衡态"],["查理定律","\u003cmrow>\u003cmi mathvariant=\"normal\">V2\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">V1\u003c/mi>&#x22C5;\u003cmi mathvariant=\"normal\">T2\u003c/mi>\u003c/mrow>\u003cmi mathvariant=\"normal\">T1\u003c/mi>\u003c/mfrac>\u003c/mrow>","一定质量的理想气体发生等压变化，温度使用开尔文"],["盖-吕萨克定律","\u003cmrow>\u003cmi mathvariant=\"normal\">p2\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">p1\u003c/mi>&#x22C5;\u003cmi mathvariant=\"normal\">T2\u003c/mi>\u003c/mrow>\u003cmi mathvariant=\"normal\">T1\u003c/mi>\u003c/mfrac>\u003c/mrow>","一定质量的理想气体发生等容变化，温度使用开尔文"]],[["p1","初态压强","Pa"],["p2","末态压强","Pa"],["V1","初态体积","m³"],["V2","末态体积","m³"],["T1","初态热力学温度","K"],["T2","末态热力学温度","K"]],[["等温压缩时认为体积减半、压强也减半","等温时 p 与 V 成反比。本情境错误式得到 5.0×10⁴ Pa，正确值应为 2.0×10⁵ Pa。"],["等压变化时把温度比写反，使用 V2 = V1·T1/T2","升温时体积应增大。错误式算得 0.0032 m³，与正确的 0.005 m³ 相反。"]],"三条实验定律各固定一个状态量：等温看 p 与 V，等压看 V 与 T，等容看 p 与 T。温度必须使用开尔文。压强与体积的反比不是说压强随体积均匀减少；例如体积减半，压强变为两倍。若漏气、发生液化或状态变化过快而未达到平衡，简单定律可能不再适用。",["保持气体质量和温度不变，实验发现 pV 为常量，故 p1V1=p2V2。","保持气体质量和压强不变，实验发现 V/T 为常量，故 V1/T1=V2/T2。","保持气体质量和体积不变，实验发现 p/T 为常量，故 p1/T1=p2/T2。","三条关系中的 T 都是从绝对零度起算的热力学温度。"],["一定质量理想气体初态压强 1.0×10⁵ Pa、体积 6.0 L、温度 300 K。先等温压缩到 3.0 L，再保持体积不变升温到 450 K。求两步后的压强。",["等温压缩：p2 = p1V1/V2 = 1.0×10⁵×6.0/3.0 = 2.0×10⁵ Pa。","第二步等容，初温 300 K、末温 450 K。","p3 = p2T3/T2 = 2.0×10⁵×450/300 = 3.0×10⁵ Pa。"],"等温压缩后压强为 2.0×10⁵ Pa；等容升温后为 3.0×10⁵ Pa。"],["mgas-03"],["mgas-06"],["玻意耳定律","查理定律","盖-吕萨克定律","气体实验定律"],17],["mgas-06","理想气体状态方程","一定质量的理想气体在任意两个平衡态之间满足 p1V1/T1 = p2V2/T2。",[["理想气体状态方程的微观形式","\u003cmrow>\u003cmi>p\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmrow>\u003cmi>N\u003c/mi>&#x22C5;\u003cmsub>\u003cmi>k\u003c/mi>\u003cmi>B\u003c/mi>\u003c/msub>\u003c/mrow>&#x22C5;\u003cmi>T\u003c/mi>\u003c/mrow>\u003cmi>V\u003c/mi>\u003c/mfrac>\u003c/mrow>","气体可视为理想气体，N 为容器内分子总数"],["一定质量气体的两状态方程","\u003cmrow>\u003cmi mathvariant=\"normal\">p2\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmrow>\u003cmi mathvariant=\"normal\">p1\u003c/mi>&#x22C5;\u003cmi mathvariant=\"normal\">V1\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi mathvariant=\"normal\">T2\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi mathvariant=\"normal\">T1\u003c/mi>&#x22C5;\u003cmi mathvariant=\"normal\">V2\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>","同一份理想气体从一个平衡态变化到另一个平衡态"]],[["p","气体压强","Pa"],["V","气体体积","m³"],["N","气体分子数","1"],["k\u003csub>B\u003c/sub>","玻尔兹曼常量","J/K"],["T","热力学温度","K"],["p1","初态压强","Pa"],["p2","末态压强","Pa"],["V1","初态体积","m³"],["V2","末态体积","m³"],["T1","初态热力学温度","K"],["T2","末态热力学温度","K"]],[["把分子平动对压强的贡献重复计算，写成 p = 2Nk_BT/V","错误式与正确式量纲完全相同，量纲检查无法发现；在微观状态方程情境中会算出 2.0×10⁵ Pa，而独立参考值是 1.0×10⁵ Pa。"],["把微观状态方程写成 p = Nk\u003csub>BT\u003c/sub>·V","乘以体积后量纲变成能量乘体积，已经不是压强；而且错误式会预言容器越大压强越大，方向也相反。"]],"状态方程只连接平衡态，不要求过程一定等温、等压或等容。给定气体质量不变时，三个状态量中知道两个的变化就能求第三个。微观式说明气体压强来源于大量分子对器壁的持续碰撞：分子数密度越大或温度越高，压强越大。实际气体在低密度、高温条件下更接近理想气体。",["把玻意耳、查理和盖-吕萨克三条实验定律统一，可得一定质量气体的 pV/T 为常量。","比较初末两个平衡态，即得 p1V1/T1 = p2V2/T2。","从分子碰撞的统计结果可写成 pV = Nk\u003csub>B\u003c/sub> T；固定 N 后，同样说明 pV/T 不变。"],["含 2.0×10²³ 个分子的理想气体，温度 300 K，体积 8.28×10⁻³ m³，取 k\u003csub>B\u003c/sub>=1.38×10⁻²³ J/K。求气体压强。若保持温度不变把体积压缩为原来的三分之二，求新压强。",["由 p = Nk\u003csub>BT\u003c/sub>/V，先算 Nk\u003csub>BT\u003c/sub> = 828 J。","p = 828/0.00828 = 1.0×10⁵ Pa。","等温且分子数不变，体积变为原来的 2/3，压强变为原来的 3/2。","新压强为 1.5×10⁵ Pa。"],"初态压强为 1.0×10⁵ Pa，压缩后为 1.5×10⁵ Pa。"],["mgas-05"],[],["理想气体","状态方程","气体压强","微观解释"],17],["thermo-01","热力学第一定律","热力学第一定律是能量守恒在热现象中的具体表达。",[["热力学第一定律","\u003cmrow>\u003cmsub>\u003cmi>Δ\u003c/mi>\u003cmi>U\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>Q\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>W\u003c/mi>\u003c/mrow>\u003c/mrow>","采用外界对系统做功为正、传入系统的热量为正的约定"],["由内能变化反求外界做功","\u003cmrow>\u003cmi>W\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>Δ\u003c/mi>\u003cmi>U\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmi>Q\u003c/mi>\u003c/mrow>\u003c/mrow>","已知内能变化与传热，反求外界对系统做的功"]],[["Δ\u003csub>U\u003c/sub>","系统内能的变化量，末态内能减初态内能","J"],["Q","传入系统的热量，吸热为正、放热为负","J"],["W","外界对系统做的功，外界做正功时为正","J"]],[["在本章的符号约定下仍机械地写 Δ\u003csub>U\u003c/sub> = Q - W","本章的 W 指外界对系统做功。吸热膨胀情境中 W=-200 J，错误式得到 700 J，而能量收支应为 300 J。减号版本只适用于把 W 定义为系统对外做功的另一套约定。"],["绝热过程一定不做功，所以内能不变","绝热只表示 Q=0，不表示 W=0。绝热压缩中外界做功 150 J，内能增加 150 J；错误式却给出 0。"]],"公式最难的不是加法，而是符号。先判断能量沿哪条路径进出系统，再代入正负号：吸热使能量进入系统，取正；外界压缩气体也把能量送入系统，做功取正。相反，气体膨胀推动活塞时能量离开系统，W 取负。内能是状态量，而热量和功是过程量，不能说某个物体“含有多少热量”。",["把研究对象选作热力学系统。系统与外界交换能量只有传热和做功两条常见路径。","按能量流入系统为正的统一思想：传入的热量记为 Q，外界对系统做功记为 W。","由能量守恒，系统内能的增量等于两条路径流入能量的代数和，因此 Δ\u003csub>U\u003c/sub> = Q + W。","若采用“系统对外界做功为正”的另一套约定，第一定律中的做功项要改用减号；两种符号约定不能混用。"],["某气体吸收 500 J 热量，同时膨胀并对外界做功 200 J。按外界对系统做功为正的约定，求气体内能的变化。",["吸热，所以 Q=+500 J。","气体对外界做功，因此外界对气体做功 W=-200 J。","由 Δ\u003csub>U\u003c/sub>=Q+W，得 Δ\u003csub>U\u003c/sub>=500+(-200)=300 J。"],"气体内能增加 300 J。"],["mgas-04"],["thermo-02"],["热力学第一定律","内能","热量","做功","符号约定"],18],["thermo-02","能量守恒定律","能量既不会凭空产生，也不会凭空消失，只会从一种形式转化为另一种形式，或从一个物体转移到另一个物体。",[["封闭系统总能量变化","\u003cmrow>\u003cmsub>\u003cmi>ΔE\u003c/mi>\u003cmi mathvariant=\"normal\">总\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">后\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">前\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","先确定系统边界，再比较系统末态与初态的总能量"],["绝热热交换的热量平衡","\u003cmrow>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi mathvariant=\"normal\">吸\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi mathvariant=\"normal\">放\u003c/mi>\u003c/msub>\u003c/mrow>","系统只含相互传热的物体，并且与环境绝热、不发生其他能量交换"]],[["E\u003csub>前\u003c/sub>","封闭系统初态的总能量","J"],["E\u003csub>后\u003c/sub>","封闭系统末态的总能量","J"],["ΔE\u003csub>总\u003c/sub>","封闭系统总能量的变化量","J"],["Q\u003csub>放\u003c/sub>","高温物体放出的热量大小","J"],["Q\u003csub>吸\u003c/sub>","低温物体吸收的热量大小","J"]],[["认为能量转化过程中会有一部分能量消失","“损耗”通常是机械能转化成内能并扩散到环境，不是能量消失。封闭系统情境中错误式只得 1000 J，而总能量仍应为 1250 J。"],["热水和冷水绝热混合时，把吸热量与放热量相加作为低温物体所得热量","同一份转移的能量被重复记了两次。情境中右边变成 16800 J，而低温物体只吸收 8400 J。"]],"能量守恒是所有能量计算的总账本。第一步不是套公式，而是划定系统边界：若把热水和冷水一起看作系统且容器绝热，二者交换的热量一正一负，总和为零；若系统还向空气散热，就必须把这部分能量也记入账本。永动机不可能制成，根本原因之一就是它声称无能量输入却能持续输出功，违反能量守恒。",["选定封闭系统后，把系统内机械能、内能等各种形式的能量全部计入总能量。","能量只能在系统内部转化，不能穿过边界流失，因此 E\u003csub>后\u003c/sub>=E\u003csub>前\u003c/sub>，等价于总能量变化量 ΔE\u003csub>总\u003c/sub>=0。","对绝热混合系统，高温物体减少的内能转移给低温物体，按热量大小记账便得到 Q\u003csub>吸\u003c/sub>=Q\u003csub>放\u003c/sub>。"],["在绝热容器中混合两部分水。达到热平衡时，高温水内能减少 8400 J，忽略容器吸热，低温水内能增加多少？",["把两部分水一起选作封闭系统，容器绝热，因此没有能量流出系统。","高温水放出的能量全部转移给低温水。","由 Q\u003csub>吸\u003c/sub>=Q\u003csub>放\u003c/sub>，低温水吸收 8400 J。"],"低温水内能增加 8400 J。"],["thermo-01"],["thermo-03"],["能量守恒","系统边界","热平衡","永动机"],18],["thermo-03","热力学第二定律与热机效率","热力学第二定律揭示宏观热过程的方向性。",[["热机效率","\u003cmrow>\u003cmi>η\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi mathvariant=\"normal\">出\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi>h\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/mrow>","热机循环工作，效率等于有用功与从高温热库吸热量之比"],["卡诺效率上限","\u003cmrow>\u003cmsub>\u003cmi>η\u003c/mi>\u003cmi mathvariant=\"normal\">max\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi>c\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi>h\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/mrow>\u003c/mrow>","理想可逆热机在温度为 T\u003csub>h\u003c/sub> 与 T\u003csub>c\u003c/sub> 的两个热库之间工作，且 T\u003csub>h\u003c/sub>&gt;T\u003csub>c\u003c/sub>&gt;0"]],[["η","热机效率","1"],["W\u003csub>出\u003c/sub>","热机一个循环对外输出的有用功","J"],["Q\u003csub>h\u003c/sub>","热机一个循环从高温热库吸收的热量","J"],["η\u003csub>max\u003c/sub>","给定高低温热库之间的卡诺效率上限","1"],["T\u003csub>h\u003c/sub>","高温热库的热力学温度","K"],["T\u003csub>c\u003c/sub>","低温热库的热力学温度","K"]],[["把热机效率的分子分母颠倒，写成 η=Q\u003csub>h\u003c/sub>/W\u003csub>出\u003c/sub>","效率应是有用输出除以能量输入。错误式得到 1000/350≈2.86，大于 1，既与定义不符也违反第二定律。"],["卡诺效率写成 η\u003csub>max\u003c/sub>=1-T\u003csub>h\u003c/sub>/T\u003csub>c\u003c/sub>","高低温温度比写反会得到 1-600/300=-1，不可能成为效率。正确结果是 0.5。"]],"第二定律不否定能量守恒，而是在守恒之外增加“方向限制”。冰箱能把热量从低温处搬到高温处，是因为压缩机消耗了电功；热机能连续对外做功，也必须把一部分热量排给低温热库。因此真实热机效率小于 1，并且不会超过相同高、低温热库之间可逆热机的卡诺效率。温度必须使用开尔文温标。",["热机每循环从高温热库吸收 Q\u003csub>h\u003c/sub>，对外做有用功 W\u003csub>出\u003c/sub>，其余能量必须排向低温热库。","效率定义为收益与投入之比，因此 η=W\u003csub>出\u003c/sub>/Q\u003csub>h\u003c/sub>；第二定律要求连续工作的热机 η&lt;1。","对理想可逆热机，效率只由两个热库的热力学温度决定，η\u003csub>max\u003c/sub>=1-T\u003csub>c\u003c/sub>/T\u003csub>h\u003c/sub>。","实际过程存在摩擦、有限温差传热等不可逆因素，所以实际效率严格低于卡诺上限。"],["某热机每循环从 600 K 的高温热库吸收 1000 J 热量，对外做功 350 J，低温热库温度为 300 K。求实际效率和卡诺效率上限。",["实际效率 η=W\u003csub>出\u003c/sub>/Q\u003csub>h\u003c/sub>=350/1000=0.35。","卡诺上限 η\u003csub>max\u003c/sub>=1-T\u003csub>c\u003c/sub>/T\u003csub>h\u003c/sub>=1-300/600=0.50。","0.35&lt;0.50，实际热机没有超过理论上限。"],"实际效率为 35%，卡诺效率上限为 50%。"],["thermo-02","mgas-03"],["thermo-04"],["热力学第二定律","熵","热机","卡诺效率","过程方向"],18],["thermo-04","固体、液体与物态变化","晶体有确定的熔点，非晶体没有确定的熔点；液体具有表面张力，浸润与不浸润取决于液体和固体之间的相互作用。",[["相变潜热","\u003cmrow>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi mathvariant=\"normal\">潜\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>m\u003c/mi>&#x22C5;\u003cmi>L\u003c/mi>\u003c/mrow>\u003c/mrow>","物质在相变温度发生熔化、凝固、汽化或液化，L 取对应相变的潜热"],["无相变时的吸放热","\u003cmrow>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi mathvariant=\"normal\">显热\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmi>m\u003c/mi>&#x22C5;\u003cmi>c\u003c/mi>\u003c/mrow>&#x22C5;\u003cmsub>\u003cmi>Δ\u003c/mi>\u003cmi>T\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","物质不发生物态变化，且所考察温区内比热容可近似为常量"]],[["Q\u003csub>潜\u003c/sub>","物态变化过程中吸收或放出的潜热大小","J"],["m","发生相变或温度变化的物质质量","kg"],["L","单位质量物质发生某种相变的潜热","J/kg"],["Q\u003csub>显热\u003c/sub>","未发生相变时因温度变化吸收或放出的热量大小","J"],["c","物质的比热容","J/kg/K"],["Δ\u003csub>T\u003c/sub>","温度变化量","K"]],[["误把相变潜热写成 Q\u003csub>潜\u003c/sub>=0.5·m·L，多乘了二分之一","错误式量纲仍然是能量，量纲检查抓不到；代入 2 kg 和 334000 J/kg 只得到 334000 J，正确值应为 668000 J。"],["晶体熔化过程中仍用 Q=mc Δ\u003csub>T\u003c/sub>，并因温度不变算出吸热为零","熔化平台上 Δ\u003csub>T\u003c/sub>=0，但物质持续吸收潜热来改变微观结构。2 kg 冰完全熔化需要 668000 J，并非 0。"]],"必须先判断加热过程是否处于相变平台，再选择公式。相变时用 Q=mL，L 取决于物质和相变种类；单纯升温时用 Q=mc Δ\u003csub>T\u003c/sub>。晶体熔化时持续吸热但温度保持在熔点，吸收的能量用于改变分子排列和分子势能，而不是提高温度。两段过程同时出现时，应分段计算再相加。",["相变潜热 L 定义为单位质量物质完成指定相变所需的热量，因此质量为 m 时 Q\u003csub>潜\u003c/sub>=mL。","比热容 c 定义为单位质量物质温度改变 1 K 所需的热量，因此无相变时 Q\u003csub>显热\u003c/sub>=mc Δ\u003csub>T\u003c/sub>。","相变平台上 Δ\u003csub>T\u003c/sub>=0 但 Q\u003csub>潜\u003c/sub> 可以不为零，说明潜热公式不能被温升公式替代。"],["质量 2.0 kg、处在熔点的冰完全熔化，冰的熔化潜热为 3.34×10⁵ J/kg。求需要吸收的热量。",["冰已经处在熔点，过程只发生物态变化，不需要先升温。","用相变潜热公式 Q\u003csub>潜\u003c/sub>=mL。","Q\u003csub>潜\u003c/sub>=2.0×3.34×10⁵=6.68×10⁵ J。"],"需要吸收 6.68×10⁵ J 热量。"],["thermo-01"],["thermo-05"],["晶体","非晶体","表面张力","物态变化","潜热","比热容"],18],["thermo-05","饱和汽与空气湿度","在密闭容器中，液体蒸发与蒸气液化达到动态平衡时，蒸气叫饱和汽，其压强叫饱和汽压。",[["相对湿度","\u003cmrow>\u003cmi>φ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>v\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi mathvariant=\"normal\">饱和\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/mrow>","实际水汽压与饱和汽压取同一温度、同一压强单位"],["绝对湿度","\u003cmrow>\u003cmsub>\u003cmi>ρ\u003c/mi>\u003cmi>v\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi>v\u003c/mi>\u003c/msub>\u003cmi>V\u003c/mi>\u003c/mfrac>\u003c/mrow>","用单位体积空气中水蒸气的质量描述湿度"]],[["φ","相对湿度，用小数表示","1"],["p\u003csub>v\u003c/sub>","空气中水蒸气的实际分压","Pa"],["p\u003csub>饱和\u003c/sub>","同温度下水的饱和汽压","Pa"],["ρ\u003csub>v\u003c/sub>","绝对湿度，即水蒸气质量密度","kg/m³"],["m\u003csub>v\u003c/sub>","空气中所含水蒸气的质量","kg"],["V","所考察空气的体积","m³"]],[["把相对湿度的分子分母颠倒，写成 φ=p\u003csub>饱和\u003c/sub>/p\u003csub>v\u003c/sub>","未饱和空气中 p\u003csub>v\u003c/sub>&lt;p\u003csub>饱和\u003c/sub>，颠倒后会算出 2000/1400≈1.43，即 143%，而正确值为 70%。"],["把相对湿度 70% 直接当成数值 70 代入后续公式","百分数必须化为小数 0.70。把 70 当作相对湿度会大 100 倍，而且相对湿度的常规范围应在 0 到 1 之间。"]],"相对湿度描述空气距离饱和还有多远，不等于空气中水蒸气的质量。实际水汽压不变而温度降低时，饱和汽压会下降，相对湿度上升；达到 100% 后继续降温，就会出现凝露。绝对湿度用单位体积空气所含水蒸气质量表示，与相对湿度是不同口径。天气预报常把相对湿度写成百分数，计算时应先化成小数。",["同温度下，以实际水汽压占饱和汽压的比例衡量接近饱和的程度，得到 φ=p\u003csub>v\u003c/sub>/p\u003csub>饱和\u003c/sub>。","当 φ=1 时空气恰好饱和；通常未饱和空气有 0&lt;φ&lt;1，乘 100% 后得到百分数表示。","按质量密度的定义，单位体积所含水蒸气质量为 ρ\u003csub>v\u003c/sub>=m\u003csub>v\u003c/sub>/V，这就是绝对湿度的一种常用表示。"],["某室内空气中水蒸气实际分压为 1.40×10³ Pa，同温度下饱和汽压为 2.00×10³ Pa。另测得 15 m³ 空气中含水蒸气 0.018 kg。求相对湿度和绝对湿度。",["相对湿度 φ=p\u003csub>v\u003c/sub>/p\u003csub>饱和\u003c/sub>=1400/2000=0.70，即 70%。","绝对湿度 ρ\u003csub>v\u003c/sub>=m\u003csub>v\u003c/sub>/V=0.018/15=0.0012 kg/m³。","换算为常用单位是 1.2 g/m³；两个湿度数值描述的是不同口径。"],"相对湿度为 70%，绝对湿度为 0.0012 kg/m³（1.2 g/m³）。"],["mgas-03","mgas-06"],[],["饱和汽","饱和汽压","相对湿度","绝对湿度","露点"],18],["qz-01","黑体辐射与能量量子化","普朗克提出：物体吸收或发射能量时不是连续进行的，而是一份一份的，每一份能量子的大小与频率成正比，写作 ε=hν，其中 h 叫普朗克常量。",[["光子能量与频率的关系","\u003cmrow>\u003cmi>E\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>h\u003c/mi>&#x22C5;\u003cmi>ν\u003c/mi>\u003c/mrow>\u003c/mrow>","任何单色光都成立；E 是单个光子的能量"],["n 个光子的总能量","\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">总\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmi mathvariant=\"normal\">photon\u003c/mi>\u003c/msub>&#x22C5;\u003cmi>E\u003c/mi>\u003c/mrow>\u003c/mrow>","单色光，且每个光子的能量相同"]],[["h","普朗克常量","eV·s"],["nu","光的频率","Hz"],["E","一个光子的能量","eV"],["n\u003csub>photon\u003c/sub>","光子个数","1"],["E\u003csub>总\u003c/sub>","n 个光子的总能量","eV"]],[["把光子能量写成与频率成反比","频率越高光子能量越大，是正比。按错误式红光只得到 8.28×10⁻³⁰ eV，而正确值是 2.07 eV——差了 30 个数量级。"],["认为光释放或吸收的能量可以连续变化","这正是被黑体辐射实验否掉的经典图像。能量是一份一份的，「一份」就是 hν。这一条是观念性错误，无法用公式检查，只能靠人判。"]],"「能量不连续」是整章的地基。经典理论算出的黑体辐射曲线在短波处会趋向无穷大，与实验完全不符——这个矛盾叫「紫外灾难」。普朗克引入能量量子化后，理论曲线才与实验吻合。随后在光子模型中，hν 表示**一个光子**的能量，n 个同频光子的总能量就是 n·hν。这样既保留了量子化的核心，也区分了普朗克的能量子假设与爱因斯坦的光子解释。",["实验测出的黑体辐射曲线在短波处会掉下来，而经典理论预言它会趋于无穷——这个矛盾必须先解决。","普朗克假设：吸收和发射的能量只能是一份一份的，每一份的大小与频率成正比，记作 hν。","于是 n 个光子的总能量就是 n·hν，能量只能在「份」的基础上累加，不能连续变化。"],["某红光的频率为 5.0×10¹⁴ Hz。取 h=4.14×10⁻¹⁵ eV·s，求一个光子的能量；再求 3 个这样的光子总共有多少能量。",["E = hν = 4.14×10⁻¹⁵ × 5.0×10¹⁴ = 2.07 eV","三个光子：E\u003csub>总\u003c/sub> = 3 × 2.07 = 6.21 eV"],"单光子能量 2.07 eV，三个光子共 6.21 eV。"],[],[],["量子化","普朗克常量"],19],["qz-02","光电效应与爱因斯坦光电方程","光照射到金属表面时电子被击出，叫光电效应。",[["爱因斯坦光电方程","\u003cmrow>\u003cmi mathvariant=\"normal\">Ek\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmi>h\u003c/mi>&#x22C5;\u003cmi>ν\u003c/mi>\u003c/mrow>\u003cmo>−\u003c/mo>\u003cmi>W\u003c/mi>\u003c/mrow>\u003c/mrow>","入射光频率大于截止频率时才有光电子；Ek 取最大值"],["截止频率","\u003cmrow>\u003cmsub>\u003cmi>ν\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>W\u003c/mi>\u003cmi>h\u003c/mi>\u003c/mfrac>\u003c/mrow>","令 Ek=0 解出，即恰好能发生光电效应的最低频率"]],[["h","普朗克常量","eV·s"],["nu","入射光的频率","Hz"],["W","金属的逸出功","eV"],["Ek","光电子的最大初动能","eV"],["nu\u003csub>0\u003c/sub>","截止频率（恰好能打出电子的最低频率）","Hz"]],[["把光电方程写成 Ek = W - h·nu（减反了）","hν 是吸收到的能量，W 是必须付出的，剩下才是动能，所以是「收入减支出」。按错误式会得到 −0.815 eV，动能不可能为负。"],["认为只要光足够强，低于截止频率的光也能打出光电子","能否打出电子只取决于单个光子的能量 hν 是否超过 W。光强变大只是光子数变多，每个光子的能量并没有变大。这是光电效应最核心的概念性结论，公式抓不到。"]],"这条式子一次解释了光电效应全部「反常」现象。其一，能否打出电子只取决于**单个光子**的能量是否够大（hν&gt;W），与光强无关；增大光强只是让光子**变多**，所以光电流变大但截止频率不变。其二，出现光电子几乎不需要时间，因为能量是整份被一个电子一次性吸收的，不存在「慢慢攒」的过程。其三，Ek 与 ν 是**线性关系**，图线斜率就是 h。",["一个电子要离开金属，至少得付出逸出功 W。","电子一次性吸收一个光子的能量 hν，付掉逸出功后剩下的全部变成初动能，所以 Ek=hν−W。","令 Ek=0 解出恰好能发生光电效应的频率，即截止频率 ν₀=W/h；频率低于它，无论光多强都打不出电子。"],["用频率 7.5×10¹⁴ Hz 的紫光照射钠，钠的逸出功为 2.29 eV。取 h=4.14×10⁻¹⁵ eV·s，求光电子的最大初动能；并求钠的截止频率。",["先算单光子能量：hν = 4.14×10⁻¹⁵ × 7.5×10¹⁴ = 3.105 eV","Ek = hν − W = 3.105 − 2.29 = 0.815 eV","截止频率：ν₀ = W/h = 2.29 ÷ 4.14×10⁻¹⁵ = 5.53×10¹⁴ Hz"],"最大初动能 0.815 eV；截止频率约 5.53×10¹⁴ Hz。"],[],[],["光电效应","逸出功"],19],["qz-03","光的波粒二象性","光既有波动性（能发生干涉、衍射）又有粒子性（能发生光电效应），二者不是互相否定，而是光在不同情境下表现出的不同侧面，这叫波粒二象性。",[["波长与频率的关系","\u003cmrow>\u003cmi>ν\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>c\u003c/mi>\u003cmi>λ\u003c/mi>\u003c/mfrac>\u003c/mrow>","光在真空中传播；波长越短频率越高"],["光子的能量","\u003cmrow>\u003cmi>E\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>h\u003c/mi>&#x22C5;\u003cmi>ν\u003c/mi>\u003c/mrow>\u003c/mrow>","与上一条联立，就把「波」的波长换算成了「粒子」的能量"]],[["c","真空中的光速","m/s"],["λ","光的波长","m"],["nu","光的频率","Hz"],["h","普朗克常量","eV·s"],["E","单个光子的能量","eV"]],[["把波长与频率记成正比，写成 nu = c·λ","两者是反比。按错误式，5.0×10⁻⁷ m 的绿光会算出 150 Hz，而正确值是 6.0×10¹⁴ Hz。"],["认为「干涉说明光是波、光电效应说明光是粒子」，两者互相矛盾","两者描述的是同一束光的不同侧面，通过 E=hν 与 ν=c/λ 可以互相换算，并不矛盾。这是观念性理解，公式检查不了。"]],"「二象性」不是「有时是波有时是粒子」这么含糊。准确的说是：光在传播、干涉、衍射时用波动规律描述最方便，在与物质交换能量时用光子模型最方便，两套描述通过 E=hν 与 ν=c/λ 联立起来。判断该用哪一套的粗略标准是：看你在追问「往哪儿走」还是「交出多少能量」。",["波动描述给出波长与频率的关系：一个周期内波前进一个波长，所以 ν=c/λ。","粒子描述给出能量与频率的关系：E=hν。","把两式联立消去 ν，就得到 E=hc/λ —— 波长越短，单个光子的能量越高，这也是紫外光比红光更「厉害」的原因。"],["某绿光在真空中的波长为 5.0×10⁻⁷ m。取 c=3.0×10⁸ m/s、h=4.14×10⁻¹⁵ eV·s，求它的频率与单个光子的能量。",["ν = c/λ = 3.0×10⁸ ÷ 5.0×10⁻⁷ = 6.0×10¹⁴ Hz","E = hν = 4.14×10⁻¹⁵ × 6.0×10¹⁴ = 2.484 ≈ 2.48 eV"],"频率 6.0×10¹⁴ Hz，单光子能量约 2.48 eV。"],[],[],["波粒二象性","光子"],19],["qz-04","物质波（德布罗意波长）","德布罗意提出：不仅光有波粒二象性，实物粒子也有。",[["动量","\u003cmrow>\u003cmi>p\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>m\u003c/mi>&#x22C5;\u003cmi>v\u003c/mi>\u003c/mrow>\u003c/mrow>","速度远小于光速的非相对论情形"],["德布罗意波长","\u003cmrow>\u003cmsub>\u003cmi>λ\u003c/mi>\u003cmi mathvariant=\"normal\">db\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>h\u003c/mi>\u003cmi>p\u003c/mi>\u003c/mfrac>\u003c/mrow>","任何实物粒子都成立；p 越大波长越短"]],[["h","普朗克常量","J·s"],["p","粒子的动量","kg·m/s"],["λ\u003csub>db\u003c/sub>","德布罗意波长","m"],["m","粒子质量","kg"],["v","粒子速度","m/s"]],[["把动量写成 m·v²（与动能记混）","动量是 mv，动能才是 ½mv²。按错误式小球会得到 0.18 kg·m/s，而正确值是 0.06 kg·m/s。"],["认为宏观物体没有波动性，所以德布罗意假设是错的","宏观物体**有**波动性，只是波长小到无法观测（0.02 kg 小球约 10⁻³² m）。「测不到」不等于「不存在」——这条要靠人判。"]],"这条式子把「粒子」和「波」的关系推广到了实物。要看清它为什么在宏观世界完全看不出来：h 只有 6.63×10⁻³⁴ 量级，一个 0.02 kg 的小球即使以 3 m/s 运动，波长也只有 10⁻³² m —— 比原子核还小 17 个数量级，任何实验都测不到。而电子的质量小到 10⁻³¹ kg，波长就落到了 10⁻¹⁰ m 量级，恰好与原子的尺度相当，于是能被晶体衍射实验证实。",["先把粒子的动量写出来：p=mv。","德布罗意假设实物粒子也满足 h 与 p 的对应关系，即 λ=h/p。","代入数值估算量级：宏观物体的波长在 10⁻³² m 附近，远小于任何可测尺度，所以日常生活中完全观察不到波动性。"],["一个质量 0.02 kg 的小球以 3.0 m/s 运动。取 h=6.63×10⁻³⁴ J·s，求它的动量与德布罗意波长，并说明为什么日常看不到它的波动性。",["p = mv = 0.02 × 3.0 = 0.06 kg·m/s","λ = h/p = 6.63×10⁻³⁴ ÷ 0.06 ≈ 1.1×10⁻³² m","这个波长比原子核还小十几个数量级，没有任何实验能测到，所以宏观物体的波动性表现不出来"],"动量 0.06 kg·m/s，德布罗意波长约 1.1×10⁻³² m，远小于可测尺度。"],[],[],["德布罗意波","物质波"],19],["qz-05","原子的核式结构模型","卢瑟福根据 α 粒子散射实验提出：原子的正电荷和几乎全部质量集中在一个极小的核里，电子在核外空间运动。",[["库仑力与距离的关系","\u003cmrow>\u003cmi>F\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmrow>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmi>e\u003c/mi>\u003c/msub>&#x22C5;\u003cmi mathvariant=\"normal\">q1\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi mathvariant=\"normal\">q2\u003c/mi>\u003c/mrow>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mfrac>\u003c/mrow>","α 粒子仍在原子核外时，可把它与金核近似看作点电荷；进入核内后不能沿用本式"],["距离减半时库仑力的变化","\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>&#x22C5;\u003cmsup>\u003cmfrac>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mfrac>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mrow>","电荷量不变，只改变距离时的比例关系"]],[["k\u003csub>e\u003c/sub>","静电力常量","N·m²/C²"],["q1","α 粒子的电荷量","C"],["q2","金核的电荷量","C"],["r","α 粒子与核中心的距离","m"],["F","α 粒子受到的库仑斥力","N"],["r\u003csub>1\u003c/sub>","初始距离","m"],["r\u003csub>2\u003c/sub>","靠近后的距离","m"],["F\u003csub>1\u003c/sub>","初始距离下的库仑力","N"],["F\u003csub>2\u003c/sub>","靠近后的库仑力","N"]],[["把库仑力写成与距离成反比（漏掉平方）","是平方反比。漏掉平方后同一个情境只得到约 7.28×10⁻¹³ N，而正确值约为 14.6 N，量级完全错误。"],["认为 α 粒子大角度偏转是因为撞上了核外电子","电子质量只有 α 粒子的约 1/7300，撞上电子不可能让 α 粒子大幅偏转。能被弹回的只能是质量大、电荷集中的核。这是概念性判断，公式检查不到。"]],"这个模型的证据全在「绝大多数穿过去、极少数被弹回来」这句现象描述里。大多数 α 粒子几乎不偏转，说明原子内部绝大部分是空的；极少数被大角度甚至原路弹回，说明存在一个质量大、电荷集中、体积极小的核。核半径约 10⁻¹⁵ m，而原子半径约 10⁻¹⁰ m，相差五个数量级。本例取几十飞米的核外距离，既能展示迅速增强的斥力，也不把金核错误地当成在核内仍适用的点电荷。",["α 粒子带正电，金核也带正电，两者之间的作用是库仑斥力。","把电荷量与距离代入库仑定律 F=kq1q2/r²，算出在核尺度上的斥力量级。","由于力与距离平方成反比，α 粒子越靠近核，受到的斥力增长越快，因此在极近距离上会被大幅度甚至原路弹回——这正是散射实验中那些大角度偏转的来源。"],["α 粒子（电荷量 3.2×10⁻¹⁹ C）在金核外抵近到 5.0×10⁻¹⁴ m，金核电荷量为 1.264×10⁻¹⁷ C。取 k\u003csub>e\u003c/sub>=9.0×10⁹ N·m²/C²，求它受到的库仑斥力。",["F = k\u003csub>e\u003c/sub>·q1·q2/r²","F = 9.0×10⁹ × 3.2×10⁻¹⁹ × 1.264×10⁻¹⁷ ÷ (5.0×10⁻¹⁴)²","F = 3.6403×10⁻²⁶ ÷ 2.5×10⁻²⁷ ≈ 14.6 N"],"库仑斥力约 14.6 N。对单个微观 α 粒子而言，这已经是足以造成显著偏转的强作用。"],[],[],["核式结构","库仑力"],19],["qz-06","玻尔模型与氢原子能级","玻尔提出：氢原子的能量只能取一系列特定的值，叫能级，第 n 个能级写作 E\u003csub>n\u003c/sub>=E\u003csub>1\u003c/sub>/n²，其中 E\u003csub>1\u003c/sub> 是基态能量。",[["氢原子能级公式","\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmsup>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmi mathvariant=\"normal\">level\u003c/mi>\u003c/msub>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mfrac>\u003c/mrow>","氢原子（单电子体系）；n\u003csub>level\u003c/sub> 取正整数 1、2、3…"],["能级跃迁放出的光子能量","\u003cmrow>\u003cmsub>\u003cmi>Δ\u003c/mi>\u003cmi>E\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">high\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">low\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","从高能级向低能级跃迁时放出光子；反向则吸收"]],[["E\u003csub>1\u003c/sub>","基态能量（n=1），氢原子约为 −13.6 eV","eV"],["n\u003csub>level\u003c/sub>","量子数（能级序号）","1"],["E\u003csub>n\u003c/sub>","第 n 个能级的能量","eV"],["E\u003csub>high\u003c/sub>","较高能级的能量（跃迁前）","eV"],["E\u003csub>low\u003c/sub>","较低能级的能量（跃迁后）","eV"],["Δ\u003csub>E\u003c/sub>","跃迁放出的光子能量","eV"]],[["把能级公式写成 E\u003csub>n\u003c/sub> = E\u003csub>1\u003c/sub>/n（漏掉平方）","是 n² 而不是 n。按错误式第二能级会得到 −6.8 eV，而正确值是 −3.4 eV——两条式子给出的谱线位置完全不同。"],["认为原子可以处于任意能量的状态","能级是分立的，原子只能待在这几条固定的「台阶」上，这也是原子光谱是一条条分离谱线而不是连续光谱的根本原因。属观念性错误，公式检查不了。"]],"「能级」是能量量子化在原子上的具体表现：原子不能停在任意能量上，只能待在几条固定的「台阶」上。这解释了两件事：一是原子发光不是连续光谱，而是一条条分离的谱线；二是每条谱线对应一次确定的跃迁，所以谱线位置可以用来反推能级结构。要注意 E\u003csub>1\u003c/sub> 是**负值**，能级越高（n 越大）越接近零，这说明原子被「束缚」着——要把电子完全拉出来，需要给它 13.6 eV。",["玻尔假设原子的能量只能取分立值，对氢原子可以归纳为 E\u003csub>n\u003c/sub>=E\u003csub>1\u003c/sub>/n²。","把 n=1 代入得基态 −13.6 eV，n=2 得 −3.4 eV，可见能级越高、能量越接近零。","跃迁时能量守恒：两个能级之差要么变成一个光子的能量放出去（往下跳），要么由吸收的光子补上（往上跳），这就是谱线位置能反推能级的原因。"],["氢原子的基态能量为 −13.6 eV。求第二能级的能量；并求电子从第二能级跃迁到基态时放出光子的能量。",["n=2 时，E\u003csub>n\u003c/sub> = E\u003csub>1\u003c/sub>/2² = −13.6 ÷ 4 = −3.4 eV","ΔE = E\u003csub>high\u003c/sub> − E\u003csub>low\u003c/sub> = −3.4 − (−13.6) = 10.2 eV","这个能量对应一条紫外谱线，谱线位置由 ΔE 唯一确定"],"第二能级 −3.4 eV；跃迁放出光子能量 10.2 eV。"],[],[],["能级","玻尔模型","跃迁"],19],["nuc-01","原子核的组成与同位素","原子核由质子和中子组成，二者统称核子。",[["质量数与核电荷数的关系","\u003cmrow>\u003cmi>A\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>Z\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>N\u003c/mi>\u003c/mrow>\u003c/mrow>","对任何原子核都成立，与核是否稳定无关"],["核半径的立方根规律","\u003cmrow>\u003cmi>R\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>r\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>&#x22C5;\u003cmsup>\u003cmi>A\u003c/mi>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmn>3\u003c/mn>\u003c/mfrac>\u003c/msup>\u003c/mrow>\u003c/mrow>","把核近似看成实心球；r\u003csub>0\u003c/sub> 取 1.2×10⁻¹⁵ m 量级"]],[["Z","质子数（也叫核电荷数）","1"],["N","中子数","1"],["A","质量数，即核内核子总数","1"],["R","原子核半径","m"],["r\u003csub>0\u003c/sub>","核半径常量，约 1.2×10⁻¹⁵ m","m"]],[["把质量数当成质子数，写成 A=Z","质量数是质子数与中子数之和，不是质子数。碳12 按这个写法会得到 6，而正确值是 12。"],["认为质量数总等于质子数的两倍，写成 A=2Z","只有质子数恰好等于中子数时才碰巧成立（如碳12）。铀238 就不成立：2×92=184，而 A=238——多出来的 54 个全是中子。"],["把核半径写成与质量数成正比（R=r\u003csub>0\u003c/sub>·A）","量纲虽然对得上（都是长度），但函数关系错了：核半径只按质量数的**立方根**增长。碳12 会算出 1.44×10⁻¹⁴ m，而正确值约 2.75×10⁻¹⁵ m，差了五倍多。此条依赖极小量级（10⁻¹⁵）的比较，机器实测抓不稳，故列人工审核。"],["把同位素说成「质子数不同的原子」","同位素是质子数相同、中子数不同；质子数不同就是不同的元素了。这条只能靠人判。"]],"Z 相当于元素的「身份证」：Z 相同就是同一种元素，化学性质几乎只由 Z 与核外电子决定。N 不同则核的稳定性、放射性可能差别很大，这就是同位素。要注意 A 只表示核子个数，不是原子质量，也不是质子数。",["质量数的定义：A 等于核内质子数与中子数之和。","由 A=Z+N 移项得 N=A−Z，所以只要知道质量数和质子数，就能求出中子数。","实验测得核半径与质量数的立方根成正比（原子核近似实心球），故写成 R=r\u003csub>0\u003c/sub>·A^(1/3)。"],["碳12 的原子核含 6 个质子。求它的质量数与中子数；若取 r\u003csub>0\u003c/sub>=1.2×10⁻¹⁵ m，估算它的核半径。",["A = Z + N = 6 + 6 = 12","N = A − Z = 12 − 6 = 6","R = r\u003csub>0\u003c/sub>·A^(1/3) = 1.2×10⁻¹⁵ × 12^(1/3) ≈ 2.75×10⁻¹⁵ m"],"质量数 12，中子数 6，核半径约 2.75×10⁻¹⁵ m。"],[],[],["原子核","同位素"],20],["nuc-02","放射性衰变（α、β、γ）","α 衰变放出 α 粒子（即氦核，含 2 个质子和 2 个中子），故质量数减 4、质子数减 2；β 衰变是核内一个中子变成质子并放出一个电子，故质量数不变、质子数加 1；γ 衰变只放出光子，质量数与质子数都不变。",[["n 次 α 衰变后的质量数","\u003cmrow>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>A\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmrow>\u003cmn>4\u003c/mn>&#x2062;\u003cmsub>\u003cmi>n\u003c/mi>\u003cmi>α\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>\u003c/mrow>","只发生 α 衰变；每放出一个 α 粒子带走 4 个核子"],["n 次 α 衰变后的中子数","\u003cmrow>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmrow>\u003cmn>2\u003c/mn>&#x2062;\u003cmsub>\u003cmi>n\u003c/mi>\u003cmi>α\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>\u003c/mrow>","只发生 α 衰变；α 粒子含 2 个中子"]],[["A\u003csub>1\u003c/sub>","衰变前的质量数","1"],["Z\u003csub>1\u003c/sub>","衰变前的质子数","1"],["N\u003csub>1\u003c/sub>","衰变前的中子数","1"],["n\u003csub>α\u003c/sub>","发生的 α 衰变次数","1"],["A\u003csub>2\u003c/sub>","衰变后的质量数","1"],["Z\u003csub>2\u003c/sub>","衰变后的质子数","1"],["N\u003csub>2\u003c/sub>","衰变后的中子数","1"]],[["一次 α 衰变只让质量数减 2","α 粒子含 2 个质子和 2 个中子，共 4 个核子，质量数应减 4。铀238 会算成 236，而正确是 234。"],["认为 γ 衰变会改变质量数与质子数","γ 射线是光子，没有质量数也没有电荷；放出 γ 只是把核从激发态降到低能态，质量数与质子数都不变。"]],"三种衰变要连在一起记：α 是「掉一个氦核」，β 是「中子换质子」，γ 是「把多余的能量以光子形式吐出来」。判断衰变次数一律用两条守恒：质量数守恒、电荷数守恒。α 衰变 n 次就减 4n 和 2n；β 衰变 n 次质量数不变、质子数加 n。",["α 粒子就是氦核，质量数 4、电荷数 2；放出一个就带走 4 个核子和 2 个单位的正电荷。","所以质量数每次减 4，质子数每次减 2，两者都是线性变化：减 4n 与减 2n。","检验守恒：衰变前后「质子数 + 中子数」应当都等于质量数，两个结果对上才说明次数没算错。"],["铀238 经过 3 次 α 衰变后，质量数、质子数与中子数各是多少？",["每次 α 衰变质量数减 4：A = 238 − 4×3 = 226","每次 α 衰变质子数减 2：Z = 92 − 2×3 = 86","每次 α 衰变中子数减 2：N = 146 − 2×3 = 140，验算 86+140=226 ✓"],"质量数 226，质子数 86，中子数 140。"],[],[],["放射性","衰变"],20],["nuc-03","半衰期","半衰期 T 是放射性元素有一半原子核发生衰变所需的时间。",[["半衰期个数与时间的关系","\u003cmrow>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmi mathvariant=\"normal\">1/2\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>t\u003c/mi>\u003cmsub>\u003cmi>T\u003c/mi>\u003cmi mathvariant=\"normal\">1/2\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/mrow>","把实际时间换算成「过了几个半衰期」，便于按整数倍心算"],["剩余核数与时间的关系","\u003cmrow>\u003cmi>N\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>&#x22C5;\u003cmrow>\u003cmi>e\u003c/mi>\u003cmo>&#x2061;\u003c/mo>\u003cmo>(\u003c/mo>\u003cmrow>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>k\u003c/mi>\u003cmi mathvariant=\"normal\">衰变\u003c/mi>\u003c/msub>\u003c/mrow>&#x22C5;\u003cmi>t\u003c/mi>\u003c/mrow>\u003cmo>)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/mrow>","写成指数衰减形式，便于用衰变常量做连续计算"]],[["N\u003csub>0\u003c/sub>","初始时刻未衰变的核数","1"],["N","经过 t 时间后未衰变的核数","1"],["T\u003csub>1/2\u003c/sub>","半衰期","s"],["t","经历的时间","s"],["n\u003csub>1/2\u003c/sub>","经历的半衰期个数","1"],["k\u003csub>衰变\u003c/sub>","衰变常量，表示单位时间内衰变的概率","s⁻¹"]],[["以为每过一个半衰期就少一半（线性递减），写成 N=N\u003csub>0\u003c/sub>·(1−n/2)","半衰期是「剩一半」而不是「减一半」。N\u003csub>0\u003c/sub>=800、n=3 时错误式给出 −400，明显荒谬；正确值是 100。"],["把衰变常量 k 与半衰期 T 当成正比关系（k∝T）","k=ln2/T，二者是**反比**：半衰期越长，单位时间内衰变的概率越小。本情境 k≈0.1386 s⁻¹，而 T=5 s，相差悬殊。"],["认为半衰期可以描述某一个原子核何时衰变","半衰期是大量核的统计规律；对单个核只能给出衰变概率，不能预言它具体何时衰变。"]],"半衰期是**大量原子核**的统计规律，不是单个核的「倒计时」。它只由核本身决定，和温度、压强、化学状态都无关——因为核外条件根本影响不到核内部。经过 n 个半衰期剩 (1/2)ⁿ，永远不为零，所以「衰变完」只是近似说法。",["按定义，每过一个半衰期剩余核数乘 1/2，所以经过 n 个半衰期剩 N\u003csub>0\u003c/sub>·(1/2)ⁿ。","把「过了多久」换算成「过了几个半衰期」用 n=t/T，于是 N=N\u003csub>0\u003c/sub>·(1/2)^(t/T)。","把 (1/2)^(t/T) 写成指数形式 exp(−k·t)，其中 k=ln2/T 叫衰变常量；两种写法完全等价，指数形式更方便做连续计算。"],["某放射性样品原有 800 个未衰变的核，半衰期为 5 s。经过 15 s 后还剩多少个？",["先换算半衰期个数：n = t/T = 15/5 = 3","再代入衰减式：N = N\u003csub>0\u003c/sub>×(1/2)ⁿ = 800×(1/2)³ = 100"],"还剩 100 个未衰变的核。"],[],[],["半衰期","统计规律"],20],["nuc-04","核反应方程与质能方程","核反应前后质量数守恒、电荷数守恒。",[["质量亏损","\u003cmrow>\u003cmsub>\u003cmi>Δ\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi mathvariant=\"normal\">前\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi mathvariant=\"normal\">后\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","反应前总静质量减反应后总静质量，差值为正表示放能"],["质能方程","\u003cmrow>\u003cmi>E\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>Δ\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>&#x22C5;\u003cmsup>\u003cmi>c\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mrow>","Δm 取质量亏损（正数），算出来的是释放的能量"]],[["m\u003csub>前\u003c/sub>","反应前所有粒子静质量之和","kg"],["m\u003csub>后\u003c/sub>","反应后所有粒子静质量之和","kg"],["Δ\u003csub>m\u003c/sub>","质量亏损","kg"],["c","真空中的光速，约 3.0×10⁸ m/s","m/s"],["E","反应释放的能量","J"]],[["质能方程里代反应前的总质量，写成 E=m\u003csub>前\u003c/sub>·c²","要代的是**亏损的那部分质量**，不是总质量。按错误式会得到 0.14207×(3.0×10⁸)²≈1.28×10¹⁶ J，而正确值是 1.62×10¹³ J——放大了近三个数量级。"],["认为核反应中静质量守恒，把质量亏损当成测量误差","核反应中守恒的是质量数与电荷数；静质量会按 E=Δm·c² 转化为能量放出去，质量亏损是真实的物理效应。"]],"这里最容易搞混的是「哪个质量守恒」：守恒的是质量数与电荷数，静质量本身并不守恒。用 E=Δm·c² 时必须代**亏损的那部分质量**，不能代反应前的总质量——后者会算出大好几个数量级的结果。正因为 c² 是 9×10¹⁶ 这样的大数，极小的质量亏损对应极大的能量，这是核能远超化学能的根本原因。",["先写核反应方程，用「质量数守恒、电荷数守恒」把两边的核配平。","把反应前后所有粒子的静质量分别求和，两者之差就是质量亏损 Δm。","由质能方程 E=Δm·c² 把亏损的质量换算成释放的能量；因为 c²≈9×10¹⁶，微小亏损对应巨大能量。"],["1 mol 铀核裂变时，反应前后粒子总静质量分别为 0.14207 kg 与 0.14189 kg。取 c=3.0×10⁸ m/s，求质量亏损与释放的总能量。",["Δm = m前 − m后 = 0.14207 − 0.14189 = 1.8×10⁻⁴ kg","E = Δm·c² = 1.8×10⁻⁴ × (3.0×10⁸)² = 1.8×10⁻⁴ × 9.0×10¹⁶ = 1.62×10¹³ J"],"质量亏损 1.8×10⁻⁴ kg，1 mol 铀核裂变释放能量约 1.62×10¹³ J。"],[],[],["质能方程","核反应"],20],["nuc-05","核裂变与核聚变（含结合能）","把核子结合成原子核时放出的能量叫结合能 E\u003csub>b\u003c/sub>；它除以质量数得到每个核子平均分摊的结合能，叫比结合能 e\u003csub>b\u003c/sub>=E\u003csub>b\u003c/sub>/A。",[["结合能","\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi>b\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>Δ\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>&#x22C5;\u003cmsup>\u003cmi>c\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mrow>","Δm 取「单独核子总质量 − 原子核质量」，算出的就是结合能"],["比结合能","\u003cmrow>\u003cmsub>\u003cmi>e\u003c/mi>\u003cmi>b\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi>b\u003c/mi>\u003c/msub>\u003cmi>A\u003c/mi>\u003c/mfrac>\u003c/mrow>","比较不同核的稳定性时必须用它，不能直接比结合能总量"]],[["A","质量数","1"],["Δ\u003csub>m\u003c/sub>","质量亏损","kg"],["c","真空中的光速","m/s"],["E\u003csub>b\u003c/sub>","原子核的结合能","J"],["e\u003csub>b\u003c/sub>","按 1 mol 原子核折算后，每个核子平均分摊的结合能","J"]],[["把比结合能写成结合能乘以质量数","比结合能是「每个核子平均分摊到的结合能」，应当除以质量数而不是乘。按错误式会得到 2.709×10¹²×4≈1.08×10¹³ J，而正确是 6.7725×10¹¹ J。"],["认为质量数越大的核一定越稳定","稳定性要看比结合能，不是质量数。比结合能在铁附近最大，比铁更重或更轻的核都更不稳定——这正是重核裂变、轻核聚变都能放能的原因。"]],"判断一个核稳定不稳定，看的是**比结合能**而不是结合能总量。比结合能在铁附近最大（约 8.8 MeV 每核子），两端都更小；所以特别重的核（如铀）裂开、特别轻的核（如氘氚）合起来，产物都更靠近铁，比结合能升高，差额就以能量形式放出来。这就是「裂变与聚变都能发电」的同一句解释。",["核子单独存在时的总质量，比它们结合成原子核之后的质量大，差值就是质量亏损。","按质能方程，这份亏损对应的能量就是结合能 E\u003csub>b\u003c/sub>=Δm·c²。","把结合能除以质量数，得到每个核子平均分摊的能量，即比结合能 e\u003csub>b\u003c/sub>=E\u003csub>b\u003c/sub>/A；它是比较核稳定性的正确标准。"],["1 mol 氦4 核的结合能为 2.709×10¹² J，质量数为 4。求它的比结合能，并与铁56（约 8.514×10¹¹ J 每核子，按 1 mol 计）比较谁更稳定。",["比结合能 = 结合能 ÷ 质量数","e\u003csub>b\u003c/sub> = 2.709×10¹² ÷ 4 = 6.7725×10¹¹ J","铁56 的比结合能 8.514×10¹¹ J 更大，所以铁56 比氦4 更稳定"],"氦4 的比结合能约 6.7725×10¹¹ J（按 1 mol 计）；铁56 更大，因而更稳定。"],[],[],["结合能","裂变","聚变"],20]]}</script><script>
(()=>{'use strict';
const data=JSON.parse(document.getElementById('kb-data').textContent),groups=data.g,points=data.p;
const SEGMENT_ROOT='高中物理',QUIZ_HREF='quiz-hs.html',RETURN_PAGE='index.html';
const viewBox=document.getElementById('content'),search=document.getElementById('search'),chapter=document.getElementById('chapter'),counter=document.getElementById('count');
const strip=s=>{const e=document.createElement('div');e.innerHTML=s||'';return(e.textContent||'').toLowerCase()};
const clean=s=>(s||'').toLowerCase().replace(/\s+/g,' ').trim();
const text=s=>{const e=document.createElement('span');e.textContent=s||'';return e.innerHTML};
const groupName=i=>groups[i][0].split('·').slice(1).join('·').trim()||groups[i][0];
let view=['points','formulas','symbols','map'].includes(location.hash.slice(1))?location.hash.slice(1):'points';
let domain='全部',chapterName='全部',query='';
const pointIndex=new Map(points.map((p,i)=>[p[0],i]));

// 搜索只从给人看的字段建立索引，不把公式解析器的内部名称重新写进页面。
const pointSearch=points.map(p=>clean([p[1],p[2],p[6],p[11].join(' '),groups[p[12]][0],groups[p[12]][1],...p[3].flat(),...p[4].flat(),...p[5].flat()].map(strip).join(' ')));
const formulas=[];points.forEach((p,i)=>p[3].forEach((f,k)=>formulas.push([i,k,clean([strip(p[1]),strip(f[0]),strip(f[2]),...p[4].map(s=>strip(s[0])+' '+strip(s[1])),groups[p[12]][0]].join(' '))])));
const symbols=[],symbolMap=new Map();points.forEach((p,i)=>p[4].forEach(s=>{const key=s.join('|');if(!symbolMap.has(key)){symbolMap.set(key,symbols.length);symbols.push([s,[i]])}else symbols[symbolMap.get(key)][1].push(i)}));

function matchPoint(i){const p=points[i],g=groups[p[12]];return(domain==='全部'||g[1]===domain)&&(chapterName==='全部'||g[0]===chapterName)&&(!query||pointSearch[i].includes(query))}
function formulaHTML(f){return '<div class="formula"><div class="formula-name">'+f[0]+'</div><div class="math"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block">'+f[1]+'</math></div>'+(f[2]?'<div class="when">适用：'+f[2]+'</div>':'')+'</div>'}
function symbolHTML(s){return '<div class="sym-row"><div class="sym-name">'+s[0]+'</div><div>'+s[1]+'</div><div class="sym-unit">'+s[2]+'</div></div>'}
function errorHTML(e){return '<div class="error"><b>'+e[0]+'</b><p>'+e[1]+'</p></div>'}
function relationHTML(p,i){let before=p[9].map(id=>pointIndex.get(id)).filter(x=>x!==undefined),after=p[10].map(id=>pointIndex.get(id)).filter(x=>x!==undefined);const members=groups[p[12]][3],pos=members.indexOf(i);if(!before.length&&pos>0)before=[members[pos-1]];if(!after.length&&pos<members.length-1)after=[members[pos+1]];const row=(label,list)=>list.length?'<div class="relation-line"><span>'+label+'</span>'+list.map(j=>'<button data-go="'+j+'">'+points[j][1]+'</button>').join('')+'</div>':'';return before.length||after.length?'<section class="relations"><h3>知识关系</h3>'+row('先理解',before)+row('接着看',after)+'</section>':''}
function pointHTML(i){const p=points[i],g=groups[p[12]],more=p[5].length>2?'<details class="more-errors"><summary>查看其余 '+(p[5].length-2)+' 条常见错误</summary>'+p[5].slice(2).map(errorHTML).join('')+'</details>':'';return '<article class="card" id="'+p[0]+'"><div class="path">'+g[1]+' · '+text(groupName(p[12]))+'</div><h2>'+p[1]+'</h2><p class="definition">'+p[2]+'</p><section class="block"><h3>核心公式</h3><div class="formulas">'+p[3].map(formulaHTML).join('')+'</div></section><section class="block"><h3>容易出错</h3>'+p[5].slice(0,2).map(errorHTML).join('')+more+'</section><section class="block"><h3>符号与单位</h3><div class="symbols"><div class="sym-row head"><div>符号</div><div>含义</div><div>单位</div></div>'+p[4].map(symbolHTML).join('')+'</div></section>'+relationHTML(p,i)+'<details class="deep" data-deep="'+i+'"><summary>深入理解：物理意义、推导和例题</summary><div class="deep-content"></div></details><div class="card-practice"><a href="'+QUIZ_HREF+'?mode=example&amp;point='+encodeURIComponent(p[0])+'&amp;source='+encodeURIComponent(SEGMENT_ROOT+'速查版')+'&amp;return='+encodeURIComponent(RETURN_PAGE+'#'+p[0])+'">练这道题 ↗</a></div></article>'}
function deepHTML(p){const ex=p[8];return '<h3>物理意义</h3><p>'+p[6]+'</p>'+(p[7].length?'<h3>推导要点</h3><ol>'+p[7].map(x=>'<li>'+x+'</li>').join('')+'</ol>':'')+(ex[0]?'<h3>典型例题</h3><p>'+ex[0]+'</p><ol>'+ex[1].map(x=>'<li>'+x+'</li>').join('')+'</ol><p class="answer">答案：'+ex[2]+'</p>':'')}
function renderPoints(){const ids=points.map((_,i)=>i).filter(matchPoint);viewBox.className='list';viewBox.innerHTML=ids.map(pointHTML).join('');return ids.length}
function renderFormulas(){const rows=formulas.filter(row=>matchPoint(row[0])&&(!query||row[2].includes(query)));viewBox.className='index-grid';viewBox.innerHTML=rows.map(([i,k])=>'<article class="index-card"><button class="source" data-go="'+i+'">'+points[i][1]+'</button><h2>'+points[i][3][k][0]+'</h2>'+formulaHTML(points[i][3][k])+'</article>').join('');return rows.length}
function renderSymbols(){const rows=symbols.filter(([s,ids])=>ids.some(matchPoint)&&(!query||clean([strip(s[0]),strip(s[1]),strip(s[2]),...ids.map(i=>strip(points[i][1]))].join(' ')).includes(query)));viewBox.className='symbol-grid';viewBox.innerHTML=rows.map(([s,ids])=>{const target=ids.find(matchPoint);return '<article class="symbol-card"><div class="sym-name">'+s[0]+'</div><p>'+s[1]+'</p><div class="sym-unit">'+s[2]+'</div><button class="source" data-go="'+target+'">'+points[target][1]+(ids.length>1?' 等'+ids.length+'处':'')+'</button></article>'}).join('');return rows.length}
function renderMap(){const gs=groups.map((g,i)=>[g,i]).filter(([g])=>(domain==='全部'||g[1]===domain)&&(chapterName==='全部'||g[0]===chapterName));const domains=[...new Set(gs.map(([g])=>g[1]))];viewBox.className='';viewBox.innerHTML='<div class="map-title"><h2>知识脉络</h2><p>按领域与章节串联知识点；章节顺序是学习建议，点击可打开速查卡。</p></div><div class="map-root">'+SEGMENT_ROOT+'</div>'+domains.map(d=>'<section class="map-domain"><h2>'+d+'<small>'+gs.filter(([g])=>g[1]===d).length+'章</small></h2><div class="map-chapters">'+gs.filter(([g])=>g[1]===d).map(([g,gi])=>'<div class="map-chapter"><button data-chapter-go="'+gi+'">'+text(groupName(gi))+' →</button><div class="map-points">'+g[3].map(i=>'<button class="map-point" data-go="'+i+'">'+points[i][1]+'</button>').join('')+'</div></div>').join('')+'</div></section>').join('');return gs.length}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));let count=view==='points'?renderPoints():view==='formulas'?renderFormulas():view==='symbols'?renderSymbols():renderMap();counter.textContent=view==='map'?'知识脉络':'显示 '+count+' 项';document.getElementById('empty').hidden=count>0}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;history.replaceState(null,'','#'+view);render();window.scrollTo(0,0)}));
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{domain=b.dataset.domain;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()}));
chapter.addEventListener('change',()=>{chapterName=chapter.value;render()});search.addEventListener('input',()=>{query=clean(search.value);if(query&&view==='map'){view='points';history.replaceState(null,'','#points')}render()});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==search){e.preventDefault();search.focus()}});
document.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details[data-deep]')&&d.open){const slot=d.querySelector('.deep-content');if(!slot.dataset.loaded){slot.innerHTML=deepHTML(points[Number(d.dataset.deep)]);slot.dataset.loaded='1'}}},true);
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){const i=Number(go.dataset.go);view='points';domain='全部';chapterName='全部';query='';search.value='';chapter.value='全部';document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.domain==='全部'));render();document.getElementById(points[i][0]).scrollIntoView({behavior:'smooth',block:'start'});return}const ch=e.target.closest('[data-chapter-go]');if(ch){view='points';chapterName=groups[Number(ch.dataset.chapterGo)][0];chapter.value=chapterName;render();window.scrollTo(0,0)}});
render();
})();
</script></body></html>
