置前断开开关。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：0.6 A量程分30格，偏10格为0.20 A；不能读成10 A。<\/p><p><b>结论与条件：<\/b>电流表测所在支路电流，不直接并接电源。<\/p><p><b>误差与边界：<\/b>量程读错、极性反接、接触不良与额外内阻影响测量。电流表内阻很小，严禁直接接到电源两极；实验仅用安全低压源。<\/p><\/details>","基础","初中"],["jexp-10","用电压表测电压","在元件两端正确并联测电压。",[["电压表量程和指针格数求电压","<mrow><msub><mi>U<\/mi><mi mathvariant=\"normal\">读数<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>U<\/mi><mi mathvariant=\"normal\">量程<\/mi><\/msub>&#x22C5;<mi>n<\/mi><\/mrow><mi>N<\/mi><\/mfrac><\/mrow>","指针式电压表按均匀刻度读取；n 是指针格数，N 是满量程格数。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"]],[["U<sub>读数<\/sub>","电压表读数","V"],["U<sub>量程<\/sub>","电压表所选量程","V"],["n","指针偏转格数","1"],["N","满量程总格数","1"],["U<sub>1<\/sub>","串联第一元件两端电压","V"],["U<sub>2<\/sub>","串联第二元件两端电压","V"]],[["把电压表格数与满量程格数的比例倒过来。","量程 12 V、满量程 30 格偏转 15 格时，正确读数为 6 V；倒置比例会得到 24 V。"],["把电压表误串联接入被测电路。","电压表应并联在被测元件两端；串联接入会显著改变电路状态。接线前要看清仪表符号和它的接入位置。"]],"电压表并联测两个位置之间的电压，不能拿单个位置当作电压。正柱接较高电势一端，按预估值先大量程试触再选合适小量程；换接时断开开关。把电压表串入会显著改变原电路，不是正确的电压测量。实验只用安全低压电源，记录接法、量程和指针位置，避免只写一个没有对象的数值。\n学习分工：本卡练确定被测两端、并联接表和量程复核；电压定义与单次读数见概念卡（circuit-04），可点击下方知识关系回看。这一链接是相关内容推荐，不表示必须先后学习。",["断开开关，将电压表并联在被测元件两端，正柱接高电势侧。","预估低压源电压，先大量程短暂试触；确定未超程后再断开换小量程。","接通后正视指针，记录量程与分度，换测元件前断开并明确两端位置。"],["测低压电路中某元件两端电压，估计约4 V。电压表有3 V与15 V量程，各30格。说明接法及量程；采用15 V量程读到8格时，能直接换3 V量程吗？",["断开开关，将电压表并联到该元件两端，正柱接较高电势端。","先选择15 V量程试触，读数15×8/30=4 V。","4 V超过3 V，不能换到3 V量程；换接前先断开开关。"],"并联接被测两端；读数4 V，保留15 V量程。"],["circuit-03","tool-07"],["jexp-16","circuit-04"],["用电压表测电压","实验方法","控制变量","数据与误差"],19,"<section class=\"field learning\"><h4>用电压表测电压：实验设计<\/h4><p>电压表并联测两个位置之间的电压，不能拿单个位置当作电压。正柱接较高电势一端，按预估值先大量程试触再选合适小量程；换接时断开开关。把电压表串入会显著改变原电路，不是正确的电压测量。实验只用安全低压电源，记录接法、量程和指针位置，避免只写一个没有对象的数值。<\/p><\/section><details class=\"learning\"><summary>实验：用电压表测量电压<\/summary><p><b>目的：<\/b>在元件两端正确并联测电压。<\/p><p><b>装置与接法：<\/b>低压电路、电压表、开关。<\/p><p><b>控制、改变与观察：<\/b>保持被测元件接点，选择合适量程。<\/p><p><b>步骤：<\/b><\/p><ol><li>断开开关，将电压表并联在被测元件两端，正柱接高电势侧。<\/li><li>预估低压源电压，先大量程短暂试触；确定未超程后再断开换小量程。<\/li><li>接通后正视指针，记录量程与分度，换测元件前断开并明确两端位置。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：3 V量程30格偏20格为2.0 V；15 V同格数则10 V。<\/p><p><b>结论与条件：<\/b>必须结合量程和分度值，电压属于明确两点之间。<\/p><p><b>误差与边界：<\/b>把电压表串联、错认端点、量程和正负端均可出错，不按灯的名称猜电压。只测安全低压源，不用课堂电表接家庭市电；串联接法会改变原电路状态。<\/p><\/details>","基础","初中"],["jexp-11","用电流表探究串并联电路电流的特点","比较串联各处电流及并联干、支路电流。",[["串联电路各处电流相等","<mrow><msub><mi>I<\/mi><mn>1<\/mn><\/msub><mo>=<\/mo><msub><mi>I<\/mi><mn>2<\/mn><\/msub><\/mrow>","元件串联且电路稳定工作，各处没有分支。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"],["并联干路电流","<mrow><mi mathvariant=\"normal\">It<\/mi><mo>=<\/mo><mrow><msub><mi>I<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>I<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mrow>","干路总电流等于并联各支路电流之和。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"]],[["I<sub>1<\/sub>","串联电路第一处电流","A"],["I<sub>平均<\/sub>","单位时间内通过导体横截面的电荷量所对应的电流","A"],["Q","通过导体横截面的电荷量","C"],["t","电荷通过导体横截面的时间","s"],["I<sub>2<\/sub>","串联第二处或并联第二支路的电流","A"],["It","并联电路干路总电流","A"],["U<sub>1<\/sub>","电路第一元件两端电压","V"],["U<sub>2<\/sub>","电路第二元件两端电压","V"],["Ut","电路总电压","V"],["U<sub>读数<\/sub>","电压表读数","V"],["U<sub>量程<\/sub>","电压表所选量程","V"],["n","仪表指针偏转格数","1"],["N","仪表满量程总格数","1"]],[["并联干路电流只算第一支路。","两支路0.20和0.30 A相加为0.50 A，遗漏第二支路只得0.20 A。"],["把并联干路电流误认为两支路电流的乘积。","并联支路汇流时干路电流等于各支路电流之和；0.2 A 和 0.3 A 合为 0.5 A。"],["只用相同规格两灯测一次串联电流，就把相同读数当普遍结论。","应在安全低压下更换不同规格元件、在串联不同位置正确接入电流表复测，排除偶然相同与接表错误。"]],"先分别画出串联、并联电路和各测量位置，电流表始终串入所测支路。串联比较同一回路各处电流，并联比较干路和支路之和；不能默认两支路电流相等。更换不同规格元件并重复，记录读数与误差范围；变化接线前断开电源，避免读数期间电路条件变化使数据失去可比性。",["画并标明各测点，断开开关后正确串入电流表。","先大量程试触，再逐处读数；接线改变之前断开。","串联比较各处电流，并联将支路电流相加与干路比较，换元件再测。"],["低压实验串联三处电流均0.20 A，并联支路0.20 A与0.30 A。求干路电流；为什么要换不同元件重复？",["并联干路为0.20+0.30=0.50 A；串联各处近似相等。","换不同规格元件排除偶然相同读数，电流表应串入所测位置，换接前断开开关。"],"并联干路电流0.50 A；换不同元件取得多组读数，避免把一次接线或读数的偶然结果当成普遍规律。"],["jexp-09"],["jexp-12"],["用电流表探究串并联电路电流的特点","实验方法","控制变量","数据与误差"],19,"<section class=\"field learning\"><h4>用电流表探究串并联电路电流的特点：实验设计<\/h4><p>先分别画出串联、并联电路和各测量位置，电流表始终串入所测支路。串联比较同一回路各处电流，并联比较干路和支路之和；不能默认两支路电流相等。更换不同规格元件并重复，记录读数与误差范围；变化接线前断开电源，避免读数期间电路条件变化使数据失去可比性。<\/p><\/section><details class=\"learning\"><summary>实验：用电流表探究串并联电路电流的特点<\/summary><p><b>目的：<\/b>比较串联各处电流及并联干、支路电流。<\/p><p><b>装置与接法：<\/b>安全低压源、开关、两个不同小灯泡或电阻、电流表与导线。<\/p><p><b>控制、改变与观察：<\/b>串联保持同一回路改变测量位置；并联同步比较干路及各支路，并更换阻值重复。<\/p><p><b>步骤：<\/b><\/p><ol><li>画并标明各测点，断开开关后正确串入电流表。<\/li><li>先大量程试触，再逐处读数；接线改变之前断开。<\/li><li>串联比较各处电流，并联将支路电流相加与干路比较，换元件再测。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：并联干路0.6 A，两支路0.2 A与0.4 A；串联各处电流相等，但不同接法不是同一个电路。<\/p><p><b>结论与条件：<\/b>串联同一回路各处电流相等；并联干路电流等于支路之和，支路电流未必相等。<\/p><p><b>误差与边界：<\/b>错将电流表并联、越量程和测点不同步会改变读数；不能用同规格灯泡一次相等推论所有支路电流相等。<\/p><\/details>","基础","初中"],["jexp-12","用电压表探究串并联电路电压的特点","比较串联部分电压与总电压、并联支路与电源两端电压。",[["串联部分总电压","<mrow><mi mathvariant=\"normal\">Ut<\/mi><mo>=<\/mo><mrow><msub><mi>U<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>U<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mrow>","U<sub>1<\/sub>、U<sub>2<\/sub> 是串联部分各元件两端电压，Ut 是它们两端总电压。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"],["并联支路两端电压相等","<mrow><msub><mi>U<\/mi><mn>1<\/mn><\/msub><mo>=<\/mo><msub><mi>U<\/mi><mn>2<\/mn><\/msub><\/mrow>","U<sub>1<\/sub>、U<sub>2<\/sub> 分别为并联支路两端电压，理想导线连接同一对节点。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"],["并联电路各支路电压复核","<mrow><msub><mi>U<\/mi><mn>1<\/mn><\/msub><mo>=<\/mo><mi mathvariant=\"normal\">Ut<\/mi><\/mrow>","并联支路直接连接在理想导线构成的同一对节点之间。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"]],[["Ut","所测串联部分的总电压或并联电源两端电压，按情境区分","V"],["U<sub>1<\/sub>","第一元件或支路两端电压，按接线区分","V"],["U<sub>2<\/sub>","第二元件或支路两端电压，按接线区分","V"],["n","电压表偏转格数","1"],["N","电压表满量程格数","1"],["U<sub>读数<\/sub>","电压表读数","V"],["U<sub>量程<\/sub>","电压表量程","V"]],[["把串联总电压直接当作其中一个元件电压，遗漏另一元件。","串联总电压是各部分电压之和，本例2 V与4 V合为6 V，不是2 V；并联支路电压相等与串联电压相加是不同关系。"],["将电压表串入电路，再把改变后的读数当正常元件电压。","电压表应并联在被测两端，先大量程试触确认极性和量程，再选择合适量程；移动接线前断开开关，避免把改变电路后的示数用于原关系。"]],"电压是两点之间的量，先在电路图上明确每组端点。串联测各元件电压和总电压，比较其和；并联分别测各支路与电源两端电压。使用不同规格元件重复观察，以排除相同电阻造成的偶然等分。每次改并联位置都先断开开关，保持同组电源和元件状态，不能把电压表串联后改变的读数作为结论。",["画图标明端点，开关断开时将电压表并联到被测元件。","大量程试触确认安全，再记录每个部分与总电压。","串联各部分相加与总电压比较，并联比较支路与电源两端电压。"],["安全低压实验测串联两元件分别2 V与4 V，总电压应为多少？改为并联在6 V电源上，两支路各多少？说明换接电压表的操作。",["串联总电压2+4=6 V；并联接同一对节点，各支路均6 V。","每次换接先断开开关，电压表并联、正端朝高电势，先大量程试触，确认不超量程。"],"串联总电压6 V，并联两支路各6 V；断电后换接电压表，选合适量程并并联于被测两端。"],["jexp-10"],["jexp-16"],["用电压表探究串并联电路电压的特点","实验方法","控制变量","数据与误差"],19,"<section class=\"field learning\"><h4>用电压表探究串并联电路电压的特点：实验设计<\/h4><p>电压是两点之间的量，先在电路图上明确每组端点。串联测各元件电压和总电压，比较其和；并联分别测各支路与电源两端电压。使用不同规格元件重复观察，以排除相同电阻造成的偶然等分。每次改并联位置都先断开开关，保持同组电源和元件状态，不能把电压表串联后改变的读数作为结论。<\/p><\/section><details class=\"learning\"><summary>实验：用电压表探究串并联电路电压的特点<\/summary><p><b>目的：<\/b>比较串联部分电压与总电压、并联支路与电源两端电压。<\/p><p><b>装置与接法：<\/b>安全低压源、开关、不同电阻或灯泡、电压表、导线。<\/p><p><b>控制、改变与观察：<\/b>保持电源和元件不变，改变所并联测量的两个位置，换元件后重复同组比较。<\/p><p><b>步骤：<\/b><\/p><ol><li>画图标明端点，开关断开时将电压表并联到被测元件。<\/li><li>大量程试触确认安全，再记录每个部分与总电压。<\/li><li>串联各部分相加与总电压比较，并联比较支路与电源两端电压。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：串联两部分2 V、4 V合为6 V；并联各支路在理想连线下均为6 V。<\/p><p><b>结论与条件：<\/b>串联总电压为部分电压之和，并联各支路电压相等；串联各部分一般不相等。<\/p><p><b>误差与边界：<\/b>接触不良、量程和电压表负载效应会影响结果；不能将串联和并联的数据混为同一情境。<\/p><\/details>","基础","初中"],["jexp-13","探究影响导体电阻大小的因素","用控制变量比较材料、长度、横截面积与温度对导体电阻的影响。",[["由电压和电流求电阻","<mrow><mi>R<\/mi><mo>=<\/mo><mfrac><mi>U<\/mi><mi>I<\/mi><\/mfrac><\/mrow>","导体两端电压 U 和通过电流 I 来自同一测量状态，I 不为零。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"]],[["U","导体两端电压","V"],["I","通过导体的电流","A"],["R","导体电阻","Ω"],["Rk","以 kΩ 表示的电阻数值","kΩ"],["R<sub>1<\/sub>","第一只电阻","Ω"],["R<sub>2<\/sub>","第二只电阻","Ω"],["Rs","两电阻串联的总电阻","Ω"],["Rp","两电阻并联的等效电阻","Ω"],["It","通过等效电阻的总电流","A"]],[["把 3 kΩ 的数值 3 直接当成 3 Ω 代入，漏掉千欧到欧姆的 1000 倍换算。","6 V 接在 3 kΩ 电阻上，电流应为 0.002 A；把数值 3 当作 Ω 会错误得到 2 A。"],["把欧姆定律误写成电流等于电阻除以电压。","欧姆定律应当用电压除以电阻来求电流；把电阻除以电压不仅关系倒置，所得量纲也不是安培。"],["不说明条件变化就认为电压改变会使导体电阻按比例改变。","电阻由导体材料、长度、横截面积和温度等因素决定；欧姆定律的 U/I 比值在相同条件下描述电阻。"]],"用控制变量分别研究材料、长度、横截面积和温度，每组只改一个因素。比较导体时保持测试电压、温度与接触条件，必要时用电压和电流记录求电阻，而非只凭亮度。一般金属温度升高电阻增大，但这不是所有导电材料的统一结论。下列数值只核对测得的电阻，控制变量结论须结合各组导体的真实条件审查。",["选择一组只改变一个因素的导体，检查低压电路并限流。","接入导体，测它两端电压和流过电流，或在同样测试电压下比较电流。","换组重复，列出保持量与改变量，不凭一次灯亮暗推断所有电阻规律。"],["比较同材料同温度的两根导线，长度相同而横截面积不同；测同一电压下电流，怎样判断电阻影响因素？",["保持材料、温度、长度和测量条件不变，只改变截面积。","同电压下电流较小者电阻较大；再分别控制其余条件研究长度与材料，不能一次全改。"],"用控制变量比较截面积影响，不能由同时改变多个条件归因。"],["jexp-09","jexp-10"],["ohm-03"],["探究影响导体电阻大小的因素","实验方法","控制变量","数据与误差"],19,"<section class=\"field learning\"><h4>探究影响导体电阻大小的因素：实验设计<\/h4><p>用控制变量分别研究材料、长度、横截面积和温度，每组只改一个因素。比较导体时保持测试电压、温度与接触条件，必要时用电压和电流记录求电阻，而非只凭亮度。一般金属温度升高电阻增大，但这不是所有导电材料的统一结论。下列数值只核对测得的电阻，控制变量结论须结合各组导体的真实条件审查。<\/p><\/section><details class=\"learning\"><summary>实验：探究影响导体电阻大小的因素<\/summary><p><b>目的：<\/b>用控制变量比较材料、长度、横截面积与温度对导体电阻的影响。<\/p><p><b>装置与接法：<\/b>低压源、电表、不同材料及不同尺寸导体、安全限流电阻。<\/p><p><b>控制、改变与观察：<\/b>比较长度时固定材料、横截面积与温度；比较横截面积时固定材料、长度与温度；材料或温度比较也分别保持其余量。<\/p><p><b>步骤：<\/b><\/p><ol><li>选择一组只改变一个因素的导体，检查低压电路并限流。<\/li><li>接入导体，测它两端电压和流过电流，或在同样测试电压下比较电流。<\/li><li>换组重复，列出保持量与改变量，不凭一次灯亮暗推断所有电阻规律。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：例如相同测试电压下电流减小，按电压除电流得到的电阻增大；具体计算见情境表。<\/p><p><b>结论与条件：<\/b>同材料同温均匀导体越长电阻通常越大、横截面积越大电阻越小；温度规律要限定材料，不概括全部导体。<\/p><p><b>误差与边界：<\/b>大电流会升温，灯泡亮度不能精确代替电阻值；接触电阻、长度和直径测量偏差应记录。<\/p><\/details>","基础","初中"],["jexp-14","用滑动变阻器改变小灯泡亮度","选择有效接线并利用改变接入长度调节电路电流。",[["定值电阻和变阻器串联总电阻","<mrow><mi mathvariant=\"normal\">Rs<\/mi><mo>=<\/mo><mrow><msub><mi>R<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>R<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mrow>","变阻器与定值电阻串联，忽略导线电阻并使用同一欧姆单位。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"]],[["R<sub>1<\/sub>","定值电阻阻值","Ω"],["R<sub>2<\/sub>","变阻器接入电路的阻值","Ω"],["Rs","两电阻串联的总阻值","Ω"],["U","串联部分两端电压","V"],["I","串联电路电流","A"],["R","由电压和电流得到的等效电阻","Ω"]],[["串联电路只算变阻器电阻，漏固定电阻。","10 Ω固定电阻与20 Ω变阻器串联，总电阻30 Ω，不能只取20 Ω。"],["把变阻器滑片移动方向与阻值变化关系不看接线柱就固定判断。","阻值变化由实际接入电路的下接线柱和滑片位置共同决定，必须结合电路连接判断。"],["计算定值电阻与变阻器串联总阻值时把二者相乘。","串联总电阻为各电阻之和；10 Ω 和 20 Ω 串联应为 30 Ω。"]],"串入滑动变阻器时先认最大阻值和允许电流，选一上一下两个接线柱，再沿实际有效电阻丝长度判断变化。电路闭合前把有效阻值调最大并先电表大量程试触，调节中避免小灯泡和电表超程。滑片移动方向取决于接线柱，不能说左移必减小电阻。附带数值采用定值负载进行校准，不把温变灯丝当固定电阻推算真实亮度。",["认最大阻值与允许电流，选一上一下两个接线柱串入回路。","接通前将有效电阻调最大，试触电表并确认灯泡不过额定条件。","缓慢移动滑片，记录有效电阻变化方向与亮度、电流，及时停止超程操作。"],["用滑动变阻器调低压小灯泡亮度，如何接线和开始调节？若接入电阻增大，为什么通常变暗？",["变阻器与灯泡串联，接一上一下接线柱，初始置最大有效电阻，不能按滑片左右方向固定判断。","安全范围内缓慢调节并观察电流、亮度；接入电阻增大通常使电流减小，灯泡电阻随温度变化，不用定值电阻比例预测亮度。"],"按有效电阻和实际接线判断；初始限流并避免灯泡超额定。"],["ohm-01","jexp-09"],["power-02"],["用滑动变阻器改变小灯泡亮度","实验方法","控制变量","数据与误差"],19,"<section class=\"field learning\"><h4>用滑动变阻器改变小灯泡亮度：实验设计<\/h4><p>串入滑动变阻器时先认最大阻值和允许电流，选一上一下两个接线柱，再沿实际有效电阻丝长度判断变化。电路闭合前把有效阻值调最大并先电表大量程试触，调节中避免小灯泡和电表超程。滑片移动方向取决于接线柱，不能说左移必减小电阻。附带数值采用定值负载进行校准，不把温变灯丝当固定电阻推算真实亮度。<\/p><\/section><details class=\"learning\"><summary>实验：用滑动变阻器改变小灯泡亮度<\/summary><p><b>目的：<\/b>选择有效接线并利用改变接入长度调节电路电流。<\/p><p><b>装置与接法：<\/b>低压电源、额定参数明确的小灯泡、滑动变阻器、开关、电流表、导线。<\/p><p><b>控制、改变与观察：<\/b>保持电源、灯泡和接法不变，改变滑片位置，观察电流与亮度；灯丝升温会改变电阻。<\/p><p><b>步骤：<\/b><\/p><ol><li>认最大阻值与允许电流，选一上一下两个接线柱串入回路。<\/li><li>接通前将有效电阻调最大，试触电表并确认灯泡不过额定条件。<\/li><li>缓慢移动滑片，记录有效电阻变化方向与亮度、电流，及时停止超程操作。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：接入阻值由接线柱和有效电阻丝长度决定；计算例采用定值电阻代替灯泡校准，仅验证接入电阻加法。<\/p><p><b>结论与条件：<\/b>保持回路接法正确时调节接入阻值可改变灯亮度；同下两个接线柱往往等于接全电阻丝，不能调节。<\/p><p><b>误差与边界：<\/b>禁止超允许电流，不把滑片左移统一说成电阻变小；真实灯丝电阻随温度变，定值模型不能证明实际亮度数值。<\/p><\/details>","基础","初中"],["jexp-15","伏安法测电阻","按同一元件的电流与电压求电阻。",[["由电压和电流求电阻","<mrow><mi>R<\/mi><mo>=<\/mo><mfrac><mi>U<\/mi><mi>I<\/mi><\/mfrac><\/mrow>","导体两端电压 U 和通过电流 I 来自同一测量状态，I 不为零。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"]],[["U","导体两端电压","V"],["I","通过导体的电流","A"],["R","导体电阻","Ω"],["Rk","以 kΩ 表示的电阻数值","kΩ"],["R<sub>1<\/sub>","第一只电阻","Ω"],["R<sub>2<\/sub>","第二只电阻","Ω"],["Rs","两电阻串联的总电阻","Ω"],["Rp","两电阻并联的等效电阻","Ω"],["It","通过等效电阻的总电流","A"]],[["把 3 kΩ 的数值 3 直接当成 3 Ω 代入，漏掉千欧到欧姆的 1000 倍换算。","6 V 接在 3 kΩ 电阻上，电流应为 0.002 A；把数值 3 当作 Ω 会错误得到 2 A。"],["把欧姆定律误写成电流等于电阻除以电压。","欧姆定律应当用电压除以电阻来求电流；把电阻除以电压不仅关系倒置，所得量纲也不是安培。"],["不说明条件变化就认为电压改变会使导体电阻按比例改变。","电阻由导体材料、长度、横截面积和温度等因素决定；欧姆定律的 U/I 比值在相同条件下描述电阻。"]],"在低压电路中电流表串联待测电阻，电压表并联其两端，滑动变阻器限制电流并改变测量状态。分别读取对应同一时刻的电压和电流，以比值求电阻；取多组数据检查是否为近似定值，再合理平均。真实电表内阻和接触引入系统影响，平均不能消除接法偏差，也不能把不同温度下灯丝电阻直接平均成固有常数。\n学习分工：本卡练伏安法接线、逐组读数和测量条件；欧姆定律关系见概念卡（Ω-01），可点击下方知识关系回看。这一链接是相关内容推荐，不表示必须先后学习。",["开关断开，电流表串联待测定值电阻，电压表并联其两端；滑变接最大有效阻值。","先大量程试触，再调滑片取得安全范围内不同电压电流数据，每组是同时对应的读数。","每组用电压除电流求电阻，比较散布后合理平均，记录仪器与接线的系统影响。"],["伏安法测同一定值电阻记录2 V、0.20 A与3 V、0.30 A；求电阻并说明电表接法和多次测量意义。",["两组U/I都为10 Ω；电流表串联、电压表并联，换接前断开开关。","在温度稳定的定值电阻下复测可减小偶然误差，不能靠平均消除电表内阻的系统影响。"],"两组电阻均为10 Ω；电流表串联，电压表并联于被测电阻两端；同一定值电阻多次测量可减少随机误差，温度须近似不变。"],["jexp-09","jexp-10"],["jexp-16","ohm-01"],["伏安法测电阻","实验方法","控制变量","数据与误差"],19,"<section class=\"field learning\"><h4>伏安法测电阻：实验设计<\/h4><p>在低压电路中电流表串联待测电阻，电压表并联其两端，滑动变阻器限制电流并改变测量状态。分别读取对应同一时刻的电压和电流，以比值求电阻；取多组数据检查是否为近似定值，再合理平均。真实电表内阻和接触引入系统影响，平均不能消除接法偏差，也不能把不同温度下灯丝电阻直接平均成固有常数。<\/p><\/section><details class=\"learning\"><summary>实验：用电流表和电压表测量电阻<\/summary><p><b>目的：<\/b>按同一元件的电流与电压求电阻。<\/p><p><b>装置与接法：<\/b>低压电源、待测定值电阻、开关、变阻器、两表。<\/p><p><b>控制、改变与观察：<\/b>保持同一电阻且温度近似稳定，改变电压，多次测量。<\/p><p><b>步骤：<\/b><\/p><ol><li>开关断开，电流表串联待测定值电阻，电压表并联其两端；滑变接最大有效阻值。<\/li><li>先大量程试触，再调滑片取得安全范围内不同电压电流数据，每组是同时对应的读数。<\/li><li>每组用电压除电流求电阻，比较散布后合理平均，记录仪器与接线的系统影响。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：1、2、3 V对应0.1、0.2、0.3 A，每次电阻10 Ω。<\/p><p><b>结论与条件：<\/b>伏安法基于同元件同状态的比值，不测两个不对应示数。<\/p><p><b>误差与边界：<\/b>电压表分流和电流表分压造成系统误差；灯丝温度改变时不同状态阻值不能当同一定值平均。<\/p><\/details>","基础","初中"],["jexp-16","探究电流与电压、电阻的关系（欧姆定律）","区分正比和反比的控制条件。",[["欧姆定律求电流","<mrow><mi>I<\/mi><mo>=<\/mo><mfrac><mi>U<\/mi><mi>R<\/mi><\/mfrac><\/mrow>","一段导体温度等条件不变，U 用 V、R 用 Ω。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"],["由电压和电流求电阻","<mrow><mi>R<\/mi><mo>=<\/mo><mfrac><mi>U<\/mi><mi>I<\/mi><\/mfrac><\/mrow>","导体两端电压 U 和通过电流 I 来自同一测量状态，I 不为零。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"]],[["U","导体两端电压","V"],["I","通过导体的电流","A"],["R","导体电阻","Ω"],["Rk","以 kΩ 表示的电阻数值","kΩ"],["R<sub>1<\/sub>","第一只电阻","Ω"],["R<sub>2<\/sub>","第二只电阻","Ω"],["Rs","两电阻串联的总电阻","Ω"],["Rp","两电阻并联的等效电阻","Ω"],["It","通过等效电阻的总电流","A"]],[["把电阻3 kΩ的数值3直接当Ω代入。","6 V与3000 Ω给0.002 A；将3 kΩ的3直接当Ω会算2 A。"],["把欧姆定律的电流公式误写成电阻除以电压。","同一电阻器两端电压 6 V、电阻 12 Ω 时，电流为 0.5 A，而不是 2 A。"],["认为任何电学元件在任何温度下都保持恒定电阻并严格符合欧姆定律。","灯丝等元件温度变化会影响电阻；使用关系式时要看元件和实验条件。"]],"先固定电阻及温度改变两端电压研究电流，再固定待测电阻两端电压改变电阻研究电流。更换电阻后必须重新调滑动变阻器，使电压表恢复指定值；电源电压不变不意味着分压后的待测电阻电压不变。列数据并描图，区分一次点值与多点规律；避免大电流升温，说明欧姆定律适用的是近似欧姆元件。",["探究电流与电压时保持同一电阻和温度，正确串并联电表，滑变初始最大。","改变滑片取得多组电压电流读数，画电流—电压图并检查是否近似过原点。","探究电流与电阻时每次换电阻后调滑片，使待测电阻两端电压回到相同值，再比较电流与电阻。"],["探究电流与电压关系时使用同一电阻；改测电流与电阻关系时，为什么换电阻后还要调变阻器？",["前一探究保持导体电阻和温度近似不变，比较不同电压的电流。","后一探究要保持被测电阻两端电压相同，换电阻后重新调节；不能只维持电源电压就当被测电压不变。"],"两组探究控制变量不同，须保持目标元件电压或电阻的指定条件。"],["jexp-15"],["ohm-02"],["探究电流与电压、电阻的关系（欧姆定律）","实验方法","控制变量","数据与误差"],19,"<section class=\"field learning\"><h4>探究电流与电压、电阻的关系（欧姆定律）：实验设计<\/h4><p>先固定电阻及温度改变两端电压研究电流，再固定待测电阻两端电压改变电阻研究电流。更换电阻后必须重新调滑动变阻器，使电压表恢复指定值；电源电压不变不意味着分压后的待测电阻电压不变。列数据并描图，区分一次点值与多点规律；避免大电流升温，说明欧姆定律适用的是近似欧姆元件。<\/p><\/section><details class=\"learning\"><summary>实验：探究电流与电压、电阻的关系<\/summary><p><b>目的：<\/b>区分正比和反比的控制条件。<\/p><p><b>装置与接法：<\/b>低压电源、开关、定值电阻组、变阻器、电流表串联、电压表并联。<\/p><p><b>控制、改变与观察：<\/b>第一轮固定电阻改变电压；第二轮改变电阻但调变阻器恢复相同电压。<\/p><p><b>步骤：<\/b><\/p><ol><li>探究电流与电压时保持同一电阻和温度，正确串并联电表，滑变初始最大。<\/li><li>改变滑片取得多组电压电流读数，画电流—电压图并检查是否近似过原点。<\/li><li>探究电流与电阻时每次换电阻后调滑片，使待测电阻两端电压回到相同值，再比较电流与电阻。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：10 Ω对应0.1、0.2、0.3 A；3 V下10、15、30 Ω对应0.3、0.2、0.1 A。<\/p><p><b>结论与条件：<\/b>温度等条件稳定时，同电阻电流与电压成正比；同电压电流与电阻成反比。<\/p><p><b>误差与边界：<\/b>换电阻后不恢复电压则变量不受控；发热改变阻值，避免长时间大电流。<\/p><\/details>","基础","初中"],["jexp-17","测量小灯泡的电功率","在额定及不同实际电压下测功率并比较亮度。",[["电压与电流求电功率","<mrow><mi>P<\/mi><mo>=<\/mo><mrow><mi>U<\/mi>&#x22C5;<mi>I<\/mi><\/mrow><\/mrow>","U 用 V、I 用 A，所得功率 P 用 W。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"],["由电功和时间求功率","<mrow><mi>P<\/mi><mo>=<\/mo><mfrac><mi mathvariant=\"normal\">We<\/mi><mi>t<\/mi><\/mfrac><\/mrow>","We 是时间 t 内完成的电功，t 用 s。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"]],[["U","用电器两端电压","V"],["I","通过用电器的电流","A"],["P","电功率","W"],["We","一段时间内完成的电功","J"],["t","完成该电功所用时间","s"],["Q","电阻产生的热量","J"],["R","电阻","Ω"]],[["把以 kW 表示的功率数值直接标成 W，换算时多除以 1000。","220 V×1 A=220 W；若要改写成 kW 才是 0.22 kW，不能把 0.22 标成 W。"],["把功率当作总电能，忽略做功时间。","功率表示做功或用电的快慢，电能表示一段时间内做功的总量；前者单位是 W，后者常用 J 或 kWh，二者不能混淆。"],["把电功率写成 U/I。","电功率可由电压与电流相乘得到；电压除以电流不是瓦特，单位组合也不同，因此不能用它表示功率。"]],"电流表串联灯泡、电压表并联灯泡，滑变限流并调节灯泡端电压。先大量程试触，额定功率取灯泡处于额定电压时的电压电流乘积；低于额定电压得到实际功率。灯丝温度会改变电阻，不把多个工作状态功率求平均当额定功率。本条作为教材重要补充，不混称课标或目录中每个版本的必做项目。",["低压源、灯泡、电流表与滑变串联，电压表并联灯泡；滑变先调最大有效阻值。","先大量程试触，再缓慢调节，分别取得低于、等于额定电压的对应电压电流读数。","每组电压乘电流得该状态功率，额定电压下才是额定功率；观察亮度，不对不同温度的灯丝电阻求固定平均值。"],["安全低压小灯泡额定2.5 V，在2.0 V时电流0.24 A，在2.5 V时0.30 A；求两状态电功率并说明额定功率测量条件。",["实际功率分别2.0×0.24=0.48 W、2.5×0.30=0.75 W。","额定功率须让灯泡电压达到额定2.5 V，不能把较低电压的功率当额定值；避免超额定。"],"实际0.48 W；额定约0.75 W，实验仅使用安全低压。"],["jexp-15"],["power-04"],["测量小灯泡的电功率","实验方法","控制变量","数据与误差"],19,"<section class=\"field learning\"><h4>测量小灯泡的电功率：实验设计<\/h4><p>电流表串联灯泡、电压表并联灯泡，滑变限流并调节灯泡端电压。先大量程试触，额定功率取灯泡处于额定电压时的电压电流乘积；低于额定电压得到实际功率。灯丝温度会改变电阻，不把多个工作状态功率求平均当额定功率。本条作为教材重要补充，不混称课标或目录中每个版本的必做项目。<\/p><\/section><details class=\"learning\"><summary>实验：测量小灯泡电功率<\/summary><p><b>目的：<\/b>在额定及不同实际电压下测功率并比较亮度。<\/p><p><b>装置与接法：<\/b>低压电源、标额定电压小灯泡、两表、变阻器、开关。<\/p><p><b>控制、改变与观察：<\/b>改灯泡两端电压，记录电流和亮度，避免超额定过多。<\/p><p><b>步骤：<\/b><\/p><ol><li>低压源、灯泡、电流表与滑变串联，电压表并联灯泡；滑变先调最大有效阻值。<\/li><li>先大量程试触，再缓慢调节，分别取得低于、等于额定电压的对应电压电流读数。<\/li><li>每组电压乘电流得该状态功率，额定电压下才是额定功率；观察亮度，不对不同温度的灯丝电阻求固定平均值。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：额定2.5 V时0.30 A，功率0.75 W；2.0 V时0.26 A，功率0.52 W。<\/p><p><b>结论与条件：<\/b>额定状态功率须由额定电压下的电流计算；灯丝非恒定电阻。<\/p><p><b>误差与边界：<\/b>不同电压功率不应平均成“额定功率”；本项为教材重要实验，不混称22项必做。<\/p><\/details>","基础","初中教材补充"],["jexp-18","探究通电螺线管外部磁场的方向","用小磁针实际方向识别磁极并核对右手规则。",[["已知线圈电压求电流","<mrow><mi mathvariant=\"normal\">Ic<\/mi><mo>=<\/mo><mfrac><mi mathvariant=\"normal\">Uc<\/mi><mi mathvariant=\"normal\">Rc<\/mi><\/mfrac><\/mrow>","仅作已知电学或能量数据的应用，不验证本卡定性规律。线圈电阻在测量期间近似不变，Uc 用 V、Rc 用 Ω。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"],["由线圈电流求电压","<mrow><mi mathvariant=\"normal\">Uc<\/mi><mo>=<\/mo><mrow><mi mathvariant=\"normal\">Ic<\/mi>&#x22C5;<mi mathvariant=\"normal\">Rc<\/mi><\/mrow><\/mrow>","仅作已知电学或能量数据的应用，不验证本卡定性规律。同一线圈温度等条件稳定，电流和电阻对应一次测量。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"]],[["Uc","电磁铁线圈两端电压","V"],["Ic","通过电磁铁线圈的电流","A"],["Rc","线圈电阻","Ω"],["N","线圈匝数，按匝计数","1"],["U<sub>感<\/sub>","感应电路两端已测得的电压","V"],["I<sub>感<\/sub>","闭合回路中的感应电流","A"],["R<sub>回路<\/sub>","感应电路总电阻","Ω"]],[["把线圈电流换算成 mA 后仍把数值标成 A，导致电流大 1000 倍。","4 V÷20 Ω=0.2 A；换成毫安是 200 mA，不能仍写作 200 A。"],["不看实际绕线，只凭电流大小判断螺线管哪端是N极。","磁极方向由绕线方向及常规电流方向共同决定；相同电流大小反接方向会使N、S极交换。电流大小的数值计算不能验证方向判断。"],["同时反接电流并翻转绕线，却把磁极改变全归因于电流方向。","比较电流方向影响时，保持实际绕线、装置和观察位置不变，只反接电流；否则两个方向因素混在一起，不能单独归因。"]],"用多个外部位置的小磁针观察方向，并先记录地磁背景。右手四指沿线圈的约定电流方向弯曲，拇指指N极；外部磁场从N极指向S极。交换电流方向磁极反转，反接之前断电，线圈应限流避免过热。下列计算仅核对供电电流及电表负载，不验证磁极方向；方向由绕线、接线和小磁针现象人工核对。",["明确线圈绕线与接线，限流接安全低压电源，在外部放小磁针并记未通电指向。","通电观察磁针各处的指向，标出磁针N极方向，再断开并交换电源极性重做。","沿约定电流方向用右手四指握线圈，拇指给出线圈N极；比较外部N到S方向，记录磁场方向证据。"],["通电螺线管附近小磁针稳定后，N极指向管口外侧；如何判断该管口磁极并检验与电流方向的关系？",["小磁针N极指外部磁场方向；该处沿轴向离开管口，管口为N极。","观察实际绕线，用右手四指随常规电流方向弯曲，拇指指N极；只反接电流再观察极性是否翻转。"],"此管口为N极；须依据实际绕线和电流方向，不能仅由线圈电流大小断定。"],["circuit-01"],["magnet-03"],["探究通电螺线管外部磁场的方向","实验方法","控制变量","数据与误差"],19,"<section class=\"field learning\"><h4>探究通电螺线管外部磁场的方向：实验设计<\/h4><p>用多个外部位置的小磁针观察方向，并先记录地磁背景。右手四指沿线圈的约定电流方向弯曲，拇指指N极；外部磁场从N极指向S极。交换电流方向磁极反转，反接之前断电，线圈应限流避免过热。下列计算仅核对供电电流及电表负载，不验证磁极方向；方向由绕线、接线和小磁针现象人工核对。<\/p><\/section><details class=\"learning\"><summary>实验：探究通电螺线管外部磁场方向<\/summary><p><b>目的：<\/b>用小磁针实际方向识别磁极并核对右手规则。<\/p><p><b>装置与接法：<\/b>低压电源、螺线管、小磁针、开关、导线。<\/p><p><b>控制、改变与观察：<\/b>绕向不变，改变电流方向；观察小磁针N极方向。<\/p><p><b>步骤：<\/b><\/p><ol><li>明确线圈绕线与接线，限流接安全低压电源，在外部放小磁针并记未通电指向。<\/li><li>通电观察磁针各处的指向，标出磁针N极方向，再断开并交换电源极性重做。<\/li><li>沿约定电流方向用右手四指握线圈，拇指给出线圈N极；比较外部N到S方向，记录磁场方向证据。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：一个接法观察右端外侧磁针N极向右，判右端为螺线管N极；反接后相反。<\/p><p><b>结论与条件：<\/b>用右手四指顺常规电流，拇指指N端；外部磁场从N到S，反接磁极互换。<\/p><p><b>误差与边界：<\/b>绕向画错、磁针太近其他磁体、线圈过热会干扰；电流换算只是配套测量，不能当磁极方向证据。<\/p><\/details>","基础","初中"],["jexp-19","探究导体在磁场中运动时产生感应电流的条件","观察闭合、切割方向和磁场方向的作用。",[["已测感应电压求回路电流","<mrow><msub><mi>I<\/mi><mi mathvariant=\"normal\">感<\/mi><\/msub><mo>=<\/mo><mfrac><msub><mi>U<\/mi><mi mathvariant=\"normal\">感<\/mi><\/msub><msub><mi>R<\/mi><mi mathvariant=\"normal\">回路<\/mi><\/msub><\/mfrac><\/mrow>","仅作已知电学或能量数据的应用，不验证本卡定性规律。感应电压已由仪表测得，闭合回路近似服从欧姆定律。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"],["由感应电流和回路电阻求电压","<mrow><msub><mi>U<\/mi><mi mathvariant=\"normal\">感<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>I<\/mi><mi mathvariant=\"normal\">感<\/mi><\/msub>&#x22C5;<msub><mi>R<\/mi><mi mathvariant=\"normal\">回路<\/mi><\/msub><\/mrow><\/mrow>","仅作已知电学或能量数据的应用，不验证本卡定性规律。电路闭合，感应电流与回路电阻描述同一测量状态。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"]],[["U<sub>感<\/sub>","感应电压","V"],["I<sub>感<\/sub>","感应电流","A"],["R<sub>回路<\/sub>","感应电路总电阻","Ω"],["P<sub>感<\/sub>","感应电源输出的电功率","W"]],[["把感应电流换算成 mA 后仍将毫安数值标作 A。","0.6 V÷3 Ω=0.2 A=200 mA；若把换算后的 200 写成 A，会大 1000 倍。"],["把感应电流写成感应电压乘以回路电阻。","感应电路测得电压后仍按欧姆定律求电流，应当除以电阻；相乘的单位不是 A。"],["认为只要线圈和磁体静止放在一起就一定有持续感应电流。","需要磁场变化或导体与磁场发生相对运动；静止且磁场不变时没有持续感应电流。"]],"保持磁体与导线有效段确定，比较静止、沿磁感线及切割磁感线运动。闭合回路的有效磁通改变才可能有感应电流；不是任意运动都有效。一次只改变运动方向或磁极方向，观察检流计偏转是否反转；断路时即便有感应电动势也没有回路电流。附带欧姆计算使用实际测得的感应电压，不能冒充感应产生条件和方向的自动证明。",["导体与灵敏检流计构成闭合回路，磁体位置稳定，先记静止基线。","分别沿磁感线和横切磁感线运动，再交换运动方向或磁极，一次只改一个条件。","比较检流计有无偏转与偏转方向，再断开回路重复横切，区分感应电动势与闭路电流。"],["设计检流计观察：闭合回路的导体先沿磁感线移动，再横向有效切割；最后断开回路后再切割，其他条件相同。三次检流计各怎样，应怎样控制变量？",["闭合回路横向切割、有效磁通改变时可出现电流，沿磁感线移动的理想设置没有相应改变。","断开后切割可以有电动势但无闭合回路电流；固定磁场、导体与接法，每次只改变运动方向或回路开闭。"],"沿磁感线移动不偏转，闭合回路有效切割时偏转，断开后切割无回路电流所以不偏转。每次只改变所研究条件；断开时可有感应电动势，不能把无电流当作无电动势。"],["magnet-01"],["emwave-01"],["探究导体在磁场中运动时产生感应电流的条件","实验方法","控制变量","数据与误差"],19,"<section class=\"field learning\"><h4>探究导体在磁场中运动时产生感应电流的条件：实验设计<\/h4><p>保持磁体与导线有效段确定，比较静止、沿磁感线及切割磁感线运动。闭合回路的有效磁通改变才可能有感应电流；不是任意运动都有效。一次只改变运动方向或磁极方向，观察检流计偏转是否反转；断路时即便有感应电动势也没有回路电流。附带欧姆计算使用实际测得的感应电压，不能冒充感应产生条件和方向的自动证明。<\/p><\/section><details class=\"learning\"><summary>实验：探究导体在磁场中产生感应电流的条件<\/summary><p><b>目的：<\/b>观察闭合、切割方向和磁场方向的作用。<\/p><p><b>装置与接法：<\/b>蹄形磁体、直导体、灵敏电流计、开关、导线。<\/p><p><b>控制、改变与观察：<\/b>闭合与断开回路，切割与沿场方向运动，反转运动或磁场；观察指针。<\/p><p><b>步骤：<\/b><\/p><ol><li>导体与灵敏检流计构成闭合回路，磁体位置稳定，先记静止基线。<\/li><li>分别沿磁感线和横切磁感线运动，再交换运动方向或磁极，一次只改一个条件。<\/li><li>比较检流计有无偏转与偏转方向，再断开回路重复横切，区分感应电动势与闭路电流。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：静止不持续偏转；切割时偏转；只反运动或磁场方向，偏转方向相反。<\/p><p><b>结论与条件：<\/b>闭合回路、适当切割运动可产生电流；回路断开虽可能有电压但不形成该闭合电流。<\/p><p><b>误差与边界：<\/b>接触、表灵敏度、运动太慢可使偏转不明显，没观察到不必然证明不存在感应电压。<\/p><\/details>","基础","初中"],["jexp-20","探究光的反射定律","比较角度、同面条件及可逆性。",[["反射定律的角度关系","<mrow><mi>r<\/mi><mo>=<\/mo><mi>i<\/mi><\/mrow>","入射角和反射角均从法线量起；角度使用度数，且反射发生在同一介质侧。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"],["反射线与镜面的夹角","<mrow><mi>α<\/mi><mo>=<\/mo><mrow><mn>90<\/mn><mo>−<\/mo><mi>r<\/mi><\/mrow><\/mrow>","α 是反射线与镜面的夹角，r 是反射角；法线与镜面互相垂直。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"]],[["i","入射角，按度数记录","1"],["r","反射角，按度数记录","1"],["α","反射光线与镜面的夹角，按度数记录","1"]],[["把反射角从镜面而不是法线量起，用余角代替反射角。","入射角30°时从法线量的反射角也是30°，从镜面量到的60°是它的余角，不是反射角。"],["认为只有光滑表面才发生反射。","漫反射和镜面反射都遵守反射定律，差别在于表面是否平整以及反射光的方向分布。"]],"在入射点作法线，入射角和反射角都从法线量起，比较多组数据并检查两光线与法线共面。反射纸板折开后看不见光迹是共面证据之一，需结合装置摆放解释；逆原反射光方向入射可观察光路可逆。纸板要垂直镜面，量角顶点对准入射点，不能拿光线与镜面的夹角直接当入射角。",["平面镜水平放、纸板垂直镜面，在入射点画法线，角度一律从法线量起。","改变入射方向，记录入射角与反射角；折起另一半纸板检查共面现象。","逆反射光方向入射检查光路可逆，重复多个角度并记录量角误差。"],["纸板展开时测入射角35°、反射角35°，把反射侧纸板折起后看不到反射光迹，能否说没有反射？",["角从法线量，数值相等；换几个入射角重复而非只看一组。","折起纸板不能承接原反射光线，支持光线与法线共面，不能断言镜面停止反射。"],"角相等且共面；折纸板改变显示位置，不代表反射消失。"],["light-01"],["jexp-21"],["探究光的反射定律","实验方法","控制变量","数据与误差"],19,"<section class=\"field learning\"><h4>探究光的反射定律：实验设计<\/h4><p>在入射点作法线，入射角和反射角都从法线量起，比较多组数据并检查两光线与法线共面。反射纸板折开后看不见光迹是共面证据之一，需结合装置摆放解释；逆原反射光方向入射可观察光路可逆。纸板要垂直镜面，量角顶点对准入射点，不能拿光线与镜面的夹角直接当入射角。<\/p><\/section><details class=\"learning\"><summary>实验：探究光的反射定律<\/summary><p><b>目的：<\/b>比较角度、同面条件及可逆性。<\/p><p><b>装置与接法：<\/b>平面镜、可折白纸板、安全光源、量角器。<\/p><p><b>控制、改变与观察：<\/b>改变入射角，记录反射角；折纸板观察反射线是否仍在该面。<\/p><p><b>步骤：<\/b><\/p><ol><li>平面镜水平放、纸板垂直镜面，在入射点画法线，角度一律从法线量起。<\/li><li>改变入射方向，记录入射角与反射角；折起另一半纸板检查共面现象。<\/li><li>逆反射光方向入射检查光路可逆，重复多个角度并记录量角误差。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：20°、30°、50°入射，对应20°、30°、50°反射。<\/p><p><b>结论与条件：<\/b>两角相等、分居法线两侧且共面，光路可逆。<\/p><p><b>误差与边界：<\/b>镜面与纸板不垂直、量角起点用镜面、光束过粗会偏差；不把激光照向眼睛。<\/p><\/details>","基础","初中"],["jexp-21","探究平面镜成像的特点","定位虚像、比较大小和像物关系。",[["平面镜像距关系","<mrow><msub><mi>d<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><msub><mi>d<\/mi><mn>1<\/mn><\/msub><\/mrow>","物距和像距均指垂直于镜面的距离。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"],["平面镜像高关系","<mrow><msub><mi>h<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><msub><mi>h<\/mi><mn>1<\/mn><\/msub><\/mrow>","物体和像的高度采用相同长度单位。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"]],[["d<sub>1<\/sub>","物体到平面镜的距离","m"],["d<sub>2<\/sub>","像到平面镜的距离","m"],["h<sub>1<\/sub>","物体高度","m"],["h<sub>2<\/sub>","像的高度","m"]],[["误认为像距只有物距的一半。","平面镜成像关于镜面对称，像距等于物距；物距 0.5 m 时像距应是 0.5 m。"],["认为平面镜所成的像可以用光屏接收到。","平面镜像是反射光线反向延长线的交点，属于虚像；应通过成像实验和光线图辨析。"]],"用薄玻璃板既能观察像又能看见后方定位物；玻璃板竖直，两支蜡烛或同形发光物体完全相同。移动后方物体到与像重合，用刻度尺量物距像距，再改变前方距离重复。玻璃板斜放会使后方物体不能与像完全重合，厚板可能产生重影。移去定位物后光屏接不到像，是虚像的证据，眼睛仍可观察它。",["玻璃板竖直放在纸上标明镜面，一物体放前方，另一相同物体在后方移动。","使后方物体与像重合，记录位置与大小；若不能重合先检查玻璃板是否竖直。","用刻度尺量物距与像距，改变物距重复；移去后方物体，用光屏尝试接像判断虚实。"],["薄玻璃板竖直放置，用相同蜡烛找到重合位置，量得物距0.8 m；像距是多少，如何检验虚像？",["相同蜡烛可比较大小与像的位置，像距约0.8 m；换位置重复比较。","把光屏放到像位置不能直接承接清晰像；玻璃板过厚易重影，不竖直会使重合困难。"],"像距约0.8 m，等大正立虚像；光屏检验而非凭看见就称实像。"],["jexp-01","light-03"],["jexp-22"],["探究平面镜成像的特点","实验方法","控制变量","数据与误差"],19,"<section class=\"field learning\"><h4>探究平面镜成像的特点：实验设计<\/h4><p>用薄玻璃板既能观察像又能看见后方定位物；玻璃板竖直，两支蜡烛或同形发光物体完全相同。移动后方物体到与像重合，用刻度尺量物距像距，再改变前方距离重复。玻璃板斜放会使后方物体不能与像完全重合，厚板可能产生重影。移去定位物后光屏接不到像，是虚像的证据，眼睛仍可观察它。<\/p><\/section><details class=\"learning\"><summary>实验：探究平面镜成像特点<\/summary><p><b>目的：<\/b>定位虚像、比较大小和像物关系。<\/p><p><b>装置与接法：<\/b>薄玻璃板及支架、两支完全相同蜡烛或同形安全发光物体、白纸、刻度尺、光屏。<\/p><p><b>控制、改变与观察：<\/b>一物固定，移动另一等大物定位像；改变物距重复。<\/p><p><b>步骤：<\/b><\/p><ol><li>玻璃板竖直放在纸上标明镜面，一物体放前方，另一相同物体在后方移动。<\/li><li>使后方物体与像重合，记录位置与大小；若不能重合先检查玻璃板是否竖直。<\/li><li>用刻度尺量物距与像距，改变物距重复；移去后方物体，用光屏尝试接像判断虚实。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：物到镜面10 cm，定位像也10 cm；移动物到15 cm，像距15 cm，大小仍等大。<\/p><p><b>结论与条件：<\/b>等距等大、连线垂直镜面；光屏不能接收像，属于虚像。<\/p><p><b>误差与边界：<\/b>厚玻璃产生双像、玻璃未竖直导致难重合、两物不等大影响比较；尽量用安全物屏替代明火。玻璃板太厚会重影，两物体须大小形状相同；像不能直接由光屏接收，不能把后方物体当作像本身。<\/p><\/details>","基础","初中"],["jexp-22","探究凸透镜成像的规律","覆盖焦点内外各区间，比较虚实、正倒、大小和像距。",[["物距为二倍焦距时像距等于物距","<mrow><mi>v<\/mi><mo>=<\/mo><mi>u<\/mi><\/mrow>","凸透镜成像实验中物距 u=2f，此时为倒立、等大的实像，v=2f。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"],["物距为二倍焦距时像高等于物高","<mrow><msub><mi>h<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><msub><mi>h<\/mi><mn>1<\/mn><\/msub><\/mrow>","凸透镜物距 u=2f 时，像为倒立、等大的实像。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"],["薄透镜像距拓展核对","<mrow><msub><mi>v<\/mi><mi mathvariant=\"normal\">代<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><mi>f<\/mi>&#x22C5;<mi>u<\/mi><\/mrow><mrow><mi>u<\/mi><mo>−<\/mo><mi>f<\/mi><\/mrow><\/mfrac><\/mrow>","薄透镜近轴模型，u为正且u不等于f；实像正、物侧虚像负。只供拓展验算，不要求初中背诵；u=f用光线平行定性处理。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"]],[["u","物距，即物体到凸透镜的距离","m"],["v","像距，即像到凸透镜的距离","m"],["h<sub>1<\/sub>","物体高度","m"],["h<sub>2<\/sub>","像的高度","m"],["f","凸透镜焦距，拓展公式使用","m"],["v<sub>代<\/sub>","带符号像距，实像正、物侧虚像负","m"]],[["把物距为二倍焦距时的像距误写成物距的一半。","当 u=2f 时，v 也为 2f，因此 v=u；物距为 0.20 m 时像距不是 0.10 m。"],["认为凸透镜无论物距如何都成倒立实像。","物体位于焦点以内时，凸透镜成正立、放大的虚像；像的性质必须结合物距和焦距判断。"]],"先测焦距，使物体中心、透镜光心和光屏中心大致同高。依次比较大于二倍、等于二倍、一到二倍、等于一倍及小于一倍焦距；前三类可移动光屏找到清晰实像，焦点处理想模型无有限距离清晰像，焦内须透镜另一侧直接观察虚像。记录物像距、正倒、大小和虚实，不能由光屏没接到就推断必是虚像；薄透镜式仅作拓展校验。",["测焦距，调物屏中心、光心和光屏中心大致同高。","依次取大于2倍、等于2倍、1倍与2倍之间，记录可接收实像。","取等于焦距观察无有限清晰屏像，再取焦距内透过透镜观察虚像。"],["焦距10 cm凸透镜，分别将物体置30 cm、15 cm、5 cm处；怎样移动光屏、观察并记录成像规律？",["30 cm时在一至二倍焦距间找缩小倒立实像；15 cm时在二倍焦距外找放大倒立实像。","5 cm在焦内，光屏无法接虚像，从透镜另一侧直接观察正立放大像；各中心调同高，不把光屏未对准误判为虚像。"],"30 cm处在另一侧得到倒立缩小实像，15 cm处得到倒立放大实像，移动光屏寻找清晰像；5 cm处得到正立放大虚像，光屏接不到，须透过透镜观察并记录。"],["lens-02","jexp-01"],["lens-04"],["探究凸透镜成像的规律","实验方法","控制变量","数据与误差"],19,"<section class=\"field learning\"><h4>探究凸透镜成像的规律：实验设计<\/h4><p>先测焦距，使物体中心、透镜光心和光屏中心大致同高。依次比较大于二倍、等于二倍、一到二倍、等于一倍及小于一倍焦距；前三类可移动光屏找到清晰实像，焦点处理想模型无有限距离清晰像，焦内须透镜另一侧直接观察虚像。记录物像距、正倒、大小和虚实，不能由光屏没接到就推断必是虚像；薄透镜式仅作拓展校验。<\/p><\/section><details class=\"learning\"><summary>实验：探究凸透镜成像规律<\/summary><p><b>目的：<\/b>覆盖焦点内外各区间，比较虚实、正倒、大小和像距。<\/p><p><b>装置与接法：<\/b>光具座、已测焦距凸透镜、LED物屏、光屏和刻度尺。<\/p><p><b>控制、改变与观察：<\/b>同一透镜，改变物距并移动光屏找清晰像，记录性质和像距。<\/p><p><b>步骤：<\/b><\/p><ol><li>测焦距，调物屏中心、光心和光屏中心大致同高。<\/li><li>依次取大于2倍、等于2倍、1倍与2倍之间，记录可接收实像。<\/li><li>取等于焦距观察无有限清晰屏像，再取焦距内透过透镜观察虚像。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：焦距10 cm：物距30、20、15 cm，示例像距15、20、30 cm；物距5 cm虚像在物侧，屏不能接收。<\/p><p><b>结论与条件：<\/b>各区间性质见基础表，虚像须用眼睛观察；物距恰为焦距不编造有限像距。<\/p><p><b>误差与边界：<\/b>未同高、物距从透镜边缘起量、没有找清晰像会影响读数；光屏不到位不能反推该像必为虚像。<\/p><\/details>","基础","初中主线；公式含拓展"],["jmdl-01","柱体压强的切割与叠加","均匀直柱体水平放置，底面完全受支持且只计自身重力时，底面平均压强等于密度乘重力加速度再乘高度。",[["自重除实际受力面积","<mrow><mi>p<\/mi><mo>=<\/mo><mfrac><mrow><mi>m<\/mi>&#x22C5;<mi>g<\/mi><\/mrow><mi>S<\/mi><\/mfrac><\/mrow>","物体静止放在水平面上，无其他竖直力，S&gt;0为实际接触面积。"],["均匀直柱高度式","<mrow><mi>p<\/mi><mo>=<\/mo><mrow><mrow><mi>ρ<\/mi>&#x22C5;<mi>g<\/mi><\/mrow>&#x22C5;<mi>h<\/mi><\/mrow><\/mrow>","均匀直柱、自重、水平底面完全受支持；额外作用力和不规则形体不得直接套用。"]],[["p","地面平均压强","Pa"],["m","柱体质量","kg"],["g","重力加速度","m/s²"],["S","现受力面积","m²"],["S0","切割前底面积","m²"],["ρ","均匀材料密度","kg/m³"],["h","柱体高度","m"]],[["竖切后只减质量，仍使用切割前底面积算压强。","竖切改变质量也改变实际接触面积；半柱10 N除现面积0.005 m²还是2000 Pa，若仍除旧面积0.01 m²会误得1000 Pa。"],["任意形体都把底面压强写成密度乘重力加速度乘高度。","快捷式来自均匀直柱体质量与底面积、高度的关系，形体不规则、底面支持不完整或有额外压力时必须回到压力除受力面积，不能仅看高度。"]],"竖切使质量和底面积同比减少，高度不变，压强不变；横切后高度减小，保留在地面的下部压强减小。同底面积叠加同材料柱体高度增加，压强增大。密度乘重力加速度乘高度的快捷式限均匀直柱、自重、水平完整支持，不适用于任意容器或有额外压力的物体。压力是总作用力，压强还必须除实际面积。",["原压强20/0.010=2000 Pa。","竖切后10/0.005=2000 Pa，横切后10/0.010=1000 Pa。","竖切使质量和底面积同比减少，高度不变，压强不变；横切后高度减小，保留在地面的下部压强减小。"],["密度1000 kg/m³的直柱高0.20 m，质量2 kg、底面积0.010 m²，g取10；竖切与横切一半后分别求压强。",["原压强20/0.010=2000 Pa。","竖切后10/0.005=2000 Pa，横切后10/0.010=1000 Pa。"],"竖切不变为2000 Pa，横切下部为1000 Pa。"],["pressure-01"],["pressure-02"],["柱体压强的切割与叠加","条件与边界","实验与证据"],20,"<section class=\"field learning\"><h4>柱体压强的切割与叠加：方法与边界<\/h4><p>竖切使质量和底面积同比减少，高度不变，压强不变；横切后高度减小，保留在地面的下部压强减小。同底面积叠加同材料柱体高度增加，压强增大。密度乘重力加速度乘高度的快捷式限均匀直柱、自重、水平完整支持，不适用于任意容器或有额外压力的物体。压力是总作用力，压强还必须除实际面积。<\/p><\/section>","基础","初中"],["jmdl-02","浮力三态（漂浮、悬浮、沉底）","物体在静止液体中平衡时，漂浮与悬浮均由浮力平衡重力，沉底通常还受支持力。",[["排液求浮力","<mrow><mi mathvariant=\"normal\">Fb<\/mi><mo>=<\/mo><mrow><mrow><mi>ρ<\/mi>&#x22C5;<mi>g<\/mi><\/mrow>&#x22C5;<mi mathvariant=\"normal\">Vd<\/mi><\/mrow><\/mrow>","液体接触相关表面且符合通常阿基米德浮力条件。"],["平衡时底面支持力","<mrow><mi>N<\/mi><mo>=<\/mo><mrow><mrow><mi>m<\/mi>&#x22C5;<mi>g<\/mi><\/mrow><mo>−<\/mo><mi mathvariant=\"normal\">Fb<\/mi><\/mrow><\/mrow>","静止平衡，仅受重力、浮力和底面支持；适用沉底样例或无支持的平衡。"]],[["Fb","液体浮力","N"],["N","底面支持力","N"],["ρ","液体密度","kg/m³"],["g","重力加速度","m/s²"],["Vd","排开液体体积","m³"],["V","物体总体积","m³"],["m","物体质量","kg"],["G","物体重力","N"]],[["漂浮时把物体总体积代入浮力式，忽略只有一部分排水。","漂浮样例物体总体积400 cm³，但实际只排200 cm³水；全体积会算4 N，而正确浮力2 N已经平衡重力。漂浮时排水部分由平衡决定。"],["一旦接触容器底就认为浮力等于重力，或不问下表面是否通水。","通常沉底对象还受向上支持力，浮力可以小于重力；若底面密封使水不能作用于下表面，常规排液公式的压力条件发生变化，必须单独分析。"]],"常规不溶、不吸水均匀物体在同一液体里，物体密度小于液体时部分浸没漂浮，等于时可完全浸没悬浮，大于时下沉至底。在水能接触下表面的沉底平衡中，浮力加底面支持力等于重力；底部密封隔绝水的情形不能直接用排液浮力式。浮力取决于排开体积而非总把物体总体积代入。还受绳拉力或在加速中的对象不属于这些简化平衡。",["重力为8 N，排400 cm³水的重力为4 N。","平衡支持力为8-4=4 N，不能说浮力等于重力。","常规不溶、不吸水均匀物体在同一液体里，物体密度小于液体时部分浸没漂浮，等于时可完全浸没悬浮，大于时下沉至底。"],["0.8 kg物体总体积400 cm³，完全浸没后沉底且下表面能通水，水密度1000 kg/m³、g取10，求浮力与支持力。",["重力为8 N，排400 cm³水的重力为4 N。","平衡支持力为8-4=4 N，不能说浮力等于重力。"],"浮力4 N，底面支持力4 N。"],["pressure-04"],["pressure-05"],["浮力三态（漂浮、悬浮、沉底）","条件与边界","实验与证据"],20,"<section class=\"field learning\"><h4>浮力三态（漂浮、悬浮、沉底）：方法与边界<\/h4><p>常规不溶、不吸水均匀物体在同一液体里，物体密度小于液体时部分浸没漂浮，等于时可完全浸没悬浮，大于时下沉至底。在水能接触下表面的沉底平衡中，浮力加底面支持力等于重力；底部密封隔绝水的情形不能直接用排液浮力式。浮力取决于排开体积而非总把物体总体积代入。还受绳拉力或在加速中的对象不属于这些简化平衡。<\/p><\/section>","基础","初中"],["jmdl-03","液面升降与排液体积","在横截面积不变且不溢出的容器中，液面变化由占用液面以下空间的总体积变化决定。",[["船载新增排水体积","<mrow><msub><mi>V<\/mi><mn>1<\/mn><\/msub><mo>=<\/mo><mfrac><mi>m<\/mi><mi>ρ<\/mi><\/mfrac><\/mrow>","石块在船上，船仍漂浮；ρ是液体密度，V<sub>1<\/sub>仅为这块石头造成的新增排水体积。"],["石块完全浸没体积","<mrow><msub><mi>V<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><mfrac><mi>m<\/mi><mi mathvariant=\"normal\">rho2<\/mi><\/mfrac><\/mrow>","石块完全浸没，ρ2为石块密度；无吸水或空腔改变排水体积。"],["等截面液面变化","<mrow><mi mathvariant=\"normal\">dh<\/mi><mo>=<\/mo><mfrac><mrow><msub><mi>V<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>V<\/mi><mn>1<\/mn><\/msub><\/mrow><mi>S<\/mi><\/mfrac><\/mrow>","容器水平截面积S恒定；V<sub>1<\/sub>、V<sub>2<\/sub>是同一物体两种状态的排水体积，dh为末态减初态。"]],[["V<sub>1<\/sub>","船载石块新增排水体积","m³"],["V<sub>2<\/sub>","沉底石块体积","m³"],["dh","带符号液面变化","m"],["m","石块质量","kg"],["ρ","水密度","kg/m³"],["ρ2","石块密度","kg/m³"],["S","容器水平截面积","m²"]],[["船载石块时仍按石块自身体积算新增排水。","漂浮的船须额外排开与石块等重的水，200 g石块使船增加200 cm³排水，不是石块自身的100 cm³。"],["漂浮的冰融化在任何液体中都不改变液面。","水中纯冰的结论依赖排水和融水密度相同；在盐水中融水体积一般较大。还要说明不溢流、没有外力和忽略热胀冷缩。"]],"比较同一容器前后液面，先分别判断漂浮平衡、完全浸没还是有外力支持，再算前后占用体积。船载石块投入水中沉底，石块密度大于水，前排水体积大于后排水体积，液面下降。把完全浸没的物体取出时，其原排液体积不再占水下空间，液面下降，下降量为原排液体积除容器截面积。纯冰在水中漂浮后融化，融水体积等于原排水体积，理想条件下液面不变；盐水中不能直接照搬，融水与原排盐水的密度不同。忽略温度引起的体积变化且无溢流时才可这样比较。",["载在船上新增排水200 cm³，沉底后占100 cm³。","体积差-100 cm³除0.1 m²，得-0.001 m。","比较同一容器前后液面，先分别判断漂浮平衡、完全浸没还是有外力支持，再算前后占用体积。"],["船原来漂浮，载有200 g、密度2 g/cm³石块，石块投入水中完全浸没并沉底；水密度1 g/cm³，容器水平截面0.1 m²，忽略水的损失，求液面变化。",["载在船上新增排水200 cm³，沉底后占100 cm³。","体积差-100 cm³除0.1 m²，得-0.001 m。"],"液面下降1 mm。"],["jmdl-02"],["pressure-05"],["液面升降与排液体积","条件与边界","实验与证据"],20,"<section class=\"field learning\"><h4>液面升降与排液体积：方法与边界<\/h4><p>比较同一容器前后液面，先分别判断漂浮平衡、完全浸没还是有外力支持，再算前后占用体积。船载石块投入水中沉底，石块密度大于水，前排水体积大于后排水体积，液面下降。把完全浸没的物体取出时，其原排液体积不再占水下空间，液面下降，下降量为原排液体积除容器截面积。纯冰在水中漂浮后融化，融水体积等于原排水体积，理想条件下液面不变；盐水中不能直接照搬，融水与原排盐水的密度不同。忽略温度引起的体积变化且无溢流时才可这样比较。<\/p><\/section>","基础","初中"],["jmdl-04","动态电路与安全调节范围","定值电阻与滑动变阻器串联在恒定低压电源上，接入变阻器电阻增大使电流减小。",[["总电阻求电流","<mrow><mi>I<\/mi><mo>=<\/mo><mfrac><mi>U<\/mi><mrow><mi>R<\/mi><mo>+<\/mo><mi mathvariant=\"normal\">Rv<\/mi><\/mrow><\/mfrac><\/mrow>","R与接入的Rv串联，均为欧姆电阻且R+Rv&gt;0；U是该串联组合两端电压。"],["定值电阻电压","<mrow><msub><mi>U<\/mi><mn>1<\/mn><\/msub><mo>=<\/mo><mrow><mi>I<\/mi>&#x22C5;<mi>R<\/mi><\/mrow><\/mrow>","R为串联定值电阻，I是流过它的电流，温度近似不变。"],["变阻器分压","<mrow><mi mathvariant=\"normal\">Uv<\/mi><mo>=<\/mo><mrow><mi>U<\/mi><mo>−<\/mo><msub><mi>U<\/mi><mn>1<\/mn><\/msub><\/mrow><\/mrow>","变阻器与定值电阻串联；U为总电压，U<sub>1<\/sub>为定值电阻分压，使用一致的电压方向。"]],[["I","串联电流","A"],["U","电源电压","V"],["R","定值电阻","Ω"],["Rv","变阻器接入电阻","Ω"],["U<sub>1<\/sub>","定值电阻电压","V"],["Uv","变阻器电压","V"]],[["算电流时只用变阻器电阻，遗漏串联定值电阻。","总电阻为10 Ω加接入的20 Ω，电流0.2 A；仅除20 Ω会误得0.3 A，也会误判安全范围。"],["只满足电流表量程就认为安全。","还要检查电压表跨接对象、负载功率和变阻器额定电流；本例电压表3 V对应0.3 A，是更严的电流限制。"]],"先画实际接线，确定滑片改变的是哪段有效电阻，再判断各表所测对象。例中电源6 V，定值电阻10 Ω，电压表跨定值电阻量程3 V，电流表量程0.6 A，变阻器最大50 Ω且额定电流足够。电压表给出电流不得大于0.3 A，比电流表限制更严，因此变阻器须在10到50 Ω。电压表跨变阻器时限制会改变，不能机械照搬。公式限理想表、定值电阻和恒压电源，不把温度变化的灯泡当定值电阻。",["电压表限制I≤3/10=0.3 A，因此总电阻至少20 Ω。","减去10 Ω定值电阻，变阻器至少10 Ω，且不超过铭牌50 Ω。","先画实际接线，确定滑片改变的是哪段有效电阻，再判断各表所测对象。"],["6 V电源串联10 Ω电阻和0到50 Ω变阻器，电压表跨10 Ω电阻且量程3 V，电流表0.6 A，求接入范围。",["电压表限制I≤3/10=0.3 A，因此总电阻至少20 Ω。","减去10 Ω定值电阻，变阻器至少10 Ω，且不超过铭牌50 Ω。"],"在其额定电流足够的条件下，接入10到50 Ω。"],["ohm-03","circuit-04"],["jmdl-05"],["动态电路与安全调节范围","条件与边界","实验与证据"],20,"<section class=\"field learning\"><h4>动态电路与安全调节范围：方法与边界<\/h4><p>先画实际接线，确定滑片改变的是哪段有效电阻，再判断各表所测对象。例中电源6 V，定值电阻10 Ω，电压表跨定值电阻量程3 V，电流表量程0.6 A，变阻器最大50 Ω且额定电流足够。电压表给出电流不得大于0.3 A，比电流表限制更严，因此变阻器须在10到50 Ω。电压表跨变阻器时限制会改变，不能机械照搬。公式限理想表、定值电阻和恒压电源，不把温度变化的灯泡当定值电阻。<\/p><\/section>","基础","初中"],["jmdl-05","电路故障（断路与短路）","串联电路断路后理想电流为零，局部短路使该处电阻趋近零并改变总电流。",[["有限总电阻电流","<mrow><mi>I<\/mi><mo>=<\/mo><mfrac><mi>U<\/mi><mrow><msub><mi>R<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>R<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mfrac><\/mrow>","R<sub>1<\/sub>、R<sub>2<\/sub>为串联回路实际接入电阻，R<sub>1<\/sub>+R<sub>2<\/sub>&gt;0；短接支路取零但不允许整个回路理想零电阻。"],["第二部分电压","<mrow><msub><mi>U<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><mrow><mi>I<\/mi>&#x22C5;<msub><mi>R<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mrow>","R<sub>2<\/sub>为实际接入的第二部分电阻，I流过它；若被理想短接则R<sub>2<\/sub>=0、U<sub>2<\/sub>=0。"]],[["I","串联电流","A"],["U","电源电压","V"],["R<sub>1<\/sub>","仍接入的限流电阻","Ω"],["R<sub>2<\/sub>","第二支路等效电阻","Ω"],["U<sub>2<\/sub>","第二部分电压","V"]],[["正常时把第二个电阻漏掉，仍用第一个电阻算总电流。","正常甲总电阻10 Ω，对应0.6 A；只除5 Ω会得到局部短接后的1.2 A，把正常和故障状态混为一谈。"],["看见电流表零就唯一断言某个指定电阻断路。","还可能是其他导线断开、电源失效或表故障；限定候选故障并结合跨接电压、逐段检查才能判断，单个示数不足以排除所有情况。"]],"两个电阻串联时，第二个被理想导线短接，第二个电压近零而电流增大；不能说所有短路都使电流为零。第二个电阻断开、其他接线正常且高内阻电压表跨断口时，电流近零而电压表可接近电源电压。若表本身、导线或电源也可能损坏，一组示数未必唯一定位故障。电压表逐段排查时，先确认电源和表正常，再按回路依次跨接候选导线或元件；仅在单一断点、其余连通且表内阻远大于负载时，跨断口接近电源电压，跨完好导线近零。以下定量只计算正常与局部短接，保持首个电阻限流；不得用导线直接短接真实电源。",["总电阻由10 Ω变为5 Ω，电流由0.6 A变为1.2 A。","短接部分等效电阻零，电压为零；这不是全电路断路。","两个电阻串联时，第二个被理想导线短接，第二个电压近零而电流增大；不能说所有短路都使电流为零。"],["6 V电源接两个5 Ω串联电阻，第二个被理想导线短接且首电阻能安全限流，求电流与第二部分电压。",["总电阻由10 Ω变为5 Ω，电流由0.6 A变为1.2 A。","短接部分等效电阻零，电压为零；这不是全电路断路。"],"电流1.2 A，第二部分电压0 V。"],["circuit-02","ohm-01"],["jmdl-04"],["电路故障（断路与短路）","条件与边界","实验与证据"],20,"<section class=\"field learning\"><h4>电路故障（断路与短路）：方法与边界<\/h4><p>两个电阻串联时，第二个被理想导线短接，第二个电压近零而电流增大；不能说所有短路都使电流为零。第二个电阻断开、其他接线正常且高内阻电压表跨断口时，电流近零而电压表可接近电源电压。若表本身、导线或电源也可能损坏，一组示数未必唯一定位故障。电压表逐段排查时，先确认电源和表正常，再按回路依次跨接候选导线或元件；仅在单一断点、其余连通且表内阻远大于负载时，跨断口接近电源电压，跨完好导线近零。以下定量只计算正常与局部短接，保持首个电阻限流；不得用导线直接短接真实电源。<\/p><\/section>","基础","初中"],["jmdl-06","多挡电热器的功率比较","多挡电热器通过切换电阻连接方式改变同一电压下的等效电阻和功率。",[["串联低挡功率","<mrow><msub><mi>P<\/mi><mn>1<\/mn><\/msub><mo>=<\/mo><mfrac><msup><mi>U<\/mi><mn>2<\/mn><\/msup><mrow><msub><mi>R<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>R<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mfrac><\/mrow>","低挡时两电热电阻串联，使用同一恒定电源电压U，忽略导线损耗和电阻温升变化。"],["并联高挡功率","<mrow><msub><mi>P<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><mrow><mfrac><msup><mi>U<\/mi><mn>2<\/mn><\/msup><msub><mi>R<\/mi><mn>1<\/mn><\/msub><\/mfrac><mo>+<\/mo><mfrac><msup><mi>U<\/mi><mn>2<\/mn><\/msup><msub><mi>R<\/mi><mn>2<\/mn><\/msub><\/mfrac><\/mrow><\/mrow>","高挡时两电热电阻并联且均承受U；R<sub>1<\/sub>、R<sub>2<\/sub>&gt;0，电阻温度条件与所给值一致。"]],[["P1","串联低挡总功率","W"],["P2","并联高挡总功率","W"],["U","恒定电源电压","V"],["R<sub>1<\/sub>","第一电阻","Ω"],["R<sub>2<\/sub>","第二电阻","Ω"],["I<sub>1<\/sub>","独立测量串联总电流","A"],["I<sub>2<\/sub>","独立测量并联总电流","A"]],[["低挡串联时仍用一个电阻作为总电阻算功率。","串联20 Ω与30 Ω的总电阻50 Ω，12 V功率2.88 W；只取20 Ω会误得7.2 W，错误对应另一种接线。"],["任何供电条件下电阻越小功率都越小或都越大。","恒压时功率与电阻反比，恒流时功率与电阻正比；先确认电源条件和等效电路，实际元件还受额定电流与温度影响。"]],"对开关状态分别画电路，不能只凭开关数量说高低挡。两个正电阻串联的总电阻最大、功率较小，并联时两支路各接电源电压、总功率为支路功率之和。单独接一个电阻的功率在对应串并联两挡之间。这里用低压设计参数比较理想纯电阻；恒流供电或电阻随温度改变时，方向和数值须重新分析。家用市电内部线路不可拆接练习。",["串联总电阻50 Ω，功率144/50=2.88 W。","并联各接12 V，总功率144/20+144/30=12 W。","对开关状态分别画电路，不能只凭开关数量说高低挡。"],["12 V恒压电源与20 Ω、30 Ω纯电阻，比较两电阻串联与并联的总功率。",["串联总电阻50 Ω，功率144/50=2.88 W。","并联各接12 V，总功率144/20+144/30=12 W。"],"串联2.88 W，并联12 W。"],["power-02"],["power-03"],["多挡电热器的功率比较","条件与边界","实验与证据"],20,"<section class=\"field learning\"><h4>多挡电热器的功率比较：方法与边界<\/h4><p>对开关状态分别画电路，不能只凭开关数量说高低挡。两个正电阻串联的总电阻最大、功率较小，并联时两支路各接电源电压、总功率为支路功率之和。单独接一个电阻的功率在对应串并联两挡之间。这里用低压设计参数比较理想纯电阻；恒流供电或电阻随温度改变时，方向和数值须重新分析。家用市电内部线路不可拆接练习。<\/p><\/section>","基础","初中"],["jmdl-07","机械效率（竖直与水平拉动）","机械效率是有用功与总输入功之比。",[["竖直提升效率","<mrow><mi>η<\/mi><mo>=<\/mo><mfrac><mrow><mrow><mi>m<\/mi>&#x22C5;<mi>g<\/mi><\/mrow>&#x22C5;<mi>h<\/mi><\/mrow><mrow><mrow><mi>F<\/mi>&#x22C5;<mi>n<\/mi><\/mrow>&#x22C5;<mi>h<\/mi><\/mrow><\/mfrac><\/mrow>","负载匀速竖直提升h&gt;0；恒定绳端拉力F，n段绳承重且绳不可伸长，绳端距离为n·h。"],["水平拉动效率","<mrow><mi mathvariant=\"normal\">eta2<\/mi><mo>=<\/mo><mfrac><mrow><mi>f<\/mi>&#x22C5;<mi>s<\/mi><\/mrow><mrow><mrow><mi mathvariant=\"normal\">Fh<\/mi>&#x22C5;<mi>n<\/mi><\/mrow>&#x22C5;<mi>s<\/mi><\/mrow><\/mfrac><\/mrow>","水平移动且动滑轮高度不变，目标为克服该物体摩擦；s大于零。"]],[["η","竖直提升效率","1"],["η2","水平拉动效率","1"],["m","提升物体质量","kg"],["g","重力加速度","m/s²"],["h","提升高度","m"],["F","绳端竖直拉力","N"],["n","有效支持绳段数","1"],["f","水平目标摩擦力","N"],["s","水平物体位移","m"],["Fh","水平绳端拉力","N"],["W<sub>外<\/sub>ra","竖直过程独立核计额外功","J"],["W<sub>总<\/sub>","绳端输入功","J"]],[["把绳端位移当物体位移，漏掉支持绳段倍数。","两绳支持时绳端移2h，输入为F乘2h，不能用Fh；样例甲漏倍数会算出大于一的效率，违背功的账目。"],["水平拉动物体也把有用功写成物重乘水平距离。","重力与水平位移垂直不做该功；本模型有用功为克服目标摩擦力做功，机械装置高度不变时动滑轮重力也不形成提升功。"]],"滑轮组绳端移动距离由支持动滑轮的有效绳段数决定，而非数所有画出的绳线或定滑轮个数。竖直匀速提升时有用功为物重乘提升高度，总功为绳端拉力乘绳端位移；水平匀速移动时有用功为物体所受摩擦力乘物体位移，不能套物重乘高度。额外功可来自动滑轮重力和摩擦。功的选取依赖任务目标，效率应在零到一之间，忽略耗散的理想机械可等于一。\n学习分工：本卡在水平滑轮约束下识别有用功和总功；机械效率定义见概念卡（machine-03），可点击下方知识关系回看。这一链接是相关内容推荐，不表示必须先后学习。",["竖直有用10 J，总功7×2×1=14 J，效率71.4%。","水平有用4×0.5=2 J，总功3×2×0.5=3 J，效率66.7%。","滑轮组绳端移动距离由支持动滑轮的有效绳段数决定，而非数所有画出的绳线或定滑轮个数。"],["二绳支持滑轮组提升1 kg物体1 m，拉力7 N，g取10；另水平克服4 N摩擦移0.5 m，绳端拉力3 N且二绳支持。",["竖直有用10 J，总功7×2×1=14 J，效率71.4%。","水平有用4×0.5=2 J，总功3×2×0.5=3 J，效率66.7%。"],"竖直约71.4%，水平约66.7%。"],["machine-04"],["machine-03"],["机械效率（竖直与水平拉动）","条件与边界","实验与证据"],20,"<section class=\"field learning\"><h4>机械效率（竖直与水平拉动）：方法与边界<\/h4><p>滑轮组绳端移动距离由支持动滑轮的有效绳段数决定，而非数所有画出的绳线或定滑轮个数。竖直匀速提升时有用功为物重乘提升高度，总功为绳端拉力乘绳端位移；水平匀速移动时有用功为物体所受摩擦力乘物体位移，不能套物重乘高度。额外功可来自动滑轮重力和摩擦。功的选取依赖任务目标，效率应在零到一之间，忽略耗散的理想机械可等于一。<\/p><\/section>","基础","初中"],["jmdl-08","不规则容器与地面压强","容器对地面的平均压强由容器和所装物质总重除实际受力面积得到。",[["静止总地面压力","<mrow><mi>F<\/mi><mo>=<\/mo><mrow><mrow><mo>(<\/mo><mi mathvariant=\"normal\">mc<\/mi><mo>+<\/mo><mi mathvariant=\"normal\">ml<\/mi><mo>)<\/mo><\/mrow><mi>g<\/mi><\/mrow><\/mrow>","容器与液体共同静止在水平地面，无其他竖直外力；mc、ml分别为容器和液体质量。"],["实际接触面积求压强","<mrow><mi>p<\/mi><mo>=<\/mo><mfrac><mi>F<\/mi><mi>S<\/mi><\/mfrac><\/mrow>","F为垂直接触面的总压力，S&gt;0为实际接触面积，不用容器内液体面积替代。"]],[["F","总地面压力","N"],["p","地面平均压强","Pa"],["mc","容器质量","kg"],["ml","液体质量","kg"],["g","重力加速度","m/s²"],["S","支脚总接触面积","m²"],["A","容器内部底面积","m²"],["F<sub>0<\/sub>","独立测力台示值","N"]],[["把容器内部底面积当成支脚实际接触面积。","压力作用于支脚接触地面的8 cm²，不是内部100 cm²；误用后者会得到1200 Pa而不是15000 Pa。"],["液体底部压力在任何形状容器里都等于液体重量。","不规则侧壁可对液体施加竖直分力，底部压力还须结合侧壁作用；地面承载总重与液体内部底部压力不可互换。"]],"在水平地面静止、无其他竖直外力时，容器对地面压力等于容器及液体总重。实际接触面积可能是几个支脚面积之和，并不等于容器内部底面积。液体压强乘内部底面积给出液体对底的压力，但形状不规则时侧壁也有竖直力，底部液体压力未必等于液体重量。切割、倾倒或加支脚后，应重新算保留质量和接触面积，不能直接套均匀直柱体的高度快捷式。",["总重为1.2×10=12 N。","支脚面积为8×10⁻⁴ m²，压强12/(8×10⁻⁴)=15000 Pa。","在水平地面静止、无其他竖直外力时，容器对地面压力等于容器及液体总重。"],["容器质量0.2 kg、液体1.0 kg，支脚总面积8 cm²，内部底面积100 cm²，g取10，求地面平均压强。",["总重为1.2×10=12 N。","支脚面积为8×10⁻⁴ m²，压强12/(8×10⁻⁴)=15000 Pa。"],"地面平均压强15000 Pa。"],["pressure-01","jmdl-01"],["pressure-02"],["不规则容器与地面压强","条件与边界","实验与证据"],20,"<section class=\"field learning\"><h4>不规则容器与地面压强：方法与边界<\/h4><p>在水平地面静止、无其他竖直外力时，容器对地面压力等于容器及液体总重。实际接触面积可能是几个支脚面积之和，并不等于容器内部底面积。液体压强乘内部底面积给出液体对底的压力，但形状不规则时侧壁也有竖直力，底部液体压力未必等于液体重量。切割、倾倒或加支脚后，应重新算保留质量和接触面积，不能直接套均匀直柱体的高度快捷式。<\/p><\/section>","基础","初中"],["jmdl-09","温度图像与物态变化","温度随时间图像的纵坐标表示温度，斜率表示单位时间温度变化。",[["温度纵坐标之差","<mrow><mi mathvariant=\"normal\">dT<\/mi><mo>=<\/mo><mrow><msub><mi>T<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>T<\/mi><mn>1<\/mn><\/msub><\/mrow><\/mrow>","T<sub>1<\/sub>、T<sub>2<\/sub>是同一加热过程的两次温度读数，单位一致；温差为末读数减初读数。"],["电热输入能量","<mrow><mi>E<\/mi><mo>=<\/mo><mrow><mi>P<\/mi><mrow><mo>(<\/mo><msub><mi>t<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>t<\/mi><mn>1<\/mn><\/msub><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","t<sub>2<\/sub>&gt;t<sub>1<\/sub>且电热器功率P在此段恒定；E为输入电能，不默认全部被样品吸收。"]],[["dT","温度变化","K"],["T<sub>1<\/sub>","阶段起始绝对温度","K"],["T<sub>2<\/sub>","阶段末绝对温度","K"],["E","电热器输入能量","J"],["P","输入功率","W"],["t<sub>1<\/sub>","阶段起始时刻","s"],["t<sub>2<\/sub>","阶段末时刻","s"],["m","样品质量","kg"],["c","该段比热容","J/kg/K"],["E<sub>损<\/sub>","该段向环境散失能量","J"]],[["求温差时把起始和末温度相加。","温差取末减初，不是绝对温度之和；293.15 K到333.15 K为40 K，平台期间两个相同温度相减为零。"],["平台期间温度不变，所以没有吸热或放热。","物态变化可在温度不变时改变内能；熔化吸热、凝固放热，图像只给温度，不能单靠斜率判定热量为零。"]],"先读横纵轴量、单位和比例，再分段判断升温、降温和平台。纯晶体在一定压强下熔化吸热、凝固放热且温度可保持不变；非晶体没有同样明确的熔点平台。沸腾平台还受气压、液体纯度影响。设计图中20到60 ℃后出现60 ℃平台，只用于读图，不把它说成某种已测材料。电热输入能量不全等于样品吸热，须计热损失；升温热量公式不能用于平台期间的相变热量。",["温差分别为40 ℃和0 ℃，不能把时间坐标当温度。","每段均120 s，输入10×120=1200 J；平台输入不表示温度上升。","先读横纵轴量、单位和比例，再分段判断升温、降温和平台。"],["10 W电热器使设计样品在前2 min从20 ℃到60 ℃，随后2 min温度保持60 ℃，求两段温差和输入能量。",["温差分别为40 ℃和0 ℃，不能把时间坐标当温度。","每段均120 s，输入10×120=1200 J；平台输入不表示温度上升。"],"两段温差40 ℃、0 ℃；各输入1200 J。"],["state-03"],["energy-02"],["温度图像与物态变化","条件与边界","实验与证据"],20,"<section class=\"field learning\"><h4>温度图像与物态变化：方法与边界<\/h4><p>先读横纵轴量、单位和比例，再分段判断升温、降温和平台。纯晶体在一定压强下熔化吸热、凝固放热且温度可保持不变；非晶体没有同样明确的熔点平台。沸腾平台还受气压、液体纯度影响。设计图中20到60 ℃后出现60 ℃平台，只用于读图，不把它说成某种已测材料。电热输入能量不全等于样品吸热，须计热损失；升温热量公式不能用于平台期间的相变热量。<\/p><\/section><figure class=\"learning\"><svg viewBox=\"0 0 450 235\" role=\"img\" aria-label=\"设计数据：升温后进入熔化平台\" style=\"width:100%;max-width:560px\"><title>设计数据：升温后进入熔化平台<\/title><path d=\"M55 35V185H390\" fill=\"none\" stroke=\"currentColor\"/><polyline points=\"55.00,150.00 136.25,115.00 217.50,80.00 298.75,80.00 380.00,80.00\" fill=\"none\" stroke=\"#2457d6\" stroke-width=\"2\"/><text x=\"55.0\" y=\"202\">0<\/text><text x=\"136.25\" y=\"202\">1<\/text><text x=\"217.5\" y=\"202\">2<\/text><text x=\"298.75\" y=\"202\">3<\/text><text x=\"380.0\" y=\"202\">4<\/text><text x=\"8\" y=\"189.0\">0<\/text><text x=\"8\" y=\"154.0\">20<\/text><text x=\"8\" y=\"119.0\">40<\/text><text x=\"8\" y=\"84.0\">60<\/text><text x=\"8\" y=\"49.0\">80<\/text><text x=\"298.75\" y=\"72.0\">60<\/text><text x=\"280\" y=\"226\">时间 / min<\/text><text x=\"60\" y=\"25\">温度 / ℃<\/text><\/svg><figcaption>先读温度纵坐标，再读平台斜率；平台温度60 ℃而不是3 ℃。<\/figcaption><\/figure>","基础","初中"],["jmdl-10","杠杆最小动力与最大力臂","固定支点、动力作用点与阻力矩时，要使动力最小，应让动力方向垂直于支点到动力作用点的连线，使动力臂达到最大。",[["力矩平衡求动力","<mrow><mi>F<\/mi><mo>=<\/mo><mfrac><mrow><mi>G<\/mi>&#x22C5;<msub><mi>l<\/mi><mn>2<\/mn><\/msub><\/mrow><mrow><mi>L<\/mi>&#x22C5;<mrow><mi mathvariant=\"normal\">sin<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>θ<\/mi><mo>)<\/mo><\/mrow><\/mrow><\/mfrac><\/mrow>","杠杆静止，动力作用点到支点距离L，θ为动力与该连线夹角且sin(θ)&gt;0；l<sub>2<\/sub>为阻力的垂直力臂。"],["动力矩","<mrow><mi>M<\/mi><mo>=<\/mo><mrow><mrow><mi>F<\/mi>&#x22C5;<mi>L<\/mi><\/mrow>&#x22C5;<mrow><mi mathvariant=\"normal\">sin<\/mi><mo>&#x2061;<\/mo><mo>(<\/mo><mi>θ<\/mi><mo>)<\/mo><\/mrow><\/mrow><\/mrow>","F为动力大小，L为支点到动力作用点距离，θ为两者夹角；计算力矩大小，不替代正负方向判断。"]],[["F","平衡动力","N"],["G","阻力","N"],["l<sub>2<\/sub>","阻力臂","m"],["L","支点到动力作用点距离","m"],["θ","动力与连线夹角","rad"],["M","动力矩","N·m"]],[["斜拉时直接用支点到作用点距离作为动力臂。","三十度斜拉的力臂是0.4 m的一半，误用全长会低估动力为5 N；正确动力10 N，垂直拉才只需5 N。"],["力臂就是杠杆长度，或者沿杆拉也能提供同样力矩。","力臂由支点与力作用线决定；沿支点到作用点连线施力时力臂为零，无法平衡非零阻力矩。最小动力必须在固定几何和阻力条件下比较。"]],"先画支点和两力作用线，再从支点作垂线，不能把支点到作用点的距离直接当任意方向的力臂。在固定作用点距离下，垂直施力的力臂最大，所需动力最小；斜拉时垂直距离变小，所需动力增大。动力沿连线施加时力臂为零，不能平衡非零阻力矩。这里忽略杠杆自重，或已将其并入阻力矩；若改变支点、作用点或其他力，最小力条件须重新判断。正弦表达式只作为几何拓展校验。",["所需平衡力矩为10×0.2=2 N·m。","垂直力臂0.4 m需5 N；斜拉力臂0.2 m需10 N。","先画支点和两力作用线，再从支点作垂线，不能把支点到作用点的距离直接当任意方向的力臂。"],["忽略自重的杠杆平衡，阻力10 N、阻力臂0.2 m，动力作用点距支点0.4 m，比较动力垂直于支点—作用点连线与夹角30°两种情况下的动力大小。",["所需平衡力矩为10×0.2=2 N·m。","垂直力臂0.4 m需5 N；斜拉力臂0.2 m需10 N。"],"垂直施力需5 N；与支点—作用点连线夹角30°时需10 N；作用点固定时垂直施力最省力。"],["machine-01"],["machine-04"],["杠杆最小动力与最大力臂","条件与边界","实验与证据"],20,"<section class=\"field learning\"><h4>杠杆最小动力与最大力臂：方法与边界<\/h4><p>先画支点和两力作用线，再从支点作垂线，不能把支点到作用点的距离直接当任意方向的力臂。在固定作用点距离下，垂直施力的力臂最大，所需动力最小；斜拉时垂直距离变小，所需动力增大。动力沿连线施加时力臂为零，不能平衡非零阻力矩。这里忽略杠杆自重，或已将其并入阻力矩；若改变支点、作用点或其他力，最小力条件须重新判断。正弦表达式只作为几何拓展校验。<\/p><\/section>","基础","初中"]]}</script><script>
(()=>{'use strict';
const data=JSON.parse(document.getElementById('kb-data').textContent),groups=data.g,points=data.p;
const SEGMENT_ROOT='初中物理',QUIZ_HREF='quiz-junior.html',RETURN_PAGE='junior-quick.html';
const viewBox=document.getElementById('content'),search=document.getElementById('search'),chapter=document.getElementById('chapter'),counter=document.getElementById('count');
const strip=s=>{const e=document.createElement('div');e.innerHTML=s||'';return(e.textContent||'').toLowerCase()};
// 统一全半角并按空白分词：学生可以输入“牛顿 第二定律”，无需记住连续原文。
const clean=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/\s+/g,' ').trim();
const terms=()=>query.split(' ').filter(Boolean);
const contains=s=>terms().every(word=>s.includes(word));
const text=s=>{const e=document.createElement('span');e.textContent=s||'';return e.innerHTML};
const groupName=i=>groups[i][0].split('·').slice(1).join('·').trim()||groups[i][0];
let view=['chapters','points','formulas','symbols','map'].includes(location.hash.slice(1))?location.hash.slice(1):'chapters';
let domain='全部',chapterName='全部',query='';
const pointIndex=new Map(points.map((p,i)=>[p[0],i]));

// 搜索只从给人看的字段建立索引，不把公式解析器的内部名称重新写进页面。
// 每个字段保留命中位置；折叠内容也建立索引，搜索时主动展开。
const searchSections=points.map(p=>[['标题和定义',[p[1],p[2],p[11].join(' '),groups[p[12]][0]]],['核心正文',[p[13]]],['物理意义',[p[6]]],['推导',p[7]],['例题',[p[8][0],...p[8][1],p[8][2]]],['公式',p[3].flat()],['符号',p[4].flat()],['易错点',p[5].flat()]].map(([label,parts])=>[label,clean(parts.map(strip).join(' '))]));
const pointSearch=searchSections.map(parts=>parts.map(x=>x[1]).join(' '));
function hits(i){return query?searchSections[i].filter(x=>terms().some(word=>x[1].includes(word))).map(x=>x[0]):[]}

const formulas=[];points.forEach((p,i)=>p[3].forEach((f,k)=>formulas.push([i,k,clean([strip(p[1]),...f.map(strip),...p[4].flat().map(strip),groups[p[12]][0]].join(' '))])));
const symbols=[],symbolMap=new Map();points.forEach((p,i)=>p[4].forEach(s=>{const key=s.join('|');if(!symbolMap.has(key)){symbolMap.set(key,symbols.length);symbols.push([s,[i]])}else symbols[symbolMap.get(key)][1].push(i)}));

function matchPoint(i){const p=points[i],g=groups[p[12]];return(domain==='全部'||g[1]===domain)&&(chapterName==='全部'||g[0]===chapterName)&&(!query||contains(pointSearch[i]))}
function formulaHTML(f){return '<div class="formula"><div class="formula-name">'+f[0]+'</div><div class="math"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block">'+f[1]+'</math></div>'+(f[2]?'<div class="when">适用：'+f[2]+'</div>':'')+'</div>'}
function symbolHTML(s){return '<div class="sym-row"><div class="sym-name">'+s[0]+'</div><div>'+s[1]+'</div><div class="sym-unit">'+s[2]+'</div></div>'}
function errorHTML(e){return '<div class="error"><b>'+e[0]+'</b><p>'+e[1]+'</p></div>'}
function relationHTML(p,i){const before=p[9].map(id=>pointIndex.get(id)).filter(x=>x!==undefined),after=p[10].map(id=>pointIndex.get(id)).filter(x=>x!==undefined);const row=(label,list)=>list.length?'<div class="relation-line"><span>'+label+'</span>'+list.map(j=>'<button data-go="'+j+'">'+points[j][1]+'</button>').join('')+'</div>':'';return before.length||after.length?'<section class="relations"><h3>知识关系</h3>'+row('先理解',before)+row('接着看',after)+'</section>':''}
function pointHTML(i){const p=points[i],g=groups[p[12]],more=p[5].length>2?'<details class="more-errors"><summary>查看其余 '+(p[5].length-2)+' 条常见错误</summary>'+p[5].slice(2).map(errorHTML).join('')+'</details>':'';return '<article class="card" id="'+p[0]+'">'+(query?'<p class="search-hit">命中：'+hits(i).map(label=>'<button data-hit-point="'+i+'" data-hit-label="'+label+'">'+label+'</button>').join('、')+'</p>':'')+'<div class="path">难度：'+text(p[14])+' · 范围：'+text(p[15])+' · '+g[1]+' · '+text(groupName(p[12]))+'</div><h2>'+p[1]+'</h2><p class="definition">'+p[2]+'</p>'+p[13]+'<section class="block"><h3>公式与适用范围</h3><div class="formulas">'+p[3].map(formulaHTML).join('')+'</div></section><section class="block"><h3>容易出错</h3>'+p[5].slice(0,2).map(errorHTML).join('')+more+'</section><section class="block"><h3>符号与单位</h3><div class="symbols"><div class="sym-row head"><div>符号</div><div>含义</div><div>单位</div></div>'+p[4].map(symbolHTML).join('')+'</div></section>'+relationHTML(p,i)+'<details class="deep" data-deep="'+i+'"><summary>深入理解：物理意义、推导和例题</summary><div class="deep-content"></div></details><div class="card-practice"><a href="'+QUIZ_HREF+'#mode=example&amp;point='+encodeURIComponent(p[0])+'&amp;source='+encodeURIComponent(SEGMENT_ROOT+'速查版')+'&amp;return='+encodeURIComponent(RETURN_PAGE+'#'+p[0])+'">练这道题 ↗</a></div></article>'}
function deepHTML(p){const ex=p[8];return '<h3>物理意义</h3><p>'+p[6]+'</p>'+(p[7].length?'<h3>推导要点</h3><ol>'+p[7].map(x=>'<li>'+x+'</li>').join('')+'</ol>':'')+(ex[0]?'<h3>典型例题</h3><p>'+ex[0]+'</p><ol>'+ex[1].map(x=>'<li>'+x+'</li>').join('')+'</ol><p class="answer">答案：'+ex[2]+'</p>':'')}
// 概览只组合已有定义、公式和条件，不生成新的教学结论或考试权重。
function renderChapters(){
  const gs=groups.map((g,i)=>[g,i]).filter(([g])=>(domain==='全部'||g[1]===domain)&&(chapterName==='全部'||g[0]===chapterName));
  if(chapterName!=='全部'&&gs.length===1){
    const [g,gi]=gs[0];viewBox.className='';
    viewBox.innerHTML='<section class="chapter-overview"><div class="chapter-meta">'+text(g[1])+' · '+g[3].length+' 个知识点</div><h2>'+text(groupName(gi))+'</h2><p>先看定义与公式，点击知识点查看适用条件、推导、易错点和例题。难度与范围沿用原内容。</p><div class="overview-actions"><button data-all-chapters>全部章节</button><button data-chapter-detail>查看本章完整知识点</button><button data-print-chapter>打印本章概览</button></div>'+g[3].map(i=>{const p=points[i];return '<article class="outline-point"><div><div class="outline-scope">'+text(p[14])+' · '+text(p[15])+'</div><h3><button data-go="'+i+'">'+p[1]+'</button></h3><p>'+p[2]+'</p><button class="source" data-go="'+i+'">查看条件、易错点与例题</button></div>'+(p[3].length?formulaHTML(p[3][0]):'')+'</article>'}).join('')+'</section>';
    return g[3].length;
  }
  viewBox.className='chapter-grid';
  viewBox.innerHTML=gs.map(([g,gi])=>'<article class="chapter-card"><div class="chapter-meta">'+text(g[1])+' · '+g[3].length+' 个知识点 · '+g[3].reduce((n,i)=>n+points[i][3].length,0)+' 条公式</div><h2><button data-chapter-go="'+gi+'">'+text(groupName(gi))+'</button></h2><div class="chapter-points">'+g[3].slice(0,4).map(i=>'<button data-go="'+i+'">'+points[i][1]+'</button>').join('')+'</div><button class="chapter-open" data-chapter-go="'+gi+'">查看本章重点'+(g[3].length>4?'（共'+g[3].length+'点）':'')+'</button></article>').join('');
  return gs.length;
}
function pointScore(i){const p=points[i],title=clean(strip(p[1])),tags=clean(p[11].map(strip).join(' '));return(title===query?100:0)+terms().reduce((n,t)=>n+(title.includes(t)?12:0)+(tags.includes(t)?4:0),0)}
function renderPoints(){const ids=points.map((_,i)=>i).filter(matchPoint);if(query)ids.sort((a,b)=>pointScore(b)-pointScore(a)||a-b);viewBox.className='list';viewBox.innerHTML=ids.map(pointHTML).join('');if(query)ids.forEach(i=>{const card=document.getElementById(points[i][0]);if(hits(i).some(x=>['物理意义','推导','例题'].includes(x))){const d=card.querySelector('.deep');d.querySelector('.deep-content').innerHTML=deepHTML(points[i]);d.querySelector('.deep-content').dataset.loaded='1';d.open=true}card.querySelectorAll('details.learning,details.more-errors').forEach(d=>{if(terms().some(word=>clean(strip(d.innerHTML)).includes(word)))d.open=true})});return ids.length}
function renderFormulas(){const rows=formulas.filter(row=>matchPoint(row[0])&&(!query||contains(row[2])));viewBox.className='index-grid';viewBox.innerHTML=rows.map(([i,k])=>'<article class="index-card"><button class="source" data-go="'+i+'">'+points[i][1]+'</button><h2>'+points[i][3][k][0]+'</h2>'+formulaHTML(points[i][3][k])+'</article>').join('');return rows.length}
function renderSymbols(){const rows=symbols.filter(([s,ids])=>ids.some(matchPoint)&&(!query||contains(clean([strip(s[0]),strip(s[1]),strip(s[2]),...ids.map(i=>strip(points[i][1]))].join(' ')))));viewBox.className='symbol-grid';viewBox.innerHTML=rows.map(([s,ids])=>{const target=ids.find(matchPoint);return '<article class="symbol-card"><div class="sym-name">'+s[0]+'</div><p>'+s[1]+'</p><div class="sym-unit">'+s[2]+'</div><button class="source" data-go="'+target+'">'+points[target][1]+(ids.length>1?' 等'+ids.length+'处':'')+'</button></article>'}).join('');return rows.length}
function renderMap(){const gs=groups.map((g,i)=>[g,i]).filter(([g])=>(domain==='全部'||g[1]===domain)&&(chapterName==='全部'||g[0]===chapterName));const domains=[...new Set(gs.map(([g])=>g[1]))];viewBox.className='';viewBox.innerHTML='<div class="map-title"><h2>知识脉络</h2><p>按领域与章节串联知识点；章节顺序是学习建议，点击可打开速查卡。</p></div><div class="map-root">'+SEGMENT_ROOT+'</div>'+domains.map(d=>'<section class="map-domain"><h2>'+d+'<small>'+gs.filter(([g])=>g[1]===d).length+'章</small></h2><div class="map-chapters">'+gs.filter(([g])=>g[1]===d).map(([g,gi])=>'<div class="map-chapter"><button data-chapter-go="'+gi+'">'+text(groupName(gi))+' →</button><div class="map-points">'+g[3].map(i=>'<button class="map-point" data-go="'+i+'">'+points[i][1]+'</button>').join('')+'</div></div>').join('')+'</div></section>').join('');return gs.length}
function render(){document.querySelectorAll('.nav button').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-pressed',String(b.dataset.view===view))});let count=view==='chapters'?renderChapters():view==='points'?renderPoints():view==='formulas'?renderFormulas():view==='symbols'?renderSymbols():renderMap();counter.textContent=view==='chapters'?(chapterName==='全部'?'显示 '+count+' 个章节':'本章 '+count+' 个知识点'):view==='map'?'知识脉络':'显示 '+count+' 项';document.getElementById('empty').hidden=count>0;document.getElementById('clear-search').hidden=!search.value;document.getElementById('active-scope').textContent=(domain==='全部'?'全部领域':domain)+' / '+(chapterName==='全部'?'全部章节':chapterName)}
// 每一条浏览历史保存搜索、筛选、视图、展开项和滚动位置；复制链接仍只携带知识点编号。
let restoring=false,scrollTimer,readingHash=location.hash,restorationRun=0;
history.scrollRestoration='manual';
// 吸顶导航换行后同步高度，筛选栏仍在导航下方可操作。
new ResizeObserver(()=>{document.documentElement.style.setProperty('--appbar-height',document.querySelector('.appbar').offsetHeight+'px');document.documentElement.style.setProperty('--filters-height',document.querySelector('.filters').offsetHeight+'px')}).observe(document.querySelector('.appbar'));
new ResizeObserver(()=>document.documentElement.style.setProperty('--filters-height',document.querySelector('.filters').offsetHeight+'px')).observe(document.querySelector('.filters'));
function readingState(){return {version:1,segment:SEGMENT_ROOT,hash:location.hash,view,domain,chapterName,search:search.value,scrollY:window.scrollY,details:[...viewBox.querySelectorAll('details')].map((d,i)=>[i,d.open])}}
// 后退已改变地址而页面尚未恢复时，不把旧页面的延迟滚动回调写进新历史条目。
function saveReading(hash){if(restoring||location.hash!==readingHash)return;const state=readingState();if(hash!==undefined)state.hash=hash;history.replaceState({quickReading:state},'',hash===undefined?location.href:hash);readingHash=location.hash}
function loadDeep(d){const slot=d.querySelector('.deep-content');if(slot&&!slot.dataset.loaded){slot.innerHTML=deepHTML(points[Number(d.dataset.deep)]);slot.dataset.loaded='1'}}
function setFilters(){search.value=search.value||'';chapter.value=chapterName;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.domain===domain))}
function restorePoint(){
  const run=++restorationRun;readingHash=location.hash;
  let id;try{id=decodeURIComponent(location.hash.slice(1))}catch(e){return}
  const state=history.state&&history.state.quickReading;
  const valid=state&&state.version===1&&state.segment===SEGMENT_ROOT&&state.hash===location.hash;
  restoring=true;
  if(valid){view=state.view;domain=state.domain;chapterName=state.chapterName;search.value=state.search;query=clean(state.search)}
  else {const chapterId=/^chapter-(\d+)$/.exec(id),g=chapterId&&groups.find(g=>g[2]===Number(chapterId[1]));view=pointIndex.has(id)?'points':g?'chapters':(['chapters','points','formulas','symbols','map'].includes(id)?id:'chapters');domain='全部';chapterName=g?g[0]:'全部';search.value='';query=''}
  setFilters();render();
  if(valid){const ds=[...viewBox.querySelectorAll('details')];(state.details||[]).forEach(([i,open])=>{if(ds[i]){if(open&&ds[i].matches('[data-deep]'))loadDeep(ds[i]);ds[i].open=open}})}
  requestAnimationFrame(()=>{if(run!==restorationRun)return;if(valid)window.scrollTo({top:state.scrollY||0,behavior:'instant'});else {const card=document.getElementById(id);if(card)card.scrollIntoView({behavior:'instant',block:'start'});else window.scrollTo({top:0,behavior:'instant'})}requestAnimationFrame(()=>{if(run!==restorationRun)return;restoring=false;saveReading()})});
}
function goPoint(i,origin){if(origin)saveReading('#'+origin.id);else saveReading();history.pushState(null,'','#'+encodeURIComponent(points[i][0]));restorePoint()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{saveReading();++restorationRun;restoring=false;view=b.dataset.view;history.pushState(null,'','#'+view);readingHash=location.hash;render();window.scrollTo({top:0,behavior:'instant'});saveReading()}));
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{domain=b.dataset.domain;if(chapterName!=='全部'&&domain!=='全部'&&!groups.some(g=>g[0]===chapterName&&g[1]===domain))chapterName='全部';setFilters();render();saveReading()}));
chapter.addEventListener('change',()=>{chapterName=chapter.value;if(chapterName!=='全部'){const g=groups.find(g=>g[0]===chapterName);if(domain!=='全部'&&g[1]!==domain)domain='全部'}setFilters();render();saveReading()});
search.addEventListener('input',()=>{query=clean(search.value);if(query&&['map','chapters'].includes(view))view='points';render();saveReading()});
window.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>saveReading(),100)},{passive:true});
window.addEventListener('pagehide',()=>saveReading());
document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!document.activeElement.matches('input,textarea,select,[contenteditable="true"]')){e.preventDefault();search.focus()}});
document.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details[data-deep]')&&d.open){loadDeep(d)}if(d.matches&&d.matches('details'))saveReading()},true);
// 点击命中位置直接定位到相应正文，不让例题命中停留在卡片顶部。
document.addEventListener('click',e=>{const hit=e.target.closest('[data-hit-point]');if(hit){const card=document.getElementById(points[Number(hit.dataset.hitPoint)][0]),label=hit.dataset.hitLabel;const heading=label==='易错点'?'容易出错':label;const target=(label==='核心正文'?[...card.querySelectorAll('.learning')].find(x=>clean(strip(x.innerHTML)).includes(query)):null)||[...card.querySelectorAll('h3,h2')].find(x=>x.textContent.includes(heading))||card.querySelector('.learning')||card;target.style.scrollMarginTop='140px';target.scrollIntoView({behavior:'instant',block:'start'});saveReading();return}const go=e.target.closest('[data-go]');if(go){const i=Number(go.dataset.go);const origin=go.closest('.card');goPoint(i,origin);return}const ch=e.target.closest('[data-chapter-go]');if(ch){const g=groups[Number(ch.dataset.chapterGo)];saveReading();history.pushState(null,'','#chapter-'+g[2]);restorePoint()}});
// 清空操作同时解除章节和领域限制，避免看不见的旧筛选让搜索一直为空。
function resetFilters(){domain='全部';chapterName='全部';query='';search.value='';setFilters();render();saveReading()}
document.getElementById('reset-filters').addEventListener('click',resetFilters);
document.getElementById('clear-search').addEventListener('click',()=>{search.value='';search.dispatchEvent(new Event('input'));search.focus()});
document.querySelectorAll('[data-query]').forEach(b=>b.addEventListener('click',()=>{resetFilters();search.value=b.dataset.query;search.dispatchEvent(new Event('input'));search.focus()}));
document.addEventListener('click',e=>{if(e.target.closest('[data-all-chapters]')){saveReading();history.pushState(null,'','#chapters');restorePoint()}if(e.target.closest('[data-chapter-detail]')){view='points';render();saveReading()}if(e.target.closest('[data-print-chapter]'))window.print()});
restorePoint();window.addEventListener('hashchange',restorePoint);window.addEventListener('popstate',restorePoint);
})();
</script></body></html>
