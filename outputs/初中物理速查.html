<script type="application/json" id="kb-data">{"g":[["引言 · 第一章 声现象","声学",1,[0,1,2]],["光现象","光学",2,[3,4,5,6]],["光的折射 透镜","光学",3,[7,8,9,10,11]],["物态变化","热学",4,[12,13,14,15,16]],["物体的运动","力学",5,[17,18,19,20]],["物质的物理属性","力学",6,[21,22,23]],["力","力学",7,[24,25,26,27]],["力与运动","力学",8,[28,29,30]],["压强和浮力","力学",9,[31,32,33,34,35]],["从粒子到宇宙","物质",10,[36,37,38,39,40]],["简单机械和功","力学",11,[41,42,43,44,45]],["机械能和内能","能量",12,[46,47,48,49]],["简单电路","电学",13,[50,51,52,53]],["欧姆定律","电学",14,[54,55,56,57]],["电功和电热","电学",15,[58,59,60,61]],["电和磁","电学",16,[62,63,64,65]],["电磁波与现代通信","电磁波",17,[66,67,68]],["能源与可持续发展","能源",18,[69,70,71,72,73]],["测量工具与数据处理","测量工具与数据处理",19,[74,75,76,77,78,79,80]],["实验专题：必做项目与教材补充","实验专题",20,[81,82,83,84,85,86,87,88,89,90,91,92,93,94,95,96,97,98,99,100,101,102]],["初中常见模型与题型","常见模型",21,[103,104,105,106,107,108,109,110,111,112]]],"p":[["sound-01","声音的产生、传播与声速","声音由物体的振动产生，传播需要介质，在不同介质中的传播快慢不同。",[["由直达传播路程和时间测声速","<mrow><mi>c<\/mi><mo>=<\/mo><mfrac><mi>s<\/mi><mi>t<\/mi><\/mfrac><\/mrow>","传播路程和时间采用同一段直达传播过程，结果单位为 m/s。"],["米每秒与千米每小时的换算","<mrow><mi>v<\/mi><mo>=<\/mo><mrow><mn>3.6<\/mn>&#x2062;<mi>c<\/mi><\/mrow><\/mrow>","c 用 m/s 表示、v 用 km/h 表示时，1 m/s = 3.6 km/h。"]],[["s","声音在介质中传播的路程","m"],["t","声音传播这段路程所用的时间","s"],["c","声速，以米每秒表示","m/s"],["v","同一声速换算成千米每小时后的数值","km/h"],["d","声源到反射面的单程距离，用于另一种测声速方法","m"],["t<sub>e<\/sub>","声音发出到接收到回声的往返时间","s"],["f","声源振动频率，即每秒完成的振动次数","Hz"],["T","声源完成一次完整振动所用的周期","s"],["N","在计时区间内完成的完整振动次数","1"]],[["把 m/s 换成 km/h 时把 3.6 除上去，写成 v = c/3.6。","从米每秒换到千米每小时要同时把米换成千米、秒换成小时，数值应乘 3.6。把 340 m/s 除以 3.6 得到约 94.4 km/h，与正确的 1224 km/h 不符；这是量纲相同但方向错误的单位换算，必须靠数值检查发现。"],["把声速写成路程乘时间，c = s·t。","声速定义为单位时间内传播的路程，应使用路程除以时间。相乘后单位变成 m·s，不是 m/s，量纲检查能抓住。"],["认为声音能在真空中传播，只是传播得比较慢。","声波传播依靠介质中的振动传递；真空没有这种介质。需要用真空罩实验现象和机械波概念辨析，不能由声速计算式判定。"]],"观察声源时，可以用纸屑、薄膜或触摸等方式发现振动；传播时，声音通过固体、液体或气体中的介质传到接收者，真空中不能传播声音。声速把传播路程和时间联系起来；空气温度改变时声速也会变化，因此实验比较要注明条件。控制噪声可在声源处减弱振动，在传播途中隔声或吸声，也可在接收者处使用耳塞等防护。噪声控制不能简单理解成降低声速。",["先选定声源与接收位置，明确测量的是声音实际走过的直达路程 s。","记录声音走完这段路程所用的时间 t；路程和时间的单位要先统一。","用 c = s/t 求出 m/s；若需要 km/h，再把 m/s 的数值乘以 3.6。","声音是否由振动产生、传播是否需要介质，仍需依靠观察和实验现象判断。"],["在空气中测得一段直达声传播 34 m 用时 0.10 s。求声速，并换算成 km/h。",["由声速定义，c = s/t = 34/0.10 = 340 m/s。","换算为 km/h：v = 3.6c = 3.6×340 = 1224 km/h。","检查单位：第一问是 m/s，第二问是 km/h；两者描述同一速度。"],"声速为 340 m/s，即 1224 km/h。"],[],["sound-02","sound-03"],["声音的产生","介质","声速","单位换算","噪声控制"],0,"<section class=\"field learning\"><h4>引言：观察、证据与科学探究<\/h4><p>物理研究物质、运动和相互作用。看到纸屑跳动先记录现象，再提出“纸屑跳动是否由振动引起”的问题。依次提出问题、作出猜想、设计实验、收集证据、分析解释、交流与评价；控制变量用于分清因果，重复实验用于检查偶然性。观察不是结论，模型不是实物。物理学支撑航天、能源、信息和医疗等技术；评价技术既看功能，也看证据、资源和影响。<\/p><\/section><section class=\"field learning\"><h4>物理学与科技强国<\/h4><p>航天器的运动控制需要力与运动规律，卫星信号依赖电磁波，深海探测要研究压强、材料和测量方法。把工程问题分解为可测的物理量，再用实验和模型检验方案，是物理知识走向技术的途径。以“远处传回的信息是否等于此刻状态”为问题，查阅并比较传播距离、速度与延迟；事实、模型和个人设想分别记录，不用口号代替证据。<\/p><\/section><section class=\"field learning\"><h4>声音是什么<\/h4><p>正在发声的音叉接触轻小球，小球被弹开，把微小振动转成可观察现象；制止振动，发声也停止。真空罩中随空气抽出声音减弱，不能凭一次演示声称实现绝对真空。固体、液体、气体可传声，真空不能传声；约340 m/s是常温空气的近似值，不能用于水中声呐。<\/p><\/section><section class=\"field learning\"><h4>噪声及其控制<\/h4><p>物理上常把无规则振动产生的声音称为噪声；环境意义上，干扰休息、学习或工作的声音也可能是噪声，音乐也会成为干扰。减弱声源、阻断传播、保护接收者分别对应降低音箱音量、隔声窗、耳塞。分贝表示声级，声级与日常感觉的响度不能简单等同；不把两个分贝数直接相加。<\/p><\/section><section class=\"field learning\"><h4>跨学科实践（原创任务）<\/h4><p>设计教室噪声观察记录：选相同测点和时段，记录声源、传播途径与措施；若使用手机声级应用，只比较同设备相对读数，不冒充校准分贝测量。交付平面草图、控制条件和改进前后观察，联系健康与空间设计。<\/p><\/section><section class=\"field learning\"><h4>本章素养回顾（原创任务）<\/h4><p>选择本章一个现象，写出结论、成立条件和证据；用另一条本章规律复核解释是否矛盾。指出一次测量或模型的局限，并说明还需什么证据；数值通过不替代概念辨析。<\/p><\/section><p class=\"learning\"><b>数量级示例：<\/b>340 m/s，参考区间 300～380 m/s。普通环境温度附近空气声速数量级，不用于水或极端温度。<\/p>","基础","初中"],["sound-02","回声与声呐测距","声音遇到障碍物反射后返回，若能分辨出返回的声音，就形成回声。",[["由回声往返时间求反射面距离","<mrow><mi>d<\/mi><mo>=<\/mo><mfrac><mrow><mi>c<\/mi>&#x22C5;<msub><mi>t<\/mi><mi>e<\/mi><\/msub><\/mrow><mn>2<\/mn><\/mfrac><\/mrow>","公式中的时间是发声到收到回声的往返时间；c 为声音在传播介质中的声速。"],["由已知反射面距离反测声速","<mrow><mi>c<\/mi><mo>=<\/mo><mfrac><mrow><mn>2<\/mn>&#x2062;<mi>d<\/mi><\/mrow><msub><mi>t<\/mi><mi>e<\/mi><\/msub><\/mfrac><\/mrow>","反射面单程距离 d 已知，时间必须采用发声到收声的往返时间。"],["回声的往返总路程","<mrow><mi>l<\/mi><mo>=<\/mo><mrow><mi>c<\/mi>&#x22C5;<msub><mi>t<\/mi><mi>e<\/mi><\/msub><\/mrow><\/mrow>","计算声音从发出到返回接收点所走过的总路程。"]],[["d","声源到反射面的单程距离","m"],["l","声音发出后往返传播的总路程","m"],["c","声音在介质中的传播速度","m/s"],["t<sub>e<\/sub>","从发声到接收到回声的往返时间","s"],["s","直达测声速实验中声音传播的路程","m"],["t","直达测声速实验中声音传播的时间","s"],["f","声源振动频率，即每秒完成的振动次数","Hz"],["T","声源完成一次完整振动所用的周期","s"],["N","在计时区间内完成的完整振动次数","1"]],[["把声源到反射面的距离直接写成 d = c·tₑ，忘记计时记录的是往返时间。","往返时间对应的是去程和回程的总路程。把总路程当单程距离会多算一倍；在 68 m 的墙距情境中，错误写法得到 136 m。"],["把往返时间除以 2 后，又把总路程多除一次，写成 d = c·tₑ/4。","公式中的一半已经把往返总路程转成单程距离，不能再重复减半。代入 0.4 s 会得到 34 m，而正确墙距为 68 m。"],["认为听见回声只说明障碍物存在，不需要考虑声速和传播时间。","回声可以用于距离测量，但距离要从介质中的传播速度和往返时间计算。实际声呐还受介质、反射面和回波识别影响，概念判断需人工结合情境审查。"]],"回声测距常用于估计声源到墙面、山体或水下目标的距离。关键不是公式本身，而是先画出传播路径：声音走了一个来回，仪器记录的也是一个来回的时间。若把往返路程直接当成单程距离，答案就会扩大一倍。水下声呐同样依据发射与接收间隔估计目标距离，但实际测量还要考虑水中声速和回波识别条件。",["先明确计时起点是发声时刻，计时终点是接收到回声的时刻。","声音从声源到反射面再返回，传播总路程是单程距离的两倍。","总路程由声速乘往返时间得到，再除以 2 得到声源到反射面的距离。","如果题目给的是单程传播时间，就不再额外除以 2；读清楚计时方式是关键。"],["声呐在水中发出一束声音，0.20 s 后收到目标反射回来的回声。若水中声速取 1500 m/s，求目标距离。",["0.20 s 是声音发出到返回的往返时间，不是单程时间。","目标距离 d = c·tₑ/2 = 1500×0.20÷2 = 150 m。"],"目标距声呐约 150 m。"],["sound-01"],["sound-03"],["回声","声呐","往返时间","单位换算"],0,"<section class=\"field learning\"><h4>人耳听不到的声音<\/h4><p>超声频率高于约20000 Hz，次声低于约20 Hz，人耳听觉范围因人而异。超声可用于声呐、探伤、清洗和医学检查；次声可与地震、火山及大型设备振动有关。超声、次声仍是需要介质的声波；超声频率高并不表示在同一介质中传播得更快。<\/p><\/section>","基础","初中"],["sound-03","音调、响度、音色与听觉范围","音调反映声音的高低，和声源振动频率有关；频率表示单位时间内完成的振动次数，周期表示完成一次振动所用的时间。",[["由振动次数求频率","<mrow><mi>f<\/mi><mo>=<\/mo><mfrac><mi>N<\/mi><mi>t<\/mi><\/mfrac><\/mrow>","N 统计完整振动次数；t 与频率单位相配，f 的单位为 Hz。"],["由振动周期求频率","<mrow><mi>f<\/mi><mo>=<\/mo><mfrac><mn>1<\/mn><mi>T<\/mi><\/mfrac><\/mrow>","T 表示一次完整振动的时间，必须用秒表示，f 的单位为 Hz。"]],[["f","声源振动频率，即每秒完成的振动次数","Hz"],["T","声源完成一次完整振动所用的周期","s"],["N","在计时区间内完成的完整振动次数","1"],["t","统计完整振动次数所用的时间","s"],["d","声源到反射面的单程距离","m"],["l","声音发出后往返传播的总路程","m"],["c","声音在介质中的传播速度","m/s"],["t<sub>e<\/sub>","从发声到接收到回声的往返时间","s"],["s","直达测声速实验中声音传播的路程","m"]],[["统计多次振动时，只用总时间的倒数当频率，写成f=1/t，漏掉振动次数这个因子。","周期倒数只适用于 t 是一次完整振动周期的情形。若 2 s 内发生 400 次完整振动，频率应为 200 Hz；把 1/2 当答案会少算 400 倍。两种写法量纲相同，必须用计数情境做数值检查。"],["把一次完整振动的两个半程都各算作一次完整振动，误写成 f = 2N/t。","一次完整振动包含往复过程，但计数时整体只算一次。重复乘 2 会使频率翻倍；代入 400 次、2 s 会得到 400 Hz，而不是 200 Hz。"],["把音调高低与响度大小当作同一件事。","音调对应声音高低，响度对应声音强弱，描述的听觉特征不同。频率可以帮助比较音调，但不能仅凭频率判断响度；需要人工结合振动幅度和听觉实验核对。"],["认为音色只由一个频率决定，频率相同的声音听起来一定完全相同。","音色还与发声体的振动方式和波形等特征有关，不可简化成单一频率。此类辨析需要结合不同乐器或声源的听辨实验，标记为人工审核。"]],"比较两个声音时，音调高低可通过频率或周期来描述：单位时间内振动次数越多，频率越高，音调通常越高。响度主要与振动幅度及传播条件有关，音色帮助区分发声体，不能仅用一个频率值概括。人耳通常能听到约 20 Hz 到 20 000 Hz 的声音；低于这一范围的叫次声，高于这一范围的叫超声。噪声和音色等定性判断要结合听觉和实验现象，不由频率公式单独裁决。",["在一段已知计时 t 内，数出完成的完整振动次数 N，频率就是 N 除以 t。","若测得一次完整振动所用的时间 T，则一秒内能完成约 1/T 次振动，所以 f = 1/T。","频率与周期互为倒数：频率增大时周期减小，频率减小时周期增大。","音调与频率相关；响度、音色的判断还需要考虑振幅、发声体和传播条件。"],["某声源在 2 s 内完成 1000 次完整振动。求它的频率和周期，并判断其频率是否在通常的可听范围内。",["由振动次数求频率：f = N/t = 1000/2 = 500 Hz。","周期 T = 1/f = 1/500 = 0.002 s。","500 Hz 位于约 20 Hz 至 20 000 Hz 的通常可听范围内。"],"频率为 500 Hz，周期为 0.002 s，位于通常可听范围内。"],["sound-01"],[],["音调","响度","音色","频率","周期","次声","超声"],0,"<section class=\"field learning\"><h4>声音的特性<\/h4><p>音调指高低，取决于频率；响度指强弱，与振幅、距离和传播条件有关；音色用于辨认声源，与振动波形等有关。钢尺伸出桌边长度改变，振动快慢和音调变化；同一长度用不同力度拨动，主要比较振幅与响度。比较时保留其他条件，不能把声音“高”混同于“大”。<\/p><\/section>","基础","初中"],["light-04","光的色彩","白光由多种色光组成；不同色光在真空中的波速相同，但频率和波长不同。",[["由真空光速和波长求频率","<mrow><mi>f<\/mi><mo>=<\/mo><mfrac><mi>c<\/mi><mi>λ<\/mi><\/mfrac><\/mrow>","拓展计算，非本卡初中必背主线。用于真空或可近似看作真空的光传播；光速 c、波长 λ 使用 m/s、m。此关系用于色光的定量拓展，不是判断颜色的唯一依据。"]],[["f","光波频率","Hz"],["λ","光波波长","m"],["c","真空中的光速","m/s"],["s","真空中光传播路程","m"],["t","传播时间","s"]],[["把750 nm错误换为750 μm再求频率。","750 nm应7.5×10⁻⁷ m；误换为750 μm使波长大千倍、频率小千倍。"],["把频率误算为波速乘波长，混淆相除关系。","频率应为波速除以波长；相乘得到的单位为m²/s，不是Hz。红光示例乘积为225，正确频率为4×10¹⁴ Hz。"],["认为白光本身只有一种颜色，或把色光混合与颜料混合规律混为一谈。","棱镜色散可观察到白光分解出的多种色光；色光的叠加与颜料混合不是同一过程。"]],"教材重点是观察色散、认识不同色光及其混合现象；颜色不能用亮度替代。为把观察与可测量量联系起来，这里补充真空电磁波的波速关系：固定光速时，波长越长，频率越低。该换算属于拓展工具，不代替色散实验，也不意味着所有介质中的光速都相同。",["波在一个周期内传播一个波长，因此波速等于波长乘以每秒振动次数。","频率关系 c=λ·f 两边同除以波长，得到 f=c/λ。","代入前统一单位：波长用 m、频率用 Hz，乘积的单位为 m/s。"],["某单色光波长约为 6.0×10⁻⁷ m，取真空光速 3.0×10⁸ m/s，估算其频率。",["辨认所求量是频率，使用 f=c/λ。","代入 f=3.0×10⁸÷6.0×10⁻⁷=5.0×10¹⁴ Hz。"],"频率约为 5.0×10¹⁴ Hz。"],[],["light-01"],["光的色彩","白光","色散","频率","波长","拓展"],1,"<section class=\"field learning\"><h4>光的色彩<\/h4><p>光源自身发光，月亮反射太阳光而非光源。白光经棱镜色散，说明它由多种色光组成；色光三原色为红、绿、蓝，适当叠加可成白光，颜料混合不是同一规律。透明物体颜色取决于主要透过的色光，不透明物体颜色取决于主要反射的色光；红物体在只有蓝光照射时可能很暗，不能只按物体名称断言颜色。<\/p><\/section><section class=\"field learning\"><h4>本章素养回顾（原创任务）<\/h4><p>选择本章一个现象，写出结论、成立条件和证据；用另一条本章规律复核解释是否矛盾。指出一次测量或模型的局限，并说明还需什么证据；数值通过不替代概念辨析。<\/p><\/section>","拓展","初中主线；公式含拓展"],["light-01","光的直线传播","光在同种均匀介质中沿直线传播；从一种介质进入另一种介质时，传播方向可能改变。",[["由光速和时间求传播路程","<mrow><mi>s<\/mi><mo>=<\/mo><mrow><mi>c<\/mi>&#x22C5;<mi>t<\/mi><\/mrow><\/mrow>","光在同一均匀介质中近似匀速传播，t 使用秒。"],["由传播路程和时间求光速","<mrow><mi>c<\/mi><mo>=<\/mo><mfrac><mi>s<\/mi><mi>t<\/mi><\/mfrac><\/mrow>","s 与 t 必须描述同一段光传播过程。"]],[["s","光传播的路程","m"],["c","光传播速度，空气中近似取真空光速","m/s"],["t","光传播所用时间","s"]],[["把单程传播误写成往返路程，平白多乘 2。","题目若只描述光从发出到到达一次，路程就是 c·t；额外乘 2 会把单程误算成往返。"],["认为光在任何介质交界处都不会改变传播方向。","光斜射入另一种介质时可能发生折射；直线传播规律只适用于同种均匀介质。"]],"影子的形成、小孔成像和日食月食都能用光沿直线传播解释。计算传播距离时，要区分单程和往返路程，并让速度、时间和距离采用相容单位。光速关系只能计算传播过程，不能单独决定反射或折射方向。",["光沿直线传播时，路程可由轨迹长度确定；在同种均匀介质中传播速度近似不变。","速度定义为单位时间通过的路程，因此路程等于速度乘时间，速度也可由路程除以时间求出。","统一使用 m/s、s 和 m；若描述的是反射测距往返过程，还要把总路程与单程路程区分。"],["空气中一束光传播 2 微秒，按光速约 3.0×10⁸ m/s 估算路程。",["先换算时间：2 微秒 = 0.000002 s。","使用 s=ct，得到 3.0×10⁸×0.000002=600 m。"],"约 600 m。"],[],["light-02","light-03"],["直线传播","光速","影子","小孔成像"],1,"<section class=\"field learning\"><h4>光的直线传播<\/h4><p>成立条件是同种、均匀的介质。小孔成像是倒立的实像，形状由物体决定，孔的形状主要影响亮度与清晰度；影子是光被遮挡形成的暗区，不是镜像。日食时月球位于太阳与地球之间；月食时地球位于太阳与月球之间。解释先画光路，不把所有成像归为反射。<\/p><\/section>","基础","初中"],["light-02","平面镜","平面镜所成的像与物体关于镜面对称，是正立、等大的虚像。",[["平面镜像距关系","<mrow><msub><mi>d<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><msub><mi>d<\/mi><mn>1<\/mn><\/msub><\/mrow>","物距和像距均指垂直于镜面的距离。"],["平面镜像高关系","<mrow><msub><mi>h<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><msub><mi>h<\/mi><mn>1<\/mn><\/msub><\/mrow>","物体和像的高度采用相同长度单位。"]],[["d<sub>1<\/sub>","物体到平面镜的距离","m"],["d<sub>2<\/sub>","像到平面镜的距离","m"],["h<sub>1<\/sub>","物体高度","m"],["h<sub>2<\/sub>","像的高度","m"]],[["误认为像距只有物距的一半。","平面镜成像关于镜面对称，像距等于物距；物距 0.5 m 时像距应是 0.5 m。"],["认为平面镜所成的像可以用光屏接收到。","平面镜像是反射光线反向延长线的交点，属于虚像；应通过成像实验和光线图辨析。"]],"像距要从像点向镜面作垂线测量，物距也按同一方向测量；不能把沿着物体表面的斜距离当成像距。平面镜像是反射光线反向延长线的交点，不能用光屏承接。用等距、等高两项关系检查作图和读数，能快速发现对称位置画错。",["作出法线后，反射定律要求反射角与入射角相等，两角都以法线为基准。","平面镜成像关于镜面对称，因此物点与像点到镜面的垂直距离相等。","对称变换不改变线段长度，所以像的高度与物体高度相同。"],["物体距平面镜 0.8 m、高 0.3 m。求像距和像高，并判断像的性质。",["像与物关于镜面对称，所以像距等于物距，为 0.8 m。","平面镜像正立、等大、虚，所以像高为 0.3 m，不能用光屏承接。"],"像距 0.8 m，像高 0.3 m，成正立、等大的虚像。"],["light-01"],["light-03"],["平面镜","虚像","像距","像高"],1,"<section class=\"field learning\"><h4>平面镜成像特点<\/h4><p>像与物等大、正立，像物到镜面等距，连线垂直镜面，像为虚像。物体靠近镜子时像也靠近镜面，像的大小不随距离改变；人眼感觉的视角改变不等于像变大。虚像不能用光屏直接接收，眼睛仍可看见，因为反射光实际进入了眼睛。<\/p><\/section><details class=\"learning\"><summary>实验：探究平面镜成像特点<\/summary><p><b>目的：<\/b>定位虚像、比较大小和像物关系。<\/p><p><b>装置与接法：<\/b>薄透明玻璃板、两支相同LED物屏或蜡烛、白纸、刻度尺、光屏。<\/p><p><b>控制、改变与观察：<\/b>一物固定，移动另一等大物定位像；改变物距重复。<\/p><p><b>步骤：<\/b><\/p><ol><li>玻璃板竖直置纸上，沿玻璃位置画线。<\/li><li>透过玻璃看前物的像，移动后物直到看起来完全重合。<\/li><li>记录物与像位置、量垂直距离，移开后物在像处放光屏检查。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：物到镜面10 cm，定位像也10 cm；移动物到15 cm，像距15 cm，大小仍等大。<\/p><p><b>结论与条件：<\/b>等距等大、连线垂直镜面；光屏不能接收像，属于虚像。<\/p><p><b>误差与边界：<\/b>厚玻璃产生双像、玻璃未竖直导致难重合、两物不等大影响比较；尽量用安全物屏替代明火。<\/p><\/details>","基础","初中"],["light-03","光的反射","光射到物体表面后返回原介质的现象叫反射。",[["反射定律的角度关系","<mrow><mi>r<\/mi><mo>=<\/mo><mi>i<\/mi><\/mrow>","入射角和反射角均从法线量起；角度使用度数，且反射发生在同一介质侧。"],["反射线与镜面的夹角","<mrow><mi>α<\/mi><mo>=<\/mo><mrow><mn>90<\/mn><mo>−<\/mo><mi>r<\/mi><\/mrow><\/mrow>","α 是反射线与镜面的夹角，r 是反射角；法线与镜面互相垂直。"]],[["i","入射角，按度数记录","1"],["r","反射角，按度数记录","1"],["α","反射光线与镜面的夹角，按度数记录","1"]],[["把反射角从镜面而不是法线量起，用余角代替反射角。","入射角30°时从法线量的反射角也是30°，从镜面量到的60°是它的余角，不是反射角。"],["认为只有光滑表面才发生反射。","漫反射和镜面反射都遵守反射定律，差别在于表面是否平整以及反射光的方向分布。"]],"作图时先找法线，再分别量入射角与反射角，角度不从镜面量起。反射定律可用角度读数检查：入射角变化多少，反射角就变化多少；反射线和镜面之间的夹角则与反射角互为余角。漫反射与镜面反射都遵循反射定律，只是表面情况不同。",["过入射点作垂直于反射面的法线，明确角度的共同基准。","反射定律给出反射角 r 与入射角 i 相等。","法线和镜面夹角为 90°，所以反射线与镜面的夹角 α=90°-r。"],["一束光以 35° 入射到平面镜，求反射角以及反射光线与镜面的夹角。",["反射角从法线量起，依据反射定律 r=i=35°。","法线和镜面互相垂直，所以反射光线与镜面的夹角为 90°-35°=55°。"],"反射角 35°；反射光线与镜面的夹角 55°。"],["light-01"],[],["光的反射","反射定律","法线","入射角","反射角"],1,"<section class=\"field learning\"><h4>光的反射<\/h4><p>先在入射点作垂直镜面的法线；入射线和反射线分居法线两侧，入射角等于反射角，两线与法线在同一平面。让光逆原反射路径入射，会沿原入射路径返回，体现光路可逆。漫反射中每一小处仍遵守反射定律；粗糙表面能向不同方向反光，便于多方位看见物体。<\/p><\/section><details class=\"learning\"><summary>实验：探究光的反射定律<\/summary><p><b>目的：<\/b>比较角度、同面条件及可逆性。<\/p><p><b>装置与接法：<\/b>平面镜、可折白纸板、安全光源、量角器。<\/p><p><b>控制、改变与观察：<\/b>改变入射角，记录反射角；折纸板观察反射线是否仍在该面。<\/p><p><b>步骤：<\/b><\/p><ol><li>纸板垂直镜面，作法线，光沿纸板入射。<\/li><li>从法线量入射与反射角，取多组。<\/li><li>折动承载反射线一侧纸板，再逆反射路径入射。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：20°、30°、50°入射，对应20°、30°、50°反射。<\/p><p><b>结论与条件：<\/b>两角相等、分居法线两侧且共面，光路可逆。<\/p><p><b>误差与边界：<\/b>镜面与纸板不垂直、量角起点用镜面、光束过粗会偏差；不把激光照向眼睛。<\/p><\/details>","基础","初中"],["lens-03","光的折射","光从一种介质斜射入另一种介质时，传播方向通常发生改变，这种现象叫折射；垂直界面入射时方向不变。",[["折射率与介质中光速的关系","<mrow><mi>n<\/mi><mo>=<\/mo><mfrac><mi>c<\/mi><mi>v<\/mi><\/mfrac><\/mrow>","拓展计算，非本卡初中必背主线。本式为光速比值的定量拓展；c 是真空光速，v 是同一介质中的光速，二者单位相同。"]],[["n","介质的折射率，表示光速比值","1"],["c","真空中的光速","m/s"],["v","光在介质中的传播速度","m/s"],["s","真空中光传播路程","m"],["t","真空中光传播时间","s"]],[["把折射率写成介质光速与真空光速之比。","正确比值是真空光速除以介质光速，水中示例为4/3；倒置比值得0.75，不再偷偷乘2。"],["把反射角等于入射角当作折射规律。","反射和折射是不同现象；折射方向需结合两侧介质和法线判断，不能套用反射定律。"]],"观察折射时要先确定界面、法线和入射介质，再判断光线偏向法线还是偏离法线；不能照搬反射角等于入射角。作为定量拓展，可用折射率 n=c/v 表示真空光速与介质中光速之比，但这不是初中折射作图规则的替代品。",["折射率定义为真空中的光速与该介质中光速之比。","写出 n=c/v，并确认分子、分母都是速度，所得比值无单位。","介质中光速越小，c/v 越大；该比值不能单独给出任意入射角下的折射角。"],["某介质中光速约为 2.0×10⁸ m/s，取真空光速 3.0×10⁸ m/s，估算其折射率。",["折射率 n=c/v。","代入 3.0×10⁸÷2.0×10⁸=1.5。"],"折射率约为 1.5。"],["light-01"],["lens-02"],["光的折射","介质","法线","折射率","拓展"],2,"<section class=\"field learning\"><h4>光的折射<\/h4><p>空气斜射入水或玻璃，折射线一般向法线偏折、折射角小于入射角；水或玻璃斜射入空气，一般远离法线。垂直入射方向不变，但光速仍可能改变。光路可逆；水中物体看起来变浅是折射形成的虚像，不是水把物体实际抬高。折射率计算是拓展，初中优先会辨认介质、界面和法线。<\/p><\/section><section class=\"field learning\"><h4>本章素养回顾（原创任务）<\/h4><p>选择本章一个现象，写出结论、成立条件和证据；用另一条本章规律复核解释是否矛盾。指出一次测量或模型的局限，并说明还需什么证据；数值通过不替代概念辨析。<\/p><\/section>","拓展","初中主线；公式含拓展"],["lens-02","透镜","透镜分为凸透镜和凹透镜。",[["凸透镜焦距的几何定义","<mrow><mi>f<\/mi><mo>=<\/mo><mi>d<\/mi><\/mrow>","平行于主光轴的光经凸透镜会聚于焦点，f 与 d 使用相同长度单位。"]],[["f","凸透镜焦距","m"],["d","光心到焦点的距离","m"],["u","物距，即物体到凸透镜的距离","m"],["v","像距，即像到凸透镜的距离","m"],["h<sub>1<\/sub>","物体高度","m"],["h<sub>2<\/sub>","像的高度","m"]],[["把焦距错误读成光心到焦点距离的两倍。","测焦距就是量光心到实焦点的距离；10 cm应为0.10 m，多乘2误得0.20 m。"],["认为凹透镜也会把平行光会聚到实焦点。","凹透镜对平行光有发散作用，与凸透镜的会聚作用相反。因此成像规律和透镜种类要对应，不能混淆。"],["把物体到透镜的距离当成焦距。","焦距由透镜和介质条件决定，物距随物体位置变化；须辨认焦点，不能用任意物体的位置替代。"]],"辨认透镜时可观察中间和边缘的厚薄，但判断光线作用应以实际光路为准。测凸透镜焦距可让平行光会聚到焦点，再量光心到焦点的距离。焦距是透镜的基本特征，物距与焦距的比较决定后续成像规律。",["让平行于主光轴的光线通过凸透镜，观察折射后的会聚点。","测量光心到焦点的距离 d，按几何定义得到 f=d。","更换焦距不同的凸透镜重复测量，并用二倍焦距处的成像实验作交叉核对。"],["一凸透镜用平行光测得焦点距光心 12 cm，求焦距，并说明焦距的物理含义。",["焦距按定义等于光心到焦点的距离。","将测得的 12 cm 直接作为 f，并与成像实验测得的焦距比较。"],"焦距为 12 cm，表示光心到焦点的距离。"],["light-01","light-03"],["lens-01"],["透镜","凸透镜","凹透镜","焦点","焦距"],2,"<section class=\"field learning\"><h4>透镜与三条典型光线<\/h4><p>凸透镜中间厚、边缘薄，凹透镜相反；会聚和发散描述相对入射光的偏折作用。薄透镜近似下，经光心的光线方向不变；平行主光轴的光经凸透镜通过另一侧焦点；通过入射侧焦点的光折射后平行主光轴。凹透镜使平行光发散，反向延长线交于入射侧虚焦点。焦距与物距是不同量。<\/p><\/section>","基础","初中"],["lens-01","凸透镜成像的规律","凸透镜成像随物距与焦距的关系变化：焦点外成倒立实像，按物距与二倍焦距关系分别缩小、等大或放大；焦点内成正立放大虚像；物体在焦点处，理想模型没有有限距离的清晰像。",[["物距为二倍焦距时像距等于物距","<mrow><mi>v<\/mi><mo>=<\/mo><mi>u<\/mi><\/mrow>","凸透镜成像实验中物距 u=2f，此时为倒立、等大的实像，v=2f。"],["物距为二倍焦距时像高等于物高","<mrow><msub><mi>h<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><msub><mi>h<\/mi><mn>1<\/mn><\/msub><\/mrow>","凸透镜物距 u=2f 时，像为倒立、等大的实像。"],["薄透镜像距拓展核对","<mrow><msub><mi>v<\/mi><mi mathvariant=\"normal\">代<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><mi>f<\/mi>&#x22C5;<mi>u<\/mi><\/mrow><mrow><mi>u<\/mi><mo>−<\/mo><mi>f<\/mi><\/mrow><\/mfrac><\/mrow>","薄透镜近轴模型，u为正且u不等于f；实像正、物侧虚像负。只供拓展验算，不要求初中背诵；u=f用光线平行定性处理。"]],[["u","物距，即物体到凸透镜的距离","m"],["v","像距，即像到凸透镜的距离","m"],["h<sub>1<\/sub>","物体高度","m"],["h<sub>2<\/sub>","像的高度","m"],["f","凸透镜焦距，拓展公式使用","m"],["v<sub>代<\/sub>","带符号像距，实像正、物侧虚像负","m"]],[["把物距为二倍焦距时的像距误写成物距的一半。","当 u=2f 时，v 也为 2f，因此 v=u；物距为 0.20 m 时像距不是 0.10 m。"],["认为凸透镜无论物距如何都成倒立实像。","物体位于焦点以内时，凸透镜成正立、放大的虚像；像的性质必须结合物距和焦距判断。"]],"探究成像规律时，先测焦距，再比较物距与 f、2f；移动物体时像的虚实、正倒、大小和像距都会改变。物距等于 2f 是容易核对的特殊位置：像距也等于 2f，像与物等大且倒立。不能把这一特殊结果推广到所有物距。",["通过改变物距并在光屏上寻找清晰像，记录物距、像距和像的大小。","比较物距与焦距的倍数，归纳不同区间对应的实像或虚像性质。","在 u=2f 的特殊位置，实验得到 v=2f、像与物等大；该结论只在这一条件下使用。"],["一凸透镜焦距为 10 cm，将物体放在距透镜 20 cm 处。描述像的位置关系和性质。",["物距 u=20 cm=2f。","物距为二倍焦距时，像距也为二倍焦距，即 v=20 cm。","像为倒立、等大的实像，可以用光屏承接。"],"像距 20 cm，成倒立、等大的实像。"],["lens-02"],["lens-04"],["凸透镜成像","物距","像距","实像","虚像","二倍焦距"],2,"<section class=\"field learning\"><h4>凸透镜成像：五种区间与临界条件<\/h4><p>物距大于二倍焦距：像距在一倍与二倍焦距之间，倒立、缩小、实像。物距等于二倍焦距：像距等于二倍焦距，倒立、等大、实像。物距在一倍与二倍焦距之间：像距大于二倍焦距，倒立、放大、实像。物距等于焦距：理想模型下折射光平行，没有有限距离的清晰像，不能在光屏上找到有限位置的清晰像。物距小于焦距：与物体同侧，正立、放大、虚像。实像在透镜另一侧，可用光屏接收，且需调到像所在位置；虚像不能用光屏直接承接，须从透镜另一侧观察。<\/p><\/section><section class=\"field learning\"><h4>成像变化与学习范围<\/h4><p>在实像区，物体靠近焦点而仍位于焦点外时，像远离透镜并变大；物体远离透镜，像靠近焦点并变小。遮住透镜一部分，剩余透镜仍可形成完整像，亮度减小。实验发现这些规律是初中主线；下列薄透镜算值只供拓展核对，采用带符号像距，不要求背诵。临界物距不能硬代除零公式。<\/p><\/section><details class=\"learning\"><summary>实验：探究凸透镜成像规律<\/summary><p><b>目的：<\/b>覆盖焦点内外各区间，比较虚实、正倒、大小和像距。<\/p><p><b>装置与接法：<\/b>光具座、已测焦距凸透镜、LED物屏、光屏和刻度尺。<\/p><p><b>控制、改变与观察：<\/b>同一透镜，改变物距并移动光屏找清晰像，记录性质和像距。<\/p><p><b>步骤：<\/b><\/p><ol><li>测焦距，调物屏中心、光心和光屏中心大致同高。<\/li><li>依次取大于2倍、等于2倍、1倍与2倍之间，记录可接收实像。<\/li><li>取等于焦距观察无有限清晰屏像，再取焦距内透过透镜观察虚像。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：焦距10 cm：物距30、20、15 cm，示例像距15、20、30 cm；物距5 cm虚像在物侧，屏不能接收。<\/p><p><b>结论与条件：<\/b>各区间性质见基础表，虚像须用眼睛观察；物距恰为焦距不编造有限像距。<\/p><p><b>误差与边界：<\/b>未同高、物距从透镜边缘起量、没有找清晰像会影响读数；光屏不到位不能反推该像必为虚像。<\/p><\/details>","基础","初中主线；公式含拓展"],["lens-04","透镜的应用","照相机、投影仪和放大镜利用透镜形成不同性质的像。",[["实像放大率与物像距离比","<mrow><mi>M<\/mi><mo>=<\/mo><mfrac><mi>v<\/mi><mi>u<\/mi><\/mfrac><\/mrow>","用于凸透镜成倒立实像的几何近似情形；M、u、v 为正值，长度单位须相同。"],["实像高度比定义放大率","<mrow><mi>M<\/mi><mo>=<\/mo><mfrac><msub><mi>h<\/mi><mn>2<\/mn><\/msub><msub><mi>h<\/mi><mn>1<\/mn><\/msub><\/mfrac><\/mrow>","像高和物高取正的长度大小，适用于凸透镜实像的几何近似关系。"]],[["M","凸透镜实像的放大率，取高度比的大小","1"],["u","物距，即物体到透镜的距离","m"],["v","像距，即实像到透镜的距离","m"],["h<sub>1<\/sub>","物体高度","m"],["h<sub>2<\/sub>","像的高度，取高度大小","m"]],[["把放大率写成物距除以像距。","相机示例物距0.30 m、像距0.15 m，实像放大率应为0.5；倒置得到2，真实错误表达式就是u/v。"],["认为放大率大于 1 的实像一定正立。","放大率只描述大小比例；凸透镜实像仍是倒立像，正倒要独立判断。"]],"实际应用先按物距和焦距判断成像类型，再结合光屏、镜头或观察者的位置理解成像。放大率公式是几何光学的拓展量化工具：像距相对物距越大，实像的放大率越大；倒立方向另行判断，公式中的高度比取大小。不要把放大率直接等同于“镜头焦距”或亮度。",["用几何光线图中物高与像高构成的相似三角形，可得高度比等于像距与物距之比。","取像高、物高的大小，得到 M=h<sub>2<\/sub>/h<sub>1<\/sub>；实像倒立这一方向信息另行说明。","代入前统一长度单位；同一情境下由高度比和距离比算出的 M 应一致。"],["某相机镜头成像时物距为 0.30 m、像距为 0.15 m，物体高 4 cm，估算实像大小。",["放大率 M=v/u=0.15/0.30=0.5。","像高大小 h<sub>2<\/sub>=Mh1=0.5×4 cm=2 cm。","相机在此情形形成倒立实像，放大率只给大小比。"],"像高大小约 2 cm，成倒立实像。"],["lens-01","lens-02"],["lens-05"],["透镜的应用","照相机","投影仪","放大镜","放大率","拓展"],2,"<section class=\"field learning\"><h4>照相机、投影仪和放大镜<\/h4><p>照相机通常物距大于二倍焦距，胶片或传感器接收倒立缩小实像。投影仪通常把物体置于一倍与二倍焦距之间，屏幕在另一侧接收倒立放大实像；需结合光路安装被投影物。放大镜物距小于焦距，从另一侧透过透镜看同侧正立放大虚像。把屏幕移远不一定变清晰，须同时调整物距、像距。<\/p><\/section><section class=\"field learning\"><h4>眼睛与视力矫正<\/h4><p>眼球晶状体等相当于会聚透镜，视网膜相当于承接实像的屏。近视眼看远处时像落在视网膜前，通常用凹透镜使入射光先发散；远视眼看近处时像趋于落在视网膜后，通常用凸透镜先会聚。这里是光学原理模型，不能据此自行确定眼镜度数；散光等情况也不等同于这两个简单模型。<\/p><\/section><section class=\"field learning\"><h4>跨学科实践（原创任务）<\/h4><p>用透镜和纸板设计低压照明的小投影模型：标出物、透镜、屏位置，检查倒立实像和焦距条件，再改变物距记录像的大小和清晰度。结合图形比例和手工设计解释调整过程；不使用强光直照眼睛。<\/p><\/section>","拓展","初中"],["lens-05","人眼看不见的光","红外线和紫外线都属于人眼不能直接看见的电磁辐射。",[["真空中电磁波的波速关系","<mrow><mi>c<\/mi><mo>=<\/mo><mrow><mi>λ<\/mi>&#x22C5;<mi>f<\/mi><\/mrow><\/mrow>","拓展计算，非本卡初中必背主线。用于真空中的电磁波；波长用 m、频率用 Hz，所得波速单位为 m/s。"]],[["c","真空中的电磁波速率","m/s"],["λ","电磁波波长","m"],["f","电磁波频率","Hz"],["s","真空中传播路程","m"],["t","传播时间","s"]],[["把已经用Hz表示的频率再当kHz除千。","波长与以Hz表示的频率乘积为3×10⁸ m/s；重复除千会误算3×10⁵ m/s。"],["漏掉波速关系中的频率因子，只把波长当作波速。","波速的单位应为 m/s，而波长单位是 m；还需乘以频率。频率决定单位时间内完整波的个数。"],["认为红外线和紫外线是可见光中两种能被肉眼辨认的颜色。","两者在可见光谱范围之外，需借助热效应、荧光等实验现象或仪器探测。"]],"辨认红外线和紫外线要依据实验现象与用途，不能把“看不见”理解为不存在，也不能把两者混为可见色光。这里以电磁波关系作定量拓展：真空中波速近似相同，波长较长时频率较低。实际应用关注的探测、加热或消毒效果还取决于功率、距离、材料和照射时间，不能仅由波段关系断言。",["电磁波在真空中传播时，波速等于波长乘频率。","将红外或紫外波段的代表性波长与频率代入，检查乘积是否接近真空光速。","该关系描述传播量之间的联系，不单独决定某种辐射对材料或人体的作用效果。"],["某真空红外电磁波的波长约为 1.0×10⁻⁵ m，估算其频率，取波速 3.0×10⁸ m/s。",["由 c=λ·f 得 f=c/λ。","代入 3.0×10⁸÷1.0×10⁻⁵=3.0×10¹³ Hz。"],"频率约为 3.0×10¹³ Hz。"],["light-04"],[],["红外线","紫外线","电磁辐射","波速","波长","频率","拓展"],2,"<section class=\"field learning\"><h4>人眼看不见的光<\/h4><p>红外线在红光外侧，可通过热效应探测，常用于遥控和热成像；紫外线在紫光外侧，可引起荧光，适当条件下用于消毒。看不见不等于没有能量；紫外光源不得直视，也不能照射皮肤做课堂比较。用途依赖强度和条件，不把波长大小当作消毒能力的直接公式。<\/p><\/section>","拓展","初中主线；公式含拓展"],["state-01","物质的三态 温度的测量","物质常见的三种状态是固态、液态和气态；温度表示物体的冷热程度。",[["温度变化量","<mrow><mi mathvariant=\"normal\">dT<\/mi><mo>=<\/mo><mrow><msub><mi>T<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>T<\/mi><mn>1<\/mn><\/msub><\/mrow><\/mrow>","T<sub>1<\/sub> 为初温，T<sub>2<\/sub> 为末温；升温为正变化，降温为负变化。"],["由初温和温差求末温","<mrow><msub><mi>T<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><mrow><msub><mi>T<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><mi mathvariant=\"normal\">dT<\/mi><\/mrow><\/mrow>","dT 带有升温或降温的正负方向。"]],[["T<sub>1<\/sub>","变化前温度","℃"],["T<sub>2<\/sub>","变化后温度","℃"],["dT","带正负号的温度变化量","℃"],["Tm","标准大气压下纯水的熔点","℃"],["Tm<sub>参考<\/sub>","纯水熔点参考值","℃"],["Tb","标准大气压下纯水的沸点","℃"],["Tb<sub>参考<\/sub>","纯水沸点参考值","℃"]],[["求温度变化量时把初温和末温相加。","温度变化量是末温减初温；室温 20℃ 升到 80℃，温差为 60℃，不是 100℃。"],["把降温的温度变化量一律写成正数，丢掉变化方向。","按末温减初温的约定，80℃降到20℃的变化量是 -60℃；若只报告温差大小，应另说“降低了60℃”。"]],"观察物态变化时要先读准温度计：液泡与被测物充分接触，视线与液柱顶端相平。温度变化量按末温减初温计算，升温为正、降温为负；温度本身和温差不是同一个量。用摄氏温标记录时写 ℃，不要把符号写成字母 C。",["把变化前温度记为初温 T<sub>1<\/sub>，变化后温度记为末温 T<sub>2<\/sub>。","用末温减初温定义带方向的温度变化量，升温为正、降温为负。","将温度变化量移项，可由初温和变化量求得末温。"],["水从 20℃ 加热到 80℃，再冷却到 50℃。分别求两段温度变化量。",["加热段：80-20=60℃。","冷却段：50-80=-30℃，负号表示温度下降。"],"加热变化量为 60℃，冷却变化量为 -30℃。"],[],["state-02","state-03"],["物质三态","温度","温度计","温差"],3,"<section class=\"field learning\"><h4>三态与温度测量<\/h4><p>固体通常有较稳定形状和体积，液体有较稳定体积但随容器改变形状，气体容易充满容器。摄氏温度在标准大气压下以冰水混合物约0℃、沸水约100℃作常用参照；温度计利用可测性质随温度变化。使用前看量程和分度值，液泡浸没而不触底壁，待示数稳定后读数；普通实验温度计不能任意离开液体读数。<\/p><\/section><section class=\"field learning\"><h4>本章素养回顾（原创任务）<\/h4><p>选择本章一个现象，写出结论、成立条件和证据；用另一条本章规律复核解释是否矛盾。指出一次测量或模型的局限，并说明还需什么证据；数值通过不替代概念辨析。<\/p><\/section><details class=\"learning\"><summary>实验：用常见温度计测量温度<\/summary><p><b>目的：<\/b>正确读取冷热程度并记录单位。<\/p><p><b>装置与接法：<\/b>烧杯、常温水、合适量程液体温度计。<\/p><p><b>控制、改变与观察：<\/b>保持测量部位和接触条件，观察稳定示数。<\/p><p><b>步骤：<\/b><\/p><ol><li>检查量程、分度值和完好情况。<\/li><li>液泡浸入水中，不碰杯底杯壁，等待稳定。<\/li><li>视线与液柱顶端齐平，在液泡仍接触水时读数，重复记录。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：分度值1℃，示数约23℃；20℃到23℃是升高3℃，不是43℃。<\/p><p><b>结论与条件：<\/b>测量值对应当前样品状态，单位为℃。<\/p><p><b>误差与边界：<\/b>视差、接触不足、未稳定、温度计自身滞后均影响结果；不测超量程样品。<\/p><\/details>","基础","初中"],["state-02","汽化和液化","液态变成气态叫汽化，气态变成液态叫液化。",[["标准大气压下纯水沸点","<mrow><mi mathvariant=\"normal\">Tb<\/mi><mo>=<\/mo><msub><mi>Tb<\/mi><mi mathvariant=\"normal\">参考<\/mi><\/msub><\/mrow>","纯水在标准大气压下沸腾；沸点为 100℃。"],["纯水沸点与熔点的温差","<mrow><mi mathvariant=\"normal\">dT<\/mi><mo>=<\/mo><mrow><mi mathvariant=\"normal\">Tb<\/mi><mo>−<\/mo><mi mathvariant=\"normal\">Tm<\/mi><\/mrow><\/mrow>","两温度均取标准大气压下纯水的相变温度。"]],[["Tb","标准大气压下纯水的沸点","℃"],["Tb<sub>参考<\/sub>","纯水沸点参考值","℃"],["Tm","标准大气压下纯水的熔点","℃"],["Tm<sub>参考<\/sub>","标准大气压下纯水的熔点参考值","℃"],["dT","纯水沸点与熔点的温度差","℃"]],[["把纯水的沸点误记成熔点，或把两者互换。","标准大气压下纯水熔点为 0℃、沸点为 100℃，两者相差 100℃；代入沸点情境可查出混淆。"],["认为蒸发只能在沸点发生，或液化只靠压缩一种方法。","蒸发可在任何温度下发生；液化可通过降低温度或压缩体积实现，具体方法取决于物质和条件。"]],"液化是气体放热变成液体，常见方法是降低温度或压缩体积；蒸发快慢受液体温度、表面积和液面上方空气流动影响。沸点受外界气压影响，因此标准大气压下纯水沸点约 100℃，不能把它当作任何条件下都固定的温度。温差公式只用于比较两种相变温度，不意味着水在沸腾时仍持续升温。",["从水的温度—时间实验图像辨认熔化或沸腾期间的温度平台。","读取纯水在标准大气压下的熔点 0℃ 和沸点 100℃，同时注明条件。","两相变温度相减可得到它们之间的温度差，温差单位仍为 ℃。"],["标准大气压下，纯水从冰水共存的 0℃ 加热到沸腾的 100℃，两相变温度相差多少？",["先确认题目给的是标准大气压下的纯水。","温差为 100℃-0℃=100℃。"],"相差 100℃。"],["state-01"],["state-03"],["汽化","蒸发","沸腾","液化","沸点"],3,"<section class=\"field learning\"><h4>汽化、液化和吸放热<\/h4><p>汽化吸热，液化放热。蒸发在液体表面发生、各种温度下都可发生，并有致冷作用；沸腾在一定压强下达到沸点且持续吸热时，于内部和表面剧烈发生，温度近似不变。蒸发快慢受温度、表面积、液面上方气流影响。白气是小液滴，并非看得见的水蒸气；杯外水珠通常是空气中水蒸气液化，不是水穿过杯壁。<\/p><\/section><details class=\"learning\"><summary>实验：探究水在沸腾前后温度变化<\/summary><p><b>目的：<\/b>比较沸腾前升温和沸腾时温度特点。<\/p><p><b>装置与接法：<\/b>教师指导下用热源、烧杯、水、温度计、计时器和支架。<\/p><p><b>控制、改变与观察：<\/b>保持气压、加热方式和水样，每隔相同时间读温度，观察气泡。<\/p><p><b>步骤：<\/b><\/p><ol><li>布置液泡不触底壁，记录初温和计时起点。<\/li><li>持续加热，每隔1 min记录温度及气泡变化。<\/li><li>沸腾后再记录数次；停止加热比较是否还能持续沸腾。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：0、1、2、3、4 min读80、90、98、98、98℃；平台约98℃而非强定100℃。<\/p><p><b>结论与条件：<\/b>在相同气压下达到沸点且持续吸热时，沸腾温度近似不变；水内和表面同时汽化。<\/p><p><b>误差与边界：<\/b>气压改变、仪器偏差、液泡位置和加热不均会影响平台；热源、玻璃和蒸汽可能烫伤，只按教师规范操作。<\/p><\/details><figure class=\"learning\"><svg viewBox=\"0 0 450 235\" role=\"img\" aria-label=\"水沸腾前后温度—时间示例\" style=\"width:100%;max-width:560px\"><title>水沸腾前后温度—时间示例<\/title><path d=\"M55 35V185H390\" fill=\"none\" stroke=\"currentColor\"/><polyline points=\"55.00,83.18 136.25,70.45 217.50,60.27 298.75,60.27 380.00,60.27\" fill=\"none\" stroke=\"#2457d6\" stroke-width=\"2\"/><text x=\"55.0\" y=\"202\">0<\/text><text x=\"136.25\" y=\"202\">1<\/text><text x=\"217.5\" y=\"202\">2<\/text><text x=\"298.75\" y=\"202\">3<\/text><text x=\"380.0\" y=\"202\">4<\/text><text x=\"8\" y=\"189.0\">0<\/text><text x=\"8\" y=\"125.36363636363637\">50<\/text><text x=\"8\" y=\"61.727272727272734\">100<\/text><text x=\"298.75\" y=\"52.27272727272728\">98<\/text><text x=\"280\" y=\"226\">时间 / min<\/text><text x=\"60\" y=\"25\">温度 / ℃<\/text><\/svg><figcaption>按设计数据直接读图：2到4 min平台98℃，本条件下沸点约98℃；平台期间持续加热，不能推出不吸热。图像不是任意气压下固定100℃的证明。<\/figcaption><\/figure>","基础","初中"],["state-03","熔化和凝固","固态变液态叫熔化，液态变固态叫凝固，分别吸热和放热。",[["熔点与材料参考值相符","<mrow><mi mathvariant=\"normal\">Tm<\/mi><mo>=<\/mo><msub><mi>Tm<\/mi><mi mathvariant=\"normal\">参考<\/mi><\/msub><\/mrow>","同一种纯晶体，相同压强、接近热平衡的理想相变条件；非晶体和明显过冷过程不直接适用。"],["同一纯物质熔点与凝固点关系","<mrow><mi mathvariant=\"normal\">Tf<\/mi><mo>=<\/mo><mi mathvariant=\"normal\">Tm<\/mi><\/mrow>","同一种纯晶体，相同压强、接近热平衡的理想相变条件；非晶体和明显过冷过程不直接适用。"]],[["Tm","本情境纯晶体的熔点","℃"],["Tm<sub>参考<\/sub>","相同压强下该晶体熔点参考值","℃"],["Tf","相同压强、理想平衡相变条件下纯晶体凝固点","℃"]],[["把纯晶体的凝固点误写成熔点的两倍摄氏读数。","相同压强且理想平衡相变条件下，纯萘熔点和凝固点均约80.2℃，不能把摄氏读数乘2变成160.4℃。"],["把非晶体也描述成熔化时有固定温度平台。","晶体有固定熔点，非晶体没有固定熔点；应结合温度—时间实验曲线区分。"]],"观察晶体熔化曲线时，温度平台对应固液共存阶段；凝固时也会在相同条件下出现相同的相变温度。要先确认材料是不是晶体，并保持压强等条件可比。纯水在标准大气压下的熔点约为 0℃，不可把所有物质的熔点都当成 0℃。",["从水的温度—时间实验图像辨认熔化或沸腾期间的温度平台。","读取纯水在标准大气压下的熔点 0℃ 和沸点 100℃，同时注明条件。","两相变温度相减可得到它们之间的温度差，温差单位仍为 ℃。"],["某纯物质在相同压强下测得熔化温度为 80.2℃，它凝固时的相变温度约是多少？",["确认材料为同一纯物质，且熔化与凝固条件相同。","在相同条件下，凝固点等于熔点。"],"凝固温度约为 80.2℃。"],["state-01"],["state-04"],["熔化","凝固","晶体","熔点","凝固点"],3,"<section class=\"field learning\"><h4>熔化、凝固与晶体图像<\/h4><p>熔化吸热，凝固放热。同一种纯晶体在相同压强、接近热平衡的理想相变条件下，熔点与凝固点相同；有过冷、杂质或压强变化时须另行分析。晶体熔化过程中固液共存，持续吸热而温度近似不变；非晶体没有固定熔点，受热逐渐软化。温度不变不能推出不吸热；图像平台要结合材料和过程判断。<\/p><\/section><details class=\"learning\"><summary>实验：观察晶体熔化与非晶体软化<\/summary><p><b>目的：<\/b>比较温度平台与状态变化。<\/p><p><b>装置与接法：<\/b>教师选合适样品、试管、温水浴、温度计和计时器。<\/p><p><b>控制、改变与观察：<\/b>分别记录温度、加热时间和状态，保持稳定压强、加热条件。<\/p><p><b>步骤：<\/b><\/p><ol><li>每隔相同时间读温度并观察固液状态。<\/li><li>标注开始熔化、全部熔化两时刻，画温度—时间图。<\/li><li>比较晶体平台和非晶体逐渐软化的曲线，区别观察与推理。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：纯冰近似平衡示例：0、1、2、3、4 min分别-10、0、0、0、10℃。<\/p><p><b>结论与条件：<\/b>晶体熔化阶段持续吸热且温度近似不变，非晶体没有固定熔点；不由平台推出停止吸热。<\/p><p><b>误差与边界：<\/b>杂质、压强变化与热不均可改变结果；此项为目录基本活动，未混称课标22项学生必做。<\/p><\/details>","基础","初中"],["state-04","升华和凝华","固态直接变成气态叫升华，气态直接变成固态叫凝华。",[["密闭装置内相变前后质量守恒","<mrow><msub><mi>m<\/mi><mi mathvariant=\"normal\">后<\/mi><\/msub><mo>=<\/mo><msub><mi>m<\/mi><mi mathvariant=\"normal\">前<\/mi><\/msub><\/mrow>","装置密闭且没有物质进出时，升华或凝华前后总质量不变。"],["相变后固体与气体质量合计","<mrow><msub><mi>m<\/mi><mi mathvariant=\"normal\">总<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>m<\/mi><mi mathvariant=\"normal\">固<\/mi><\/msub><mo>+<\/mo><msub><mi>m<\/mi><mi mathvariant=\"normal\">气<\/mi><\/msub><\/mrow><\/mrow>","固体与气体均留在密闭装置内并纳入质量统计。"]],[["m<sub>前<\/sub>","相变前装置内物质总质量","kg"],["m<sub>后<\/sub>","相变后装置内物质总质量","kg"],["m<sub>固<\/sub>","相变后剩余固体质量","kg"],["m<sub>气<\/sub>","装置内形成的气体质量","kg"],["m<sub>总<\/sub>","密闭装置内物质总质量","kg"]],[["只称量剩余固体，却把它当作升华后密闭系统的全部质量。","初始总质量2 kg，剩余固体1.2 kg、气体0.8 kg，总量仍2 kg；只记录固体误得1.2 kg，会把转入气态的0.8 kg漏掉。"],["把凝华说成液态直接变成固态。","液态变固态是凝固；凝华是气态直接变成固态。这是物质状态和系统边界必须分清的地方。"],["认为升华使物质凭空消失，系统总质量也消失。","升华改变物态，气体仍是物质；开放环境要计入逸出物质，封闭模型则把各相总质量相加。不能拿只称固体的结果替代总质量。"]],"干冰逐渐变小、樟脑丸变小是升华的例子；霜的形成属于凝华。若把物质放在密闭且不漏气的装置中，固体减少的质量会对应气体增加的质量；开放环境则不能把逸散的气体当作消失。质量关系是封闭系统内的记录核对，不是升华快慢的计算式。",["先确认研究系统是否密闭；有物质进出时不能直接使用封闭系统的质量守恒。","相变只改变物质状态，不改变被完整统计的物质总量。","密闭时可分别称量前后总质量，并把末态固体与气体质量相加进行复核。"],["质量账目模型（不是密封干冰实验操作）：原有2 kg物质，升华后剩余1.2 kg固体，全部气体均纳入统计且无物质逸出，求气体质量。",["密闭条件下总质量保持 2 kg。","气体质量=总质量-剩余固体质量=2-1.2=0.8 kg。"],"气体质量为 0.8 kg。"],["state-03"],["state-05"],["升华","凝华","干冰","霜","质量守恒"],3,"<section class=\"field learning\"><h4>六种物态变化总表<\/h4><p>固→液为熔化、液→气为汽化、固→气为升华，三者吸热；液→固为凝固、气→液为液化、气→固为凝华，三者放热。霜是凝华，露是液化，雪或冰熔成水是熔化。干冰升华伴随吸热，周围空气中的水蒸气可能液化成雾，白雾不是二氧化碳本身。密闭质量账目是思考模型，禁止密封加热干冰装置。<\/p><\/section>","基础","初中"],["state-05","水循环","水在地表、地下和大气之间不断循环，包括蒸发、凝结、降水、径流和渗透等过程。",[["降水深度换算水体积","<mrow><mi>V<\/mi><mo>=<\/mo><mrow><mi>A<\/mi>&#x22C5;<mi>h<\/mi><\/mrow><\/mrow>","把降水视为均匀覆盖所选区域，h 使用 m，A 使用 m²。"],["由降水体积和面积求平均深度","<mrow><mi>h<\/mi><mo>=<\/mo><mfrac><mi>V<\/mi><mi>A<\/mi><\/mfrac><\/mrow>","降水均匀铺展且面积非零，体积用 m³、面积用 m²。"]],[["V","所选区域上的降水体积","m³"],["A","所选区域面积","m²"],["h","该区域的平均降水深度","m"],["h<sub>m<\/sub>m","同一降水深度用毫米记录的读数","mm"]],[["把毫米雨量读数直接当作米代入，造成千倍偏差。","100 m²区域降水10 mm应换成0.010 m，体积1 m³；把读数10直接当米得1000 m³。"],["认为估算降水体积就是最后实际收集到的水量。","水会发生径流、下渗和蒸发；几何估算只描述均匀降水覆盖区域的理论体积。"]],"水循环把海洋、陆地、大气和生物联系起来；观察到的云、雨、河流和地下水都是循环环节。估算降水体积时要把毫米换成米，并明确所选区域和平均雨量。该几何换算只估算落到区域的水量，不等于实际可收集量，蒸发、径流和渗漏都可能造成差异。",["选定区域并估算其面积 A，同时测量或查得区域平均降水深度 h。","把深度统一换算为 m，体积由底面积乘垂直深度得到 V=A·h。","实际收集水量会受径流、渗漏和蒸发影响，应与几何估算量区分。"],["一片 200 m² 的地面平均降水 15 mm，估算落在该地面上的水体积。",["先换算深度：15 mm=0.015 m。","V=A·h=200×0.015=3 m³。","这只是降水几何估算量，不等于可收集水量。"],"约 3 m³。"],["state-02"],[],["水循环","降水","降水深度","水量估算","拓展"],3,"<section class=\"field learning\"><h4>水循环<\/h4><p>太阳辐射驱动地表水蒸发，水蒸气上升冷却后形成液滴或冰晶，降水再经地表径流、下渗和地下径流返回水体。云由小液滴或冰晶组成；露和霜的物态变化不同。雨量是降水深度，单位mm，落在区域的理论水量不等于可利用水量。节水既包括减少浪费，也包括保护水源。<\/p><\/section><section class=\"field learning\"><h4>跨学科实践（原创任务）<\/h4><p>设计雨量记录方案：测容器开口面积，记录收集体积和时段，用体积除面积换成毫米雨量；讨论风、蒸发和溅入的偏差。将观测表与天气现象比较，不把小容器单次读数当整座城市降雨量。<\/p><\/section>","拓展","初中"],["motion-03","长度与时间的测量","长度用刻度尺测量，时间可用秒表或计时器测量。",[["米换算为厘米","<mrow><msub><mi>L<\/mi><mi mathvariant=\"normal\">cm<\/mi><\/msub><mo>=<\/mo><mrow><mn>100<\/mn>&#x2062;<msub><mi>L<\/mi><mi>m<\/mi><\/msub><\/mrow><\/mrow>","同一长度的单位换算，1 m=100 cm。"],["米换算为千米","<mrow><msub><mi>L<\/mi><mi mathvariant=\"normal\">km<\/mi><\/msub><mo>=<\/mo><mfrac><msub><mi>L<\/mi><mi>m<\/mi><\/msub><mn>1000<\/mn><\/mfrac><\/mrow>","同一长度的单位换算，1 km=1000 m。"]],[["L<sub>m<\/sub>","以米记录的长度","m"],["L<sub>cm<\/sub>","同一长度以厘米记录","cm"],["L<sub>km<\/sub>","同一长度以千米记录","km"]],[["把 1 m 误当作 10 cm，导致长度单位换算少一个数量级。","1 m=100 cm；课桌长度 1.2 m 应为 120 cm，而不是 12 cm。"],["读刻度尺时视线倾斜，造成视差并把估读值当作准确值。","视线应垂直刻度面；测量误差需结合分度值和重复测量分析。应记录仪器分度值并按规范重复测量。"]],"测量前先看量程、分度值和零刻线，放置刻度尺时让刻度线与被测边平行；读数时视线垂直刻度面。时间测量要明确起止事件并尽量重复测量减小偶然误差。米、厘米和千米之间的换算有固定比例，错误换算会造成数量级偏差。",["测量对象的长度与计时过程要先定义清楚，并选用合适量程的工具。","记录读数时保留单位；将厘米换成米除以 100，将米换成千米除以 1000。","用两种单位换算后再反算，检查数量级与原始测量是否一致。"],["一张桌子的长度测得 1.2 m，分别换算成厘米和千米。",["厘米：1.2×100=120 cm。","千米：1.2÷1000=0.0012 km。"],"120 cm；0.0012 km。"],[],["motion-01"],["长度测量","时间测量","刻度尺","秒表","单位换算"],4,"<section class=\"field learning\"><h4>长度与时间：读数、误差和估测<\/h4><p>刻度尺贴近被测长度并平行摆放，视线垂直刻度面；零端磨损时用两刻度差。连续刻度尺一般估读到分度值下一位，数字秒表按显示精度记录；多次测量取平均可减小部分偶然误差，不能消除系统偏差。1 km=1000 m，1 m=100 cm=1000 mm；1 h=3600 s。普通课桌高度常约0.6～0.9 m、成年人步行约0.8～1.8 m/s，仅作合理估计区间，不能替代实际测量。<\/p><\/section><section class=\"field learning\"><h4>本章素养回顾（原创任务）<\/h4><p>选择本章一个现象，写出结论、成立条件和证据；用另一条本章规律复核解释是否矛盾。指出一次测量或模型的局限，并说明还需什么证据；数值通过不替代概念辨析。<\/p><\/section><details class=\"learning\"><summary>实验：用刻度尺测量长度<\/summary><p><b>目的：<\/b>正确定位、估读并处理零端磨损。<\/p><p><b>装置与接法：<\/b>毫米刻度尺、薄板等被测物。<\/p><p><b>控制、改变与观察：<\/b>保持同一物体，改变重复测量次数，不改变尺的量程。<\/p><p><b>步骤：<\/b><\/p><ol><li>检查量程分度值，选可用刻线对齐起点。<\/li><li>刻度面贴近物体，视线垂直尺面读起点和终点。<\/li><li>相减得长度，重复测量按有效精度记录平均值。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：起点1.00 cm，终点4.26 cm，长度3.26 cm=0.0326 m。<\/p><p><b>结论与条件：<\/b>长度为两刻度差而非终点单个数。<\/p><p><b>误差与边界：<\/b>视差、尺未平行和零端磨损可形成系统偏差；平均不能消除这些错误。<\/p><\/details><details class=\"learning\"><summary>实验：用表测量时间<\/summary><p><b>目的：<\/b>建立起止事件一致的时间间隔。<\/p><p><b>装置与接法：<\/b>数字秒表或机械秒表、可重复事件。<\/p><p><b>控制、改变与观察：<\/b>相同事件，用同一起止约定，观察仪表示数。<\/p><p><b>步骤：<\/b><\/p><ol><li>辨显示分辨率，约定开始和结束事件。<\/li><li>先练习启停，再重复计时。<\/li><li>记录秒数，比较差异，说明人工反应时间。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：3次为2.10、2.08、2.12 s，平均2.10 s；1 min 5 s为65 s。<\/p><p><b>结论与条件：<\/b>时间间隔依赖起止事件，单位换算不能把分钟当秒。<\/p><p><b>误差与边界：<\/b>人为启停反应对短过程占比大，重复可减少部分偶然影响，不可假称完全消除。<\/p><\/details><p class=\"learning\"><b>数量级示例：<\/b>0.75 m，参考区间 0.6～0.9 m。普通课桌高度的示例估计区间，实际桌型和年级可能不同。<\/p>","基础","初中"],["motion-01","速度","速度表示物体运动的快慢，数值等于在计时区间内通过的路程与所用时间之比。",[["由路程和时间求速度","<mrow><mi>v<\/mi><mo>=<\/mo><mfrac><mi>s<\/mi><mi>t<\/mi><\/mfrac><\/mrow>","路程和时间来自同一运动区间，s 用 m、t 用 s。"],["米每秒换算为千米每小时","<mrow><msub><mi>v<\/mi><mi>k<\/mi><\/msub><mo>=<\/mo><mrow><mn>3.6<\/mn>&#x2062;<mi>v<\/mi><\/mrow><\/mrow>","原速度用 m/s 表示，换算后的速度用 km/h 表示。"]],[["s","物体在计时区间内通过的路程","m"],["t","通过路程 s 所用时间","s"],["v","以米每秒表示的速度","m/s"],["v<sub>k<\/sub>","同一速度以千米每小时表示","km/h"]],[["换算 m/s 与 km/h 时忘记乘 3.6，或把乘除方向写反。","1 m/s=3.6 km/h；5 m/s 应为 18 km/h，而不是约 1.4 km/h。"],["把速度写成路程乘时间。","速度是单位时间内通过的路程，需用路程除以时间；相乘的单位也不再是 m/s。"]],"比较快慢时可控制路程或时间中的一个量不变，也可统一用路程除以时间计算。速度是比值，平均速度描述一段过程而非每一瞬间；单位换算时 1 m/s=3.6 km/h。计算前确认距离和时间用相容单位。",["用刻度尺测出运动路程 s，用秒表测出相应时间 t。","依据速度定义计算 v=s/t；m 除以 s 得到 m/s。","如需换成 km/h，把 m/s 数值乘 3.6，并在比较前统一速度单位。"],["小明沿同一直线同方向在20 s内走过100 m，求这段平均速度大小并换算成km/h。",["v=s/t=100/20=5 m/s。","换算为 km/h：5×3.6=18 km/h。"],"平均速度为 5 m/s，即 18 km/h。"],[],["motion-02"],["速度","路程","时间","单位换算"],4,"<section class=\"field learning\"><h4>速度与平均速度<\/h4><p>初中速度侧重路程与时间之比。测某一段平均速度先标记该段起终点，用本段路程除以本段时间；全程平均速度要用总路程除以总时间，包含题目规定的停留时间。1 m/s=3.6 km/h；72 km/h=20 m/s。估测不能把生活中的速度当人人相同的固定常数。<\/p><\/section><details class=\"learning\"><summary>实验：测量物体运动的速度<\/summary><p><b>目的：<\/b>测斜面小车某段平均速度。<\/p><p><b>装置与接法：<\/b>缓斜面、小车、刻度尺、计时器、终点挡板。<\/p><p><b>控制、改变与观察：<\/b>明确同一段起终位置，同一释放条件，观察通过该段时间。<\/p><p><b>步骤：<\/b><\/p><ol><li>量起点到终点的实际路程，标记两点。<\/li><li>静止释放同时计时，到达终点停止计时。<\/li><li>重复测量，分别用各段路程除各段时间，不将全程时间用于半段。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：0.80 m用时2.0 s，平均0.40 m/s；下半段0.40 m用时0.8 s，平均0.50 m/s。<\/p><p><b>结论与条件：<\/b>加速过程不同区段平均速度可不同，不能当处处匀速。<\/p><p><b>误差与边界：<\/b>斜面过陡会放大启停误差，挡板位置、车长和起点约定影响路程。<\/p><\/details><p class=\"learning\"><b>单位换算证据：<\/b>72 km/h = 20 m/s。72 km/h每秒行20 m；先小时换秒再千米换米。<\/p><p class=\"learning\"><b>数量级示例：<\/b>1.2 m/s，参考区间 0.8～1.8 m/s。成年人普通步行的参考区间，个人步速不是固定标准。<\/p>","基础","初中"],["motion-02","直线运动","物体沿直线运动时，位置随时间变化。",[["分段路程和时间求全程平均速度","<mrow><mover accent=\"true\"><mi>v<\/mi><mo>¯<\/mo><\/mover><mo>=<\/mo><mfrac><mrow><msub><mi>s<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>s<\/mi><mn>2<\/mn><\/msub><\/mrow><mrow><msub><mi>t<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>t<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mfrac><\/mrow>","总路程为各段路程之和，总时间为各段用时之和。"],["分段路程与时间的累计","<mrow><msub><mi>s<\/mi><mi mathvariant=\"normal\">总<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>s<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>s<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mrow>","各段路程不重叠且覆盖整个计时区间。"]],[["s<sub>1<\/sub>","第一段路程","m"],["s<sub>2<\/sub>","第二段路程","m"],["t<sub>1<\/sub>","第一段用时","s"],["t<sub>2<\/sub>","第二段用时","s"],["s<sub>总<\/sub>","全程总路程","m"],["t<sub>总<\/sub>","全程总时间","s"],["<span style=\"text-decoration:overline\">v<\/span>","全程平均速度","m/s"],["v<sub>1<\/sub>","第一段平均速度","m/s"],["v<sub>2<\/sub>","第二段平均速度","m/s"]],[["不看分段时间和路程条件，直接把两段速度做算术平均。","两段各 100 m 时，10 m/s 与 2 m/s 的算术平均为 6 m/s，但全程平均速度是 200/60≈3.33 m/s。"],["计算全程平均速度时漏掉中途一段或漏计题目要求包含的时间。","平均速度必须与题目界定的整段总路程和总时间对应，计时范围要先确认。"]],"分段运动的全程平均速度要用总路程除以总时间，不能把各段速度简单平均，除非时间或路程条件恰好支持。利用运动图像还要先读横纵轴和单位；折线斜率或面积的含义须根据图轴定义判断。",["按每段路程与用时分别计算分段速度。","把没有重复计算的各段路程相加，并把各段用时相加。","用总路程除以总时间，得到全程平均速度。"],["物体沿同一直线同方向先以10 m/s运动10 s，再以2 m/s运动50 s，求全程平均速度大小。",["第一段路程 100 m，第二段路程 100 m。","总路程 200 m，总时间 60 s。","平均速度为 200/60≈3.33 m/s。"],"全程平均速度约为 3.33 m/s。"],["motion-01"],["motion-04"],["直线运动","匀速直线运动","变速直线运动","平均速度","分段运动"],4,"<section class=\"field learning\"><h4>直线运动图像<\/h4><p>路程—时间图中横轴时间、纵轴路程；匀速直线运动的斜率表示速度，不是纵坐标本身。速度—时间图的纵坐标是速度，匀速时为水平线；初中优先读数、比较快慢，面积算路程列为拓展。分段速度直接平均只在两段用时相同时适用；等路程两段往往不满足。<\/p><\/section><figure class=\"learning\"><svg viewBox=\"0 0 450 235\" role=\"img\" aria-label=\"匀速运动路程—时间图\" style=\"width:100%;max-width:560px\"><title>匀速运动路程—时间图<\/title><path d=\"M55 35V185H390\" fill=\"none\" stroke=\"currentColor\"/><polyline points=\"55.00,185.00 136.25,150.00 217.50,115.00 298.75,80.00 380.00,45.00\" fill=\"none\" stroke=\"#2457d6\" stroke-width=\"2\"/><text x=\"55.0\" y=\"202\">0<\/text><text x=\"136.25\" y=\"202\">1<\/text><text x=\"217.5\" y=\"202\">2<\/text><text x=\"298.75\" y=\"202\">3<\/text><text x=\"380.0\" y=\"202\">4<\/text><text x=\"8\" y=\"189.0\">0<\/text><text x=\"8\" y=\"154.0\">2<\/text><text x=\"8\" y=\"119.0\">4<\/text><text x=\"8\" y=\"84.0\">6<\/text><text x=\"8\" y=\"49.0\">8<\/text><text x=\"280\" y=\"226\">时间 / s<\/text><text x=\"60\" y=\"25\">路程 / m<\/text><\/svg><figcaption>直接看图：3 s时路程6 m，1到3 s增加4 m；处理图中两点，斜率4 m÷2 s=2 m/s。纵坐标不是速度。<\/figcaption><\/figure>","基础","初中"],["motion-04","运动的相对性","判断物体运动还是静止，必须选定参照物。",[["同向运动的相对速度","<mrow><msub><mi>v<\/mi><mi mathvariant=\"normal\">相对<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>v<\/mi><mi>A<\/mi><\/msub><mo>−<\/mo><msub><mi>v<\/mi><mi>B<\/mi><\/msub><\/mrow><\/mrow>","两物体沿同一直线同向运动，且 A 的速度大于 B 的速度；取间距改变速度的大小。"],["由间距变化和时间求相对速度","<mrow><msub><mi>v<\/mi><mi mathvariant=\"normal\">相对<\/mi><\/msub><mo>=<\/mo><mfrac><msub><mi>s<\/mi><mi mathvariant=\"normal\">间距<\/mi><\/msub><mi>t<\/mi><\/mfrac><\/mrow>","间距变化量与时间间隔对应同一段直线运动，t 大于零。"],["相向运动的相对速度","<mrow><msub><mi>v<\/mi><mi mathvariant=\"normal\">相对<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>v<\/mi><mi>A<\/mi><\/msub><mo>+<\/mo><msub><mi>v<\/mi><mi>B<\/mi><\/msub><\/mrow><\/mrow>","两物体在同一直线上反向运动或相向而行，取速度大小。"]],[["v<sub>A<\/sub>","物体 A 沿选定方向的速度大小","m/s"],["v<sub>B<\/sub>","物体 B 沿选定方向的速度大小","m/s"],["v<sub>相对<\/sub>","两物体之间的相对速度大小","m/s"],["s<sub>间距<\/sub>","两物体间距在计时段内改变的大小","m"],["t","观察的时间间隔","s"]],[["不分方向，把同向追及误按速度和计算。","同向追及的间隔变化率应为速度差；12 m/s 和 4 m/s 同向时是 8 m/s，不是 16 m/s。"],["认为运动状态不需要说明参照物。","同一物体对车厢可能静止、对地面可能运动；判断前必须指定参照物。"]],"坐在行驶列车中的乘客相对车厢静止，但相对地面运动，这说明运动描述具有相对性。计算相对速度前先画出方向：同向追及取速度差，反向相向运动取速度和；速度大小关系决定相对位置变化方向，不能只看公式符号。",["先选定参照物和正方向，并判断两物体同向还是反向。","同向运动时位置间隔变化率等于速度大小之差；反向运动时等于速度大小之和。","也可测量一段时间内两物体间距的变化，再用间距变化量除以时间复算相对速度。"],["甲车以 12 m/s 向东行驶，乙车以 4 m/s 同向行驶；两车相距 40 m，求间距每秒变化多少。",["两车同向，取速度差：12-4=8 m/s。","较快的甲车在后方追赶时，两车间距每秒减小 8 m；方向要结合相对位置判断。"],"间距变化速率为 8 m/s。"],["motion-01","motion-02"],[],["运动的相对性","参照物","相对速度","追及","相向运动"],4,"<section class=\"field learning\"><h4>运动的相对性<\/h4><p>机械运动是物体相对参照物的位置变化；选定参照物后才能判断动静。参照物可按研究方便选择，不能选研究对象自身来解释它是否运动。站台看列车运动，车内乘客看同座乘客静止；受力分析和运动描述是不同问题。相对速度加减属于同一直线的拓展量化。<\/p><\/section>","基础","初中"],["prop-03","质量及其测量","质量表示物体所含物质的多少，国际单位是千克，实验中常用天平测量。",[["克换算为千克","<mrow><msub><mi>m<\/mi><mi mathvariant=\"normal\">kg<\/mi><\/msub><mo>=<\/mo><mfrac><msub><mi>m<\/mi><mi>g<\/mi><\/msub><mn>1000<\/mn><\/mfrac><\/mrow>","同一质量单位换算，1000 g=1 kg。"],["千克换算为克","<mrow><msub><mi>m<\/mi><mi>g<\/mi><\/msub><mo>=<\/mo><mrow><mn>1000<\/mn>&#x2062;<msub><mi>m<\/mi><mi mathvariant=\"normal\">kg<\/mi><\/msub><\/mrow><\/mrow>","同一质量单位换算，1 kg=1000 g。"]],[["m<sub>g<\/sub>","以克记录的质量","g"],["m<sub>kg<\/sub>","同一质量以千克记录","kg"]],[["克换千克时少除一个 10，产生十倍偏差。","450 g 应为 0.45 kg；若只除以 100，会得到 4.5 kg。"],["认为物体移到月球后质量随重力变小。","质量表示物体所含物质多少，不随位置变化；变化的是物体受到的重力。"]],"使用天平前先放平、调平衡，再把物体和砝码按规范放置，砝码质量与游码示数相加得到物体质量。称量结果常需在 g 与 kg 之间换算；克数与千克数表示同一质量，不代表物体发生变化。测量值应根据仪器分度值合理记录。",["用天平测得物体质量，并记录天平示数和所用质量单位。","按 1 kg=1000 g 换算：克换成千克除以 1000，千克换成克乘以 1000。","换算后再反向换回，核对读数是否与原始称量一致。"],["天平测得一块金属质量为 780 g，换算成千克。",["1000 g=1 kg。","780÷1000=0.780 kg。"],"质量为 0.780 kg。"],[],["prop-01"],["质量","天平","千克","克","质量测量"],5,"<section class=\"field learning\"><h4>质量与天平<\/h4><p>质量不随形状、状态、位置变化而改变，封闭相变后总质量不变。托盘天平水平放置，游码归零后调平衡螺母；左物右码，用镊子加减砝码，称量时不再调平衡螺母，游码读左缘。物体质量为右盘砝码质量加游码读数，且不能超量程；潮湿、有腐蚀性样品使用合适容器。1 t=1000 kg，1 kg=1000 g，1 g=1000 mg。<\/p><\/section><section class=\"field learning\"><h4>本章素养回顾（原创任务）<\/h4><p>选择本章一个现象，写出结论、成立条件和证据；用另一条本章规律复核解释是否矛盾。指出一次测量或模型的局限，并说明还需什么证据；数值通过不替代概念辨析。<\/p><\/section><details class=\"learning\"><summary>实验：用托盘天平测量物体质量<\/summary><p><b>目的：<\/b>测固体或带容器液体的质量。<\/p><p><b>装置与接法：<\/b>托盘天平、砝码、镊子、干燥物体或烧杯。<\/p><p><b>控制、改变与观察：<\/b>测前游码归零、空载调平；称量中只改砝码和游码。<\/p><p><b>步骤：<\/b><\/p><ol><li>天平放平、游码归零、调平衡螺母。<\/li><li>左物右码，用镊子先大后小加减砝码，移动游码使平衡。<\/li><li>读砝码总质量加游码左缘读数，写单位并归整器材。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：50 g砝码加游码2.4 g，质量52.4 g=0.0524 kg。<\/p><p><b>结论与条件：<\/b>质量由砝码与游码合计得到，不受普通位置和形状变化影响。<\/p><p><b>误差与边界：<\/b>物码颠倒时不能照常相加；游码未归零、超量程、手拿砝码或样品滴漏造成误差。<\/p><\/details><p class=\"learning\"><b>单位换算证据：<\/b>52.4 g = 0.0524 kg。克转千克除以1000。<\/p>","基础","初中"],["prop-01","密度","密度是物质单位体积的质量，等于物体质量与体积之比。",[["由质量和体积求密度","<mrow><mi>ρ<\/mi><mo>=<\/mo><mfrac><mi>m<\/mi><mi>V<\/mi><\/mfrac><\/mrow>","质量和体积对应同一物体，且 m 用 kg、V 用 m³。"],["由密度和体积求质量","<mrow><mi>m<\/mi><mo>=<\/mo><mrow><mi>ρ<\/mi>&#x22C5;<mi>V<\/mi><\/mrow><\/mrow>","物体密度均匀，ρ 用 kg/m³、V 用 m³。"],["读取质量—体积图线斜率求密度","<mrow><mi>ρ<\/mi><mo>=<\/mo><mfrac><mrow><msub><mi>m<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>m<\/mi><mn>1<\/mn><\/msub><\/mrow><mrow><msub><mi>V<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>V<\/mi><mn>1<\/mn><\/msub><\/mrow><\/mfrac><\/mrow>","同一种均匀物质的质量—体积图线为正比例关系，读数点体积不同且质量、体积单位统一。"]],[["m","物体质量","kg"],["V","物体体积","m³"],["ρ","物质密度","kg/m³"],["m<sub>1<\/sub>","质量—体积图线上第一个读数点的质量","kg"],["m<sub>2<\/sub>","质量—体积图线上第二个读数点的质量","kg"],["V<sub>1<\/sub>","质量—体积图线上第一个读数点的体积","m³"],["V<sub>2<\/sub>","质量—体积图线上第二个读数点的体积","m³"],["V<sub>1<\/sub>","放入物体前液体体积","mL"],["V<sub>2<\/sub>","物体完全浸入后液体总体积","mL"],["V<sub>o<\/sub>","被测物体体积","mL"]],[["质量已经用 kg 表示时，又多除以 1000，造成密度少算 1000 倍。","情境中的质量已是 kg，无须再次换算成吨；一升水应为 1000 kg/m³，不是 1 kg/m³。"],["把密度写成体积除以质量。","密度定义是单位体积的质量；质量越多而体积不变时，密度应增大。"],["认为同一种物质的物体质量越大，密度一定越大。","在温度和状态相同、物质均匀时，质量和体积同比变化，密度不随样品多少改变。"]],"测密度要分别可靠地测质量和体积，再用质量除以体积；不规则物体可用排水法测体积。读质量—体积图线时，密度对应斜率而不是任意一点的纵坐标。先统一质量和体积单位，常见换算为 1 g/cm³=1000 kg/m³。",["密度定义为质量与体积的比值，先确认两者属于同一物体。","用 m/V 计算密度并检查单位，kg 除以 m³ 得到 kg/m³。","在质量—体积图线上选取两个不同体积的点，用质量差除以体积差求斜率；均匀物质的该斜率就是密度。","将定义式变形，可由密度和体积求质量。"],["一块均匀材料质量为 2 kg，体积为 0.001 m³，求密度。",["ρ=m/V=2/0.001=2000 kg/m³。","单位为 kg/m³，表示每立方米该材料的质量。"],"密度为 2000 kg/m³。"],[],["prop-02"],["密度","质量","体积","质量体积图像"],5,"<section class=\"field learning\"><h4>密度与单位<\/h4><p>同种均匀材料在温度、状态相同条件下质量与体积成正比，比值称密度，不由样品多少决定。1 g/cm³=1000 kg/m³；1 mL=1 cm³，1 L=1000 mL=0.001 m³。水在普通室温下密度约1000 kg/m³，仅为近似；不同温度及物态会改变密度，水结冰质量不变但体积增大。<\/p><\/section><details class=\"learning\"><summary>实验：测量液体密度<\/summary><p><b>目的：<\/b>用倒出液体质量与量筒体积测密度，减少残留误差。<\/p><p><b>装置与接法：<\/b>天平、烧杯、量筒、待测液体。<\/p><p><b>控制、改变与观察：<\/b>同一样品，质量差对应倒入量筒的体积。<\/p><p><b>步骤：<\/b><\/p><ol><li>称烧杯加液体总质量。<\/li><li>倒一部分进量筒，读凹液面最低处体积。<\/li><li>再称烧杯加剩余液体质量，两次质量之差除以量筒体积。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：初次80 g、剩余40 g，量筒50 mL，倒出40 g，密度0.8 g/cm³=800 kg/m³。<\/p><p><b>结论与条件：<\/b>相减后质量与实际倒出液体一一对应。<\/p><p><b>误差与边界：<\/b>若先称空杯再称全部液体，随后倒量筒且忽略杯壁残留，体积偏小而密度偏大；洒出液体也会破坏对应关系。<\/p><\/details><figure class=\"learning\"><svg viewBox=\"0 0 450 235\" role=\"img\" aria-label=\"均匀材料质量—体积图\" style=\"width:100%;max-width:560px\"><title>均匀材料质量—体积图<\/title><path d=\"M55 35V185H390\" fill=\"none\" stroke=\"currentColor\"/><polyline points=\"55.00,185.00 163.33,143.00 271.67,101.00 380.00,59.00\" fill=\"none\" stroke=\"#2457d6\" stroke-width=\"2\"/><text x=\"55.0\" y=\"202\">0<\/text><text x=\"163.33333333333331\" y=\"202\">20<\/text><text x=\"271.66666666666663\" y=\"202\">40<\/text><text x=\"380.0\" y=\"202\">60<\/text><text x=\"8\" y=\"189.0\">0<\/text><text x=\"8\" y=\"147.0\">54<\/text><text x=\"8\" y=\"105.0\">108<\/text><text x=\"8\" y=\"63.0\">162<\/text><text x=\"280\" y=\"226\">体积 / cm³<\/text><text x=\"60\" y=\"25\">质量 / g<\/text><\/svg><figcaption>直接读图：20 cm³对应54 g，40 cm³对应108 g；两点斜率54 g÷20 cm³=2.7 g/cm³。质量增加但密度不随样品大小改变。<\/figcaption><\/figure><p class=\"learning\"><b>单位换算证据：<\/b>250 mL = 0.00025 m³。1 mL=1 cm³=10⁻⁶ m³。<\/p><p class=\"learning\"><b>单位换算证据：<\/b>1 L = 0.001 m³。1 L=1000 cm³=0.001 m³。<\/p><p class=\"learning\"><b>单位换算证据：<\/b>2.7 g/cm³ = 2700 kg/m³。质量倍率10⁻³、体积倍率10⁻⁶，比值倍率1000。<\/p><p class=\"learning\"><b>数量级示例：<\/b>1000 kg/m³，参考区间 950～1050 kg/m³。普通温度液态水密度的宽估计区间，不适用于冰和高压状态。<\/p>","基础","初中"],["prop-02","密度知识的应用与物质的物理属性","密度知识可用于鉴别材料、判断空心与实心、估测质量或体积；物质还具有硬度、弹性、导电性、导热性和磁性等属性。",[["排水法求物体体积","<mrow><msub><mi>V<\/mi><mi>o<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>V<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>V<\/mi><mn>1<\/mn><\/msub><\/mrow><\/mrow>","物体完全浸没、不吸水且液体体积读数单位相同。"],["由排水体积求材料密度","<mrow><mi>ρ<\/mi><mo>=<\/mo><mfrac><mi>m<\/mi><msub><mi>V<\/mi><mi>o<\/mi><\/msub><\/mfrac><\/mrow>","物体质量以 g、测得体积以 mL 计，密度单位为 g/mL。"]],[["V<sub>1<\/sub>","放入物体前液体体积","mL"],["V<sub>2<\/sub>","物体完全浸入后液体总体积","mL"],["V<sub>o<\/sub>","被测物体体积","mL"],["m","被测物体质量","g"],["ρ","被测物体密度","g/mL"],["V","物体体积","m³"],["m<sub>1<\/sub>","质量—体积图线上第一个读数点的质量","kg"],["m<sub>2<\/sub>","质量—体积图线上第二个读数点的质量","kg"],["V<sub>1<\/sub>","质量—体积图线上第一个读数点的体积","m³"],["V<sub>2<\/sub>","质量—体积图线上第二个读数点的体积","m³"]],[["把物体体积写成放入前后液体读数之和。","物体排开的是液面增加的部分，应以后读数减前读数；50 mL 升至 70 mL，物体体积为 20 mL。"],["物体未完全浸没或吸水时，仍直接把液面差当作物体体积。","排水法成立需要完全浸没、体积读数可靠且物体不吸水、不溶解；实验条件不满足时需改用其他方法。"]],"同一种材料通常具有相对稳定的密度，但温度、状态和测量误差会影响实际数值；判断材料时应结合多个证据。密度只是物质多种物理属性之一，不能用密度代替硬度、导电性或磁性。排水法读数时要排除气泡并保证物体完全浸没且不溶于水。",["读取物体浸入前量筒体积 V<sub>1<\/sub>。","将物体完全浸没，读取液体总体积 V<sub>2<\/sub>。","用 V<sub>2<\/sub>-V<sub>1<\/sub> 得到排开液体体积，并在适用条件下视为物体体积。","若还测得物体质量，用 m/V<sub>o<\/sub> 求密度。"],["物体质量 54 g，浸入前量筒读数 50 mL，完全浸没后为 70 mL，求体积和密度。",["V<sub>o<\/sub>=70-50=20 mL。","ρ=54/20=2.7 g/mL。"],"体积为 20 mL，密度为 2.7 g/mL。"],["prop-01"],[],["密度应用","排水法","物质的物理属性","材料鉴别","拓展"],5,"<section class=\"field learning\"><h4>密度应用与物理属性<\/h4><p>依据密度可估算质量、体积或辅助鉴别物质，但相近密度不证明材料相同。用已知材料密度反算实心体积，再和总体积比较可判断空心情况。选电线芯看导电性，锅体看导热性，工具刃看硬度，弹簧看弹性，分选钢铁看磁性；不同属性不能用密度大小包办。<\/p><\/section><section class=\"field learning\"><h4>跨学科实践（原创任务）<\/h4><p>选择保温杯材料方案：分别比较导热、密度、耐用与成本。给同体积样品算质量，设计同初温同水量的降温比较，再画结构草图说明为何导热率不同；密度本身不能证明保温性能。<\/p><\/section><details class=\"learning\"><summary>实验：测量固体密度<\/summary><p><b>目的：<\/b>用质量和排开液体体积求不规则固体密度。<\/p><p><b>装置与接法：<\/b>天平、量筒、水、细线、不溶不吸水且能下沉的样品。<\/p><p><b>控制、改变与观察：<\/b>同一干燥样品，测质量和前后体积，排除气泡。<\/p><p><b>步骤：<\/b><\/p><ol><li>先用调平天平测干燥样品质量。<\/li><li>量筒放水平，视线与凹液面最低处齐平，读初始体积。<\/li><li>细线放入样品使完全浸没且无气泡，读最终体积，做差再除质量。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：质量54 g，体积由40 mL到60 mL，样品20 cm³，密度2.7 g/cm³=2700 kg/m³。<\/p><p><b>结论与条件：<\/b>排水差是固体体积，质量除以体积为密度。<\/p><p><b>误差与边界：<\/b>先浸水再称会因附着水使质量偏大；气泡使体积偏大、密度偏小；吸水和溶解样品不直接适用。<\/p><\/details>","基础","初中"],["force-03","力 弹力","物体发生弹性形变时会产生弹力，弹力方向与形变方向相反。",[["线性弹簧弹力与形变量关系","<mrow><msub><mi>F<\/mi><mi>e<\/mi><\/msub><mo>=<\/mo><mrow><mi>k<\/mi>&#x22C5;<mi>x<\/mi><\/mrow><\/mrow>","拓展计算，非本卡初中必背主线。仅用于弹性限度内近似线性的弹簧；x 是相对原长的形变量。"],["由弹力和劲度系数求形变量","<mrow><mi>x<\/mi><mo>=<\/mo><mfrac><msub><mi>F<\/mi><mi>e<\/mi><\/msub><mi>k<\/mi><\/mfrac><\/mrow>","拓展计算，非本卡初中必背主线。弹簧仍在线性弹性范围内，k 大于零。"]],[["F<sub>e<\/sub>","弹簧弹力大小","N"],["k","线性弹簧劲度系数","N/m"],["x","弹簧相对原长的形变量","m"]],[["误把弹力大小写成线性弹簧kx的一半。","弹性限度内的线性弹簧关系为kx，不带二分之一；这里是错误增加了除2，不是漏掉正确系数。"],["认为任何材料、任何形变都遵守线性弹簧关系。","线性关系只适用于弹性限度内近似线性的弹簧；塑性形变或超过弹性限度时不可套用。"]],"弹力可以通过弹簧测力计感受和测量，弹簧伸长量越大，弹力通常越大。这里的 F=kx 是线性弹簧的拓展模型，教材基础要求主要是辨认弹力、方向和产生条件；实际弹簧若发生明显弯折、塑性形变或接近极限，比例关系不再适用。",["确定弹簧原长和受力后的长度，两者之差为形变量 x。","在线性弹性范围内，实验表明弹力大小与形变量成正比，比例系数为 k。","使用 F<sub>e<\/sub>=kx 前检查弹簧没有超过弹性限度，并统一 N、N/m 和 m。"],["劲度系数为 100 N/m 的弹簧在弹性限度内伸长 0.03 m，估算弹力。",["确认形变量在弹性限度内。","F<sub>e<\/sub>=kx=100×0.03=3 N。"],"弹力约为 3 N。"],["force-01"],["force-04"],["弹力","弹性形变","弹簧","劲度系数","拓展"],6,"<section class=\"field learning\"><h4>力、弹力与测力计<\/h4><p>力是物体间相互作用，能使物体形变或改变运动状态；大小、方向、作用点是力的三要素。弹性形变恢复时产生弹力，塑性形变不一定可恢复。弹簧测力计使用前看量程、分度值并沿受力方向调零，力沿轴线、待示数稳定后读数，不超量程。弹簧正比式仅是拓展模型，不是所有材料普遍定律。<\/p><\/section><section class=\"field learning\"><h4>本章素养回顾（原创任务）<\/h4><p>选择本章一个现象，写出结论、成立条件和证据；用另一条本章规律复核解释是否矛盾。指出一次测量或模型的局限，并说明还需什么证据；数值通过不替代概念辨析。<\/p><\/section><details class=\"learning\"><summary>实验：用弹簧测力计测量力<\/summary><p><b>目的：<\/b>沿轴线读取力的大小。<\/p><p><b>装置与接法：<\/b>合适量程测力计、钩码。<\/p><p><b>控制、改变与观察：<\/b>同一仪器沿受力方向调零，观察稳定读数。<\/p><p><b>步骤：<\/b><\/p><ol><li>确认量程和分度值、沿使用方向调零。<\/li><li>悬挂钩码使力沿轴线，避免侧向卡碰。<\/li><li>稳定后垂直刻度面读数，取下钩码检查归零。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：分度值0.1 N、示数1.5 N，不能写1.5 kg。<\/p><p><b>结论与条件：<\/b>示数表示拉力大小；静止悬挂时可等于钩码重力。<\/p><p><b>误差与边界：<\/b>超量程、侧拉、零点偏移和摆动会影响读数，不能用未校正示数直接比较。<\/p><\/details>","拓展","初中主线；公式含拓展"],["force-01","重力 力的示意图","地球附近的物体受到重力，重力方向竖直向下，大小与物体质量近似成正比。",[["质量与重力的关系","<mrow><mi>G<\/mi><mo>=<\/mo><mrow><mi>m<\/mi>&#x22C5;<mi>g<\/mi><\/mrow><\/mrow>","近地面估算时取 g≈10 N/kg；更精确计算可按题目给定 g。"],["由重力估算质量","<mrow><mi>m<\/mi><mo>=<\/mo><mfrac><mi>G<\/mi><mi>g<\/mi><\/mfrac><\/mrow>","重力 G 与当地重力加速度 g 已知，且 g 不为零。"]],[["G","物体所受重力","N"],["m","物体质量","kg"],["mg","以克记录的质量数值，代入前要换成 kg","g"],["g","当地重力与质量的比值，估算取 10 N/kg","N/kg"],["F<sub>AB<\/sub>","物体 A 对物体 B 的作用力大小","N"],["F<sub>BA<\/sub>","物体 B 对物体 A 的作用力大小","N"],["F<sub>ABx<\/sub>","A 对 B 的作用力沿选定方向的分量，正负表示方向","N"],["F<sub>BAx<\/sub>","B 对 A 的作用力沿同一选定方向的分量，正负表示方向","N"],["F<sub>合<\/sub>","这两个相互作用力沿选定方向的分量代数和","N"]],[["质量以克记录时，把克的数值直接当作 kg 代入重力公式。","200 g 应先换成 0.2 kg；把数值 200 直接代入会把重力算大 1000 倍。"],["把重力写成质量除以 g。","g 的单位是 N/kg，重力应为 m·g 才得到 N；除法会得到不符合力单位的结果。"],["把质量和重力看成同一个量，直接用 kg 表示重力。","质量单位为 kg，重力单位为 N；二者通过当地 g 联系，但概念和单位不同。"]],"在地球表面附近常用 G=mg 估算重力，比例系数 g 约为 9.8 N/kg，粗略计算可取 10 N/kg。质量和重力不是同一个量：质量用 kg，重力用 N。画示意图时箭头方向表示力方向，线段长短可按比例表示大小，不要把重力方向画成总是垂直于斜面。",["物体质量为 m，每千克物体受到的重力用 g 表示。","重力随质量成正比，所以重力大小为 G=m·g。","移项可由重力与当地 g 反算物体质量。"],["一只质量 3 kg 的物体在地面附近运动，取 g=10 N/kg，求其重力。",["G=mg=3×10=30 N。","重力方向竖直向下。"],"重力大小为 30 N，方向竖直向下。"],[],["force-02"],["重力","质量","力的示意图","竖直向下"],6,"<section class=\"field learning\"><h4>重力与示意图<\/h4><p>重力源于地球对物体的吸引，方向竖直向下，重心是画重力示意图的作用点模型。规则、均匀物体常取几何中心，不规则或不均匀物体需另判。悬线可帮助确定竖直方向；沿重心画带箭头线段并标重力。g可近似9.8 N/kg，题目指定10 N/kg则按指定值；不能把质量克数直接乘g。<\/p><\/section>","基础","初中"],["force-04","摩擦力","两个相互接触的物体发生或将要发生相对运动时，接触面会产生阻碍相对运动的摩擦力。",[["匀速水平拉动时摩擦力等于拉力","<mrow><msub><mi>F<\/mi><mi>f<\/mi><\/msub><mo>=<\/mo><msub><mi>F<\/mi><mi mathvariant=\"normal\">拉<\/mi><\/msub><\/mrow>","木块在水平面上匀速运动，且水平方向只有拉力和滑动摩擦力。"],["匀速滑动时水平合力","<mrow><msub><mi>F<\/mi><mi mathvariant=\"normal\">合<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>F<\/mi><mi mathvariant=\"normal\">拉<\/mi><\/msub><mo>−<\/mo><msub><mi>F<\/mi><mi>f<\/mi><\/msub><\/mrow><\/mrow>","沿运动方向取正，水平合力等于拉力减去反向摩擦力；匀速时合力为零。"]],[["F<sub>f<\/sub>","滑动摩擦力大小","N"],["F<sub>拉<\/sub>","水平拉力大小","N"],["F<sub>合<\/sub>","水平方向合力","N"]],[["在水平匀速实验中把摩擦力误算为拉力的一半。","水平方向只有拉力和摩擦力且物体匀速时，两力平衡，大小应相等。"],["认为摩擦力总是阻碍物体相对地面的运动。","摩擦力阻碍的是接触面间的相对运动或相对运动趋势，方向应结合两个接触物体判断。"]],"摩擦力大小受压力和接触面情况等因素影响，不能仅凭物体是否运动判断。水平面上用弹簧测力计匀速拉动木块，若水平方向只受拉力和滑动摩擦力，则两力平衡，拉力读数等于摩擦力大小。改变条件时要区分静摩擦和滑动摩擦，不能把本实验结论推广到所有情况。",["确定接触面和相对运动方向，先画出摩擦力方向。","木块匀速说明速度不变；在水平方向只有拉力和摩擦力时，合力为零。","因此两力大小相等；若存在其他水平力或木块有加速度，需重新列合力。"],["水平桌面上木块被 3 N 的水平拉力匀速拉动，水平方向只有拉力和摩擦力，求摩擦力。",["匀速说明水平方向合力为零。","摩擦力与拉力反向且大小相等。"],"摩擦力大小为 3 N。"],["force-01"],["force-02"],["摩擦力","滑动摩擦","匀速","受力平衡"],6,"<section class=\"field learning\"><h4>摩擦力<\/h4><p>滑动摩擦力与接触面粗糙程度、压力有关。研究压力时保持接触面相同；研究粗糙程度时保持压力相同。水平匀速拉木块时拉力可代替摩擦力大小，非匀速就不能直接等同。走路时地面对脚的摩擦力可向前，摩擦不总是阻碍物体相对地面运动。润滑、变滑动为滚动可减小部分摩擦，纹路和增压可增大部分摩擦。<\/p><\/section><details class=\"learning\"><summary>实验：探究滑动摩擦力大小的影响因素<\/summary><p><b>目的：<\/b>区分压力与接触面粗糙程度。<\/p><p><b>装置与接法：<\/b>木块、测力计、木板、粗糙面、砝码。<\/p><p><b>控制、改变与观察：<\/b>改变压力时保持接触面，改变粗糙程度时保持压力；观察匀速读数。<\/p><p><b>步骤：<\/b><\/p><ol><li>沿水平拉木块做匀速直线运动，读稳定拉力。<\/li><li>加砝码而保持接触面不变，重复。<\/li><li>换粗糙面而保持总压力不变，重复并分组比较。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：同面压力由2 N增到4 N，拉力由0.6 N增到1.2 N；压力2 N换粗糙面，拉力可变0.9 N。<\/p><p><b>结论与条件：<\/b>在该实验范围内，压力大或接触面粗糙时滑动摩擦力通常较大；不由两点数据宣称普遍精确比例。<\/p><p><b>误差与边界：<\/b>拉力不水平或运动不匀速时不能直接代替摩擦力；压力不是任意情况下的重力。<\/p><\/details>","基础","初中"],["force-02","力的作用是相互的","物体间的相互作用总是成对出现：物体 A 对 B 施力时，B 同时对 A 施加大小相等、方向相反的力。",[["相互作用力大小相等","<mrow><msub><mi>F<\/mi><mi mathvariant=\"normal\">AB<\/mi><\/msub><mo>=<\/mo><msub><mi>F<\/mi><mi mathvariant=\"normal\">BA<\/mi><\/msub><\/mrow>","比较同一时刻同一对相互作用力的大小，方向相反且作用在不同物体上。"],["同一方向轴上的相互作用力分量相反","<mrow><msub><mi>F<\/mi><mi mathvariant=\"normal\">合<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>F<\/mi><mi mathvariant=\"normal\">ABx<\/mi><\/msub><mo>+<\/mo><msub><mi>F<\/mi><mi mathvariant=\"normal\">BAx<\/mi><\/msub><\/mrow><\/mrow>","沿同一直线选定正方向记录两个力的分量时，两个力同时作用且方向相反。"]],[["F<sub>AB<\/sub>","物体 A 对物体 B 的作用力大小","N"],["F<sub>BA<\/sub>","物体 B 对物体 A 的作用力大小","N"],["F<sub>ABx<\/sub>","A 对 B 的作用力沿选定方向的分量，正负表示方向","N"],["F<sub>BAx<\/sub>","B 对 A 的作用力沿同一选定方向的分量，正负表示方向","N"],["F<sub>合<\/sub>","这两个相互作用力沿选定方向的分量代数和","N"]],[["把反作用力大小误写成作用力的一半。","成对相互作用力大小相等；物体质量不同不会使某一方只受一半力，分别作用于两个物体也不改变大小关系。"],["把作用在两个物体上的相互作用力当成作用在一个物体上的平衡力。","平衡力作用在同一物体上，而相互作用力分别作用在两个物体上；即使大小相等，也不能把这两类力混为一谈。"]],"判断一对相互作用力时要同时指出施力物体和受力物体，再比较大小、方向和作用时间。船桨推水、水推船向前，说明作用力和反作用力分别作用在不同物体上。不能把它们误当成同一物体的平衡力。",["先确定施力物体和受力物体，给两个力分别标记作用对象。","观察或用相互作用实验比较同一时刻两力的大小。","作用力与反作用力大小相等、方向相反，但分别作用于两个物体。"],["学生用 30 N 的力推墙，墙对学生的作用力大小是多少？",["学生对墙和墙对学生是一对相互作用力。","同一对力大小相等、方向相反，故墙对学生的力大小为 30 N。"],"30 N。"],[],[],["相互作用力","作用力与反作用力","大小相等","方向相反"],6,"<section class=\"field learning\"><h4>相互作用力与平衡力<\/h4><p>同时写清两个物体与力的方向：手推墙、墙推手是一对相互作用力，大小相等、方向相反、分别作用在不同物体上。桌对书支持力与书受到的重力可为平衡力，它们作用于同一本书。质量不同不意味着相互作用力不等大；同一个力不能只凭名称判类别。<\/p><\/section>","基础","初中"],["fmotion-01","二力平衡","物体在两个力作用下保持静止或匀速直线运动时，这两个力互相平衡。",[["反向共线两力的合力","<mrow><msub><mi>F<\/mi><mi mathvariant=\"normal\">合<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>F<\/mi><mn>1<\/mn><\/msub><mo>−<\/mo><msub><mi>F<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mrow>","F<sub>1<\/sub>、F<sub>2<\/sub> 沿同一直线且方向相反；正方向取为 F<sub>1<\/sub> 方向。"],["二力平衡条件","<mrow><msub><mi>F<\/mi><mn>1<\/mn><\/msub><mo>=<\/mo><msub><mi>F<\/mi><mn>2<\/mn><\/msub><\/mrow>","两个力作用在同一物体、同一直线上且方向相反。"]],[["F<sub>1<\/sub>","沿选定方向的第一个力的大小","N"],["F<sub>2<\/sub>","与第一个力反向的第二个力的大小","N"],["F<sub>合<\/sub>","沿选定方向的合力","N"]],[["两个反向力大小相等时，把合力写成两力相加。","方向相反的共线力应按选定正方向做代数相减；5 N 与 5 N 反向合力为零。"],["认为合力为零就说明物体一定静止。","合力为零时物体保持原来的运动状态；原来运动的物体可继续做匀速直线运动。"]],"判断二力是否平衡，不能只看大小相等，还要检查方向、作用线和研究对象。沿同一直线取一个正方向后，反向两力的合力可用带方向的代数和表示；平衡时合力为零。作用力和反作用力虽然大小相等方向相反，但作用于不同物体，不能当作同一物体上的平衡力。",["先画出物体所受力，确认两个力作用在同一物体上。","检查两力是否在同一直线、方向相反且大小相等。","沿选定方向计算代数和，等大反向时合力为零。","依据合力为零，物体保持静止或匀速直线运动状态。"],["木块原来在水平面上向右运动，水平方向只有8 N向右拉力和8 N向左摩擦力，判断水平合力及此后运动状态。",["取向右为正方向，合力为 8-8=0 N。","合力为零可保持已有运动状态；若木块原来匀速，则继续匀速直线运动。"],"水平合力0 N，木块保持原速度向右作匀速直线运动。"],["force-02"],["fmotion-02"],["二力平衡","合力","平衡条件","受力分析"],7,"<section class=\"field learning\"><h4>二力平衡<\/h4><p>四个条件是同一物体、同一直线、大小相等、方向相反，缺一不可。静止或匀速直线运动是平衡状态；转弯即使速率不变也不属于匀速直线运动。书静止在桌上时支持力与重力平衡，书对桌的压力不在书的受力图中。<\/p><\/section><section class=\"field learning\"><h4>本章素养回顾（原创任务）<\/h4><p>选择本章一个现象，写出结论、成立条件和证据；用另一条本章规律复核解释是否矛盾。指出一次测量或模型的局限，并说明还需什么证据；数值通过不替代概念辨析。<\/p><\/section>","基础","初中"],["fmotion-02","牛顿第一定律","一切物体在没有受到外力作用时，总保持静止状态或匀速直线运动状态。",[["匀速直线运动的速度","<mrow><mi>v<\/mi><mo>=<\/mo><mfrac><mi>s<\/mi><mi>t<\/mi><\/mfrac><\/mrow>","物体沿直线运动且速度大小不变，路程与计时区间匹配。"],["合力为零时速度保持不变","<mrow><msub><mi>v<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><msub><mi>v<\/mi><mn>1<\/mn><\/msub><\/mrow>","沿直线运动且合力为零；此式描述速度大小不变，方向也保持不变。"]],[["s","匀速直线运动通过的路程","m"],["t","通过路程所用的时间","s"],["v","匀速直线运动速度","m/s"],["v<sub>1<\/sub>","运动开始时速度","m/s"],["v<sub>2<\/sub>","一段时间后速度","m/s"]],[["速度已用 m/s 代入路程关系时，又额外乘 3.6，误把 km/h 换算重复做了一次。","匀速小车速度 10 m/s、时间 5 s，路程应为 50 m；再乘 3.6 会错算为 180 m。"],["把惯性说成物体继续运动的一个力。","惯性是物体本身的性质，不是力；分析速度改变仍要检查物体受到的合力。"],["认为只有运动物体才有惯性，静止物体没有惯性。","惯性是所有物体的固有属性，静止物体也保持静止状态，质量越大惯性越大。"]],"惯性是物体保持原来运动状态的性质，质量越大通常越难改变运动状态。力不是维持运动的原因，而是改变运动状态的原因；当合力为零，物体可以静止，也可以保持原有速度做匀速直线运动。解释现象时要区分“有速度”和“有合力”。",["惯性使物体具有保持原有运动状态的倾向，不是额外施加在物体上的力。","合力为零时，物体的运动状态不发生改变。","若物体已沿直线匀速运动，则一段时间前后的速度相同。"],["传送带使物体沿直线以 8 m/s 匀速运动 3 s，求路程，并说明合力为零时速度如何变化。",["路程 s=vt=8×3=24 m。","若合力为零，物体保持原来的匀速直线运动状态。"],"路程为 24 m；合力为零时速度保持不变。"],["fmotion-01"],["fmotion-03"],["牛顿第一定律","惯性","运动状态","合力为零"],7,"<section class=\"field learning\"><h4>牛顿第一定律与惯性<\/h4><p>让同一小车从同一斜面高度静止释放，分别在毛巾、棉布和木板上运动；阻力越小，速度改变越慢，运动越远。完全无阻力不能在课堂真正实现，定律是实验基础上的科学推理。所有物体都有惯性，惯性大小由质量决定，与是否运动无关，不称“惯性力”。急刹车时人因惯性保持原运动状态，安全带提供使其运动状态改变的力。<\/p><\/section><section class=\"field learning\"><h4>跨学科实践（原创任务）<\/h4><p>解释乘车制动时安全带的作用：画制动前后人的运动趋势与安全带作用方向，结合惯性和交通规则提出乘坐建议。只做小车与模型物的低能量演示，不让学生用急刹车或人体碰撞来验证。<\/p><\/section>","基础","初中"],["fmotion-03","力与运动的关系","合力会改变物体的运动状态。",[["恒定合力与加速度关系","<mrow><msub><mi>F<\/mi><mi mathvariant=\"normal\">合<\/mi><\/msub><mo>=<\/mo><mrow><mi>m<\/mi>&#x22C5;<mi>a<\/mi><\/mrow><\/mrow>","拓展计算，非本卡初中必背主线。质量不变且合力恒定时；单位分别为 kg、m/s²、N。"],["速度变化率表示加速度","<mrow><mi>a<\/mi><mo>=<\/mo><mfrac><mi mathvariant=\"normal\">dv<\/mi><mi>t<\/mi><\/mfrac><\/mrow>","拓展计算，非本卡初中必背主线。加速度取速度变化量除以同一时间间隔，t 大于零。"]],[["F<sub>合<\/sub>","物体所受合力大小","N"],["m","物体质量","kg"],["a","物体加速度大小","m/s²"],["dv","一段时间内速度变化量","m/s"],["t","速度变化所用时间","s"]],[["把合力误写成质量与加速度乘积的一半。","牛顿第二定律的拓展模型为 F<sub>合<\/sub>=m·a；2 kg 小车加速度 2 m/s² 时合力应为 4 N。"],["认为物体只要在运动，就一定受到沿运动方向的合力。","物体可以在合力为零时保持匀速直线运动；合力决定运动状态如何改变，不是维持运动的必要条件。"]],"观察相同质量的小车受到不同合力时的运动变化，可发现合力越大，加速度越大；合力相同时，质量更大，加速度更小。这里用 F<sub>合<\/sub>=m·a 把趋势定量表达，要求质量不变、合力恒定且单位统一为 kg、N、m/s²。初中课程首先要求理解力能改变运动状态。",["确定研究对象，先合成同一直线上的各个力，得到合力 F<sub>合<\/sub>。","在质量不变且合力恒定时，合力与加速度大小满足 F<sub>合<\/sub>=m·a。","也可从速度变化量和时间求加速度，再与合力除以质量的结果比较。"],["质量 2 kg 的小车受到大小为 4 N 的恒定合力，估算其加速度。",["使用拓展关系 a=F<sub>合<\/sub>/m。","代入 4÷2=2 m/s²，并确认合力方向与加速度方向一致。"],"加速度大小约为 2 m/s²。"],["fmotion-02"],[],["力与运动","合力","加速度","牛顿第二定律","拓展"],7,"<section class=\"field learning\"><h4>力与运动的关系<\/h4><p>合力为零时运动状态不变，可能静止也可能匀速直线运动；合力不为零时速度大小或方向会改变。力方向与速度方向不同并不矛盾，物体可以一边前进一边减速。下列加速度定量公式为高中拓展，不用它代替初中“是否平衡、如何改变状态”的解释。<\/p><\/section>","拓展","初中主线；公式含拓展"],["pressure-01","压强","压力是垂直作用在接触面上的力；压强表示单位面积上受到的压力，p=F/S。",[["压力与受力面积求压强","<mrow><mi>p<\/mi><mo>=<\/mo><mfrac><mi>F<\/mi><mi>S<\/mi><\/mfrac><\/mrow>","F 垂直接触面，F 用 N、S 用 m2，结果 p 用 Pa。"],["由压强和面积求压力","<mrow><mi>F<\/mi><mo>=<\/mo><mrow><mi>p<\/mi>&#x22C5;<mi>S<\/mi><\/mrow><\/mrow>","压力垂直作用于面积 S，压强 p 均匀。"]],[["F","垂直接触面的压力","N"],["S","受力面积","m2"],["p","压强","Pa"],["ρ","液体密度","kg/m³"],["g","当地重力加速度","N/kg"],["h","测点到液面的竖直深度","m"],["S<sub>cm<\/sub>","受力面积以平方厘米记录的数值","cm2"],["p<sub>0<\/sub>","面积改变前的设计压强","Pa"],["S<sub>0<\/sub>","面积改变前的设计受力面积","m2"]],[["把平方厘米换成平方米时只除100，漏掉长度倍率的平方。","200 cm²应为0.020 m²，不是2 m²；100 N应产生5000 Pa，误换算只得50 Pa。"],["把压强写成压力乘以面积。","压强表示单位面积上的压力，应除以面积；F·S 的单位也不是 Pa。"],["认为受力面积越大，压力固定时压强也越大。","同一压力分摊到更大的受力面积上，单位面积承担的压力会减小，因此压强减小；压力和压强不能混为一个量。"]],"压强能描述压力作用效果。计算固体压强时使用垂直接触面的压力和实际受力面积；不能把物体全部表面积当作受力面积。增大压力或减小受力面积通常会增大压强；单位 Pa 等于 N/m²。",["确定垂直作用于接触面的压力 F。","测量承受压力的面积 S 并统一为 m2。","把 F 除以 S 得压强 p；也可由 p 和 S 反算压力。"],["重 100 N 的物体对水平地面的受力面积为 0.02 m2，求压强。",["物体静止且水平面支撑时，压力大小为 100 N。","p=F/S=100/0.02=5000 Pa。"],"压强为 5000 Pa。"],["force-01"],["pressure-02"],["压强","压力","受力面积","帕斯卡"],8,"<section class=\"field learning\"><h4>压力与压强<\/h4><p>压力垂直接触面，大小不总等于重力；斜面、额外按压等情况须分析。海绵凹陷程度用于比较压力效果，控制压力比面积、控制面积比压力。宽背带、雪板增大受力面积以减小压强；尖刀刃减小受力面积以增大压强。1 cm²=0.0001 m²，面积换算须平方长度倍率。<\/p><\/section><section class=\"field learning\"><h4>本章素养回顾（原创任务）<\/h4><p>选择本章一个现象，写出结论、成立条件和证据；用另一条本章规律复核解释是否矛盾。指出一次测量或模型的局限，并说明还需什么证据；数值通过不替代概念辨析。<\/p><\/section><p class=\"learning\"><b>单位换算证据：<\/b>200 cm² = 0.02 m²。长度100倍率，面积平方为10000倍率。<\/p>","基础","初中"],["pressure-02","液体的压强","液体内部向各个方向都有压强；同种液体中深度越大，压强越大。",[["液体密度和深度求内部压强","<mrow><mi>p<\/mi><mo>=<\/mo><mrow><mrow><mi>ρ<\/mi>&#x22C5;<mi>g<\/mi><\/mrow>&#x22C5;<mi>h<\/mi><\/mrow><\/mrow>","静止液体中测点相对液面的深度 h 用 m，ρ 用 kg/m³。"],["由液体压强和面积求压力","<mrow><mi>F<\/mi><mo>=<\/mo><mrow><mi>p<\/mi>&#x22C5;<mi>S<\/mi><\/mrow><\/mrow>","压强在所取小面积上近似均匀，F 用 N、S 用 m2。"]],[["p","液体内部压强","Pa"],["ρ","液体密度","kg/m³"],["g","当地重力加速度","N/kg"],["h","测点到液面的竖直深度","m"],["S","受液体压强作用的面积","m2"],["F","该面积上液体压力","N"]],[["深度已经用 m 表示，却又把它当成 cm 数值额外放大 100 倍。","水下 0.1 m 的压强为 1000 Pa；重复做厘米换算会错误得到 100 000 Pa。"],["把液体压强式中的深度误换成受力面积。","深度单位是m，面积是m²；替换后量纲变为Pa·m，不再是压强。这不是斜长与深度的数值混用。"],["认为容器越宽或形状不同，同种液体同深度处的压强必然不同。","静止同种液体的压强由密度、重力加速度和竖直深度决定，不由容器外形直接决定。"],["把沿容器壁量出的斜长当作液体深度。","深度须从液面竖直向下量到测点，斜长通常更大；要结合几何图判断，不由面积式错误实测代替。"]],"深度 h 从液面向下竖直测量，不是沿斜面或容器壁量出的距离。液体压强还会传向容器侧壁和底部；同一深度的压强与容器形状无关。利用压强求某一面积上的压力时再用 F=pS，避免把压强和压力混淆。",["取静止液体中距液面深度为 h 的位置。","该位置上方液柱的重力随液体密度、重力加速度和高度变化。","液柱压力作用于单位面积后得到 p=ρ·g·h。","若进一步求某面积上的压力，用压强乘面积。"],["水中距液面0.2 m处，由水的重力产生的附加压强是多少（不含液面大气压）？取水密度1000 kg/m³、g=10 N/kg。",["p=ρ·g·h=1000×10×0.2=2000 Pa。","深度取竖直距离，单位为 m。"],"液体压强为 2000 Pa。"],["pressure-01"],["pressure-03"],["液体压强","液体深度","密度","液体压力"],8,"<section class=\"field learning\"><h4>液体压强<\/h4><p>液体因重力与流动性对底、壁和内部各方向施压；静止同种液体同深度压强相同。深度是自由液面到测点的竖直距离，不是倾斜距离或液柱总长度。连通器中同种液体、自由液面压强相同且静止时，各液面高度相同；不满足条件时不能直接套用。<\/p><\/section><details class=\"learning\"><summary>实验：探究液体压强的影响因素<\/summary><p><b>目的：<\/b>比较方向、深度、液体密度。<\/p><p><b>装置与接法：<\/b>液体压强计、橡皮膜探头、水、盐水和刻度尺。<\/p><p><b>控制、改变与观察：<\/b>同液同深度改朝向；同液改深度；同深度改液体密度，观察U形管高度差。<\/p><p><b>步骤：<\/b><\/p><ol><li>检查密封，确认同压时两侧液面等高。<\/li><li>同深度转探头，比较高度差；再增大深度。<\/li><li>保持深度改用较高密度液体，比较高度差。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：水中10 cm与20 cm高度差不同，若按g=10 N/kg则模型压强1000、2000 Pa。<\/p><p><b>结论与条件：<\/b>静止同种液体同深度各向压强相同；深度或液体密度较大时压强较大。<\/p><p><b>误差与边界：<\/b>橡皮膜漏气、残余压差、深度量错影响结论；U形管高度差表示压强差，不直接当探头深度。<\/p><\/details>","基础","初中"],["pressure-03","气体的压强","气体会对容器壁和浸入其中的物体产生压强；大气也对地面和物体施加压强。",[["由水银柱高度估算大气压","<mrow><mi>p<\/mi><mo>=<\/mo><mrow><mrow><mi>ρ<\/mi>&#x22C5;<mi>g<\/mi><\/mrow>&#x22C5;<mi>h<\/mi><\/mrow><\/mrow>","静止水银柱的压强估算，忽略液面压强差；h 为竖直高度。"]],[["p","水银柱对应的大气压估值","Pa"],["ρ","水银密度","kg/m³"],["g","重力加速度","N/kg"],["h","水银柱的竖直高度","m"],["h<sub>cm<\/sub>","同一水银柱竖直高度以厘米记录的读数","cm"]],[["把水银柱高度的厘米读数直接当作米代入。","76 cm应先换0.76 m；13600×9.8×0.76=101292.8 Pa，把76当米得到10129280 Pa，放大100倍。"],["认为大气压只从上方作用，不会向各个方向传递。","静止气体压强向各方向作用，覆杯实验、吸盘等现象都能体现大气压的作用。"]],"大气压随高度、天气和测量环境变化；标准大气压约为 1.01×10⁵ Pa。水银柱高度必须竖直测量，不能把容器形状误认为决定压强的因素。用液柱估算大气压属于受压液柱的定量拓展，初中核心还包括覆杯实验、吸盘和气压变化现象。",["水银柱静止时，液柱重量对下方截面产生压强。","按液体压强关系 p=ρ·g·h，以水银密度和竖直高度估算。","将所得值与约 1.01×10⁵ Pa 的标准大气压数量级比较，并说明实际大气压会变化。"],["水银柱高 0.76 m，水银密度取 13600 kg/m³，g=9.8 N/kg，估算大气压。",["确认水银柱高度已用米表示。","p=ρ·g·h=13600×9.8×0.76≈101293 Pa。"],"约 1.01×10⁵ Pa。"],["pressure-02"],["pressure-04"],["气体压强","大气压","水银柱","托里拆利实验","拓展"],8,"<section class=\"field learning\"><h4>气体压强与生活应用<\/h4><p>大气压向各方向作用，吸管饮水是管内压强降低后外部气压推动液体，不是吸力凭空拉水。标准大气压约1.01×10⁵ Pa，随海拔升高通常降低；沸点随气压降低而降低。活塞压缩密闭气体时若温度等条件明确，通常压强增大；流速较大的流体区域压强常较小，但要说明比较条件。水银有毒，托里拆利实验只作原理阅读，不要求学生自行操作。<\/p><\/section>","基础","初中"],["pressure-04","浮力","浸在液体或气体中的物体会受到竖直向上的浮力。",[["流体密度和排开体积求浮力","<mrow><mi mathvariant=\"normal\">Fb<\/mi><mo>=<\/mo><mrow><mrow><mi>ρ<\/mi>&#x22C5;<mi>g<\/mi><\/mrow>&#x22C5;<mi>V<\/mi><\/mrow><\/mrow>","V 是被排开的流体体积；物体完全浸没时 V 等于物体体积。"],["阿基米德原理的排液重力关系","<mrow><mi mathvariant=\"normal\">Fb<\/mi><mo>=<\/mo><mi mathvariant=\"normal\">Gd<\/mi><\/mrow>","Gd 是物体排开的液体或气体所受的重力。"]],[["Fb","物体受到的浮力","N"],["ρ","液体密度","kg/m³"],["g","当地重力加速度","N/kg"],["V","物体排开液体的体积","m³"],["Gd","排开液体所受的重力","N"],["G","物体所受重力","N"],["V<sub>总<\/sub>","物体总体积，部分浸入时大于排开体积","m³"]],[["部分浸入时把物体总体积当成排开液体体积。","木块总体积0.004 m³、仅排水0.002 m³，正确浮力20 N；用总体积计算得40 N。水中完全浸没石块则不区分，必须选择部分浸入情境。"],["认为浮力只作用于漂浮物体。","浸没在液体中的石块也受到浮力；只要物体浸在流体中，就应分析浮力。"]],"计算浮力时用排开流体的体积，不一定等于物体总体积：物体部分浸入时只取浸入部分。浮力方向竖直向上；同一流体中排开体积越大，浮力越大。称重法、阿基米德原理和排液重力比较可以作为不同测量路径。浮沉状态还需单独比较浮力与重力。",["浮力来自液体对物体上下表面的压力差，方向竖直向上。","阿基米德原理把浮力与排开流体的重力相联系。","排开液体质量可由密度乘排开体积得到，再乘 g 得其重力。","物体漂浮或悬浮静止时，竖直方向合力为零，故浮力等于物体重力。"],["一个物体浸没在水中并排开 0.003 m³ 的水，取水密度 1000 kg/m³、g=10 N/kg，求浮力。",["确认使用排开液体体积 V=0.003 m³。","Fb=ρ·g·V=1000×10×0.003=30 N。"],"浮力为 30 N。"],["pressure-02"],["pressure-05"],["浮力","阿基米德原理","排开液体体积","排液重力"],8,"<section class=\"field learning\"><h4>浮力与排开体积<\/h4><p>浸在液体中的物体受向上浮力，液体上下表面对物体的压力差可解释其来源。浮力大小等于排开液体的重力，取决于液体密度和排开体积；部分浸入时排开体积小于物体总体积，完全浸没后在均匀液体中继续加深，浮力不因深度单独增大。物体和底部接触且底面无液体时，通常浮力模型需重新分析。<\/p><\/section><details class=\"learning\"><summary>实验：探究浮力大小的影响因素<\/summary><p><b>目的：<\/b>研究排开体积和液体密度。<\/p><p><b>装置与接法：<\/b>测力计、物体、水与盐水、量筒、细线。<\/p><p><b>控制、改变与观察：<\/b>同液改变浸入体积，体积相同改液体，完全浸没后改深度；观察称重差。<\/p><p><b>步骤：<\/b><\/p><ol><li>先在空气中读重力，浸液后读稳定拉力。<\/li><li>用重力减拉力求浮力，逐步增加浸入体积。<\/li><li>完全浸没后改深度，再保持体积换液体，分组比较。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：空气中5 N、水中完全浸没3 N，浮力2 N；排水200 cm³按g=10也得2 N。<\/p><p><b>结论与条件：<\/b>浮力随排开体积或液体密度增大而增大；均匀液体全浸没后仅改深度一般不改变浮力。<\/p><p><b>误差与边界：<\/b>附着气泡、碰底碰壁、线未竖直影响测力；密度不同与体积不同不能同时改变后归因于一个因素。<\/p><\/details>","基础","初中"],["pressure-05","物体的浮与沉","物体浸入液体后，运动状态由浮力、重力和初始状态共同决定。",[["漂浮或悬浮时的力平衡","<mrow><mi mathvariant=\"normal\">Fb<\/mi><mo>=<\/mo><mi>G<\/mi><\/mrow>","物体处于静止漂浮或悬浮状态，合力为零。"]],[["Fb","物体受到的浮力","N"],["G","物体所受重力","N"],["Gd","排开液体所受的重力","N"],["ρ","液体密度","kg/m³"],["g","重力加速度","N/kg"],["V","物体排开液体体积","m³"]],[["把静止漂浮时浮力大小误写成重力的两倍。","静止漂浮且仅受重力和浮力时两力平衡，20 N重力对应20 N浮力，不是40 N。"],["把“漂浮”和“悬浮”理解成浮力方向不同。","两种状态下浮力都竖直向上；区别是物体处于液面还是浸没在液体内部。"],["把正在加速下沉的物体也直接按浮力等于重力处理。","只有平衡等条件下才能等同；仅受重力与浮力而向下加速时重力大于浮力，须先明确状态。"]],"判断浮沉先明确物体是否浸没，再比较浮力与重力：静止漂浮或悬浮时两力平衡；下沉加速时重力大于浮力；上浮时浮力大于重力。密度比较可帮助判断常见情境，但要注意空心、内部气体和形状对平均密度的影响。",["画出物体所受的重力和浮力，确认它们方向相反。","静止漂浮或悬浮时合力为零，因此浮力大小等于重力大小。","运动中则比较两力大小判断加速度方向；不要把平衡条件套用于下沉加速过程。"],["某木块漂浮在水面，重力为 3 N，求它受到的浮力。",["漂浮状态稳定，木块处于平衡。","因此浮力大小等于重力，Fb=3 N。"],"浮力为 3 N。"],["pressure-04"],[],["物体的浮与沉","漂浮","悬浮","下沉","浮力与重力"],8,"<section class=\"field learning\"><h4>物体的浮与沉<\/h4><p>只受重力和浮力的物体，浮力大于重力时向上加速，小于重力时向下加速，相等时合力零。静止漂浮时部分体积浸入，静止悬浮时全部浸入且都满足浮力等于重力。对均匀实心、全浸没模型可比较物体与液体密度；空心船要比较总质量与排水能力。潜水艇改变总重力，轮船改变排水体积，气球借气体浮力；不能把密度判据无条件用于空心模型。<\/p><\/section><section class=\"field learning\"><h4>跨学科实践（原创任务）<\/h4><p>设计承载小物的纸船：在相同水盆、相同载荷位置下比较船形，记录载荷和浸入程度，解释排开水的重力与总重力的关系。联系几何、材料和稳定性，避免把船的材料密度当整体平均密度。<\/p><\/section>","基础","初中"],["particle-01","走进分子世界","常见物质由大量分子构成，分子很小，肉眼无法直接观察；分子永不停息地做无规则运动，温度越高通常运动越剧烈。",[["米换算为纳米","<mrow><msub><mi>d<\/mi><mi mathvariant=\"normal\">nm<\/mi><\/msub><mo>=<\/mo><mrow><mn>1000000000<\/mn>&#x2062;<msub><mi>d<\/mi><mi>m<\/mi><\/msub><\/mrow><\/mrow>","1 m=10⁹ nm；两种数值表示同一长度。"],["纳米换算为米","<mrow><msub><mi>d<\/mi><mi>m<\/mi><\/msub><mo>=<\/mo><mfrac><msub><mi>d<\/mi><mi mathvariant=\"normal\">nm<\/mi><\/msub><mn>1000000000<\/mn><\/mfrac><\/mrow>","原长度用 nm 表示，换算结果用 m 表示。"]],[["d<sub>m<\/sub>","以米表示的微观长度","m"],["d<sub>nm<\/sub>","同一长度以纳米表示","nm"]],[["把米换算成纳米时只乘 1000，误把毫、微等前缀混淆。","米到纳米相差 10⁹ 倍；例如 10⁻¹⁰ m 应为 0.1 nm，而不是 10⁻⁷ nm。"],["把分子或原子的示意图当作按真实尺寸比例绘制的结构图。","微观结构图通常为便于辨认而放大或简化，不能直接据图比较真实粒子尺寸。"]],"不同物质彼此接触后会逐渐混合，这种扩散现象支持分子在不停运动的认识。扩散速度还受温度、状态和颗粒尺度等因素影响，不能仅由一个简单比例式预测。纳米与米的换算可帮助描述分子尺度，但不表示每个分子直径都恰为某一固定值。",["物质的粒子尺度远小于日常物体，表示时常使用纳米。","米和纳米都是长度单位，1 m=1 000 000 000 nm。","乘以或除以单位换算比例，可在 m 与 nm 之间转换。"],["某微观长度约为 0.2 nm，换算成米。",["1 nm=10⁻⁹ m。","0.2 nm=0.2×10⁻⁹ m=2×10⁻¹⁰ m。"],"约为 2×10⁻¹⁰ m。"],[],["particle-02"],["分子","分子运动","扩散","分子间隙","纳米"],9,"<section class=\"field learning\"><h4>分子世界<\/h4><p>分子之间有间隙，永不停息地做无规则运动，分子间同时存在引力和斥力；温度越高，热运动通常越剧烈。红墨水在水中逐渐扩散是分子运动的证据，粉尘在空气中飞舞是可见颗粒运动，不能直接当作看见分子。压缩不易、拉伸不易可分别用分子作用理解，但宏观力也依赖材料结构，不能逐个把可见颗粒等同分子。<\/p><\/section><section class=\"field learning\"><h4>本章素养回顾（原创任务）<\/h4><p>选择本章一个现象，写出结论、成立条件和证据；用另一条本章规律复核解释是否矛盾。指出一次测量或模型的局限，并说明还需什么证据；数值通过不替代概念辨析。<\/p><\/section>","基础","初中"],["particle-03","静电现象","物体因电子转移或电荷重新分布而带电，带电物体之间会发生吸引或排斥。",[["绝缘系统总电荷守恒","<mrow><msub><mi>Q<\/mi><mi mathvariant=\"normal\">总<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>Q<\/mi><mi>A<\/mi><\/msub><mo>+<\/mo><msub><mi>Q<\/mi><mi>B<\/mi><\/msub><\/mrow><\/mrow>","拓展计算，非本卡初中必背主线。把所有相关带电物体纳入系统，且系统与外界没有电荷交换；电荷量保留正负号。"],["由守恒总电荷反求B物体电荷","<mrow><msub><mi>Q<\/mi><mi>B<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>Q<\/mi><mi mathvariant=\"normal\">总<\/mi><\/msub><mo>−<\/mo><msub><mi>Q<\/mi><mi>A<\/mi><\/msub><\/mrow><\/mrow>","拓展计算，非本卡初中必背主线。绝缘系统只含物体 A 和 B，电荷量采用带正负号的库仑值。"]],[["Q<sub>A<\/sub>","系统内物体 A 的带符号电荷量","C"],["Q<sub>B<\/sub>","系统内物体 B 的带符号电荷量","C"],["Q<sub>总<\/sub>","绝缘系统总电荷量","C"]],[["计算两物体总电荷时误将带符号电荷作差而不是作代数和。","电荷量应按符号作代数和；两物体带等量异号电荷时总电荷为零。应结合电荷守恒和本节讨论范围判断。"],["认为同种电荷相吸、异种电荷相斥。","同种电荷相互排斥，异种电荷相互吸引；应通过带电体实验辨认。应结合电荷守恒和本节讨论范围判断。"],["认为摩擦起电在系统内创造了新的电荷。","摩擦起电由电子转移造成，孤立系统总电荷守恒；把正负带符号电荷相加，不以单方电荷增加推断总量增加。"]],"摩擦起电不是凭空创造电荷，而是电子从一个物体转移到另一个物体；因此一个物体带正电时，另一个物体可能带等量负电。验电器可显示物体是否带电，但不直接给出电荷量大小。本点的电荷和守恒关系是定量拓展，初中核心是观察带电现象及相互作用。",["把相互作用的带电物体划入同一系统，逐个记录电荷的正负号。","电子转移只改变电荷分布，孤立系统的总电荷不变。","把系统总电荷写成各物体带符号电荷的代数和，检查转移前后总量一致。"],["绝缘系统中物体 A 带 +5×10⁻⁸ C，系统总电荷为 +2×10⁻⁸ C，求物体 B 的电荷量。",["用 Q<sub>总<\/sub>=Q<sub>A<\/sub>+Q<sub>B<\/sub>。","Q<sub>B<\/sub>=2×10⁻⁸-5×10⁻⁸=-3×10⁻⁸ C。"],"物体 B 带 -3×10⁻⁸ C。"],[],["particle-04"],["静电现象","电荷","摩擦起电","电荷守恒","拓展"],9,"<section class=\"field learning\"><h4>静电现象<\/h4><p>摩擦起电实质是电子转移，不创造电荷。失去电子带正电，得到电子带负电；同种电荷排斥、异种吸引，带电体还可吸引不带电轻小物体。因此相互吸引不能单独证明两物体带异种电荷，排斥才可支持两者带同种电荷。验电器金属箔张开源于同种电荷排斥，不能只凭张角判正负电荷。<\/p><\/section>","拓展","初中主线；公式含拓展"],["particle-04","探索更小的微粒","物质还可继续分为原子、原子核和更小的粒子，原子并非不可再分。",[["原子与原子核的代表尺度比","<mrow><msub><mi>d<\/mi><mi mathvariant=\"normal\">原子<\/mi><\/msub><mo>=<\/mo><mrow><mn>100000<\/mn>&#x2062;<msub><mi>d<\/mi><mi mathvariant=\"normal\">核<\/mi><\/msub><\/mrow><\/mrow>","拓展计算，非本卡初中必背主线。仅比较典型数量级，原子尺度约 10⁻¹⁰ m、原子核约 10⁻¹⁵ m；不是精确适用于每种原子的尺寸定律。"],["由代表原子尺度反推原子核尺度","<mrow><msub><mi>d<\/mi><mi mathvariant=\"normal\">核<\/mi><\/msub><mo>=<\/mo><mfrac><msub><mi>d<\/mi><mi mathvariant=\"normal\">原子<\/mi><\/msub><mn>100000<\/mn><\/mfrac><\/mrow>","拓展计算，非本卡初中必背主线。沿用原子约为原子核 10⁵ 倍的数量级估计。"]],[["d<sub>原子<\/sub>","原子直径的代表尺度","nm"],["d<sub>核<\/sub>","原子核直径的代表尺度","nm"]],[["把原子与原子核的尺度差误写成 10 倍。","典型尺度约差五个数量级；原子核约 10⁻¹⁵ m，原子约 10⁻¹⁰ m。"],["认为原子是不可再分的最小粒子。","原子由原子核和核外电子构成，原子核还具有更细的内部结构；科学认识随证据发展。"]],"从分子到原子、原子核和更小粒子的认识来自实验与模型不断发展。用代表尺度比较可看出原子核远小于原子，但这些数值是数量级估计，不是每种原子都完全相同的精确尺寸。不能把科学模型误读成肉眼可见的实体图，也不能把“更小”误认为质量和结构相同。",["选取原子和原子核的代表性直径数量级，分别约为 10⁻¹⁰ m 和 10⁻¹⁵ m。","两尺度相除得到约 10⁵ 的数量级差别。","该比值用作尺度比较，不应误称为对所有原子都精确不变的常数。"],["按原子直径约 10⁻¹⁰ m、原子核直径约 10⁻¹⁵ m 估算，二者尺度相差多少倍？",["计算尺度比 10⁻¹⁰÷10⁻¹⁵。","指数相减得到 10⁵。"],"原子直径约为原子核的 10⁵ 倍。"],["particle-01"],["particle-05"],["原子","原子核","更小微粒","尺度","数量级","拓展"],9,"<section class=\"field learning\"><h4>更小的微粒<\/h4><p>原子由带正电的原子核和带负电的核外电子组成，原子核含质子和中子，质子带正电，中子不带电。通常中性原子正负电荷总量相等。原子核远小于原子，结构图多为示意，不按尺寸比例；微观认识来自实验和模型，不能只凭画图认定真实轨道。<\/p><\/section>","拓展","初中主线；公式含拓展"],["particle-05","日心说与太阳系","日心说以太阳为太阳系中心，解释地球和其他行星绕太阳运行的观测现象。",[["圆轨道近似下的平均轨道速度","<mrow><mi>v<\/mi><mo>=<\/mo><mfrac><mrow><mrow><mn>2<\/mn>&#x2062;<mi>π<\/mi><\/mrow>&#x22C5;<mi>r<\/mi><\/mrow><mi>T<\/mi><\/mfrac><\/mrow>","拓展计算，非本卡初中必背主线。把行星轨道近似为圆，r 为圆轨道半径、T 为周期；所得为平均轨道速度估算。"],["由圆轨道周长和平均速度求周期","<mrow><mi>T<\/mi><mo>=<\/mo><mfrac><mrow><mrow><mn>2<\/mn>&#x2062;<mi>π<\/mi><\/mrow>&#x22C5;<mi>r<\/mi><\/mrow><mi>v<\/mi><\/mfrac><\/mrow>","拓展计算，非本卡初中必背主线。沿用圆轨道近似，轨道周长为 2·π·r。"]],[["v","行星平均轨道速度","m/s"],["r","近似圆轨道半径","m"],["T","行星绕日运行周期","s"]],[["计算圆轨道周长时误用π乘半径，漏掉系数2。","圆周长是 2·π·r；漏掉因子 2 会把估算轨道速度减半。"],["认为日心说把太阳放在整个宇宙的中心。","日心说讨论太阳系行星绕太阳运行的模型，并不宣称太阳是整个宇宙中心；这与电荷守恒没有关系。"]],"科学模型根据观测证据建立，并会随着新证据修正。把行星轨道近似为圆时，可用轨道周长除以周期估算平均轨道速度；该简化公式不等于精确轨道理论，也不单独证明日心说。比较地心、日心模型时要区分模型解释力与历史结论。",["圆轨道一周的路径长度为 2·π·r。","平均速度等于一周路程除以周期，得到 v=2·π·r/T。","真实行星轨道为椭圆，圆轨道公式仅用于简化的数量级估算。"],["把地球轨道近似成半径 1.50×10¹¹ m 的圆，周期取 3.16×10⁷ s，估算平均轨道速度。",["圆轨道周长约为 2·π·r。","v=2·π·r/T≈3.0×10⁴ m/s。"],"约为 3.0×10⁴ m/s。"],[],["particle-02"],["日心说","太阳系","行星轨道","模型","拓展"],9,"<section class=\"field learning\"><h4>日心说与太阳系<\/h4><p>太阳系以太阳为中心天体，八大行星按离太阳由近到远为水、金、地、火、木、土、天王、海王星。卫星围绕行星运行，月球是地球的天然卫星；太阳是恒星。日心模型讨论太阳系，不把太阳放在整个宇宙中心。行星轨道一般是椭圆，圆周速度计算只是简化估算。<\/p><\/section>","拓展","初中主线；公式含拓展"],["particle-02","宇宙探秘","宇宙包含恒星、行星、星系等不同尺度的天体系统，观测遥远天体时接收到的是它们过去发出的光。",[["光在给定时间内传播的距离","<mrow><mi>s<\/mi><mo>=<\/mo><mrow><mi>c<\/mi>&#x22C5;<mi>t<\/mi><\/mrow><\/mrow>","拓展计算，非本卡初中必背主线。光速近似取 3.0×10⁸ m/s，时间 t 用秒；一年按 365 d 估算。"],["由光程和光速求传播时间","<mrow><mi>t<\/mi><mo>=<\/mo><mfrac><mi>s<\/mi><mi>c<\/mi><\/mfrac><\/mrow>","拓展计算，非本卡初中必背主线。距离 s 与真空光速 c 采用相同的光传播路径。"]],[["s","光在给定时间内传播的距离","m"],["c","真空中的光速近似值","m/s"],["t","光传播时间，以秒计","s"],["d<sub>m<\/sub>","以米表示的微观长度","m"],["d<sub>nm<\/sub>","同一长度以纳米表示","nm"]],[["把光速 300 000 km/s 的数值直接当作 m/s 使用。","300 000 是 km/s；换成 m/s 应为 300 000 000。直接使用会少算 1000 倍。"],["将光年当成时间单位，而不是光在一年内走过的距离。","“一年”是定义中采用的传播时间，“光年”最终表示一段距离；量纲为长度。"]],"比较天体距离时，先分清“光走了多久”和“走过多远”。光速可近似取 3.0×10⁸ m/s；以年为时间单位时要换算秒数，再将光程表示为米或光年。宇宙结构和观测证据要结合模型理解，不能把日心说与宇宙起源问题混为一谈。",["光年是长度单位，定义为光在一年内传播的距离。","一年按 365 d 换算为 31 536 000 s。","用光速乘以秒数，得到一光年约 9.46×10¹⁵ m。"],["按一年 365 d、光速 3.0×10⁸ m/s 估算一光年。",["一年为 365×24×3600=31 536 000 s。","s=ct=3.0×10⁸×31 536 000≈9.46×10¹⁵ m。"],"一光年约为 9.46×10¹⁵ m。"],["particle-01","light-01"],[],["宇宙","恒星","星系","光年","光速"],9,"<section class=\"field learning\"><h4>宇宙探秘<\/h4><p>太阳系属于银河系，银河系只是宇宙中的一个星系；恒星、行星、星系不是同一级概念。光年是距离单位，观测远方接收的是过去发出的光。宇宙模型依靠观测修正；红移等现象不能靠本卡一条光程式完整解释，不能把估算当宇宙起源证明。<\/p><\/section>","基础","初中主线；公式含拓展"],["machine-01","杠杆","杠杆是在力的作用下绕固定点转动的硬棒。",[["杠杆平衡条件","<mrow><msub><mi>F<\/mi><mn>1<\/mn><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>F<\/mi><mn>2<\/mn><\/msub>&#x22C5;<msub><mi>l<\/mi><mn>2<\/mn><\/msub><\/mrow><msub><mi>l<\/mi><mn>1<\/mn><\/msub><\/mfrac><\/mrow>","杠杆静止平衡，l<sub>1<\/sub>、l<sub>2<\/sub> 是到支点的垂直力臂。"],["由动力和力臂求平衡阻力","<mrow><msub><mi>F<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>F<\/mi><mn>1<\/mn><\/msub>&#x22C5;<msub><mi>l<\/mi><mn>1<\/mn><\/msub><\/mrow><msub><mi>l<\/mi><mn>2<\/mn><\/msub><\/mfrac><\/mrow>","已知动力、动力臂和非零阻力臂，杠杆处于平衡。"]],[["F<sub>1<\/sub>","动力大小","N"],["l<sub>1<\/sub>","动力臂长度","m"],["F<sub>2<\/sub>","阻力大小","N"],["l<sub>2<\/sub>","阻力臂长度","m"]],[["把杠杆平衡条件写成动力与阻力直接相等。","剪刀情境阻力30 N、阻力臂0.2 m、动力臂0.3 m，平衡动力20 N；直接等同会误得30 N。"],["把杠杆两端到支点的任意距离当成力臂。","力臂是支点到力的作用线的垂直距离；不一定等于杠杆上沿的长度。"]],"杠杆平衡条件可用于分析撬棒、剪刀和天平。先找支点，再确定力的作用线并作垂线段得到力臂；力臂不是支点到作用点的任意距离。改变动力臂或阻力臂会改变平衡所需的力，但不能凭杠杆长短直接判断省力。",["从支点到动力作用线作垂线，得到动力臂 l<sub>1<\/sub>。","从支点到阻力作用线作垂线，得到阻力臂 l<sub>2<\/sub>。","杠杆静止平衡时，两侧力与各自力臂的乘积相等。","根据已知的三个量，可解出第四个量。"],["撬棒阻力为 200 N，阻力臂为 0.1 m，动力臂为 1 m，求杠杆平衡所需动力。",["F<sub>1<\/sub>=F<sub>2<\/sub>·l<sub>2<\/sub>/l<sub>1<\/sub>。","F<sub>1<\/sub>=200×0.1÷1=20 N。"],"动力为 20 N。"],["force-01"],["machine-02"],["杠杆","支点","力臂","杠杆平衡条件"],10,"<section class=\"field learning\"><h4>杠杆分类与应用<\/h4><p>动力臂大于阻力臂的省力杠杆一般费距离；动力臂小于阻力臂的费力杠杆一般省距离；等臂杠杆不省力也不费力。撬棒、剪刀、筷子等须根据实际支点与力的作用线判断，不能按物品名称固定分类。用力方向改变会改变力臂，不只看杠杆几何长度。<\/p><\/section><section class=\"field learning\"><h4>跨学科实践（原创任务）<\/h4><p>设计简易夹具：标出支点、动力作用线、阻力作用线及力臂，在同一负载下比较不同握持位置的力和手移动距离。结合结构设计解释省力与费距离，不将任意一把剪刀永久归入某类杠杆。<\/p><\/section><section class=\"field learning\"><h4>本章素养回顾（原创任务）<\/h4><p>选择本章一个现象，写出结论、成立条件和证据；用另一条本章规律复核解释是否矛盾。指出一次测量或模型的局限，并说明还需什么证据；数值通过不替代概念辨析。<\/p><\/section><details class=\"learning\"><summary>实验：探究杠杆的平衡条件<\/summary><p><b>目的：<\/b>用多组数据检验两侧力与力臂乘积关系。<\/p><p><b>装置与接法：<\/b>杠杆、支架、钩码、刻度尺。<\/p><p><b>控制、改变与观察：<\/b>改动力和力臂，保持支点，观察静止平衡。<\/p><p><b>步骤：<\/b><\/p><ol><li>空杆调水平平衡以减少自重力矩影响。<\/li><li>两侧挂钩码，改位置使水平静止，测力和垂直力臂。<\/li><li>至少取多组不同组合，分别算两侧乘积并比较。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：2 N×0.15 m=3 N×0.10 m=0.30 N·m；1 N×0.20 m=2 N×0.10 m。<\/p><p><b>结论与条件：<\/b>水平、力垂直杆时可由刻度读力臂；一般情况须量作用线到支点垂距。<\/p><p><b>误差与边界：<\/b>支点摩擦、自重未平衡、把杆长当力臂影响结论；不能只取一组等臂数据证明所有杠杆。<\/p><\/details>","基础","初中"],["machine-04","滑轮","定滑轮主要改变用力方向，理想情况下不省力；动滑轮可省力但需要拉动更长距离。",[["理想动滑轮的拉力关系","<mrow><msub><mi>F<\/mi><mi mathvariant=\"normal\">拉<\/mi><\/msub><mo>=<\/mo><mfrac><msub><mi>G<\/mi><mi mathvariant=\"normal\">物<\/mi><\/msub><mn>2<\/mn><\/mfrac><\/mrow>","单个理想动滑轮匀速提升重物，忽略滑轮自重、绳重和摩擦。"],["理想动滑轮的距离关系","<mrow><msub><mi>s<\/mi><mi mathvariant=\"normal\">拉<\/mi><\/msub><mo>=<\/mo><mrow><mn>2<\/mn>&#x2062;<msub><mi>h<\/mi><mi mathvariant=\"normal\">物<\/mi><\/msub><\/mrow><\/mrow>","理想单动滑轮由两段绳承担重物，忽略绳伸长和摩擦。"]],[["F<sub>拉<\/sub>","拉绳所需的拉力","N"],["G<sub>物<\/sub>","被提升物体所受重力","N"],["s<sub>拉<\/sub>","自由端绳子移动的距离","m"],["h<sub>物<\/sub>","重物上升的高度","m"],["W<sub>入<\/sub>","输入的功","J"],["W<sub>出<\/sub>","提升重物所做的有用功","J"]],[["使用理想动滑轮时只考虑省力，忘记拉绳距离也增加。","单动滑轮由两段绳承担重物，重物上升 1 m 时拉绳端约需移动 2 m。"],["认为实际滑轮组一定能省功。","实际装置有摩擦和自身质量，输入功通常大于有用功；机械可以省力但不能省功。"]],"分析滑轮时先数承担动滑轮和重物的绳段，再判断每段绳的拉力与物体重力的关系。理想动滑轮省一半力时，拉绳距离约为重物上升高度的两倍，输入功与输出功相等；实际装置因摩擦等损耗，总输入功大于有用功。",["先判断使用定滑轮、动滑轮还是滑轮组，画出承重绳段。","理想动滑轮中两段绳平均承担重物重力，所以拉力约为重力的一半。","省力伴随距离增加；比较拉力乘绳端路程与重力乘重物上升高度，理想情况下两者相等。"],["用理想动滑轮提升 200 N 重物 0.5 m，求拉力和拉绳距离。",["理想单动滑轮由两段绳承重，拉力约为 200÷2=100 N。","拉绳距离约为 2×0.5=1.0 m。","输入功为 100×1.0=100 J，等于重物增加的有用功 200×0.5=100 J。"],"拉力约 100 N，拉绳距离约 1.0 m。"],["machine-01"],["machine-02"],["滑轮","定滑轮","动滑轮","滑轮组","机械效率"],10,"<section class=\"field learning\"><h4>定滑轮、动滑轮和滑轮组<\/h4><p>理想定滑轮改变用力方向，不省力；理想动滑轮两段竖直绳承担负载，可省一半力而绳端移动两倍距离。滑轮组先数连接动滑轮组件的承重绳段，不能数画面所有绳。考虑动滑轮重力、摩擦及绳倾斜时应调整模型；机械可以省力，但理想情况下也不省功。<\/p><\/section>","基础","初中"],["machine-02","功","功描述力对物体做功的过程。",[["力和沿力方向距离求功","<mrow><mi>W<\/mi><mo>=<\/mo><mrow><mi>F<\/mi>&#x22C5;<mi>s<\/mi><\/mrow><\/mrow>","力与位移同方向，F 用 N、s 用 m。"]],[["F","沿运动方向的作用力","N"],["s","物体沿力方向通过的距离","m"],["W","力所做的功","J"],["t","做功所用时间","s"],["P","功率","W"]],[["位移已换算为 m 后，又按 cm 单位额外缩小 100 倍。","抬起物体的位移已按 4 m 代入，不能再除以 100；否则 200 J 会被算成 2 J。"],["把功写成力除以移动距离。","功等于力与沿力方向位移的乘积，不是除法；单位由 N×m 得到 J，位移方向与力垂直时该力不做功。"],["物体受力但没有沿力方向移动，仍认为该力做了功。","做功要求力对物体产生沿力方向的位移；只有力却没有相应位移，或物体运动方向与力垂直，都不能据此认为该力做了功。"]],"计算功时必须同时有力和沿力方向的位移：物体虽移动但力没有沿位移方向的分量时，不能直接用 W=Fs。力用 N、距离用 m，功的单位是 J。",["确认作用力是否使物体沿力的方向移动。","若力和位移同向，用 W=F·s 求功。","记录完成这段功所用的时间。","用 P=W/t 比较做功快慢。"],["用 100 N 的水平力拉木箱移动 2 m，历时 5 s，求功和功率。",["W=Fs=100×2=200 J。","P=W/t=200/5=40 W。"],"做功 200 J，功率 40 W。"],["motion-01"],["machine-03"],["功","力","位移","焦耳"],10,"<section class=\"field learning\"><h4>做功的两个条件<\/h4><p>既有力作用，又有沿该力方向的位移，才可判断该力做功。搬箱静止不做机械功；提箱水平匀速走，竖直提力不做功；放手后靠惯性滑行，已经撤去的手推力不继续做功。初中同向恒力情形用功等于力乘距离，不把位移任意方向混进去。<\/p><\/section>","基础","初中"],["machine-05","功率","功率表示做功的快慢，等于一段过程中所做的功与所用时间之比。",[["由功和时间求功率","<mrow><mi>P<\/mi><mo>=<\/mo><mfrac><mi>W<\/mi><mi>t<\/mi><\/mfrac><\/mrow>","W 是同一时间段内完成的功，t 大于零；功率单位为 W。"]],[["F","沿运动方向的作用力","N"],["s","物体沿力方向通过的距离","m"],["W","力所做的功","J"],["t","做功所用时间","s"],["P","功率","W"]],[["把功率误算成做功除以两倍时间。","功率是单位时间内完成的功；把时间额外加倍会使结果减半。计算前应写出功、时间和功率各自的物理意义。"],["把功率和总功混为一谈，只比较做功总量。","功率描述做功快慢；相同的功用时不同，功率就不同。计算前应写出功、时间和功率各自的物理意义。"],["物体受力但没有沿力方向移动，仍认为该力做了功。","做功要求力对物体产生沿力方向的位移；只有力却没有相应位移，或物体运动方向与力垂直，都不能据此认为该力做了功。"]],"比较机器做功快慢时要比较功率，而不是只看总功。计算时功用 J、时间用 s，功率单位为 W；大型设备也常用 kW。功率是单位时间完成的功，数值并不等于总功；功率换算时 1 kW=1000 W，不能漏写时间单位。",["确定研究的做功过程及对应时间间隔 t。","用功除以完成该功所用的时间，得到平均功率 P=W/t。","把功统一为 J、时间统一为 s，功率结果即为 W。"],["机器在 5 s 内完成 200 J 的功，求平均功率。",["使用 P=W/t。","P=200/5=40 W。"],"平均功率为 40 W。"],["machine-02"],["machine-03"],["功率","做功快慢","功","时间","瓦特"],10,"<section class=\"field learning\"><h4>功率<\/h4><p>功率表示做功快慢，功表示做功总量；同样功用时短者功率大，同样时间做功多者功率大。1 kW=1000 W，1 W=1 J/s。举起物体可由质量、提升高度、用时估算提升功率，比较时先控制任务和条件，不能只凭“更重”或“更快”判断。<\/p><\/section>","基础","初中"],["machine-03","机械效率","机械效率表示有用功占总输入功的比例，等于有用功与总功之比。",[["有用功与总功求机械效率","<mrow><mi>η<\/mi><mo>=<\/mo><mfrac><msub><mi>W<\/mi><mi mathvariant=\"normal\">有用<\/mi><\/msub><msub><mi>W<\/mi><mi mathvariant=\"normal\">入<\/mi><\/msub><\/mfrac><\/mrow>","有用功不大于总功；机械效率用小数表示时乘 100% 可换为百分数。"],["由效率和总功求有用功","<mrow><msub><mi>W<\/mi><mi mathvariant=\"normal\">有用<\/mi><\/msub><mo>=<\/mo><mrow><mi>η<\/mi>&#x22C5;<msub><mi>W<\/mi><mi mathvariant=\"normal\">入<\/mi><\/msub><\/mrow><\/mrow>","η 用 0 到 1 之间的小数表示。"]],[["W<sub>有用<\/sub>","完成任务的有用功","J"],["W<sub>入<\/sub>","输入机械的总功","J"],["η","机械效率，以小数表示","1"]],[["把总功除以有用功当作机械效率。","效率应为有用功占输入总功的比例；提升重物情境中正确值 0.8，反过来会得到 1.25。"],["认为机械效率可以大于 100%，或把效率与功率混为一谈。","实际机械有能量损失，有用功不能超过输入总功；功率是功与时间之比，与效率概念不同。"]],"使用滑轮或斜面时，先判断对目标有帮助的功是有用功，其余输入功构成总功。效率提高表示损失比例降低，并不意味着输入功一定减少或机械一定省力。计算前要让有用功和总功采用相同单位；效率不能写成超过 100% 的数值。",["分清有用功和输入的总功。","用有用功除以总功得到效率小数。","将小数乘 100% 可换为百分数。","实际摩擦和其他损耗使有用功小于输入总功。"],["滑轮组输入总功 200 J，提升重物的有用功为 150 J，求机械效率。",["η=150/200=0.75。","换成百分数为 75%。"],"机械效率为 75%。"],["machine-02"],[],["机械效率","有用功","总功","能量损失"],10,"<section class=\"field learning\"><h4>机械效率<\/h4><p>机械效率为有用功与总功之比，总功包括有用功和额外功，效率无单位，常用百分数表示。它和功率无直接等同关系，高功率不保证高效率；增大合理负载、减小摩擦或机械自重可改善特定装置效率。理想机械效率可取100%，实际有损耗通常小于100%；不能省功。<\/p><\/section><details class=\"learning\"><summary>实验：测量滑轮组机械效率<\/summary><p><b>目的：<\/b>比较有用功、总功和额外功。<\/p><p><b>装置与接法：<\/b>滑轮组、钩码、测力计、刻度尺。<\/p><p><b>控制、改变与观察：<\/b>近似匀速竖直提升，记录重力、高度、拉力和绳端距离。<\/p><p><b>步骤：<\/b><\/p><ol><li>测负载重力，标记负载和绳端起点。<\/li><li>匀速拉动，记录拉力以及两处位移。<\/li><li>用重力乘高度求有用功，拉力乘绳端距离求总功，再求比值。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：10 N提升0.20 m有用功2 J；6 N拉绳0.40 m总功2.4 J，效率约83.3%。<\/p><p><b>结论与条件：<\/b>省力不省功，总功不小于有用功，效率约束与能量账目一致。<\/p><p><b>误差与边界：<\/b>拉力波动、滑轮摩擦、量错绳端距离影响结果；不把承重绳段数倒数当实际效率。<\/p><\/details>","基础","初中"],["energy-01","机械能","动能是物体因运动具有的能量，势能包括重力势能和弹性势能；动能与势能统称机械能。",[["物体动能","<mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">k<\/mi><\/msub><mo>=<\/mo><mrow><mrow><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac>⁢<mi>m<\/mi><\/mrow>⋅<msup><mi>v<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mrow>","拓展计算，非本卡初中必背主线。适用于物体平动的动能计算，m 用 kg、v 用 m/s。"],["物体重力势能","<mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">p<\/mi><\/msub><mo>=<\/mo><mrow><mrow><mi>m<\/mi>&#x22C5;<mi>g<\/mi><\/mrow>&#x22C5;<mi>h<\/mi><\/mrow><\/mrow>","拓展计算，非本卡初中必背主线。h 从选定参考面竖直量起，g 取当地值。"],["动能与各类势能组成机械能","<mrow><mi mathvariant=\"normal\">Em<\/mi><mo>=<\/mo><mrow><mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">k<\/mi><\/msub><mo>+<\/mo><msub><mi>E<\/mi><mi mathvariant=\"normal\">p<\/mi><\/msub><\/mrow><mo>+<\/mo><mi mathvariant=\"normal\">Ee<\/mi><\/mrow><\/mrow>","机械能账目包含动能、重力势能和弹性势能；参考面一致，其他机械储能另计。"],["由速度和高度直接求机械能","<mrow><mi mathvariant=\"normal\">Em<\/mi><mo>=<\/mo><mrow><mrow><mrow><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac>⁢<mi>m<\/mi><\/mrow>⋅<msup><mi>v<\/mi><mn>2<\/mn><\/msup><\/mrow><mo>+<\/mo><mrow><mrow
