><mi>m<\/mi>⋅<mi>g<\/mi><\/mrow>⋅<mi>h<\/mi><\/mrow><\/mrow><\/mrow>","拓展计算，非本卡初中必背主线。同一物体相对同一参考面计重力势能，机械能只包含动能和重力势能。"]],[["m","物体质量","kg"],["v","物体速度大小","m/s"],["E<sub>k<\/sub>","物体动能","J"],["g","当地重力加速度","N/kg"],["h","相对选定参考面的高度","m"],["E<sub>p<\/sub>","物体重力势能","J"],["Em","动能、重力势能与弹性势能的总和","J"],["Q","物体吸收的热量","J"],["c<sub>h<\/sub>","物质比热容","J/kg/℃"],["dT","物体升高的温度","℃"],["Ee","弹性势能，本卡只用已知储能作账目","J"]],[["写动能公式时漏掉系数二分之一，只保留质量乘速度平方。","高处小球的动能为 0.5×2×3²=9 J；漏掉二分之一会得到 18 J，量纲仍正确但数值翻倍。"],["把动能写成质量与速度的一次方相乘，漏掉速度平方和二分之一。","动能的单位应为 J，m·v 的单位是 kg·m/s；量纲与数值关系都不符。"],["认为物体高度变化时重力势能与参考面无关。","重力势能数值依赖所选零势能参考面；比较同一过程能量变化时要保持参考面一致。"]],"质量相同时速度越大，动能越大；速度相同时质量越大，动能越大。相对同一参考面，质量相同时高度越高，重力势能越大；高度相同时质量越大，重力势能越大。同一弹性物体在弹性限度内，形变量越大，弹性势能一般越大。机械能可在不同形式间转化，有摩擦等耗散时机械能可能减少，但总能量不消失。",["物体运动时具有动能，计算时使用质量和速度。","相对参考面被举高的物体具有重力势能，计算时使用质量、g 和高度。","把动能与重力势能相加，得到该参考面下的机械能。","分析能量转化时，检查摩擦等因素是否使机械能转化为内能。"],["用同一小车从同一斜面不同高度静止释放，撞击同一木块。高处释放时木块被推得更远。解释能量变化，再说明怎样比较质量对动能的影响。",["高处释放的小车初始重力势能更大，下滑时部分转成动能，撞击后对木块做功，推动距离可作为比较证据。","研究质量时应改变小车质量、保持撞击前速度相同并保持木块和水平面相同；不能同时任意改变质量和速度。"],"能量可由重力势能转为动能再转移；质量比较须控制速度相同。"],["motion-01","force-01"],["energy-02"],["机械能","动能","重力势能","机械能转化"],11,"<section class=\"field learning\"><h4>初中核心：三种机械能<\/h4><p>运动小车推动木块的距离用于比较动能；从不同高度释放同一物体，或同一高度释放不同质量物体，用做功效果比较重力势能。保持材料相同再比较弹性形变量，以弹簧推动物体的效果比较弹性势能。控制变量和能量转化是主线，不要求推导动能平方公式或弹性势能公式。弹性势能不是重力势能，机械能不能一概只算动能与重力势能。<\/p><\/section><section class=\"field learning\"><h4>机械能转化与拓展边界<\/h4><p>摆球下落时重力势能减小、动能增大，上升时相反；弹簧恢复形变可把弹性势能转为动能。忽略摩擦和其他耗散且系统边界适当时，机械能可守恒。下面数值关系供高中衔接；动能和重力势能公式不当作初中必背，机械能加和若忽略弹性势能必须明确无弹性储能。<\/p><\/section><section class=\"field learning\"><h4>本章素养回顾（原创任务）<\/h4><p>选择本章一个现象，写出结论、成立条件和证据；用另一条本章规律复核解释是否矛盾。指出一次测量或模型的局限，并说明还需什么证据；数值通过不替代概念辨析。<\/p><\/section><details class=\"learning\"><summary>实验：比较动能与重力势能的影响因素<\/summary><p><b>目的：<\/b>用做功效果作间接证据，练习控制变量。<\/p><p><b>装置与接法：<\/b>小车、缓斜面、不同配重、木块、刻度尺。<\/p><p><b>控制、改变与观察：<\/b>动能比较固定质量改变撞击速度，或固定速度改变质量；重力势能比较固定质量改变高度。<\/p><p><b>步骤：<\/b><\/p><ol><li>同车从不同高度释放，记录撞后木块移动距离。<\/li><li>研究质量时通过速度测量等办法保持撞击速度相同，再换配重。<\/li><li>写清间接指标、控制条件和适用范围，再说明能量转化。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：同车较高位置释放推动距离可由5 cm增至9 cm；这些是设计示例，不由距离直接读出多少J。<\/p><p><b>结论与条件：<\/b>动能随质量和速度增大而增大；重力势能随质量和相对高度增大而增大，控制变量后分别判断。<\/p><p><b>误差与边界：<\/b>摩擦差异、撞击方式和速度未控制会混入影响，不能由两组距离推导动能平方系数。<\/p><\/details>","基础","初中主线；公式含拓展"],["energy-03","内能 热传递","物体内部所有分子无规则运动的动能及分子相互作用势能的总和称为内能。",[["绝热热交换中的放热吸热平衡","<mrow><msub><mi>Q<\/mi><mi mathvariant=\"normal\">放<\/mi><\/msub><mo>=<\/mo><msub><mi>Q<\/mi><mi mathvariant=\"normal\">吸<\/mi><\/msub><\/mrow>","把参与热交换的物体作为近似绝热系统，忽略向环境、容器等散失的能量。"]],[["Q<sub>放<\/sub>","高温物体放出的热量大小","J"],["Q<sub>吸<\/sub>","低温物体吸收的热量","J"],["c<sub>h<\/sub>","被加热物质的比热容","J/kg/℃"],["m","被加热物质质量","kg"],["dT","被加热物质的温升","℃"]],[["在忽略散热的热平衡问题中把吸热量误写成放热量的两倍。","封闭近似绝热系统的能量账目应相等；额外乘 2 会破坏热量平衡。"],["认为热量是物体本身储存的一种物质。","热量描述热传递过程中转移的能量；物体具有内能，而不是“含有热量”。"]],"热量是热传递过程中传递的能量，不是物体“含有”的一种物质。忽略与外界的能量交换和散失时，高温物体放出的热量等于低温物体吸收的热量；实际实验需要考虑容器、温度计和环境带走的能量。用水的比热容可估算吸热量，再与热平衡的能量账目核对。",["确定热交换系统边界，并判断是否可近似忽略向环境散热。","记录高温物体放热量和低温物体吸热量的大小。","在近似绝热的系统内，两者大小相等；实际实验可将差值视作热损失与测量误差分析。"],["忽略散热时，一块热金属放出 600 J 热量给水，水吸收多少热量？",["把金属和水作为近似绝热系统。","金属放出的热量等于水吸收的热量。"],"水吸收约 600 J。"],["energy-01"],["energy-02","energy-04"],["内能","热传递","吸热","放热","热平衡"],11,"<section class=\"field learning\"><h4>内能、温度和热量<\/h4><p>内能是物体内大量微观粒子无规则运动的动能及相互作用势能的总和，所有物体都有内能，0℃并不代表没有内能。温度描述冷热，内能还与物体质量、状态等有关，不能只比温度判内能多少。热量是热传递过程中转移的能量，用J；只说“物体内能增大”，不说“物体含有热量”。热传递自发地由高温物体向低温物体发生。<\/p><\/section>","基础","初中"],["energy-02","物质的比热容","比热容表示单位质量的某种物质温度升高或降低 1℃ 时吸收或放出的热量。",[["加热温度变化时的吸热量","<mrow><mi>Q<\/mi><mo>=<\/mo><mrow><mrow><msub><mi>c<\/mi><mi>h<\/mi><\/msub>&#x22C5;<mi>m<\/mi><\/mrow>&#x22C5;<mi mathvariant=\"normal\">dT<\/mi><\/mrow><\/mrow>","无物态变化、比热容近似不变，dT 为温升，单位 ℃。"],["由吸热量求比热容","<mrow><msub><mi>c<\/mi><mi>h<\/mi><\/msub><mo>=<\/mo><mfrac><mi>Q<\/mi><mrow><mi>m<\/mi>&#x22C5;<mi mathvariant=\"normal\">dT<\/mi><\/mrow><\/mfrac><\/mrow>","样品无物态变化，吸收热量 Q、质量 m 和温升 dT 已知。"]],[["Q","物体吸收的热量","J"],["c<sub>h<\/sub>","物质比热容","J/kg/℃"],["m","物体质量","kg"],["dT","物体升高的温度","℃"]],[["把质量0.5 kg写成500，并仍按kg代入。","比热容单位含kg，质量需0.5 kg；用500代入使正确21000 J误大千倍。"],["计算吸热量时漏掉物体质量。","比热容描述单位质量的吸热量，整块物体还要乘质量；半千克水升温 10℃ 吸热 21 000 J。"],["用末温代替温升，并在温度不变或发生物态变化时直接套用本式。","本式需要温度变化量，且适用于比热容近似不变、没有物态变化的过程；相变时需另行分析。"]],"水的比热容约为 4200 J/kg/℃，表示 1 kg 水升高 1℃ 约需吸收 4200 J。用 Q=c<sub>h<\/sub>·m·dT 计算时，先确认过程没有发生物态变化，并把质量、温升和热量单位统一。比热容是物质特性，不等于一整份物体吸收的热量。",["记录被加热物体质量 m 和比热容 c<sub>h<\/sub>。","测量加热前后温度，求温升 dT。","在无物态变化条件下，用 Q=c<sub>h<\/sub>·m·dT 求吸收热量。","实验中还要考虑容器吸热和散热等误差来源。"],["0.5 kg 的水温度升高 10℃，水的比热容取 4200 J/kg/℃，求吸收热量。",["Q=c<sub>h<\/sub>·m·dT。","Q=4200×0.5×10=21 000 J。"],"水吸收 21 000 J 热量。"],["state-01"],[],["比热容","热量","质量","温度变化"],11,"<section class=\"field learning\"><h4>比热容<\/h4><p>比热容描述单位质量物质温度改变1℃时吸收或放出的热量，用J/(kg·℃)表述。比较不同物质时控制质量和吸收热量相同，温升小者比热容大；或控制质量和温升相同，吸热多者比热容大。吸放热算值必须取温差，且没有相变、比热容可近似恒定；沸腾吸热而温度不变不能套温升式求零热量。<\/p><\/section>","基础","初中"],["energy-04","机械能与内能的相互转化","机械能可以转化为内能，内能也可通过做功等过程转化为机械能。",[["机械能减少转化为内能","<mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">机前<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">机后<\/mi><\/msub><mo>+<\/mo><msub><mi>E<\/mi><mi mathvariant=\"normal\">内增<\/mi><\/msub><\/mrow><\/mrow>","把刹车或摩擦过程中的相关物体作为系统，忽略向外界的能量散失。"],["由前后机械能差求内能增量","<mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">内增<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">机前<\/mi><\/msub><mo>−<\/mo><msub><mi>E<\/mi><mi mathvariant=\"normal\">机后<\/mi><\/msub><\/mrow><\/mrow>","机械能减少量全部转化为系统内能，忽略热量散失和其他能量形式。"],["燃料完全燃烧放热","<mrow><mi>Q<\/mi><mo>=<\/mo><mrow><mi>q<\/mi>&#x22C5;<mi>m<\/mi><\/mrow><\/mrow>","按质量定义热值，燃料完全燃烧；q用J/kg、质量用kg。实际利用热量须计效率。"],["热机效率","<mrow><mi>η<\/mi><mo>=<\/mo><mfrac><msub><mi>W<\/mi><mi mathvariant=\"normal\">有用<\/mi><\/msub><mi>Q<\/mi><\/mfrac><\/mrow>","燃料完全燃烧理论放热量为正，有用机械功为对外输出，百分数为该比值乘100%。"],["热机能量账目","<mrow><mi>Q<\/mi><mo>=<\/mo><mrow><msub><mi>W<\/mi><mi mathvariant=\"normal\">有用<\/mi><\/msub><mo>+<\/mo><msub><mi>Q<\/mi><mi mathvariant=\"normal\">损<\/mi><\/msub><\/mrow><\/mrow>","输入输出统计于同一过程，其他能量已包括散热、尾气及其他非有用输出。"]],[["E<sub>机前<\/sub>","转化前机械能","J"],["E<sub>机后<\/sub>","转化后机械能","J"],["E<sub>内增<\/sub>","转化增加的内能","J"],["q","燃料热值，按单位质量定义","J/kg"],["m","完全燃烧的燃料质量","kg"],["Q","燃料完全燃烧理论放热量","J"],["W<sub>有用<\/sub>","热机对外有用机械功","J"],["η","热机效率，取0到1间比值","1"],["Q<sub>损<\/sub>","未成为有用功的其他能量总量","J"]],[["把机械能减少量的符号写反，导致内能减少。","本情境机械能从 100 J 降至 80 J，减少量为 20 J，转化为内能应为正的 20 J。"],["把热机效率写成燃料理论放热量除以有用机械功。","100 kJ有用功、400 kJ输入，效率应为0.25；反比得到4即400%，违反能量账目。"],["认为机械能减少就意味着能量消失。","摩擦可使机械能转化为内能；把系统边界和其他能量形式计入后，能量总量仍守恒。"]],"刹车片发热、双手摩擦后变热，说明机械能可转化为内能；热机中气体膨胀推动活塞，则内能可转化为机械能。只研究机械能时会观察到它减少，但把内能等形式也计入后能量账目仍平衡。分析前先划定系统，确认是否有外界能量输入或散失。",["选定系统并记录转化前机械能和转化后机械能。","若机械能减少全部进入系统内能，则内能增加量等于机械能减少量。","把末态机械能和内能增量相加，与初态机械能核对；有外界散热时应补记散失能量。"],["刹车前汽车机械能为 5000 J，刹车后为 4200 J，忽略向外界散热，求转化增加的内能。",["机械能减少量为 5000-4200=800 J。","忽略散热时，减少的机械能转化为内能。"],"内能增加约 800 J。"],["energy-01","energy-03"],[],["机械能转化","内能","摩擦生热","能量守恒"],11,"<section class=\"field learning\"><h4>热机与四冲程<\/h4><p>热机把内能转为机械能。典型四冲程汽油机：吸气时进气门开、排气门关、活塞下行，吸入空气和燃料混合物；压缩时两门关、活塞上行，机械能转为内能；做功时两门关、燃烧气体推动活塞下行，内能转为机械能；排气时排气门开、进气门关、活塞上行排出废气。一个循环通常曲轴转两周，完成四冲程、对外做功一次；其余冲程借飞轮惯性维持。柴油机吸入空气、压缩后喷油压燃，不采用火花塞点火模型。<\/p><\/section><section class=\"field learning\"><h4>燃料热值与热机效率<\/h4><p>热值表示单位质量燃料完全燃烧放出的热量，单位J/kg；气体燃料也可按体积定义，使用前看单位。热值是燃料特性，不随取样质量改变；完全燃烧放热量等于热值乘燃料质量。热机效率为对外有用机械功占燃料完全燃烧放热量之比；不等于水吸热效率，也不等于机械效率。尾气、散热、摩擦和不完全燃烧等导致有用输出小于理论放热，能量仍守恒。<\/p><\/section>","基础","初中"],["circuit-03","初识家用电器和电路 · 电路连接方式","家用电器把电能转化为光、热、声或机械能；简单电路由电源、用电器、开关和导线组成。",[["串联电路各处电流相等","<mrow><msub><mi>I<\/mi><mn>1<\/mn><\/msub><mo>=<\/mo><msub><mi>I<\/mi><mn>2<\/mn><\/msub><\/mrow>","元件串联且电路稳定工作，各处没有分支。"],["并联干路电流","<mrow><mi mathvariant=\"normal\">It<\/mi><mo>=<\/mo><mrow><msub><mi>I<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>I<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mrow>","干路总电流等于并联各支路电流之和。"]],[["I<sub>1<\/sub>","串联电路第一处电流","A"],["I<sub>平均<\/sub>","单位时间内通过导体横截面的电荷量所对应的电流","A"],["Q","通过导体横截面的电荷量","C"],["t","电荷通过导体横截面的时间","s"],["I<sub>2<\/sub>","串联第二处或并联第二支路的电流","A"],["It","并联电路干路总电流","A"],["U<sub>1<\/sub>","电路第一元件两端电压","V"],["U<sub>2<\/sub>","电路第二元件两端电压","V"],["Ut","电路总电压","V"],["U<sub>读数<\/sub>","电压表读数","V"],["U<sub>量程<\/sub>","电压表所选量程","V"],["n","仪表指针偏转格数","1"],["N","仪表满量程总格数","1"]],[["并联干路电流只算第一支路。","两支路0.20和0.30 A相加为0.50 A，遗漏第二支路只得0.20 A。"],["把并联干路电流误认为两支路电流的乘积。","并联支路汇流时干路电流等于各支路电流之和；0.2 A 和 0.3 A 合为 0.5 A。"],["认为家庭电路中的各用电器都串联，一个坏了全部熄灭。","家庭用电器通常并联接入，支路可独立工作；电路图要结合实际连接辨析。"]],"电路未闭合时通常没有持续电流；分析家用电器连接时可观察各元件是否能独立工作。串联支路的电流处处相等，并联干路电流由各支路电流汇合而成。这里把定性入门与电路连接合并呈现，避免给纯介绍性小节硬编公式。",["识别电源、用电器、开关和导线，判断电路是否闭合。","观察电流路径：首尾相连为串联，接在相同两节点之间为并联。","串联处电流相同；并联干路电流等于各支路电流之和，可与 Q/t 的电流定义交叉检查。"],["两支路电流分别为 0.2 A 和 0.3 A，求并联干路电流。",["识别为并联电路，干路电流等于支路电流之和。","It=0.2+0.3=0.5 A。"],"干路电流为 0.5 A。"],[],["circuit-01"],["家用电器","电路","串联","并联","电流路径"],12,"<section class=\"field learning\"><h4>初识家用电器和电路<\/h4><p>电路通常含电源、用电器、导线和开关。通路可有电流；断路是回路断开；电源短路指电源两端近似直接以导线相连，必须避免。导体和绝缘体由导电能力区分，不是有没有电子；金属导电主要是自由电子定向移动，常规电流方向与电子运动方向相反。把安全低压模型与真实家庭电路分开。<\/p><\/section><section class=\"field learning\"><h4>跨学科实践（原创任务）<\/h4><p>设计低压双灯控制板：先画能独立开关两灯的电路图，再断电连接、检查支路与电源是否短路，最后记录两开关的状态表。结合逻辑表与制作过程评价方案，禁止改装家庭插座或市电设备。<\/p><\/section><section class=\"field learning\"><h4>本章素养回顾（原创任务）<\/h4><p>选择本章一个现象，写出结论、成立条件和证据；用另一条本章规律复核解释是否矛盾。指出一次测量或模型的局限，并说明还需什么证据；数值通过不替代概念辨析。<\/p><\/section>","基础","初中"],["circuit-01","电流和电流表","电流表示电荷定向移动的快慢，等于单位时间内通过导体横截面的电荷量。",[["由电荷量和时间求电流","<mrow><msub><mi>I<\/mi><mi mathvariant=\"normal\">平均<\/mi><\/msub><mo>=<\/mo><mfrac><mi>Q<\/mi><mi>t<\/mi><\/mfrac><\/mrow>","Q 表示一段时间内通过导体横截面的电荷量，t 用秒，所得电流用安培。"],["电流表量程和指针格数求电流","<mrow><msub><mi>I<\/mi><mi mathvariant=\"normal\">读数<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>I<\/mi><mi mathvariant=\"normal\">量程<\/mi><\/msub>&#x22C5;<mi>n<\/mi><\/mrow><mi>N<\/mi><\/mfrac><\/mrow>","指针式电流表按均匀刻度读取；所选量程记作 I量程，n 是偏转格数，N 是满量程格数。"]],[["I<sub>平均<\/sub>","单位时间内通过导体横截面的电荷量所对应的电流","A"],["Q","通过导体横截面的电荷量","C"],["t","电荷通过导体横截面的时间","s"],["I<sub>量程<\/sub>","电流表所选量程","A"],["I<sub>读数<\/sub>","电流表读数","A"],["n","指针偏转格数","1"],["N","满量程总格数","1"],["I<sub>1<\/sub>","串联电路第一处电流","A"],["I<sub>2<\/sub>","串联电路第二处电流","A"],["It","并联干路总电流","A"],["U<sub>1<\/sub>","第一元件两端电压","V"],["U<sub>2<\/sub>","第二元件两端电压","V"],["Ut","电路总电压","V"]],[["把指针占总格数的比例取倒数。","0.6 A量程30格，指针10格应0.2 A；比例倒置会给超过量程的1.8 A。"],["将电流表误并联到电源两端。","电流表内阻很小，直接并联会形成近似短路并损坏仪表或电源。接线前要看清仪表符号和它的接入位置。"],["读电流表时把指针格数当成电流数值，未按量程换算。","量程0.6 A、满量程30格、指针偏10格时应读0.20 A；直接把10格标成10 A不表示实际电流。必须先认量程，再算每格电流和偏转格数。"]],"电流用安培 A 表示。若使用指针式电流表，读数等于所选量程乘以指针格数与满量程格数之比；接入前估计电流并优先选择较大量程，再换到合适量程。电流表内阻很小，不可直接并联在电源两端。\n学习分工：本卡认识电流与电流表读数，接线、量程选择及异常处理见实验卡（jexp-09），可点击下方知识关系回看。这一链接是相关内容推荐，不表示必须先后学习。",["电流定义为单位时间内通过导体横截面的电荷量，得到 I=Q/t。","指针式电流表先读量程，再读偏转格数，按量程与满量程格数比例换算。","检查电流表应串联接入、电流方向正确且不超量程，读数写上 A。"],["电流表量程为 0.6 A，满量程 30 格，指针偏转 15 格，求读数。",["量程对应满量程 30 格。","I=0.6×15/30=0.30 A。"],"电流表读数为 0.30 A。"],[],["circuit-04","jexp-09"],["电流","电流表","电荷量","安培","电流读数"],12,"<section class=\"field learning\"><h4>电流和电流表<\/h4><p>常规电流方向为正电荷定向移动方向；电源外部通路中从正极流向负极。电流表串联进被测支路，正接线柱进、负接线柱出，先选大量程试触，再在确保安全前提下选合适量程。不能把电流表直接跨接电源两端。读数先辨量程、分度值，再数格；1 A=1000 mA。<\/p><\/section><details class=\"learning\"><summary>实验：用电流表测量电流<\/summary><p><b>目的：<\/b>正确接线、选量程与读数。<\/p><p><b>装置与接法：<\/b>低压电源、开关、电阻、合适电流表和导线。<\/p><p><b>控制、改变与观察：<\/b>串入同一被测支路，观察量程和稳定示数。<\/p><p><b>步骤：<\/b><\/p><ol><li>断开开关连接，正进负出串联接入。<\/li><li>先较大量程试触，确认后切合适量程。<\/li><li>闭合记录示数及量程，断开后整理。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：0.6 A量程分30格，偏10格为0.20 A；不能读成10 A。<\/p><p><b>结论与条件：<\/b>电流表测所在支路电流，不直接并接电源。<\/p><p><b>误差与边界：<\/b>量程读错、极性反接、接触不良与额外内阻影响测量。<\/p><\/details><p class=\"learning\"><b>单位换算证据：<\/b>0.3 A = 300 mA。安培转毫安乘1000。<\/p>","基础","初中"],["circuit-04","电压和电压表","电压表示推动电荷定向移动的作用，是形成电流的重要条件。",[["电压表量程和指针格数求电压","<mrow><msub><mi>U<\/mi><mi mathvariant=\"normal\">读数<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>U<\/mi><mi mathvariant=\"normal\">量程<\/mi><\/msub>&#x22C5;<mi>n<\/mi><\/mrow><mi>N<\/mi><\/mfrac><\/mrow>","指针式电压表按均匀刻度读取；n 是指针格数，N 是满量程格数。"]],[["U<sub>读数<\/sub>","电压表读数","V"],["U<sub>量程<\/sub>","电压表所选量程","V"],["n","指针偏转格数","1"],["N","满量程总格数","1"],["U<sub>1<\/sub>","串联第一元件两端电压","V"],["U<sub>2<\/sub>","串联第二元件两端电压","V"]],[["把电压表格数与满量程格数的比例倒过来。","量程 12 V、满量程 30 格偏转 15 格时，正确读数为 6 V；倒置比例会得到 24 V。"],["把电压表误串联接入被测电路。","电压表应并联在被测元件两端；串联接入会显著改变电路状态。接线前要看清仪表符号和它的接入位置。"]],"电压单位为伏特 V。读指针式电压表时，用所选量程乘指针格数与满量程格数之比；测量前先估计电压，避免超量程。电压表内阻较大，不能串联在电路中代替导线。串联元件的总电压等于各元件两端电压之和，可用于校验电压表读数。\n学习分工：本卡认识电压和电压表的读数，跨接对象与改接步骤见实验卡（jexp-10），可点击下方知识关系回看。这一链接是相关内容推荐，不表示必须先后学习。",["将电压表并联接在被测元件两端，正确连接正负接线柱。","读取所选量程和指针格数，按 U=量程×偏转格数/满量程格数换算。","对串联部分可把各元件电压相加，与总电压表读数比较检查。"],["电压表选择 3 V 量程，满量程 30 格，指针偏转 20 格，求读数。",["按比例换算：3×20/30=2 V。","确认读数未超过所选量程，并标注单位。"],"读数为 2 V。"],["circuit-01"],["circuit-02","jexp-10"],["电压","电压表","量程","读数","伏特"],12,"<section class=\"field learning\"><h4>电压和电压表<\/h4><p>电压促使电荷定向移动，电源提供电压；有电压不保证一定有电流，还要有通路。电压表并联在被测元件两端，极性与量程要正确。不能把电压表误接为串联仪表，也不能把它的存在当导线；1 V=1000 mV。局部故障判断须知道仪表接点和理想化条件。<\/p><\/section><details class=\"learning\"><summary>实验：用电压表测量电压<\/summary><p><b>目的：<\/b>在元件两端正确并联测电压。<\/p><p><b>装置与接法：<\/b>低压电路、电压表、开关。<\/p><p><b>控制、改变与观察：<\/b>保持被测元件接点，选择合适量程。<\/p><p><b>步骤：<\/b><\/p><ol><li>断开开关，将电压表正负端并接被测元件两端。<\/li><li>较大量程试触后选择合适档位。<\/li><li>闭合、等示数稳定、注明测量位置与V。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：3 V量程30格偏20格为2.0 V；15 V同格数则10 V。<\/p><p><b>结论与条件：<\/b>必须结合量程和分度值，电压属于明确两点之间。<\/p><p><b>误差与边界：<\/b>把电压表串联、错认端点、量程和正负端均可出错，不按灯的名称猜电压。<\/p><\/details>","基础","初中"],["circuit-02","串、并联电路的特点","串联电路中各处电流相等，总电压等于各用电器两端电压之和；并联电路各支路两端电压相等，干路电流等于各支路电流之和。",[["串联部分总电压","<mrow><mi mathvariant=\"normal\">Ut<\/mi><mo>=<\/mo><mrow><msub><mi>U<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>U<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mrow>","U<sub>1<\/sub>、U<sub>2<\/sub> 是串联部分各元件两端电压，Ut 是它们两端总电压。"],["并联支路两端电压相等","<mrow><msub><mi>U<\/mi><mn>1<\/mn><\/msub><mo>=<\/mo><msub><mi>U<\/mi><mn>2<\/mn><\/msub><\/mrow>","U<sub>1<\/sub>、U<sub>2<\/sub> 分别为并联支路两端电压，理想导线连接同一对节点。"],["并联电路各支路电压复核","<mrow><msub><mi>U<\/mi><mn>1<\/mn><\/msub><mo>=<\/mo><mi mathvariant=\"normal\">Ut<\/mi><\/mrow>","并联支路直接连接在理想导线构成的同一对节点之间。"]],[["Ut","并联电路电源两端电压","V"],["U<sub>1<\/sub>","第一支路两端电压","V"],["U<sub>2<\/sub>","第二支路两端电压","V"],["I<sub>1<\/sub>","串联电路第一处电流","A"],["I<sub>2<\/sub>","第二支路电流","A"],["It","并联干路总电流","A"],["I<sub>平均<\/sub>","单位时间内通过导体横截面的电荷量所对应的电流","A"],["Q","通过导体横截面的电荷量","C"],["t","电荷通过导体横截面的时间","s"],["I<sub>量程<\/sub>","电流表所选量程","A"],["I<sub>读数<\/sub>","电流表读数","A"],["n","电压表偏转格数","1"],["N","电压表满量程格数","1"],["U<sub>读数<\/sub>","电压表读数","V"],["U<sub>量程<\/sub>","电压表量程","V"]],[["串联总电压遗漏第二元件。","串联总电压2+4=6 V，不能仅取第一元件的2 V；并联同节点电压相等。"],["误以为并联电路各支路电流一定相等。","并联支路电压相等，但支路电流还取决于各支路元件的电阻和电路条件。"]],"先根据电路图判断元件是首尾相连还是接在同一对节点上，再使用对应规律。串联电压要分配到各元件上，并联支路电压相同而电流会分流；不可把串联与并联规律互换。电流表串联测流，电压表并联测压。",["画出并联电路，确认各支路的两端连接在同一对节点。","电源两端电压对应每条支路两端，故各支路电压相等。","在节点处电流分流或汇合，干路电流等于各支路电流之和。"],["两个支路并联，电流分别为 0.2 A 和 0.3 A，求干路电流。",["并联干路电流等于各支路电流之和。","It=0.2+0.3=0.5 A。"],"干路电流为 0.5 A。"],["circuit-03","circuit-01","circuit-04"],[],["串联电路","并联电路","电流规律","电压规律","电路特点"],12,"<section class=\"field learning\"><h4>串并联连接与特点<\/h4><p>串联元件依次连接、只有一条电流路径，电流处处相等，总电压等于各段电压之和；并联有分流与汇流点，支路电压等于电源两端电压，干路电流等于各支路之和。串联各段电压不必相等，并联各支路电流不必相等。开关位置决定控制整路还是支路，不根据画线形状判断。<\/p><\/section><details class=\"learning\"><summary>实验：探究串并联电路电流、电压特点<\/summary><p><b>目的：<\/b>用多个测点、多种负载验证连接规律。<\/p><p><b>装置与接法：<\/b>低压电源、不同灯泡或电阻、开关、电流表、电压表。<\/p><p><b>控制、改变与观察：<\/b>保持电源条件，按测点改仪表位置，换负载复核。<\/p><p><b>步骤：<\/b><\/p><ol><li>断电连串联电路，分别测各处电流和各段电压。<\/li><li>断电改并联，测干路与支路电流、各支路电压。<\/li><li>换不相同负载重复，避免“恰好相同”导致误判普遍规律。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：串联电流各0.2 A，分压1、2 V总3 V；并联电流0.1、0.2 A总0.3 A，支路各3 V。<\/p><p><b>结论与条件：<\/b>串联电流相等、电压相加；并联电压相等、干路电流相加，支路电流不必相等。<\/p><p><b>误差与边界：<\/b>仪表内阻、供电变化和接触不良会造成偏差；每次改接先断电，不用电流表跨电源。<\/p><\/details>","基础","初中"],["ohm-01","电阻","电阻表示导体对电流的阻碍作用，单位为欧姆。",[["由电压和电流求电阻","<mrow><mi>R<\/mi><mo>=<\/mo><mfrac><mi>U<\/mi><mi>I<\/mi><\/mfrac><\/mrow>","导体两端电压 U 和通过电流 I 来自同一测量状态，I 不为零。"]],[["U","导体两端电压","V"],["I","通过导体的电流","A"],["R","导体电阻","Ω"],["Rk","以 kΩ 表示的电阻数值","kΩ"],["R<sub>1<\/sub>","第一只电阻","Ω"],["R<sub>2<\/sub>","第二只电阻","Ω"],["Rs","两电阻串联的总电阻","Ω"],["Rp","两电阻并联的等效电阻","Ω"],["It","通过等效电阻的总电流","A"]],[["把 3 kΩ 的数值 3 直接当成 3 Ω 代入，漏掉千欧到欧姆的 1000 倍换算。","6 V 接在 3 kΩ 电阻上，电流应为 0.002 A；把数值 3 当作 Ω 会错误得到 2 A。"],["把欧姆定律误写成电流等于电阻除以电压。","欧姆定律应当用电压除以电阻来求电流；把电阻除以电压不仅关系倒置，所得量纲也不是安培。"],["不说明条件变化就认为电压改变会使导体电阻按比例改变。","电阻由导体材料、长度、横截面积和温度等因素决定；欧姆定律的 U/I 比值在相同条件下描述电阻。"]],"电阻大小与导体材料、长度、横截面积和温度等因素有关；同一导体不能因为电压或电流变大就说电阻一定改变。测电阻时应使用电压表并联、电流表串联，再用 R=U/I 计算。欧姆定律适用条件要明确，灯丝温度改变时电阻也会改变。",["在温度等条件不变时，通过导体的电流随两端电压增大而增大。","电阻越大，对电流的阻碍作用越明显，电流越小。","综合两种变化关系得到 I=U/R。","由测得的 U 与 I 可变形求 R=U/I。"],["某导体两端电压 6 V，通过电流 2 A，求电阻。",["R=U/I=6/2=3 Ω。","欧姆定律适用于导体条件不变的测量状态。"],"电阻为 3 Ω。"],["circuit-01","circuit-02"],["ohm-02"],["电阻","欧姆","电压","电流","测电阻"],13,"<section class=\"field learning\"><h4>电阻<\/h4><p>电阻表示导体对电流的阻碍作用，单位Ω。同材料、同温度下导线越长一般电阻越大，横截面积越大一般越小；材料和温度也有影响。对同一个温度近似稳定的电阻器，电压改变引起电流改变，并非电阻按电压随意变化。1 kΩ=1000 Ω，1 MΩ=1000000 Ω。灯丝受热时电阻明显变化。<\/p><\/section><section class=\"field learning\"><h4>本章素养回顾（原创任务）<\/h4><p>选择本章一个现象，写出结论、成立条件和证据；用另一条本章规律复核解释是否矛盾。指出一次测量或模型的局限，并说明还需什么证据；数值通过不替代概念辨析。<\/p><\/section><p class=\"learning\"><b>单位换算证据：<\/b>3 kΩ = 3000 Ω。千欧转欧乘1000。<\/p>","基础","初中"],["ohm-03","变阻器","滑动变阻器通过移动滑片改变接入电路的电阻丝长度，从而改变电阻并调节电路电流或用电器两端电压。",[["定值电阻和变阻器串联总电阻","<mrow><mi mathvariant=\"normal\">Rs<\/mi><mo>=<\/mo><mrow><msub><mi>R<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>R<\/mi><mn>2<\/mn><\/msub><\/mrow><\/mrow>","变阻器与定值电阻串联，忽略导线电阻并使用同一欧姆单位。"]],[["R<sub>1<\/sub>","定值电阻阻值","Ω"],["R<sub>2<\/sub>","变阻器接入电路的阻值","Ω"],["Rs","两电阻串联的总阻值","Ω"],["U","串联部分两端电压","V"],["I","串联电路电流","A"],["R","由电压和电流得到的等效电阻","Ω"]],[["串联电路只算变阻器电阻，漏固定电阻。","10 Ω固定电阻与20 Ω变阻器串联，总电阻30 Ω，不能只取20 Ω。"],["把变阻器滑片移动方向与阻值变化关系不看接线柱就固定判断。","阻值变化由实际接入电路的下接线柱和滑片位置共同决定，必须结合电路连接判断。"],["计算定值电阻与变阻器串联总阻值时把二者相乘。","串联总电阻为各电阻之和；10 Ω 和 20 Ω 串联应为 30 Ω。"]],"滑片移动后，接入电路的电阻丝长度改变，阻值随之变化；滑动变阻器通常串联在电路中，用来保护电路或连续调节电流。若它与固定电阻串联，总电阻等于两者相加；滑片方向与阻值增减的关系要根据实际接入的下接线柱判断。",["观察变阻器接入的接线柱，确定滑片到下接线柱之间哪段电阻丝进入电路。","移动滑片会改变接入电阻丝长度，从而调节变阻器的阻值。","与定值电阻串联时，总电阻为两者之和；再用电流表验证滑片移动带来的变化。"],["20 Ω 定值电阻与接入电路的 30 Ω 变阻器串联，求总电阻。",["确认两个电阻串联。","Rs=20+30=50 Ω。"],"总电阻为 50 Ω。"],["ohm-01"],["ohm-04"],["变阻器","滑动变阻器","串联电阻","电阻调节"],13,"<section class=\"field learning\"><h4>滑动变阻器<\/h4><p>通过改变接入电路电阻丝长度改变电阻，串联调节电流。常用一上一下接线柱；两个上柱近似导线、两个下柱接入全长，不具正常滑动调节。通电前调到接入电阻最大以保护电路；判断增减先看实际使用的下接线柱与滑片距离，不背固定左滑右滑口诀。<\/p><\/section>","基础","初中"],["ohm-04","欧姆定律","在温度等条件不变时，通过导体的电流与导体两端电压成正比，与导体电阻成反比，关系式为 I=U/R。",[["欧姆定律求电流","<mrow><mi>I<\/mi><mo>=<\/mo><mfrac><mi>U<\/mi><mi>R<\/mi><\/mfrac><\/mrow>","一段导体温度等条件不变，U 用 V、R 用 Ω。"],["由电压和电流求电阻","<mrow><mi>R<\/mi><mo>=<\/mo><mfrac><mi>U<\/mi><mi>I<\/mi><\/mfrac><\/mrow>","导体两端电压 U 和通过电流 I 来自同一测量状态，I 不为零。"]],[["U","导体两端电压","V"],["I","通过导体的电流","A"],["R","导体电阻","Ω"],["Rk","以 kΩ 表示的电阻数值","kΩ"],["R<sub>1<\/sub>","第一只电阻","Ω"],["R<sub>2<\/sub>","第二只电阻","Ω"],["Rs","两电阻串联的总电阻","Ω"],["Rp","两电阻并联的等效电阻","Ω"],["It","通过等效电阻的总电流","A"]],[["把电阻3 kΩ的数值3直接当Ω代入。","6 V与3000 Ω给0.002 A；将3 kΩ的3直接当Ω会算2 A。"],["把欧姆定律的电流公式误写成电阻除以电压。","同一电阻器两端电压 6 V、电阻 12 Ω 时，电流为 0.5 A，而不是 2 A。"],["认为任何电学元件在任何温度下都保持恒定电阻并严格符合欧姆定律。","灯丝等元件温度变化会影响电阻；使用关系式时要看元件和实验条件。"]],"使用欧姆定律前要确认电路元件和温度条件适用，电压用 V、电流用 A、电阻用 Ω。电阻由导体本身决定，不随同一导体两端电压或通过电流简单改变；电压、电流变化时可用比值检查条件是否保持。",["在温度等条件不变时，通过导体的电流随两端电压增大而增大。","电阻越大，对电流的阻碍作用越明显，电流越小。","综合两种变化关系得到 I=U/R。","由测得的 U 与 I 可变形求 R=U/I。"],["一个电阻器两端电压为 6 V，电阻为 12 Ω，求通过它的电流。",["使用 I=U/R。","I=6/12=0.5 A。"],"电流为 0.5 A。"],["ohm-01"],["ohm-02"],["欧姆定律","电压","电流","电阻"],13,"<section class=\"field learning\"><h4>欧姆定律：条件与实验<\/h4><p>同一导体温度等条件稳定时，电流与两端电压成正比；不同电阻器在相同电压下，电流与电阻成反比。研究电压影响时保持同一电阻器，研究电阻影响时调节变阻器使被测电压恢复相同值。电流、电压、电阻必须属于同一元件和同一时刻；不能拿干路电流除一个支路电压。<\/p><\/section><details class=\"learning\"><summary>实验：探究电流与电压、电阻的关系<\/summary><p><b>目的：<\/b>区分正比和反比的控制条件。<\/p><p><b>装置与接法：<\/b>低压电源、开关、定值电阻组、变阻器、电流表串联、电压表并联。<\/p><p><b>控制、改变与观察：<\/b>第一轮固定电阻改变电压；第二轮改变电阻但调变阻器恢复相同电压。<\/p><p><b>步骤：<\/b><\/p><ol><li>断电接线并把变阻器调到最大接入值。<\/li><li>固定10 Ω，取1、2、3 V，测相应电流画电流—电压图。<\/li><li>换10、15、30 Ω，每次恢复3 V，再记录电流。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：10 Ω对应0.1、0.2、0.3 A；3 V下10、15、30 Ω对应0.3、0.2、0.1 A。<\/p><p><b>结论与条件：<\/b>温度等条件稳定时，同电阻电流与电压成正比；同电压电流与电阻成反比。<\/p><p><b>误差与边界：<\/b>换电阻后不恢复电压则变量不受控；发热改变阻值，避免长时间大电流。<\/p><\/details><figure class=\"learning\"><svg viewBox=\"0 0 450 235\" role=\"img\" aria-label=\"定值电阻电流—电压图\" style=\"width:100%;max-width:560px\"><title>定值电阻电流—电压图<\/title><path d=\"M55 35V185H390\" fill=\"none\" stroke=\"currentColor\"/><polyline points=\"55.00,185.00 163.33,138.33 271.67,91.67 380.00,45.00\" fill=\"none\" stroke=\"#2457d6\" stroke-width=\"2\"/><text x=\"55.0\" y=\"202\">0<\/text><text x=\"163.33333333333331\" y=\"202\">1<\/text><text x=\"271.66666666666663\" y=\"202\">2<\/text><text x=\"380.0\" y=\"202\">3<\/text><text x=\"8\" y=\"189.0\">0<\/text><text x=\"8\" y=\"142.33333333333331\">0.1<\/text><text x=\"8\" y=\"95.66666666666666\">0.2<\/text><text x=\"8\" y=\"49.0\">0.3<\/text><text x=\"280\" y=\"226\">电压 / V<\/text><text x=\"60\" y=\"25\">电流 / A<\/text><\/svg><figcaption>直接读图：2 V对应0.2 A；电流对电压的斜率为0.1 A/V，其倒数为10 Ω。横纵轴交换时斜率含义不同。<\/figcaption><\/figure>","基础","初中"],["ohm-02","欧姆定律的应用","欧姆定律可用于计算电路中的电流、电压和等效电阻。",[["两电阻并联等效电阻","<mrow><mi mathvariant=\"normal\">Rp<\/mi><mo>=<\/mo><mfrac><mn>1<\/mn><mrow><mfrac><mn>1<\/mn><msub><mi>R<\/mi><mn>1<\/mn><\/msub><\/mfrac><mo>+<\/mo><mfrac><mn>1<\/mn><msub><mi>R<\/mi><mn>2<\/mn><\/msub><\/mfrac><\/mrow><\/mfrac><\/mrow>","两个电阻并联，R<sub>1<\/sub>、R<sub>2<\/sub> 均为正值。"],["由总电压和总电流求等效电阻","<mrow><mi mathvariant=\"normal\">Rp<\/mi><mo>=<\/mo><mfrac><mi>U<\/mi><mi mathvariant=\"normal\">It<\/mi><\/mfrac><\/mrow>","U、It 描述整个等效电路，It 不为零。"]],[["R<sub>1<\/sub>","第一只电阻","Ω"],["R<sub>2<\/sub>","第二只电阻","Ω"],["Rs","两电阻串联的总电阻","Ω"],["Rp","两电阻并联的等效电阻","Ω"],["U","等效电阻两端电压","V"],["It","通过等效电阻的总电流","A"],["I","通过导体的电流","A"],["R","导体电阻","Ω"],["Rk","以 kΩ 表示的电阻数值","kΩ"]],[["并联两支路只取第一支路电阻作为总阻值。","6 Ω与3 Ω并联，等效电阻2 Ω，小于任一支路；只取6 Ω遗漏另一通路。"],["并联电阻只把各支路电阻倒数相加，忘记再取倒数。","6 Ω 与 3 Ω 并联的倒数和为 0.5 Ω⁻¹，等效电阻应为其倒数 2 Ω。"],["认为增加并联支路会增大总电阻。","并联增加额外电流通路，等效电阻会减小；串联增加电阻才会使总电阻增大。"]],"分析实际电路时先辨认串联、并联结构，再化简等效电阻并结合总电压求干路电流。支路电压、电流必须对应正确元件；并联电阻不能直接相加。计算前确认电阻值适用，且电路中的总电压和总电流取同一等效部分。",["串联电阻中电流相同，总电压为各电阻电压之和。","结合欧姆定律可得到串联总电阻为各电阻之和。","并联电阻两端电压相同，干路电流为各支路电流之和。","结合欧姆定律得到并联电阻倒数关系，最后对倒数和再取倒数。"],["6 Ω 和 3 Ω 的电阻并联，求等效电阻。",["1/Rp=1/6+1/3=1/2 Ω⁻¹。","Rp=2 Ω。","并联等效电阻小于较小的支路电阻 3 Ω，结果合理。"],"等效电阻为 2 Ω。"],["ohm-01","circuit-02"],[],["欧姆定律应用","等效电阻","串并联电阻","电路计算"],13,"<section class=\"field learning\"><h4>欧姆定律的应用与故障边界<\/h4><p>伏安法用同一元件两端电压除流过电流测电阻。串联等效电阻增大，并联等效电阻小于任一支路电阻。低压模型中某元件被理想导线短接，其两端电压近零，别的串联元件可能电流增大；某处断路时电流近零，但电压表能否有示数取决于它跨接哪里。灯泡温度不同的电阻不宜无条件平均。<\/p><\/section><section class=\"field learning\"><h4>跨学科实践（原创任务）<\/h4><p>设计低压电阻辨识记录：用同一电阻器取三组对应电压和电流，算比值并绘图，标出测量误差和温升边界。结合数据表比较单次读数与多次结果；不能用断路的电流零值直接做除法。<\/p><\/section><details class=\"learning\"><summary>实验：用电流表和电压表测量电阻<\/summary><p><b>目的：<\/b>按同一元件的电流与电压求电阻。<\/p><p><b>装置与接法：<\/b>低压电源、待测定值电阻、开关、变阻器、两表。<\/p><p><b>控制、改变与观察：<\/b>保持同一电阻且温度近似稳定，改变电压，多次测量。<\/p><p><b>步骤：<\/b><\/p><ol><li>断电连成电流表串联、电压表跨待测电阻、变阻器串联。<\/li><li>从最大接入阻值开始调节，记录同一状态的电压和电流。<\/li><li>各次单独求电阻后比较，定值电阻可合理取平均。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：1、2、3 V对应0.1、0.2、0.3 A，每次电阻10 Ω。<\/p><p><b>结论与条件：<\/b>伏安法基于同元件同状态的比值，不测两个不对应示数。<\/p><p><b>误差与边界：<\/b>电压表分流和电流表分压造成系统误差；灯丝温度改变时不同状态阻值不能当同一定值平均。<\/p><\/details>","基础","初中"],["power-01","电能表与电功","电流通过用电器时，电能可以转化为其他形式的能量。",[["电压电流和时间求电功","<mrow><mi mathvariant=\"normal\">We<\/mi><mo>=<\/mo><mrow><mrow><mi>U<\/mi>&#x22C5;<mi>I<\/mi><\/mrow>&#x22C5;<mi>t<\/mi><\/mrow><\/mrow>","U 用 V、I 用 A、t 用 s，算出的电功单位为 J。"],["千瓦时换算为焦耳","<mrow><mi mathvariant=\"normal\">EJ<\/mi><mo>=<\/mo><mrow><mn>3600000<\/mn>&#x2062;<msub><mi>E<\/mi><mi mathvariant=\"normal\">kWh<\/mi><\/msub><\/mrow><\/mrow>","输入电能用 kWh 表示，换算结果用 J 表示。"]],[["U","用电器两端电压","V"],["I","通过用电器的电流","A"],["t","通电时间","s"],["We","电流所做的电功","J"],["E<sub>kWh<\/sub>","以千瓦时表示的电能","kWh"],["EJ","以焦耳表示的同一电能","J"]],[["把 1 kWh 当成 1000 J，而不是 3.6×10⁶ J。","1 kWh=1000 W×3600 s=3 600 000 J；只乘 1000 漏掉小时到秒的换算。"],["把电功写成电压乘电流，不计通电时间。","U·I 的单位是 W，是功率；求一段时间内的电功还要乘 t。"]],"电功的国际单位是焦耳（J），电能表常用千瓦时（kWh）。1 kWh=3.6×10⁶ J。电功公式中的电压、电流和时间必须属于同一用电过程；将小时换算成秒后可求 J，也可直接以 kW 和 h 计算 kWh。",["电功由用电器两端电压、通过的电流和通电时间共同决定。","以 V、A、s 代入，电压乘电流乘时间得到 J。","电能表读数若以 kWh 给出，可用 1 kWh=3.6×10⁶ J 换算为焦耳。"],["一盏 220 V、1 A 的灯连续工作 1 h，求耗电量的 J 和 kWh 表示。",["1 h=3600 s。","We=220×1×3600=792 000 J。","0.22 kWh×3.6×10⁶=792 000 J。"],"耗电量为 792 000 J，即 0.22 kWh。"],["ohm-01"],["power-02"],["电功","电能","电能表","千瓦时","焦耳"],14,"<section class=\"field learning\"><h4>电能表与电功<\/h4><p>电能表前后示数差表示用电量，kW·h即常说的一度电，1 kW·h=3600000 J。若表常数为每千瓦时若干转或脉冲，用计数除以常数得电能；在设备功率稳定、计时明确时可再估功率。电能表不是直接读瞬时电流的仪表，不能把kW和kW·h互换。<\/p><\/section><section class=\"field learning\"><h4>本章素养回顾（原创任务）<\/h4><p>选择本章一个现象，写出结论、成立条件和证据；用另一条本章规律复核解释是否矛盾。指出一次测量或模型的局限，并说明还需什么证据；数值通过不替代概念辨析。<\/p><\/section><p class=\"learning\"><b>单位换算证据：<\/b>1 kW·h = 3600000 J。1000 J/s乘3600 s=3600000 J。<\/p>","基础","初中"],["power-02","电功率","电功率表示电流做功的快慢，等于单位时间内完成的电功。",[["电压与电流求电功率","<mrow><mi>P<\/mi><mo>=<\/mo><mrow><mi>U<\/mi>&#x22C5;<mi>I<\/mi><\/mrow><\/mrow>","U 用 V、I 用 A，所得功率 P 用 W。"],["由电功和时间求功率","<mrow><mi>P<\/mi><mo>=<\/mo><mfrac><mi mathvariant=\"normal\">We<\/mi><mi>t<\/mi><\/mfrac><\/mrow>","We 是时间 t 内完成的电功，t 用 s。"]],[["U","用电器两端电压","V"],["I","通过用电器的电流","A"],["P","电功率","W"],["We","一段时间内完成的电功","J"],["t","完成该电功所用时间","s"],["Q","电阻产生的热量","J"],["R","电阻","Ω"]],[["把以 kW 表示的功率数值直接标成 W，换算时多除以 1000。","220 V×1 A=220 W；若要改写成 kW 才是 0.22 kW，不能把 0.22 标成 W。"],["把功率当作总电能，忽略做功时间。","功率表示做功或用电的快慢，电能表示一段时间内做功的总量；前者单位是 W，后者常用 J 或 kWh，二者不能混淆。"],["把电功率写成 U/I。","电功率可由电压与电流相乘得到；电压除以电流不是瓦特，单位组合也不同，因此不能用它表示功率。"]],"额定功率是用电器在额定电压下工作的功率。实际功率取决于实际电压和电流，不能只看铭牌就断言任意电压下的实际功率。比较功率时要区分功率大小与已经消耗的总电能：持续时间不同，耗电量也不同。",["电功率定义为单位时间内完成的电功，P=We/t。","电功 We=UIt，代入 P=We/t 可得 P=UI。","使用时检查额定与实际条件，并标明功率单位 W。"],["用电器两端电压 220 V，通过电流 0.5 A，求电功率。",["P=UI=220×0.5=110 W。","功率单位为 W，结果表示该用电器每秒转化的电能。"],"电功率为 110 W。"],["power-01"],["power-03"],["额定功率","实际功率","瓦特"],14,"<section class=\"field learning\"><h4>电功率与额定状态<\/h4><p>额定电压是正常工作设计电压，额定功率是在额定电压下的功率，实际功率由实际电压和电流决定。灯泡亮度主要与实际功率有关；相同额定电压下额定功率不同并不表示任何接法都按铭牌发光。不同工作温度下灯丝电阻改变，不能把所有实际状态都当定值电阻。<\/p><\/section><details class=\"learning\"><summary>实验：测量小灯泡电功率<\/summary><p><b>目的：<\/b>在额定及不同实际电压下测功率并比较亮度。<\/p><p><b>装置与接法：<\/b>低压电源、标额定电压小灯泡、两表、变阻器、开关。<\/p><p><b>控制、改变与观察：<\/b>改灯泡两端电压，记录电流和亮度，避免超额定过多。<\/p><p><b>步骤：<\/b><\/p><ol><li>断电连接电流表串联、电压表并联灯两端，变阻器最大值。<\/li><li>缓慢调至额定电压并读电流，计算相乘功率。<\/li><li>在安全的稍低电压下重复，比较实际功率与亮度，不盲目加压。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：额定2.5 V时0.30 A，功率0.75 W；2.0 V时0.26 A，功率0.52 W。<\/p><p><b>结论与条件：<\/b>额定状态功率须由额定电压下的电流计算；灯丝非恒定电阻。<\/p><p><b>误差与边界：<\/b>不同电压功率不应平均成“额定功率”；本项为教材重要实验，不混称22项必做。<\/p><\/details><p class=\"learning\"><b>单位换算证据：<\/b>0.75 kW = 750 W。千瓦转瓦乘1000。<\/p>","基础","初中"],["power-03","电热器 电流的热效应","电流通过导体时会产生热量，电流通过电阻产生的热量与电流的平方、电阻和通电时间有关，这个规律叫焦耳定律。",[["焦耳定律","<mrow><mi>Q<\/mi><mo>=<\/mo><mrow><mrow><msup><mi>I<\/mi><mn>2<\/mn><\/msup>&#x22C5;<mi>R<\/mi><\/mrow>&#x22C5;<mi>t<\/mi><\/mrow><\/mrow>","计算电流通过电阻产生的热量，I 用 A、R 用 Ω、t 用 s。"]],[["Q","电阻产生的热量","J"],["I","通过电阻的电流","A"],["R","电阻","Ω"],["t","通电时间","s"],["U","电阻两端电压","V"],["We","纯电阻电路中的电功","J"],["P","电功率","W"]],[["把2 A换成2000 mA的数值后仍按A代入。","以A表示电流应取2，正确热量200 J；误把mA的数值当A使热量大百万倍。"],["使用焦耳定律时漏掉电流平方，写成 Q=IRt。","十欧电阻中 2 A 电流通过 5 s，焦耳热为 200 J；漏掉平方会得到 100 J。"],["认为电动机等所有用电器的电功都全部变成电热。","非纯电阻用电器还会输出机械能、光能或声能等；必须区分电功与电热。"]],"焦耳热公式 Q=I²Rt 适用于电流通过电阻产生的热量计算。电流增大对发热影响尤其明显，因为电流以平方出现。对电动机等非纯电阻用电器，电能还会转化为机械能等形式，不能简单认为电功全部等于电热。",["电流通过电阻时将部分电能转化为内能。","实验表明电流增大时发热明显增强，关系中出现电流平方。","综合电流、电阻和通电时间得到 Q=I²Rt。","对纯电阻有 U=IR，因此 UIt 与 I²Rt 相等。"],["10 Ω 电阻通过 2 A 电流 5 s，求产生的热量。",["Q=I²Rt=2²×10×5=200 J。","若为纯电阻，电功也为 200 J。"],"产生 200 J 热量。"],["ohm-01","power-01"],[],["焦耳定律","电热","纯电阻","电能转化"],14,"<section class=\"field learning\"><h4>电热器与焦耳定律<\/h4><p>电热器利用电流热效应；焦耳热与电流平方、电阻、通电时间相关。串联同电流同时间可比较电阻影响；同电阻同时间可比较电流影响。纯电阻电热器可近似把电功等同电热；电动机还输出机械能，不能把全部电能都算成电热。保险丝利用过大电流产生热量使其熔断，不用铜铁丝替代。<\/p><\/section>","基础","初中"],["power-04","家庭电路与安全用电","家庭电路中的用电器通常并联接入，额定电压约为 220 V。",[["由家庭电器总功率估算干路电流","<mrow><msub><mi>I<\/mi><mi mathvariant=\"normal\">总<\/mi><\/msub><mo>=<\/mo><mfrac><msub><mi>P<\/mi><mi mathvariant=\"normal\">总<\/mi><\/msub><mi>U<\/mi><\/mfrac><\/mrow>","家庭用电器并联且电压近似相同；同时工作的总功率记作 P总，U 为电源电压。"]],[["P<sub>总<\/sub>","同时工作的用电器总功率","W"],["U","家庭电路电压","V"],["I<sub>总<\/sub>","家庭电路干路电流估算值","A"],["I","由电功率关系对应的电流","A"]],[["估算家庭电路电流时把总功率除以两倍电压。","功率关系为 P=UI，故 I=P/U；额外除以 2 会把负载电流低估一半。"],["认为保险丝越粗越安全，或在带电状态下更换保险丝。","保险丝规格过大会失去过载保护作用；家庭电路检修需先断电并由合格人员处理。"]],"估算家庭电路电流时，可把并联用电器的总功率除以供电电压。该关系用于判断大功率电器同时工作时的负载大小，不能代替查看插座、导线和断路器的额定参数。安全使用还要避免湿手触电、破损电线和私拉乱接；保险丝不可随意换成更粗规格。",["把同时工作的用电器功率相加，得到总功率 P<sub>总<\/sub>。","使用 P=UI 反求电流，得到 I<sub>总<\/sub>=P<sub>总<\/sub>/U。","将估算电流与线路、插座和保护装置的额定值比较；不能仅凭估算替代安全规范。"],["一台 2.2 kW 电热水器接在 220 V 家庭电路中，估算工作电流。",["先把功率换成瓦：2.2 kW=2200 W。","I=P/U=2200/220=10 A。","再按设备和线路额定参数判断能否安全使用。"],"工作电流约为 10 A。"],["power-02"],[],["家庭电路","过载","额定电流","安全用电","总功率"],14,"<section class=\"field learning\"><h4>家庭电路组成与接地<\/h4><p>家庭电路通常含进户线、电能表、总开关和保护装置、分支开关、用电器与插座。火线与零线间额定电压按教学模型取220 V，各用电器并联；单极开关接火线，熄灯后也须避免用电器内部仍处带电状态。保护接地把可触及金属外壳可靠连接到保护导体，不能当作工作零线；接地、过流保护和漏电保护各有作用，不相互替代。<\/p><\/section><section class=\"field learning\"><h4>测电笔、故障与安全边界<\/h4><p>传统氖管测电笔中，高阻限流与人体对地形成很小电流，接触火线可能发光；使用示意中手接尾部金属帽，不接笔尖等前端金属。它不能完整证明设备断电，更不能取代专业验电。触电、漏电、总功率过大和短路须区分；保护装置动作不能单凭一现象唯一判故障。课堂只用低压模型演示开关位置、并联和故障，不让学生拆修、试触或检修带电家庭电路；现实故障由合格人员处理。<\/p><\/section>","基础","初中"],["magnet-01","磁体、磁场与电流的磁场","磁体周围存在磁场，磁极间会相互作用；磁场方向可用小磁针静止时北极所指方向描述。",[["已知线圈电压求电流","<mrow><mi mathvariant=\"normal\">Ic<\/mi><mo>=<\/mo><mfrac><mi mathvariant=\"normal\">Uc<\/mi><mi mathvariant=\"normal\">Rc<\/mi><\/mfrac><\/mrow>","仅作已知电学或能量数据的应用，不验证本卡定性规律。线圈电阻在测量期间近似不变，Uc 用 V、Rc 用 Ω。"],["由线圈电流求电压","<mrow><mi mathvariant=\"normal\">Uc<\/mi><mo>=<\/mo><mrow><mi mathvariant=\"normal\">Ic<\/mi>&#x22C5;<mi mathvariant=\"normal\">Rc<\/mi><\/mrow><\/mrow>","仅作已知电学或能量数据的应用，不验证本卡定性规律。同一线圈温度等条件稳定，电流和电阻对应一次测量。"]],[["Uc","电磁铁线圈两端电压","V"],["Ic","通过电磁铁线圈的电流","A"],["Rc","线圈电阻","Ω"],["N","线圈匝数，按匝计数","1"],["U<sub>感<\/sub>","感应电路两端已测得的电压","V"],["I<sub>感<\/sub>","闭合回路中的感应电流","A"],["R<sub>回路<\/sub>","感应电路总电阻","Ω"]],[["把线圈电流换算成 mA 后仍把数值标成 A，导致电流大 1000 倍。","4 V÷20 Ω=0.2 A；换成毫安是 200 mA，不能仍写作 200 A。"],["把线圈电流写成电阻除以电压。","已测得线圈两端电压和电阻后，应按欧姆定律用电压除以电阻求电流；反过来相除所得量纲不是安培。"],["只增加电压、同时改变线圈匝数和铁芯，还把磁性变化全归因于电流。","探究一个因素影响时要控制其他变量，避免把多个因素的作用混在一起。"]],"本节把磁体的磁场和电流的磁效应连起来看：磁体或电流都能建立磁场，磁场可对磁针、磁体等产生作用。通电螺线管的磁极方向与电流方向有关；研究电磁铁强弱时要控制铁芯和线圈匝数等条件。线圈电流可以按欧姆定律计算，但电流数值不是磁场强弱的直接刻度。",["将螺线管接入电源后，线圈中有电流并产生磁场。","加入铁芯可增强电磁铁磁性；磁性还会随线圈匝数和电流等因素改变。","若要比较电流影响，控制匝数和铁芯不变，只改变电流。","电流可由线圈端电压和电阻通过欧姆定律求得，磁性强弱仍要实验观察。"],["某电磁铁线圈电阻为 20 Ω，接入 6 V 电源，求线圈电流。",["Ic=Uc/Rc=6/20=0.3 A。","该结果描述线圈电流，不等同于磁场强度。"],"线圈电流为 0.3 A。"],["ohm-01"],["magnet-03"],["磁体","磁极","磁场","磁感线","地磁场","电流的磁效应","电磁铁","控制变量"],15,"<section class=\"field learning\"><h4>磁体与磁场<\/h4><p>磁体有南北两极，同名排斥、异名吸引，磁极附近磁性较强。磁场方向规定为该处小磁针静止时N极所指方向；磁体外部磁场线从N极指向S极，内部从S极到N极形成闭合线。磁场线是描述工具，不是实际存在的一根根线；地理北附近大致是地磁南极，不能把两种“北”混为一谈。<\/p><\/section><section class=\"field learning\"><h4>电流磁场与通电螺线管<\/h4><p>奥斯特实验说明通电导线周围有磁场。螺线管外部磁场类似条形磁体；右手四指沿线圈常规电流方向弯曲，拇指所指的一端为N极。先依据接线与绕向判断电流，不能只看电源正极在纸面的左或右。反接电源且绕向不变时磁极互换，外部磁场线仍从N到S；线圈内磁场方向沿S到N。<\/p><\/section><section class=\"field learning\"><h4>电磁铁与继电器应用<\/h4><p>在同一装置、未饱和的比较范围内，电流较大、匝数较多或合适铁芯通常使磁性增强；比较电流时保持匝数和铁芯，比较匝数时保持电流和铁芯。电磁继电器可用小电流控制电磁铁吸动衔铁，改变另一路触点通断；控制电路与被控电路区分。此处为应用补充，未把继电器冒称2024苏科版独立必修小节。<\/p><\/section><section class=\"field learning\"><h4>本章素养回顾（原创任务）<\/h4><p>选择本章一个现象，写出结论、成立条件和证据；用另一条本章规律复核解释是否矛盾。指出一次测量或模型的局限，并说明还需什么证据；数值通过不替代概念辨析。<\/p><\/section><details class=\"learning\"><summary>实验：探究通电螺线管外部磁场方向<\/summary><p><b>目的：<\/b>用小磁针实际方向识别磁极并核对右手规则。<\/p><p><b>装置与接法：<\/b>低压电源、螺线管、小磁针、开关、导线。<\/p><p><b>控制、改变与观察：<\/b>绕向不变，改变电流方向；观察小磁针N极方向。<\/p><p><b>步骤：<\/b><\/p><ol><li>先记录不通电时小磁针方向，辨N极。<\/li><li>短时通电，在两端及外侧布小磁针，记录N极指向与线圈电流绕向。<\/li><li>断电反接电源再观察，把磁极判断与外部N到S方向对应。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：一个接法观察右端外侧磁针N极向右，判右端为螺线管N极；反接后相反。<\/p><p><b>结论与条件：<\/b>用右手四指顺常规电流，拇指指N端；外部磁场从N到S，反接磁极互换。<\/p><p><b>误差与边界：<\/b>绕向画错、磁针太近其他磁体、线圈过热会干扰；电流换算只是配套测量，不能当磁极方向证据。<\/p><\/details><details class=\"learning\"><summary>实验：探究电磁铁磁性强弱<\/summary><p><b>目的：<\/b>控制变量比较电流、匝数及铁芯的作用。<\/p><p><b>装置与接法：<\/b>同规格铁芯、线圈、低压限流电路、小铁件、电流表。<\/p><p><b>控制、改变与观察：<\/b>分别改一个因素，保持其他条件；观察吸起同类铁件数量等指标。<\/p><p><b>步骤：<\/b><\/p><ol><li>同一线圈铁芯下改变电流并记录吸起数量。<\/li><li>更换匝数但恢复相同电流和同种铁芯。<\/li><li>相同电流匝数比较有无铁芯，重复检查。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：0.1、0.2 A同线圈可吸起4、8件是示例趋势，不据此断言任何装置都严格两倍。<\/p><p><b>结论与条件：<\/b>适用范围内电流增大、匝数增加、合适铁芯通常增强磁性。<\/p><p><b>误差与边界：<\/b>铁件形状、剩磁、温升、饱和影响指标；同时改电压匝数铁芯不能独立归因。<\/p><\/details>","基础","初中"],["magnet-03","磁场对电流的作用与电动机","通电导体放在磁场中会受到磁场的作用力；改变电流方向或磁场方向，导体受力方向会改变。",[["匀速提升负载的机械功","<mrow><msub><mi>W<\/mi><mi mathvariant=\"normal\">出<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>F<\/mi><mi mathvariant=\"normal\">出<\/mi><\/msub>&#x22C5;<msub><mi>s<\/mi><mi mathvariant=\"normal\">出<\/mi><\/msub><\/mrow><\/mrow>","仅作已知电学或能量数据的应用，不验证本卡定性规律。负载沿作用力方向移动，力近似恒定；输出的力 用 N、输出端位移 用 m。"],["由输出功和时间求平均功率","<mrow><msub><mi>P<\/mi><mi mathvariant=\"normal\">出<\/mi><\/msub><mo>=<\/mo><mfrac><msub><mi>W<\/mi><mi mathvariant=\"normal\">出<\/mi><\/msub><msub><mi>t<\/mi><mi mathvariant=\"normal\">运行<\/mi><\/msub><\/mfrac><\/mrow>","仅作已知电学或能量数据的应用，不验证本卡定性规律。输出功和工作时间对应同一过程，工作时间 大于 0。"],["由平均功率和时间核对输出功","<mrow><msub><mi>W<\/mi><mi mathvariant=\"normal\">出<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>P<\/mi><mi mathvariant=\"normal\">出<\/mi><\/msub>&#x22C5;<msub><mi>t<\/mi><mi mathvariant=\"normal\">运行<\/mi><\/msub><\/mrow><\/mrow>","仅作已知电学或能量数据的应用，不验证本卡定性规律。平均输出功率在这段时间内近似稳定。"]],[["F<sub>出<\/sub>","电动机对负载所做功对应的平均作用力","N"],["s<sub>出<\/sub>","负载沿力方向移动的距离","m"],["W<sub>出<\/sub>","电动机输出的机械功","J"],["t<sub>运行<\/sub>","电动机工作时间","s"],["P<sub>出<\/sub>","电动机输出的平均机械功率","W"]],[["把重物单次上升3 m误当上升后下降共6 m做提升功。","题目只计匀速提升，功200×3=600 J；未发生的下降路程不能计入本次提升功。"],["只改变电流方向就断定导体受力方向一定不变。","受力方向同时取决于电流方向和磁场方向；只改变其中一个条件时，受力方向会相应反转。"],["把电动机的电输入功率直接当成机械输出功率。","线圈发热、轴承摩擦和空气阻力都会消耗能量，所以电输入功率通常大于机械输出功率。"],["匀速提升 200 N 的重物 3 m 时，把机械功算成 200/3 J。","恒力沿运动方向做功要把力与位移相乘；除以距离既算不出焦耳，数值也与题意不符。"]],"判断通电导体的运动方向时，要同时考虑电流方向和磁场方向，不能只看其中一个。磁场力的大小还受电流、磁场和导体等因素影响，初中阶段主要通过实验辨认方向，不把未学的磁场力定量公式当作必背规律。若电动机带动重物匀速上升，可用已学的功和功率关系估算机械输出；这是机械输出的计算，不是磁场力定律。",["通电导体处于磁场中会受力，改变电流或磁场方向可观察受力方向改变。","电动机让线圈在磁场中持续转动，把电能转化为机械能。","重物匀速提升时，输出机械功可按作用力乘沿力方向的距离计算。","用输出功除以工作时间得到平均机械功率，也可反向用功率和时间核对输出功。"],["电动机匀速提升重 200 N 的物体 3 m，用时 10 s，求机械输出功和平均输出功率。",["W<sub>出<\/sub>=F<sub>出<\/sub>·s<sub>出<\/sub>=200×3=600 J。","P<sub>出<\/sub>=W<sub>出<\/sub>/t<sub>运行<\/sub>=600/10=60 W。"],"机械输出功为 600 J，平均输出功率为 60 W。"],["fmotion-01","machine-02","machine-05"],["magnet-04"],["磁场对电流的作用","电动机","受力方向","电能转化","机械输出功","机械功率"],15,"<section class=\"field learning\"><h4>磁场对电流的作用与电动机<\/h4><p>磁场中的通电导线在适当方向下受力，受力方向与电流方向、磁场方向有关，只反转其中之一受力反转，同时反转两者方向保持。电动机利用这一作用把电能转为机械能；换向器周期性改变线圈电流方向，使转动可持续。导线平行磁场等边界下可能不受磁力，不能只说“有电流就一定动”。<\/p><\/section>","基础","初中"],["magnet-04","安装直流电动机模型","直流电动机模型由磁体、线圈、换向器、电刷和电源等部分组成。",[["已测电压和电流求输入功率","<mrow><msub><mi>P<\/mi><mi mathvariant=\"normal\">入<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>U<\/mi><mi>m<\/mi><\/msub>&#x22C5;<msub><mi>I<\/mi><mi>m<\/mi><\/msub><\/mrow><\/mrow>","仅作已知电学或能量数据的应用，不验证本卡定性规律。电压和电流对应同一时刻的直流测量，输入功率按电压乘电流估算。"],["由输入功率和时间求电输入电能","<mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">入<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>P<\/mi><mi mathvariant=\"normal\">入<\/mi><\/msub>&#x22C5;<msub><mi>t<\/mi><mi>m<\/mi><\/msub><\/mrow><\/mrow>","仅作已知电学或能量数据的应用，不验证本卡定性规律。输入功率在这段通电时间内近似稳定。"],["由电能和时间核对输入功率","<mrow><msub><mi>P<\/mi><mi mathvariant=\"normal\">入<\/mi><\/msub><mo>=<\/mo><mfrac><msub><mi>E<\/mi><mi mathvariant=\"normal\">入<\/mi><\/msub><msub><mi>t<\/mi><mi>m<\/mi><\/msub><\/mfrac><\/mrow>","仅作已知电学或能量数据的应用，不验证本卡定性规律。电能和时间对应同一通电过程，通电时间 大于 0。"]],[["U<sub>m<\/sub>","电动机模型线圈两端电压","V"],["I<sub>m<\/sub>","通过电动机模型线圈的电流","A"],["R<sub>m<\/sub>","线圈电阻","Ω"],["P<sub>入<\/sub>","电动机模型的电输入功率","W"],["E<sub>入<\/sub>","电动机模型在这段时间内的电输入电能","J"],["t<sub>m<\/sub>","电动机模型通电时间","s"]],[["把0.3 A误作0.3 mA换成安培。","6 V乘0.3 A为1.8 W；重复除千导致误算0.0018 W。"],["电刷未接触或线圈卡住时，仍把不转归因于磁场方向错误。","线圈不转可能是断路、接触不良或机械卡滞；应先逐项检查，再调整磁场或电流方向。"],["把电输入功率写成电压除以电流。","电功率等于电压乘电流；电压除以电流得到的是电阻，不能表示输入功率。"],["6 V、0.3 A的模型错误用电压除以电流，标作20 W。","正确输入功率6×0.3=1.8 W；6÷0.3=20的量纲是Ω，不能标为W。"]],"模型安装和调试要逐项检查电路是否闭合、线圈是否卡住、电刷是否接触良好以及磁场是否存在。若已测得线圈端电压和电阻，可用欧姆定律估算电流；电功率可由电压和电流求得，再乘工作时间估算输入电能。电动机的实际机械输出小于输入电能，不可把输入电能全部当成有用功。",["先按模型结构连接电源、电刷和线圈，并检查线圈能自由转动。","确认磁场存在且电路接触良好后，再短时通电观察线圈是否持续转动。","测量电压和电流后，可用 P<sub>入<\/sub>=U<sub>m<\/sub>·I<sub>m<\/sub> 估算模型的电输入功率。","若功率近似稳定，再用输入功率乘通电时间估算电输入电能，并与电能除以时间复核。"],["直流电动机模型工作时测得 6 V、0.3 A，连续通电 20 s，估算输入功率和输入电能。",["P<sub>入<\/sub>=U<sub>m<\/sub>·I<sub>m<\/sub>=6×0.3=1.8 W。","E<sub>入<\/sub>=P<sub>入<\/sub>·t<sub>m<\/sub>=1.8×20=36 J。"],"输入功率为 1.8 W，20 s 内输入电能为 36 J。"],["magnet-01","power-02","circuit-01"],["magnet-02"],["直流电动机模型","换向器","电刷","线圈","输入电功率","输入电能"],15,"<section class=\"field learning\"><h4>低压直流电动机模型<\/h4><p>用低压电源、线圈、磁体和支撑接点构成模型，先检查回路、接触和自由转动，再通电观察，避免堵转长时间通电。换向器或示范线圈半刮绝缘的做法使适当阶段通断或换向；裸导线短路不是简化模型。该模型属于教材实践补充，不据功率计算声称安装步骤已经自动验证。<\/p><\/section>","基础","初中"],["magnet-02","电磁感应与发电机","闭合电路的一部分导体在磁场中做切割磁感线运动时，电路中会产生感应电流，这种现象叫电磁感应。",[["已测感应电压求回路电流","<mrow><msub><mi>I<\/mi><mi mathvariant=\"normal\">感<\/mi><\/msub><mo>=<\/mo><mfrac><msub><mi>U<\/mi><mi mathvariant=\"normal\">感<\/mi><\/msub><msub><mi>R<\/mi><mi mathvariant=\"normal\">回路<\/mi><\/msub><\/mfrac><\/mrow>","仅作已知电学或能量数据的应用，不验证本卡定性规律。感应电压已由仪表测得，闭合回路近似服从欧姆定律。"],["由感应电流和回路电阻求电压","<mrow><msub><mi>U<\/mi><mi mathvariant=\"normal\">感<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>I<\/mi><mi mathvariant=\"normal\">感<\/mi><\/msub>&#x22C5;<msub><mi>R<\/mi><mi mathvariant=\"normal\">回路<\/mi><\/msub><\/mrow><\/mrow>","仅作已知电学或能量数据的应用，不验证本卡定性规律。电路闭合，感应电流与回路电阻描述同一测量状态。"]],[["U<sub>感<\/sub>","感应电压","V"],["I<sub>感<\/sub>","感应电流","A"],["R<sub>回路<\/sub>","感应电路总电阻","Ω"],["P<sub>感<\/sub>","感应电源输出的电功率","W"]],[["把感应电流换算成 mA 后仍将毫安数值标作 A。","0.6 V÷3 Ω=0.2 A=200 mA；若把换算后的 200 写成 A，会大 1000 倍。"],["把感应电流写成感应电压乘以回路电阻。","感应电路测得电压后仍按欧姆定律求电流，应当除以电阻；相乘的单位不是 A。"],["认为只要线圈和磁体静止放在一起就一定有持续感应电流。","需要磁场变化或导体与磁场发生相对运动；静止且磁场不变时没有持续感应电流。"]],"磁体与线圈相对运动或线圈所在磁场发生变化时，可能出现感应电流；磁场不变且没有相对运动时，通常没有持续感应电流。实验中电流表用于观察感应电流，方向变化可由指针偏转方向判断。以下电学关系只在感应电压已经测出后用于计算回路电流，不负责预测感应电压大小。",["将线圈与电流表连成闭合回路，并使磁体与线圈发生相对运动。","观察电流表是否偏转，确认是否产生感应电流。","若需定量计算，先测得感应电压和回路电阻，再用欧姆定律求电流。","改变运动方向或磁场方向观察电流方向变化，不用此电路公式预测感应电压。"],["电磁感应实验中测得回路电压 0.6 V，回路电阻为 3 Ω，求感应电流。",["I<sub>感<\/sub>=U<sub>感<\/sub>/R<sub>回路<\/sub>=0.6/3=0.2 A。","电压是实验测量值，本式不预测感应电压如何产生。"],"感应电流为 0.2 A。"],["ohm-01","circuit-02"],[],["电磁感应","感应电流","磁场变化","相对运动","电流表"],15,"<section class=\"field learning\"><h4>电磁感应与发电机<\/h4><p>闭合电路的一部分导体在磁场中作切割磁感线运动，可产生感应电流；改变切割方向或磁场方向，电流方向可能反转。电路断开可有感应电压，但没有闭合回路的持续感应电流。沿磁感线运动或磁体和线圈无变化时不能保证出现电流。发电机把机械能转为电能，与电动机能量转化相反；欧姆定律只在感应电压已测出后求电流，不验证感应产生条件。<\/p><\/section><details class=\"learning\"><summary>实验：探究导体在磁场中产生感应电流的条件<\/summary><p><b>目的：<\/b>观察闭合、切割方向和磁场方向的作用。<\/p><p><b>装置与接法：<\/b>蹄形磁体、直导体、灵敏电流计、开关、导线。<\/p><p><b>控制、改变与观察：<\/b>闭合与断开回路，切割与沿场方向运动，反转运动或磁场；观察指针。<\/p><p><b>步骤：<\/b><\/p><ol><li>连闭合回路，静止导体作对照。<\/li><li>让导体切割磁感线，再反向切割；保持其余条件。<\/li><li>沿磁感线移动或断开回路作对照，再反转磁场比较方向。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：静止不持续偏转；切割时偏转；只反运动或磁场方向，偏转方向相反。<\/p><p><b>结论与条件：<\/b>闭合回路、适当切割运动可产生电流；回路断开虽可能有电压但不形成该闭合电流。<\/p><p><b>误差与边界：<\/b>接触、表灵敏度、运动太慢可使偏转不明显，没观察到不必然证明不存在感应电压。<\/p><\/details>","基础","初中"],["emwave-03","信息与信息传播","信息可以记录在文字、图像、声音等载体中，并通过声、光或电磁信号传递。",[["按符号速率估算传输时间","<mrow><msub><mi>N<\/mi><mi mathvariant=\"normal\">符号<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>R<\/mi><mi mathvariant=\"normal\">符号<\/mi><\/msub>&#x22C5;<msub><mi>t<\/mi><mi mathvariant=\"normal\">信息<\/mi><\/msub><\/mrow><\/mrow>","拓展计算，非本卡初中必背主线。传送速率在该段时间内近似稳定；传送速率 用每秒符号数表示，传送时间 用 s。"],["由符号数和时间求平均传送速率","<mrow><msub><mi>R<\/mi><mi mathvariant=\"normal\">符号<\/mi><\/msub><mo>=<\/mo><mfrac><msub><mi>N<\/mi><mi mathvariant=\"normal\">符号<\/mi><\/msub><msub><mi>t<\/mi><mi mathvariant=\"normal\">信息<\/mi><\/msub><\/mfrac><\/mrow>","拓展计算，非本卡初中必背主线。符号总数和传送时间对应同一段传输，传送时间 大于 0。"]],[["N<sub>符号<\/sub>","一段信息中传送的符号总数，按个计数","1"],["R<sub>符号<\/sub>","平均符号传送速率，每秒传送的符号数","Hz"],["t<sub>信息<\/sub>","传送这段符号信息所用的时间","s"]],[["把传送 5 s 当成 5 ms，再把符号总数少算 1000 倍。","情境时间已经用秒表示，不能再次按毫秒缩小；重复换算会让估算结果少 1000 倍。"],["把每秒传送的符号数误当成整段信息的符号总数。","符号总数还要乘以传送时间；只写每秒速率会漏掉时间因素，题目问总量时尤其要注意。"],["把符号传送速率等同于电磁波载波频率或每秒比特数。","符号速率、载波频率和比特率的定义不同；没有调制和编码信息时，不能把三者数值直接等同。"]],"通信过程既有信号在空间传播所需的时间，也有信息符号逐个传送所需的时间，两者不能混为一谈。下面的简单速率模型只计算在给定平均符号传送速率下传送一段信息所需的时间，不描述编码、纠错、排队或网络协议；符号速率不是电磁波载波频率，也不等同于每秒比特数。",["信息先被记录或编码成可以传送的信号。","信号需要经过发射、传播和接收，接收端再从信号中还原信息。","若用平均符号速率描述一段稳定传输，符号总数等于每秒符号数乘以时间。","此拓展模型只算符号传送时间；真实通信还会受编码、纠错、设备处理和网络排队影响。"],["一个简化通信模型中，平均每秒传送 600 个符号，传送 5 s，估算传过的符号总数。",["N<sub>符号<\/sub>=R<sub>符号<\/sub>·t<sub>信息<\/sub>=600×5=3000 个符号。","这是符号数的拓展估算，不代表网络端到端时延或比特率。"],"约传送 3000 个符号。"],["motion-01","emwave-01"],["emwave-02"],["信息","信息传播","通信信号","符号速率","拓展模型"],16,"<section class=\"field learning\"><h4>信息与信息传播<\/h4><p>信息借声音、文字、图像等载体记录，通信可把信息转为信号，经发送、传输和接收还原。模拟信号连续变化，数字信号用离散状态表示；两者不是“快慢”同义词。数据符号率和电磁波频率定义不同，数字信号也可借电磁波传输。<\/p><\/section><section class=\"field learning\"><h4>本章素养回顾（原创任务）<\/h4><p>选择本章一个现象，写出结论、成立条件和证据；用另一条本章规律复核解释是否矛盾。指出一次测量或模型的局限，并说明还需什么证据；数值通过不替代概念辨析。<\/p><\/section>","拓展","初中主线；公式含拓展"],["emwave-01","电磁波的波速、频率和波长","电磁波能够在真空中传播，真空中的传播速度约为 3.0×10⁸ m/s。",[["波速等于波长乘频率","<mrow><mi>c<\/mi><mo>=<\/mo><mrow><mi>λ<\/mi>&#x22C5;<mi>f<\/mi><\/mrow><\/mrow>","波长 λ 用 m、频率 f 用 Hz，c 用 m/s；真空波速取约 3.0×10⁸ m/s。"],["由波速和频率求波长","<mrow><mi>λ<\/mi><mo>=<\/mo><mfrac><mi>c<\/mi><mi>f<\/mi><\/mfrac><\/mrow>","电磁波在真空或近似真空的空气中传播，f 不为零。"]],[["c","电磁波在真空中的传播速度近似值","m/s"],["λ","电磁波波长","m"],["f","电磁波频率","Hz"],["d","电磁波传播距离","m"],["t","理想传播所用时间","s"]],[["频率已用 Hz 代入后，又按 MHz 再除以 1 000 000，造成波速少算百万倍。","情境中的 100 000 000 已是 Hz；与 3 m 相乘应得到 3.0×10⁸ m/s，不应重复换算。"],["把波长与频率相乘写成频率除以波长。","波速关系为波长乘频率；f/λ 的单位不是 m/s。"],["认为电磁波传播必须依赖空气或其他介质。","电磁波能够在真空中传播；声波需要介质，两类波的传播条件不同。"]],"无线电波、微波、红外线、可见光、紫外线、X 射线和伽马射线都属于电磁波，主要差别包括频率和波长范围。电磁波不需要空气等介质才能传播。使用波速关系时，波长用 m、频率用 Hz，所得波速为 m/s；空气中传播速度可近似按真空光速处理。",["电磁波每秒传播一定距离，该距离为波速 c。","波长 λ 表示相邻同相位点之间的距离，频率 f 表示每秒振动次数。","每秒前进的完整波长数乘以波长，得到 c=λ·f。","同一真空中 c 近似不变，所以频率越高波长越短。"],["某无线电波频率100 MHz，在真空中传播，取真空光速3.0×10⁸ m/s，求波长。",["100 MHz=100 000 000 Hz。","λ=c/f=3.0×10⁸/100 000 000=3 m。"],"波长约为 3 m。"],["particle-02"],["emwave-02"],["电磁波","波速","频率","波长","无线电波","微波"],16,"<section class=\"field learning\"><h4>电磁波及其传播<\/h4><p>变化的电流可产生电磁波，电磁波能在真空中传播，波速、波长、频率满足乘积关系。发射装置把待传信息加载到信号，接收装置选择信号并还原信息；不是电磁波凭空认识文字。频率较高对应真空波长较短，不能说频率越高必定传播越快。<\/p><\/section>","基础","初中"],["emwave-02","电磁波传播与通信时延","无线通信把信息转换成电信号并调制到电磁波上，经空间传播后由接收设备还原信息。",[["传播距离与时间关系","<mrow><mi>d<\/mi><mo>=<\/mo><mrow><mi>c<\/mi>&#x22C5;<mi>t<\/mi><\/mrow><\/mrow>","电磁波在空气中近似以真空光速传播，且只计算单程传播。"],["由距离和波速求传播时间","<mrow><mi>t<\/mi><mo>=<\/mo><mfrac><mi>d<\/mi><mi>c<\/mi><\/mfrac><\/mrow>","d 为单程距离，c 为这段路径上的近似传播速度。"]],[["d","电磁波传播距离","m"],["c","电磁波传播速度近似值","m/s"],["t","理想传播所用时间","s"],["λ","电磁波波长","m"],["f","电磁波频率","Hz"]],[["把单程传播距离误当成往返距离，计算时多乘 2。","通信单程时延只对应单程路径；若题目明确发射后返回的回波才计算往返。"],["把光速传播时间当成端到端网络响应时间。","互联网通信还包含路由、排队和设备处理时间，理想传播时延只是其中一部分。"]],"无线电波传播速度接近真空光速，因此远距离通信仍有传播时延；实际通信总时延还包括设备处理、排队和网络转发时间。用路程和时间估算只能表示理想的一段传播过程，不代表整个互联网应用的响应时间。",["把通信链路的单程距离 d 统一为 m。","无线电波在空气中的速度近似取 3.0×10⁸ m/s。","用距离除以波速估算理想传播时间。","实际通信还包含设备处理等时延，不能把估算值当成端到端总时延。"],["电磁波在空气中传播 30 km，按 3.0×10⁸ m/s 估算单程时间。",["30 km=30 000 m。","t=d/c=30 000/(3.0×10⁸)=0.0001 s。"],"理想单程传播时间约为 0.0001 s。"],["emwave-01","motion-01"],[],["无线通信","传播速度","时延","单程距离"],16,"<section class=\"field learning\"><h4>现代通信与信息时代<\/h4><p>无线通信利用电磁波，卫星通信可接力跨区域信号；光纤通信以光传信息，光在适当条件下被约束在纤芯传播；网络把终端和交换设备连接起来。光纤传的是信号能量及信息，不是把整颗电子从发端搬到收端。传输时延不等于下载总时间；信息技术也涉及隐私、真实性和合理使用。<\/p><\/section>","基础","初中"],["sustain-01","能源利用与社会发展中的耗电估算","能源利用支撑照明、交通、生产和现代生活。",[["功率和时间求耗电量","<mrow><mi>E<\/mi><mo>=<\/mo><mrow><mi>P<\/mi>&#x22C5;<mi>t<\/mi><\/mrow><\/mrow>","P 用 kW、t 用 h，所得电能 E 用 kWh。"],["由耗电量和使用时间求平均功率","<mrow><mi>P<\/mi><mo>=<\/mo><mfrac><mi>E<\/mi><mi>t<\/mi><\/mfrac><\/mrow>","电能 E 用 kWh、时间 t 用 h，所得平均功率 P 用 kW。"]],[["P","用电器的工作功率","kW"],["t","用电时间","h"],["E","消耗的电能","kWh"]],[["把5 h误作5 min换成小时。","时间实际5 h，能耗0.05 kWh；误作5 min才需要除60，结果小60倍。"],["把耗电量写成功率除以使用时间。","耗电量等于功率乘以时间；功率再除以时间会得到功率变化率，不是电能。"],["LED灯功率为 0.01 kW、使用 5 h，却把耗电量写成 0.002 kWh。","0.01 kW×5 h=0.05 kWh；除法结果不仅数值错误，单位也不能表示耗电量。"],["只看额定功率较小，就断定设备一定更节能而不看使用时长。","耗电量还取决于使用时间；小功率设备长时间运行也可能耗电更多。"]],"社会发展会带来更多能源需求，因此既要保证合理用能，也要减少不必要的浪费。比较同一项用电服务的耗电量时，应确认功率和使用时间的单位一致；当功率用 kW、时间用 h 时，乘积直接得到 kWh。该关系只计算用电量，不足以单独评价能源来源的环境影响或可持续性。",["读取用电器铭牌或题目给出的工作功率。","把功率统一成 kW、时间统一成 h。","功率乘以使用时间，得到以 kWh 表示的电能。","同一类服务下比较不同设备或不同时长的耗电量，避免只凭额定功率判断。"],["一盏功率为 0.01 kW 的 LED 灯连续使用 5 h，求消耗的电能。",["E=P·t=0.01×5=0.05 kWh。","此结果只描述这段时间的用电量，不代表整套能源方案的环境影响。"],"消耗电能为 0.05 kWh。"],["power-01","power-02"],["sustain-03"],["节能","电能","功率","使用时间","千瓦时"],17,"<section class=\"field learning\"><h4>能源利用与社会发展<\/h4><p>能源是可提供能量的资源。煤、石油、天然气为化石能源，按形成速度通常属不可再生；太阳、风、水等属可再生。一次能源来自自然界，电能等二次能源通常需转化制得。不同方案要比较供应、效率、污染、资源和安全，不能把“电器没有排烟”当全链条零排放。<\/p><\/section><section class=\"field learning\"><h4>本章素养回顾（原创任务）<\/h4><p>选择本章一个现象，写出结论、成立条件和证据；用另一条本章规律复核解释是否矛盾。指出一次测量或模型的局限，并说明还需什么证据；数值通过不替代概念辨析。<\/p><\/section>","基础","初中"],["sustain-03","核能","核能储存在原子核内部，核裂变和核聚变过程都能释放核能。",[["由电功率估算核电站输出电能","<mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">电<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>P<\/mi><mi mathvariant=\"normal\">电<\/mi><\/msub>&#x22C5;<msub><mi>t<\/mi><mi mathvariant=\"normal\">n<\/mi><\/msub><\/mrow><\/mrow>","仅作已知电学或能量数据的应用，不验证本卡定性规律。对外电功率在所计时间内近似稳定，时间用 s、电功率用 W。"],["由输出电能和时间求平均电功率","<mrow><msub><mi>P<\/mi><mi mathvariant=\"normal\">电<\/mi><\/msub><mo>=<\/mo><mfrac><msub><mi>E<\/mi><mi mathvariant=\"normal\">电<\/mi><\/msub><msub><mi>t<\/mi><mi mathvariant=\"normal\">n<\/mi><\/msub><\/mfrac><\/mrow>","仅作已知电学或能量数据的应用，不验证本卡定性规律。输出电能和时间对应同一过程，通电时间 大于 0。"]],[["P<sub>电<\/sub>","核电站对外输出的电功率","W"],["t<sub>n<\/sub>","持续输出的时间","s"],["E<sub>电<\/sub>","这段时间输出的电能","J"]],[["核电站 1.0×10⁹ W 运行 3600 s，误将时间除以 3600 再代入。","题目给出的运行时间已是秒，重复除以 3600 会把应有输出电能缩小 3600 倍。"],["把核能说成在电站内一步直接变成电能。","核电站先通过裂变加热介质，再驱动汽轮机和发电机，能量经历多个转化环节。"],["把输出电能写成输出功率除以运行时间。","输出电能是功率对时间的累积，应将功率乘运行时间；相除得到的单位也不再是焦耳。"]],"核电站不是把核能直接变成电能：能量会经历核能、内能、机械能和电能等形式的转化。若已知电站对外输出的电功率，可以用功率乘运行时间估算一段时间输出的电能；这是通用电功率关系的应用，不是核反应释放能量的预测公式。讨论核能时还应区分运行排放、核废料管理和事故风险等不同问题。",["核裂变释放的核能先转化为内能，再驱动汽轮机和发电机。","电站输出电功率表示单位时间输出的电能。","当功率近似稳定时，用输出功率乘运行时间估算输出电能。","这一估算只计算已知的电功率输出，不从反应物质量推算核反应能量。"],["某发电装置对外输出功率为 1.0×10⁹ W，若连续输出 3600 s，估算输出电能。",["E<sub>电<\/sub>=P<sub>电<\/sub>·t<sub>n<\/sub>=1.0×10⁹×3600=3.6×10¹² J。","这是输出电能估算，不能据此倒推核燃料释放能量。"],"输出电能约为 3.6×10¹² J。"],["power-02","energy-04"],["sustain-04"],["核能","核裂变","核聚变","核电站","能量转化","运行风险"],17,"<section class=\"field learning\"><h4>核能<\/h4><p>裂变把重原子核分成较轻核，聚变使轻核结合成较重核，在相应反应条件下可释放能量。核电站使用受控裂变链式反应加热工质，经汽轮机、发电机转为电能；太阳能量主要来自核聚变。核废料、辐射防护和事故风险都需专业管理，不把核能等同化学燃烧。<\/p><\/section>","基础","初中"],["sustain-04","太阳能","太阳能来自太阳辐射，属于可再生能源，可用于光热和光伏等技术。",[["估算水吸收的热量","<mrow><msub><mi>Q<\/mi><mi mathvariant=\"normal\">水<\/mi><\/msub><mo>=<\/mo><mrow><mrow><msub><mi>c<\/mi><mi mathvariant=\"normal\">水<\/mi><\/msub>&#x22C5;<msub><mi>m<\/mi><mi mathvariant=\"normal\">水<\/mi><\/msub><\/mrow>&#x22C5;<mi mathvariant=\"normal\">dT<\/mi><\/mrow><\/mrow>","只计算水吸收的热量，忽略容器热容和散热；水的比热容用 J/kg/℃。"],["由吸收热量估算水的升温","<mrow><mi mathvariant=\"normal\">dT<\/mi><mo>=<\/mo><mfrac><msub><mi>Q<\/mi><mi mathvariant=\"normal\">水<\/mi><\/msub><mrow><msub><mi>c<\/mi><mi mathvariant=\"normal\">水<\/mi><\/msub>&#x22C5;<msub><mi>m<\/mi><mi mathvariant=\"normal\">水<\/mi><\/msub><\/mrow><\/mfrac><\/mrow>","水的质量和比热容已知且非零，暂不计热损失。"]],[["c<sub>水<\/sub>","水的比热容","J/kg/℃"],["m<sub>水<\/sub>","被加热水的质量","kg"],["dT","水升高的温度","℃"],["Q<sub>水<\/sub>","水吸收的热量","J"]],[["把0.2 kg的200 g数值仍按kg代入。","水质量应0.2 kg，吸热12600 J；按200 kg会误大千倍。"],["把太阳能热水器的太阳输入能量直接等同于水吸收的热量。","太阳辐射到水之间会经过集热器和管路，途中有反射与散热，水吸收的热量只是输入能量的一部分。"],["把水吸收的热量算成比热容乘质量再除以升温。","水的吸热量随温升增大而增大；公式中应乘温升，除以温升还会破坏焦耳的量纲。"],["0.2 kg 水升高 15 ℃，误将热量算成 56 J。","按 4200 J/kg/℃、0.2 kg 和 15 ℃ 相乘，结果为 12600 J；不能把温升放到分母。"]],"估算太阳能热水器把水加热所需能量时，可把水看作吸收热量的物体，用水的比热容、质量和升高的温度计算吸收的热量。该关系只描述水获得的热量，不等于太阳辐射总能量；由于装置存在反射、散热等损失，太阳提供的能量通常更大。太阳能可再生，但并非任何时间和地点都能稳定提供相同功率。",["太阳辐射能被集热器吸收，并传给水。","先确定被加热水的质量和温度变化。","按水的比热容关系计算水吸收的热量。","由于集热器和管路会向环境散热，太阳输入能量不能简单等同于水获得的热量。"],["太阳能热水器使0.2 kg水温升高15 ℃，水的比热容4200 J/(kg·℃)，无物态变化，忽略散热，估算吸收热量。",["Q<sub>水<\/sub>=c<sub>水<\/sub>·m<sub>水<\/sub>·dT。","代入 4200×0.2×15=12600 J。","太阳能集热器实际输入能量还需考虑散热损失。"],"水吸收的热量约为 1.26×10⁴ J。"],["energy-02","energy-03"],["sustain-02"],["太阳能","光热利用","光伏","比热容","热水器","可再生能源"],17,"<section class=\"field learning\"><h4>太阳能<\/h4><p>太阳能可用于光热和光伏，分别把辐射能用于加热或转为电能，太阳辐射不是各地全天恒定的输入。可再生不代表设备无需材料、制造或维护，也不代表没有环境影响。比较热水器先计算水吸热，再讨论集热损失；不把水吸热量直接当全部太阳输入能量。<\/p><\/section>","基础","初中"],["sustain-02","能量转化的基本规律","能量可以从一种形式转化为另一种形式，也可以在物体之间传递；在转化和传递过程中，能量总量保持不变。",[["能量输入与各输出的平衡","<mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">入<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">有用<\/mi><\/msub><mo>+<\/mo><msub><mi>E<\/mi><mi mathvariant=\"normal\">损<\/mi><\/msub><\/mrow><\/mrow>","按给定系统边界统计全部有用输出与损耗，能量单位一致。"],["能量利用效率","<mrow><mi>η<\/mi><mo>=<\/mo><mfrac><msub><mi>E<\/mi><mi mathvariant=\"normal\">有用<\/mi><\/msub><msub><mi>E<\/mi><mi mathvariant=\"normal\">入<\/mi><\/msub><\/mfrac><\/mrow>","有用能量与输入能量使用相同单位，输入能量大于零。"]],[["E<sub>入<\/sub>","设备输入的能量","J"],["E<sub>有用<\/sub>","转化得到的有用能量","J"],["E<sub>损<\/sub>","未成为目标有用输出的能量","J"],["η","能量利用效率，以小数表示","1"],["P","用电器功率","kW"],["t","使用时间","h"],["E","使用期间消耗的电能","kWh"],["P<sub>旧<\/sub>","原用电器功率","kW"],["P<sub>新<\/sub>","替换后用电器功率","kW"],["E<sub>节<\/sub>","替换后节省的电能","kWh"]],[["把能量利用效率写成输入能量除以有用能量。","效率是有用输出占输入的比例；高效电机情境中为 80/100=0.8，而不是 1.25。"],["认为可再生能源没有任何环境影响，或认为能量损耗意味着能量消失。","可再生能源的利用仍可能影响生态和土地；损耗能量通常转化为不易利用的热、声等形式，并未违反能量守恒。"]],"分析能量转化时要先划定研究对象和过程，再把输入、有用输出以及转化到环境中的其他能量分别列出。能量守恒不表示每一部分能量都同样容易利用；效率是有用能量与输入能量之比，不能超过 100%。本节的能量账目关系可用于检查转换过程是否漏项，效率关系用于比较装置利用输入能量的程度。",["给能量转换过程划定系统边界，统计输入能量。","把输出分成完成目标的有用能量与其他转化能量。","能量守恒要求输入与全部输出相等。","有用输出除以输入能量得到效率，可乘 100% 表示百分数。"],["一台装置输入 100 J 能量，其中 80 J 转化为有用输出，求效率和其他能量。",["效率 η=80/100=0.8=80%。","其他转化能量为 100-80=20 J。"],"效率为 80%，其他能量为 20 J。"],["energy-01","machine-03"],["sustain-05"],["可再生能源","不可再生能源","能量守恒","能源效率","可持续发展"],17,"<section class=\"field learning\"><h4>能量转化的基本规律<\/h4><p>能量可转化、可转移，总量守恒；转移和转化具有方向性，分散到环境的内能通常难以全部回收。节约能源的原因是易用能资源和利用条件有限，不是能量会从宇宙消失。效率先约定有用目标和系统边界，不能超过100%，不同装置效率要在可比边界下比较。<\/p><\/section>","基础","初中"],["sustain-05","能源与可持续发展","能源与可持续发展要求兼顾当前生产生活需要、资源长期供应和生态环境保护。",[["计算旧设备在相同服务时段的耗电量","<mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">旧<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>P<\/mi><mi mathvariant=\"normal\">旧<\/mi><\/msub>&#x22C5;<msub><mi>t<\/mi><mi mathvariant=\"normal\">有用<\/mi><\/msub><\/mrow><\/mrow>","功率近似稳定，时间用 s、功率用 W，所得能量为 J。"],["计算新设备在相同服务时段的耗电量","<mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">新<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>P<\/mi><mi mathvariant=\"normal\">新<\/mi><\/msub>&#x22C5;<msub><mi>t<\/mi><mi mathvariant=\"normal\">有用<\/mi><\/msub><\/mrow><\/mrow>","新设备功率近似稳定，且新旧设备工作时间相同。"],["由新旧设备耗电量求节能量","<mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">节<\/mi><\/msub><mo>=<\/mo><mrow><msub><mi>E<\/mi><mi mathvariant=\"normal\">旧<\/mi><\/msub><mo>−<\/mo><msub><mi>E<\/mi><mi mathvariant=\"normal\">新<\/mi><\/msub><\/mrow><\/mrow>","新旧方案提供相同服务，且旧方案耗能不小于新方案。"]],[["P<sub>旧<\/sub>","旧设备功率","W"],["P<sub>新<\/sub>","新设备功率","W"],["t<sub>有用<\/sub>","两种设备提供相同服务的使用时间","s"],["E<sub>旧<\/sub>","旧设备在该时段消耗的电能","J"],["E<sub>新<\/sub>","新设备在该时段消耗的电能","J"],["E<sub>节<\/sub>","新设备相对旧设备减少的耗电量","J"]],[["把新设备耗电量加到旧设备耗电量上当成节能量。","节能量是旧设备比新设备多消耗的部分，应做差而不是相加。比较之前先统一时间范围和所提供的服务。"],["比较灯具节能量时让旧灯和新灯使用不同时间。","要比较相同服务，必须统一照明时长等条件。比较之前先统一时间范围和所提供的服务。"],["仅凭一次电费差值就断定一种能源在全生命周期都更可持续。","生命周期评价还涉及制造、运输、发电来源、维护和回收等边界。比较之前先统一时间范围和所提供的服务。"]],"比较节能措施时，先确保新旧方案提供相同的照明、出行或生产服务，再比较同一使用时长内的耗电量差。功率较低并不自动意味着更可持续，还要考虑设备寿命、发电结构、材料和回收等因素。本条用新旧设备的耗电量差做一个边界清楚的定量例子，不把单次能耗计算冒充完整的生命周期评价。",["先确定新旧方案提供的是同一项服务，使用时长也相同。","分别按功率乘时间计算两种设备消耗的电能。","用旧设备耗电量减去新设备耗电量，得到该时段的节能量。","完整的可持续性判断还要比较能源来源、排放、设备寿命和回收，不能只靠这一个能耗差。"],["旧灯功率 60 W，新灯功率 10 W，两者提供相同照明且各使用 3600 s，求这段时间少消耗的电能。",["E<sub>旧<\/sub>=60×3600=216000 J。","E<sub>新<\/sub>=10×3600=36000 J。","E<sub>节<\/sub>=E<sub>旧<\/sub>−E<sub>新<\/sub>=180000 J。"],"新灯在该时段少消耗 180000 J 电能。"],["sustain-01","sustain-02","power-01"],[],["可持续发展","节能","能源效率","可再生能源","环境影响","生命周期边界"],17,"<section class=\"field learning\"><h4>能源与可持续发展<\/h4><p>提高效率、节约使用、发展适合场地的可再生能源、减少污染和做好回收，需兼顾当前与未来需求。比较灯具先保持照度、时长等服务相同；比较交通需保持运送需求相同。可再生能源也可能影响土地和生态，评价结合生命周期，不能只看一笔电费。<\/p><\/section>","基础","初中"],["tool-01","刻度尺的使用与估读","刻度尺测量长度时要读出起点和终点的位置，并取两读数之差。",[["两位置之差","<mrow><mi>L<\/mi><mo>=<\/mo><mrow><msub><mi>x<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>x<\/mi><mn>1<\/mn><\/msub><\/mrow><\/mrow>","两读数在同一尺上，单位统一；这里数值使用米。"],["独立复测长度","<mrow><mi>Y<\/mi><mo>=<\/mo><mrow><msub><mi>y<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>y<\/mi><mn>1<\/mn><\/msub><\/mrow><\/mrow>","y1、y2是另一次复测中同一薄板两端的坐标，使用同一长度单位及同一把尺的零点。"]],[["L","第一次测得长度","m"],["Y","独立复测长度","m"],["x<sub>1<\/sub>","第一次起点位置","m"],["x<sub>2<\/sub>","第一次终点位置","m"],["y1","复测起点位置","m"],["y2","复测终点位置","m"]],[["零端磨损时仍把终点读数当长度，忘记减去起点。","用非零刻线起测后，终点读数包含被移动的起点位置。4.26 cm的终点和1.00 cm的起点应相减，不是4.26 cm长。"],["毫米分度尺只记3.2 cm，漏写估读位。","普通毫米尺按中学约定应估读到0.1 mm，记录如3.26 cm；只记3.2 cm丢失了测量精度信息。补位必须来自实际观察，不能任意添数字。"]],"先认量程、分度值和零刻线，将刻度面贴近物体并平行放置，视线正对刻度面。零端磨损可以从完整的整数刻线起测，但必须减去起点。估读位体现测量精度，不能把准确刻度的位数当作完整结果；数字仪器则按实际显示精度记录。重复测量能减小部分偶然误差，不能修复斜视与尺本身的偏差。\n学习分工：本卡讲刻度尺的放置、分度值和估读，重复测量与数据记录见实验卡（jexp-01），可点击下方知识关系回看。这一链接是相关内容推荐，不表示必须先后学习。",["贴近尺面并选择起点，读到毫米下一位。","起点非零时用终点减起点，得到被测长度。","改变起点再次测量，比较两次差值并保留原仪器精度。"],["用毫米分度尺从1.00 cm量至4.26 cm，复测从2.00 cm至5.26 cm，求薄板长度。",["两次起点均不为零，分别用终点减起点。","两次均得3.26 cm，按估读位记录并统一单位。"],"薄板长度为3.26 cm，即0.0326 m。"],["motion-03"],["motion-01","jexp-01"],["刻度尺的使用与估读","条件与边界","实验与证据"],18,"<section class=\"field learning\"><h4>刻度尺的使用与估读：方法与边界<\/h4><p>先认量程、分度值和零刻线，将刻度面贴近物体并平行放置，视线正对刻度面。零端磨损可以从完整的整数刻线起测，但必须减去起点。估读位体现测量精度，不能把准确刻度的位数当作完整结果；数字仪器则按实际显示精度记录。重复测量能减小部分偶然误差，不能修复斜视与尺本身的偏差。<\/p><\/section>","基础","初中"],["tool-02","游标卡尺的读数","游标卡尺用主尺毫米数加上游标对齐格数乘分度差读数。",[["主尺加游标增量","<mrow><mi>L<\/mi><mo>=<\/mo><mrow><mi>x<\/mi><mo>+<\/mo><mrow><mi>n<\/mi>&#x22C5;<mi>d<\/mi><\/mrow><\/mrow><\/mrow>","标准毫米主尺、对应分度差的游标；计算数值先统一为米。"]],[["L","卡尺读数","m"],["x","主尺整毫米位置","m"],["n","游标对齐格数","1"],["d","游标分度差","m"],["D","独立校准长度","m"]],[["50分度游标第23格对齐时，把游标增量当0.23 mm而非0.46 mm。","格数不是毫米数，必须乘该游标的0.02 mm分度差；12 mm主尺与23格对应12.46 mm，错按0.01 mm每格得到12.23 mm。错读每格0.01 mm是本规格实际每格0.02 mm的一半，所以错误式仍带长度量纲。"],["给游标读数额外估读一位或把内外测量爪混用。","游标根据刻线对齐读数，不按普通连续刻度另估一位。不同测量爪对应不同接触位置，必须先确认对象和校零，不能仅凭计算正确判断操作正确。"]],"主尺读游标零线左侧的整毫米，再找一条与主尺重合的游标刻线。外测量爪测外径或厚度，内测量爪测内径，深度尺测孔深。先校零并保持接触适度，歪放、卡得过紧和看错游标零线都引入偏差。游标与螺旋测微器的读数规则不同；本卡是精密工具拓展，不把它宣称为苏科初中必做实验。",["标准游标分度差由主尺与游标格距的差决定，先确认规格。","读游标零线左侧整毫米，再用对齐格数乘分度差。","主尺与游标增量相加；校准标准块检查读数，没有额外估读位。"],["50分度游标主尺读12 mm，第23条线对齐；另用标准块校准长度为12.46 mm，求卡尺读数。",["分度差为0.02 mm，游标部分为23×0.02=0.46 mm。","主尺12 mm与增量相加，和校准长度比较。"],"读数12.46 mm，不另加估读位。"],["tool-01"],["prop-02"],["游标卡尺的读数","条件与边界","实验与证据"],18,"<section class=\"field learning\"><h4>游标卡尺的读数：方法与边界<\/h4><p>主尺读游标零线左侧的整毫米，再找一条与主尺重合的游标刻线。外测量爪测外径或厚度，内测量爪测内径，深度尺测孔深。先校零并保持接触适度，歪放、卡得过紧和看错游标零线都引入偏差。游标与螺旋测微器的读数规则不同；本卡是精密工具拓展，不把它宣称为苏科初中必做实验。<\/p><\/section>","基础","高中测量拓展"],["tool-03","螺旋测微器的读数","常用螺旋测微器以固定套筒刻度加可动套筒读数测长度。",[["示值减零误差","<mrow><mi>D<\/mi><mo>=<\/mo><mrow><mrow><mi>x<\/mi><mo>+<\/mo><mrow><mi>n<\/mi>&#x22C5;<mi>d<\/mi><\/mrow><\/mrow><mo>−<\/mo><mi>z<\/mi><\/mrow><\/mrow>","常用螺距0.5 mm、圆周50分度，符号表与情境数值统一为米。"]],[["D","修正后直径","m"],["x","固定刻度含半毫米","m"],["n","可动刻度含估读格数","1"],["d","每格前进长度","m"],["z","有符号零点误差","m"],["D0","独立标准块长度","m"],["h<sub>0<\/sub>","固定套筒半毫米间隔","m"]],[["看到半毫米刻线却漏读0.5 mm。","固定套筒的半毫米也是已经露出的准确刻度，遗漏它会使直径少0.500 mm。零点修正无法补偿漏掉半毫米这一读数错误。半毫米间隔作为有长度单位的量扣除，不把0.0005当作无量纲数相减。"],["用主体旋钮硬拧测量面，或不顾正负把零误差总加上。","棘轮限制测量压力，过紧会压缩软物体或损伤仪器；修正须用示值减有符号零误差，不能靠猜测方向。估读位也须来自刻度观察。"]],"固定刻度要检查半毫米刻线是否露出，可动刻度对准基准线读到估读位。测量前校零，接近物体时使用棘轮，听到适当打滑后停止，避免旋紧主体压坏物体。闭合时仪器显示的有符号零误差应从示值减去；正零误差使示值偏大，负零误差相反。这里只讨论常用规格，其他螺距须按铭牌确认。",["固定刻度先看整毫米和露出的半毫米。","螺距除圆周格数得到每格前进长度，读可动刻度并估读一位。","示值减有符号零误差，用棘轮保证测量压力不过大。"],["螺旋测微器固定刻度5.5 mm，可动刻度27.6格，每格0.01 mm，零误差+0.006 mm，求长度。",["示值5.5+27.6×0.01=5.776 mm。","减正零误差0.006 mm，按0.001 mm记录。"],"修正后长度为5.770 mm。"],["tool-01"],["prop-02"],["螺旋测微器的读数","条件与边界","实验与证据"],18,"<section class=\"field learning\"><h4>螺旋测微器的读数：方法与边界<\/h4><p>固定刻度要检查半毫米刻线是否露出，可动刻度对准基准线读到估读位。测量前校零，接近物体时使用棘轮，听到适当打滑后停止，避免旋紧主体压坏物体。闭合时仪器显示的有符号零误差应从示值减去；正零误差使示值偏大，负零误差相反。这里只讨论常用规格，其他螺距须按铭牌确认。<\/p><\/section>","基础","高中测量拓展"],["tool-04","弹簧测力计的使用","弹簧测力计利用有效范围内弹簧伸长随拉力增大的特点测量力，示值单位为牛顿。",[["刻度换算拉力","<mrow><mi>F<\/mi><mo>=<\/mo><mrow><mi>n<\/mi>&#x22C5;<mi>d<\/mi><\/mrow><\/mrow>","0到5 N量程、已沿测力方向调零。"]],[["F","测力计示值","N"],["n","零位后刻度格数","1"],["d","每格对应力","N"],["m","校准砝码质量","kg"],["g","重力加速度","m/s²"]],[["把0.5 N一格误当1 N一格，读数翻倍。","示值由分度值和格数共同决定，格数本身没有牛顿的含义；6格乘0.5 N才是3 N，不能读成6 N，更不能直接记成6 kg。"],["斜拉弹簧或在加速上提时一律把拉力当重力。","力应沿弹簧轴线施加，侧向摩擦会改变伸长与示值；只有平衡且无其他竖直支持时悬挂拉力才等于重力，运动状态必须单独判断。"]],"先认量程和分度值，按实际测量方向校零，拉力方向与弹簧轴线一致并避免外壳摩擦。示值稳定时视线正对刻度，不能超过量程。用测力计测物体重力还要求物体平衡且无其他支持；加速提起时拉力未必等于重力。数值校验只验证刻度换算和校准，方向、姿势与量程选择还要观察。",["沿实际测力方向校零，并核对量程与分度值。","格数乘分度值给出拉力，刻度格数本身不是质量。","用静止砝码重力校准，非平衡时不直接将拉力等同重力。"],["0到5 N测力计每格0.5 N，沿轴线悬挂0.30 kg砝码，g取10 m/s²，稳定时在第6格。",["按刻度读数6×0.5=3.0 N，没有超过量程。","按重力0.30×10=3.0 N核对静止平衡。"],"拉力示值3.0 N，与校准重力一致。"],["force-01"],["fmotion-01"],["弹簧测力计的使用","条件与边界","实验与证据"],18,"<section class=\"field learning\"><h4>弹簧测力计的使用：方法与边界<\/h4><p>先认量程和分度值，按实际测量方向校零，拉力方向与弹簧轴线一致并避免外壳摩擦。示值稳定时视线正对刻度，不能超过量程。用测力计测物体重力还要求物体平衡且无其他支持；加速提起时拉力未必等于重力。数值校验只验证刻度换算和校准，方向、姿势与量程选择还要观察。<\/p><\/section>","基础","初中"],["tool-05","托盘天平的使用与密度测量","托盘天平以砝码质量和游码示值相加测物体质量。",[["砝码加游码","<mrow><mi>m<\/mi><mo>=<\/mo><mrow><mi mathvariant=\"normal\">mc<\/mi><mo>+<\/mo><mi mathvariant=\"normal\">my<\/mi><\/mrow><\/mrow>","天平已调平，物体在规定托盘；mc是砝码总质量，my是按游码标尺读取的质量，单位一致。"],["液体密度差量法","<mrow><mi>ρ<\/mi><mo>=<\/mo><mfrac><mrow><msub><mi>m<\/mi><mn>1<\/mn><\/msub><mo>−<\/mo><msub><mi>m<\/mi><mn>2<\/mn><\/msub><\/mrow><mi>V<\/mi><\/mfrac><\/mrow>","倒出前后质量之差与量筒中这一份液体的体积配对。"]],[["m","游码与砝码合计质量","kg"],["m1","杯和液体倒出前质量","kg"],["m2","倒出后杯和剩液质量","kg"],["V","倒入量筒的液体体积","m³"],["ρ","液体密度","kg/m³"],["mc","砝码质量","kg"],["my","游码示值","kg"]],[["天平读数只计砝码，漏掉游码质量。","游码在标尺上移动也提供平衡作用，示值必须与砝码相加；80 g砝码与4 g游码合为84 g，不是80 g。称量时重新调螺母不能弥补漏读。"],["称量时移动平衡螺母，或先排水后称带水固体。","调平衡只用于称量前的空载校零，称量中移动会改变仪器条件；固体附着水增加被称质量，所得密度可能偏大。必须区分误差来源与配对样本。"]],"固体先测干燥质量，再用排水法测不溶、不吸水固体体积，避免带水使质量偏大。液体可先称杯与液体总质量，再向量筒倒一部分，称剩余杯与液体，质量差对应倒入量筒的体积；这样避免杯壁残留不计入体积却计入质量。比较同一份物质，不能把量筒总体积和差量质量随意配对。\n学习分工：本卡讲天平的调平、称量和仪器配对，完整密度测量方案见实验卡（jexp-05），可点击下方知识关系回看。这一链接是相关内容推荐，不表示必须先后学习。",["空载调平，称量时固定平衡螺母并读砝码与游码总质量。","固体先称干燥质量再排水；液体用倒出前后质量差。","用对应那一份样品的质量除以体积，统一到同一单位体系。"],["液体与杯总质量84 g，倒出后44 g，量筒中液体体积50 cm³，求这一份液体密度。",["倒出质量84-44=40 g，与量筒中液体是同一份。","密度40/50=0.8 g/cm³，再换为kg/m³。"],"液体密度为800 kg/m³。"],["prop-01"],["prop-02","jexp-05"],["托盘天平的使用与密度测量","条件与边界","实验与证据"],18,"<section class=\"field learning\"><h4>托盘天平的使用与密度测量：方法与边界<\/h4><p>固体先测干燥质量，再用排水法测不溶、不吸水固体体积，避免带水使质量偏大。液体可先称杯与液体总质量，再向量筒倒一部分，称剩余杯与液体，质量差对应倒入量筒的体积；这样避免杯壁残留不计入体积却计入质量。比较同一份物质，不能把量筒总体积和差量质量随意配对。<\/p><\/section>","基础","初中"],["tool-06","量筒与液体体积读数","量筒按刻度测液体体积，读数时平放在水平桌面，视线与弯月面规定位置相平。",[["毫升换立方米","<mrow><mi>V<\/mi><mo>=<\/mo><mfrac><msub><mi>V<\/mi><mi mathvariant=\"normal\">ml<\/mi><\/msub><mn>1000000<\/mn><\/mfrac><\/mrow>","同一体积的单位换算；V<sub>m<\/sub>l输入毫升数值，V输出立方米数值。"]],[["V","液体体积的立方米数值","m³"],["V<sub>m<\/sub>l","量筒读数的毫升数值","mL"],["V<sub>0<\/sub>","独立量取校准体积","m³"]],[["把毫升换立方米时只除1000，误把体积倍率当长度倍率。","1 mL=1 cm³=10⁻⁶ m³，因此毫升数除一百万；50 mL是0.00005 m³而不是0.05 m³，错误相差一千倍但量纲相同。"],["俯视或仰视凹液面，或读凹面的上沿。","正常视线应与凹液面最低处相平，俯视通常偏大、仰视通常偏小；弯月面读哪一处与液体类型有关，不能把水的规则直接套给凸液面。"]],"先选择合适量程、分度值，读水的凹面最低处时避免俯视和仰视；一般刻度视差情境下俯视读数偏大、仰视偏小。1毫升等于1立方厘米，换算到立方米须用体积倍率。测固体排水体积还要求完全浸没、不溶不吸水、消除气泡；沉浮不同对象需要适当辅助方法，量筒读数不是总能直接当固体体积。",["水平放量筒，平视凹液面最低处。","毫升与立方厘米数值相同，但立方米换算需立方倍率。","标准体积校准只核对量值，读数视差仍需实际操作审查。"],["量筒正确读水体积50 mL，另校准量取体积为50 cm³，换成立方米并说明读数视线。",["视线与水的凹液面最低处相平。","1 mL=10⁻⁶ m³，50 mL乘这一体积倍率。"],"体积5.0×10⁻⁵ m³；应平视凹面最低处。"],["motion-03"],["pressure-04"],["量筒与液体体积读数","条件与边界","实验与证据"],18,"<section class=\"field learning\"><h4>量筒与液体体积读数：方法与边界<\/h4><p>先选择合适量程、分度值，读水的凹面最低处时避免俯视和仰视；一般刻度视差情境下俯视读数偏大、仰视偏小。1毫升等于1立方厘米，换算到立方米须用体积倍率。测固体排水体积还要求完全浸没、不溶不吸水、消除气泡；沉浮不同对象需要适当辅助方法，量筒读数不是总能直接当固体体积。<\/p><\/section>","基础","初中"],["tool-07","有效数字与测量误差","测量记录的末位表达有限精度，平均值应保留与测量能力相称的小数位。",[["三次测量平均","<mrow><mi>L<\/mi><mo>=<\/mo><mfrac><mrow><mrow><msub><mi>L<\/mi><mn>1<\/mn><\/msub><mo>+<\/mo><msub><mi>L<\/mi><mn>2<\/mn><\/msub><\/mrow><mo>+<\/mo><msub><mi>L<\/mi><mn>3<\/mn><\/msub><\/mrow><mn>3<\/mn><\/mfrac><\/mrow>","三次测量同一不变长度，单位与测量方法一致；算术平均不消除共同系统误差。"]],[["L","重复测量平均长度","m"],["L1","第一次长度","m"],["L2","第二次长度","m"],["L3","第三次长度","m"],["D","独立校准样件长度","m"]],[["把三次读数相加而不除以测量次数。","对同一对象重复测量应求平均，直接相加会把长度扩大三倍。这个算术错误可以避免，与读数末位随机波动造成的测量误差不是一回事。"],["认为多测几次能消除所有误差，或把错用刻度说成不可避免误差。","平均只能减小部分偶然影响，固定零偏不会因重复消失；读错格数、漏单位等属于可避免错误。系统误差需校准和改进方法，不能靠增加计算位数修复。"]],"系统误差由校准、仪器或固定方法引起，多次平均不能消除；偶然误差使重复读数散布，合理重复取平均可减小其影响。不能为了末位好看随意补位，也不能说多次测量一定等于真实值。初中先按仪器约定精度记录平均值，再学习不确定度的完整表达；计算器多显示几位不代表测量更精确。",["同样品、同仪器、同单位重复读数。","重复读数求平均，再按原仪器的测量精度保留位数。","用校准检查固定偏差；平均只能减小部分偶然影响。"],["用同一毫米分度尺三次测得3.25、3.26、3.27 cm，求平均并说明能否消除零点偏差。",["三次和为9.78 cm，除以3得3.26 cm。","按原测量精度记3.26 cm；固定零偏需校准，平均不能消除。"],"平均长度3.26 cm，仍需检查系统误差。"],["tool-01"],["motion-01"],["有效数字与测量误差","条件与边界","实验与证据"],18,"<section class=\"field learning\"><h4>有效数字与测量误差：方法与边界<\/h4><p>系统误差由校准、仪器或固定方法引起，多次平均不能消除；偶然误差使重复读数散布，合理重复取平均可减小其影响。不能为了末位好看随意补位，也不能说多次测量一定等于真实值。初中先按仪器约定精度记录平均值，再学习不确定度的完整表达；计算器多显示几位不代表测量更精确。<\/p><\/section>","基础","初中"],["jexp-01","用刻度尺测量长度","正确定位、估读并处理零端磨损。",[["两位置之差","<mrow><mi>L<\/mi><mo>=<\/mo><mrow><msub><mi>x<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>x<\/mi><mn>1<\/mn><\/msub><\/mrow><\/mrow>","两读数在同一尺上，单位统一；这里数值使用米。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"],["独立复测长度","<mrow><mi>Y<\/mi><mo>=<\/mo><mrow><msub><mi>y<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>y<\/mi><mn>1<\/mn><\/msub><\/mrow><\/mrow>"," 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"]],[["L","第一次测得长度","m"],["Y","独立复测长度","m"],["x<sub>1<\/sub>","第一次起点位置","m"],["x<sub>2<\/sub>","第一次终点位置","m"],["y1","复测起点位置","m"],["y2","复测终点位置","m"]],[["零端磨损时仍把终点读数当长度，忘记减去起点。","用非零刻线起测后，终点读数包含被移动的起点位置。4.26 cm的终点和1.00 cm的起点应相减，不是4.26 cm长。"],["毫米分度尺只记3.2 cm，漏写估读位。","普通毫米尺按中学约定应估读到0.1 mm，记录如3.26 cm；只记3.2 cm丢失了测量精度信息。补位必须来自实际观察，不能任意添数字。"]],"用重复定位后的读数差测长度，记录包括估读位与单位；起点磨损时换用完整刻线。保持被测物体不变，改变测量起点或重放刻度尺，比较复测结果。尺面贴近物体、视线正对刻度，避免把倾斜视差当偶然误差。最后按原仪器精度记录平均值，不能随意增加位数。\n学习分工：本卡练改变起点后的复测、单位和平均值记录；仪器使用规则见工具卡（tool-01），可点击下方知识关系回看。这一链接是相关内容推荐，不表示必须先后学习。",["检查量程分度值，选可用刻线对齐起点。","刻度面贴近物体，视线垂直尺面读起点和终点。","相减得长度，重复测量按有效精度记录平均值。"],["用同一毫米刻度尺复测薄板，两次起、终点读数分别为1.00、4.26 cm与2.00、5.28 cm。求平均长度，并说明为什么复测不能消除尺的固定零偏。",["分别相减得3.26 cm和3.28 cm，保留估读位。","平均值为(3.26+3.28)/2=3.27 cm。","重新放尺可减小部分偶然影响；重复同一有固定偏差的尺不能据此证明结果无系统偏差。"],"平均长度3.27 cm；复测不能消除尺的固定偏差。"],["tool-01"],["motion-01","tool-01"],["用刻度尺测量长度","实验方法","控制变量","数据与误差"],19,"<section class=\"field learning\"><h4>用刻度尺测量长度：实验设计<\/h4><p>用重复定位后的读数差测长度，记录包括估读位与单位；起点磨损时换用完整刻线。保持被测物体不变，改变测量起点或重放刻度尺，比较复测结果。尺面贴近物体、视线正对刻度，避免把倾斜视差当偶然误差。最后按原仪器精度记录平均值，不能随意增加位数。<\/p><\/section><details class=\"learning\"><summary>实验：用刻度尺测量长度<\/summary><p><b>目的：<\/b>正确定位、估读并处理零端磨损。<\/p><p><b>装置与接法：<\/b>毫米刻度尺、薄板等被测物。<\/p><p><b>控制、改变与观察：<\/b>保持同一物体，改变重复测量次数，不改变尺的量程。<\/p><p><b>步骤：<\/b><\/p><ol><li>检查量程分度值，选可用刻线对齐起点。<\/li><li>刻度面贴近物体，视线垂直尺面读起点和终点。<\/li><li>相减得长度，重复测量按有效精度记录平均值。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：起点1.00 cm，终点4.26 cm，长度3.26 cm=0.0326 m。<\/p><p><b>结论与条件：<\/b>长度为两刻度差而非终点单个数。<\/p><p><b>误差与边界：<\/b>视差、尺未平行和零端磨损可形成系统偏差；平均不能消除这些错误。<\/p><\/details>","基础","初中"],["jexp-02","用表测量时间","时间测量要预先约定起止事件，通过终止读数减起始读数得到时间间隔；人工按表有反应误差，数字显示精度也不代表所有过程误差为零。",[["起止读数之差","<mrow><mi>t<\/mi><mo>=<\/mo><mrow><msub><mi>t<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>t<\/mi><mn>1<\/mn><\/msub><\/mrow><\/mrow>","同一计时器未清零、未回绕，t<sub>1<\/sub>与t<sub>2<\/sub>对应同一过程起止时刻，统一用秒。"]],[["t","第一次测量时间间隔","s"],["t<sub>1<\/sub>","开始读数","s"],["t<sub>2<\/sub>","结束读数","s"],["T","独立电子计时结果","s"]],[["停表没有归零时直接把终止读数当历时。","计时测的是两事件之间的间隔，不是表盘上的绝对读数；起点3 s、终点8 s对应5 s，不能写8 s。零点偏移可由相减消去，按表延迟不能。"],["认为电子表没有测量误差，或把一次往返的两个半程各算一周期。","电子显示仍有分辨率与触发延迟，计时判据必须一致；周期必须对应状态一次完整重复。两类问题要观察记录与实验设计，不能仅靠时间差验算证明。"]],"检查停表或电子计时器的量程、分度或显示分辨率，开始前复位并练习启动停止。以重复的同一运动过程为对象，多次计时比较散布；测周期运动可累计多个完整周期再除次数，但不能随意把往返半周期计为一周期。附带计算只核对时间间隔，反应延迟和起止判据要从操作记录审查。",["先明确对象、方向和测量条件，再选择记录量与单位。","依据本卡正文所列方法处理原始读数，不能在未满足条件时套用关系。","用独立复测或另一条物理关系核对结果；数值核对只覆盖该计算，不替代概念和操作审查。"],["停表从3.00 s开始，8.00 s停止，电子计时独立测得5.00 s；求间隔并说明误差来源。",["取结束减开始，8.00-3.00=5.00 s。","与电子计时比较，但仍检查人的启动、停止反应延迟。"],"时间间隔为5.00 s，反应误差仍需审查。"],["tool-07"],["motion-01"],["用表测量时间","条件与边界","实验与证据"],19,"<section class=\"field learning\"><h4>用表测量时间：方法与边界<\/h4><p>检查停表或电子计时器的量程、分度或显示分辨率，开始前复位并练习启动停止。以重复的同一运动过程为对象，多次计时比较散布；测周期运动可累计多个完整周期再除次数，但不能随意把往返半周期计为一周期。附带计算只核对时间间隔，反应延迟和起止判据要从操作记录审查。<\/p><\/section><details class=\"learning\"><summary>实验：用表测量时间<\/summary><p><b>目的：<\/b>建立起止事件一致的时间间隔。<\/p><p><b>装置与接法：<\/b>数字秒表或机械秒表、可重复事件。<\/p><p><b>控制、改变与观察：<\/b>相同事件，用同一起止约定，观察仪表示数。<\/p><p><b>步骤：<\/b><\/p><ol><li>辨显示分辨率，约定开始和结束事件。<\/li><li>先练习启停，再重复计时。<\/li><li>记录秒数，比较差异，说明人工反应时间。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：3次为2.10、2.08、2.12 s，平均2.10 s；1 min 5 s为65 s。<\/p><p><b>结论与条件：<\/b>时间间隔依赖起止事件，单位换算不能把分钟当秒。<\/p><p><b>误差与边界：<\/b>人为启停反应对短过程占比大，重复可减少部分偶然影响，不可假称完全消除。<\/p><\/details>","基础","初中"],["jexp-03","测量物体运动的速度","测斜面小车某段平均速度。",[["由路程和时间求速度","<mrow><mi>v<\/mi><mo>=<\/mo><mfrac><mi>s<\/mi><mi>t<\/mi><\/mfrac><\/mrow>","路程和时间来自同一运动区间，s 用 m、t 用 s。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"],["米每秒换算为千米每小时","<mrow><msub><mi>v<\/mi><mi>k<\/mi><\/msub><mo>=<\/mo><mrow><mn>3.6<\/mn>&#x2062;<mi>v<\/mi><\/mrow><\/mrow>","原速度用 m/s 表示，换算后的速度用 km/h 表示。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"]],[["s","物体在计时区间内通过的路程","m"],["t","通过路程 s 所用时间","s"],["v","以米每秒表示的速度","m/s"],["v<sub>k<\/sub>","同一速度以千米每小时表示","km/h"]],[["换算 m/s 与 km/h 时忘记乘 3.6，或把乘除方向写反。","1 m/s=3.6 km/h；5 m/s 应为 18 km/h，而不是约 1.4 km/h。"],["把速度写成路程乘时间。","速度是单位时间内通过的路程，需用路程除以时间；相乘的单位也不再是 m/s。"]],"同时测量同一段运动的路程和所用时间，以路程除时间求平均速度。使用缓坡增大计时可操作性，释放小车时不额外推它，并预先标明起点终点；末位置、停止计时的判据必须对应。若测全程和分段，不能把不同区间的平均速度直接算术平均当全程结果。",["量起点到终点的实际路程，标记两点。","静止释放同时计时，到达终点停止计时。","重复测量，分别用各段路程除各段时间，不将全程时间用于半段。"],["低压小车实验测得沿直线路程0.8 m，用时2.0 s；怎样选起止位置并求这段平均速率？",["起止位置与计时点配对，重复测量但不能随意删掉偏大或偏小值。","平均速率0.8/2.0=0.4 m/s；匀速与否还需分段测量。"],"该段平均速率0.4 m/s。"],["tool-01","jexp-02"],["motion-02"],["测量物体运动的速度","实验方法","控制变量","数据与误差"],19,"<section class=\"field learning\"><h4>测量物体运动的速度：实验设计<\/h4><p>同时测量同一段运动的路程和所用时间，以路程除时间求平均速度。使用缓坡增大计时可操作性，释放小车时不额外推它，并预先标明起点终点；末位置、停止计时的判据必须对应。若测全程和分段，不能把不同区间的平均速度直接算术平均当全程结果。<\/p><\/section><details class=\"learning\"><summary>实验：测量物体运动的速度<\/summary><p><b>目的：<\/b>测斜面小车某段平均速度。<\/p><p><b>装置与接法：<\/b>缓斜面、小车、刻度尺、计时器、终点挡板。<\/p><p><b>控制、改变与观察：<\/b>明确同一段起终位置，同一释放条件，观察通过该段时间。<\/p><p><b>步骤：<\/b><\/p><ol><li>量起点到终点的实际路程，标记两点。<\/li><li>静止释放同时计时，到达终点停止计时。<\/li><li>重复测量，分别用各段路程除各段时间，不将全程时间用于半段。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：0.80 m用时2.0 s，平均0.40 m/s；下半段0.40 m用时0.8 s，平均0.50 m/s。<\/p><p><b>结论与条件：<\/b>加速过程不同区段平均速度可不同，不能当处处匀速。<\/p><p><b>误差与边界：<\/b>斜面过陡会放大启停误差，挡板位置、车长和起点约定影响路程。<\/p><\/details>","基础","初中"],["jexp-04","用天平测量固体和液体的质量","测固体或带容器液体的质量。",[["砝码加游码","<mrow><mi>m<\/mi><mo>=<\/mo><mrow><mi mathvariant=\"normal\">mc<\/mi><mo>+<\/mo><mi mathvariant=\"normal\">my<\/mi><\/mrow><\/mrow>"," 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"],["液体密度差量法","<mrow><mi>ρ<\/mi><mo>=<\/mo><mfrac><mrow><msub><mi>m<\/mi><mn>1<\/mn><\/msub><mo>−<\/mo><msub><mi>m<\/mi><mn>2<\/mn><\/msub><\/mrow><mi>V<\/mi><\/mfrac><\/mrow>","倒出前后质量之差与量筒中这一份液体的体积配对。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"]],[["m","游码与砝码合计质量","kg"],["m1","杯和液体倒出前质量","kg"],["m2","倒出后杯和剩液质量","kg"],["V","倒入量筒的液体体积","m³"],["ρ","液体密度","kg/m³"],["mc","砝码质量","kg"],["my","游码示值","kg"]],[["天平读数只计砝码，漏掉游码质量。","游码在标尺上移动也提供平衡作用，示值必须与砝码相加；80 g砝码与4 g游码合为84 g，不是80 g。称量时重新调螺母不能弥补漏读。"],["称量时移动平衡螺母，或先排水后称带水固体。","调平衡只用于称量前的空载校零，称量中移动会改变仪器条件；固体附着水增加被称质量，所得密度可能偏大。必须区分误差来源与配对样本。"]],"测固体质量直接空载调平后左物右码；液体必须置于合适容器，先量空容器与容器加液体的质量，取差才是液体质量。游码归零后调平衡螺母，称量中保持平衡螺母不动，砝码用镊子取放。不要把杯子质量漏减，也不要将游码与砝码交换造成的系统性错误称为偶然误差。",["天平放平、游码归零、调平衡螺母。","左物右码，用镊子先大后小加减砝码，移动游码使平衡。","读砝码总质量加游码左缘读数，写单位并归整器材。"],["天平砝码80 g、游码4 g；盛液体的杯总质量84 g、空杯44 g。求总质量与液体质量，并说明称量中能否再调螺母。",["总质量80+4=84 g，液体84-44=40 g。","游码归零后的空载调平衡在称量前完成，称量中不得再调平衡螺母。"],"总质量84 g、液体40 g，称量中不调平衡螺母。"],["tool-05"],["prop-01"],["用天平测量固体和液体的质量","实验方法","控制变量","数据与误差"],19,"<section class=\"field learning\"><h4>用天平测量固体和液体的质量：实验设计<\/h4><p>测固体质量直接空载调平后左物右码；液体必须置于合适容器，先量空容器与容器加液体的质量，取差才是液体质量。游码归零后调平衡螺母，称量中保持平衡螺母不动，砝码用镊子取放。不要把杯子质量漏减，也不要将游码与砝码交换造成的系统性错误称为偶然误差。<\/p><\/section><section class=\"field learning\"><h4>两类对象<\/h4><p>固体先保持干燥再直接称量；液体先称空杯，再称杯加液体，相减得到液体质量。若采用倒出差量法，所求是被倒出的那一份质量，不能混淆总液体和倒出部分。<\/p><\/section><details class=\"learning\"><summary>实验：用托盘天平测量物体质量<\/summary><p><b>目的：<\/b>测固体或带容器液体的质量。<\/p><p><b>装置与接法：<\/b>托盘天平、砝码、镊子、干燥物体或烧杯。<\/p><p><b>控制、改变与观察：<\/b>测前游码归零、空载调平；称量中只改砝码和游码。<\/p><p><b>步骤：<\/b><\/p><ol><li>天平放平、游码归零、调平衡螺母。<\/li><li>左物右码，用镊子先大后小加减砝码，移动游码使平衡。<\/li><li>读砝码总质量加游码左缘读数，写单位并归整器材。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：50 g砝码加游码2.4 g，质量52.4 g=0.0524 kg。<\/p><p><b>结论与条件：<\/b>质量由砝码与游码合计得到，不受普通位置和形状变化影响。<\/p><p><b>误差与边界：<\/b>物码颠倒时不能照常相加；游码未归零、超量程、手拿砝码或样品滴漏造成误差。<\/p><\/details>","基础","初中"],["jexp-05","测量固体和液体的密度","用倒出液体质量与量筒体积测密度，减少残留误差。",[["砝码加游码","<mrow><mi>m<\/mi><mo>=<\/mo><mrow><mi mathvariant=\"normal\">mc<\/mi><mo>+<\/mo><mi mathvariant=\"normal\">my<\/mi><\/mrow><\/mrow>"," 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"],["液体密度差量法","<mrow><mi>ρ<\/mi><mo>=<\/mo><mfrac><mrow><msub><mi>m<\/mi><mn>1<\/mn><\/msub><mo>−<\/mo><msub><mi>m<\/mi><mn>2<\/mn><\/msub><\/mrow><mi>V<\/mi><\/mfrac><\/mrow>","倒出前后质量之差与量筒中这一份液体的体积配对。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"]],[["m","游码与砝码合计质量","kg"],["m1","杯和液体倒出前质量","kg"],["m2","倒出后杯和剩液质量","kg"],["V","倒入量筒的液体体积","m³"],["ρ","液体密度","kg/m³"],["mc","砝码质量","kg"],["my","游码示值","kg"]],[["天平读数只计砝码，漏掉游码质量。","游码在标尺上移动也提供平衡作用，示值必须与砝码相加；80 g砝码与4 g游码合为84 g，不是80 g。称量时重新调螺母不能弥补漏读。"],["称量时移动平衡螺母，或先排水后称带水固体。","调平衡只用于称量前的空载校零，称量中移动会改变仪器条件；固体附着水增加被称质量，所得密度可能偏大。必须区分误差来源与配对样本。"]],"密度实验必须让质量与体积对应同一份物质。固体先称干燥质量再测排开水体积；液体采用倒出前后杯与液体的质量差，与量筒中倒出部分体积配对。保持天平和量筒正确调零读数，不溶不吸水固体才可直接排水，完全浸没并排除气泡；液体不能把杯壁残留质量算入量筒部分。\n学习分工：本卡练同一份物质的质量体积配对和误差判断；天平操作见工具卡（tool-05），可点击下方知识关系回看。这一链接是相关内容推荐，不表示必须先后学习。",["称烧杯加液体总质量。","倒一部分进量筒，读凹液面最低处体积。","再称烧杯加剩余液体质量，两次质量之差除以量筒体积。"],["测不溶、不吸水固体密度。干燥时称得54 g，量筒水面由20 mL升到40 mL；物体完全浸没。若表面残留气泡，所得密度通常偏大还是偏小？",["按先称干燥质量、后排水测体积的顺序，体积为40-20=20 cm³。","密度54/20=2.7 g/cm³=2700 kg/m³。","残留气泡额外排水，使记录体积偏大，质量不变时密度偏小；需排除气泡后复测。"],"密度2700 kg/m³；残留气泡会使结果偏小。"],["tool-05","tool-06"],["prop-02","tool-05"],["测量固体和液体的密度","实验方法","控制变量","数据与误差"],19,"<section class=\"field learning\"><h4>测量固体和液体的密度：实验设计<\/h4><p>密度实验必须让质量与体积对应同一份物质。固体先称干燥质量再测排开水体积；液体采用倒出前后杯与液体的质量差，与量筒中倒出部分体积配对。保持天平和量筒正确调零读数，不溶不吸水固体才可直接排水，完全浸没并排除气泡；液体不能把杯壁残留质量算入量筒部分。<\/p><\/section><details class=\"learning\"><summary>实验：测量固体密度<\/summary><p><b>目的：<\/b>用质量和排开液体体积求不规则固体密度。<\/p><p><b>装置与接法：<\/b>天平、量筒、水、细线、不溶不吸水且能下沉的样品。<\/p><p><b>控制、改变与观察：<\/b>同一干燥样品，测质量和前后体积，排除气泡。<\/p><p><b>步骤：<\/b><\/p><ol><li>先用调平天平测干燥样品质量。<\/li><li>量筒放水平，视线与凹液面最低处齐平，读初始体积。<\/li><li>细线放入样品使完全浸没且无气泡，读最终体积，做差再除质量。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：质量54 g，体积由40 mL到60 mL，样品20 cm³，密度2.7 g/cm³=2700 kg/m³。<\/p><p><b>结论与条件：<\/b>排水差是固体体积，质量除以体积为密度。<\/p><p><b>误差与边界：<\/b>先浸水再称会因附着水使质量偏大；气泡使体积偏大、密度偏小；吸水和溶解样品不直接适用。<\/p><\/details><details class=\"learning\"><summary>实验：测量液体密度<\/summary><p><b>目的：<\/b>用倒出液体质量与量筒体积测密度，减少残留误差。<\/p><p><b>装置与接法：<\/b>天平、烧杯、量筒、待测液体。<\/p><p><b>控制、改变与观察：<\/b>同一样品，质量差对应倒入量筒的体积。<\/p><p><b>步骤：<\/b><\/p><ol><li>称烧杯加液体总质量。<\/li><li>倒一部分进量筒，读凹液面最低处体积。<\/li><li>再称烧杯加剩余液体质量，两次质量之差除以量筒体积。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：初次80 g、剩余40 g，量筒50 mL，倒出40 g，密度0.8 g/cm³=800 kg/m³。<\/p><p><b>结论与条件：<\/b>相减后质量与实际倒出液体一一对应。<\/p><p><b>误差与边界：<\/b>若先称空杯再称全部液体，随后倒量筒且忽略杯壁残留，体积偏小而密度偏大；洒出液体也会破坏对应关系。<\/p><\/details>","基础","初中"],["jexp-06","探究水沸腾前后温度变化的特点","物态变化实验需要同时记录状态和温度，平台表示这一观察时段温度近似不变，不表示没有吸热或放热。",[["两次温度读数差","<mrow><mi mathvariant=\"normal\">dT<\/mi><mo>=<\/mo><mrow><msub><mi>T<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>T<\/mi><mn>1<\/mn><\/msub><\/mrow><\/mrow>","T<sub>1<\/sub>、T<sub>2<\/sub>对应同一样品两个时刻的温度，温差取末态减初态；相变平台上温差可为零，不能据此断言不吸放热。"],["另一温度计温差","<mrow><mi>D<\/mi><mo>=<\/mo><mrow><msub><mi>x<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>x<\/mi><mn>1<\/mn><\/msub><\/mrow><\/mrow>","独立第二支温度计记录相同两个时刻，x<sub>1<\/sub>、x<sub>2<\/sub>使用同一温度单位；这里只核对温差，不验证相变操作。"]],[["dT","第一支温度计测得温差","K"],["T<sub>1<\/sub>","第一支初始温度","K"],["T<sub>2<\/sub>","第一支终止温度","K"],["D","独立第二支温度计测得温差","K"],["x<sub>1<\/sub>","第二支初始温度","K"],["x<sub>2<\/sub>","第二支终止温度","K"]],[["把两个温度读数相加当温度变化。","温差是终值减初值，与温度所用单位的零点无关；把两次热力学温度相加会得数百开尔文，并不能代表该过程的温度变化。"],["温度出现平台就认为没有吸热或放热，或把平台温度当任何条件下的定值。","保持气压近似稳定，温度计测液体内部而不碰杯底；观察气泡和温度，平台仍持续加热，不能由温度不变推出不吸热。示例平台98 ℃，不能声称所有气压下沸点100 ℃。温度与热量是不同量，气压、纯度、测量位置和过程平衡程度都影响读数，定性结论必须看现象和条件。"]],"保持气压近似稳定，温度计测液体内部而不碰杯底；观察气泡和温度，平台仍持续加热，不能由温度不变推出不吸热。示例平台98 ℃，不能声称所有气压下沸点100 ℃。均匀取样记录时间和温度，结合物态确定平台含义。下列公式只检查记录的温差；热量方向、是否沸腾或发生相变仍要用实验条件与现象审核，不能由一次数值相等替代观察。",["先明确对象、方向和测量条件，再选择记录量与单位。","依据本卡正文所列方法处理原始读数，不能在未满足条件时套用关系。","用独立复测或另一条物理关系核对结果；数值核对只覆盖该计算，不替代概念和操作审查。"],["设计数据（非实际实验记录）：同一气压下持续加热的水，沸腾前由90 ℃升到98 ℃，沸腾平台保持98 ℃。求两段温差并解释平台。",["斜段温差为8 ℃，平台温差为0 ℃。","同一气压、持续加热的水沸腾阶段，持续吸热、温度近似不变；98 ℃是该实验气压与误差下的读数，不是所有条件下的沸点。"],"两段温差分别8 ℃和0 ℃，平台不表示无热量传递。 持续吸热、温度近似不变；98 ℃是该实验气压与误差下的读数，不是所有条件下的沸点。"],["state-02"],["energy-02"],["探究水沸腾前后温度变化的特点","条件与边界","实验与证据"],19,"<section class=\"field learning\"><h4>探究水沸腾前后温度变化的特点：方法与边界<\/h4><p>保持气压近似稳定，温度计测液体内部而不碰杯底；观察气泡和温度，平台仍持续加热，不能由温度不变推出不吸热。示例平台98 ℃，不能声称所有气压下沸点100 ℃。均匀取样记录时间和温度，结合物态确定平台含义。下列公式只检查记录的温差；热量方向、是否沸腾或发生相变仍要用实验条件与现象审核，不能由一次数值相等替代观察。<\/p><\/section><details class=\"learning\"><summary>实验：探究水沸腾前后温度变化的特点<\/summary><p><b>目的：<\/b>同步记录时间、温度和物态，区分温度变化与吸放热过程。<\/p><p><b>装置与接法：<\/b>温度计、容器、安全加热或冷却装置、秒表；热源由教师指导操作。<\/p><p><b>控制、改变与观察：<\/b>比较同一材料不同时段，保持气压和测温位置，不把加热时间当温度。<\/p><p><b>步骤：<\/b><\/p><ol><li>先确认装置安全与温度计量程，记录初态。<\/li><li>等时间间隔读温度，同时记物态和气泡或固液比例。<\/li><li>画温度—时间图，比较斜段与平台并说明适用条件。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：沸腾前温差8 K；沸腾平台温差0 K，温差的K数值与℃相同。<\/p><p><b>结论与条件：<\/b>保持气压近似稳定，温度计测液体内部而不碰杯底；观察气泡和温度，平台仍持续加热，不能由温度不变推出不吸热。示例平台98 ℃，不能声称所有气压下沸点100 ℃。<\/p><p><b>误差与边界：<\/b>防烫或冷伤，温度计不碰壁底；数据只作设计示例，局部测温、读数延迟和过冷等不能忽略。<\/p><\/details>","基础","初中"],["jexp-07","探究晶体熔化前后温度变化的特点","物态变化实验需要同时记录状态和温度，平台表示这一观察时段温度近似不变，不表示没有吸热或放热。",[["两次温度读数差","<mrow><mi mathvariant=\"normal\">dT<\/mi><mo>=<\/mo><mrow><msub><mi>T<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>T<\/mi><mn>1<\/mn><\/msub><\/mrow><\/mrow>","T<sub>1<\/sub>、T<sub>2<\/sub>对应同一样品两个时刻的温度，温差取末态减初态；相变平台上温差可为零，不能据此断言不吸放热。"],["另一温度计温差","<mrow><mi>D<\/mi><mo>=<\/mo><mrow><msub><mi>x<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>x<\/mi><mn>1<\/mn><\/msub><\/mrow><\/mrow>","独立第二支温度计记录相同两个时刻，x<sub>1<\/sub>、x<sub>2<\/sub>使用同一温度单位；这里只核对温差，不验证相变操作。"]],[["dT","第一支温度计测得温差","K"],["T<sub>1<\/sub>","第一支初始温度","K"],["T<sub>2<\/sub>","第一支终止温度","K"],["D","独立第二支温度计测得温差","K"],["x<sub>1<\/sub>","第二支初始温度","K"],["x<sub>2<\/sub>","第二支终止温度","K"]],[["把两个温度读数相加当温度变化。","温差是终值减初值，与温度所用单位的零点无关；把两次热力学温度相加会得数百开尔文，并不能代表该过程的温度变化。"],["温度出现平台就认为没有吸热或放热，或把平台温度当任何条件下的定值。","选冰等安全晶体并缓慢加热，保证测温接触合适；观察固液共存段。相同压强和近似纯物质下熔化平台伴随吸热，非晶体通常没有固定熔点，不能用一次平台概括所有材料。温度与热量是不同量，气压、纯度、测量位置和过程平衡程度都影响读数，定性结论必须看现象和条件。"]],"选冰等安全晶体并缓慢加热，保证测温接触合适；观察固液共存段。相同压强和近似纯物质下熔化平台伴随吸热，非晶体通常没有固定熔点，不能用一次平台概括所有材料。均匀取样记录时间和温度，结合物态确定平台含义。下列公式只检查记录的温差；热量方向、是否沸腾或发生相变仍要用实验条件与现象审核，不能由一次数值相等替代观察。",["先明确对象、方向和测量条件，再选择记录量与单位。","依据本卡正文所列方法处理原始读数，不能在未满足条件时套用关系。","用独立复测或另一条物理关系核对结果；数值核对只覆盖该计算，不替代概念和操作审查。"],["设计数据（非实际实验记录）：约标准大气压下加热纯冰，升温段由−5 ℃到0 ℃，固液共存的熔化平台保持0 ℃。求两段温差并解释平台。",["斜段温差为5 ℃，平台温差为0 ℃。","纯冰在约标准大气压下熔化、固液共存阶段，继续吸热、温度近似0 ℃；不是所有固体都有这种恒温熔化平台。"],"两段温差分别5 ℃和0 ℃，平台不表示无热量传递。 继续吸热、温度近似0 ℃；不是所有固体都有这种恒温熔化平台。"],["state-03"],["energy-02"],["探究晶体熔化前后温度变化的特点","条件与边界","实验与证据"],19,"<section class=\"field learning\"><h4>探究晶体熔化前后温度变化的特点：方法与边界<\/h4><p>选冰等安全晶体并缓慢加热，保证测温接触合适；观察固液共存段。相同压强和近似纯物质下熔化平台伴随吸热，非晶体通常没有固定熔点，不能用一次平台概括所有材料。均匀取样记录时间和温度，结合物态确定平台含义。下列公式只检查记录的温差；热量方向、是否沸腾或发生相变仍要用实验条件与现象审核，不能由一次数值相等替代观察。<\/p><\/section><details class=\"learning\"><summary>实验：探究晶体熔化前后温度变化的特点<\/summary><p><b>目的：<\/b>同步记录时间、温度和物态，区分温度变化与吸放热过程。<\/p><p><b>装置与接法：<\/b>温度计、容器、安全加热或冷却装置、秒表；热源由教师指导操作。<\/p><p><b>控制、改变与观察：<\/b>比较同一材料不同时段，保持气压和测温位置，不把加热时间当温度。<\/p><p><b>步骤：<\/b><\/p><ol><li>先确认装置安全与温度计量程，记录初态。<\/li><li>等时间间隔读温度，同时记物态和气泡或固液比例。<\/li><li>画温度—时间图，比较斜段与平台并说明适用条件。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：升温段温差5 K；熔化平台温差0 K，温差的K数值与℃相同。<\/p><p><b>结论与条件：<\/b>选冰等安全晶体并缓慢加热，保证测温接触合适；观察固液共存段。相同压强和近似纯物质下熔化平台伴随吸热，非晶体通常没有固定熔点，不能用一次平台概括所有材料。<\/p><p><b>误差与边界：<\/b>防烫或冷伤，温度计不碰壁底；数据只作设计示例，局部测温、读数延迟和过冷等不能忽略。<\/p><\/details>","基础","初中"],["jexp-08","探究水凝固的特点","物态变化实验需要同时记录状态和温度，平台表示这一观察时段温度近似不变，不表示没有吸热或放热。",[["两次温度读数差","<mrow><mi mathvariant=\"normal\">dT<\/mi><mo>=<\/mo><mrow><msub><mi>T<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>T<\/mi><mn>1<\/mn><\/msub><\/mrow><\/mrow>","T<sub>1<\/sub>、T<sub>2<\/sub>对应同一样品两个时刻的温度，温差取末态减初态；相变平台上温差可为零，不能据此断言不吸放热。"],["另一温度计温差","<mrow><mi>D<\/mi><mo>=<\/mo><mrow><msub><mi>x<\/mi><mn>2<\/mn><\/msub><mo>−<\/mo><msub><mi>x<\/mi><mn>1<\/mn><\/msub><\/mrow><\/mrow>","独立第二支温度计记录相同两个时刻，x<sub>1<\/sub>、x<sub>2<\/sub>使用同一温度单位；这里只核对温差，不验证相变操作。"]],[["dT","第一支温度计测得温差","K"],["T<sub>1<\/sub>","第一支初始温度","K"],["T<sub>2<\/sub>","第一支终止温度","K"],["D","独立第二支温度计测得温差","K"],["x<sub>1<\/sub>","第二支初始温度","K"],["x<sub>2<\/sub>","第二支终止温度","K"]],[["把两个温度读数相加当温度变化。","温差是终值减初值，与温度所用单位的零点无关；把两次热力学温度相加会得数百开尔文，并不能代表该过程的温度变化。"],["温度出现平台就认为没有吸热或放热，或把平台温度当任何条件下的定值。","将少量水置于冷却浴并记录状态，测温不碰容器壁；在近似平衡、固定气压下水的凝固段约0 ℃并放热。过冷可能使初始读数低于0 ℃，需要结合状态和重复观察解释，不能伪造平直数据。温度与热量是不同量，气压、纯度、测量位置和过程平衡程度都影响读数，定性结论必须看现象和条件。"]],"将少量水置于冷却浴并记录状态，测温不碰容器壁；在近似平衡、固定气压下水的凝固段约0 ℃并放热。过冷可能使初始读数低于0 ℃，需要结合状态和重复观察解释，不能伪造平直数据。均匀取样记录时间和温度，结合物态确定平台含义。下列公式只检查记录的温差；热量方向、是否沸腾或发生相变仍要用实验条件与现象审核，不能由一次数值相等替代观察。",["先明确对象、方向和测量条件，再选择记录量与单位。","依据本卡正文所列方法处理原始读数，不能在未满足条件时套用关系。","用独立复测或另一条物理关系核对结果；数值核对只覆盖该计算，不替代概念和操作审查。"],["设计数据（非实际实验记录）：约标准大气压下纯水冷却，降温段由5 ℃到0 ℃，固液共存的凝固平台保持0 ℃。求两段温差并解释平台。",["斜段温差为-5 ℃，平台温差为0 ℃。","约标准大气压下纯水凝固、固液共存阶段，继续放热、温度近似0 ℃；过冷与测温误差可能影响实际曲线。"],"两段温差分别-5 ℃和0 ℃，平台不表示无热量传递。 继续放热、温度近似0 ℃；过冷与测温误差可能影响实际曲线。"],["state-03"],["energy-02"],["探究水凝固的特点","条件与边界","实验与证据"],19,"<section class=\"field learning\"><h4>探究水凝固的特点：方法与边界<\/h4><p>将少量水置于冷却浴并记录状态，测温不碰容器壁；在近似平衡、固定气压下水的凝固段约0 ℃并放热。过冷可能使初始读数低于0 ℃，需要结合状态和重复观察解释，不能伪造平直数据。均匀取样记录时间和温度，结合物态确定平台含义。下列公式只检查记录的温差；热量方向、是否沸腾或发生相变仍要用实验条件与现象审核，不能由一次数值相等替代观察。<\/p><\/section><details class=\"learning\"><summary>实验：探究水凝固的特点<\/summary><p><b>目的：<\/b>同步记录时间、温度和物态，区分温度变化与吸放热过程。<\/p><p><b>装置与接法：<\/b>温度计、容器、安全加热或冷却装置、秒表；热源由教师指导操作。<\/p><p><b>控制、改变与观察：<\/b>比较同一材料不同时段，保持气压和测温位置，不把加热时间当温度。<\/p><p><b>步骤：<\/b><\/p><ol><li>先确认装置安全与温度计量程，记录初态。<\/li><li>等时间间隔读温度，同时记物态和气泡或固液比例。<\/li><li>画温度—时间图，比较斜段与平台并说明适用条件。<\/li><\/ol><p><b>数据与处理：<\/b>设计示例（非实测）：降温段温差-5 K；凝固平台温差0 K，温差的K数值与℃相同。<\/p><p><b>结论与条件：<\/b>将少量水置于冷却浴并记录状态，测温不碰容器壁；在近似平衡、固定气压下水的凝固段约0 ℃并放热。过冷可能使初始读数低于0 ℃，需要结合状态和重复观察解释，不能伪造平直数据。<\/p><p><b>误差与边界：<\/b>防烫或冷伤，温度计不碰壁底；数据只作设计示例，局部测温、读数延迟和过冷等不能忽略。<\/p><\/details>","基础","初中"],["jexp-09","用电流表测电流","正确接线、选量程与读数。",[["由电荷量和时间求电流","<mrow><msub><mi>I<\/mi><mi mathvariant=\"normal\">平均<\/mi><\/msub><mo>=<\/mo><mfrac><mi>Q<\/mi><mi>t<\/mi><\/mfrac><\/mrow>","Q 表示一段时间内通过导体横截面的电荷量，t 用秒，所得电流用安培。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"],["电流表量程和指针格数求电流","<mrow><msub><mi>I<\/mi><mi mathvariant=\"normal\">读数<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>I<\/mi><mi mathvariant=\"normal\">量程<\/mi><\/msub>&#x22C5;<mi>n<\/mi><\/mrow><mi>N<\/mi><\/mfrac><\/mrow>","指针式电流表按均匀刻度读取；所选量程记作 I量程，n 是偏转格数，N 是满量程格数。 本实验附带的计算核对不替代现象、操作和控制变量的人工审查。"]],[["I<sub>平均<\/sub>","单位时间内通过导体横截面的电荷量所对应的电流","A"],["Q","通过导体横截面的电荷量","C"],["t","电荷通过导体横截面的时间","s"],["I<sub>量程<\/sub>","电流表所选量程","A"],["I<sub>读数<\/sub>","电流表读数","A"],["n","指针偏转格数","1"],["N","满量程总格数","1"],["I<sub>1<\/sub>","串联电路第一处电流","A"],["I<sub>2<\/sub>","串联电路第二处电流","A"],["It","并联干路总电流","A"],["U<sub>1<\/sub>","第一元件两端电压","V"],["U<sub>2<\/sub>","第二元件两端电压","V"],["Ut","电路总电压","V"]],[["把指针占总格数的比例取倒数。","0.6 A量程30格，指针10格应0.2 A；比例倒置会给超过量程的1.8 A。"],["将电流表误并联到电源两端。","电流表内阻很小，直接并联会形成近似短路并损坏仪表或电源。接线前要看清仪表符号和它的接入位置。"],["读电流表时把指针格数当成电流数值，未按量程换算。","量程0.6 A、满量程30格、指针偏10格时应读0.20 A；直接把10格标成10 A不表示实际电流。必须先认量程，再算每格电流和偏转格数。"]],"电流表必须串入所测支路，正负接线柱与电流方向对应。先用大量程试触判断是否安全，再按读数选小量程提高分辨率；异常偏转立即断开，不把反向或超程读数当有效结果。电流表不能直接接电源两极。记录量程、每格电流与指针格数，并注明测量位置，不把电流大小等同电能消耗多少。\n学习分工：本卡练串联接表、选量程和排除异常；电流定义与单次读数见概念卡（circuit-01），可点击下方知识关系回看。这一链接是相关内容推荐，不表示必须先后学习。",["断开低压电路开关，把电流表串入被测支路，电流从正接线柱流入。","先选大量程短暂试触，若偏转反向、超程或异常立即断开；确认安全后按需要换小量程。","读量程与分度值，视线正对指针，改测其他位置前断开开关。"],["安全低压电路预计电流约0.4 A。电流表有0.6 A和3 A量程，均30格。说明接法和先试触的量程；确认后选0.6 A量程，指针18格，读数是多少？",["断开开关，将电流表串入被测支路，正接线柱朝电流流入端。","先用3 A量程短时试触，确认不超0.6 A后断开开关换小量程；异常偏转立即断开。","0.6×18/30=0.36 A，记录量程和测量支路。"],"串联接表，先3 A试触后换0.6 A；读数0.36 A。"],["circuit-03","tool-07"],["jexp-10","circuit-01"],["用电流表测电流","实验方法","控制变量","数据与误差"],19,"<section class=\"field learning\"><h4>用电流表测电流：实验设计<\/h4><p>电流表必须串入所测支路，正负接线柱与电流方向对应。先用大量程试触判断是否安全，再按读数选小量程提高分辨率；异常偏转立即断开，不把反向或超程读数当有效结果。电流表不能直接接电源两极。记录量程、每格电流与指针格数，并注明测量位置，不把电流大小等同电能消耗多少。<\/p><\/section><details class=\"learning\"><summary>实验：用电流表测量电流<\/summary><p><b>目的：<\/b>正确接线、选量程与读数。<\/p><p><b>装置与接法：<\/b>低压电源、开关、电阻、合适电流表和导线。<\/p><p><b>控制、改变与观察：<\/b>串入同一被测支路，观察量程和稳定示数。<\/p><p><b>步骤：<\/b><\/p><ol><li>断开低压电路开关，把电流表串入被测支路，电流从正接线柱流入。<\/li><li>先选大量程短暂试触，若偏转反向、超程或异常立即断开；确认安全后按需要换小量程。<\/li><li>读量程与分度值，视线正对指针，改测其他位
